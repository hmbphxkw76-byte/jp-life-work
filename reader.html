rong>：<\/p>\n<ul>\n<li>登记册 #1、#2：待基线确立；#3：待记录；#6 日语门槛分布：待复核。<\/li>\n<li>英语环境岗位分布（无公开统计）、WMS/TMS 实施岗口径、物流业 vs 全行业 IT 岗对比统一口径：待复核 / 待补。<\/li>\n<\/ul>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li>経済産業省（meti.go.jp）— IT 人材需給 https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf （2019）；IT 人材政策 https://www.meti.go.jp/policy/it_policy/jinzai/index.html （2026）<\/li>\n<li>IPA（ipa.go.jp）— DX 動向 2025 https://www.ipa.go.jp/digital/chousa/discussion-paper/dx2025_digital_talent_ai_era.html （2025-10）<\/li>\n<li>厚生労働省（mhlw.go.jp）— 令和 7 年外国人雇用実態調査 https://www.mhlw.go.jp/stf/newpage_75722.html （2026-08 公表）；賃金構造基本統計調査（ソフトウェア作成者平均约 578 万円，2024 调查）<\/li>\n<li>国税庁 — 民間給与実態統計調査（全国平均给与约 478 万円，令和 6 年分）<\/li>\n<li>レバテック（levtech.jp）— 职种别年收 https://freelance.levtech.jp/guide/detail/1217/ （2026-04 时点）<\/li>\n<li>doda（doda.jp）— 业种别平均年收 https://doda.jp/guide/heikin/gyousyu/index.html （2025）<\/li>\n<li>求人ボックス — 鸿池运输年收 https://xn--pckua2a7gp15o89zb.com/鴻池運輸株式会社の年収 （2025）；WMS/TMS 实施岗 https://xn--pckua2a7gp15o89zb.com/パッケージ導入コンサルタントの仕事 （2026，预期指标）<\/li>\n<li>JISA（jisa.or.jp）— 経産省 2026-04 资料 https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf （2026-04）<\/li>\n<li>国土交通省（mlit.go.jp）— 物流政策公开资料（2026 核对）<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本技术与数字化知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本技术与数字化知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11-12\n<strong>说明<\/strong>：本文档由原分散的多份章节文档合并整理而成，保留全部原内容与层级关系。后续更新请直接维护本单份文档。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">导航与使用约定<\/h3>\n<h3 id=\"06-industry-technology\">06-industry-technology 索引<\/h3>\n<p>技术与数字化区。覆盖阶段 4：技能地图、岗位路径。<\/p>\n<h4 id=\"_14\">文件一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>物流数字化技能地图<\/td>\n<td>三层技能（现场系统→数据整理→分析工具）、TMS/WMS 概念、证明方式<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>数字化岗位与转型路径<\/td>\n<td>公司内转岗/跳槽/SaaS 厂商三条路、JD 检索词、评估节点<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>日本数字化劳动市场与岗位行情<\/td>\n<td>IT 人才供需、薪资带、外语门槛、物流业外泛用岗位与转职行情<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_15\">关联目录<\/h4>\n<ul>\n<li>自动化岗位画像 → ../../05-industry-autonomous<\/li>\n<li>资格与讲习 → ../../10-education-qualification<\/li>\n<li>管理岗主线 → ../../03-career-management<\/li>\n<\/ul>\n<h4 id=\"_16\">使用约定<\/h4>\n<ul>\n<li>技能学习以 01-物流数字化技能地图 的层次推进；每年 1 月自检一层。<\/li>\n<\/ul>\n<h4 id=\"_17\">更新日志<\/h4>\n<h5 id=\"2026-11-12-03\">2026-11-12（维度扩充：新增 03 章）<\/h5>\n<p>变更摘要：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">位置<\/th>\n<th style=\"width:25%\">变更点<\/th>\n<th style=\"width:25%\">依据<\/th>\n<th style=\"width:25%\">性质<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>03<\/td>\n<td>新增「日本数字化劳动市场与岗位行情」：供需全景／薪资带／外语门槛与外国人就业／物流业外泛用岗位／Y5–Y8 对接要点<\/td>\n<td>経産省「IT人材需給に関する調査」概要版（2019）、IPA「DX動向2025」（2025）、厚労省「令和7年外国人雇用実態調査」（2026-08 公表）、doda 業種別年収（2025）、レバテック職種別年収（2026-04 时点）等，详见 03 章内来源<\/td>\n<td>新增<\/td>\n<\/tr>\n<tr>\n<td>索引<\/td>\n<td>文件一览表补 03 行<\/td>\n<td>—<\/td>\n<td>修订<\/td>\n<\/tr>\n<tr>\n<td>prompt<\/td>\n<td>手册章节要点／事件触发器表／关键信息追踪表（3→6 项）／来源域名同步扩充<\/td>\n<td>—<\/td>\n<td>修订<\/td>\n<\/tr>\n<tr>\n<td>registry<\/td>\n<td>登记册新增追踪条目 #4–#6（IT 人才缺口数、岗位薪资带、外国人 IT 就业与日语门槛分布），初值待复核<\/td>\n<td>—<\/td>\n<td>新增<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>待复核：<\/p>\n<ol>\n<li>英语环境岗位分布无公开统计（本节以推断标注），待求人平台专题抽样。<\/li>\n<li>WMS/TMS 实施岗 380 万–800 万为求人门户事例带（预期指标），非官方统计，待复核实绩口径。<\/li>\n<li>物流业 vs 全行业 IT 岗对比暂为分口径并列（企业公开值 vs 转职登录者统计），统一口径数据待补。<\/li>\n<\/ol>\n<blockquote>\n<p>2026-11-12 复核已闭环：2030 年 IT 人才缺口取経産省「IT人材需給に関する調査」報告書原文（2019-03）表 3-5——低位 16.4 万／中位 44.9 万／高位 78.7 万人。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"01\">01 物流数字化技能地图<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。对应阶段 4：系统操作、数据分析、流程优化。原则：<strong>学公司正在用的，再学通用的<\/strong>。技能与岗位信息以国土交通省物流政策公开资料为参照 [Source: https://www.mlit.go.jp/, 2026]。<\/p>\n<\/blockquote>\n<h4 id=\"_18\">一、技能分层（由近及远）<\/h4>\n<h5 id=\"1-y12\">第 1 层：现场系统操作（Y1–2 内）<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">学法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>伝票/受发注系统<\/td>\n<td>入职培训认真做，手册自己重写一份<\/td>\n<\/tr>\n<tr>\n<td>ドラレコ/运行管理后台<\/td>\n<td>数据能导出、能看懂指标<\/td>\n<\/tr>\n<tr>\n<td>ハンディ端末（仓库）<\/td>\n<td>全功能掌握，当\"会教别人的人\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h5 id=\"2-y24\">第 2 层：数据整理（Y2–4）<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Excel 函数<\/td>\n<td>VLOOKUP/XLOOKUP、IF、SUMIFS、TEXT 函数<\/td>\n<\/tr>\n<tr>\n<td>Excel 透视表<\/td>\n<td>10 分钟内从导出数据做出月报图<\/td>\n<\/tr>\n<tr>\n<td>基础统计<\/td>\n<td>均值/分布/趋势——看懂 KPI 异动<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h5 id=\"3-y4-dx\">第 3 层：分析与工具（Y4+，转 DX 岗前）<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">工具<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>BI 看板<\/td>\n<td>Power BI / Looker Studio（免费）任选一<\/td>\n<\/tr>\n<tr>\n<td>SQL 基础<\/td>\n<td>SELECT/GROUP BY——能自己拉数<\/td>\n<\/tr>\n<tr>\n<td>轻量编程<\/td>\n<td>Python（pandas 处理 CSV）——可选，非必需<\/td>\n<\/tr>\n<tr>\n<td>流程优化<\/td>\n<td>PDCA、BPMN 流程图、改善提案书写法<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_19\">二、物流系统知识（概念层）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">系统<\/th>\n<th style=\"width:33%\">管什么<\/th>\n<th style=\"width:34%\">个人关联<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TMS<\/strong><\/td>\n<td>运输计划/配车/运费<\/td>\n<td>运行管理的系统化版——主线技能<\/td>\n<\/tr>\n<tr>\n<td><strong>WMS<\/strong><\/td>\n<td>库存/入出库/拣选<\/td>\n<td>仓储转岗的核心<\/td>\n<\/tr>\n<tr>\n<td>CRM/SFA<\/td>\n<td>客户对应<\/td>\n<td>事务所方向才需要<\/td>\n<\/tr>\n<tr>\n<td>EDI<\/td>\n<td>荷主↔物流数据交换<\/td>\n<td>理解\"为什么传票数字化\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_20\">三、证明方式（比证书重要）<\/h4>\n<ul>\n<li>自作工具：把自己做的配车表/KPI 看板/改善提案存档 → <a href=\"../../03-career-management/reports/2026-11-career-management.html#05-成果档案与晋升材料\">03-管理岗过渡 · 05<\/a><\/li>\n<li>公司内\"数字担当\"实绩（培训过几人、改善过什么）<\/li>\n<li>必要时补考：Microsoft MOS Excel、GAS/Python 微证书——锦上添花<\/li>\n<\/ul>\n<h4 id=\"_21\">四、资源入口<\/h4>\n<ul>\n<li>Microsoft Learn（Excel/Power BI 免费官方课）<\/li>\n<li>Udemy 日语系 SQL/Python 课程（打折时 1500 円级）<\/li>\n<li>ロジスティクス検定（L検）：物流知识体系化，详见 <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.html\">10-资格与教育投资<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 数字化岗位与转型路径<\/h3>\n<blockquote>\n<p>阶段 4 的职业落地：从\"会用系统的人\"到\"吃系统饭的人\"的三条路。<\/p>\n<\/blockquote>\n<h4 id=\"_22\">一、三条转型路径<\/h4>\n<h5 id=\"a\">路径 A：公司内转岗（首选）<\/h5>\n<pre><code class=\"language-text\">司机 → 运行管理辅助 → 配车担当（TMS 用户） → 运输管理系统担当/DX 推进室\n<\/code><\/pre>\n<ul>\n<li>前提：公司有 5+ 台车规模、有系统、有转岗先例<\/li>\n<li>时机：第 4–6 年（与主任竞聘同期评估）<\/li>\n<li>在留注意：特定技能框架内的业务范围受限——大规模转事务岗可能需要资格变更（技术·人文·国际业务需学历/10 年实务），转岗谈判时与行政书士确认<\/li>\n<\/ul>\n<h5 id=\"b\">路径 B：跳槽到系统化大企业<\/h5>\n<ul>\n<li>3PL 大手/大手宅配的\"运行管理/配送管理/仓库管理\"岗——系统暴露度高<\/li>\n<li>卖点组合：现场经验 5 年 + N2 + TMS/WMS 使用实绩 + 改善提案集<\/li>\n<\/ul>\n<h5 id=\"c-saas\">路径 C：物流 SaaS/技术公司<\/h5>\n<ul>\n<li>WMS/TMS 厂商的<strong>实施顾问（導入コンサル）/客服成功（CS）<\/strong>——非常吃\"懂现场\"的人<\/li>\n<li>前身岗位值钱：真实跑过配车和仓库的人做导入培训，说服力碾压纯 IT 背景<\/li>\n<li>日语+中文双语=对华供应链客户关系的差异化<\/li>\n<\/ul>\n<h4 id=\"jd\">二、岗位 JD 关键词对照（求职检索用）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">检索词<\/th>\n<th style=\"width:50%\">对应岗位<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>配車管理・運行管理<\/td>\n<td>路径 A/B 第一步<\/td>\n<\/tr>\n<tr>\n<td>ロジスティクス担当・物流企画<\/td>\n<td>本社物流部门<\/td>\n<\/tr>\n<tr>\n<td>WMS 導入・フィールドエンジニア<\/td>\n<td>路径 C<\/td>\n<\/tr>\n<tr>\n<td>サプライチェーン<\/td>\n<td>更上游的企划岗<\/td>\n<\/tr>\n<tr>\n<td>物流DX・改善<\/td>\n<td>DX 推进<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_23\">三、评估节点<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">年<\/th>\n<th style=\"width:50%\">动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y4<\/td>\n<td>检视公司内转岗可能性（01 文件第 2 层技能是否完成）<\/td>\n<\/tr>\n<tr>\n<td>Y6<\/td>\n<td>若无内部机会 → 路径 B 求职市场试探（不轻易辞职，先面试 3 家摸行情）<\/td>\n<\/tr>\n<tr>\n<td>Y8<\/td>\n<td>路径 C 可选窗口（现场故事+系统实绩完备时）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_24\">四、关联<\/h4>\n<ul>\n<li>自动化岗位画像 → <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.html#04-个人技能对接与机会\">05-自动驾驶与自动化 · 04<\/a><\/li>\n<li>技能学习计划 → <a href=\"#01-物流数字化技能地图\">01-物流数字化技能地图<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"03\">03 日本数字化劳动市场与岗位行情<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。对应阶段 4 的市场面：转职/跳槽谈判前的行情基准。薪资类数据来自转职服务登录者统计与企业公开值，与个人实际报价有偏差，仅作参照带。在留资格与日语审查要件一律见 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#05-特定技能2号与升级路径\">05 特定技能2号与升级路径<\/a>，本章节只管\"技能-岗位-行情\"。<\/p>\n<\/blockquote>\n<h4 id=\"it\">一、IT/数字化人才供需全景<\/h4>\n<ul>\n<li>官方试算（経産省「IT人材需給に関する調査」，三省連携、2019 公表）：2018 年 IT 人材约 103 万人 → 2030 年供给约 113 万人；需求按市场情景扩大——低位情景（年 1%）约 130 万、中位（2.7%）约 158 万、高位（4.4%）约 192 万，对应 2030 年缺口<strong>低位约 16 万／中位约 45 万／高位约 79 万<\/strong> [Source: https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf, 2019]<\/li>\n<li>缺口结构比总量重要：中位情景 45 万缺口中先端 IT 人材（AI/IoT/云）不足 27 万–55 万，従来型 IT 人材在 Re スキル（转岗学习）停滞时反而可能<strong>过剩 10 万<\/strong>——行情结论是\"向先端领域补技能\"，与 01 章第 3 层技能规划一致 [Source: https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf, 2019]<\/li>\n<li>IPA「DX動向2025」（2025-10 公开）：日本企业 85.1% 存在 DX 推进人材不足，显著高于美/德 [Source: https://www.ipa.go.jp/digital/chousa/discussion-paper/dx2025_digital_talent_ai_era.html, 2025]<\/li>\n<li>供给侧长期收缩：IT 相关产业从业者以 2019 年为峰值，此后入職者数低于退職者数、产业人口转减且高龄化（経産省 2026-04 资料引「IT人材の最新動向と将来推計」）[Source: https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf, 2026]<\/li>\n<li>官方技能对照工具：デジタルスキル標準（DX 推进型/活用型两分）、Re スキル講座认证制度 [Source: https://www.meti.go.jp/policy/it_policy/jinzai/index.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"_25\">二、数字化岗位薪资带<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标（口径）<\/th>\n<th style=\"width:33%\">数值<\/th>\n<th style=\"width:34%\">年份<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://freelance.levtech.jp/guide/detail/1217/\" title=\"来源：https://freelance.levtech.jp/guide/detail/1217/, 2026\">软件工程师平均年收（厚労省賃金構造基本統計調査・ソフトウェア作成者）<\/a><\/td>\n<td>约 578 万円<\/td>\n<td>2024 调查<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://freelance.levtech.jp/guide/detail/1217/\" title=\"来源：https://freelance.levtech.jp/guide/detail/1217/, 2026\">全国平均给与（国税庁民間給与実態統計調査，对照基准）<\/a><\/td>\n<td>约 478 万円<\/td>\n<td>令和 6 年分<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://doda.jp/guide/heikin/gyousyu/index.html\" title=\"来源：https://doda.jp/guide/heikin/gyousyu/index.html, 2025\">转职登录者 IT/通信业平均（doda，约 60 万登录者口径）<\/a><\/td>\n<td>466 万円<\/td>\n<td>2025<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://xn--pckua2a7gp15o89zb.com/%E9%B4%BB%E6%B1%A0%E9%81%8B%E8%BC%B8%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%81%AE%E5%B9%B4%E5%8F%8E\" title=\"来源：https://xn--pckua2a7gp15o89zb.com/鴻池運輸株式会社の年収, 2025\">物流大企业平均年收例（鸿池运输・企业公开值，运输业 69 社中第 57 位）<\/a><\/td>\n<td>544 万円（求人票平均 426 万）<\/td>\n<td>2024<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>职种分档（レバテック登录者实绩，2026-04 时点）[Source: https://freelance.levtech.jp/guide/detail/1217/, 2026]：<\/li>\n<li>初级·现场/运维系：サーバーサイド约 414 万、サーバー（运维）约 389 万、ネットワーク约 401 万、組込约 354 万<\/li>\n<li>中级·专业系：フロントエンド约 457 万、クラウド约 458 万、PL 约 529 万<\/li>\n<li>高级·管理/咨询系：IT コンサルタント约 509 万、PM 约 488 万、PMO 约 593 万<\/li>\n<li>doda IT/通信小分类（2025）：IT コンサルティング 505 万 &gt; HW/SW/パッケージベンダ 493 万 &gt; SIer 481 万 &gt; 通信/ISP/DC 434 万 [Source: https://doda.jp/guide/heikin/gyousyu/index.html, 2025]<\/li>\n<li>物流业 vs IT 岗对比（<strong>推断<\/strong>读法）：物流上市公司平均年收多在 500 万级以下（鸿池 544 万仅列运输业 69 社第 57 位、求人票平均 426 万），而统一统计口径下软件工程师 578 万——同一段现场经验换到系统岗是加薪方向；但物流公司内转岗多沿用本公司年功序列，跳到 SIer/厂商才是行情兑现路径（推断）<\/li>\n<\/ul>\n<h4 id=\"_26\">三、外语要求与外国人就业现状<\/h4>\n<ul>\n<li>规模：外国人劳动者约 204 万人（雇用保险 5 人以上事业所口径），「専門的・技術的分野」占 42.1%（前年 38.9%）；该分野月间固定给与 306.5 千円 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]<\/li>\n<li>高度人才构成：技・人文・国際業務在留外国人约 46 万人（2015 年约 13 万的 3.5 倍）；高度専門職约 3.1 万人中 IT 工程师占 31.2% [Source: https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf, 2026]<\/li>\n<li>日语门槛：雇用侧课题第 1 位为\"因日语能力沟通困难\"46.2%；求职者侧 11.9% 遭遇\"事前说明以上の日本語能力要求\"——JD 标注等级常低于实务要求（<strong>推断<\/strong>），面试前用 01 章证明材料实测 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]<\/li>\n<li>等级带（<strong>推断<\/strong>整理）：系统担当/社内 SE N2 起步可谈；DX 企划/导入顾问面向荷主管理层需 N1 或等效商务级；技人国审查与高度人材积分（N1 15 分/N2 10 分）要件见 visa 手册 05 章，不在此重写<\/li>\n<li>英语环境岗位（<strong>推断<\/strong>）：集中在外资 SI/咨询、全球化物流科技厂商（英语文档环境）；公开统计无英语岗占比数据，<strong>待复核<\/strong><\/li>\n<\/ul>\n<h4 id=\"_27\">四、物流业外泛用型岗位与转职市场<\/h4>\n<ul>\n<li>WMS/TMS 实施岗：物流 SaaS 厂商「導入コンサル/实施顾问」，求人事例带 380 万–800 万（パッケージ導入コンサルタント求人带）[Source: https://xn--pckua2a7gp15o89zb.com/%E3%83%91%E3%83%83%E3%82%B1%E3%83%BC%E3%82%B8%E5%B0%8E%E5%85%A5%E3%82%B3%E3%83%B3%E3%82%B5%E3%83%AB%E3%82%BF%E3%83%B3%E3%83%88%E3%81%AE%E4%BB%95%E4%BA%8B, 2026]——真实跑过配车/仓库的现场经验是该岗差异化筹码（对接 02 章路径 C）<\/li>\n<li>用户企业情报部门/社内 SE：非 IT 业种的社内系统岗缺口大（结合本章 85.1% 不足数据，<strong>推断<\/strong>），是 02 章路径 A 之外的第二落点<\/li>\n<li>数据分析/改善岗：先端 IT 人材缺口 27 万–55 万的组成部分，01 章第 3 层技能（BI/SQL）直接对应（推断）<\/li>\n<li>转职市场特征：外国人在职者中 6.1% 明确\"辞掉现职在日本国内换公司\"、国内入職者 19.1% 经由求人广告自力求职；海外入職者 82.0% 依赖介绍会社 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]——已在国内的转职不必绑死送出机构渠道<\/li>\n<\/ul>\n<h4 id=\"_28\">五、与本项目路线的对接要点（推断）<\/h4>\n<ul>\n<li>Y5–Y6（衔接 <a href=\"#02-数字化岗位与转型路径\">02 数字化岗位与转型路径<\/a> 评估节点）：内部转岗（路径 A）行情兑现有限，重点谈职级与\"システム担当\"头衔；路径 B 试探时以 SIer 481 万／IT コンサル 505 万带（doda 口径，2025）为报价参照<\/li>\n<li>Y7–Y8（路径 C 窗口）：WMS/TMS 实施岗报价带 380 万–800 万（求人事例，2026），落地取决于现场故事+日语等级；此阶段 N1 回报最大（报价上限 + 高度人材积分 15 分）<\/li>\n<li>岗位选择优先序（<strong>推断<\/strong>）：社内 DX/系统担当（稳定，衔接 Y4 转岗）&gt; 3PL 大手系统岗（平台大）&gt; 物流 SaaS 实施顾问（行情溢价但出差强度高）<\/li>\n<li>在留切换时序、学历/10 年实务经验要件不属于本节：一律以 visa 手册 05 章为准<\/li>\n<li>数值管理：本章薪资带与缺口数为活值，登记于 <a href=\"../data/technology_industry_indicator_registry.md\">data/technology_industry_indicator_registry.md<\/a> #4–#6，每年随调查更新刷新<\/li>\n<\/ul>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 290, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "06-industry-technology/reports/2026-11-industry-technology.html"}}}, "economy-finance": {"name": "经济与财务", "dir": "07-economy-finance", "months": {"2026-11": {"title": "经济与财务 · 首份分析报告", "body": "\n<h1 id=\"_1\">经济与财务 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要做个人财务规划的读者，兼具行情调研与自我管理视角。\n<strong>来源规则<\/strong>：① 総務省統計局（stat.go.jp 消费物价、家計調査）、厚生労働省（毎月勤労統計）、国税庁（税率）、日本年金機構 ＞ ② 中国国家统计局（工资对比输入——项目指定例外）、中国外汇交易中心（chinamoney.com.cn 汇率中间价）＞ ③ 地域自治体生活成本数据 ＞ ④ 比价门户（预期指标）；每条数据必须附可直接访问的 URL。<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本经济与财务知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：收入结构与薪资行情（薪资基本盘、地域差、收入增长曲线、合规副收边界）；生活成本与储蓄规划（月度成本模型、储蓄率目标、汇款渠道）；税务社保年金（四大公的义务、年金与永住、归档清单）；长期财务规划（10 年里程碑、世帯年收达标模拟、大额决策时机）。<\/li>\n<li><strong>不含<\/strong>：岗位薪资细节与工资构成（→ 02-career-driver）、行业结构与企业动向（→ 04-industry-logistics）、自动驾驶技术面（→ 05-industry-autonomous）、数字化技能（→ 06-industry-technology）、管理岗过渡（→ 03-career-management）、在留资格与永住年收要件（→ 08-visa-immigration）、法规条文解读（→ 09-politics-law）、日语学习（→ 11-language-japanese）、资格与教育投资（→ 10-education-qualification）、官方统计活值（→ 01-ssw-driver，只读引用）。<\/li>\n<\/ul>\n<p><strong>受众与用途<\/strong>：为在日货运司机个人提供收入—成本—税社—长期财务的规划框架，用途为年度复盘与月度收支核对的参照基线。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. 运输業月均工资与最低賃金的最新水平及年度变动方向如何？\n2. 100 日元汇率中间价的近期水平对日元计价收入与对华汇款意味着什么？\n3. 单身司机的月度生活成本与可实现储蓄率处于什么区间？\n4. 四大公的义务负担率与年金缴纳证据链是否完整、是否构成永住风险？\n5. 10 年财务里程碑与世帯年收达标模拟的关键变量（配偶者就业收入）如何变化？<\/p>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位薪资细节、工资构成与工时合规<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>行业结构、2024 年問題、企业动向<\/td>\n<td>04-industry-logistics<\/td>\n<\/tr>\n<tr>\n<td>管理岗过渡与晋升档案<\/td>\n<td>03-career-management<\/td>\n<\/tr>\n<tr>\n<td>在留资格、永住年收要件与取消风险<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>法规条文解读<\/td>\n<td>09-politics-law<\/td>\n<\/tr>\n<tr>\n<td>运输業工资 / 汇率官方活值<\/td>\n<td>01-ssw-driver（只读锚）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>收入结构与薪资行情<\/td>\n<td>行业薪资基本盘、地域差与收入增长曲线<\/td>\n<td>#1、#2<\/td>\n<td>厚労省毎月勤労統計 / 厚生労働省<\/td>\n<td>月度（工资）/ 年度（最低賃金改定）<\/td>\n<\/tr>\n<tr>\n<td>生活成本与储蓄规划<\/td>\n<td>月度成本模型、储蓄率目标与汇款<\/td>\n<td>#3、#4、#6<\/td>\n<td>chinamoney.com.cn / 総務省統計局 / 自记录<\/td>\n<td>月度（汇率、CPI、收支）<\/td>\n<\/tr>\n<tr>\n<td>税务社保年金<\/td>\n<td>四大公的义务负担与年金证据链<\/td>\n<td>#5<\/td>\n<td>年金機構 / 厚労省<\/td>\n<td>年度（费率修订）<\/td>\n<\/tr>\n<tr>\n<td>长期财务规划<\/td>\n<td>10 年里程碑与世帯年收达标模拟<\/td>\n<td>#6<\/td>\n<td>自记录<\/td>\n<td>年度（1 月复盘）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：收入维度决定储蓄模型的上限输入；生活成本维度决定净收入（手取り）的可储蓄部分；税社年金维度从收入中先行扣除，其证据链同时是永住审查资产；长期财务规划以前三者的合力结果为输入，世帯年收达标又反向约束收入与配偶者就业安排。四者口径不同（税引前月収 ≠ 手取り），须分别维护、不得混算。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 收入结构与薪资行情<\/h3>\n<ul>\n<li>全职业平均年收 450–460 万円（国税厅民间给与实态统计，2025；来源 https://www.nta.go.jp/）。<\/li>\n<li>卡车司机平均年收约 430 万円（2026 年市场数据；手册未标注发布机构，<strong>待核验<\/strong>）。<\/li>\n<li>大型干线司机月给 35–43 万円、一般配送司机月给 25–33 万円（求人行情；<strong>待核验<\/strong>）。<\/li>\n<li>最低賃金（全国加权平均）1,118 円/h（2025 年度，厚生労働省；年涨 40–60 円；来源 https://www.mhlw.go.jp/）。<\/li>\n<li>登记册活值：运输業月均工资 341,158 円（2026-09，锚 01-ssw-driver #5）；最低賃金 全国平均 1,177 円（2026 年度）。<\/li>\n<li>收入增长曲线（手册规划值）：Y1–2 月给 25–28 万 → Y3–5 28–35 万 → Y5–8 30–40 万 → Y8–10 35–45 万（<strong>推断<\/strong>，基于本规划假设）。<\/li>\n<\/ul>\n<p><strong>口径冲突并列（不可合并）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">口径 A<\/th>\n<th style=\"width:25%\">口径 B<\/th>\n<th style=\"width:25%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>最低賃金<\/td>\n<td>1,118 円/h（2025 年度，手册）<\/td>\n<td>1,177 円（2026 年度，登记册）<\/td>\n<td>年度不同，并列呈现<\/td>\n<\/tr>\n<tr>\n<td>司机收入<\/td>\n<td>运输業月均工资 341,158 円（厚労省，2026-09）<\/td>\n<td>卡车司机平均年收 约 430 万円（市场数据，2026）<\/td>\n<td>月均工资 ≠ 含赏与年收，不得直接对比<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"32\">3.2 生活成本与储蓄规划<\/h3>\n<ul>\n<li>月度生活成本模型（单身·地方都市）合计 10.5–17.0 万円/月，常见 12–14 万（手册估算，2026-11-11 核对；<strong>待核验<\/strong>）。<\/li>\n<li>储蓄模型（手册估算）：月给 21 万→储 9 万（43%）；25 万→储 13 万（52%）；30 万→储 18 万（60%）。<\/li>\n<li>目标线：到手 35% 为及格、45% 为良好（手册）。<\/li>\n<li>登记册活值：100 日元汇率中间价 4.2355 元（2026-11-10，chinamoney.com.cn）；CPI 综合指数 <strong>待基线确立<\/strong>；个人月度收支结算 <strong>待记录<\/strong>。<\/li>\n<li>汇款参考：1 CNY ≈ 19–22 JPY 区间低位多汇（历史波动参考，手册；<strong>推断<\/strong>）。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 税务社保年金<\/h3>\n<ul>\n<li>四大公的义务（手册）：所得税 5–45% 超累进；住民税 所得约 10%；健康保险约 5%（公司对半）；厚生年金 9.15%（公司对半，合计 18.3%）。<\/li>\n<li>到手工资 ≈ 额面的 78–85%（手册估算；<strong>待核验<\/strong>）。<\/li>\n<li>年金 / 社保个人负担率（登记册 #5）<strong>待基线确立<\/strong>。<\/li>\n<li>红线：住民税·社保滞纳 = 永住取消要件（3 年）+ 在留更新减分（手册）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 长期财务规划<\/h3>\n<ul>\n<li>10 年里程碑（手册）：Y1 应急金 50 万円；Y3 100 万円；Y5 储蓄 400–600 万円；Y6–8 家族来日预留 150–250 万円；Y10 储蓄 800 万円+ / 世帯年收达标 / 无滞纳记录。<\/li>\n<li>世帯年收达标模拟（手册假设）：日本二人世帯平均年收约 650 万円量级；Y8 世帯合计 680 万円为达标窗口。<\/li>\n<li>策略含义：配偶者就业收入是永住年收达标的关键变量（手册）。<\/li>\n<\/ul>\n<p><strong>未取得 / 待核验项<\/strong>：\n- CPI 综合指数（登记册 #4）——待基线确立。\n- 年金 / 社保个人负担率（登记册 #5）——待基线确立。\n- 个人月度收支结算（登记册 #6）——待记录。\n- 卡车司机平均年收、月给区间、到手工资比例、月度成本模型——手册估算，待核验。<\/p>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>收入基本盘已由官方与锚定活值共同确立<\/strong>：运输業月均工资 341,158 円（2026-09）与最低賃金 1,177 円（2026 年度）均为可溯源活值，可作为收入维度基线。（事实）<\/li>\n<li><strong>最低賃金处于年度上行通道<\/strong>：2025 年度 1,118 円/h 与 2026 年度 1,177 円并列，差值 59 円，与手册「年涨 40–60 円」经验法则一致。（事实 + 推断）<\/li>\n<li><strong>汇率与 CPI 尚不足以支撑中日对比结论<\/strong>：汇率有 2026-11-10 活值，但 CPI 待基线确立，购买力与汇款时点判断暂不成立。（事实）<\/li>\n<li><strong>生活成本与储蓄率仅为规划估算<\/strong>：10.5–17.0 万円/月与 35%/45% 目标线为手册估算值，在个人收支结算（待记录）补齐前不得作为结论使用。（事实）<\/li>\n<li><strong>税社负担结构清晰但缺活值<\/strong>：四大公的义务比例明确，但年金 / 社保个人负担率待基线确立，净收入模型无法闭合。（事实）<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：\n- 手册中市场类数字（司机年收、月给、到手比例）无发布机构标注，核验前存在偏差风险。\n- 个人收支与 CPI 缺失使储蓄率与世帯年收模拟无法验证。\n- 永住年收要件与取消风险归 08-visa-immigration，本主题只提供财务证据链，不构成要件判断。<\/p>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题（分析层）<\/strong>：\n1. 运输業月均工资下一期（2026-10 及以后）是否延续 341,158 円水平？\n2. 2026 年度最低賃金改定后，全国平均与时给带如何变化？\n3. 100 日元汇率中间价在 2026-11 之后的波动区间是否落在 1 CNY ≈ 19–22 JPY 参考带内？\n4. CPI 综合指数与年金 / 社保个人负担率的首个基线值何时可从官方页取得？\n5. 个人月度收支结算与手册模型（10.5–17.0 万円/月）的偏差幅度有多大？<\/p>\n<p><strong>下一期重点核实项<\/strong>：\n- 从総務省統計局取得 CPI 综合指数活值，回写登记册 #4。\n- 从年金機構 / 厚労省取得年金 / 社保个人负担率，回写登记册 #5。\n- 建立个人收支月度记录，回写登记册 #6。<\/p>\n<p><strong>数据补全计划<\/strong>：月度核验仅更新登记册观察项；命中「每月勤労統計月次更新」「消费物价统计月次更新」触发器时升级为季度重点更新；每年 1 月对照 04-长期财务规划复盘。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>運輸業月均工资<\/td>\n<td>341,158 円<\/td>\n<td>厚労省每月勤労統計（锚 01-ssw-driver #5）<\/td>\n<td>2026-09<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>最低賃金 全国平均<\/td>\n<td>1,177 円<\/td>\n<td>厚生労働省<\/td>\n<td>2026 年度<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>100 日元汇率中间价<\/td>\n<td>4.2355 元<\/td>\n<td>chinamoney.com.cn<\/td>\n<td>2026-11-10<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>CPI 综合指数（日本）<\/td>\n<td>待基线确立<\/td>\n<td>総務省統計局<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>年金 / 社保个人负担率<\/td>\n<td>待基线确立<\/td>\n<td>年金機構 / 厚労省<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>个人月度收支结算<\/td>\n<td>待记录<\/td>\n<td>自记录<\/td>\n<td>待记录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：基线 <code>reports/2026-11-economy-finance.md<\/code>（v1.0 首期固定）；月度核验不重写报告，仅更新登记册「观察项与触发器状态」；季度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；事件触发插刷 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>（追加件）。<\/p>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节）：\n- 每月勤労統計月次更新（锚 01-ssw-driver #5）→ 01\n- 最低賃金年度改定（厚生労働省公布，每年改定一次）→ 01\n- 汇率中间价大幅波动（按月比较）→ 01 / 04\n- 税制 / 社保年金费率年度修订（厚生労働省官方公布）→ 03\n- 消费物价统计月次更新 → 02\n- 个人收支月度结算 → 01 / 02 / 04<\/p>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">状态项<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">更新于<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>唯一观察项<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>首要触发器<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>触发器结论<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：\n- <strong>A 官方一手<\/strong>：运输業月均工资（厚労省）、最低賃金（厚生労働省）、100 日元汇率（chinamoney.com.cn）、国税厅 / 厚生劳动省来源标注的统计。\n- <strong>B 权威转引<\/strong>：无（本主题素材未含权威转引层数据）。\n- <strong>C 平台抽样 / 估算<\/strong>：卡车司机平均年收、月给区间、月度成本模型、储蓄模型、到手工资比例、世帯年收模拟（均为手册规划估算，<strong>待核验<\/strong>）。<\/p>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>收入<\/td>\n<td>税引前月収 ≠ 手取り（社保・税后）<\/td>\n<\/tr>\n<tr>\n<td>工资统计<\/td>\n<td>家計調査（世帯）≠ 勤労統計（事業所）<\/td>\n<\/tr>\n<tr>\n<td>最低賃金<\/td>\n<td>全国平均 ≠ 都道府県加权平均<\/td>\n<\/tr>\n<tr>\n<td>司机收入<\/td>\n<td>运输業月均工资（厚労省）≠ 卡车司机平均年收（含赏与）<\/td>\n<\/tr>\n<tr>\n<td>中日对比<\/td>\n<td>100 日元中间价 ≠ 1 CNY 折算（汇率日不同）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：CPI 综合指数（待基线确立）、年金 / 社保个人负担率（待基线确立）、个人月度收支结算（待记录）。<\/p>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li>厚生労働省（毎月勤労統計 / 最低賃金），https://www.mhlw.go.jp/，2025。<\/li>\n<li>国税厅（民间给与实态统计），https://www.nta.go.jp/，2025。<\/li>\n<li>中国外汇交易中心（chinamoney.com.cn），100 日元汇率中间价，2026-11-10。<\/li>\n<li>総務省統計局（消费物价指数），https://www.stat.go.jp/，待基线确立。<\/li>\n<li>日本年金機構 / 厚生労働省（年金・社保费率），待基线确立。<\/li>\n<li>01-ssw-driver 指标登记册 #5（运输業月均工资锚）、交叉验证输入（100 日元汇率），只读引用。<\/li>\n<li>08-visa-immigration 手册 07（永住与长期在留规划），只读引用。<\/li>\n<li>02-career-driver 报告（薪资结构与工时合规 / 实际工作条件记录），只读引用。<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本经济与财务知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本经济与财务知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11-12\n<strong>说明<\/strong>：本文档由原分散的多份章节文档合并整理而成，保留全部原内容与层级关系。后续更新请直接维护本单份文档。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">导航与使用约定<\/h3>\n<h3 id=\"07-economy-finance\">07-economy-finance 索引<\/h3>\n<p>经济与财务区。覆盖阶段 1（行情调研）到阶段 5（永住财务规划）。<\/p>\n<h4 id=\"_14\">文件一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>收入结构与薪资行情<\/td>\n<td>薪资基本盘、地域差、10 年收入曲线、合规副收边界<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>生活成本与储蓄规划<\/td>\n<td>单身月度成本模型、储蓄率目标、汇款渠道<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>税务社保年金<\/td>\n<td>四大公的义务、年金与永住、归档清单<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>长期财务规划<\/td>\n<td>10 年里程碑、世帯年收达标模拟、大额决策时机<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_15\">关联目录<\/h4>\n<ul>\n<li>岗位薪资细节与公司合规 → ../../02-career-driver/reports/archives/02-薪资结构与工时合规<\/li>\n<li>永住年收要件与取消风险 → ../../08-visa-immigration/reports/07-永住与长期在留规划<\/li>\n<li>工作条件实际记录（月度） → ../../02-career-driver/reports/06-实际工作条件记录<\/li>\n<\/ul>\n<h4 id=\"_16\">使用约定<\/h4>\n<ul>\n<li>每年 1 月对照 04-长期财务规划 复盘；每年 10 月刷新最低賃金与行情数据。<\/li>\n<li>所有数字为规划用估算，决策前以官方/当期数据核实。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"01\">01 收入结构与薪资行情<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。岗位薪资细节 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.html#02-薪资结构与工时合规\">02 薪资结构与工时合规<\/a>，本文件聚焦经济面：行情、地域差、收入曲线。<\/p>\n<\/blockquote>\n<h4 id=\"_17\">一、日本薪资基本盘<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">数值（约）<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>全职业平均年收<\/td>\n<td>450–460 万円<\/td>\n<td>国税厅民间给与实态统计<\/td>\n<\/tr>\n<tr>\n<td>卡车司机平均年收<\/td>\n<td><strong>约 430 万円<\/strong><\/td>\n<td>2026 年市场数据<\/td>\n<\/tr>\n<tr>\n<td>大型干线司机月给<\/td>\n<td>35–43 万円<\/td>\n<td>求人行情<\/td>\n<\/tr>\n<tr>\n<td>一般配送司机月给<\/td>\n<td>25–33 万円<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>最低賃金（全国加权平均）<\/td>\n<td>1,118 円/h（2025 年度）<\/td>\n<td>每年 10 月改定，年涨 40–60 円<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>数据来源：全职业平均年收与最低賃金分别以国税厅、厚生劳动省公开统计为准 [Source: https://www.nta.go.jp/, 2025] [Source: https://www.mhlw.go.jp/, 2025]。<\/p>\n<\/blockquote>\n<h4 id=\"_18\">二、地域差（选公司时用）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">区域<\/th>\n<th style=\"width:50%\">特征<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>东京圈<\/td>\n<td>岗位最多，但房租/生活成本高，实际储蓄率未必最高<\/td>\n<\/tr>\n<tr>\n<td>北关东（群马/栃木/埼玉北部）<\/td>\n<td>物流仓库密集，特定技能聚居区，成本适中<\/td>\n<\/tr>\n<tr>\n<td>东海（爱知）<\/td>\n<td>制造+物流双密集，外国人支援体制最成熟<\/td>\n<\/tr>\n<tr>\n<td>九州（福冈）<\/td>\n<td>对华交通方便，成本较低，干线岗位多<\/td>\n<\/tr>\n<tr>\n<td>豪雪地区（北陆/东北）<\/td>\n<td>薪资含冬季手当，但初学者驾驶风险高<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>经验法则<\/strong>：地方干线岗位名义薪资 ≥ 东京圈，加上房租差，<strong>可支配收入的差距比薪资差距更大<\/strong>。<\/p>\n<h4 id=\"10\">三、收入增长曲线（本规划 10 年）<\/h4>\n<pre><code class=\"language-text\">Y1–2  司机初期        月给 25–28 万（加班受 2024 规制约束）\nY3–5  司机成熟+冷键/大型 月给 28–35 万\nY5–8  运行管理/配车    月给 30–40 万 + 赏与增加\nY8–10 主任/管理岗      月给 35–45 万（永住世帯年收达标窗口）\n<\/code><\/pre>\n<p>对照永住要件（世帯年收 ≥ 日本人世帯平均，→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a>）：单身期收入增长曲线在 Y6–8 大概率达标；带家属后需重新核算。<\/p>\n<h4 id=\"_19\">四、额外收入选项（合规前提）<\/h4>\n<ul>\n<li>深夜/早朝班切换（1.25 倍系数）<\/li>\n<li>资格津贴：フォークリフト、危険物乙 4（+5 千–2 万/月）<\/li>\n<li>瓦lent work（禁忌：特定技能 1 号<strong>资格外活动原则不可<\/strong>——只能从事受入计划书记载的业务，违法打工=在留风险，明令禁止尝试）<\/li>\n<\/ul>\n<h4 id=\"_20\">五、年度核对项<\/h4>\n<ul>\n<li>[ ] 每年 10 月：新最低賃金、本行业薪资行情刷新<\/li>\n<li>[ ] 每年 3 月：自家前年收入 vs 计划曲线偏差<\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 生活成本与储蓄规划<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。单身司机生活模型，落地后用实际数替换。<\/p>\n<\/blockquote>\n<h4 id=\"_21\">一、月度生活成本模型（单身·地方都市）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">范围（万円/月）<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房租（1K/1LDK）<\/td>\n<td>4.5–7.0<\/td>\n<td>公司寮可压到 2–3.5 万<\/td>\n<\/tr>\n<tr>\n<td>水道光热（电·燃气·水·网）<\/td>\n<td>1.0–1.5<\/td>\n<td>司机通勤早出晚归，家中用电少<\/td>\n<\/tr>\n<tr>\n<td>食费<\/td>\n<td>3.0–4.5<\/td>\n<td>自炊 60%+外食 40%<\/td>\n<\/tr>\n<tr>\n<td>通信（手机+网）<\/td>\n<td>0.6–1.0<\/td>\n<td>格安 SIM 3GB≈1–3 千円<\/td>\n<\/tr>\n<tr>\n<td>交通<\/td>\n<td>0–0.5<\/td>\n<td>岗位多提供通勤手当或寮<\/td>\n<\/tr>\n<tr>\n<td>杂费·社交·文化<\/td>\n<td>1.5–2.5<\/td>\n<td>含日语学习支出<\/td>\n<\/tr>\n<tr>\n<td><strong>合计<\/strong><\/td>\n<td><strong>10.5–17.0<\/strong><\/td>\n<td>寿司常=12–14 万<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_22\">二、储蓄模型<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">月给（手取り）<\/th>\n<th style=\"width:33%\">月生活 12 万<\/th>\n<th style=\"width:34%\">月生活 15 万<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>21 万（Y1 司机初期）<\/td>\n<td>储 9 万（43%）<\/td>\n<td>储 6 万（29%）<\/td>\n<\/tr>\n<tr>\n<td>25 万（Y3）<\/td>\n<td>储 13 万（52%）<\/td>\n<td>储 10 万（40%）<\/td>\n<\/tr>\n<tr>\n<td>30 万（Y5–6）<\/td>\n<td>储 18 万（60%）<\/td>\n<td>储 15 万（50%）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>目标线：<strong>到手 35% 为及格、45% 为良好<\/strong>（储蓄含向国内汇款）。<\/p>\n<h4 id=\"_23\">三、年度支出（易漏项）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">项目<\/th>\n<th style=\"width:50%\">频率/金额<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自动车税+车辆相关（自有车时）<\/td>\n<td>年 3–5 万<\/td>\n<\/tr>\n<tr>\n<td>JLPT 考试费<\/td>\n<td>每次约 4,500–5,500 円（国内 550 元级）<\/td>\n<\/tr>\n<tr>\n<td>资格讲习（フォークリフト等）<\/td>\n<td>每次 3–10 万<\/td>\n<\/tr>\n<tr>\n<td>归国机票<\/td>\n<td>年 1–2 次 ×3–10 万<\/td>\n<\/tr>\n<tr>\n<td>年金·社保<\/td>\n<td>已含在手取り前（约 14–15% 的工资负担）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_24\">四、对国内汇款<\/h4>\n<ul>\n<li>渠道：Wise/Revolut（汇率优）、银行电汇（ Sofh 银行·住信 SBI 网银对华有优惠线路）、家族汇款用「在住证明+用途」文件准备<\/li>\n<li>频率：建议按季度集中汇款摊薄手续费；10 万円以下汇款手续简化<\/li>\n<li>汇率：在 1 CNY ≈ 19–22 JPY 区间低位多汇（历史波动参考，不做投机）<\/li>\n<\/ul>\n<h4 id=\"_25\">五、落地后动作<\/h4>\n<ul>\n<li>[ ] 第 1 个月：银行开户（邮储/主要 mega bank 都接受在留卡开户）、办 My Number 卡<\/li>\n<li>[ ] 第 2 个月：建立家用账本（Money Forward/freee 家计簿 app）<\/li>\n<li>[ ] 每半年：对比本文件模型 vs 实际，修正偏差<\/li>\n<\/ul>\n<hr />\n<h3 id=\"03\">03 税务社保年金<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。定位：把\"公的义务\"从负担变成<strong>永住证据链资产<\/strong>（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a>）。<\/p>\n<\/blockquote>\n<h4 id=\"_26\">一、四大公的义务一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">负担<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>所得税<\/td>\n<td>5–45% 超累进<\/td>\n<td>公司源泉征收，年末调正处理大部分<\/td>\n<\/tr>\n<tr>\n<td>住民税<\/td>\n<td>所得约 10%<\/td>\n<td>次年 6 月起从工资扣<\/td>\n<\/tr>\n<tr>\n<td>健康保险（会社健保/协けん）<\/td>\n<td>约 5%（公司对半）<\/td>\n<td>加入职场保险，不要滞留国民健康保险<\/td>\n<\/tr>\n<tr>\n<td>厚生年金<\/td>\n<td>9.15%（公司对半，合计 18.3%）<\/td>\n<td><strong>永住审查核心项<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>到手工资 ≈ 额面 −（所得税+住民税+社保个人负担）≈ 额面的 78–85%。<\/p>\n<h4 id=\"_27\">二、年金：三个关键词<\/h4>\n<ol>\n<li><strong>缴纳满额<\/strong>：厚生年金按工资比例自动扣——不停职就不断缴，风险最低<\/li>\n<li><strong>ねんきん定期便<\/strong>：每年生日月前后寄达/My Number Portal 可查，<strong>每年存档一份<\/strong>=缴费证据<\/li>\n<li><strong>脱退一时金<\/strong>：若最终不永住归国，可申请退出时领取一部分（最多 5 年分）——但本规划走永住，这笔钱长期复利留下更划算<\/li>\n<\/ol>\n<h4 id=\"_28\">三、税务实务<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">场景<\/th>\n<th style=\"width:50%\">动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>正社员工资<\/td>\n<td>年末调正基本免确定申告<\/td>\n<\/tr>\n<tr>\n<td>有副收/医疗费高/房贷<\/td>\n<td>年初 2.16–3.15 确定申告<\/td>\n<\/tr>\n<tr>\n<td>灾害/医疗大额<\/td>\n<td>所得控除申报（医疗费 10 万円超部分）<\/td>\n<\/tr>\n<tr>\n<td>扶养家族（国内父母不适用日本制度）<\/td>\n<td>无需申报<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>红线<\/strong>：住民税·社保滞纳 = 永住取消要件（3 年）+ 在留更新减分——零容忍。<\/p>\n<h4 id=\"_29\">四、归档清单（与永住证据链共用）<\/h4>\n<ul>\n<li>每年 1–2 月：前年源泉征收票<\/li>\n<li>每年：ねんきん定期便、住民税决定通知书<\/li>\n<li>My Number Portal：按年导出缴费记录 PDF<\/li>\n<\/ul>\n<h4 id=\"_30\">五、关联<\/h4>\n<ul>\n<li>公的义务与永住取消 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a><\/li>\n<li>法规框架 → <a href=\"../../09-politics-law/reports/\">../../09-politics-law<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"04\">04 长期财务规划<\/h3>\n<blockquote>\n<p>对应阶段 5：永住、家族、住房、教育的大额决策预演。每年 1 月对照刷新一次。<\/p>\n<\/blockquote>\n<h4 id=\"10_1\">一、10 年财务里程碑<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时点<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y1<\/td>\n<td>应急金 50 万円（3 个月生活费）+ 无负债<\/td>\n<\/tr>\n<tr>\n<td>Y3<\/td>\n<td>应急金 100 万円 + 技能投资预算独立（资格/驾校）<\/td>\n<\/tr>\n<tr>\n<td>Y5（2 号移行后）<\/td>\n<td>婚姻/家族计划评估；储蓄 400–600 万円<\/td>\n<\/tr>\n<tr>\n<td>Y6–8<\/td>\n<td>家族来日成本（住房升级、语言学校、机票）：预留 150–250 万円<\/td>\n<\/tr>\n<tr>\n<td>Y10（永住申请）<\/td>\n<td>储蓄 800 万円+ / 世帯年收达标 / 无任何滞纳记录<\/td>\n<\/tr>\n<tr>\n<td>Y10+<\/td>\n<td>住宅评估（永住者可申请全额房贷）·子女教育基金<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_31\">二、世帯年收达标模拟（永住「年收水准」要件）<\/h4>\n<p>假设：日本二人世帯平均年收约 650 万円量级（各年官方数据为准）。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">年<\/th>\n<th style=\"width:20%\">本人<\/th>\n<th style=\"width:20%\">配偶者（假设后进入职场）<\/th>\n<th style=\"width:20%\">世帯合计<\/th>\n<th style=\"width:20%\">判定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y6<\/td>\n<td>430 万<\/td>\n<td>0<\/td>\n<td>430 万<\/td>\n<td>单身期可过<\/td>\n<\/tr>\n<tr>\n<td>Y8<\/td>\n<td>480 万<\/td>\n<td>200 万（Part→正社）<\/td>\n<td>680 万<\/td>\n<td>达标窗口<\/td>\n<\/tr>\n<tr>\n<td>Y10<\/td>\n<td>520 万<\/td>\n<td>260 万<\/td>\n<td>780 万<\/td>\n<td>稳<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>策略含义：<strong>配偶者的就业收入是永住年收达标的关键变量<\/strong>——2 号带家属后，支持配偶者日语学习与就业即是财务规划的一部分。<\/p>\n<h4 id=\"_32\">三、大额决策清单与时机<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">决策<\/th>\n<th style=\"width:33%\">建议时机<\/th>\n<th style=\"width:34%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>购车（家庭用车）<\/td>\n<td>Y5 后<\/td>\n<td>永住前可贷款但额度低；车检/保险成本计入<\/td>\n<\/tr>\n<tr>\n<td>住宅购入<\/td>\n<td>永住取得后<\/td>\n<td>永住者房贷利率最优（フラット 35 等）；北海道等土地便宜但要绑定就业地<\/td>\n<\/tr>\n<tr>\n<td>子女教育<\/td>\n<td>Y8 前<\/td>\n<td>公立校免费+给食；大学阶段教育费 500 万+（国立自宅）<\/td>\n<\/tr>\n<tr>\n<td>保险组合<\/td>\n<td>Y3<\/td>\n<td>生命保险克制：公司福利+健保已覆盖大部分，重点补死亡/工伤<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_33\">四、金融习惯（日本居住者）<\/h4>\n<ul>\n<li>活期+定期组合：Net 系银行利率略高（乐天/SBI/au 等现金 back 文化）<\/li>\n<li>iDeCo/つみたてNISA：<strong>在留资格稳定（2 号）后<\/strong>再开启——永住前投资账户的处理要向税务士确认，避免复杂性<\/li>\n<li>信用积累：信用卡按时还款→信用信息机构记录→房贷审查基础（Y1 就开始）<\/li>\n<\/ul>\n<h4 id=\"_34\">五、年度复盘模板<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">项目<\/th>\n<th style=\"width:20%\">目标<\/th>\n<th style=\"width:20%\">实际<\/th>\n<th style=\"width:20%\">差异原因<\/th>\n<th style=\"width:20%\">下年修正<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>储蓄余额<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>世帯年收<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>公的义务记录<\/td>\n<td>零瑕疵<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>大额决策进度<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 259, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "07-economy-finance/reports/2026-11-economy-finance.html"}}}, "visa-immigration": {"name": "签证与移民", "dir": "08-visa-immigration", "months": {"2026-11": {"title": "日本签证与在留资格 · 首份分析报告", "body": "\n<h1 id=\"_1\">日本签证与在留资格 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）\n<strong>受众定位<\/strong>：面向拟通过特定技能（SSW）赴日从事货运司机工作、并规划长期在留的读者，兼具制度查询与路径规划视角。\n<strong>来源规则<\/strong>：① 出入国在留管理庁（isa.go.jp / moj.go.jp）、ssw.go.jp、e-Gov 法令检索、国土交通省（mlit.go.jp）＞ ② JFT-Basic（国際交流基金 / Prometric）、JLPT（JEES）、外国人技能実習機構（otit.go.jp）＞ ③ 全日本トラック協会、登录支援机关行业信息 ＞ ④ 指定取次 / 中介机构官网（仅流程参考，不作数据源）＞ ⑤ NHK、日本経済新聞、Nikkei Asia、外務省各领馆中文页（费用类可作一手）<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本签证与在留资格知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<h3 id=\"11\">1.1 主题定义与监测范围<\/h3>\n<p><strong>含<\/strong>（business-config 3.1）：特定技能制度概览、1 号・自动车运送业、考试与日语要求、申请流程与材料、2 号与升级路径、育成就劳制度与新动向、永住与长期在留规划、家属带同与家庭规划、政策更新日志。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：官方统计活值 → 01-ssw-driver（只读引用）；法规条文深度解读 → 09-politics-law；岗位薪资与收入规划 → 07-economy-finance；日语学习计划与考试选择 → 11-language-japanese；现场层执行细节 → 02-career-driver；行业结构与企业动向 → 04-industry-logistics。<\/p>\n<h3 id=\"12\">1.2 受众与用途<\/h3>\n<p>面向拟通过特定技能（SSW）赴日从事货运司机工作、并规划长期在留的读者；输出政策文本解读与影响评估，不构成法律意见；合规应对建议标「建议」，重大合规决策须提示咨询执业法律专业人士（business-config 第二节）。<\/p>\n<h3 id=\"13\">1.3 核心监测问题<\/h3>\n<ol>\n<li>自动车运送业特定技能 1 号的受入上限与在留者规模最新读数如何？<\/li>\n<li>1 号（上限 5 年）之后的升级路径——2 号、技人国、高度专门职——的最新要件与可行性如何？<\/li>\n<li>育成就劳制度（2027-04-01 施行）的进展与对中国国内招募渠道的影响如何？<\/li>\n<li>永住许可要件（令和 8-10-01 改定）与 10 年时间线的关键控制点是什么？<\/li>\n<li>家属带同（家族滞在）与配偶资格外活動許可的最新要件与口径如何？<\/li>\n<\/ol>\n<h3 id=\"14\">1.4 跨主题分工<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>官方统计活值（受入上限、分野在留者数、试验费用）<\/td>\n<td>01-ssw-driver（只读引用）<\/td>\n<\/tr>\n<tr>\n<td>法规条文深度解读<\/td>\n<td>09-politics-law<\/td>\n<\/tr>\n<tr>\n<td>岗位薪资与收入规划<\/td>\n<td>07-economy-finance<\/td>\n<\/tr>\n<tr>\n<td>日语学习计划与考试选择<\/td>\n<td>11-language-japanese<\/td>\n<\/tr>\n<tr>\n<td>现场层执行细节<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>行业结构与企业动向<\/td>\n<td>04-industry-logistics<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特定技能制度与受入上限<\/td>\n<td>1 号 / 2 号制度定位、分野一览与受入上限<\/td>\n<td>核心指标 #1 #2<\/td>\n<td>moj.go.jp / ISA 统计月报<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>考试与日语要求<\/td>\n<td>评价试验、JFT-Basic / JLPT 与驾照规划<\/td>\n<td>核心指标 #3 #4<\/td>\n<td>ClassNK portal / Prometric<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>申请流程与费用<\/td>\n<td>海外申请 / 国内移行、材料清单与费用<\/td>\n<td>核心指标 #5<\/td>\n<td>领馆费用专页<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>2 号与升级路径<\/td>\n<td>2 号要件、1→2 移行与备选资格路径<\/td>\n<td>核心指标 #9<\/td>\n<td>ssw.go.jp / ISA<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>育成就劳制度<\/td>\n<td>2027 年施行的新制度、运用要領与 MOC 名单<\/td>\n<td>核心指标 #6 #7<\/td>\n<td>isa.go.jp / otit.go.jp<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>永住与长期在留<\/td>\n<td>永住要件、取消风险与 10 年时间线<\/td>\n<td>核心指标 #8<\/td>\n<td>isa.go.jp ガイドライン<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>家属带同与家庭规划<\/td>\n<td>家族滞在要件、资格外活動許可与子女衔接<\/td>\n<td>核心指标 #10 #11<\/td>\n<td>moj.go.jp<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：制度与受入上限是入场前提，考试与费用是入场门槛，2 号与升级路径是在留中期的资格切换，育成就劳是并行入场通道，永住与家属是长期定居的两端；受入上限 22,100 ≠ 24,500、MOC 7 国 ≠ 16 国、2 号分野 11 ≠ 16（旧口径）并列不合并。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 特定技能制度与受入上限<\/h3>\n<ul>\n<li>登记册 #1：22,100（2026-01-23 阁议；ssw.go.jp 仍显示 24,500）；登记册 #2：843 人（2026-08 末速报）。<\/li>\n<li>基线报告：特定技能 2019 年 4 月施行（入管法第 2 条の 5）；1 号 19 分野 / 2 号 11 分野；自动车运送业 2024 年度新加入 1 号、无 2 号（铁道、林业、木材产业同样无）。在留上限：1 号各 1 年 / 6 个月 / 4 个月、自动车运送业总上限 5 年；2 号可无限更新。2026-08 末 1 号 843 人、充足率 3.8%；2 号合计 23,348 人、本分野为空。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 考试与日语要求<\/h3>\n<ul>\n<li>登记册 #3：6,500 円；月报至 2026-09（实施国 18、中国大陆无考点）；登记册 #4：10,000 円。基线报告：卡车 = 评价试验 + 第一种驾照 + JFT-Basic（A2.2 相当）或 JLPT N4 以上；出租车·巴士 = 第二种驾照 + 新任驾驶员研修 + N3 以上且 B1 相当以上（2027-04-01 起 COE 申请适用；受入机关落实第 9、10 项措施时可用 JFT-Basic / N4 替代）。<\/li>\n<li>考试与费用：知识试 50 题、45 题以上正确合格；日本国内 6,500 円（税抜）/ 海外 45 美元（部分国家 50 美元）；JFT-Basic 国内 10,000 円；JLPT 中国 N3/N4/N5 450 元、N1/N2 550 元。备考与驾照：中国大陆无 JFT-Basic 考点 → 主攻 JLPT N4（2027 年 7 月场）；外免切替或在日考取第一种驾照（学费约 25–35 万日元、合宿制约 20–30 万日元）。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 申请流程与费用<\/h3>\n<ul>\n<li>登记册 #5：715 元（2026-07-01 起）。<\/li>\n<li>基线报告：两条路径（海外直接申请 / 国内移行）；本人材料 7 项、雇主材料 5 项；在留卡随身携带、地址变更 14 日内报备、每次期满前更新；连续 3 个月不从事原业务 → 资格取消风险；工资·考勤·社保记录长期留存作证据链。风险点：雇主受入计划书认定瑕疵、日语证明与实际能力差距、驾照翻译件不符合要求、支援体制不落实。<\/li>\n<\/ul>\n<h3 id=\"34-2\">3.4 2 号与升级路径<\/h3>\n<ul>\n<li>登记册 #9：11 分野（自动车运送业无 2 号）。基线报告（2026-11-11 重大更正）：2 号仅 11 分野、本分野不在其中，「1 号→2 号」路径不存在；2 号日语 B1 相当以上（2026-01-23 阁议决定；2027-04-01 起 COE 申请；变更·更新待公告）。<\/li>\n<li>长期路径：A 技人国（首选；大学或 10 年经验；白领岗位；N2 隐形门槛）；B 补学历→技人国（2–4 年，兜底）；C 高度专门职（70 分；无学位基本不可达）。高度人材积分：学历 博士 30 / 修士 20 / 大学 10；职历 10 年 20 / 7–10 年 15 / 5–7 年 10；年收 约 400 万 10 起、500 万 15、600 万 20；年龄 30 未满 15 / 30–34 10 / 35–39 5；日语 N1 15 / N2 10。<\/li>\n<li>时间表：Y1–Y2 日语 N2 → Y3 转岗 → Y4 提交技人国变更（最晚）→ Y5 完成变更 → Y6–Y10 收入 / 纳税 / 年金达标 → 永住申请。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 育成就劳制度<\/h3>\n<ul>\n<li>登记册 #6：漁業 2026-11-06、宿泊 10-16、飲食料品・資源循環 10-09 等；自动车运送业 未公布；登记册 #7：16 国（中国不在名单内）。基线报告：2024-06-21 公布改正法，技能实习（约 40 年历史）将被育成就劳取代；2027-04-01 施行（技能实习法废止），1 号支援体制要件改正同步生效。<\/li>\n<li>核心机制：3 年内移行特定技能为目标；育成阶段可跨企业、跨地区转职；原则上仅从 MOC 签署国接收。MOC 口径（2026-11-12 核验）：ISA 页 7 国（乌兹别克、斯里兰卡、泰国、孟加拉、越南、东帝汶、老挝）vs OTIT 16 国（含暂定），均不含中国。对本案：已有 N4 + 驾照直接走 1 号更优；日语 / 技能暂不达标可走育成就劳；已持技能实习关注 2027 衔接。<\/li>\n<\/ul>\n<h3 id=\"36\">3.6 永住与长期在留<\/h3>\n<ul>\n<li>登记册 #8：令和 8-10-01 改定（2027-04-01 起申请适用）：世帯年収・年金受給見込・日本語 B1・制度理解。基线报告：永住原则 连续 10 年（其中 5 年就劳）+ 世帯年收达标 + 公的义务履行 + 年金受給見込額 + 日语能力；2024 改正新增永住取消（连续 3 年以上未履行纳税或社保等）。<\/li>\n<li>10 年时间线：Y0 1 号入境 → Y1–5 更新（≤5 年）→ Y5 切换其他在留资格（2 号不可用）→ Y6–10 新资格 + 收入达标 → Y10 永住申请。关键控制点：Y5 前完成资格切换（推断：失败则须离境、连续性中断）；世帯年收管理；公的义务零瑕疵；再入国期限。备选路径：1 号→技人国→永住（已确认主线，约 10 年）；补学历（不启用）；高度专门职（3 年 / 1 年）。<\/li>\n<\/ul>\n<h3 id=\"37\">3.7 家属带同与家庭规划<\/h3>\n<ul>\n<li>登记册 #10：扶养人限定为特定就劳资格·留学等持有者的配偶·子；须附扶养者职业·收入证明；年收门槛无官方数值——待复核。登记册 #11：包括许可 1 周 28 小时以内；个别许可从事期间不超在留期间过半。基线报告：1 号原则上不可带家属（官方中文站「无法申请家人陪同」）；家族滞在在留期间不超过 5 年，扶养人变更时同步办理。<\/li>\n<li>配偶资格外活動許可：包括许可（周 28 小时以内，仅需申请书）/ 个别许可；超过 28 小时可能判定在留目的实质变更（推断）。<\/li>\n<li>子女：带同最佳时点（推断）与技人国变更（Y4–Y5）同步；高中毕业后可变更为定住者（要件）或经特定活动过渡。财务：世帯年収按同一生计世帯审查；家族滞在成员收入不计入；世帯人数抬高门槛；带同使 Y6–Y10 门槛上升（推断）。<\/li>\n<\/ul>\n<h3 id=\"38\">3.8 数据冲突并列（不可合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>受入上限<\/td>\n<td>22,100（现行，moj.go.jp）≠ 24,500（ssw.go.jp 中文页未同步）<\/td>\n<\/tr>\n<tr>\n<td>MOC 国家<\/td>\n<td>ISA MOC 页（7 国）≠ OTIT 認定送出機関一览（16 国，含暂定）<\/td>\n<\/tr>\n<tr>\n<td>2 号分野<\/td>\n<td>11 分野（不含自动车运送业）≠ 16 分野（旧口径）<\/td>\n<\/tr>\n<tr>\n<td>家族滞在<\/td>\n<td>扶养人资格范围 ≠ 收入证明口径（年收门槛无官方数值）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"39\">3.9 未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #10 年收门槛无官方数值——待复核；1 号带同例外适用细则——待复核；永住指南「年収水準」按世帯人数的具体数值运用实例——待跟踪。<\/li>\n<li>2026-10-09 要領別冊 新旧対照表（001472544.pdf）未取得——待复核；B1 变更·更新适用时间——待公告。<\/li>\n<li>外食业\"目前已停止接收\"依据——待复核；自动车运送业育成就劳运用要领——未公布；2029-03 上限到期后的政策延续、中国 MOC 签署、ISA / OTIT 更新时差——待跟踪。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ul>\n<li><strong>结论 1<\/strong>：自动车运送业 1 号受入上限为 22,100 人（至 2029-03 末），2026-08 末在留 843 人、充足率 3.8%。证据：登记册 #1 #2；ISA 原件（2026-08 末速报）。标注：事实。<\/li>\n<li><strong>结论 2<\/strong>：该分野无特定技能 2 号，1 号→2 号路径不存在；长期主线为 1 号→技人国→永住（约 10 年）。证据：登记册 #9；基线报告 05 / 07 章（2026-11-11 重大更正）。标注：事实。<\/li>\n<li><strong>结论 3<\/strong>：育成就劳 2027-04-01 施行，MOC 名单均不含中国——育成就劳渠道目前无法从中国招募。证据：登记册 #6 #7；基线报告 06 章（2026-11-12 核验）。标注：事实。<\/li>\n<li><strong>结论 4<\/strong>：永住许可要件在令和 8-10-01 改定后新增世帯年収、年金受給見込額、日本語能力考量。证据：登记册 #8；基线报告 07 章。标注：事实。<\/li>\n<li><strong>结论 5<\/strong>：特定技能 1 号期间不能带家属，家庭规划须安排在技人国变更完成之后。证据：登记册 #10 #11；基线报告 08 章。标注：事实（制度要件）；带同时点为推断。<\/li>\n<li><strong>结论 6<\/strong>：司机路线的现实永住时间线取决于第 5 年能否成功转换资格，而非自动延续。证据：基线报告 05 / 07 章（推断）。标注：推断。<\/li>\n<\/ul>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>登记册 #10 年收门槛无官方数值，家族滞在扶养能力审查口径不明；2026-10-09 要領別冊 新旧对照表未取得、B1 变更·更新适用时间待公告。<\/li>\n<li>外食业\"目前已停止接收\"依据待复核；自动车运送业育成就劳运用要领未公布；2029-03 接收上限到期后的政策延续不明。<\/li>\n<li>基线报告信息核对日期为 2026-11-11 / 11-12，制度更新频繁。<\/li>\n<\/ul>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>（分析层）：<\/p>\n<ol>\n<li>自动车运送业 1 号受入上限与在留者数的最新读数如何（843 人是否增长）？<\/li>\n<li>2026-10-09 要領別冊 改正的課加条件·様式追加影响如何？<\/li>\n<li>特定技能 2 号及出租车·巴士 B1 要求的变更·更新适用时间何时公告？<\/li>\n<li>自动车运送业育成就劳运用要领何时公布、内容如何？<\/li>\n<li>永住指南「年収水準」的具体数值基准运用实例何时明确？<\/li>\n<li>2029-03 接收上限到期后的政策延续方向如何？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：登记册 #10 年收门槛；要領別冊 新旧对照表；B1 变更·更新适用时间；育成就劳运用要领；永住年収水準实例；2029-03 上限到期；中国 MOC。<strong>数据补全计划<\/strong>：登记册 #10 待复核项在年度台账复盘前补齐；建立受入上限 22,100 / 24,500 与 MOC 7 国 / 16 国的双口径并列台账；对政策更新日志待跟踪清单逐项核对。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>特定技能受入上限（自動车运送业）<\/td>\n<td>22,100（2026-01-23 阁议；ssw.go.jp 仍显示 24,500）<\/td>\n<td>moj.go.jp 运用方针<\/td>\n<td>2026-01-23 阁议<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>分野在留者数<\/td>\n<td>843 人（2026-08 末速报）<\/td>\n<t
