司不提供轮岗<\/td>\n<td>第 3 年转职评估（路径 B）<\/td>\n<\/tr>\n<tr>\n<td>N2 两次未过<\/td>\n<td>接受 N3 状态进入主任竞聘（N2 非法定门槛），N2 改为长期目标<\/td>\n<\/tr>\n<tr>\n<td>2 号移行要件不满足<\/td>\n<td>用 1 号剩余年数续驾驶 + 提前考 2 号试验；必要时咨询行政书士<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>成果档案（手册 05，建议）<\/strong>：管理活动月度记录表（发言 / 議事録 / 带人、改善提案、采用结果；原始运营数字引用司机手册同月记录，避免两处各写一套）；STAR 成果卡（年度目标至少 4 张，示例数字「误出库率 0.3%→0.05%」为<strong>示例、非事实<\/strong>）；晋升面谈材料包（第 4 年 Q2 组装）；外部评价背书（表彰状 / 感谢状扫描、客户好评书面确认、研修修了证）。<\/p>\n<p><strong>风险提示（事实＋推断）<\/strong>：资格≠岗位；管理岗仍属特定技能框架内时业务范围受限——从「驾驶」扩展到「辅助管理」需确认雇主在受入计划书中的业务记载；若走 2 号，2 号业务本质仍是驾驶，真正的管理岗跳转可能需在留资格变更（如技术·人文·国际业务，需学历或 10 年实务），提前与行政书士咨询（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">../08-visa-immigration/reports/2026-11-visa-immigration.md<\/a>）。<\/p>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：<\/p>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：运行管理者试验中心（unkan.or.jp，2026）——运行管理者设置标准与试验路径。<\/li>\n<li><strong>B 级（权威机构 / 行情）<\/strong>：本主题无 B 级转引数据。<\/li>\n<li><strong>C 级（平台 / 转载）<\/strong>：本主题无 C 级抽样数据；求人门户管理岗频道（含 / 不含手当口径）为预期指标，尚未采集。<\/li>\n<\/ul>\n<p><strong>已知口径冲突（并列呈现，不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>管理岗求人薪资<\/td>\n<td>求人门户标注（含 / 不含手当）≠ 实收<\/td>\n<\/tr>\n<tr>\n<td>讲习 / 试验 / 选任<\/td>\n<td>讲习修了 ≠ 试验合格 ≠ 选任<\/td>\n<\/tr>\n<tr>\n<td>管理成果<\/td>\n<td>活动数量（发言 / 議事録 / 带人）≠ 业务结果（准点率 / 误出库率）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：登记册 #1 #2 #3（待基线确立）、#4（待记录）；首期企业样本待基线运行后补记；手册 04 讲习费用「数千円」待核验；STAR 卡示例数字为示例非事实。<\/p>\n<p><strong>风险与不确定性<\/strong>：无统计活值、无企业样本、无求人薪资数据，全部结论为方法论与路径推断；48 个月时间轴以「司机入职约 2027 年秋」为假设起点，存在个人进度偏差；2 号移行与在留资格变更的官方口径未逐项核实（交叉引用 08-visa-immigration）。<\/p>\n<h3 id=\"_11\"><a id=\"待复核清单\" aria-hidden=\"true\"><\/a>待复核清单<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>目标企业（日通 / 佐川 / 雅玛多 / SGHD 等）管理岗采用条件的官网口径<\/td>\n<td>各企业官网采用页（来源优先级 ③）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>运行管理者试验与基础讲习的日程、费用与合格路径<\/td>\n<td>运行管理者试验中心 https://www.unkan.or.jp/ ；全日本トラック協会 / 都道府県<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>管理岗求人薪资的门户数据（含 / 不含手当）<\/td>\n<td>求人门户管理岗频道（来源优先级 ④，预期指标）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人晋升档案首条记录与 KPI 表建立<\/td>\n<td>手册 05 成果档案模板（自记录）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>手册 04 讲习费用「数千円」的官方数额<\/td>\n<td>讲习实施机构当期公示（经 10-education-qualification 主责核对）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>2 号移行要件与在留资格变更的官方口径<\/td>\n<td><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">../08-visa-immigration/reports/2026-11-visa-immigration.md<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://www.unkan.or.jp/about.html\">运行管理者试验中心<\/a> — 运行管理者设置标准（每 15 台车 1 名）与试验路径，2026。<\/li>\n<li><a href=\"https://www.mlit.go.jp/\">国土交通省<\/a> — 运送事业制度、安全管理（来源优先级 ①），2026。<\/li>\n<\/ol>\n<p><strong>权威机构<\/strong>：<\/p>\n<ol>\n<li>日本ロジスティクスシステム協会、全日本トラック協会 — 管理者讲习 / 安全管理责者讲习日程（来源优先级 ②），具体 URL 待补。<\/li>\n<\/ol>\n<p><strong>企业官网 / IR<\/strong>：<\/p>\n<ol>\n<li>日通、佐川、雅玛多、SGHD 官网采用页 / IR — 职级与采用信息（来源优先级 ③），样本待基线补记。<\/li>\n<\/ol>\n<p><strong>行业媒体<\/strong>：<\/p>\n<ol>\n<li>LNEWS、物流ウィークリー — 行业动态须回溯核验（来源优先级 ⑤），本期未引用具体报道。<\/li>\n<\/ol>\n<p><strong>内部知识库（本主题）<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/03-career-management/data/career_logistics_indicator_registry.md\">03-career-management 指标登记册<\/a> — 活值与边界档案，2026-11-12（2026-11-14 结构拆分后维护）。<\/li>\n<li>03-career-management 知识手册（handbook/01–05，拆分整理版）— 2026-11-14；原合并版存档 <code>reports/archives/2026-11-career-management-merged-v1.0.md<\/code>（2026-11-12）。<\/li>\n<\/ol>\n<p><strong>交叉引用主题<\/strong>：<\/p>\n<ol>\n<li><a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver 报告<\/a> — 现场层执行细节（点呼 / 点检 / 安全制度），只读引用。<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration 报告<\/a> — 2 号移行 / 永住证据链，只读引用。<\/li>\n<li><a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification 报告<\/a> — 资格日程与费用主责方，只读引用。<\/li>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 报告<\/a> — 官方统计活值（工资 / 缺口 / 求人倍率），只读引用。<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 149, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "03-career-management/reports/2026-11-career-management.html"}}}, "industry-logistics": {"name": "物流行业", "dir": "04-industry-logistics", "months": {"2026-11": {"title": "日本物流行业 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本物流行业--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本物流行业 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：行业深度研究型（industry-research）\n<strong>受众定位<\/strong>：面向在日本物流行业就业 / 拟进入该行业的个人，不以投资决策为视角；服务本规划「阶段 4 技术 / 数字化扩展」的行业判断，并为阶段 1–3 的雇主选择与岗位路线提供行业坐标。\n<strong>来源规则<\/strong>：官方一手优先：① 国土交通省（mlit.go.jp 物流白書・政策パッケージ）、内閣府・cas.go.jp ＞ ② 行业机构（帝国データバンク、日本物流団体連合会、JILPT）＞ ③ 研究机构（智库、日銀 SPPI）＞ ④ 主要企业 IR ＞ ⑤ 媒体（仅用于发现线索，须回溯原文）；中文来源仅作线索。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要<\/a>\n<a href=\"#s2\">二、研究范围与方法<\/a>\n<a href=\"#s3\">三、产业链图谱<\/a>\n<a href=\"#s4\">四、市场规模与格局<\/a>\n<a href=\"#s5\">五、头部玩家与竞争格局<\/a>\n<a href=\"#s6\">六、驱动因素与风险<\/a>\n<a href=\"#s7\">七、趋势判断（推断）<\/a>\n<a href=\"#s8\">八、数据治理与局限<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要\" aria-hidden=\"true\"><\/a>一、执行摘要<\/h2>\n<h3 id=\"_2\"><a id=\"核心结论\" aria-hidden=\"true\"><\/a>核心结论<\/h3>\n<p><strong>结论 1<\/strong>：日本物流呈\"少数大手 + 海量零细\"的二元结构。证据：30 辆以下中小事業者占 85%（トラック白書，时点待更新）；物流业规模约 28 兆日元 / 229 万人（物团连，令和 2 年度）。标注：事实。<\/p>\n<p><strong>结论 2<\/strong>：增长赛道优先级为 3PL 仓库 SV ＞ 冷链 ＞ 宅配分拣中心 ＞ 绿色物流。证据：本规划视角的赛道优先级排序。标注：事实（规划排序，非行业统计）。<\/p>\n<p><strong>结论 3<\/strong>：自动化按\"干线先于末端、岗位重组而非消失\"的渐进路径推进，转型窗口在当下。证据：行业级结论；新東名深夜優先レーン 2025-03 起运营（国交省）；\"全职司机消失被预期为 2030 年代以后\"。标注：事实（行业级结论与实证状态）；其中\"2030 年代以后\"为预期性表述。<\/p>\n<p><strong>结论 4<\/strong>：道路货运价格处于上行读数。证据：SPPI 道路货运指数 113.3（+4.6%）（日銀 SPPI，时点待核验）。标注：推断（+4.6% 的口径与月次未核验前，仅作方向性判读）。<\/p>\n<p><strong>结论 5<\/strong>：司机缺口是最大结构性约束。证据：2030 年度 162,912 人（约 16 万）推算（国交省检讨会中间总结（NX 总研试算），2022 年推计）；趋势栏标注\"持续关注修正\"。标注：推算值本身为事实；作为约束的判断为推断。<\/p>\n<h3 id=\"_3\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">追踪项（登记册）<\/th>\n<th style=\"width:20%\">活值（来源/年份）<\/th>\n<th style=\"width:20%\">基准版本<\/th>\n<th style=\"width:20%\">变动情况<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>物流白書最新版年份与关键数<\/td>\n<td>待基线确立（mlit.go.jp）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>SPPI 道路货运指数<\/td>\n<td>113.3（+4.6%，锚 01-ssw-driver #8）（日銀 SPPI）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>物流倒産件数（年度）<\/td>\n<td>FY2025 321 件／TSR 308 件（帝国データバンク / 東京商工リサーチ）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>EC / 冷链 / 3PL 市场规模估计<\/td>\n<td>待基线确立（智库报告）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>观察项与触发器状态（登记册同名节）：唯一观察项、首要触发器、触发器结论均为「首期为空」，截至 2026-11-14 无更新。<\/p>\n<h3 id=\"_4\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告（2026-11-13 基准）已修正事实清单，无新增修正；历史报告未载已修正事实条目。<\/p>\n<h2 id=\"s2\"><a id=\"二研究范围与方法\" aria-hidden=\"true\"><\/a>二、研究范围与方法<\/h2>\n<h3 id=\"_6\"><a id=\"监测范围\" aria-hidden=\"true\"><\/a>监测范围<\/h3>\n<p><strong>含<\/strong>：道路货物运送业（トラック・宅配便・路線貨物）、倉庫業・3PL（受託物流）、冷链（コールドチェーン）、国際物流・フォワーディング、物流自動化的产业面（导入率、投资、企业动向）。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：自动驾驶技术路线、法规与实装细节（→ <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>）；个人技能地图、岗位行情、转型路径（→ <a href=\"../../06-industry-technology/reports/2026-11-industry-technology.md\">06-industry-technology<\/a>）；在留资格、特定技能制度细节（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）；行业法规条文与政策解读（→ <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>）；经济与收入环境（→ <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>）。<\/p>\n<h3 id=\"_7\"><a id=\"受众与视角\" aria-hidden=\"true\"><\/a>受众与视角<\/h3>\n<p>面向在日本物流行业就业 / 拟进入该行业的个人，保持中性全景刻画，不给投资评级、不出具 Go/No-Go 决策建议（边界归投资尽调型、可行性型）；趋势判断一律标「推断」。<\/p>\n<h3 id=\"_8\"><a id=\"核心监测问题\" aria-hidden=\"true\"><\/a>核心监测问题<\/h3>\n<ol>\n<li>日本物流产业的规模与结构（营业收入、从业人数、事业者数）最新读数是多少，\"少数大手 + 海量零细\"的二元结构是否延续？<\/li>\n<li>EC / 冷链 / 3PL 三条增长赛道的市场规模与就业形态如何演化？<\/li>\n<li>物流自动化的产业面（导入率、投资、企业动向）进展到哪一步，对岗位结构的影响路径如何？<\/li>\n<li>SPPI 道路货运指数、物流倒産件数等价格与结构指标的最新读数与趋势如何？<\/li>\n<li>「物流 2024 年问题」对策（司机时间外规制）对运力与运价的传导进展如何？<\/li>\n<\/ol>\n<h3 id=\"_9\"><a id=\"方法维度拆解与验证链条\" aria-hidden=\"true\"><\/a>方法：维度拆解与验证链条<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>产业规模与结构<\/td>\n<td>营业收入、从业人数、事业者数与二元结构<\/td>\n<td>核心指标 #1<\/td>\n<td>物流白書、物团连、トラック白書<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>增长赛道规模<\/td>\n<td>EC / 冷链 / 3PL 分赛道规模与驱动<\/td>\n<td>核心指标 #4<\/td>\n<td>智库报告、行业团体<\/td>\n<td>事件插刷（权威新估计）<\/td>\n<\/tr>\n<tr>\n<td>自动化与技术趋势（产业面）<\/td>\n<td>导入率、投资、企业动向与岗位结构影响<\/td>\n<td>观察项<\/td>\n<td>国交省モビリティ・ロードマップ、行业团体<\/td>\n<td>季度扫描<\/td>\n<\/tr>\n<tr>\n<td>行业数据<\/td>\n<td>SPPI、倒産件数、運賃<\/td>\n<td>核心指标 #2 / #3<\/td>\n<td>日銀 SPPI、帝国データバンク<\/td>\n<td>月度（SPPI）+ 季度汇总<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：产业规模与结构是基础盘，增长赛道是结构变化的先行信号，自动化是驱动结构变化的中期变量，行业数据（SPPI、倒産件数）是高频验证指标；四者构成\"规模—赛道—技术—数据\"的验证链条，数据冲突时以官方一手来源优先，并列呈现不合并。<\/p>\n<p>来源优先级与核验分级见第九节、第八节；官方统计活值（SPPI / 倒産 / 2024 年問題）以 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 登记册为只读交叉验证锚，本主题不独立回写。细分知识手册见 <a href=\"../handbook/00-navigation.md\">handbook/<\/a>。<\/p>\n<h2 id=\"s3\"><a id=\"三产业链图谱\" aria-hidden=\"true\"><\/a>三、产业链图谱<\/h2>\n<h3 id=\"_11\"><a id=\"分层口径\" aria-hidden=\"true\"><\/a>分层口径<\/h3>\n<pre><code>上游：车辆 / 仓储设备 / 燃料 / 物流信息系统\n中游：运输（幹線・路線）・倉庫・3PL・宅配\n下游：荷主（製造・小売・EC・医薬 / 生鮮）\n<\/code><\/pre>\n<h3 id=\"_12\"><a id=\"上中下游构成\" aria-hidden=\"true\"><\/a>上中下游构成<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">层<\/th>\n<th style=\"width:33%\">构成<\/th>\n<th style=\"width:34%\">关键议题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>上游<\/td>\n<td>车辆、仓储设备、燃料、物流信息系统<\/td>\n<td>自动化与 EV 导入成本、系统 SaaS 化<\/td>\n<\/tr>\n<tr>\n<td>中游<\/td>\n<td>运输（幹線・路線）、倉庫、3PL、宅配<\/td>\n<td>2024 年問題、司机缺口、共同配送<\/td>\n<\/tr>\n<tr>\n<td>下游<\/td>\n<td>荷主（製造・小売・EC・医薬 / 生鮮）<\/td>\n<td>荷主转嫁改革、EC 化率、医药 / 生鲜温控要求<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_13\"><a id=\"细分赛道\" aria-hidden=\"true\"><\/a>细分赛道<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">赛道<\/th>\n<th style=\"width:33%\">代表企业<\/th>\n<th style=\"width:34%\">特点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>综合物流（3PL/国际）<\/td>\n<td>NIPPON EXPRESS（日通）、センコー、日本ロジスティクス<\/td>\n<td>全案受托，管理岗/技术岗最多<\/td>\n<\/tr>\n<tr>\n<td>宅配便<\/td>\n<td>ヤマト運輸、佐川急便（SGHD）、日本郵便<\/td>\n<td>EC 驱动，分拣中心自动化程度最高<\/td>\n<\/tr>\n<tr>\n<td>路线货运/干线<\/td>\n<td>福山通运、西濃運輸、名鉄運輸<\/td>\n<td>干线+区域，司机培养体系成熟<\/td>\n<\/tr>\n<tr>\n<td>冷链<\/td>\n<td>各大手冷链部门 + 专业者（ニチレイロジ等）<\/td>\n<td>医药/生鲜高要求高附加值<\/td>\n<\/tr>\n<tr>\n<td>仓储（保管業）<\/td>\n<td>グローバルゲート、ロジクエスト等仓库特化企业<\/td>\n<td>3PL 仓库多在地方立地<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四市场规模与格局\" aria-hidden=\"true\"><\/a>四、市场规模与格局<\/h2>\n<h3 id=\"_15\"><a id=\"产业规模与结构多口径并列\" aria-hidden=\"true\"><\/a>产业规模与结构（多口径并列）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">数值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<th style=\"width:20%\">核验状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>物流业界主要业种营业收合计<\/td>\n<td>约 28 兆日元<\/td>\n<td>全日本货物流通促进协会（物团连）<\/td>\n<td>令和 2 年度<\/td>\n<td>已核验（活值）<\/td>\n<\/tr>\n<tr>\n<td>物流业从业人数<\/td>\n<td>约 229 万人<\/td>\n<td>同上<\/td>\n<td>令和 2 年度<\/td>\n<td>已核验（活值）<\/td>\n<\/tr>\n<tr>\n<td>道路货物运送业营业收<\/td>\n<td>约 21.6 兆日元（2.6 万社调查）<\/td>\n<td>東京商工リサーチ（TSR）<\/td>\n<td>2021<\/td>\n<td>已核验（活值）<\/td>\n<\/tr>\n<tr>\n<td>卡车运送事业者数<\/td>\n<td>约 62,000 社<\/td>\n<td>トラック白書<\/td>\n<td>待更新<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>中小事業者占比（30 辆以下口径）<\/td>\n<td>85%<\/td>\n<td>トラック白書<\/td>\n<td>待更新<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>司机缺口（2030 年度推算）<\/td>\n<td>162,912 人（约 16 万）<\/td>\n<td>国交省检讨会中间总结（NX 总研试算）<\/td>\n<td>2022 年推计<\/td>\n<td>已核验（推算值）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>结构性结论（事实）：日本物流是\"少数大手 + 海量零细\"的二元结构；个人职业策略上——大手学制度、中小拿机会。<\/p>\n<h3 id=\"ec-3pl\"><a id=\"增长赛道ec--冷链--3pl--绿色物流\" aria-hidden=\"true\"><\/a>增长赛道（EC / 冷链 / 3PL / 绿色物流）<\/h3>\n<p><strong>EC 物流<\/strong>：驱动力为 EC 化率持续上升（食品、日用品带动）与宅配便处理量长期高位；就业形态为宅配司机（ルート）、分拣中心（仕分けセンター）作业与 line 管理、客服对应；特征为自动化最前沿——大手宅配的分拣中心大量导入自动分拣机、AMR 机器人；注意点为再配达対応、クレーム对应等客户接触强度高，日语要求高于普通货运。<\/p>\n<p><strong>冷链<\/strong>：驱动力为生鮮 EC、医药（ワクチン / 医药品 GSP）、外食供应链；岗位属性为温度带管理（冷藏 / 冷冻 / 定温）、温度记录与验证、HACCP 意识；薪资通常高于常温岗位（具体薪资结构与谈判口径归 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>）；个人机会为冷链经验是稀缺技能标签（司机→冷链组长→品質管理辅助）；风险为温度异常的责任归属要在契约层面确认。<\/p>\n<p><strong>3PL<\/strong>：定义为荷主企业将物流全案外包——仓储 + 运输 + 系统 + 人员管理一揽子；岗位谱系为现场作业、SV（supervisor）、WMS 操作、KPI 报告担当、荷主折冲；对外国人最友好的增长点为语言多样性与现场翻译·带人能力是显性价值。<\/p>\n<p><strong>绿色物流<\/strong>：政策为 2050 碳中和目标 → EV / 氢燃料卡车导入、ECO 驾驶普及、共同配送；岗位影响为 ECO 驾驶数据管理、充电 / 加氢设施运营、燃费 KPI。<\/p>\n<h3 id=\"_16\"><a id=\"赛道优先级本规划视角\" aria-hidden=\"true\"><\/a>赛道优先级（本规划视角）<\/h3>\n<pre><code>优先级1：3PL 仓库 SV      （管理×数字交叉点，阶段 3→4 的桥）\n优先级2：冷链专业经验     （稀缺标签，随时可叠加）\n优先级3：宅配分拣中心     （自动化暴露量最大，利于学技术）\n优先级4：绿色物流实绩     （作为附加成果，非独立赛道）\n<\/code><\/pre>\n<h2 id=\"s5\"><a id=\"五头部玩家与竞争格局\" aria-hidden=\"true\"><\/a>五、头部玩家与竞争格局<\/h2>\n<h3 id=\"_18\"><a id=\"玩家清单与入选标准\" aria-hidden=\"true\"><\/a>玩家清单与入选标准<\/h3>\n<p>入选标准：上市或公开数据可得的行业代表企业，按综合物流 / 宅配 / 干线 / 冷链 / 仓储分层；进出须留痕。首期清单：日本通運、SGHD（佐川急便）、ヤマト運輸、日本郵便、福山通運、西濃運輸、名鉄運輸、センコー、日本ロジスティクス、ニチレイロジ、グローバルゲート、ロジクエスト。<\/p>\n<h3 id=\"_19\"><a id=\"分层竞争格局\" aria-hidden=\"true\"><\/a>分层竞争格局<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">分层<\/th>\n<th style=\"width:33%\">代表企业<\/th>\n<th style=\"width:34%\">格局特征<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>综合物流（3PL/国际）<\/td>\n<td>日本通運、センコー、日本ロジスティクス<\/td>\n<td>全案受托，管理岗/技术岗最多<\/td>\n<\/tr>\n<tr>\n<td>宅配便<\/td>\n<td>ヤマト運輸、佐川急便（SGHD）、日本郵便<\/td>\n<td>EC 驱动，分拣中心自动化程度最高<\/td>\n<\/tr>\n<tr>\n<td>路线货运/干线<\/td>\n<td>福山通運、西濃運輸、名鉄運輸<\/td>\n<td>干线+区域，司机培养体系成熟<\/td>\n<\/tr>\n<tr>\n<td>冷链<\/td>\n<td>各大手冷链部门 + ニチレイロジ等专业者<\/td>\n<td>医药/生鲜高要求高附加值<\/td>\n<\/tr>\n<tr>\n<td>仓储（保管業）<\/td>\n<td>グローバルゲート、ロジクエスト等<\/td>\n<td>3PL 仓库多在地方立地<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_20\"><a id=\"竞争格局要点\" aria-hidden=\"true\"><\/a>竞争格局要点<\/h3>\n<ol>\n<li><strong>二元结构<\/strong>：少数大手 + 海量零细（30 辆以下中小占 85%），个人职业策略上大手学制度、中小拿机会。<\/li>\n<li><strong>自动化前沿在宅配分拣中心<\/strong>：大手宅配大量导入自动分拣机、AMR 机器人，是\"会用新系统的人\"的最短暴露路径。<\/li>\n<li><strong>3PL 是管理岗与数字化岗位的交叉点<\/strong>：3PL 仓库 SV 被评估为阶段 3→4 的桥（管理岗路径归 <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>）。<\/li>\n<li><strong>产业面与技术面的分工<\/strong>：本主题只写产业面（规模、赛道、企业动向）；技术路线与法规细节归 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>。<\/li>\n<\/ol>\n<h2 id=\"s6\"><a id=\"六驱动因素与风险\" aria-hidden=\"true\"><\/a>六、驱动因素与风险<\/h2>\n<h3 id=\"_22\"><a id=\"政策大方向\" aria-hidden=\"true\"><\/a>政策大方向<\/h3>\n<ol>\n<li><strong>物流 2024 年问题<\/strong>：司机时间外规制 → 运力不足 → 运费上涨、荷主负担转嫁改革 → 具体进展以 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 登记册为准（只读锚）。<\/li>\n<li><strong>省人化省力化<\/strong>：自动驾驶卡车、仓库自动化、无人配送 → 技术面归 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>。<\/li>\n<li><strong>地域物流再生<\/strong>：人口稀疏地区配送维持 → 外国人材 + 共同配送。<\/li>\n<li><strong>外国人材受入扩大<\/strong>：特定技能（自动车运送业受入上限现行 22,100 人 / 5 年，2024–2029；使用率待查）+ 2027 育成就劳 → 制度细节归 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>。<\/li>\n<\/ol>\n<h3 id=\"_23\"><a id=\"自动化产业面三条行业级结论\" aria-hidden=\"true\"><\/a>自动化产业面（三条行业级结论）<\/h3>\n<ol>\n<li><strong>干线先于末端<\/strong>：高速干线（夜间、点对点）是最早被改造的场景；城市 / 最后一公里配送的自动化更远。<\/li>\n<li><strong>岗位不是消失而是重组<\/strong>：长途司机转向监控员 / 编组担当 / 中継司机；仓库纯体力岗减少，设备运营与数据岗增加；运行管理 / 配车岗位反而增强。<\/li>\n<li><strong>转型窗口在当下<\/strong>：全职司机消失被预期为 2030 年代以后，但\"会用新系统的人\"从今天就能开始积累。<\/li>\n<\/ol>\n<h3 id=\"10\"><a id=\"岗位结构影响矩阵10-年预期\" aria-hidden=\"true\"><\/a>岗位结构影响矩阵（10 年预期）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">岗位<\/th>\n<th style=\"width:33%\">10 年预期<\/th>\n<th style=\"width:34%\">个人对策<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>长途干线司机<\/td>\n<td>被自动化改造<\/td>\n<td>避免把干线城市线作为 15 年职业锚<\/td>\n<\/tr>\n<tr>\n<td>城市/路线配送司机<\/td>\n<td>长期稳定<\/td>\n<td>主线保留<\/td>\n<\/tr>\n<tr>\n<td>仓库体力作业<\/td>\n<td>逐渐减少<\/td>\n<td>尽早转向设备/系统侧<\/td>\n<\/tr>\n<tr>\n<td>运行管理/配车<\/td>\n<td>增强（多模运输编组复杂化）<\/td>\n<td>本规划主线方向正确<\/td>\n<\/tr>\n<tr>\n<td>系统运管/DX<\/td>\n<td>高增长<\/td>\n<td>阶段 4 主攻<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_24\"><a id=\"其他实证与制度读数\" aria-hidden=\"true\"><\/a>其他实证与制度读数<\/h3>\n<ul>\n<li>新東名自动驾驶实证：深夜優先レーン运营中（国交省，2025-03 起；扩大区间待观察）。<\/li>\n<li>西濃運輸 × T2 中継输送自动驾驶实证开始（岐阜，2026-11-11 建档记录）。<\/li>\n<li>自动车运送业特定技能受入：上限 22,100 人 / 5 年（现行，ISA，2024–2029；使用率待查）。<\/li>\n<\/ul>\n<h3 id=\"_25\"><a id=\"风险与不确定性\" aria-hidden=\"true\"><\/a>风险与不确定性<\/h3>\n<ul>\n<li>登记册 #1、#4 待基线确立，规模与赛道判断缺权威锚。<\/li>\n<li>SPPI 未标月次、WebKit 運賃指数无数值，運賃趋势无法交叉验证。<\/li>\n<li>物团连（令和 2 年度）与 TSR（2021）口径与时点不一致，不可合并。<\/li>\n<li>司机缺口为 2022 年推计推算值，存在修正风险。<\/li>\n<li>中文来源仅作线索，须回溯日文官方原文。<\/li>\n<\/ul>\n<h2 id=\"s7\"><a id=\"七趋势判断推断\" aria-hidden=\"true\"><\/a>七、趋势判断（推断）<\/h2>\n<blockquote>\n<p>本节为推断层，与上文事实层分离；推断依据为历史报告结论与登记册活值，存在修正风险。<\/p>\n<\/blockquote>\n<ol>\n<li><strong>二元结构延续（推断）<\/strong>：中小事業者占比 85% 的结构性读数未出现反转信号，\"少数大手 + 海量零细\"预计延续。<\/li>\n<li><strong>自动化渐进改造（推断）<\/strong>：干线先于末端、岗位重组而非消失的路径判断维持；\"全职司机消失被预期为 2030 年代以后\"为预期性表述，不作为确定时点。<\/li>\n<li><strong>道路货运价格方向性上行（推断）<\/strong>：SPPI 113.3（+4.6%）在月次与口径未核验前，仅作方向性判读，不作幅度外推。<\/li>\n<li><strong>司机缺口构成中期约束（推断）<\/strong>：162,912 人（2022 年推计）作为结构性约束的判断为推断；官方修正可能改变幅度。<\/li>\n<li><strong>增长赛道分化（推断）<\/strong>：3PL、冷链、宅配分拣中心受自动化与 EC 驱动快于干线零细市场；绿色物流作为附加成果而非独立赛道。<\/li>\n<\/ol>\n<h2 id=\"s8\"><a id=\"八数据治理与局限\" aria-hidden=\"true\"><\/a>八、数据治理与局限<\/h2>\n<h3 id=\"_28\"><a id=\"核验程度分级\" aria-hidden=\"true\"><\/a>核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：国土交通省（物流白書・政策パッケージ、モビリティ・ロードマップ）、日銀 SPPI、国土交通省検討会中間とりまとめ、ISA。<\/li>\n<li><strong>B 权威转引 / 行业机构<\/strong>：全日本货物流通促进协会（物团连）、東京商工リサーチ、全国トラック協会（トラック白書）、帝国データバンク、智库报告。<\/li>\n<li><strong>C 平台抽样<\/strong>：本主题登记册无此类指标；媒体来源（LNEWS 等）仅用于发现线索，须回溯原文并标「需核实原文」。<\/li>\n<\/ul>\n<h3 id=\"_29\"><a id=\"口径冲突并列清单不合并不取均值\" aria-hidden=\"true\"><\/a>口径冲突并列清单（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">并列口径<\/th>\n<th style=\"width:34%\">处理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>产业规模<\/td>\n<td>物团连（令和 2 年度，物流业营业收入 约 28 兆円）≠ TSR（2021，道路货物运送业营业收入 约 21.6 兆円）<\/td>\n<td>并列呈现，不可相减<\/td>\n<\/tr>\n<tr>\n<td>倒産<\/td>\n<td>帝国データバンク ≠ 東京商工リサーチ<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>運賃<\/td>\n<td>日銀 SPPI ≠ WebKit 運賃指数<\/td>\n<td>禁止混算<\/td>\n<\/tr>\n<tr>\n<td>司机缺口<\/td>\n<td>国交省検討会中間とりまとめ（NX 総研試算）≠ 各智库推算<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>EC 化率<\/td>\n<td>経済産業省電子商取引実態調査 ≠ 各智库 / 行业团体估计<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_30\"><a id=\"未取得--待核验项\" aria-hidden=\"true\"><\/a>未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #1（物流白書最新版年份与关键数）、#4（EC / 冷链 / 3PL 市场规模估计）：待基线确立。<\/li>\n<li>SPPI 具体月次、WebKit 運賃指数数值：待核验。<\/li>\n<li>卡车运送事业者数时点：待更新（トラック白書）。<\/li>\n<li>自动车运送业特定技能受入使用率：待查（ISA）。<\/li>\n<\/ul>\n<h3 id=\"_31\"><a id=\"待复核清单逐项复核入口\" aria-hidden=\"true\"><\/a>待复核清单（逐项复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>物流白書最新版年份与关键数<\/td>\n<td>国土交通省 https://www.mlit.go.jp （物流白書 / 政策パッケージ）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>SPPI 月次与口径<\/td>\n<td>日本銀行 SPPI（只读锚：<a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 登记册 #8<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>倒産双口径年度值<\/td>\n<td>帝国データバンク / 東京商工リサーチ（并列呈现）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>EC / 冷链 / 3PL 权威估计<\/td>\n<td>智库报告 / 行业团体（物团连 https://www.butsuryu.or.jp 等）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>特定技能受入使用率<\/td>\n<td>ISA 统计（制度细节归 08-visa-immigration）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>卡车运送事业者数时点<\/td>\n<td>全国トラック協会 https://www.truck.or.jp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_32\"><a id=\"监测机制与触发器\" aria-hidden=\"true\"><\/a>监测机制与触发器<\/h3>\n<p><strong>监测节奏<\/strong>：基线 <code>reports/2026-11-industry-logistics.md<\/code>（v1.0 首期固定）；年度刷新 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；重大事件插刷（追加件）。无触发器命中且年度窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>触发器清单<\/strong>：<\/p>\n<ol>\n<li>物流白書 / 交通白書新版发布 → 产业规模与结构<\/li>\n<li>EC / 冷链 / 3PL 市场规模权威新估计 → 增长赛道<\/li>\n<li>2024 年問題对策新进展（锚 01-ssw-driver #9）→ 政策与数据跟踪<\/li>\n<li>自动驾驶 / 自动化重大政策进展（本主题写产业影响；技术细节联动 05）→ 自动化产业面<\/li>\n<li>SPPI 月次更新（锚 01-ssw-driver #8）→ 行业数据<\/li>\n<li>行业结构性事件（大型合并 / 大型倒産 / 监管重构 / 技术代际切换）→ 对应模块提前插刷<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>：唯一观察项、首要触发器、触发器结论均为「首期为空」（截至 2026-11-14 无更新）。<\/p>\n<h3 id=\"_33\"><a id=\"待答问题与下一期重点核实项\" aria-hidden=\"true\"><\/a>待答问题与下一期重点核实项<\/h3>\n<p><strong>待答问题<\/strong>：① 物流白書最新版关键数何时发布、与令和 2 年度值相比变化幅度如何？② EC / 冷链 / 3PL 权威估计何时可取得、各自增速排序如何？③ SPPI 月次更新后的同比走向与环比波动？④ 2024 年問題对策落地进度对运力与运价的传导效果？⑤ 新東名实证与西濃運輸 × T2 中継输送实证是否扩大区间 / 进入商用？⑥ 倒産件数（TDB / TSR 双口径）年度走势与大型倒産事件？<\/p>\n<p><strong>下一期重点核实项<\/strong>：物流白書最新版；SPPI 月次与口径；倒産双口径年度值；EC / 冷链 / 3PL 权威估计；特定技能受入使用率（ISA）。<\/p>\n<p><strong>数据补全计划<\/strong>：登记册 #1、#4 待基线确立项在年度刷新前补齐；建立 SPPI 月次台账与倒産 TDB / TSR 双口径并列台账；对 2022 年推计的司机缺口值跟踪官方修正。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<h3 id=\"_35\"><a id=\"官方一手\" aria-hidden=\"true\"><\/a>官方一手<\/h3>\n<ol>\n<li>国土交通省（mlit.go.jp）— 物流白書・政策パッケージ・モビリティ・ロードマップ https://www.mlit.go.jp （2026 核对）；国交省白書 https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1212000.html<\/li>\n<li>内閣府（cas.go.jp）<\/li>\n<li>国土交通省検討会中間とりまとめ（NX 総研試算）— 司机缺口 2030 年推计（2022 年推计）<\/li>\n<li>ISA — 自动车运送业特定技能受入上限 22,100 人 / 5 年（2024–2029；使用率待查）<\/li>\n<\/ol>\n<h3 id=\"_36\"><a id=\"行业机构\" aria-hidden=\"true\"><\/a>行业机构<\/h3>\n<ol>\n<li>全日本货物流通促进协会（物团连）https://www.butsuryu.or.jp （令和 2 年度统计）<\/li>\n<li>全国トラック協会（トラック白書）https://www.truck.or.jp<\/li>\n<li>帝国データバンク — 物流倒産件数（FY2025 321 件）<\/li>\n<li>東京商工リサーチ（TSR）— 道路货物运送业营业收入（2021，2.6 万社调查；物流倒産 FY2025 308 件）<\/li>\n<li>JILPT<\/li>\n<\/ol>\n<h3 id=\"_37\"><a id=\"研究机构\" aria-hidden=\"true\"><\/a>研究机构<\/h3>\n<ol>\n<li>日本銀行（SPPI）— 道路货运指数 113.3（+4.6%）（登记册 #2；月次待核验）<\/li>\n<li>智库报告（野村総合研究所、NTTデータ経営研究所等；登记册 #4 优先来源，具体报告待基线确立）<\/li>\n<\/ol>\n<h3 id=\"ir\"><a id=\"主要企业-ir\" aria-hidden=\"true\"><\/a>主要企业 IR<\/h3>\n<ol>\n<li>SGHD（佐川急便）、日本通運、ヤマト運輸 — 决算短信 / IR（2026-11 核对时点见各社 IR 页面）<\/li>\n<\/ol>\n<h3 id=\"_38\"><a id=\"媒体与线索\" aria-hidden=\"true\"><\/a>媒体与线索<\/h3>\n<ol>\n<li>TRAEEY、物流ウィークリー、日通综合研究所『物流季报』（线索来源，须回溯原文）<\/li>\n<\/ol>\n<h3 id=\"_39\"><a id=\"跨主题只读锚\" aria-hidden=\"true\"><\/a>跨主题只读锚<\/h3>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 指标登记册 #7 / #8 / #9（SPPI、倒産、2024 年問題）— 只读交叉验证锚，本主题不独立回写<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 189, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "04-industry-logistics/reports/2026-11-industry-logistics.html"}}}, "industry-autonomous": {"name": "自动驾驶与自动化", "dir": "05-industry-autonomous", "months": {"2026-11": {"title": "日本自动驾驶与自动化 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本自动驾驶与自动化--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本自动驾驶与自动化 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：行业深度研究型（industry-research）\n<strong>受众定位<\/strong>：面向计划或正在日本物流行业工作、关注自动化对岗位结构影响的读者，兼具技术跟踪与职业落地视角。\n<strong>来源规则<\/strong>：① 警察庁（npa.go.jp L4 许可）、国土交通省（自動運転路线图）、経済産業省 ＞ ② SOZ（ロボット開発機構）、NEDO 実证报告 ＞ ③ JAMA、主要车企（トヨタ、日野、いすゞ）与自动化厂商官网 ＞ ④ McKinsey / Deloitte / IRU 国际研究 ＞ ⑤ NHK、日経、Reuters（须回溯）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要<\/a>\n<a href=\"#s2\">二、研究范围与方法<\/a>\n<a href=\"#s3\">三、产业链图谱<\/a>\n<a href=\"#s4\">四、市场规模与格局<\/a>\n<a href=\"#s5\">五、头部玩家与竞争格局<\/a>\n<a href=\"#s6\">六、驱动因素与风险<\/a>\n<a href=\"#s7\">七、趋势判断（推断）<\/a>\n<a href=\"#s8\">八、数据治理与局限<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要\" aria-hidden=\"true\"><\/a>一、执行摘要<\/h2>\n<h3 id=\"_2\"><a id=\"核心结论\" aria-hidden=\"true\"><\/a>核心结论<\/h3>\n<p><strong>结论 1<\/strong>：L4 制度化已起步但规模化尚早。证据：2023 年（令和 5）道交法改正设立 L4 运行许可制度；登记册 #1 为 12 件；2025-03 起新東名一部区间实证运行。标注：事实。<\/p>\n<p><strong>结论 2<\/strong>：干线物流 L4 商用化目标窗口在 2030 前后。证据：\"2030 前后\"目标窗口；登记册 #2 2026 路线图（2027 年度社会实装、2030 年 1 万台）。标注：事实（政策目标）。<\/p>\n<p><strong>结论 3<\/strong>：中継输送是主流落地方案，将拆解而非消灭长途司机岗位。证据：中継输送模式与新岗位分类（远隔监控员 / 换乘点运航管理者 / 编组调度）。标注：事实（模式判断）。<\/p>\n<p><strong>结论 4<\/strong>：仓储自动化比无人配送更接近商用。证据：技术谱系普及度分层（AGV/AMR 在 3PL 大仓快速导入；无人配送为部分城市实证·限定商用）。标注：事实。<\/p>\n<p><strong>结论 5<\/strong>：岗位时间表判断——Y1–5 司机岗位供给仍紧，自动驾驶为示范规模。证据：岗位时间表判断（Y1–5 现在～2031 正常积累期；Y5–10 2031–2036 干线 L4 逐步商用；Y10+ 最后一公里自动化爬坡）。标注：事实（基线判断）；其中\"缺口 14 万+\"未标注来源，待核验。<\/p>\n<p><strong>结论 6<\/strong>：无人配送对岗位的实质影响比干线自动驾驶更远，10 年内是补充不是替代。证据：基线报告判断。标注：推断。<\/p>\n<h3 id=\"_3\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">追踪项（登记册）<\/th>\n<th style=\"width:20%\">活值（来源/年份）<\/th>\n<th style=\"width:20%\">基准版本<\/th>\n<th style=\"width:20%\">变动情况<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>L4 许可件数与区域<\/td>\n<td>12 件（锚 01-ssw-driver #10）（npa.go.jp / mlit.go.jp）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>政府路线图目标时间表<\/td>\n<td>2026 路线图（2027 年度社会实装、2030 年 1 万台）（mlit.go.jp 官方原文）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>货车自动驾驶実证项目动态<\/td>\n<td>待基线确立（SOZ / NEDO / 车企发布）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>仓储自动化商用案例<\/td>\n<td>待基线确立（厂商官网 / 行业媒体）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>观察项与触发器状态（登记册同名节）：唯一观察项、首要触发器、触发器结论均为「首期为空」，截至 2026-11-14 无更新。<\/p>\n<h3 id=\"_4\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告（2026-11-13 基准）已修正事实清单，无新增修正；历史报告未载已修正事实条目。<\/p>\n<h2 id=\"s2\"><a id=\"二研究范围与方法\" aria-hidden=\"true\"><\/a>二、研究范围与方法<\/h2>\n<h3 id=\"_6\"><a id=\"领域边界\" aria-hidden=\"true\"><\/a>领域边界<\/h3>\n<p><strong>含<\/strong>：自动驾驶技术路线与时间表（SAE L0–L4、政府路线图、车企量产时间表）；法规与许可制度（道交法 L4 运行许可、遠隔監視要件、责任与保险）；仓储自动化与无人配送（技术谱系、实证与商用案例）；个人技能对接与机会（未来岗位画像、机会雷达、风险对冲）。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：物流产业规模、赛道、企业动向（产业面）→ <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>；个人技能地图、岗位行情、转型路径 → <a href=\"../../06-industry-technology/reports/2026-11-industry-technology.md\">06-industry-technology<\/a>；管理岗过渡与晋升档案 → <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>；现场层执行细节 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；在留资格、特定技能制度细节 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；行业法规条文深度解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>；经济与收入环境 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；官方统计活值 → <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读引用）。<\/p>\n<h3 id=\"_7\"><a id=\"受众与视角\" aria-hidden=\"true\"><\/a>受众与视角<\/h3>\n<p>面向计划或正在日本物流行业工作、关注自动化对岗位结构影响的读者；保持中性技术 / 制度刻画，不给投资评级、不出具 Go/No-Go 决策建议；岗位替代 / 转型评估一律标「推断」。<\/p>\n<h3 id=\"_8\"><a id=\"核心监测问题\" aria-hidden=\"true\"><\/a>核心监测问题<\/h3>\n<ol>\n<li>L4 许可件数与区域、政府路线图目标时间表最新读数如何，与实证项目进展是否一致？<\/li>\n<li>中継输送模式下的新岗位（远隔监控员 / 换乘点运航管理者 / 编组调度）何时、以何种规模出现？<\/li>\n<li>仓储自动化与无人配送的商用化进展到哪一步，对仓库与配送岗位结构的影响路径如何？<\/li>\n<li>自动驾驶对司机岗位的替代节奏（幹線运送 vs 市内配送）如何演化？<\/li>\n<li>技术侧变化对个人技能对接与机会（阶段 4）意味着什么？<\/li>\n<\/ol>\n<h3 id=\"_9\"><a id=\"技术分层口径\" aria-hidden=\"true\"><\/a>技术分层口径<\/h3>\n<pre><code>自动驾驶：L2（人监控·辅助）→ L3（条件下自动驾驶）→ L4（限定区域无人）\n落地模式：中継输送（高速干线自动驾驶 + 换乘点人工接管 + 一般道人工驾驶）\n新岗位：远隔监控员 / 换乘点运航管理者 / 编组调度\n<\/code><\/pre>\n<p>术语口径：SAE L0–L4（注明出处版本）≠ 政府「レベル4」表述；「レベル4移動等支援ロボット」制度 ≠ 货车自动驾驶実证；幹線运送 ≠ 市内配送 的自动化替代节奏（推断标注）；远隔监控员 ≠ 换乘点运航管理者 ≠ 编组调度；自动驾驶 ≠ 仓储自动化。<\/p>\n<h3 id=\"_10\"><a id=\"方法维度拆解与验证链条\" aria-hidden=\"true\"><\/a>方法：维度拆解与验证链条<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L4 许可件数与区域<\/td>\n<td>公安委员会 L4 许可的件数与许可区域<\/td>\n<td>核心指标 #1<\/td>\n<td>npa.go.jp / mlit.go.jp<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>政府路线图目标时间表<\/td>\n<td>政府 L4 路线图的目标年度与规模<\/td>\n<td>核心指标 #2<\/td>\n<td>mlit.go.jp 官方原文<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>货车自动驾驶実证项目动态<\/td>\n<td>干线卡车实证项目（新東名、中継输送等）进展<\/td>\n<td>核心指标 #3<\/td>\n<td>SOZ / NEDO / 车企发布<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>仓储自动化商用案例<\/td>\n<td>AGV/AMR、无人配送等商用化案例<\/td>\n<td>核心指标 #4<\/td>\n<td>厂商官网 / 行业媒体<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：许可件数是制度化进度，路线图目标是政策预期，实证项目是技术验证，商用案例是市场落地；四者构成\"制度—政策—技术—市场\"的验证链条。口径上 L4 进展三口径（许可件数 ≠ 実证项目数 ≠ 政府路线图目标）并列不合并。<\/p>\n<h2 id=\"s3\"><a id=\"三产业链图谱\" aria-hidden=\"true\"><\/a>三、产业链图谱<\/h2>\n<h3 id=\"_12\"><a id=\"生态分层\" aria-hidden=\"true\"><\/a>生态分层<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">层<\/th>\n<th style=\"width:33%\">构成<\/th>\n<th style=\"width:34%\">代表主体<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>上游（技术与部件）<\/td>\n<td>传感器（LiDAR / ミリ波レーダー / 車載カメラ）、高精度地图（HD マップ）、算法与系统（知覚・予測・経路計画・制御）、车载 ECU<\/td>\n<td>自动化厂商与一级供应商体系（官网可回溯）<\/td>\n<\/tr>\n<tr>\n<td>中游（系统与集成）<\/td>\n<td>自动驾驶技术方、车企、物流方导入、平台 / 基建<\/td>\n<td>T2、Turing、ZMP、Sakai Robotics；トヨタ、日野、いすゞ；西濃運輸、日本邮便系、雅玛多；NEXCO、国交省项目<\/td>\n<\/tr>\n<tr>\n<td>下游（应用场景）<\/td>\n<td>干线物流（中継输送）、仓储（AGV/AMR、自动仓库）、最后一公里（配送机器人、无人机）<\/td>\n<td>大手物流、3PL、宅配、离岛 / 山区物流<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_13\"><a id=\"中継输送模式岗位概念核心\" aria-hidden=\"true\"><\/a>中継输送模式（岗位概念核心）<\/h3>\n<pre><code>[枢纽A] --自动驾驶(高速夜间)-- [换乘点] --人工驾驶(一般道)-- [终点]\n         无人·监控中心远隔            传统司机角色\n<\/code><\/pre>\n<p>自动驾驶只吃\"高速干线\"这一段；由此诞生的新岗位为<strong>远隔监控员（モニタリングオペレーター）、换乘点运航管理者、编组调度<\/strong>。传统\"长途司机\"岗位被拆解而非消失——最先转型的是干线司机本人。<\/p>\n<h3 id=\"_14\"><a id=\"仓储自动化技术谱系下游另一条战线\" aria-hidden=\"true\"><\/a>仓储自动化技术谱系（下游另一条战线）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">层级<\/th>\n<th style=\"width:33%\">技术<\/th>\n<th style=\"width:34%\">普及度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基础<\/td>\n<td>WMS（仓库管理系统）、Barcode/RFID<\/td>\n<td>广泛，中小也在 SaaS 化<\/td>\n<\/tr>\n<tr>\n<td>搬运<\/td>\n<td>フォークリフト（人驾）→ AGV/AMR（自主移动机器人）<\/td>\n<td>3PL 大仓快速导入<\/td>\n<\/tr>\n<tr>\n<td>拣选<\/td>\n<td>Pick-to-light、语音拣选、Arm 机器人<\/td>\n<td>大手宅配/EC 仓普及中<\/td>\n<\/tr>\n<tr>\n<td>整体<\/td>\n<td>自动仓库（AS/RS）、自动分拣机<\/td>\n<td>大型中心标配<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四市场规模与格局\" aria-hidden=\"true\"><\/a>四、市场规模与格局<\/h2>\n<blockquote>\n<p>说明：本主题登记册 #3（実证项目动态）、#4（商用案例）为「待基线确立」，暂无可引用的市场规模数值；本节按\"制度—政策—技术—市场\"四层呈现可核验读数，不作数值编造。<\/p>\n<\/blockquote>\n<h3 id=\"l4\"><a id=\"制度化进度l4-许可\" aria-hidden=\"true\"><\/a>制度化进度（L4 许可）<\/h3>\n<ul>\n<li>登记册 #1 最新值：12 件（锚 01-ssw-driver #10；登记册首值迁移 2026-11-12），时点待核验。<\/li>\n<li>制度背景：2023 年（令和 5）道交法改正设立 L4 运行许可制度——在特定条件下由遠隔監視者替代车内驾驶人运行，需都道府县公安委员会许可。<\/li>\n<li>跟踪要点：公安委员会 L4 许可件数每年更新，用于观察商用化速度。<\/li>\n<\/ul>\n<h3 id=\"_16\"><a id=\"政策预期政府路线图\" aria-hidden=\"true\"><\/a>政策预期（政府路线图）<\/h3>\n<ul>\n<li>登记册 #2 最新值：2026 路线图（2027 年度社会实装、2030 年 1 万台）。<\/li>\n<li>目标窗口：2030 前后为干线物流 L4 商用化的目标窗口（政府路线图方向；规模取决于成本与法整备）。<\/li>\n<\/ul>\n<h3 id=\"_17\"><a id=\"技术验证实证节点\" aria-hidden=\"true\"><\/a>技术验证（实证节点）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时间<\/th>\n<th style=\"width:50%\">事项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2023<\/td>\n<td>道交法改正：L4 运行许可制度生效（远隔监控体制要件）<\/td>\n<\/tr>\n<tr>\n<td>2025-03 起<\/td>\n<td>新東名一部区间（駿河湾沼津 SA–浜松 SA）深夜自動運転優先レーン实证运行（国交省）<\/td>\n<\/tr>\n<tr>\n<td>2026<\/td>\n<td>中継输送实证扩大：西濃運輸 × T2 等运输公司与技术公司组合（高速公路自动驾驶 + 换乘点人工接管）<\/td>\n<\/tr>\n<tr>\n<td>2030 前后<\/td>\n<td>干线物流 L4 商用化的目标窗口（政府路线图方向；规模取决于成本与法整备）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_18\"><a id=\"市场落地仓储自动化与无人配送\" aria-hidden=\"true\"><\/a>市场落地（仓储自动化与无人配送）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">形态<\/th>\n<th style=\"width:50%\">现状<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>配送机器人（歩行者空间）<\/td>\n<td>部分城市实证·限定商用<\/td>\n<\/tr>\n<tr>\n<td>无人机<\/td>\n<td>离岛/山区物流为主，规模小<\/td>\n<\/tr>\n<tr>\n<td>邮便/轻小物<\/td>\n<td>缓慢推进<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>判断：无人配送对岗位的实质影响比干线自动驾驶更远，10 年内是补充不是替代（推断）。<\/p>\n<h2 id=\"s5\"><a id=\"五头部玩家与竞争格局\" aria-hidden=\"true\"><\/a>五、头部玩家与竞争格局<\/h2>\n<h3 id=\"_20\"><a id=\"主体清单与入选标准\" aria-hidden=\"true\"><\/a>主体清单与入选标准<\/h3>\n<p>入选标准：官方或企业官网可回溯；样本进出须留痕。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">类型<\/th>\n<th style=\"width:50%\">主体<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自动驾驶技术<\/td>\n<td>T2（Torus 系干线卡车）、Turing、ZMP、Sakai Robotics<\/td>\n<\/tr>\n<tr>\n<td>物流方导入<\/td>\n<td>西濃運輸、日本邮便系、雅玛多（区域实证）<\/td>\n<\/tr>\n<tr>\n<td>平台/基建<\/td>\n<td>NEXCO（高速车路协同）、国交省项目<\/td>\n<\/tr>\n<tr>\n<td>车企（量产时间表相关）<\/td>\n<td>トヨタ、日野、いすゞ<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_21\"><a id=\"仓储自动化观察名单\" aria-hidden=\"true\"><\/a>仓储自动化观察名单<\/h3>\n<ul>\n<li>大手导入：雅玛多（次世代营业所）、佐川（GX 战略）、日通（自动化仓）<\/li>\n<li>技术方：Merchant 派（倉庫机器人）、SaaS WMS（Logiless、BOXIL 系列产品比较）<\/li>\n<li>数据源：LogiBiz、Material Flow 等行业媒体<\/li>\n<\/ul>\n<h3 id=\"_22\"><a id=\"竞争格局特征\" aria-hidden=\"true\"><\/a>竞争格局特征<\/h3>\n<ol>\n<li><strong>技术方与物流方组合推进<\/strong>：中継输送实证以\"运输公司 × 技术公司\"组合形式扩大（西濃運輸 × T2 等），单一主体独立商用尚未出现。<\/li>\n<li><strong>制度先行、商用滞后<\/strong>：L4 许可件数（12 件）与路线图目标（2030 年 1 万台）之间存在量级差，规模化取决于成本与法整备。<\/li>\n<li><strong>自动化两条战线节奏不同<\/strong>：干线自动驾驶（中継输送）与仓储自动化（AGV/AMR）先行，无人配送仍处部分城市实证·限定商用阶段。<\/li>\n<li><strong>产业面与技术面的分工<\/strong>：本主题写技术与制度面；物流产业规模、赛道、企业动向归 <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>。<\/li>\n<\/ol>\n<h2 id=\"s6\"><a id=\"六驱动因素与风险\" aria-hidden=\"true\"><\/a>六、驱动因素与风险<\/h2>\n<h3 id=\"_24\"><a id=\"法规与许可制度\" aria-hidden=\"true\"><\/a>法规与许可制度<\/h3>\n<p><strong>两法体系<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">法律<\/th>\n<th style=\"width:33%\">管什么<\/th>\n<th style=\"width:34%\">关键制度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>道路交通法<\/td>\n<td>公道上的车辆运行<\/td>\n<td>2023（令和 5）改正：L4 运行许可制度——在特定条件下由遠隔監視者替代车内驾驶人运行，需都道府县公安委员会许可<\/td>\n<\/tr>\n<tr>\n<td>道路运送车辆法<\/td>\n<td>车辆本身<\/td>\n<td>自动运行装置的保安基准、车检对应<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>另：货物运送业务的运行管理义务（货送法体系）不因自动驾驶免除——<strong>运行管理者 / 监控体制仍是法定要求<\/strong>。<\/p>\n<p><strong>L4 许可的三大要件（职业机会所在）<\/strong>：<\/p>\n<ol>\n<li><strong>遠隔監視<\/strong>：能实时掌握车辆状态并安全停止的操作体制。<\/li>\n<li><strong>运行管理制度<\/strong>：L4 也要点呼·指示·记录——运行管理经验是转型资本。<\/li>\n<li><strong>事故应对体制<\/strong>：现场対応·保险·与警察的连携规程。<\/li>\n<\/ol>\n<p>解读：L4 运营岗位需要的是\"懂运输现场 + 懂系统\"的复合人——这正是阶段 3+4 交叉培养的画像。<\/p>\n<p><strong>责任与保险（常识级）<\/strong>：L4 事故原则上由运营主体（事业者）担责，车体保险 + 新形态责任保险组合；个人的远隔监控岗位职务执行责任在公司，个人需要的是操作规程理解与记录能力。<\/p>\n<h3 id=\"_25\"><a id=\"政策与技术驱动\" aria-hidden=\"true\"><\/a>政策与技术驱动<\/h3>\n<ul>\n<li>政府路线图（2026）：2027 年度社会实装、2030 年 1 万台为目标方向。<\/li>\n<li>实证扩大：2025-03 起新東名一部区间深夜優先レーン运营；2026 年中継输送实证扩大。<\/li>\n<li>仓储自动化：AGV/AMR 在 3PL 大仓快速导入；自动仓库 / 自动分拣机在大型中心标配。<\/li>\n<\/ul>\n<h3 id=\"_26\"><a id=\"风险与不确定性\" aria-hidden=\"true\"><\/a>风险与不确定性<\/h3>\n<ul>\n<li>登记册 #3、#4 待基线确立，实证与商用案例缺权威锚。<\/li>\n<li>登记册 #1 时点待核验。<\/li>\n<li>\"缺口 14 万+\"无来源标注，待核验。<\/li>\n<li>基线报告信息核对日期为 2026-11-11，政策与实证进展可能已变化。<\/li>\n<li>岗位时间表为基线判断，存在修正风险。<\/li>\n<\/ul>\n<h2 id=\"s7\"><a id=\"七趋势判断推断\" aria-hidden=\"true\"><\/a>七、趋势判断（推断）<\/h2>\n<blockquote>\n<p>本节为推断层，与上文事实层分离；岗位替代 / 转型评估一律标「推断」。<\/p>\n<\/blockquote>\n<h3 id=\"_28\"><a id=\"岗位时间表本规划视角\" aria-hidden=\"true\"><\/a>岗位时间表（本规划视角）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时期<\/th>\n<th style=\"width:50%\">判断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y1–5（现在～2031）<\/td>\n<td>司机岗位供给仍紧（缺口 14 万+，待核验），自动驾驶为示范规模——<strong>正常积累期<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Y5–10（2031–2036）<\/td>\n<td>干线 L4 逐步商用 → 干线司机向中継/监控转型——<strong>本规划的运行管理主线正好对位<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Y10+<\/td>\n<td>最后一公里自动化开始爬坡 → 城市配送司机受影响——届时本人已在管理/系统岗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>结论（推断）：<strong>时间站在计划这一边<\/strong>——关键是 Y5 前完成管理岗转身，与 <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a> 的时间轴一致。<\/p>\n<h3 id=\"10\"><a id=\"未来岗位画像10-年视角\" aria-hidden=\"true\"><\/a>未来岗位画像（10 年视角）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">岗位<\/th>\n<th style=\"width:33%\">需要<\/th>\n<th style=\"width:34%\">现在从哪积累<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>远隔监控员（干线 L4）<\/td>\n<td>运输现场感+系统操作+异常判断<\/td>\n<td>运行管理者经验 + 点呼/记录习惯<\/td>\n<\/tr>\n<tr>\n<td>换乘点/编组调度<\/td>\n<td>配车能力+多式联运理解<\/td>\n<td>配车担当<\/td>\n<\/tr>\n<tr>\n<td>自动化仓 SV<\/td>\n<td>仓储流程+设备管理+带人<\/td>\n<td>仓库支援班+フォークリフト+WMS<\/td>\n<\/tr>\n<tr>\n<td>物流 DX 担当<\/td>\n<td>数据整理+报告+系统选型参与<\/td>\n<td>Excel→SaaS WMS→公司内改善提案<\/td>\n<\/tr>\n<tr>\n<td>自动驾驶运营管理<\/td>\n<td>法规理解+运行体制构建<\/td>\n<td>L4 法规跟踪+运行管理者资格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>共同底层：现场信任 × 日语（N2+）× 系统操作 × 运行管理法定经验。<\/p>\n<h3 id=\"_29\"><a id=\"机会雷达遇到就抓住的信号\" aria-hidden=\"true\"><\/a>机会雷达（遇到就抓住的信号）<\/h3>\n<ul>\n<li>公司导入新系统/设备时的<strong>操作担当指名<\/strong> → 主动报名<\/li>\n<li>国交省/业界的实证项目说明会（西濃運輸型中継模式扩散时，各公司都要人）<\/li>\n<li>配车担当休假时的<strong>代理指名<\/strong> → 高价值信号，务必接住<\/li>\n<li>新人教育培训担当 → 带人=管理岗前置经验<\/li>\n<\/ul>\n<h3 id=\"_30\"><a id=\"风险对冲\" aria-hidden=\"true\"><\/a>风险对冲<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">风险<\/th>\n<th style=\"width:50%\">对冲<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自动化速度快于预期<\/td>\n<td>把\"远隔监控/编组\"作为转型目标而非终点——继续往 DX/运营分析走<\/td>\n<\/tr>\n<tr>\n<td>慢于预期<\/td>\n<td>干线司机高薪窗口拉长——多赚加班费的窗口期<\/td>\n<\/tr>\n<tr>\n<td>公司规模太小无新岗位<\/td>\n<td>3 年周期内跳到导入自动化的大中型企业<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_31\"><a id=\"趋势判断要点推断\" aria-hidden=\"true\"><\/a>趋势判断要点（推断）<\/h3>\n<ol>\n<li>干线先于末端、岗位重组而非消失的路径判断维持（推断）。<\/li>\n<li>中継输送为主流落地方案，远隔监控员 / 换乘点运航管理者 / 编组调度三类新岗位将先于\"无人化\"规模出现（推断）。<\/li>\n<li>仓储自动化比无人配送更接近商用；无人配送 10 年内是补充不是替代（推断）。<\/li>\n<li>自动化对日语门槛的影响为双向：系统指令化降低\"母语级\"作业要求，但提高系统操作与异常处理权重（推断）。<\/li>\n<\/ol>\n<h2 id=\"s8\"><a id=\"八数据治理与局限\" aria-hidden=\"true\"><\/a>八、数据治理与局限<\/h2>\n<h3 id=\"_33\"><a id=\"核验程度分级\" aria-hidden=\"true\"><\/a>核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：国土交通省（国交省白書、モビリティ・ロードマップ 2026）、警察庁（npa.go.jp L4 许可）、経済産業省。<\/li>\n<li><strong>B 权威转引 / 行业机构<\/strong>：SOZ（ロボット開発機構）、NEDO 実证报告、JAMA、主要车企（トヨタ、日野、いすゞ）与自动化厂商官网。<\/li>\n<li><strong>C 平台抽样<\/strong>：本主题登记册无此类指标；媒体来源（NHK、日経、Reuters）仅用于发现线索，须回溯原文。<\/li>\n<\/ul>\n<h3 id=\"_34\"><a id=\"口径冲突并列清单不合并不取均值\" aria-hidden=\"true\"><\/a>口径冲突并列清单（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L4 进展<\/td>\n<td>许可件数（npa）≠ 実证项目数（SOZ / NEDO）≠ 政府路线图目标<\/td>\n<\/tr>\n<tr>\n<td>自动化替代节奏<\/td>\n<td>幹線运送 ≠ 市内配送<\/td>\n<\/tr>\n<tr>\n<td>等级口径<\/td>\n<td>SAE L0–L4 ≠ 「レベル4移動等支援ロボット」制度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_35\"><a id=\"未取得--待核验项\" aria-hidden=\"true\"><\/a>未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #3（货车自动驾驶実证项目动态）、#4（仓储自动化商用案例）：待基线确立。<\/li>\n<li>登记册 #1 时点：待核验（登记册首值迁移 2026-11-12）。<\/li>\n<li>\"缺口 14 万+\"来源：待核验。<\/li>\n<li>遠隔監視者资格 / 研修制度、货送法运用方针追加义务：基线报告跟踪要点，待核对。<\/li>\n<\/ul>\n<h3 id=\"_36\"><a id=\"待复核清单逐项复核入口\" aria-hidden=\"true\"><\/a>待复核清单（逐项复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>L4 许可件数与区域最新读数<\/td>\n<td>警察庁 https://www.npa.go.jp （只读锚：<a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 登记册 #10<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>政府路线图（2026）是否修订<\/td>\n<td>国土交通省 https://www.mlit.go.jp （自動運転路线图 / モビリティ・ロードマップ）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>新東名实证区间 / 中継输送实证项目<\/td>\n<td>国土交通省 https://www.mlit.go.jp ；SOZ / NEDO 実证报告<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>仓储自动化 / 无人配送商用案例<\/td>\n<td>厂商官网 / 行业媒体（LogiBiz、Material Flow 等）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>遠隔監視者资格 / 研修制度<\/td>\n<td>警察庁 / 国土交通省（制度细节归 09-politics-law）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>\"缺口 14 万+\"来源<\/td>\n<td>基线报告跟踪（官方统计活值归 01-ssw-driver）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_37\"><a id=\"监测机制与触发器\" aria-hidden=\"true\"><\/a>监测机制与触发器<\/h3>\n<p><strong>监测节奏<\/strong>：基线 <code>reports/2026-11-industry-autonomous.md<\/code>（v1.0 首期固定）；年度刷新 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；重大事件插刷（追加件）。无触发器命中且年度窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>触发器清单<\/strong>：<\/p>\n<ol>\n<li>L4 许可区域扩大 / 新実证批准（锚 01-ssw-driver #10）→ 技术路线与法规<\/li>\n<li>政府路线图时间表修订 → 技术路线<\/li>\n<li>仓储自动化 / 无人配送重大商用化事件 → 仓储自动化<\/li>\n<li>岗位影响新权威研究发布 → 个人技能对接<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>：唯一观察项、首要触发器、触发器结论均为「首期为空」（截至 2026-11-14 无更新）。<\/p>\n<h3 id=\"_38\"><a id=\"待答问题与下一期重点核实项\" aria-hidden=\"true\"><\/a>待答问题与下一期重点核实项<\/h3>\n<p><strong>待答问题<\/strong>：① L4 许可件数与区域的最新读数是多少，与 12 件相比是否增长？② 新東名实证区间是否扩大，中継输送实证项目是否增加？③ 政府路线图（2026）是否修订，2027 年度社会实装目标进展如何？④ 仓储自动化（AGV/AMR）与无人配送的商用案例数量与规模如何？⑤ 遠隔監視者相关资格 / 研修制度是否建立？⑥ 货送法运用方针是否为自动驾驶运行追加新义务？<\/p>\n<p><strong>下一期重点核实项<\/strong>：登记册 #3、#4 待基线确立项；登记册 #1 时点；\"缺口 14 万+\"来源；基线报告跟踪要点 2 项。<\/p>\n<p><strong>数据补全计划<\/strong>：登记册 #3、#4 在年度刷新前补齐；建立 L4 许可件数与实证项目数的双口径并列台账；对基线报告跟踪要点逐项核对。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<h3 id=\"_40\"><a id=\"官方一手\" aria-hidden=\"true\"><\/a>官方一手<\/h3>\n<ol>\n<li>国土交通省（mlit.go.jp）— 国交省白書 https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1212000.html （2026 核对）<\/li>\n<li>国土交通省 モビリティ・ロードマップ 2026（mlit.go.jp）<\/li>\n<li>警察庁（npa.go.jp）— L4 许可<\/li>\n<li>経済産業省（meti.go.jp）<\/li>\n<\/ol>\n<h3 id=\"_41\"><a id=\"行业机构与实证\" aria-hidden=\"true\"><\/a>行业机构与实证<\/h3>\n<ol>\n<li>SOZ（ロボット開発機構）/ NEDO 実证报告<\/li>\n<li>JAMA、主要车企（トヨタ、日野、いすゞ）与自动化厂商官网<\/li>\n<\/ol>\n<h3 id=\"_42\"><a id=\"国际研究\" aria-hidden=\"true\"><\/a>国际研究<\/h3>\n<ol>\n<li>McKinsey / Deloitte / IRU 国际研究（线索来源，须回溯原文）<\/li>\n<\/ol>\n<h3 id=\"_43\"><a id=\"媒体与线索\" aria-hidden=\"true\"><\/a>媒体与线索<\/h3>\n<ol>\n<li>NHK、日経、Reuters（线索来源，须回溯）<\/li>\n<\/ol>\n<h3 id=\"_44\"><a id=\"跨主题只读锚\" aria-hidden=\"true\"><\/a>跨主题只读锚<\/h3>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 指标登记册 #10（L4 政策进展）— 只读交叉验证锚，本主题不独立回写<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 208, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "05-industry-autonomous/reports/2026-11-industry-autonomous.html"}}}, "industry-technology": {"name": "技术行业", "dir": "06-industry-technology", "months": {"2026-11": {"title": "日本技术与数字化 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本技术与数字化--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本技术与数字化 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：行业深度研究型（industry-research）\n<strong>受众定位<\/strong>：面向计划或正在日本物流行业工作、准备向数字化 / 系统岗扩展的读者，兼具技能学习与岗位落地视角。\n<strong>来源规则<\/strong>：① 国土交通省 / 経済産業省（物流 DX 政策、GX、IT 人材需給試算；meti.go.jp）＞ ② IPA（DX 動向・IT 人材调查系列；ipa.go.jp）、厚生労働省（外国人雇用実態調査、賃金構造基本統計調査；mhlw.go.jp）＞ ③ 日本ロジスティクスシステム協会、WMS/TMS 主要厂商（Netsuite、楽天ロジスティクス、CASSA 等）官方资料 ＞ ④ 求人门户与薪资调查（doda.jp、levtech.jp、求人ボックス等；预期指标）＞ ⑤ 技术学习平台（官方文档优先）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要<\/a>\n<a href=\"#s2\">二、研究范围与方法<\/a>\n<a href=\"#s3\">三、产业链图谱<\/a>\n<a href=\"#s4\">四、市场规模与格局<\/a>\n<a href=\"#s5\">五、头部玩家与竞争格局<\/a>\n<a href=\"#s6\">六、驱动因素与风险<\/a>\n<a href=\"#s7\">七、趋势判断（推断）<\/a>\n<a href=\"#s8\">八、数据治理与局限<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要\" aria-hidden=\"true\"><\/a>一、执行摘要<\/h2>\n<h3 id=\"_2\"><a id=\"核心结论\" aria-hidden=\"true\"><\/a>核心结论<\/h3>\n<ul>\n<li><strong>结论 1<\/strong>：IT 人才缺口按情景分层，中位 2030 年约 45 万。证据：登记册 #4 与基线报告（経産省「IT人材需給に関する調査」報告書 /2019-03 表 3-5）。标注：事实（官方试算）。<\/li>\n<li><strong>结论 2<\/strong>：缺口结构比总量重要——先端 IT 人材不足、従来型可能过剩。证据：中位 45 万缺口中先端不足 27 万–55 万、従来型可能过剩 10 万。标注：事实（官方试算结构）。<\/li>\n<li><strong>结论 3<\/strong>：数字化岗位薪资带高于物流同业平均。证据：软件工程师约 578 万円（2024 调查）对 鸿池运输 544 万円（2024，运输业 69 社第 57 位）。标注：推断（跨口径比较，口径不同禁止混算）。<\/li>\n<li><strong>结论 4<\/strong>：三条转型路径中，公司内转岗为首选、SaaS 厂商为行情溢价方向。证据：路径 A / B / C 与评估节点（Y4 / Y6 / Y8）。标注：事实（路径设定）；行情兑现为推断。<\/li>\n<li><strong>结论 5<\/strong>：外国人 IT 就业规模持续扩大，日语门槛实务上高于 JD 标注。证据：外国人劳动者约 204 万人、専門的・技術的分野 42.1%（2026-08 公表）；雇用侧日语课题 46.2%；求职者侧 11.9%。标注：事实（统计）；JD 标注读法为推断。<\/li>\n<li><strong>结论 6<\/strong>：岗位选择优先序为社内 DX / 系统担当 ＞ 3PL 大手系统岗 ＞ 物流 SaaS 实施顾问。证据：基线报告对接要点。标注：推断。<\/li>\n<\/ul>\n<h3 id=\"_3\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">追踪项（登记册）<\/th>\n<th style=\"width:20%\">活值（来源/年份）<\/th>\n<th style=\"width:20%\">基准版本<\/th>\n<th style=\"width:20%\">变动情况<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>物流 DX 政策动向<\/td>\n<td>待基线确立（mlit.go.jp / meti.go.jp）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>数字化岗位求人抽样<\/td>\n<td>待基线确立（求人门户）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>个人技能证书 / 项目进度<\/td>\n<td>待记录（自记录）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>IT 人才缺口数（2030 年推计）<\/td>\n<td>低位 16.4 万 / 中位 44.9 万 / 高位 78.7 万人（経産省「IT人材需給に関する調査」報告書 /2019-03 表 3-5）<\/td>\n<td>2026-11-12 已核实<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>数字化岗位薪资带<\/td>\n<td>ソフトウェア作成者平均约 578 万円（賃金構造基本統計調査 /2024）；doda 转职登录者 IT/通信 466 万円、IT コンサル 505 万 / ベンダ 493 万 / SIer 481 万（/2025）；レバテック职种带约 354 万–593 万円（/2026-04 时点）；WMS/TMS 实施岗求人事例带 380 万–800 万円（求人ボックス /2026，预期指标）<\/td>\n<td>2026-11-12 初值<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>外国人 IT 就业与日语门槛分布<\/td>\n<td>外国人劳动者约 204 万人、専門的・技術的分野 42.1%、月给 306.5 千円（令和 7 年外国人雇用実態調査 /2026-08 公表）；技・人文・国際業務約 46 万人、高度専門職の仕事内容 IT エンジニア 31.2%（経産省資料 /2026-04）；雇用侧日语课题 46.2%（同実態調査）——日语等级门槛带分布待复核<\/td>\n<td>2026-11-12 初值（待复核）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>观察项与触发器状态（登记册同名节）：唯一观察项、首要触发器、触发器结论均为「首期为空」，截至 2026-11-14 无更新。<\/p>\n<h3 id=\"_4\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告（2026-11-13 基准）已修正事实清单，无新增修正；历史报告未载已修正事实条目。<\/p>\n<h2 id=\"s2\"><a id=\"二研究范围与方法\" aria-hidden=\"true\"><\/a>二、研究范围与方法<\/h2>\n<h3 id=\"_6\"><a id=\"领域边界\" aria-hidden=\"true\"><\/a>领域边界<\/h3>\n<p><strong>含<\/strong>：物流数字化技能地图（现场系统操作 / 数据整理 / 分析与工具三层）；数字化岗位与转型路径（公司内转岗 / 跳槽 / SaaS 厂商三条路）；日本数字化劳动市场与岗位行情（IT 人才供需、薪资带、外语门槛、物流业外泛用岗位）。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：物流产业规模、赛道、企业动向（产业面）→ <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>；自动驾驶技术路线、法规与实装细节 → <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>；管理岗过渡与晋升档案 → <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>；现场层执行细节 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；在留资格、特定技能制度细节、日语审查要件 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；行业法规条文与政策解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>；资格与教育投资 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>；经济与收入环境 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；官方统计活值 → <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读引用）。<\/p>\n<h3 id=\"_7\"><a id=\"受众与视角\" aria-hidden=\"true\"><\/a>受众与视角<\/h3>\n<p>面向计划或正在日本物流行业工作、准备向数字化 / 系统岗扩展的读者；保持中性技能 / 岗位刻画，不给投资评级、不出具 Go/No-Go 决策建议；岗位转型与行情读法一律标「推断」。<\/p>\n<h3 id=\"_8\"><a id=\"核心监测问题\" aria-hidden=\"true\"><\/a>核心监测问题<\/h3>\n<ol>\n<li>物流数字化技能地图（三层技能）的最新框架与证明方式是什么？<\/li>\n<li>数字化岗位三条转型路径（公司内转岗 / 跳槽 / SaaS 厂商）的采用条件与评估节点如何？<\/li>\n<li>IT 人才缺口（2030 年推计）的低 / 中 / 高位情景最新读数如何？<\/li>\n<li>数字化岗位薪资带（转职登录者 / 官方赁金 / 企业公开值）的口径与水平如何？<\/li>\n<li>外国人 IT 就业与日语门槛分布的现状与变化如何？<\/li>\n<\/ol>\n<h3 id=\"_9\"><a id=\"技能分层口径\" aria-hidden=\"true\"><\/a>技能分层口径<\/h3>\n<pre><code>第 1 层：现场系统操作（Y1–2）——伝票/受发注系统、ドラレコ/运行管理后台、ハンディ端末\n第 2 层：数据整理（Y2–4）——Excel 函数 / 透视表、基础统计\n第 3 层：分析与工具（Y4+）——BI 看板、SQL 基础、轻量编程、流程优化\n<\/code><\/pre>\n<p>术语口径：WMS ≠ TMS ≠ WCS（库存 / 运输 / 仓库控制）；「オペレーター」≠「システム担当」≠「改善 / 分析岗」；IT 人才缺口低位 / 中位 / 高位情景（同一调查的不同需求情景，不可合并）；转职登录者统计 ≠ 官方赁金统计 ≠ 企业公开值（禁止混算）；技能等级自评须注明评估标准版本。<\/p>\n<h3 id=\"_10\"><a id=\"方法维度拆解与口径原则\" aria-hidden=\"true\"><\/a>方法：维度拆解与口径原则<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>物流 DX 政策动向<\/td>\n<td>物流 DX 政策与补贴动向<\/td>\n<td>核心指标 #1<\/td>\n<td>mlit.go.jp / meti.go.jp<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>数字化岗位求人抽样<\/td>\n<td>目标数字化岗位的求人抽样<\/td>\n<td>核心指标 #2<\/td>\n<td>求人门户<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>个人技能证书 / 项目进度<\/td>\n<td>个人技能证书与项目进度（自记录）<\/td>\n<td>核心指标 #3<\/td>\n<td>自记录<\/td>\n<td>年度刷新（1 月自检）<\/td>\n<\/tr>\n<tr>\n<td>IT 人才缺口数（2030 推计等）<\/td>\n<td>IT 人才供需与 2030 缺口推计<\/td>\n<td>核心指标 #4<\/td>\n<td>meti.go.jp / ipa.go.jp<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>岗位薪资带（职种 / 业种别）<\/td>\n<td>数字化岗位薪资带（多口径）<\/td>\n<td>核心指标 #5<\/td>\n<td>doda.jp / levtech.jp / mhlw.go.jp<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<tr>\n<td>外国人 IT 就业与日语门槛分布<\/td>\n<td>外国人 IT 就业规模与日语门槛<\/td>\n<td>核心指标 #6<\/td>\n<td>mhlw.go.jp / jisa.or.jp<\/td>\n<td>年度刷新 + 事件插刷<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：技能地图是个人投入对象，岗位路径是技能兑现通道，劳动市场行情是薪酬与缺口的外部锚；IT 人才缺口与薪资带口径各自独立，并列呈现不合并。来源台账域名（03 章行情类必查）：ipa.go.jp、meti.go.jp、mhlw.go.jp、jisa.or.jp、doda.jp、levtech.jp、求人ボックス。<\/p>\n<h2 id=\"s3\"><a id=\"三产业链图谱\" aria-hidden=\"true\"><\/a>三、产业链图谱<\/h2>\n<h3 id=\"_12\"><a id=\"数字化技能系统岗位图谱\" aria-hidden=\"true\"><\/a>数字化技能—系统—岗位图谱<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">层<\/th>\n<th style=\"width:33%\">构成<\/th>\n<th style=\"width:34%\">个人关联<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>上游（系统与学习资源）<\/td>\n<td>WMS/TMS 等主要厂商（Netsuite、楽天ロジスティクス、CASSA 等）、物流 SaaS 公司、技术学习平台（Microsoft Learn、Udemy 等）<\/td>\n<td>技能学习入口与系统选型参与<\/td>\n<\/tr>\n<tr>\n<td>中游（企业数字化岗位）<\/td>\n<td>公司内 DX / 系统担当、3PL 大手系统岗、物流 SaaS 实施顾问 / CS<\/td>\n<td>技能兑现通道（路径 A / B / C）<\/td>\n<\/tr>\n<tr>\n<td>下游（个人技能层）<\/td>\n<td>三层技能：现场系统操作 → 数据整理 → 分析与工具<\/td>\n<td>个人投入对象，按 Y1–2 / Y2–4 / Y4+ 推进<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_13\"><a id=\"三层技能由近及远\" aria-hidden=\"true\"><\/a>三层技能（由近及远）<\/h3>\n<p><strong>第 1 层：现场系统操作（Y1–2 内）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">学法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>伝票/受发注系统<\/td>\n<td>入职培训认真做，手册自己重写一份<\/td>\n<\/tr>\n<tr>\n<td>ドラレコ/运行管理后台<\/td>\n<td>数据能导出、能看懂指标<\/td>\n<\/tr>\n<tr>\n<td>ハンディ端末（仓库）<\/td>\n<td>全功能掌握，当\"会教别人的人\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>第 2 层：数据整理（Y2–4）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Excel 函数<\/td>\n<td>VLOOKUP/XLOOKUP、IF、SUMIFS、TEXT 函数<\/td>\n<\/tr>\n<tr>\n<td>Excel 透视表<\/td>\n<td>10 分钟内从导出数据做出月报图<\/td>\n<\/tr>\n<tr>\n<td>基础统计<\/td>\n<td>均值/分布/趋势——看懂 KPI 异动<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>第 3 层：分析与工具（Y4+，转 DX 岗前）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">技能<\/th>\n<th style=\"width:50%\">工具<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>BI 看板<\/td>\n<td>Power BI / Looker Studio（免费）任选一<\/td>\n<\/tr>\n<tr>\n<td>SQL 基础<\/td>\n<td>SELECT/GROUP BY——能自己拉数<\/td>\n<\/tr>\n<tr>\n<td>轻量编程<\/td>\n<td>Python（pandas 处理 CSV）——可选，非必需<\/td>\n<\/tr>\n<tr>\n<td>流程优化<\/td>\n<td>PDCA、BPMN 流程图、改善提案书写法<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_14\"><a id=\"物流系统知识概念层\" aria-hidden=\"true\"><\/a>物流系统知识（概念层）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">系统<\/th>\n<th style=\"width:33%\">管什么<\/th>\n<th style=\"width:34%\">个人关联<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TMS<\/td>\n<td>运输计划/配车/运费<\/td>\n<td>运行管理的系统化版——主线技能<\/td>\n<\/tr>\n<tr>\n<td>WMS<\/td>\n<td>库存/入出库/拣选<\/td>\n<td>仓储转岗的核心<\/td>\n<\/tr>\n<tr>\n<td>CRM/SFA<\/td>\n<td>客户对应<\/td>\n<td>事务所方向才需要<\/td>\n<\/tr>\n<tr>\n<td>EDI<\/td>\n<td>荷主↔物流数据交换<\/td>\n<td>理解\"为什么传票数字化\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_15\"><a id=\"证明方式比证书重要\" aria-hidden=\"true\"><\/a>证明方式（比证书重要）<\/h3>\n<ul>\n<li>自作工具：把自己做的配车表 / KPI 看板 / 改善提案存档（归 <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a> 成果档案）。<\/li>\n<li>公司内\"数字担当\"实绩（培训过几人、改善过什么）。<\/li>\n<li>必要时补考：Microsoft MOS Excel、GAS / Python 微证书——锦上添花。<\/li>\n<\/ul>\n<h2 id=\"s4\"><a id=\"四市场规模与格局\" aria-hidden=\"true\"><\/a>四、市场规模与格局<\/h2>\n<h3 id=\"it\"><a id=\"it--数字化人才供需全景\" aria-hidden=\"true\"><\/a>IT / 数字化人才供需全景<\/h3>\n<ul>\n<li>官方试算（経産省「IT人材需給に関する調査」，三省連携、2019 公表）：2018 年 IT 人材约 103 万人 → 2030 年供给约 113 万人；需求按市场情景扩大——低位情景（年 1%）约 130 万、中位（2.7%）约 158 万、高位（4.4%）约 192 万，对应 2030 年缺口<strong>低位约 16 万 / 中位约 45 万 / 高位约 79 万<\/strong> [Source: https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf, 2019]。<\/li>\n<li>缺口结构比总量重要：中位情景 45 万缺口中先端 IT 人材（AI/IoT/云）不足 27 万–55 万，従来型 IT 人材在 Re スキル（转岗学习）停滞时反而可能<strong>过剩 10 万<\/strong>——行情结论是\"向先端领域补技能\"，与三层技能规划一致 [Source: https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf, 2019]。<\/li>\n<li>IPA「DX動向2025」（2025-10 公开）：日本企业 85.1% 存在 DX 推进人材不足，显著高于美 / 德 [Source: https://www.ipa.go.jp/digital/chousa/discussion-paper/dx2025_digital_talent_ai_era.html, 2025]。<\/li>\n<li>供给侧长期收缩：IT 相关产业从业者以 2019 年为峰值，此后入職者数低于退職者数、产业人口转减且高龄化（経産省 2026-04 资料引「IT人材の最新動向と将来推計」）[Source: https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf, 2026]。<\/li>\n<li>官方技能对照工具：デジタルスキル標準（DX 推进型 / 活用型两分）、Re スキル講座认证制度 [Source: https://www.meti.go.jp/policy/it_policy/jinzai/index.html, 2026]。<\/li>\n<\/ul>\n<h3 id=\"_17\"><a id=\"数字化岗位薪资带多口径并列\" aria-hidden=\"true\"><\/a>数字化岗位薪资带（多口径并列）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标（口径）<\/th>\n<th style=\"width:33%\">数值<\/th>\n<th style=\"width:34%\">年份<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://freelance.levtech.jp/guide/detail/1217/\" title=\"来源：https://freelance.levtech.jp/guide/detail/1217/, 2026\">软件工程师平均年收（厚労省賃金構造基本統計調査・ソフトウェア作成者）<\/a><\/td>\n<td>约 578 万円<\/td>\n<td>2024 调查<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://freelance.levtech.jp/guide/detail/1217/\" title=\"来源：https://freelance.levtech.jp/guide/detail/1217/, 2026\">全国平均给与（国税庁民間給与実態統計調査，对照基准）<\/a><\/td>\n<td>约 478 万円<\/td>\n<td>令和 6 年分<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://doda.jp/guide/heikin/gyousyu/index.html\" title=\"来源：https://doda.jp/guide/heikin/gyousyu/index.html, 2025\">转职登录者 IT/通信业平均（doda，约 60 万登录者口径）<\/a><\/td>\n<td>466 万円<\/td>\n<td>2025<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://xn--pckua2a7gp15o89zb.com/%E9%B4%BB%E6%B1%A0%E9%81%8B%E8%BC%B8%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%81%AE%E5%B9%B4%E5%8F%8E\" title=\"来源：https://xn--pckua2a7gp15o89zb.com/鴻池運輸株式会社の年収, 2025\">物流大企业平均年收例（鸿池运输・企业公开值，运输业 69 社中第 57 位）<\/a><\/td>\n<td>544 万円（求人票平均 426 万）<\/td>\n<td>2024<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>职种分档（レバテック登录者实绩，2026-04 时点）[Source: https://freelance.levtech.jp/guide/detail/1217/, 2026]：初级·现场 / 运维系 組込约 354 万、サーバー（运维）约 389 万、ネットワーク约 401 万、サーバーサイド约 414 万；中级·专业系 フロントエンド约 457 万、クラウド约 458 万、PL 约 529 万；高级·管理 / 咨询系 PM 约 488 万、IT コンサルタント约 509 万、PMO 约 593 万。<\/li>\n<li>doda IT/通信小分类（2025）：IT コンサルティング 505 万 ＞ HW/SW/パッケージベンダ 493 万 ＞ SIer 481 万 ＞ 通信/ISP/DC 434 万 [Source: https://doda.jp/guide/heikin/gyousyu/index.html, 2025]。<\/li>\n<li>物流业 vs IT 岗对比（<strong>推断<\/strong>读法）：物流上市公司平均年收多在 500 万级以下（鸿池 544 万仅列运输业 69 社第 57 位、求人票平均 426 万），而统一统计口径下软件工程师 578 万——同一段现场经验换到系统岗是加薪方向；但物流公司内转岗多沿用本公司年功序列，跳到 SIer / 厂商才是行情兑现路径（推断）。<\/li>\n<\/ul>\n<h3 id=\"it_1\"><a id=\"外国人-it-就业与日语门槛\" aria-hidden=\"true\"><\/a>外国人 IT 就业与日语门槛<\/h3>\n<ul>\n<li>规模：外国人劳动者约 204 万人（雇用保险 5 人以上事业所口径），「専門的・技術的分野」占 42.1%（前年 38.9%）；该分野月间固定给与 306.5 千円 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]。<\/li>\n<li>高度人才构成：技・人文・国際業務在留外国人约 46 万人（2015 年约 13 万的 3.5 倍）；高度専門職约 3.1 万人中 IT 工程师占 31.2% [Source: https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf, 2026]。<\/li>\n<li>日语门槛：雇用侧课题第 1 位为\"因日语能力沟通困难\"46.2%；求职者侧 11.9% 遭遇\"事前说明以上の日本語能力要求\"——JD 标注等级常低于实务要求（<strong>推断<\/strong>），面试前用证明材料实测 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]。<\/li>\n<li>等级带（<strong>推断<\/strong>整理）：系统担当 / 社内 SE N2 起步可谈；DX 企划 / 导入顾问面向荷主管理层需 N1 或等效商务级；技人国审查与高度人材积分（N1 15 分 / N2 10 分）要件归 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>，不在此重写。<\/li>\n<li>英语环境岗位（<strong>推断<\/strong>）：集中在外资 SI / 咨询、全球化物流科技厂商（英语文档环境）；公开统计无英语岗占比数据，<strong>待复核<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"_18\"><a id=\"物流业外泛用型岗位与转职市场\" aria-hidden=\"true\"><\/a>物流业外泛用型岗位与转职市场<\/h3>\n<ul>\n<li>WMS/TMS 实施岗：物流 SaaS 厂商「導入コンサル / 实施顾问」，求人事例带 380 万–800 万（パッケージ導入コンサルタント求人带）[Source: https://xn--pckua2a7gp15o89zb.com/%E3%83%91%E3%83%83%E3%82%B1%E3%83%BC%E3%82%B8%E5%B0%8E%E5%85%A5%E3%82%B3%E3%83%B3%E3%82%B5%E3%83%AB%E3%82%BF%E3%83%B3%E3%83%88%E3%81%AE%E4%BB%95%E4%BA%8B, 2026]——真实跑过配车 / 仓库的现场经验是该岗差异化筹码。<\/li>\n<li>用户企业情报部门 / 社内 SE：非 IT 业种的社内系统岗缺口大（结合 85.1% 不足数据，<strong>推断<\/strong>），是公司内转岗之外的第二落点。<\/li>\n<li>数据分析 / 改善岗：先端 IT 人材缺口 27 万–55 万的组成部分，第 3 层技能（BI/SQL）直接对应（推断）。<\/li>\n<li>转职市场特征：外国人在职者中 6.1% 明确\"辞掉现职在日本国内换公司\"、国内入職者 19.1% 经由求人广告自力求职；海外入職者 82.0% 依赖介绍会社 [Source: https://www.mhlw.go.jp/stf/newpage_75722.html, 2026]——已在国内的转职不必绑死送出机构渠道。<\/li>\n<\/ul>\n<h2 id=\"s5\"><a id=\"五头部玩家与竞争格局\" aria-hidden=\"true\"><\/a>五、头部玩家与竞争格局<\/h2>\n<h3 id=\"_20\"><a id=\"主体清单与入选标准\" aria-hidden=\"true\"><\/a>主体清单与入选标准<\/h3>\n<p>入选标准：官方或企业官网可回溯；样本进出须留痕。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">类型<\/th>\n<th style=\"width:50%\">主体<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>WMS/TMS 厂商<\/td>\n<td>Netsuite、楽天ロジスティクス、CASSA 等<\/td>\n<\/tr>\n<tr>\n<td>物流 SaaS 公司<\/td>\n<td>导入顾问 / CS 岗位载体<\/td>\n<\/tr>\n<tr>\n<td>求人门户<\/td>\n<td>doda.jp、levtech.jp、求人ボックス（预期指标）<\/td>\n<\/tr>\n<tr>\n<td>行业团体<\/td>\n<td>日本ロジスティクスシステム協会<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_21\"><a id=\"技能证明与学习资源体系\" aria-hidden=\"true\"><\/a>技能证明与学习资源体系<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">类别<\/th>\n<th style=\"width:50%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>官方技能对照<\/td>\n<td>デジタルスキル標準（DX 推进型 / 活用型两分）、Re スキル講座认证制度（経産省）<\/td>\n<\/tr>\n<tr>\n<td>免费官方课<\/td>\n<td>Microsoft Learn（Excel / Power BI）<\/td>\n<\/tr>\n<tr>\n<td>付费课程<\/td>\n<td>Udemy 日语系 SQL / Python 课程（打折时 1500 円级）<\/td>\n<\/tr>\n<tr>\n<td>微证书<\/td>\n<td>Microsoft MOS Excel、GAS / Python 微证书（锦上添花）<\/td>\n<\/tr>\n<tr>\n<td>物流知识体系化<\/td>\n<td>ロジスティクス検定（L 検）——归 <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_22\"><a id=\"竞争格局特征\" aria-hidden=\"true\"><\/a>竞争格局特征<\/h3>\n<ol>\n<li><strong>技能侧\"现场 + 系统\"复合人稀缺<\/strong>：L4 运营、自动化仓、DX 担当均要求\"懂运输现场 + 懂系统\"，纯 IT 背景反而不占优（与 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a> 的岗位画像互证）。<\/li>\n<li><strong>系统操作门槛下降、异常处理权重上升<\/strong>：自动化与 SaaS 化降低\"母语级\"作业要求，提高系统操作与异常处理权重——对日语 N3 级 + 数字敏感的人是利好（推断）。<\/li>\n<li><strong>转职渠道分层<\/strong>：已在国内的转职者可不依赖送出机构渠道（求人广告自力求职 19.1%），与在留审查要件（归 08）分开管理。<\/li>\n<\/ol>\n<h2 id=\"s6\"><a id=\"六驱动因素与风险\" aria-hidden=\"true\"><\/a>六、驱动因素与风险<\/h2>\n<h3 id=\"_24\"><a id=\"政策与需求驱动\" aria-hidden=\"true\"><\/a>政策与需求驱动<\/h3>\n<ul>\n<li>物流 DX 政策与补贴动向：登记册 #1 待基线确立；技能与岗位信息以国土交通省物流政策公开资料为参照（mlit.go.jp，2026 核对）。<\/li>\n<li>需求侧：IPA「DX動向2025」85.1% 企业存在 DX 推进人材不足；IT 产业从业者以 2019 年为峰值转减且高龄化——供需缺口中期难闭合（事实 + 推断）。<\/li>\n<li>官方试算情景：低位 16.4 万 / 中位 44.9 万 / 高位 78.7 万（2019-03，已核实）。<\/li>\n<\/ul>\n<h3 id=\"_25\"><a id=\"三条转型路径\" aria-hidden=\"true\"><\/a>三条转型路径<\/h3>\n<p><strong>路径 A：公司内转岗（首选）<\/strong><\/p>\n<pre><code>司机 → 运行管理辅助 → 配车担当（TMS 用户） → 运输管理系统担当/DX 推进室\n<\/code><\/pre>\n<ul>\n<li>前提：公司有 5+ 台车规模、有系统、有转岗先例；时机：第 4–6 年（与主任竞聘同期评估）。<\/li>\n<li>在留注意：特定技能框架内的业务范围受限——大规模转事务岗可能需要资格变更（技术·人文·国际业务需学历 / 10 年实务），转岗谈判时与行政书士确认（归 08-visa-immigration）。<\/li>\n<\/ul>\n<p><strong>路径 B：跳槽到系统化大企业<\/strong>：3PL 大手 / 大手宅配的\"运行管理 / 配送管理 / 仓库管理\"岗——系统暴露度高；卖点组合为现场经验 5 年 + N2 + TMS/WMS 使用实绩 + 改善提案集。<\/p>\n<p><strong>路径 C：物流 SaaS / 技术公司<\/strong>：WMS/TMS 厂商的实施顾问（導入コンサル）/ 客服成功（CS）——非常吃\"懂现场\"的人；真实跑过配车和仓库的人做导入培训，说服力碾压纯 IT 背景；日语 + 中文双语 = 对华供应链客户关系的差异化。<\/p>\n<h3 id=\"jd\"><a id=\"岗位-jd-关键词对照求职检索用\" aria-hidden=\"true\"><\/a>岗位 JD 关键词对照（求职检索用）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">检索词<\/th>\n<th style=\"width:50%\">对应岗位<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>配車管理・運行管理<\/td>\n<td>路径 A/B 第一步<\/td>\n<\/tr>\n<tr>\n<td>ロジスティクス担当・物流企画<\/td>\n<td>本社物流部门<\/td>\n<\/tr>\n<tr>\n<td>WMS 導入・フィールドエンジニア<\/td>\n<td>路径 C<\/td>\n<\/tr>\n<tr>\n<td>サプライチェーン<\/td>\n<td>更上游的企划岗<\/td>\n<\/tr>\n<tr>\n<td>物流DX・改善<\/td>\n<td>DX 推进<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_26\"><a id=\"评估节点\" aria-hidden=\"true\"><\/a>评估节点<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">年<\/th>\n<th style=\"width:50%\">动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y4<\/td>\n<td>检视公司内转岗可能性（第 2 层技能是否完成）<\/td>\n<\/tr>\n<tr>\n<td>Y6<\/td>\n<td>若无内部机会 → 路径 B 求职市场试探（不轻易辞职，先面试 3 家摸行情）<\/td>\n<\/tr>\n<tr>\n<td>Y8<\/td>\n<td>路径 C 可选窗口（现场故事 + 系统实绩完备时）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_27\"><a id=\"风险与不确定性\" aria-hidden=\"true\"><\/a>风险与不确定性<\/h3>\n<ul>\n<li>登记册 #1、#2 待基线确立，政策与求人抽样缺权威锚；#3 待记录；#6 日语门槛分布待复核。<\/li>\n<li>薪资带多口径不可合并；WMS/TMS 实施岗为预期指标；英语环境岗位无公开统计。<\/li>\n<li>基线报告 03 章为 2026-11-12 新增，部分数据待复核。<\/li>\n<\/ul>\n<h2 id=\"s7\"><a id=\"七趋势判断推断\" aria-hidden=\"true\"><\/a>七、趋势判断（推断）<\/h2>\n<blockquote>\n<p>本节为推断层，与上文事实层分离；岗位转型与行情读法一律标「推断」。<\/p>\n<\/blockquote>\n<h3 id=\"_29\"><a id=\"与本项目路线的对接要点推断\" aria-hidden=\"true\"><\/a>与本项目路线的对接要点（推断）<\/h3>\n<ul>\n<li>Y5–Y6（衔接路径 A 评估节点）：内部转岗（路径 A）行情兑现有限，重点谈职级与\"システム担当\"头衔；路径 B 试探时以 SIer 481 万 / IT コンサル 505 万带（doda 口径，2025）为报价参照。<\/li>\n<li>Y7–Y8（路径 C 窗口）：WMS/TMS 实施岗报价带 380 万–800 万（求人事例，2026），落地取决于现场故事 + 日语等级；此阶段 N1 回报最大（报价上限 + 高度人材积分 15 分）。<\/li>\n<li>岗位选择优先序（<strong>推断<\/strong>）：社内 DX / 系统担当（稳定，衔接 Y4 转岗）＞ 3PL 大手系统岗（平台大）＞ 物流 SaaS 实施顾问（行情溢价但出差强度高）。<\/li>\n<li>在留切换时序、学历 / 10 年实务经验要件不属于本节：一律以 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a> 为准。<\/li>\n<li>数值管理：本章薪资带与缺口数为活值，登记于登记册 #4–#6，每年随调查更新刷新。<\/li>\n<\/ul>\n<h3 id=\"_30\"><a id=\"趋势判断要点推断\" aria-hidden=\"true\"><\/a>趋势判断要点（推断）<\/h3>\n<ol>\n<li><strong>技能溢价方向<\/strong>：同一现场经验换到系统岗是加薪方向，但行情兑现依赖跳到 SIer / 厂商或 SaaS 实施岗（推断）。<\/li>\n<li><strong>缺口结构<\/strong>：先端 IT 人材不足 27 万–55 万、従来型可能过剩 10 万——向 BI / SQL / 流程优化补技能的窗口在 Y4+（推断）。<\/li>\n<li><strong>日语门槛<\/strong>：JD 标注等级常低于实务要求，N2 起步可谈系统担当 / 社内 SE，N1 或等效商务级对应 DX 企划 / 导入顾问（推断）。<\/li>\n<li><strong>英语环境岗位<\/strong>：集中在外资 SI / 咨询、全球化物流科技厂商；无公开统计，待复核（推断）。<\/li>\n<\/ol>\n<h2 id=\"s8\"><a id=\"八数据治理与局限\" aria-hidden=\"true\"><\/a>八、数据治理与局限<\/h2>\n<h3 id=\"_32\"><a id=\"核验程度分级\" aria-hidden=\"true\"><\/a>核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：国土交通省（mlit.go.jp）、経済産業省（meti.go.jp）、IPA（ipa.go.jp）、厚生労働省（mhlw.go.jp）、国税庁（民間給与実態統計調査）。<\/li>\n<li><strong>B 权威转引 / 行业机构<\/strong>：日本ロジスティクスシステム協会、WMS/TMS 主要厂商官方资料、doda / レバテック薪资调查、企业公开值（鸿池运输）。<\/li>\n<li><strong>C 平台抽样<\/strong>：求人门户（doda.jp、levtech.jp、求人ボックス）为预期指标；求人ボックス WMS/TMS 实施岗 380 万–800 万为求人事例带。<\/li>\n<\/ul>\n<h3 id=\"_33\"><a id=\"口径冲突并列清单不合并不取均值\" aria-hidden=\"true\"><\/a>口径冲突并列清单（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IT 人才缺口<\/td>\n<td>低位约 16 万 ≠ 中位约 45 万 ≠ 高位约 79 万（同一调查不同情景）<\/td>\n<\/tr>\n<tr>\n<td>薪资<\/td>\n<td>转职登录者统计 ≠ 官方赁金構造基本統計 ≠ 企业公开值<\/td>\n<\/tr>\n<tr>\n<td>外国人就业<\/td>\n<td>雇用保険 5 人以上事业所口径 ≠ 在留统计口径<\/td>\n<\/tr>\n<tr>\n<td>英语环境岗位<\/td>\n<td>无公开统计（推断标注，待复核）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_34\"><a id=\"未取得--待核验项\" aria-hidden=\"true\"><\/a>未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #1、#2：待基线确立；#3：待记录；#6 日语门槛分布：待复核。<\/li>\n<li>英语环境岗位分布（无公开统计）、WMS/TMS 实施岗口径、物流业 vs 全行业 IT 岗对比统一口径：待复核 / 待补。<\/li>\n<\/ul>\n<h3 id=\"_35\"><a id=\"待复核清单逐项复核入口\" aria-hidden=\"true\"><\/a>待复核清单（逐项复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>物流 DX 政策与补贴动向<\/td>\n<td>国土交通省 https://www.mlit.go.jp / 経産省 https://www.meti.go.jp/policy/it_policy/jinzai/index.html<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>数字化岗位求人抽样<\/td>\n<td>doda.jp https://doda.jp/guide/heikin/gyousyu/index.html / levtech.jp https://freelance.levtech.jp/guide/detail/1217/ / 求人ボックス<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>个人技能证书 / 项目进度<\/td>\n<td>自记录（1 月自检机制）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>IT 人才缺口推计修订<\/td>\n<td>経産省 https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf / IPA https://www.ipa.go.jp/digital/chousa/discussion-paper/dx2025_digital_talent_ai_era.html<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>薪资带口径<\/td>\n<td>厚労省（賃金構造基本統計調査）/ doda / レバテック（并列呈现）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>外国人 IT 就业与日语门槛分布<\/td>\n<td>厚労省 https://www.mhlw.go.jp/stf/newpage_75722.html / JISA https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>英语环境岗位分布<\/td>\n<td>求人平台专题抽样（无公开统计）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_36\"><a id=\"监测机制与触发器\" aria-hidden=\"true\"><\/a>监测机制与触发器<\/h3>\n<p><strong>监测节奏<\/strong>：基线 <code>reports/2026-11-industry-technology.md<\/code>（v1.0 首期固定）；年度刷新 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；重大事件插刷（追加件）。无触发器命中且年度窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>触发器清单<\/strong>：<\/p>\n<ol>\n<li>物流 DX 政策 / 补贴新动向 → 技能地图<\/li>\n<li>目标数字化岗位采用条件变化 → 转型路径<\/li>\n<li>新工具 / 系统技能需求出现 → 技能地图 / 转型路径<\/li>\n<li>个人技能里程碑（证书 / 项目完成）→ 技能地图 / 转型路径<\/li>\n<li>IPA / 経産省 IT 人材需給・DX 動向调查发布 / 年度更新（含 2030 缺口推计修订）→ 劳动市场<\/li>\n<li>doda / レバテック等薪资调查年度发布 / 更新 → 劳动市场<\/li>\n<li>外国人 IT 就业统计 / 政策变化（厚労省雇用実態調査、在留・日语要件相关）→ 劳动市场（在留要件变化本身 → 08-visa-immigration）<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>：唯一观察项、首要触发器、触发器结论均为「首期为空」（截至 2026-11-14 无更新）。<\/p>\n<h3 id=\"_37\"><a id=\"待答问题与下一期重点核实项\" aria-hidden=\"true\"><\/a>待答问题与下一期重点核实项<\/h3>\n<p><strong>待答问题<\/strong>：① 物流 DX 政策与补贴的最新动向是什么？② 目标数字化岗位的求人抽样（JD 关键词）最新分布如何？③ IPA / 経産省 IT 人材需給・DX 動向调查的年度更新是否修订 2030 缺口推计？④ doda / レバテック等薪资调查年度更新后，薪资带是否变化？⑤ 外国人 IT 就业统计与日语门槛分布的最新变化如何？⑥ 个人技能证书 / 项目进度的自记录台账何时建立？<\/p>\n<p><strong>下一期重点核实项<\/strong>：登记册 #1、#2 待基线确立项；#3 自记录；#6 日语门槛分布；英语环境岗位抽样；WMS/TMS 实施岗口径。<\/p>\n<p><strong>数据补全计划<\/strong>：登记册 #1、#2 在年度刷新前补齐；建立求人门户抽样台账与薪资多口径并列台账；对自记录项建立 1 月自检机制。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<h3 id=\"_39\"><a id=\"官方一手\" aria-hidden=\"true\"><\/a>官方一手<\/h3>\n<ol>\n<li>経済産業省（meti.go.jp）— IT 人材需給 https://www.meti.go.jp/policy/it_policy/jinzai/gaiyou.pdf （2019）；IT 人材政策 https://www.meti.go.jp/policy/it_policy/jinzai/index.html （2026）<\/li>\n<li>国土交通省（mlit.go.jp）— 物流政策公开资料（2026 核对）<\/li>\n<li>厚生労働省（mhlw.go.jp）— 令和 7 年外国人雇用実態調査 https://www.mhlw.go.jp/stf/newpage_75722.html （2026-08 公表）；賃金構造基本統計調査（ソフトウェア作成者平均约 578 万円，2024 调查）<\/li>\n<li>国税庁 — 民間給与実態統計調査（全国平均给与约 478 万円，令和 6 年分）<\/li>\n<\/ol>\n<h3 id=\"_40\"><a id=\"研究机构与行业团体\" aria-hidden=\"true\"><\/a>研究机构与行业团体<\/h3>\n<ol>\n<li>IPA（ipa.go.jp）— DX 動向 2025 https://www.ipa.go.jp/digital/chousa/discussion-paper/dx2025_digital_talent_ai_era.html （2025-10）<\/li>\n<li>JISA（jisa.or.jp）— 経産省 2026-04 资料 https://www.jisa.or.jp/Portals/0/pdf/meti20260423-1.pdf （2026-04）<\/li>\n<li>日本ロジスティクスシステム協会、WMS/TMS 主要厂商（Netsuite、楽天ロジスティクス、CASSA 等）官方资料<\/li>\n<\/ol>\n<h3 id=\"_41\"><a id=\"求人门户与薪资调查预期指标\" aria-hidden=\"true\"><\/a>求人门户与薪资调查（预期指标）<\/h3>\n<ol>\n<li>レバテック（levtech.jp）— 职种别年收 https://freelance.levtech.jp/guide/detail/1217/ （2026-04 时点）<\/li>\n<li>doda（doda.jp）— 业种别平均年收 https://doda.jp/guide/heikin/gyousyu/index.html （2025）<\/li>\n<li>求人ボックス — 鸿池运输年收 https://xn--pckua2a7gp15o89zb.com/鴻池運輸株式会社の年収 （2025）；WMS/TMS 实施岗 https://xn--pckua2a7gp15o89zb.com/パッケージ導入コンサルタントの仕事 （2026，预期指标）<\/li>\n<\/ol>\n<h3 id=\"_42\"><a id=\"技术学习平台\" aria-hidden=\"true\"><\/a>技术学习平台<\/h3>\n<ol>\n<li>Microsoft Learn（Excel / Power BI 免费官方课）；Udemy 日语系 SQL / Python 课程（官方文档优先）<\/li>\n<\/ol>\n<h3 id=\"_43\"><a id=\"跨主题只读锚\" aria-hidden=\"true\"><\/a>跨主题只读锚<\/h3>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 指标登记册 — 官方统计活值只读引用<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 231, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "06-industry-technology/reports/2026-11-industry-technology.html"}}}, "economy-finance": {"name": "经济与财务", "dir": "07-economy-finance", "months": {"2026-11": {"title": "日本经济与财务 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本经济与财务--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本经济与财务 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要做个人财务规划的读者，兼具行情调研与自我管理视角。\n<strong>来源规则<\/strong>：① 総務省統計局（stat.go.jp 消费物价、家計調査）、厚生労働省（毎月勤労統計）、国税庁（税率）、日本年金機構 ＞ ② 中国国家统计局（工资对比输入——项目指定例外）、中国外汇交易中心（chinamoney.com.cn 汇率中间价）＞ ③ 地域自治体生活成本数据 ＞ ④ 比价门户（预期指标）；每条数据必须附可直接访问的 URL。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：收入结构与薪资行情（薪资基本盘、地域差、收入增长曲线、合规副收边界）；生活成本与储蓄规划（月度成本模型、储蓄率目标、汇款渠道）；税务社保年金（四大公的义务、年金与永住、归档清单）；长期财务规划（10 年里程碑、世帯年收达标模拟、大额决策时机）。<\/li>\n<li><strong>不含<\/strong>：岗位薪资细节与工资构成（→ 02-career-driver）、行业结构与企业动向（→ 04-industry-logistics）、自动驾驶技术面（→ 05-industry-autonomous）、数字化技能（→ 06-industry-technology）、管理岗过渡（→ 03-career-management）、在留资格与永住年收要件（→ 08-visa-immigration）、法规条文解读（→ 09-politics-law）、日语学习（→ 11-language-japanese）、资格与教育投资（→ 10-education-qualification）、官方统计活值（→ 01-ssw-driver，只读引用）。<\/li>\n<\/ul>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>运输業月均工资与最低賃金的最新水平及年度变动方向如何？<\/li>\n<li>100 日元汇率中间价的近期水平对日元计价收入与对华汇款意味着什么？<\/li>\n<li>单身司机的月度生活成本与可实现储蓄率处于什么区间？<\/li>\n<li>四大公的义务负担率与年金缴纳证据链是否完整、是否构成永住风险？<\/li>\n<li>10 年财务里程碑与世帯年收达标模拟的关键变量（配偶者就业收入）如何变化？<\/li>\n<\/ol>\n<p><strong>初步结论<\/strong>：<\/p>\n<ol>\n<li><strong>收入基本盘已由官方与锚定活值共同确立<\/strong>（事实）：运输業月均工资 341,158 円（2026-09，锚 01-ssw-driver #5）与最低賃金 1,177 円（2026 年度）均为可溯源活值，可作为收入维度基线。<\/li>\n<li><strong>最低賃金处于年度上行通道<\/strong>（事实 + 推断）：2025 年度 1,118 円/h 与 2026 年度 1,177 円并列，差值 59 円，与手册「年涨 40–60 円」经验法则一致。<\/li>\n<li><strong>汇率与 CPI 尚不足以支撑中日对比结论<\/strong>（事实）：汇率有 2026-11-10 活值（100 日元中间价 4.2355 元），但 CPI 待基线确立，购买力与汇款时点判断暂不成立。<\/li>\n<li><strong>生活成本与储蓄率仅为规划估算<\/strong>（事实）：10.5–17.0 万円/月与 35% / 45% 目标线为手册估算值，在个人收支结算（待记录）补齐前不得作为结论使用。<\/li>\n<li><strong>税社负担结构清晰但缺活值<\/strong>（事实）：四大公的义务比例明确，但年金 / 社保个人负担率待基线确立，净收入模型无法闭合。<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>登记册 6 项追踪指标截至 2026-11-14 的活值状态（来源：<code>data/economy_indicator_registry.md<\/code>）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">追踪项<\/th>\n<th style=\"width:25%\">登记册活值<\/th>\n<th style=\"width:25%\">本期变动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>運輸業月均工资<\/td>\n<td>341,158 円（2026-09，锚 01-ssw-driver #5）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>最低賃金 全国平均<\/td>\n<td>1,177 円（2026 年度）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>100 日元汇率中间价<\/td>\n<td>4.2355 元（2026-11-10，chinamoney.com.cn）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>CPI 综合指数（日本）<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>年金 / 社保个人负担率<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>个人月度收支结算<\/td>\n<td>待记录<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：唯一观察项、首要触发器、触发器结论均为「首期为空」；business-config 第七节的六个触发器（每月勤労統計月次更新、最低賃金年度改定、汇率大幅波动、税制 / 社保年金费率修订、消费物价统计月次更新、个人收支月度结算）本期均未命中，无可报变化。<\/p>\n<p><strong>结构变更备注<\/strong>（非数据变动）：2026-11-14 原合并版知识手册已按四大维度拆分至 <code>handbook/<\/code>（00–04 共 5 个文档），编号 01–04 与登记册指标、触发器映射保持一一对应；原合并版全文存档于 <code>reports/archives/2026-11-economy-finance-merged-v1.0.md<\/code>。本报告为该结构下的首期九节骨架版。<\/p>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版为复用生成：继承历史报告（v1.0 首份分析，数据基准 2026-11-13）的口径裁决与来源分级，<strong>无新增修正<\/strong>。历史报告未列独立「已修正事实清单」；其口径要点（税引前月収 ≠ 手取り；家計調査 ≠ 勤労統計；最低賃金全国平均 ≠ 都道府県加权；运输業月均工资 ≠ 含赏与年收）原样保留于第三、八节。<\/p>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<p>本节承载经济制度环境与「公的义务」政策面（business-config 3.2：03 章税务社保年金 → 本节 / 第七节）。<\/p>\n<p><strong>收入制度的年度改定通道（事实）<\/strong>：最低賃金每年 10 月改定，手册经验法则为年涨 40–60 円；2025 年度全国加权平均 1,118 円/h（手册）与 2026 年度全国平均 1,177 円（登记册）并列，差值 59 円，落在经验区间内。年度核对项：每年 10 月刷新最低賃金与本行业薪资行情；每年 3 月对照前年收入 vs 计划曲线偏差（手册 01）。<\/p>\n<p><strong>税制与社保年金费率（事实，结构清晰、活值待补）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">负担<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>所得税<\/td>\n<td>5–45% 超累进<\/td>\n<td>公司源泉征收，年末调正处理大部分<\/td>\n<\/tr>\n<tr>\n<td>住民税<\/td>\n<td>所得约 10%<\/td>\n<td>次年 6 月起从工资扣<\/td>\n<\/tr>\n<tr>\n<td>健康保险（会社健保 / 协けん）<\/td>\n<td>约 5%（公司对半）<\/td>\n<td>加入职场保险，不要滞留国民健康保险<\/td>\n<\/tr>\n<tr>\n<td>厚生年金<\/td>\n<td>9.15%（公司对半，合计 18.3%）<\/td>\n<td><strong>永住审查核心项<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>到手工资 ≈ 额面 −（所得税 + 住民税 + 社保个人负担）≈ 额面的 78–85%（手册估算，<strong>待核验<\/strong>）；登记册 #5「年金 / 社保个人负担率」待基线确立。<\/p>\n<p><strong>红线（事实）<\/strong>：住民税·社保滞纳 = 永住取消要件（3 年）+ 在留更新减分——零容忍（手册 03）；公的义务的缴纳记录同时是永住证据链资产。<\/p>\n<p><strong>政策面交叉引用<\/strong>：岗位薪资细节与工资构成 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">../02-career-driver/reports/2026-11-career-driver.md<\/a>；法规框架解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">../09-politics-law/reports/2026-11-politics-law.md<\/a>；永住年收要件与取消风险 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">../08-visa-immigration/reports/2026-11-visa-immigration.md<\/a>；管理岗晋升与收入曲线 → <a href=\"../../03-career-management/reports/2026-11-career-management.md\">../03-career-management/reports/2026-11-career-management.md<\/a>。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<p><strong>收入结构与薪资行情（手册 01，信息核对日期 2026-11-11）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">数值（约）<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>全职业平均年收<\/td>\n<td>450–460 万円<\/td>\n<td>国税厅民间给与实态统计<\/td>\n<\/tr>\n<tr>\n<td>卡车司机平均年收<\/td>\n<td><strong>约 430 万円<\/strong><\/td>\n<td>2026 年市场数据（<strong>待核验<\/strong>，未标注发布机构）<\/td>\n<\/tr>\n<tr>\n<td>大型干线司机月给<\/td>\n<td>35–43 万円<\/td>\n<td>求人行情（<strong>待核验<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>一般配送司机月给<\/td>\n<td>25–33 万円<\/td>\n<td>同上（<strong>待核验<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>最低賃金（全国加权平均）<\/td>\n<td>1,118 円/h（2025 年度）<\/td>\n<td>每年 10 月改定，年涨 40–60 円<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>数据来源：全职业平均年收与最低賃金分别以国税厅、厚生劳动省公开统计为准 [Source: https://www.nta.go.jp/, 2025] [Source: https://www.mhlw.go.jp/, 2025]。<\/p>\n<\/blockquote>\n<p><strong>登记册活值（权威口径）<\/strong>：运输業月均工资 341,158 円（2026-09，厚労省毎月勤労統計，锚 01-ssw-driver #5）；最低賃金 全国平均 1,177 円（2026 年度，厚生労働省）；100 日元汇率中间价 4.2355 元（2026-11-10，chinamoney.com.cn）。<\/p>\n<p><strong>收入增长曲线（本规划 10 年，推断）<\/strong>：Y1–2 司机初期 月给 25–28 万（加班受 2024 规制约束）→ Y3–5 司机成熟 + 冷键 / 大型 28–35 万 → Y5–8 运行管理 / 配车 30–40 万 + 赏与增加 → Y8–10 主任 / 管理岗 35–45 万（永住世帯年收达标窗口）。<\/p>\n<p><strong>地域差（选公司时用，手册）<\/strong>：东京圈岗位最多但成本高、实际储蓄率未必最高；北关东（群马 / 栃木 / 埼玉北部）物流仓库密集、成本适中；东海（爱知）制造 + 物流双密集、外国人支援体制最成熟；九州（福冈）对华交通方便、干线岗位多；豪雪地区（北陆 / 东北）薪资含冬季手当但初学者驾驶风险高。经验法则：地方干线岗位名义薪资 ≥ 东京圈，加上房租差，<strong>可支配收入的差距比薪资差距更大<\/strong>。<\/p>\n<p><strong>生活成本与储蓄规划（手册 02，单身·地方都市）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">范围（万円/月）<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房租（1K/1LDK）<\/td>\n<td>4.5–7.0<\/td>\n<td>公司寮可压到 2–3.5 万<\/td>\n<\/tr>\n<tr>\n<td>水道光热<\/td>\n<td>1.0–1.5<\/td>\n<td>司机早出晚归，家中用电少<\/td>\n<\/tr>\n<tr>\n<td>食费<\/td>\n<td>3.0–4.5<\/td>\n<td>自炊 60% + 外食 40%<\/td>\n<\/tr>\n<tr>\n<td>通信<\/td>\n<td>0.6–1.0<\/td>\n<td>格安 SIM 3GB ≈ 1–3 千円<\/td>\n<\/tr>\n<tr>\n<td>交通<\/td>\n<td>0–0.5<\/td>\n<td>岗位多提供通勤手当或寮<\/td>\n<\/tr>\n<tr>\n<td>杂费·社交·文化<\/td>\n<td>1.5–2.5<\/td>\n<td>含日语学习支出<\/td>\n<\/tr>\n<tr>\n<td><strong>合计<\/strong><\/td>\n<td><strong>10.5–17.0<\/strong><\/td>\n<td>常见 12–14 万（<strong>待核验<\/strong>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>储蓄模型：月给 21 万 → 储 9 万（43%，月生活 12 万）；25 万 → 储 13 万（52%）；30 万 → 储 18 万（60%）。目标线：<strong>到手 35% 为及格、45% 为良好<\/strong>（储蓄含向国内汇款）。年度支出易漏项：自动车税 + 车辆相关年 3–5 万、JLPT 考试费每次约 4,500–5,500 円、资格讲习每次 3–10 万、归国机票年 1–2 次 ×3–10 万、年金·社保约工资的 14–15% 负担。<\/p>\n<p><strong>口径并列（不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">口径 A<\/th>\n<th style=\"width:25%\">口径 B<\/th>\n<th style=\"width:25%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>最低賃金<\/td>\n<td>1,118 円/h（2025 年度，手册）<\/td>\n<td>1,177 円（2026 年度，登记册）<\/td>\n<td>年度不同，并列呈现<\/td>\n<\/tr>\n<tr>\n<td>司机收入<\/td>\n<td>运输業月均工资 341,158 円（厚労省，2026-09）<\/td>\n<td>卡车司机平均年收 约 430 万円（市场数据，2026）<\/td>\n<td>月均工资 ≠ 含赏与年收，不得直接对比<\/td>\n<\/tr>\n<tr>\n<td>收入<\/td>\n<td>税引前月収 ≠ 手取り（社保·税后）<\/td>\n<td>—<\/td>\n<td>两者不得混算<\/td>\n<\/tr>\n<tr>\n<td>工资统计<\/td>\n<td>家計調査（世帯）≠ 勤労統計（事業所）<\/td>\n<td>—<\/td>\n<td>世帯 vs 事業所口径<\/td>\n<\/tr>\n<tr>\n<td>中日对比<\/td>\n<td>100 日元中间价 ≠ 1 CNY 折算<\/td>\n<td>—<\/td>\n<td>汇率日不同，须注明<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>官方统计锚（只读）<\/strong>：运输業工资、100 日元汇率与净收入模型口径以 01-ssw-driver 登记册 #5 及其最新报告 3.5 节为锚（<a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">../01-ssw-driver/reports/2026-11-ssw-driver.md<\/a>），本主题不独立回写。<\/p>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<p>本节按「雇主形态如何影响收入与成本」的财务视角细分（business-config 3.2 未指定锚，本节为独立成节）。<\/p>\n<p><strong>雇主形态与净收入（手册 01 / 02）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr
