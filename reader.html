）熟悉生态，再逐步转为志愿者——「有求于人 → 被人需要」是融入最快的路径<\/li>\n<li>社群价值与职业信息边界 → <a href=\"#02-生活指南与适应\">02-生活指南与适应（四、心理健康与社群）<\/a><\/li>\n<\/ul>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 357, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "12-culture-life/reports/2026-11-culture-life.html"}}}, "regional-info": {"name": "地区信息", "dir": "13-regional-info", "months": {"2026-11": {"title": "日本地域信息 · 首份分析报告", "body": "\n<h1 id=\"_1\">日本地域信息 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：市场指标监测型（market-monitoring）\n<strong>受众定位<\/strong>：面向拟在日本选择就业地 / 定居地、需要地域横向对比与决策框架的读者，兼具就业地选择与长期定居规划视角。\n<strong>来源规则<\/strong>：① 国土交通省（住居・地価統計）、総務省統計局（地域统计）、気象庁（警報・注意報 / 多言語防災気象情報）、防災庁（防灾政策与大规模灾情）、厚生労働省（医師・歯科医師・薬剤師統計）/ 文部科学省（外国人児童生徒调查）、各都道府県 / 市町村官网（business-config 第五节）。<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本地域信息知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<h3 id=\"11\">1.1 主题定义与监测范围<\/h3>\n<p><strong>含<\/strong>（business-config 3.1）：面向个人地域决策支持——地域选择框架（7 维评分框架、候选地域速览、决策流程）；地域间公共服务差异视角（医疗资源地域差、教育资源地域差）；地域生活笔记（定居地档案模板、生活发现、防灾与安全、地域防灾情报渠道、季度观察）。\n<strong>不含<\/strong>（交叉引用，不在本主题展开）：薪资地域差；求职渠道地域策略；保险体系与就医流程细节；就学手续与学制细节；灾害时外国人支援政策环境；岗位密度 / 薪资地域差活值。<\/p>\n<h3 id=\"12\">1.2 受众与用途<\/h3>\n<p>输出地域选择框架、地域差对比与决策输入；不给落户价位、不给单一「最优地域」结论；个人地域选择为自记录个案，标注记录日期；统计类数据注明都道府県 / 市町村口径（business-config 第二节）。<\/p>\n<h3 id=\"13\">1.3 核心监测问题<\/h3>\n<ol>\n<li>候选地域在 7 维评分框架（岗位供给、薪资×成本、外国人支援、同胞密度、交通/归国便利、灾害风险、生活品质）下如何横向比较？<\/li>\n<li>目标地域的司机求人件数、賃貸挂牌行情等预期指标最新读数如何？<\/li>\n<li>地域间公共服务差异（医师数 / 病床数、日语指导体制）的最新官方数据与地域差结构如何？<\/li>\n<li>外国人支援窗口与多语言防灾情报渠道的可得性在自治体间差异如何？<\/li>\n<li>个人地域选定期与定居地档案何时可建立并滚动维护？<\/li>\n<\/ol>\n<h3 id=\"14\">1.4 跨主题分工<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>薪资地域差<\/td>\n<td>07-economy-finance<\/td>\n<\/tr>\n<tr>\n<td>求职渠道地域策略<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>保险体系与就医流程细节<\/td>\n<td>12-culture-life<\/td>\n<\/tr>\n<tr>\n<td>就学手续与学制细节<\/td>\n<td>10-education-qualification<\/td>\n<\/tr>\n<tr>\n<td>灾害时外国人支援政策环境<\/td>\n<td>09-politics-law<\/td>\n<\/tr>\n<tr>\n<td>岗位密度 / 薪资地域差活值<\/td>\n<td>01-ssw-driver（只读引用）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位供给<\/td>\n<td>目标地域在招司机岗位密度<\/td>\n<td>核心指标 #1<\/td>\n<td>HelloWork 地域检索<\/td>\n<td>季度窗口 + 月度触发核对<\/td>\n<\/tr>\n<tr>\n<td>居住成本<\/td>\n<td>目标地域挂牌租金水平（预期指标）<\/td>\n<td>核心指标 #2<\/td>\n<td>賃貸门户<\/td>\n<td>季度窗口采集<\/td>\n<\/tr>\n<tr>\n<td>外国人支援<\/td>\n<td>自治体外籍支援窗口与多语服务可得性<\/td>\n<td>核心指标 #3<\/td>\n<td>自治体官网<\/td>\n<td>季度触发（制度变化）<\/td>\n<\/tr>\n<tr>\n<td>公共服务地域差<\/td>\n<td>医师数 / 病床数 / 日语指导体制的地域差<\/td>\n<td>—（登记册未设独立指标，基线报告差异视角小节承载）<\/td>\n<td>厚生労働省 / 文部科学省 / e-stat<\/td>\n<td>季度触发（统计年度发布）+ 年度<\/td>\n<\/tr>\n<tr>\n<td>个人地域选定期<\/td>\n<td>自记录决策时点与定居复盘<\/td>\n<td>核心指标 #4<\/td>\n<td>自记录<\/td>\n<td>Offer 比较 / 定居后复盘触发即时核对<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：求人件数与賃貸行情是硬约束（收入与成本），外国人支援与公共服务地域差是软环境，个人选定期是决策时点；四者共同输入 7 维评分框架。当前登记册 #1–#4 均待基线确立 / 待记录，故本期只能给出框架与定性判断，不能给出数值化地域比较。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 岗位供给（目标地域司机求人件数）<\/h3>\n<ul>\n<li>登记册 #1「目标地域司机求人件数」：<strong>待基线确立<\/strong>（优先数据源 HelloWork 地域检索）。<\/li>\n<li>口径与触发（登记册 / business-config 第七节）：求人件数 = HelloWork 地域检索，在招口径 ≠ 实际雇佣人数；目标地域岗位密度 / 条件显著变化（联动 02-career-driver 求人抽样）→ 01。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 居住成本（賃貸挂牌行情）<\/h3>\n<ul>\n<li>登记册 #2「目标地域賃貸挂牌行情（预期指标）」：<strong>待基线确立<\/strong>（优先数据源 賃貸门户）。<\/li>\n<li>口径（business-config 第四节 / 登记册）：登记口径（地価公示）≠ 挂牌口径（賃貸门户），预期指标 ≠ 实际成交 / 登记值；薪资×成本维度按\"名义薪资 − 房租 / 物价 = 可支配\"评估，\"地方\" ≠ \"东京圈\"的薪资对比须同岗位分层。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 外国人支援（支援窗口与多语服务）<\/h3>\n<ul>\n<li>登记册 #3「目标地域外国人支援窗口」：<strong>待基线确立<\/strong>（优先数据源 自治体官网）。<\/li>\n<li>候选地域速览（事实，基线报告，\"待实地补充\"）：埼玉（本庄 / 深谷 / 熊谷）物流仓密集、近东京、成本中；群马（太田 / 伊势崎）传统物流重镇、外国人多；爱知（名古屋周边）岗位最厚、支援体制最成熟；静冈（富士 / 沼津）新东名自动驾驶实证沿线；福冈（北九州 / 福冈）归国方便、薪资佳；北海道 / 东北 薪资含冬季手当、豪雪初学者不宜。<\/li>\n<li>决策流程（事实，基线报告）：Offer 阶段用 7 维框架打分（≥3.5 考虑）；入职前读该自治体「外国人生活ガイド」（官网多有中文版）；落地 1 个月后实际体验 vs 预期复盘，写入 02-地域生活笔记。<\/li>\n<li>多语言防灾情报渠道（事实，基线报告，2026-11-12 验证）：国家预警 = 气象厅警報・注意報（jma.go.jp）；多语言版 = 防災気象情報多语言版（含简体中文，data.jma.go.jp）；中央防灾 = 防災庁（2026-11-02 由内阁府防灾改组发足，bousai.go.jp）；多语言灾情媒体 = NHK WORLD-JAPAN 多语言链接（约 20 种语言，nhkworld）。<\/li>\n<li>待复核：自治体防灾邮件 / LINE 公式账号 / 防灾行政无线的具体渠道与登记方式（待定居地确定后补）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 公共服务地域差（医疗 / 教育资源）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">对比视角<\/th>\n<th style=\"width:20%\">指标口径<\/th>\n<th style=\"width:20%\">数值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>病床数地域差<\/td>\n<td>病院の一般病床<\/td>\n<td>879,728 床（全国）<\/td>\n<td>厚生労働省 令和 6 年医療施設調査<\/td>\n<td>2024-10-01<\/td>\n<\/tr>\n<tr>\n<td>医师数地域差<\/td>\n<td>人口 10 万対医師数（従業地 / 居住地口径须区分）<\/td>\n<td>具体数值待核验<\/td>\n<td>厚生労働省 医師・歯科医師・薬剤師統計<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>日语指导体制<\/td>\n<td>日本語指導が必要な児童生徒（公立）<\/td>\n<td>84,759 人<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年度<\/td>\n<\/tr>\n<tr>\n<td>日语指导体制（外国籍）<\/td>\n<td>其中外国籍<\/td>\n<td>73,313 人（较上次 +27.0%）<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年度<\/td>\n<\/tr>\n<tr>\n<td>外国人儿童就学把握体制<\/td>\n<td>「外国人の子供の就学状況等調査」第 6 回<\/td>\n<td>调查已全国实施（自治体间把握体制仍有差异）<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年 5 月 1 日现在<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>对决策的含义（推断，基线报告标注）：医师向大都市圈集中——地方都市的夜间救急 / 专科就医半径先查到二次医疗圈；病床分布影响重伤 / 产育时的转院半径；不就学风险存在地域差；日语指导教室有无、教员配置密度因自治体差异大——子女同赴前直接问市区町村教育委员会。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 个人地域选定期<\/h3>\n<ul>\n<li>登记册 #4「个人地域选定期」：<strong>待记录<\/strong>（优先数据源 自记录）。定居地档案模板（事实，基线报告 02 节）：确定居住地后复制改名（如 <code>02-地域生活笔记-群马太田.md<\/code>），含城市 / 区、入住时间、房租 / 通勤、自治体外籍支援窗口、免费日语教室、主要医院 / 夜间救急、常用店等字段；当前各字段为空白待填。<\/li>\n<\/ul>\n<h3 id=\"36\">3.6 数据冲突并列（不可合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>薪资地域差<\/td>\n<td>厚労省賃金統計（名义工资）≠ 求人平台月収（含手当）；须同岗位分层<\/td>\n<\/tr>\n<tr>\n<td>租金<\/td>\n<td>登记口径（地価公示）≠ 挂牌口径（賃貸门户）<\/td>\n<\/tr>\n<tr>\n<td>岗位密度<\/td>\n<td>HelloWork 地域件数（在招口径）≠ 实际雇佣人数<\/td>\n<\/tr>\n<tr>\n<td>医疗服务<\/td>\n<td>人口 10 万対医師数（従業地 / 居住地口径须区分）≠ 病床数<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"37\">3.7 未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #1、#2、#3：待基线确立；登记册 #4：待记录。<\/li>\n<li>人口 10 万対医師数具体数值：待核验；自治体防灾邮件 / LINE 具体渠道与登记方式：待定居地确定后复核。<\/li>\n<li>基线报告遗留项（business-config 第十一节）：无免责声明节、无 <code>.report-nav<\/code> 顶部导航，待下一期按模板重写时补齐。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<p><strong>结论 1<\/strong>：本主题当前处于\"框架就绪、活值待建\"状态。证据：7 维评分框架与决策流程已建立（基线报告 01 节）；登记册 #1–#4 均待基线确立 / 待记录。标注：事实。<\/p>\n<p><strong>结论 2<\/strong>：地域差在公共服务领域呈系统性存在。证据：病院一般病床 879,728 床（厚生労働省 令和 6 年医療施設調査，2024-10-01）；日本語指導が必要な児童生徒 84,759 人、其中外国籍 73,313 人、较上次 +27.0%（文部科学省，令和 7 年度）。标注：事实。<\/p>\n<p><strong>结论 3<\/strong>：横向比较须先固定口径，否则存在混算风险。证据：登记册口径清单列明登记口径 ≠ 挂牌口径、都道府県 ≠ 市町村、従業地 / 居住地口径须区分。标注：事实。<\/p>\n<p><strong>结论 4<\/strong>：不就学风险与日语指导资源存在地域差。证据：调查已全国实施但自治体间把握体制仍有差异；日语指导教室有无、教员配置密度因自治体差异大（基线报告标注「推断」）。标注：推断。<\/p>\n<p><strong>结论 5<\/strong>：候选地域速览为定性判断，不构成「最优地域」结论。证据：基线报告候选地域速览表（自述\"待实地补充\"）；business-config 第二节结论边界。标注：事实（属定性清单，非排名）。<\/p>\n<p><strong>结论 6<\/strong>：多语言防灾情报已具备国家级入口，自治体层登记动作待补齐。证据：气象厅多语言版、NHK WORLD-JAPAN 多语言链接可访问（2026-11-12 验证）；自治体防灾邮件 / LINE 具体渠道待定居地确定后复核。标注：事实 + 待办。<\/p>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>登记册 4 项活值均未建立，报告无法给出数值化地域对比。<\/li>\n<li>门户数据为预期指标，不等于实际成交 / 登记值。<\/li>\n<li>统计域口径（都道府県 vs 市町村、従業地 vs 居住地）未固定前，地域差解读存在混算风险。<\/li>\n<li>基线报告无免责声明节与顶部导航（遗留项，待下一期重写补齐）。<\/li>\n<li>个人定居地档案为空白模板，个人地域选择尚未记录。<\/li>\n<\/ul>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>（分析层）：<\/p>\n<ol>\n<li>目标地域（Offer 比较时）的司机求人件数如何采集并固定口径？<\/li>\n<li>賃貸挂牌行情（预期指标）的季度采集窗口与登记口径（地価公示）如何并列呈现？<\/li>\n<li>人口 10 万対医師数的具体数值何时可从厚生労働省统计取得，地域差结构如何？<\/li>\n<li>日语指导体制（教室有无、教员配置密度）在候选自治体间的差异如何核实？<\/li>\n<li>自治体防灾邮件 / LINE 登记渠道与多语服务在候选地如何确认？<\/li>\n<li>个人地域选定期与定居地档案何时建立并进入滚动维护？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：登记册 #1–#4 待基线确立 / 待记录项；人口 10 万対医師数数值；自治体防灾渠道。<\/p>\n<p><strong>数据补全计划<\/strong>：月度窗口核对 HelloWork 求人件数与门户挂牌行情；季度窗口核对自治体支援制度变化；统计类来源按官方发布节奏（年度 / 季度）核对并按「增量留痕」原则回写登记册（保留历史值、不覆盖）。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>目标地域司机求人件数<\/td>\n<td>待基线确立<\/td>\n<td>HelloWork 地域检索<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>目标地域賃貸挂牌行情（预期指标）<\/td>\n<td>待基线确立<\/td>\n<td>賃貸门户<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>目标地域外国人支援窗口<\/td>\n<td>待基线确立<\/td>\n<td>自治体官网<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人地域选定期<\/td>\n<td>待记录<\/td>\n<td>自记录<\/td>\n<td>待记录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>注：本表逐项抄录登记册活值，未改写数值；「待基线确立 / 待记录」如实保留。<\/p>\n<\/blockquote>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：<\/p>\n<ul>\n<li>基线：<code>reports/2026-11-regional-info.md<\/code>（v1.0 首期固定）。<\/li>\n<li>月度：<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>。<\/li>\n<li>季度：<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>。<\/li>\n<li>年度：<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>。<\/li>\n<li>登记册年度处理：按「增量留痕」原则回写本登记册（保留历史值、不覆盖），不强制另存年度新版文件。<\/li>\n<li>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/li>\n<\/ul>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节，逐条列出）：<\/p>\n<ol>\n<li>（月度）目标地域岗位密度 / 条件显著变化（联动 02-career-driver 求人抽样）→ 01<\/li>\n<li>（月度）防灾气象预警体系与配信渠道变化（気象庁 / 内閣府防災）→ 02 防灾小节<\/li>\n<li>（季度）地域生活支援制度变化（自治体）→ 02<\/li>\n<li>（季度）医师数等医疗·教育资源统计年度发布（厚労省 / 文科省）→ 01 差异视角小节<\/li>\n<li>（年度）国交省地価统计 / 地域统计年度发布 → 01<\/li>\n<li>（年度）个人选定目标地域 → 01 / 02<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册同名节）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">状态项<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">更新于<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>唯一观察项<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>首要触发器<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>触发器结论<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：<\/p>\n<ul>\n<li>A 官方一手：厚生労働省（医療施設調査、医師・歯科医師・薬剤師統計）、文部科学省（外国人児童生徒调查）、気象庁、防災庁、総務省統計局、国土交通省、各都道府県 / 市町村官网。<\/li>\n<li>B 权威转引 / 聚合：HelloWork 地域检索（岗位密度一手聚合）、JETRO 地域信息；C 平台抽样 / 门户：賃貸 / 生活门户（挂牌口径，仅预期指标）；地域媒体。<\/li>\n<\/ul>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">并列口径<\/th>\n<th style=\"width:34%\">处理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>薪资地域差<\/td>\n<td>厚労省賃金統計（名义工资）≠ 求人平台月収（含手当）<\/td>\n<td>须同岗位分层<\/td>\n<\/tr>\n<tr>\n<td>租金<\/td>\n<td>登记口径（地価公示）≠ 挂牌口径（賃貸门户）<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>岗位密度<\/td>\n<td>HelloWork 地域件数（在招口径）≠ 实际雇佣人数<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>医疗服务<\/td>\n<td>人口 10 万対医師数（従業地 / 居住地口径须区分）≠ 病床数<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：<\/p>\n<ul>\n<li>登记册 #1、#2、#3：待基线确立；登记册 #4：待记录；人口 10 万対医師数具体数值待核验。<\/li>\n<li>自治体防灾邮件 / LINE 具体渠道：待定居地确定后复核；基线报告遗留项：无免责声明节、无顶部导航（待下一期重写补齐）。<\/li>\n<\/ul>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li>厚生労働省 医師・歯科医師・薬剤師統計 — https://www.mhlw.go.jp/toukei/list/33-20.html （2026 核对）<\/li>\n<li>厚生労働省 令和 6 年医療施設調査 — https://www.mhlw.go.jp/toukei/saikin/hw/iryosd/24/index.html （2024）<\/li>\n<li>文部科学省 帰国・外国人児童生徒等の現状 — https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm （2026 核对，令和 7 年度调查）<\/li>\n<li>気象庁 警報・注意報 — https://www.jma.go.jp/bosai/warning/ （2026 核对）<\/li>\n<li>気象庁 多言語ページ（防災気象情報多语言版） — https://www.data.jma.go.jp/multi/yoho/index.html?lang=cn_zs （2026 核对）<\/li>\n<li>防災庁 — https://www.bousai.go.jp （2026 核对；2026-11-02 发足）<\/li>\n<li>NHK WORLD-JAPAN 多言語リンク — https://www3.nhk.or.jp/nhkworld/en/multilingual_links/ （2026 核对）<\/li>\n<li>総務省自治体「外国人生活ガイド」入口 — https://www.soumu.go.jp/ （2026 核对）<\/li>\n<li>HelloWork 地域检索（岗位密度聚合；登记册 #1 优先来源）；賃貸 / 生活门户（挂牌口径，仅预期指标；登记册 #2 优先来源）<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本地域信息知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本地域信息知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11-12\n<strong>说明<\/strong>：本文档由原分散的多份章节文档合并整理而成，保留全部原内容与层级关系。后续更新请直接维护本单份文档。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">导航与使用约定<\/h3>\n<h3 id=\"13-regional-info\">13-regional-info 索引<\/h3>\n<p>地域信息区。覆盖地域选择决策与定居后的生活记录。<\/p>\n<h4 id=\"_14\">文件一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>地域选择框架<\/td>\n<td>7 维评分框架、候选地域速览、决策流程<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>地域生活笔记<\/td>\n<td>定居地档案模板（确定后复制使用）、防灾安全、季度观察<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_15\">关联目录<\/h4>\n<ul>\n<li>薪资地域差 → ../../07-economy-finance/reports/archives/01-收入结构与薪资行情<\/li>\n<li>落地手续 → ../../12-culture-life/reports/02-生活指南与适应<\/li>\n<\/ul>\n<h4 id=\"_16\">使用约定<\/h4>\n<ul>\n<li>Offer 比较时用 01 打分；定居后以 02 为生活台账。<\/li>\n<\/ul>\n<h4 id=\"_17\">更新日志<\/h4>\n<h5 id=\"2026-11-12\">2026-11-12（维度扩充：章内增补）<\/h5>\n<p><strong>变更摘要<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">章节<\/th>\n<th style=\"width:20%\">变更点<\/th>\n<th style=\"width:20%\">旧值/旧说法<\/th>\n<th style=\"width:20%\">新值（来源/年份）<\/th>\n<th style=\"width:20%\">性质<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>新增小节「地域间公共服务差异视角」<\/td>\n<td>无<\/td>\n<td>医疗/教育 2 个横向对比视角表（mhlw.go.jp、mext.go.jp、e-stat.go.jp 验证 2026-11-12），交叉引用 culture-life 03 医疗、education 03 子女教育<\/td>\n<td>新增<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>新增小节「地域防灾情报渠道」<\/td>\n<td>无<\/td>\n<td>国家预警/多语言/自治体/中央防灾 3 层渠道表（jma.go.jp、bousai.go.jp 验证 2026-11-12；防灾庁 2026-11-02 发足），反向引用 politics-law 02<\/td>\n<td>新增<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待复核清单<\/strong><\/p>\n<ul>\n<li>目标定居地防灾邮件/LINE 具体渠道与登记方式（待定居地确定后补）<\/li>\n<\/ul>\n<blockquote>\n<p>2026-11-12 复核已闭环：病床数取令和 6 年医療施設調査（病院一般病床 879,728 床）；NHK WORLD-JAPAN 多语言入口已确认可访问；日语指导调查数值取令和 7 年度（外国籍 73,313 人）。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"01\">01 地域选择框架<\/h3>\n<blockquote>\n<p>选地域=选收入结构、生活成本、社群密度、灾害风险的综合决策。用于入职前与转职时。<\/p>\n<\/blockquote>\n<h4 id=\"15\">一、评分框架（每地打分 1–5）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">维度<\/th>\n<th style=\"width:33%\">权重<\/th>\n<th style=\"width:34%\">关键问题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位供给<\/td>\n<td>×3<\/td>\n<td>特定技能+干线岗位多吗？有 2 号移行先例的公司吗？<\/td>\n<\/tr>\n<tr>\n<td>薪资×成本<\/td>\n<td>×3<\/td>\n<td>名义薪资 − 房租/物价 = 可支配多少？<\/td>\n<\/tr>\n<tr>\n<td>外国人支援<\/td>\n<td>×2<\/td>\n<td>自治体窗口、多语医疗、日语教室<\/td>\n<\/tr>\n<tr>\n<td>同胞/前辈密度<\/td>\n<td>×1<\/td>\n<td>太少孤独，太多竞争——中间为佳<\/td>\n<\/tr>\n<tr>\n<td>交通/归国便利<\/td>\n<td>×1<\/td>\n<td>国际机场、港口<\/td>\n<\/tr>\n<tr>\n<td>灾害风险<\/td>\n<td>×1<\/td>\n<td>地震带/洪水地图/豪雪<\/td>\n<\/tr>\n<tr>\n<td>生活品质<\/td>\n<td>×1<\/td>\n<td>自然、育儿、医疗资源（长期定居视角）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_18\">二、候选地域速览（待实地补充）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">地域<\/th>\n<th style=\"width:33%\">优势<\/th>\n<th style=\"width:34%\">注意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>埼玉（本庄/深谷/熊谷）<\/td>\n<td>物流仓密集、近东京、成本中<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>群马（太田/伊势崎）<\/td>\n<td>传统物流重镇、外国人多<\/td>\n<td>冬季行车<\/td>\n<\/tr>\n<tr>\n<td>爱知（名古屋周边）<\/td>\n<td>岗位最厚、支援体制最成熟<\/td>\n<td>竞争也多<\/td>\n<\/tr>\n<tr>\n<td>静冈（富士/沼津）<\/td>\n<td><strong>新东名自动驾驶实证沿线<\/strong>——观察特别加分<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>福冈（北九州/福冈）<\/td>\n<td>归国方便、薪资佳<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>北海道/东北<\/td>\n<td>薪资含冬季手当<\/td>\n<td>豪雪，初学者不宜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_19\">三、决策流程<\/h4>\n<ol>\n<li>Offer 阶段：用本框架对候选地打分（≥3.5 考虑）<\/li>\n<li>入职前：读该自治体「外国人生活ガイド」（官网多有中文版）[Source: https://www.soumu.go.jp/, 2026]<\/li>\n<li>落地 1 个月后：实际体验 vs 预期复盘，写入 <a href=\"#02-地域生活笔记\">02-地域生活笔记<\/a><\/li>\n<\/ol>\n<h4 id=\"_20\">地域间公共服务差异视角<\/h4>\n<!-- updated: 2026-11-12 | 新增小节 -->\n\n<blockquote>\n<p>评分框架的补充视角：公共服务水平在日本国内存在系统性地域差，转职/定居前横向比对。保险与就医流程、学制等制度细节由专门主题维护（见下方交叉引用），本节只做地域差视角与官方数据入口。<\/p>\n<\/blockquote>\n<p><strong>医疗资源地域差<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">对比视角<\/th>\n<th style=\"width:25%\">指标口径<\/th>\n<th style=\"width:25%\">官方数据入口<\/th>\n<th style=\"width:25%\">对决策的含义（推断）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>医师数地域差<\/td>\n<td>人口 10 万対医師数（従業地/居住地口径须区分）<\/td>\n<td><a href=\"https://www.mhlw.go.jp/toukei/list/33-20.html\" title=\"来源：https://www.mhlw.go.jp/toukei/list/33-20.html, 2026\">厚生労働省 医師・歯科医師・薬剤師統計<\/a><\/td>\n<td>医师向大都市圈集中——地方都市的夜间救急/专科就医半径先查到二次医疗圈<\/td>\n<\/tr>\n<tr>\n<td>病床数地域差<\/td>\n<td>病院の一般病床（令和 6 年医療施設調査，2024-10-01：全国 879,728 床）<\/td>\n<td><a href=\"https://www.mhlw.go.jp/toukei/saikin/hw/iryosd/24/index.html\" title=\"来源：https://www.mhlw.go.jp/toukei/saikin/hw/iryosd/24/index.html, 2024\">厚生労働省 令和6年医療施設調査<\/a><\/td>\n<td>病床分布影响重伤/产育时的转院半径<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>保险体系与就医流程细节 → <a href=\"../../12-culture-life/reports/2026-11-culture-life.html#03-医疗与健康\">12-文化与生活 · 03-医疗与健康<\/a><\/p>\n<p><strong>教育资源地域差（外国人儿童受入体制）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">对比视角<\/th>\n<th style=\"width:25%\">指标口径<\/th>\n<th style=\"width:25%\">官方数据入口<\/th>\n<th style=\"width:25%\">对决策的含义（推断）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>外国人儿童就学把握体制<\/td>\n<td>各市町村就学状況把握与就学促进取组（「外国人の子供の就学状況等調査」第 6 回，令和 7 年 5 月 1 日现在）<\/td>\n<td><a href=\"https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm, 2026\">文部科学省 帰国・外国人児童生徒等の現状<\/a><\/td>\n<td>调查已全国实施，但自治体间把握体制仍有差异——不就学风险存在地域差（推断）<\/td>\n<\/tr>\n<tr>\n<td>日语指导体制差异<\/td>\n<td>日本語指導が必要な児童生徒（令和 7 年度：公立 84,759 人，其中外国籍 73,313 人，较上次 +27.0%）<\/td>\n<td><a href=\"https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm, 2026\">文部科学省 調査結果<\/a><\/td>\n<td>日语指导教室有无、教员配置密度因自治体差异大——子女同赴前直接问市区町村教育委员会<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>就学手续与学制细节 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.html#03-日本学校教育体系与子女教育\">10-资格与教育投资 · 03-日本学校教育体系与子女教育<\/a><\/p>\n<h4 id=\"_21\">关联<\/h4>\n<ul>\n<li>薪资地域差 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#01-收入结构与薪资行情\">07-经济与财务 · 01<\/a><\/li>\n<li>求职渠道地域策略 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.html#05-求职渠道与简历面试\">05 求职渠道与简历面试<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 地域生活笔记<\/h3>\n<blockquote>\n<p>模板文件：确定居住地后复制一份改名（如 <code>02-地域生活笔记-群马太田.md<\/code>），持续维护。<\/p>\n<\/blockquote>\n<h4 id=\"_22\">一、定居地档案<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">项目<\/th>\n<th style=\"width:50%\">记录<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>城市/区<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>入住时间<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>房租/通勤<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>自治体外籍支援窗口<\/td>\n<td>名称·地址·电话·多语种<\/td>\n<\/tr>\n<tr>\n<td>免费日语教室<\/td>\n<td>场次·地点<\/td>\n<\/tr>\n<tr>\n<td>主要医院/夜间救急<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>中華物産店/常用店<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_23\">二、生活发现（滚动追加）<\/h4>\n<ul>\n<li>公共设施（图书馆/体育馆/市民   pool）利用实记<\/li>\n<li>交通月票/通勤路线实际成本<\/li>\n<li>邻里关系与噪音规则（ゴミ出し日程表拍照存档）<\/li>\n<\/ul>\n<h4 id=\"_24\">三、防灾与安全<\/h4>\n<ul>\n<li>避难所位置（役所防灾地图 app 确认）<\/li>\n<li>洪水/土砂风险地图查询结果<\/li>\n<li>地震时集合点（与家人约定）<\/li>\n<\/ul>\n<h4 id=\"_25\">地域防灾情报渠道<\/h4>\n<!-- updated: 2026-11-12 | 新增小节 -->\n\n<blockquote>\n<p>防灾情报分三层：国家预警 → 自治体通知 → 个人接收。定居地确定后，把第三层的登记动作补进本章「一、定居地档案」。与 <a href=\"../../09-politics-law/reports/2026-11-politics-law.html#02-政治动向与移民政策环境\">09-政治与法规 · 02-政治动向与移民政策环境<\/a>（灾害时外国人支援）互补。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">层级<\/th>\n<th style=\"width:33%\">渠道<\/th>\n<th style=\"width:34%\">入口与用法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>国家预警<\/td>\n<td>气象厅警報・注意報（大雨/洪水/大雪/地震/津波等）<\/td>\n<td><a href=\"https://www.jma.go.jp/bosai/warning/\" title=\"来源：https://www.jma.go.jp/bosai/warning/, 2026\">気象庁 警報・注意報<\/a>——台风季每日确认现住地与通勤圈<\/td>\n<\/tr>\n<tr>\n<td>国家预警（多语言）<\/td>\n<td>防災気象情報多语言版（含简体中文）<\/td>\n<td><a href=\"https://www.data.jma.go.jp/multi/yoho/index.html?lang=cn_zs\" title=\"来源：https://www.data.jma.go.jp/multi/yoho/index.html?lang=cn_zs, 2026\">気象庁 多言語ページ<\/a>——日语达标前靠它读懂预警等级<\/td>\n<\/tr>\n<tr>\n<td>自治体通知<\/td>\n<td>市区町村防灾邮件（防災メール）/LINE 公式账号/防灾行政无线<\/td>\n<td>渠道因自治体而异：役所住民课登记住址时一并申请（具体渠道待定居地确定后复核）<\/td>\n<\/tr>\n<tr>\n<td>中央防灾<\/td>\n<td>防災庁（2026-11-02 由内阁府防灾改组发足）防灾政策与大规模灾情汇总<\/td>\n<td><a href=\"https://www.bousai.go.jp\" title=\"来源：https://www.bousai.go.jp, 2026\">防災庁<\/a>——大规模灾害时的中央级信息源<\/td>\n<\/tr>\n<tr>\n<td>多语言灾情（媒体）<\/td>\n<td>NHK WORLD-JAPAN 多语言链接（约 20 种语言新闻 + 地震/海啸等灾害信息）<\/td>\n<td><a href=\"https://www3.nhk.or.jp/nhkworld/en/multilingual_links/\" title=\"来源：https://www3.nhk.or.jp/nhkworld/en/multilingual_links/, 2026\">NHK WORLD-JAPAN 多言語リンク<\/a>——网络可达性风险时的备用信息源<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>核对约定：台风季（7-10 月）与降雪期前各核对一次上述渠道可用性；气象厅预警/配信体系调整时更新本表。<\/li>\n<\/ul>\n<h4 id=\"_26\">四、季度观察<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">季度<\/th>\n<th style=\"width:33%\">天气/生活注意<\/th>\n<th style=\"width:34%\">本地活动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>春<\/td>\n<td>花粉<\/td>\n<td>赏花<\/td>\n<\/tr>\n<tr>\n<td>夏<\/td>\n<td>台风/热中症<\/td>\n<td>祭り·花火<\/td>\n<\/tr>\n<tr>\n<td>秋<\/td>\n<td>台风尾巴<\/td>\n<td>红叶<\/td>\n<\/tr>\n<tr>\n<td>冬<\/td>\n<td>雪/日照短<\/td>\n<td>灯饰<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 251, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "13-regional-info/reports/2026-11-regional-info.html"}}}, "life-operations": {"name": "在日生活实务与行政手续", "dir": "14-life-operations", "months": {"2026-11": {"title": "在日生活实务与行政手续 · 首份分析报告", "body": "\n<h1 id=\"_1\">在日生活实务与行政手续 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人执行层\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）\n<strong>来源规则<\/strong>：① 総務省 / 厚生労働省 / 国土交通省 / 内閣府 / デジタル庁 / 各自治体；② 银行 / 运营商 / 电力燃气公司官网；③ 平台抽样（C 级）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本 · 在日生活实务与行政手续 · 首期基线报告<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义<\/strong>：赴日外国人的<strong>落地执行层<\/strong>——在留卡・住民登记・健康保険・年金等制度基础，以及住房、公共交通、通信、银行、水电燃气、行政手续 90 天清单。<\/p>\n<p><strong>监测范围（含）<\/strong>：在留 / 住民 / 保险 / 年金；住房与租赁；公共交通；通信与网络；银行与支付；水电燃气与基础设施；行政手续 90 天清单与多语言窗口。<\/p>\n<p><strong>监测范围（不含）<\/strong>：在留资格制度（→ 08-visa-immigration）；税制 / 年金脱退（→ 07-economy-finance）；日语 / 考试（→ 11-language-japanese）；文化 / 礼仪（→ 12-culture-life）；地域选择 / 定居地档案（→ 13-regional-info）；驾照 / 车辆成本（→ 10-education-qualification / 01-ssw-driver）。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. 落地手续的时限、书类与外国人可否如何？\n2. 住房初期费用的结构与行情如何？\n3. 公共交通与通信的费用与选择策略如何？\n4. 银行开户与支付的门槛与渠道如何？\n5. 水电燃气的开通与自由化选择如何？\n6. 90 天清单的执行顺序与常见坑是什么？<\/p>\n<p><strong>跨主题分工<\/strong>：见<a href=\"./business-config.md\">业务配置第六节<\/a>。<\/p>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>落地制度基础<\/td>\n<td>在留 / 住民 / 保险 / 年金<\/td>\n<td>#1 #2 #3<\/td>\n<td>出入国在留管理庁 / 厚生労働省 / 日本年金機構<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>住房与租赁<\/td>\n<td>契约 / 费用 / 保证人<\/td>\n<td>#4<\/td>\n<td>国土交通省 / 平台<\/td>\n<td>季度 / 事件触发<\/td>\n<\/tr>\n<tr>\n<td>公共交通<\/td>\n<td>电车 / 巴士 / 定期券 / IC 卡<\/td>\n<td>#5<\/td>\n<td>国土交通省 / 运营商<\/td>\n<td>年度<\/td>\n<\/tr>\n<tr>\n<td>通信与网络<\/td>\n<td>携帯 / 格安SIM / 光回线<\/td>\n<td>#6<\/td>\n<td>総務省 / 运营商<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>银行与支付<\/td>\n<td>口座 / 信用卡 / 送金<\/td>\n<td>#7<\/td>\n<td>各银行 / 金融庁<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>水电燃气<\/td>\n<td>开通 / 费用 / 自由化<\/td>\n<td>#8<\/td>\n<td>各公司 / 自治体<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>90 天清单<\/td>\n<td>手续执行状态<\/td>\n<td>#9<\/td>\n<td>个人记录<\/td>\n<td>月度 / 事件触发<\/td>\n<\/tr>\n<tr>\n<td>多语言窗口<\/td>\n<td>自治体支援<\/td>\n<td>#10<\/td>\n<td>各自治体<\/td>\n<td>定居地确定后<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：制度基础决定「能不能办」；住房决定「初期资金」；交通 / 通信 / 银行 / 水电决定「日常生活质量」；90 天清单是执行顺序；多语言窗口是外国人可行性的关键。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 落地制度基础<\/h3>\n<ul>\n<li>在留卡与住民登记均为 14 日内；健康保険与年金随住民登记办理（事实）[出入国在留管理庁 / 総務省 / 厚生労働省]。<\/li>\n<li>国保自付通常 3 割；被用者同理但报销范围不同（事实）[厚生労働省]。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 住房与租赁<\/h3>\n<ul>\n<li>初期费用含敷金 / 礼金 / 仲介手数料 / 保证会社 / 更新料，合计可达 4–8 个月房租（事实）[国土交通省]。<\/li>\n<li>外国人常需保证会社；部分房东不接受外国人（推断，待核实）。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 公共交通与通信<\/h3>\n<ul>\n<li>IC 卡覆盖绝大多数铁路与巴士；定期券为通勤主流（事实）[JR 東日本 / 国土交通省]。<\/li>\n<li>格安SIM 月租低于大手；光回线为住宅主流（事实）[総務省]。<\/li>\n<li>⚠ 具体月费行情待核实。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 银行与支付<\/h3>\n<ul>\n<li>开户通常需在留卡 + 住所证明 + 印鉴；部分银行要求在留 6 个月以上（事实 / 各银行不同）。<\/li>\n<li>邮局银行与部分地方银行对外国人较友好（推断）。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 水电燃气<\/h3>\n<ul>\n<li>电力 2016 / 燃气 2017 全面自由化（事实）[資源エネルギー庁]。<\/li>\n<li>⚠ 典型月费待核实。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>落地手续有时限、可执行<\/strong>（事实）：14 日内完成住民登记与保险加入是刚性要求。<\/li>\n<li><strong>住房是最大初期资金变量<\/strong>（事实）：4–8 个月房租的初期费用需提前准备。<\/li>\n<li><strong>通信与能源已市场化<\/strong>（事实）：可比较选择，但需按回线与方案具体核对。<\/li>\n<li><strong>银行开户是刚抵达时的常见卡点<\/strong>（推断）：在留期限门槛可能影响开户，建议用邮局银行过渡。<\/li>\n<li><strong>执行细节仍是最大信息差<\/strong>（事实）：本初析为框架级，具体费用与门槛待补。<\/li>\n<\/ol>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>：\n1. 各银行现行在留期限门槛与书类？\n2. 大手 / 格安SIM / 光回线具体月费？\n3. 典型通勤区间定期券月费？\n4. 自治体多语言窗口清单？<\/p>\n<p><strong>下一期重点核实项<\/strong>：银行开户门槛；通信费用；定期券行情；自治体窗口。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>在留卡・住民登记时限<\/td>\n<td>14 日内<\/td>\n<td>出入国在留管理庁 / 総務省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>健康保険自付<\/td>\n<td>通常 3 割<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>年金加入<\/td>\n<td>20–60 岁义务<\/td>\n<td>日本年金機構<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>租房初期费用<\/td>\n<td>4–8 个月房租<\/td>\n<td>国土交通省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>公共交通费用<\/td>\n<td>⚠ 待核实<\/td>\n<td>国土交通省<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>通信费用<\/td>\n<td>⚠ 待核实<\/td>\n<td>総務省 / 运营商<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>银行开户条件<\/td>\n<td>在留卡 + 住所证明；部分需 6 个月<\/td>\n<td>各银行<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>水电燃气<\/td>\n<td>电力 2016 / 燃气 2017 自由化<\/td>\n<td>資源エネルギー庁<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>90 天清单<\/td>\n<td>模板已建<\/td>\n<td>个人记录<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>多语言窗口<\/td>\n<td>⚠ 待核实<\/td>\n<td>各自治体<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<ul>\n<li>节拍：季度复核 + 事件触发；个人定居地确定后重点更新。<\/li>\n<li>触发器：在留 / 住民 / 保险制度改定；租房法规变更；IC 卡 / 定期券规则；运营商资费；银行开户 / 送金规则；水电燃气费用；个人定居地确定。<\/li>\n<\/ul>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<ul>\n<li>A 级：官方一手；B 级：机构官网；C 级：平台抽样。<\/li>\n<li>主要局限：初析级；具体费用 / 门槛未核实；地域差异未收敛。<\/li>\n<\/ul>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/\">出入国在留管理庁<\/a> — 2026<\/li>\n<li><a href=\"https://www.soumu.go.jp/main_sosiki/jichi_gyousei/busyou/seido/kihon.html\">総務省 · 住民基本台帳<\/a> — 2026<\/li>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省<\/a> — 2026<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 2026<\/li>\n<li><a href=\"https://www.mlit.go.jp/\">国土交通省<\/a> — 2026<\/li>\n<li><a href=\"https://www.soumu.go.jp/\">総務省<\/a> — 2026<\/li>\n<li><a href=\"https://www.enecho.meti.go.jp/\">資源エネルギー庁<\/a> — 2026<\/li>\n<li><a href=\"https://www.fsa.go.jp/\">金融庁<\/a> — 2026<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-14。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本 · 在日生活实务与行政手续 · 首期基线报告》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本 · 在日生活实务与行政手续 · 首期基线报告<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首期基线）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人执行层\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）\n<strong>来源规则<\/strong>：① 総務省 / 厚生労働省 / 国土交通省 / 内閣府 / デジタル庁 / e-Gov / 各自治体；② 银行 / 运营商 / 电力燃气公司官网；③ 平台抽样（C 级）<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">一、核心结论（摘要）<\/h3>\n<ol>\n<li><strong>落地手续有明确时限<\/strong>（事实）：在留卡与住民登记均为<strong>抵达 / 迁入后 14 日内<\/strong>；健康保険与年金随住民登记一并办理。逾期会影响后续手续。<\/li>\n<li><strong>住房是最大初期费用<\/strong>（事实）：租房初期费用通常含敷金 + 礼金 + 仲介手数料 + 保证会社 + 更新料，合计可达 <strong>4–8 个月<\/strong>房租；外国人常需保证会社或在日保证人。<\/li>\n<li><strong>公共交通与通信已高度电子化<\/strong>（事实）：IC 卡覆盖绝大多数铁路与巴士，并可电子支付；格安SIM 显著低于大手运营商，但回线与品质不同。<\/li>\n<li><strong>银行开户存在在留期限门槛<\/strong>（推断）：部分银行要求在留 <strong>6 个月以上<\/strong>，刚抵达时可先用支持外国人的银行或邮局账户过渡。<\/li>\n<li><strong>水电燃气已自由化<\/strong>（事实）：电力（2016）与燃气（2017）全面自由化，可比较切换；开通需申请与的使用开始。<\/li>\n<li><strong>最大信息差在「执行细节」<\/strong>（事实）：本基线为初析级，通信费用 / 银行开户 / 自治体窗口的具体现行值标记「⚠ 待核实」，待次期或定居地确定后补齐。<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_14\">二、落地制度基础（在留・住民・保险・年金）<\/h3>\n<h4 id=\"21\">2.1 在留卡与住民登记<\/h4>\n<ul>\n<li><strong>在留卡<\/strong>：抵达后 14 日内在机场 / 市区町村完成登记；在留卡为身份与在留资格的唯一凭证，需随身携带（事实）[出入国在留管理庁]。<\/li>\n<li><strong>住民登记（転入届）<\/strong>：迁入新住所后 <strong>14 日内<\/strong>向新自治体申报；需护照 + 在留卡（或 COE）（事实）[総務省]。<\/li>\n<li><strong>転出届<\/strong>：迁出前向原自治体申报并领取転出証明書（事实）[総務省]。<\/li>\n<\/ul>\n<h4 id=\"22\">2.2 健康保険<\/h4>\n<ul>\n<li><strong>国民健康保険<\/strong>：面向非公司职员等居民，自付比例通常 <strong>3 割<\/strong>（小学生未満 2 割、70–74 岁因收入 1–2 割）（事实）[厚生労働省]。<\/li>\n<li><strong>被用者健康保険<\/strong>：公司职员加入，自付通常 3 割，由公司与个人分担保费（事实）[厚生労働省]。<\/li>\n<li><strong>高額療養費制度<\/strong>：医疗费超过自付上限时由公费承担差额（事实）[厚生労働省]。<\/li>\n<\/ul>\n<h4 id=\"23\">2.3 年金<\/h4>\n<ul>\n<li>20 岁以上 60 岁以下住民有加入义务；国民年金（基础年金）与厚生年金（公司职员）并行（事实）[日本年金機構]。<\/li>\n<li>离开日本时可申请<strong>脱退一时金<\/strong>（需满足条件，详见 07）[日本年金機構]。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_15\">三、住房与租赁<\/h3>\n<ul>\n<li><strong>费用结构<\/strong>（事实）[国土交通省]：<\/li>\n<li>敷金（押金，退还时结算）：0–2 个月；<\/li>\n<li>礼金（谢礼，不退还）：0–2 个月；<\/li>\n<li>仲介手数料：约 1 个月（含消费税）；<\/li>\n<li>保证会社：首次约 0.5–1 个月（外国人常需）；<\/li>\n<li>更新料：契约更新时约 1 个月（通常 2 年一次）。<\/li>\n<li><strong>契约类型<\/strong>：普通赁贷借（可更新）/ 定期赁贷借（期满返还）；更新料与解约预告期需在契约中确认。<\/li>\n<li><strong>外国人常见障碍<\/strong>：保证人（在日保证人）或保证会社；部分房东 / 管理会社不接受外国人（推断，需平台抽样核实）。<\/li>\n<li><strong>搬家<\/strong>：需办理転出 / 転入、地址变更（银行、手机、驾照等）、水电燃气解约与开通。<\/li>\n<li><strong>垃圾<\/strong>：按自治体分类、时间与地点投放（事实）[環境省]。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_16\">四、公共交通<\/h3>\n<ul>\n<li><strong>电车<\/strong>：JR、私铁、地下铁构成城市公共交通主干；定期券为通勤 / 通学主流（事实）[国土交通省]。<\/li>\n<li><strong>巴士<\/strong>：路线巴士作为铁路接驳；部分地域巴士与电车共用 IC 卡。<\/li>\n<li><strong>IC 卡<\/strong>：Suica、PASMO 等可乘车与电子支付，多数区间互通（事实）[JR 東日本]。<\/li>\n<li><strong>乗換案内<\/strong>：查询换乘路线、时刻与费用的应用（事实）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：典型通勤区间的定期券月费行情（需按定居地具体区间查询）。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_17\">五、通信与网络<\/h3>\n<ul>\n<li><strong>携帯契约<\/strong>：大手运营商（docomo / au / softbank）自有一回线；契约通常需在留卡、银行账户与住所证明（事实）[各运营商]。<\/li>\n<li><strong>格安SIM<\/strong>：租用大手回路的低价服务（MVNO），月租通常显著低于大手；回线与品质不同，<strong>不可直接比价<\/strong>（事实）[総務省]。<\/li>\n<li><strong>光回線<\/strong>：光纤到户宽带，住宅主流方案；常与手机契约捆绑（事实）[総務省]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：大手 / 格安SIM / 光回线的具体现行月费（需按回线与方案查询）。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_18\">六、银行与支付<\/h3>\n<ul>\n<li><strong>银行口座开设<\/strong>：通常需在留卡 + 住民票 / 住所证明 + 印鉴；部分银行要求在留 <strong>6 个月以上<\/strong>（事实 / 各银行口径不同）。<\/li>\n<li><strong>外国人友好渠道<\/strong>：邮局银行（ゆうちょ銀行）、部分地方银行与网络银行对外国人较友好（推断）。<\/li>\n<li><strong>支付<\/strong>：信用卡、电子マネー（Suica / PayPay 等）、银行振込并行（事实）。<\/li>\n<li><strong>送金<\/strong>：国际送金（归国 / 向国内汇款）可通过银行或专业送金服务；汇率与手续费差异大（事实）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各银行现行在留期限门槛与所需书类。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_19\">七、水电燃气与基础设施<\/h3>\n<ul>\n<li><strong>上下水道<\/strong>：由自治体管理，需办理使用开始 / 停止手续（事实）[国土交通省]。<\/li>\n<li><strong>電気<\/strong>：2016 年全面自由化，可从各电力公司选择（事实）[資源エネルギー庁]。<\/li>\n<li><strong>ガス<\/strong>：2017 年全面自由化，可从各燃气公司选择（事实）[資源エネルギー庁]。<\/li>\n<li><strong>开通 / 解约<\/strong>：搬家时需办理旧地址解约与新地址开通，通常通过网络或电话申请。<\/li>\n<li>⚠ <strong>待核实<\/strong>：典型家庭月费（因家族人数、地域、使用量而异）。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"90\">八、行政手续 90 天清单<\/h3>\n<blockquote>\n<p>详见 <a href=\"../../00-decision-hub/reports/2026-11-decision-hub.md\">00-decision-hub 落地清单<\/a>。以下为执行要点。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">事项<\/th>\n<th style=\"width:34%\">时限<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>抵达时<\/td>\n<td>在留卡领取<\/td>\n<td>机场 / 14 日内<\/td>\n<\/tr>\n<tr>\n<td>14 日内<\/td>\n<td>住民登记、健康保険、年金<\/td>\n<td>14 日内<\/td>\n<\/tr>\n<tr>\n<td>30 日内<\/td>\n<td>银行口座、手机 / 网络<\/td>\n<td>1 个月<\/td>\n<\/tr>\n<tr>\n<td>30–90 日<\/td>\n<td>住房签约、水电燃气开通<\/td>\n<td>1–3 个月<\/td>\n<\/tr>\n<tr>\n<td>90 日内<\/td>\n<td>驾照转换 / 在留资格变更<\/td>\n<td>视驾照进度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"_20\">九、数据可靠性与局限说明<\/h3>\n<p><strong>核验程度分级<\/strong>：\n- A 级（官方一手）：出入国在留管理庁、総務省、厚生労働省、国土交通省、資源エネルギー庁、日本年金機構。\n- B 级（机构官网）：各银行、运营商、电力燃气公司。\n- C 级（平台抽样）：租房费用、通信费用（需回溯官网）。<\/p>\n<p><strong>主要局限<\/strong>：\n1. 本基线为<strong>初析级<\/strong>，通信费用 / 银行开户 / 自治体窗口 / 定期券行情的具体现行值未核实；\n2. 租房与通信费用因地域与方案差异大，需用「区间 / 口径」呈现，不取单一数值；\n3. 个人定居地未定，地域差异（如东京 vs 地方）无法收敛。<\/p>\n<p><strong>未取得项（次期优先）<\/strong>：各银行现行在留期限门槛；大手 / 格安SIM / 光回线具体月费；典型通勤区间定期券月费；自治体多语言窗口清单。<\/p>\n<hr />\n<h3 id=\"_21\">十、参考来源清单<\/h3>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/applications/procedures/01-1.html\">出入国在留管理庁 · 在留卡<\/a> — 2026<\/li>\n<li><a href=\"https://www.soumu.go.jp/main_sosiki/jichi_gyousei/busyou/seido/kihon.html\">総務省 · 住民基本台帳制度<\/a> — 2026<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/benko/hoken_kenkou/index.html\">厚生労働省 · 国民健康保険<\/a> — 2026<\/li>\n<li><a href=\"https://www.nenkin.go.jp/n_kaihatu/zenpen/034.html\">日本年金機構 · 年金制度<\/a> — 2026<\/li>\n<li><a href=\"https://www.mlit.go.jp/jutakukentiku/house/\">国土交通省 · 住宅<\/a> — 2026<\/li>\n<li><a href=\"https://www.mlit.go.jp/sogoseisaku/transport/\">国土交通省 · 公共交通<\/a> — 2026<\/li>\n<li><a href=\"https://www.soumu.go.jp/johotsusintokei/\">総務省 · 情報通信<\/a> — 2026<\/li>\n<li><a href=\"https://www.enecho.meti.go.jp/\">資源エネルギー庁 · 電力・ガス<\/a> — 2026<\/li>\n<li><a href=\"https://www.fsa.go.jp/\">金融庁<\/a> — 2026<\/li>\n<li><a href=\"https://www.jreast.co.jp/suica/\">JR 東日本 · Suica<\/a> — 2026<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_22\">免责声明<\/h3>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<hr />\n<p>本报告为 v1.0 首期基线，数据基准 2026-11-14。⚠ 待核实项在次期或定居地确定后补齐。<\/p>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 183, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "14-life-operations/reports/2026-11-life-operations.html"}}}, "health-wellbeing": {"name": "医疗", "dir": "15-health-wellbeing", "months": {"2026-11": {"title": "医疗·健康·心理 · 首份分析报告", "body": "\n<h1 id=\"_1\">医疗·健康·心理 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人健康管理\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）\n<strong>来源规则<\/strong>：① 厚生労働省 / 日本年金機構；② 各学会 / 医疗机构官网；③ 多语言医疗支援机构<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本 · 医疗·健康·心理 · 首期基线报告<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义<\/strong>：在日外国人的医疗制度与健康管理——医保体系、就医实务、多语言支援、牙科精神科、心理健康、体检预防、介護福祉。<\/p>\n<p><strong>监测范围（含）<\/strong>：国保 / 被用者 / 后期高龄者 / 高额疗养费；就医流程与费用；多语言与通译；牙科 / 精神科 / 分娩；心理健康与适应；健康診断 / 予防接種；介護保険 / 福祉。<\/p>\n<p><strong>监测范围（不含）<\/strong>：社保费 / 年金 / 税（→ 07-economy-finance）；在留 / 家属 / 生活保护（→ 08-visa-immigration）；劳动安全 / 过劳（→ 09-politics-law / 03-career-management）；文化适应（→ 12-culture-life）；地域医疗差异（→ 13-regional-info）；保险加入手续（→ 14-life-operations）。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. 医保自付比例与高额疗养费上限如何？\n2. 就医流程与多语言支援是否可行？\n3. 牙科 / 精神科 / 分娩的费用与保险适用如何？\n4. 心理健康的支援渠道有哪些？\n5. 体检与预防的参加方式如何？\n6. 介護福祉的兜底机制是什么？<\/p>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">维度<\/th>\n<th style=\"width:25%\">对应指标（登记册 #）<\/th>\n<th style=\"width:25%\">优先来源<\/th>\n<th style=\"width:25%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>医保制度<\/td>\n<td>#1 #2<\/td>\n<td>厚生労働省<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>就医实务<\/td>\n<td>#3 #4<\/td>\n<td>各学会 / 医院<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>牙科与精神科<\/td>\n<td>#5<\/td>\n<td>各学会<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>心理健康<\/td>\n<td>#6<\/td>\n<td>厚生労働省 / 自治体<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>体检与预防<\/td>\n<td>#7<\/td>\n<td>厚生労働省<\/td>\n<td>年度<\/td>\n<\/tr>\n<tr>\n<td>介護与福祉<\/td>\n<td>#8<\/td>\n<td>厚生労働省<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：医保制度决定「保障水平」；就医实务与多语言决定「能不能顺利看病」；心理健康与体检决定「长期健康与预防」；介護福祉是兜底。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<ul>\n<li><strong>医保<\/strong>：国保 / 被用者自付通常 3 割；高额疗养费为兜底（事实）[厚生労働省]。<\/li>\n<li><strong>就医<\/strong>：流程标准化，但多语言与通译因医院而异（推断）。<\/li>\n<li><strong>牙科 / 精神科<\/strong>：部分适用保险；自付项目与初诊费用需具体核对（⚠ 待核实）。<\/li>\n<li><strong>心理<\/strong>：孤独、文化冲击、过劳为常见风险；精神保健福祉センター与电话相談为兜底。<\/li>\n<li><strong>体检<\/strong>：健康診断按时参加；特定技能司机有適性診断义务。<\/li>\n<li><strong>介護<\/strong>：40 岁以上加入；非近期必需但属长期兜底。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>医保是刚性义务<\/strong>（事实）：住民登记后必须加入。<\/li>\n<li><strong>高额疗养费是关键兜底<\/strong>（事实）：上限按年龄 / 收入分层。<\/li>\n<li><strong>多语言是主要变量<\/strong>（推断）：都市圈较好，地方需提前确认。<\/li>\n<li><strong>心理健康易被忽视<\/strong>（推断）：建议提前建立支援渠道。<\/li>\n<li><strong>具体值仍为信息差<\/strong>（事实）：自付上限 / 费用 / 窗口清单待补。<\/li>\n<\/ol>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>：高额疗养费现行上限？多语言医疗窗口清单？精神科初诊费用？介護自付细则？<\/p>\n<p><strong>下一期重点核实项<\/strong>：自付比例细则；多语言窗口；心理健康渠道；体检外国人对应。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>医保自付<\/td>\n<td>通常 3 割<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>高额疗养费<\/td>\n<td>⚠ 上限待核实<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>就医流程<\/td>\n<td>标准化；多语言因医院而异<\/td>\n<td>各学会<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>多语言支援<\/td>\n<td>⚠ 清单待补<\/td>\n<td>各自治体<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>牙科 / 精神科<\/td>\n<td>部分适用保险<\/td>\n<td>各学会<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>心理健康支援<\/td>\n<td>精神保健福祉センター / 电话相談<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>健康診断<\/td>\n<td>按时参加；適性診断义务<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>介護保険<\/td>\n<td>40 岁以上加入<\/td>\n<td>厚生労働省<\/td>\n<td>2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<ul>\n<li>节拍：季度复核 + 事件触发；个人健康情况变化时触发。<\/li>\n<li>触发器：医保 / 高额疗养费改定；医疗费改定；多语言支援变更；精神科 / 牙科 / 分娩政策；介護制度变更。<\/li>\n<\/ul>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<ul>\n<li>A 级：官方一手；B 级：学会 / 医院官网；C 级：平台抽样。<\/li>\n<li>主要局限：初析级；具体值未核实；地域差异未收敛。<\/li>\n<\/ul>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省<\/a> — 2026<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 2026<\/li>\n<li><a href=\"https://www.med.or.jp/\">日本医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.jda.or.jp/\">日本歯科医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.neuropsychology.jp/\">日本精神神経学会<\/a> — 2026<\/li>\n<li><a href=\"https://www.fdma.go.jp/\">消防庁<\/a> — 2026<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-14。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本 · 医疗·健康·心理 · 首期基线报告》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本 · 医疗·健康·心理 · 首期基线报告<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首期基线）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人健康管理\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）\n<strong>来源规则<\/strong>：① 厚生労働省 / 日本年金機構 / 各都道府県；② 日本医師会 / 日本歯科医師会 / 精神神経学会 / 医疗机构官网；③ 多语言医疗支援机构<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">一、核心结论（摘要）<\/h3>\n<ol>\n<li><strong>医保是落地第一义务<\/strong>（事实）：住民登记后须加入健康保険（国保或被用者），自付比例通常 <strong>3 割<\/strong>；未加入会累积高额费用。<\/li>\n<li><strong>高额疗养费制度是关键兜底<\/strong>（事实）：医疗费超过自付上限时由公费承担差额，显著降低大病负担；上限按年龄与收入分层。<\/li>\n<li><strong>多语言支援是外国人就医的主要变量<\/strong>（推断）：大型医院与都市圈多语言窗口较完善，地方与中小医院可能仅日语对应；医疗通译需提前确认。<\/li>\n<li><strong>牙科与精神科部分适用保险<\/strong>（事实）：牙科大部分适用保险，但自付项目（如种植、矫正）较多；精神科 / 心疗内科适用保险，但首次可能需初诊料。<\/li>\n<li><strong>心理健康易被忽视<\/strong>（推断）：孤独、文化冲击、过劳是外国劳动者常见风险；精神保健福祉センター与电话相談是兜底渠道。<\/li>\n<li><strong>体检与预防是成本最低的健康投资<\/strong>（事实）：雇主 / 自治体实施健康診断，应按时参加。<\/li>\n<li><strong>本基线为初析级<\/strong>（事实）：具体费用、自付上限、多语言窗口清单标记「⚠ 待核实」，待次期或定居地确定后补齐。<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_14\">二、医保制度<\/h3>\n<h4 id=\"21\">2.1 两大体系<\/h4>\n<ul>\n<li><strong>国民健康保険<\/strong>（国保）：面向非公司职员、自营业、无业者等居民，自付通常 <strong>3 割<\/strong>；由市区町村运营（事实）[厚生労働省]。<\/li>\n<li><strong>被用者健康保険<\/strong>：公司职员加入，自付通常 3 割，由公司与个人分担保费（事实）[厚生労働省]。<\/li>\n<li><strong>后期高龄者医療<\/strong>：75 岁以上（或 65–74 岁有一定障碍者）加入，自付比例更低（事实）[厚生労働省]。<\/li>\n<\/ul>\n<h4 id=\"22\">2.2 高额疗养费制度<\/h4>\n<ul>\n<li>医疗费超过自付上限时，由公费承担差额；上限按<strong>年龄与收入<\/strong>分层（事实）[厚生労働省]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：现行各收入层的具体上限额。<\/li>\n<li>与<strong>医療費控除<\/strong>（税制，见 07）不同：前者为当月报销，后者为年度报税。<\/li>\n<\/ul>\n<h4 id=\"23\">2.3 外国人加入<\/h4>\n<ul>\n<li>住民登记后须办理健康保険加入；在留卡与住民票为必要书类（事实）[厚生労働省 / 14-life-operations]。<\/li>\n<li>短期停留与特定活动资格的医疗保障范围可能不同（推断）。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_15\">三、就医实务<\/h3>\n<ul>\n<li><strong>流程<\/strong>：挂号 → 诊疗 → 处方 → 药房配药；部分医院需初诊料（事实）。<\/li>\n<li><strong>费用<\/strong>：适用保险后自付 3 割；初诊费用与检查费因医院而异（⚠ 行情待核实）。<\/li>\n<li><strong>多语言<\/strong>：都市圈大型医院较完善；地方中小医院可能仅日语；⚠ 清单待补。<\/li>\n<li><strong>医疗通译<\/strong>：部分自治体 / 医院提供多语言通译服务，需提前预约（⚠ 待核实）。<\/li>\n<li><strong>急救<\/strong>：119 为急救电话；救急病院按轮值制（事实）[消防庁 / 厚生労働省]。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_16\">四、牙科与精神科<\/h3>\n<h4 id=\"41\">4.1 牙科<\/h4>\n<ul>\n<li>牙科大部分治疗适用保险，但种植、矫正、部分材料为自付（事实）[日本歯科医師会]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：常见治疗的自付行情。<\/li>\n<\/ul>\n<h4 id=\"42\">4.2 精神科 / 心疗内科<\/h4>\n<ul>\n<li>精神科诊治抑郁、焦虑、睡眠障碍等；心疗内科侧重轻症与心理因素（事实）[日本精神神経学会]。<\/li>\n<li>适用保险，但首次可能需初诊料与较长的诊察时间（事实）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：初诊费用与候诊时间。<\/li>\n<\/ul>\n<h4 id=\"43\">4.3 分娩<\/h4>\n<ul>\n<li>分娩适用保险；有<strong>出産育児一時金<\/strong>一次性补助（见 08）（事实）[厚生労働省]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：外国人对应的产前检查与多语言支援。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_17\">五、心理健康与适应<\/h3>\n<ul>\n<li><strong>常见风险<\/strong>：孤独、文化冲击、语言障碍、过劳（事实 / 推断）。<\/li>\n<li><strong>支援渠道<\/strong>：<\/li>\n<li>精神保健福祉センター（自治体）；<\/li>\n<li>电话相談（いのちの電話 等）；<\/li>\n<li>カウンセリング（非医疗，自费）；<\/li>\n<li>雇主 / 支援机关的相談窓口。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各渠道的多语言对应与费用。<\/li>\n<li><strong>建议<\/strong>（推断）：抵达前建立至少一个可联系的支援渠道；出现持续失眠 / 情绪低落时及早就医。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_18\">六、体检与预防<\/h3>\n<ul>\n<li><strong>健康診断<\/strong>：雇主 / 自治体实施，特定技能司机有<strong>適性診断<\/strong>义务（见 01）（事实）[厚生労働省]。<\/li>\n<li><strong>予防接種<\/strong>：按计划实施；外国人可凭健康保険証接种（⚠ 部分待核实）。<\/li>\n<li><strong>建议<\/strong>：按时参加健康診断，保留记录。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_19\">七、介護与福祉<\/h3>\n<ul>\n<li><strong>介護保険<\/strong>：40 岁以上加入，介護サービス自付 1–3 割（事实）[厚生労働省]。<\/li>\n<li><strong>生活保护<\/strong>：生活困难者的最低生活保障（见 08）（事实）[厚生労働省]。<\/li>\n<li><strong>障碍福祉<\/strong>：障害者手帳与相关服务（⚠ 待核实）。<\/li>\n<li>对年轻司机而言非近期必需，但属长期兜底知识。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_20\">八、数据可靠性与局限说明<\/h3>\n<p><strong>核验程度分级<\/strong>：\n- A 级：厚生労働省、日本年金機構、消防庁。\n- B 级：日本医師会、日本歯科医師会、日本精神神経学会、医疗机构官网。\n- C 级：平台抽样（费用 / 口碑）。<\/p>\n<p><strong>主要局限<\/strong>：\n1. 本基线为<strong>初析级<\/strong>，自付上限、初诊费用、多语言窗口、心理健康渠道的具体值未核实；\n2. 医疗费用因医院与病种差异大，需用「区间 / 口径」呈现；\n3. 个人定居地未定，地域差异无法收敛。<\/p>\n<p><strong>未取得项（次期优先）<\/strong>：高额疗养费现行上限；多语言医疗窗口清单；精神科初诊费用；介護自付细则。<\/p>\n<hr />\n<h3 id=\"_21\">九、参考来源清单<\/h3>\n<ol>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/benko/hoken_kenkou/index.html\">厚生労働省 · 健康保険<\/a> — 2026<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/kenkouhoken24.html\">厚生労働省 · 高額療養費制度<\/a> — 2026<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 2026<\/li>\n<li><a href=\"https://www.med.or.jp/\">日本医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.jda.or.jp/\">日本歯科医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.neuropsychology.jp/\">日本精神神経学会<\/a> — 2026<\/li>\n<li><a href=\"https://www.fdma.go.jp/\">消防庁 · 救急<\/a> — 2026<\/li>\n<li><a href=\"https://www8.cao.go.jp/kaigo/\">内閣府 · 介護<\/a> — 2026<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_22\">免责声明<\/h3>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<hr />\n<p>本报告为 v1.0 首期基线，数据基准 2026-11-14。⚠ 待核实项在次期或定居地确定后补齐。<\/p>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 157, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "15-health-wellbeing/reports/2026-11-health-wellbeing.html"}}}, "exit-transition-return": {"name": "退出·转型·回国", "dir": "16-exit-transition-return", "months": {"2026-11": {"title": "退出·转型·回国 · 首份分析报告", "body": "\n<h1 id=\"_1\">退出·转型·回国 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）· 个人执行层\n<strong>受众定位<\/strong>：本人（已在日或拟赴日的外国人，以特定技能司机为参照）\n<strong>来源规则<\/strong>：① 出入国在留管理庁 / 法務省 / e-Gov；② 厚生労働省 / 日本年金機構 / ハローワーク；③ 国税庁 / 総務省 / 地方自治体；④ 银行 / 运营商 / 运输 / 车辆相关机构官网；⑤ 媒体仅作线索<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本 · 退出·转型·回国 · 首期基线报告<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义<\/strong>：在日外国人的<strong>退出、转型、回国执行层<\/strong>——离开当前雇主或岗位时的资格与保险衔接、不退出日本时的资格转换路径、最终离境前后的钱、身份与生活清理。<\/p>\n<p><strong>监测范围（含）<\/strong>：退職、雇用保険、健康保険任意継続、被用者保険退出、在留資格取消 / 変更 / 特定活動、特定技能 2 号限制、転職与资格外活动、厚生年金脱退一时金申请执行、帰国前確定申告、住民税 / 所得税、在留卡返还、再入国許可 / みなし再入国、退室、通信 / 银行 / 车辆。<\/p>\n<p><strong>监测范围（不含）<\/strong>：税制 / 年金制度 / 脱退金额计算口径（→ 07-economy-finance）；永住 / 归化 / 资格取消 / 再入国制度正文（→ 08-visa-immigration）；赴日落地、保险加入、住房与行政 90 天清单（→ 14-life-operations）；求职、薪资、晋升、转职知识手册（→ 02-career-driver）；法规条文深度解读（→ 09-politics-law）。<\/p>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>退職后，在留资格、雇用保険与健康保険如何衔接？<\/li>\n<li>不退出日本时，在留資格変更、特定活動与其他就労资格的可行性如何？<\/li>\n<li>特定技能 1 号的业务限制与 2 号路径如何影响转型？<\/li>\n<li>最终离境前，年金脱退、确定申告、住民税、在留卡与再入国如何排序？<\/li>\n<li>退室、解約、车辆、通信、银行账户的清理时点与书类如何？<\/li>\n<li>哪些金额 / 期限 / 要件仍是信息差？<\/li>\n<\/ol>\n<p><strong>跨主题分工<\/strong>：见<a href=\"./prompts/business-config.md\">业务配置第六节<\/a>。<\/p>\n<hr />\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">维度<\/th>\n<th style=\"width:25%\">对应指标（登记册 #）<\/th>\n<th style=\"width:25%\">优先来源<\/th>\n<th style=\"width:25%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退出与劳动<\/td>\n<td>#1 #2<\/td>\n<td>厚生労働省 / ハローワーク<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>保险衔接<\/td>\n<td>#3 #4<\/td>\n<td>厚生労働省 / 日本年金機構<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>年金脱退<\/td>\n<td>#5 #6<\/td>\n<td>日本年金機構<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>转型与在留资格<\/td>\n<td>#7 #8 #9<\/td>\n<td>出入国在留管理庁<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>税务与住民<\/td>\n<td>#10<\/td>\n<td>国税庁 / 総務省 / 地方自治体<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>离境与再入国<\/td>\n<td>#11<\/td>\n<td>出入国在留管理庁<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>资产与生活清理<\/td>\n<td>#12<\/td>\n<td>各机构官网 / 地方自治体<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>来源治理<\/td>\n<td>#13<\/td>\n<td>全来源<\/td>\n<td>年度复盘<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：退出决定「资格与保险状态」；转型决定「能否继续留日」；回国决定「离境前钱、身份与生活如何结算」；来源治理决定「结论能否复核」。<\/p>\n<hr />\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 退出<\/h3>\n<ul>\n<li><strong>退職 ≠ 退去強制<\/strong>（事实）：退職是劳动关系终止；退去強制是入管法上的强制离境。<\/li>\n<li><strong>退職后的资格状态<\/strong>（推断）：退職本身不等于资格取消，但长期不从事原业务、未转换资格或未按规则变更，会分别触发不同风险。<\/li>\n<li><strong>保险衔接<\/strong>（事实）：被用者保险退职后需办理退出，并转入住民保险或申请健康保険任意継続。<\/li>\n<li>⚠ <strong>待核实<\/strong>：退職手続书类、预告期、窗口；健康保険任意継続申请期限、继续期间、保险料；雇用保険受给期间与必要书类。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 转型<\/h3>\n<ul>\n<li><strong>在留資格変更 ≠ 取消<\/strong>（事实）：变更是资格切换；取消是资格丧失。<\/li>\n<li><strong>特定活動 ≠ 技能実習<\/strong>（事实）：特定活動是告示指定的个别活动；技能実習是独立在留资格。<\/li>\n<li><strong>特定技能 2 号限制<\/strong>（事实，引用 08）：特定技能2号仅适用限定分野，自动车运送业无 2 号。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各资格变更要件、审查期间；特定活動可用事由；资格外活动个别许可与时间上限。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 回国<\/h3>\n<ul>\n<li><strong>年金脱退<\/strong>（事实）：满足条件者可申请厚生年金脱退一时金；本主题只研究申请执行，金额计算引用 07。<\/li>\n<li><strong>税务与住民<\/strong>（事实）：归国前后须确认所得税确定申报、住民税与转出申报。<\/li>\n<li><strong>在留卡与再入国<\/strong>（事实）：再入国許可与みなし再入国是不同制度。<\/li>\n<li><strong>生活清理<\/strong>（推断）：退室、解約、车辆、通信、银行账户应在离境前完成。<\/li>\n<li>⚠ <strong>待核实<\/strong>：确定申告期限、分离课税、届出书类；退室解约预告期；车辆手続与账户关闭条件。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 数据冲突并列（不可合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保険任意継続<\/td>\n<td>被用者保险继续 ≠ 国民健康保険加入<\/td>\n<\/tr>\n<tr>\n<td>再入国<\/td>\n<td>再入国許可（事前）≠ みなし再入国（离境时满足条件）<\/td>\n<\/tr>\n<tr>\n<td>年金脱退<\/td>\n<td>申请执行（16）≠ 金额计算口径（07）<\/td>\n<\/tr>\n<tr>\n<td>在留资格<\/td>\n<td>取消（资格丧失）≠ 変更（资格切换）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>退出、转型、回国是三件不同的事<\/strong>（事实）：退職、资格状态变化与离境结算不可互相替代。<\/li>\n<li><strong>退出阶段的关键是资格状态 + 保险衔接<\/strong>（推断）：退職后需同时处理在留资格、雇用保険与健康保険。<\/li>\n<li><strong>转型阶段的关键是新资格要件 + 业务限制<\/strong>（推断）：能否留日取决于新雇主、新资格、语言 / 资格条件与特定技能 2 号限制。<\/li>\n<li><strong>回国阶段的关键是钱、身份、生活三条线并行<\/strong>（推断）：年金脱退、确定申告、住民税、在留卡与再入国、退室与车辆 / 通信 / 银行账户应在离境前完成。<\/li>\n<li><strong>具体值仍是最大信息差<\/strong>（事实）：金额、期限、要件与窗口多数标「⚠ 待核实」。<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>健康保険任意継続、厚生年金脱退、在留資格取消 / 変更 / 特定活動的具体书类与期限待核验；<\/li>\n<li>退室・解約・车辆・通信・银行账户的解约预告期与关闭条件待核验；<\/li>\n<li>本初析为框架级 companion，不做单指标 deep-dive。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>：<\/p>\n<ol>\n<li>健康保険任意継続申请期限、继续期间、保险料与必要书类？<\/li>\n<li>厚生年金脱退一时金书类清单、申请窗口与复核入口？<\/li>\n<li>退職后在留資格取消、変更、特定活動的具体申请时点与审查基准？<\/li>\n<li>特定技能 2 号最新分野清单与变更适用时间？<\/li>\n<li>帰国前確定申告的申报期限、分离课税与届出书类？<\/li>\n<li>退室・解約・车辆・通信・银行账户的解约预告期与关闭条件？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：上述 6 项；并在年度台账复盘中补齐登记册 #1–#12 的「⚠ 待核实」。<\/p>\n<p><strong>数据补全计划<\/strong>：按事件触发节奏更新；个人情况变化时启动个人情况变化件；与 07 / 08 / 14 最新报告交叉核对。<\/p>\n<hr />\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>退職与労働条件终止规则<\/td>\n<td>依劳动基准法与契约；⚠ 书类与窗口待核实<\/td>\n<td>厚生労働省 / e-Gov<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>雇用保険 / 失業給付衔接<\/td>\n<td>符合受给资格者可申请；⚠ 期间与书类待核实<\/td>\n<td>ハローワーク<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>健康保険任意継続<\/td>\n<td>满足条件者可申请；⚠ 期限与保险料待核实<\/td>\n<td>日本年金機構<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>国民健康保険 / 被用者保険退出<\/td>\n<td>退职后须切换；⚠ 窗口与书类待核实<\/td>\n<td>厚生労働省<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>厚生年金脱退一时金<\/td>\n<td>满足条件者可申请；⚠ 书类与窗口待核实<\/td>\n<td>日本年金機構<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>年金・社保后续纳付与永住 / 归化影响<\/td>\n<td>可能有后续义务；⚠ 判断基准待核实<\/td>\n<td>日本年金機構 / 08<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>在留資格取消・変更・特定活動<\/td>\n<td>三者程序不同；⚠ 时点与书类待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>特定技能 1 号业务限制与 2 号路径<\/td>\n<td>2 号限定分野；自动车运送业无 2 号<\/td>\n<td>出入国在留管理庁 / 08<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>転職与资格外活动边界<\/td>\n<td>须在许可范围内；⚠ 个别许可待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>帰国前確定申告与住民税 / 所得税<\/td>\n<td>须确认申报与转出；⚠ 期限待核实<\/td>\n<td>国税庁 / 総務省<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>在留卡返还・再入国許可・みなし再入国<\/td>\n<td>两种制度不同；⚠ 条件待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>退室・解約・车辆・通信・银行账户清理<\/td>\n<td>离境前完成；⚠ 预告期与条件待核实<\/td>\n<td>各机构官网<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>官方来源更新与口径冲突<\/td>\n<td>逐条登记，不取均值<\/td>\n<td>全来源<\/td>\n<td>2026-11-14<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<ul>\n<li>节拍：事件触发单份解读 + 年度台账复盘；个人情况变化时启动个人情况变化件。<\/li>\n<li>触发器：退職・労働条件・雇用保険改定；健康保険任意継続改定；厚生年金脱退改定；在留資格取消・変更・特定活動规则改定；特定技能 2 号路径改定；転職・资格外活动规则改定；帰国前確定申告・住民税 / 所得税规则改定；退室・解約・车辆・通信规则改定；个人情况变化。<\/li>\n<li>无触发不启动新解读；不得为制造变化而虚构变化。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<ul>\n<li>A 级：官方一手；B 级：机构官网；C 级：本主题登记册无此类指标。<\/li>\n<li>主要局限：执行层研究；初析级；具体值未核实；个案差异大；不构成法律 / 税务意见。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<hr />\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/\">出入国在留管理庁<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体资格页面深链待事件触发时补齐<\/li>\n<li><a href=\"https://www.moj.go.jp/\">法務省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体法令页面深链待补齐<\/li>\n<li><a href=\"https://elaws.e-gov.go.jp/\">e-Gov 法令检索<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体条文深链待补齐<\/li>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体劳动与保险页面深链待补齐<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，脱退与任意継続具体页面深链待补齐<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/hellowork/\">ハローワーク<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，失业给付具体页面深链待补齐<\/li>\n<li><a href=\"https://www.nta.go.jp/\">国税庁<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，帰国前确定申告具体页面深链待补齐<\/li>\n<li><a href=\"https://www.soumu.go.jp/\">総務省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，住民・転出具体页面深链待补齐<\/li>\n<li><a href=\"https://www.mlit.go.jp/\">国土交通省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，车辆・运输具体页面深链待补齐<\/li>\n<li>07-economy-finance 基线报告与登记册（只读引用）<\/li>\n<li>08-visa-immigration 基线报告与登记册（只读引用）<\/li>\n<li>14-life-operations 基线报告与登记册（只读引用）<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-14。⚠ 待核实项在次期或事件触发后补齐。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本 · 退出·转型·回国 · 首期基线报告》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本 · 退出·转型·回国 · 首期基线报告<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首期基线）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）· 个人执行层\n<strong>受众定位<\/strong>：本人（已在日或拟赴日的外国人，以特定技能司机为参照）\n<strong>来源规则<\/strong>：① 出入国在留管理庁 / 法務省 / e-Gov；② 厚生労働省 / 日本年金機構 / ハローワーク；③ 国税庁 / 総務省 / 地方自治体；④ 银行 / 运营商 / 运输 / 车辆相关机构官网；⑤ 媒体仅作线索，引用须回溯官方原文<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">一、核心结论（摘要）<\/h3>\n<ol>\n<li><strong>退出、转型、回国是三件不同的事<\/strong>（事实）：退職是劳动关系终止，在留資格変更 / 取消是资格状态变化，回国是离境与结算。三者不可互相替代。<\/li>\n<li><strong>退出阶段的关键是「资格状态 + 保险衔接」<\/strong>（推断）：退職本身不会自动取消在留资格，但长期不从事原业务、未转换资格或未办理保险退出，会分别触发不同风险。<\/li>\n<li><strong>转型阶段的关键是「新资格要件 + 业务限制」<\/strong>（推断）：能否继续留在日本，取决于新雇主、新资格、语言 / 资格条件与特定技能 2 号限制。<\/li>\n<li><strong>回国阶段的关键是「钱、身份、生活三条线并行」<\/strong>（推断）：年金脱退、确定申告、住民税、在留卡与再入国、退室与车辆 / 通信 / 银行账户应在离境前完成。<\/li>\n<li><strong>本基线为初析级<\/strong>（事实）：本主题只研究执行层；税制、年金计算与资格取消制度正文分别引用 07 / 08，不重复展开。具体金额 / 期限 / 要件统一标「⚠ 待核实」。<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_14\">二、退出·转型·回国制度台账与监测机制<\/h3>\n<h4 id=\"21\">2.1 制度台账（来源治理）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">领域<\/th>\n<th style=\"width:25%\">官方来源<\/th>\n<th style=\"width:25%\">监测内容<\/th>\n<th style=\"width:25%\">更新节奏<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留・资格<\/td>\n<td>出入国在留管理庁 / 法務省 / e-Gov<\/td>\n<td>取消、変更、特定活動、再入国、在留卡<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>劳动・保险<\/td>\n<td>厚生労働省 / 日本年金機構 / ハローワーク<\/td>\n<td>退職、雇用保険、健康保険任意継続、被用者保険退出<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>年金・脱退<\/td>\n<td>日本年金機構<\/td>\n<td>厚生年金脱退一时金申请资格、书类、时限<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>税务・住民<\/td>\n<td>国税庁 / 総務省 / 地方自治体<\/td>\n<td>帰国前確定申告、住民税、所得税、転出届<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>生活清理<\/td>\n<td>各机构官网 / 地方自治体<\/td>\n<td>退室、解約、车辆、通信、银行账户<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"22\">2.2 触发器<\/h4>\n<ul>\n<li>退職・労働条件・雇用保険改定；<\/li>\n<li>健康保険任意継続要件 / 期限改定；<\/li>\n<li>厚生年金脱退要件 / 手续改定；<\/li>\n<li>在留資格取消・変更・特定活動规则改定；<\/li>\n<li>特定技能 2 号路径 / 业务限制改定；<\/li>\n<li>転職・资格外活动规则改定；<\/li>\n<li>帰国前確定申告・住民税 / 所得税规则改定；<\/li>\n<li>退室・解約・车辆・通信规则改定；<\/li>\n<li>个人情况变化。<\/li>\n<\/ul>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>新解读；不得为制造变化而虚构变化。<\/p>\n<h4 id=\"23\">2.3 登记册字段<\/h4>\n<p><code>data/exit_transition_return_indicator_registry.md<\/code> 维护：指标编号、指标、研究阶段、口径、最新值 / 规则、来源机构、来源 URL、版本 / 发布日期、核验状态、关联章节、更新时间。<\/p>\n<hr />\n<h3 id=\"_15\">三、制度框架与三段路径<\/h3>\n<h4 id=\"31_1\">3.1 三段路径<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">核心问题<\/th>\n<th style=\"width:34%\">关键制度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退出<\/td>\n<td>当前轨道如何合法、低损失地结束？<\/td>\n<td>退職、雇用保険、健康保険任意継続、被用者保険退出、在留资格状态<\/td>\n<\/tr>\n<tr>\n<td>转型<\/td>\n<td>不退出日本时还有哪些路？<\/td>\n<td>在留資格変更、特定活動、其他就労资格、転職边界、语言 / 资格补强<\/td>\n<\/tr>\n<tr>\n<td>回国<\/td>\n<td>最终离境前后的手续与钱如何结算？<\/td>\n<td>年金脱退执行、帰国前確定申告、在留卡、再入国、退室、通信 / 银行 / 车辆<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"32_1\">3.2 制度关系（推断）<\/h4>\n<pre><code>退職\n ├─ 雇用保険 → 失业给付\n ├─ 健康保険任意継続 ↔ 国民健康保険\n └─ 在留资格状态 → 変更 / 特定活動 / 取消风险\n转型\n ├─ 新雇主 / 新资格\n ├─ 特定技能 2 号（限定分野）\n └─ 転職边界 / 资格外活动\n回国\n ├─ 年金脱退执行\n ├─ 确定申告 / 住民税 / 転出届\n ├─ 在留卡 / 再入国\n └─ 退室 / 解約 / 车辆 / 账户\n<\/code><\/pre>\n<h4 id=\"33_1\">3.3 跨主题分工（只读引用）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主题<\/th>\n<th style=\"width:33%\">本主题只读引用<\/th>\n<th style=\"width:34%\">本主题主责<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>07-economy-finance<\/td>\n<td>税制、年金制度、脱退金额计算口径<\/td>\n<td>退职前后的税务结算、年金脱退、保险衔接执行<\/td>\n<\/tr>\n<tr>\n<td>08-visa-immigration<\/td>\n<td>永住、归化、在留资格取消 / 再入国制度正文<\/td>\n<td>退出时点如何申请与衔接<\/td>\n<\/tr>\n<tr>\n<td>14-life-operations<\/td>\n<td>赴日落地、保险加入、住房与行政 90 天清单<\/td>\n<td>退室、解約、离境前住所 / 通信 / 银行 / 车辆清理<\/td>\n<\/tr>\n<tr>\n<td>02-career-driver<\/td>\n<td>求职、薪资、晋升、转职知识手册<\/td>\n<td>司机岗位退出条件、转型与资格外活动边界<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"_16\">四、退出与转型政策逐条解读<\/h3>\n<h4 id=\"41\">4.1 退出<\/h4>\n<h5 id=\"411\">4.1.1 退職与労働条件终止<\/h5>\n<ul>\n<li><strong>退職<\/strong>是劳动者与雇主之间劳动关系的终止，依合意、解雇或定年发生；<strong>退去強制<\/strong>是入管法上的强制离境，二者不得混用（事实）。<\/li>\n<li>退職后需确认：退職日与最终出勤日、退職金、雇用保険受给资格、健康保険处理、在留资格状态（推断）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：退職手続的具体书类、预告期、窗口与外国人专属口径，须按厚生労働省与雇主规则核验。<\/li>\n<\/ul>\n<h5 id=\"412\">4.1.2 雇用保険 / 失業給付<\/h5>\n<ul>\n<li>退職后符合受给资格者可申请失业给付（事实）[ハローワーク]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：受给期间、手続期限、必要书类、再就业活动要求。<\/li>\n<\/ul>\n<h5 id=\"413\">4.1.3 健康保険任意継続<\/h5>\n<ul>\n<li>被用者保险退职后满足条件者可申请任意继续；该制度是<strong>被用者保险继续<\/strong>，不是国民健康保険加入（事实）[日本年金機構]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：申请期限、继续期间、保险料与必要书类。<\/li>\n<\/ul>\n<h5 id=\"414\">4.1.4 国民健康保険 / 被用者保険退出<\/h5>\n<ul>\n<li>被用者保险退职后须办理退出，并转入住民保险或任意继续（推断）[厚生労働省]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各自治体窗口、书类与切换时点。<\/li>\n<\/ul>\n<h5 id=\"415\">4.1.5 在留资格状态<\/h5>\n<ul>\n<li>退職本身不等于在留资格取消；但长期不从事原业务、未转换资格或未按规则变更，会分别触发不同风险（推断）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：退職后资格取消、変更、特定活動的具体申请时点、必要书类与审查基准。<\/li>\n<\/ul>\n<h4 id=\"42\">4.2 转型<\/h4>\n<h5 id=\"421\">4.2.1 在留資格変更<\/h5>\n<ul>\n<li>从一种在留资格切换为另一种资格须申请变更许可；取消与变更是不同程序（事实）[出入国在留管理庁]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各资格变更要件、审查期间、必要书类。<\/li>\n<\/ul>\n<h5 id=\"422\">4.2.2 特定活動<\/h5>\n<ul>\n<li>特定活動是入管法告示指定的个别活动在留资格，与技能実習不同（事实）[出入国在留管理庁]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：可用特定活動的具体事由、期间与申请要件。<\/li>\n<\/ul>\n<h5 id=\"423\">4.2.3 其他就労资格与転職边界<\/h5>\n<ul>\n<li>転職须在许可范围内；资格外活动须另获许可（推断）[出入国在留管理庁]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：个别许可与时间上限。<\/li>\n<\/ul>\n<h5 id=\"424-2\">4.2.4 特定技能 2 号限制<\/h5>\n<ul>\n<li>特定技能 1 号有业务限制与在留上限；特定技能2号仅适用限定分野，自动车运送业无 2 号（事实，引用 08 最新口径）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：最新分野清单与变更适用时间，按 08-visa-immigration 最新报告核验。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_17\">五、个人场景影响矩阵<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">场景<\/th>\n<th style=\"width:20%\">退出影响<\/th>\n<th style=\"width:20%\">转型影响<\/th>\n<th style=\"width:20%\">回国影响<\/th>\n<th style=\"width:20%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>有稳定新雇主<\/td>\n<td>退職 → 新雇主接收<\/td>\n<td>可能申请在留資格変更<\/td>\n<td>一般不触发回国<\/td>\n<td>出入国在留管理庁（推断）<\/td>\n<\/tr>\n<tr>\n<td>无新雇主但考虑留日<\/td>\n<td>需确认资格状态与保险<\/td>\n<td>特定活動 / 其他资格<\/td>\n<td>期限压力上升<\/td>\n<td>出入国在留管理庁（推断）<\/td>\n<\/tr>\n<tr>\n<td>准备回国<\/td>\n<td>退職与保险退出<\/td>\n<td>一般不启动<\/td>\n<td>年金脱退、确定申告、退室、车辆<\/td>\n<td>日本年金機構 / 国税庁<\/td>\n<\/tr>\n<tr>\n<td>有家属<\/td>\n<td>家属资格状态需单独确认<\/td>\n<td>家属带同与扶养要件变化<\/td>\n<td>家属离境与在留卡处理<\/td>\n<td>08-visa-immigration（推断）<\/td>\n<\/tr>\n<tr>\n<td>有资产<\/td>\n<td>保险与税务衔接<\/td>\n<td>资产处置时点变化<\/td>\n<td>车辆 / 通信 / 银行账户清理<\/td>\n<td>各机构官网（推断）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>推断说明<\/strong>：上表用于条件化决策，不构成法律 / 税务意见；个案须咨询专业人士。<\/p>\n<hr />\n<h3 id=\"_18\">六、退出·转型·回国行动建议（建议章）<\/h3>\n<blockquote>\n<p>本章为「建议」，与事实分离；重大决策须咨询执业法律 / 税务专业人士。<\/p>\n<\/blockquote>\n<h4 id=\"61\">6.1 退出阶段建议<\/h4>\n<ol>\n<li><strong>先确认资格状态<\/strong>：退職前确认在留资格、受入计划、受雇规则与更新时点（建议）。<\/li>\n<li><strong>再确认保险<\/strong>：被用者保险退职后，尽快确认健康保険任意継続与国民健康保険切换（建议）。<\/li>\n<li><strong>保留书类<\/strong>：退職証明、雇用保険受给资格者证、社会保险料纳付证明、纳税证明（建议）。<\/li>\n<\/ol>\n<h4 id=\"62\">6.2 转型阶段建议<\/h4>\n<ol>\n<li><strong>先找新雇主 / 新资格<\/strong>：再申请在留資格変更；不要先退職后长期滞留（建议）。<\/li>\n<li><strong>确认业务限制<\/strong>：特定技能 1 号业务限制与 2 号分野限制须逐项核对（建议）。<\/li>\n<li><strong>语言 / 资格补强<\/strong>：按新资格要件准备日语与资格证明（建议）。<\/li>\n<\/ol>\n<h4 id=\"63\">6.3 回国阶段建议<\/h4>\n<ol>\n<li><strong>离境前 1–3 个月<\/strong>：确认年金脱退、确定申告、住民税、転出届、在留卡与再入国（建议）。<\/li>\n<li><strong>离境前 2–4 周<\/strong>：完成退室、通信 / 银行 / 车辆解约或处置（建议）。<\/li>\n<li><strong>离境后<\/strong>：确认日本国内是否仍有纳税、年金或保险后续义务（建议）。<\/li>\n<\/ol>\n<h4 id=\"64\">6.4 时间线（建议）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">时点<\/th>\n<th style=\"width:34%\">事项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退出前<\/td>\n<td>退職前 1–3 个月<\/td>\n<td>资格状态、保险、书类<\/td>\n<\/tr>\n<tr>\n<td>退出时<\/td>\n<td>退職日<\/td>\n<td>退職手続、雇用保険、保险退出<\/td>\n<\/tr>\n<tr>\n<td>转型<\/td>\n<td>留日决定后<\/td>\n<td>新雇主 / 新资格、变更申请<\/td>\n<\/tr>\n<tr>\n<td>回国前<\/td>\n<td>离境前 1–3 个月<\/td>\n<td>年金脱退、确定申告、住民税<\/td>\n<\/tr>\n<tr>\n<td>回国前<\/td>\n<td>离境前 2–4 周<\/td>\n<td>退室、车辆、通信、银行账户<\/td>\n<\/tr>\n<tr>\n<td>回国后<\/td>\n<td>离境后<\/td>\n<td>后续义务确认<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"_19\">七、制度变更与个人行动时间线<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">时点<\/th>\n<th style=\"width:25%\">制度 / 事件<\/th>\n<th style=\"width:25%\">来源<\/th>\n<th style=\"width:25%\">个人行动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2026-11-14<\/td>\n<td>本基线建立<\/td>\n<td>16<\/td>\n<td>建立登记册与三段框架<\/td>\n<\/tr>\n<tr>\n<td>触发时<\/td>\n<td>官方规则改定<\/td>\n<td>出入国在留管理庁 / 厚生労働省 / 日本年金機構 / 国税庁<\/td>\n<td>启动事件触发解读<\/td>\n<\/tr>\n<tr>\n<td>个人情况变化<\/td>\n<td>资格 / 雇主 / 家庭 / 资产 / 离境计划<\/td>\n<td>个人记录<\/td>\n<td>启动个人情况变化件<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>说明<\/strong>：本主题不预设个人 Go/No-Go；时间线仅用于条件化决策。<\/p>\n<hr />\n<h3 id=\"_20\">八、数据可靠性与局限说明<\/h3>\n<h4 id=\"81\">8.1 核验程度分级<\/h4>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：出入国在留管理庁 / 法務省 / e-Gov；厚生労働省 / 日本年金機構 / ハローワーク；国税庁 / 総務省 / 地方自治体。<\/li>\n<li><strong>B 级（机构官网）<\/strong>：银行 / 运营商 / 运输 / 车辆相关机构。<\/li>\n<li><strong>C 级（平台抽样）<\/strong>：本主题登记册无此类指标。<\/li>\n<\/ul>\n<h4 id=\"82\">8.2 主要局限<\/h4>\n<ol>\n<li><strong>执行层研究<\/strong>：本主题不展开税制、年金计算与资格取消制度正文，相关结论引用 07 / 08。<\/li>\n<li><strong>初析级<\/strong>：具体金额、期限、要件与窗口多数标「⚠ 待核实」，待事件触发或年度复盘补齐。<\/li>\n<li><strong>个案差异大<\/strong>：资格、收入、家属、资产、离境时点不同，建议必须条件化。<\/li>\n<\/ol>\n<h4 id=\"83\">8.3 未取得项（次期优先）<\/h4>\n<ul>\n<li>健康保険任意継続申请期限、继续期间、保险料与必要书类；<\/li>\n<li>厚生年金脱退一时金书类清单、申请窗口与复核入口；<\/li>\n<li>在留資格取消・変更・特定活動的具体申请时点与审查基准；<\/li>\n<li>帰国前確定申告的申报期限、分离课税与届出书类；<\/li>\n<li>退室・解約・车辆・通信・银行账户的解约预告期与关闭条件。<\/li>\n<\/ul>\n<h4 id=\"84\">8.4 口径冲突并列（不可合并、不取均值）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保険任意継続<\/td>\n<td>被用者保险继续 ≠ 国民健康保険加入<\/td>\n<\/tr>\n<tr>\n<td>再入国<\/td>\n<td>再入国許可（事前）≠ みなし再入国（离境时满足条件）<\/td>\n<\/tr>\n<tr>\n<td>年金脱退<\/td>\n<td>申请执行（16）≠ 金额计算口径（07）<\/td>\n<\/tr>\n<tr>\n<td>在留资格<\/td>\n<td>取消（资格丧失）≠ 変更（资格切换）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"_21\">九、参考来源清单<\/h3>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/\">出入国在留管理庁<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体资格页面深链待事件触发时补齐<\/li>\n<li><a href=\"https://www.moj.go.jp/\">法務省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体法令页面深链待补齐<\/li>\n<li><a href=\"https://elaws.e-gov.go.jp/\">e-Gov 法令检索<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体条文深链待补齐<\/li>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体劳动与保险页面深链待补齐<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，脱退与任意継続具体页面深链待补齐<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/hellowork/\">ハローワーク<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，失业给付具体页面深链待补齐<\/li>\n<li><a href=\"https://www.nta.go.jp/\">国税庁<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，帰国前确定申告具体页面深链待补齐<\/li>\n<li><a href=\"https://www.soumu.go.jp/\">総務省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，住民・転出具体页面深链待补齐<\/li>\n<li><a href=\"https://www.mlit.go.jp/\">国土交通省<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，车辆・运输具体页面深链待补齐<\/li>\n<li>07-economy-finance 基线报告与登记册（只读引用）<\/li>\n<li>08-visa-immigration 基线报告与登记册（只读引用）<\/li>\n<li>14-life-operations 基线报告与登记册（只读引用）<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_22\">免责声明<\/h3>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<hr />\n<p>本报告为 v1.0 首期基线，数据基准 2026-11-14。⚠ 待核实项在次期或事件触发后补齐。<\/p>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 288, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "16-exit-transition-return/reports/2026-11-exit-transition-return.html"}}}}</script>

    Object.keys(DATA).sort().forEach(function (rs) {
      var t = DATA[rs];
      var months = Object.keys(t.months).sort().reverse();
      html += '<a href="#topic=' + rs + '&month=' + months[0] + '" data-rs="' + rs + '">'
        + '<span class="num">' + (t.dir || '').replace(/^\d+-/, '') + '</span>'
        + '<span>' + escapeHtml(t.name) + '</span>'
        + '<span class="cnt">' + months.length + ' 期</span></a>';
    });
    box.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- 路由 ---------- */
  function parseHash() {
    var h = location.hash || '';
    var m = /^#topic=([^&]+)(?:&month=(\d{4}-\d{2}))?/.exec(h);
    if (!m) return null;
    return { rs: decodeURIComponent(m[1]), month: m[2] || null };
  }

  function currentPeriods(rs) {
    return Object.keys(DATA[rs].months).sort();  // 升序（时间正序）
  }

  function render() {
    var route = parseHash();
    var sidebar = $('#rd-toc');
    if (!route || !DATA[route.rs]) {
      // 默认落到第一个主题的最新一期
      var first = Object.keys(DATA).sort()[0];
      if (first) {
        var months = currentPeriods(first);
        location.replace('#topic=' + first + '&month=' + months[months.length - 1]);
        return;
      }
      $('#rd-main').innerHTML = '<p class="rd-empty">暂无已产出报告。</p>';
      return;
    }
    var t = DATA[route.rs];
    var periods = currentPeriods(route.rs);
    var month = route.month && t.months[route.month] ? route.month : periods[periods.length - 1];
    var rec = t.months[month];

    // 侧栏高亮
    $all('a[data-rs]', sidebar).forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-rs') === route.rs);
    });

    // 头部
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth() - (RECENT_MONTHS - 1), 1);
    var startPeriod = start.getFullYear() + '-' + pad(start.getMonth() + 1);
    var monthsHtml = periods.map(function (p) {
      var cls = 'rd-month' + (p === month ? ' on' : '') + (p < startPeriod ? ' old' : '');
      return '<button class="' + cls + '" data-month="' + p + '">' + p + '</button>';
    }).join('');
    var stats = rec.stats || {};
    $('#rd-head').innerHTML =
      '<div class="crumb">' + escapeHtml(t.dir) + ' · ' + escapeHtml(t.name) + '</div>'
      + '<h1>' + escapeHtml(rec.title || (month + ' 期报告')) + '</h1>'
      + '<div class="sum">' + escapeHtml(rec.summary || '') + '</div>'
      + '<div class="rd-toolbar">'
      +   '<div class="rd-months">' + monthsHtml + '</div>'
      +   '<button class="rd-toggle" id="tg-diff">隐藏更新标记</button>'
      +   '<button class="rd-toggle" id="tg-del">展开全部删除</button>'
      + '</div>';

    // 正文
    var body = $('#rd-body');
    body.innerHTML = rec.body || '<p class="rd-empty">本期报告无内容。</p>';

    // 月份切换
    $all('.rd-month', $('#rd-head')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.getAttribute('data-month');
        if (p === month) return;
        location.hash = '#topic=' + route.rs + '&month=' + p;  // 触发 hashchange -> render
      });
    });

    // 对照阅读开关
    var tgDiff = $('#tg-diff');
    tgDiff.addEventListener('click', function () {
      var hide = body.classList.toggle('hide-diff');
      tgDiff.textContent = hide ? '显示更新标记' : '隐藏更新标记';
    });

    // 展开全部删除
    var tgDel = $('#tg-del');
    tgDel.addEventListener('click', function () {
      var open = tgDel.getAttribute('data-open') === '1';
      $all('details.diff-del-group', body).forEach(function (d) { d.open = !open; });
      tgDel.setAttribute('data-open', open ? '0' : '1');
      tgDel.textContent = open ? '展开全部删除' : '收起全部删除';
    });

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  renderSidebar();
  render();
})();
</script>
</body>
</html>
