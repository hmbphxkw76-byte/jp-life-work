siness_1/<\/a><\/li>\n<li>外务省领馆费用专页 <a href=\"https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html\">https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html<\/a><\/li>\n<li>国土交通省 <a href=\"https://www.mlit.go.jp\">https://www.mlit.go.jp<\/a>；e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a><\/li>\n<\/ol>\n<p><strong>考试与实施机构<\/strong>：<\/p>\n<ol>\n<li>ClassNK 试验 Portal <a href=\"https://sswt-portal.classnk.or.jp/\">https://sswt-portal.classnk.or.jp/<\/a>；费用公告 <a href=\"https://sswt-portal.classnk.or.jp/news/25\">https://sswt-portal.classnk.or.jp/news/25<\/a><\/li>\n<li>JFT-Basic <a href=\"https://jft-basic.jp\">https://jft-basic.jp<\/a>；Prometric 受験料 <a href=\"https://www.prometric-jp.com/ssw/exam/fee/\">https://www.prometric-jp.com/ssw/exam/fee/<\/a><\/li>\n<li>JLPT <a href=\"https://www.jlpt.jp\">https://www.jlpt.jp<\/a>；中国考区（NEEA）<a href=\"https://jlpt.neea.edu.cn/faq.html\">https://jlpt.neea.edu.cn/faq.html<\/a><\/li>\n<li>外国人技能実習機構（OTIT）<a href=\"https://www.otit.go.jp/employment_for_skill_development/05/\">https://www.otit.go.jp/employment_for_skill_development/05/<\/a><\/li>\n<\/ol>\n<p><strong>行业与专业（线索 / 背景）<\/strong>：<\/p>\n<ol>\n<li>全日本トラック協会、登录支援机关行业信息（行业背景，本主题未直接引用 URL）<\/li>\n<li>日本国驻越南使馆资料（考试构成）<a href=\"https://www.vn.emb-japan.go.jp/files/100989367.pdf\">https://www.vn.emb-japan.go.jp/files/100989367.pdf<\/a>；育成就劳制度概要 <a href=\"https://www.vn.emb-japan.go.jp/files/100881460.pdf\">https://www.vn.emb-japan.go.jp/files/100881460.pdf<\/a><\/li>\n<li>WAM 特集（2024 改正法解说）<a href=\"https://www.wam.go.jp/hp/wp-content/uploads/wam202511.pdf\">https://www.wam.go.jp/hp/wp-content/uploads/wam202511.pdf<\/a>；施行日程说明（线索）<a href=\"https://titp360.jp/words/nurturing-work/\">https://titp360.jp/words/nurturing-work/<\/a><\/li>\n<\/ol>\n<p><strong>媒体（线索，须回溯）<\/strong>：<\/p>\n<ol>\n<li>TokyoBrief（843 人早期转载，后经 ISA 原件核验）<a href=\"https://tokyobrief.com/articles/japan-skilled-worker-visa-cap-54-percent-full-august-2026\">https://tokyobrief.com/articles/japan-skilled-worker-visa-cap-54-percent-full-august-2026<\/a><\/li>\n<\/ol>\n<p><strong>跨主题只读引用<\/strong>：<\/p>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 登记册与最新报告（官方统计活值单一事实源）<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 242, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "08-visa-immigration/reports/2026-11-visa-immigration.html"}}}, "politics-law": {"name": "政治与法律", "dir": "09-politics-law", "months": {"2026-11": {"title": "日本政治与法规 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本政治与法规--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本政治与法规 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要法规框架与维权工具的读者，兼具制度查询与合规应对视角。\n<strong>来源规则<\/strong>：① e-Gov 法令检索、出入国在留管理庁、厚生労働省（check-roudou.mhlw.go.jp）、総務省（soumu.go.jp：多文化共生施策）、各都道府県労働局 ＞ ② 主要政党官网（jimin.jp 等——政策环境信号，须实际打开验证后才可写立场）＋ JILPT 研究报告 ＞ ③ 弁護士会 / 行政书士会公开指引 ＞ ④ NHK、日本経済新聞、Nikkei Asia（政治动向，须回溯）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要<\/a>\n<a href=\"#s2\">二、政策台账与监测机制<\/a>\n<a href=\"#s3\">三、监管框架总览<\/a>\n<a href=\"#s4\">四、重点政策逐条解读<\/a>\n<a href=\"#s5\">五、影响对象矩阵<\/a>\n<a href=\"#s6\">六、合规应对建议（建议章）<\/a>\n<a href=\"#s7\">七、生效时间线<\/a>\n<a href=\"#s8\">八、数据治理与局限<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要\" aria-hidden=\"true\"><\/a>一、执行摘要<\/h2>\n<p><strong>核心判断<\/strong>（编号条目，每条含政策、条款与来源）：<\/p>\n<ol>\n<li><strong>法律栈<\/strong>：与个人直接相关的法律栈为 <strong>8 部<\/strong>，其中<strong>入管法<\/strong>与<strong>货送法<\/strong>构成在留与运输业务的底线约束。来源：handbook 01 法律栈表。标注：事实。<\/li>\n<li><strong>必熟条款<\/strong>：个人必熟 Top 5 条款中，<strong>资格外活动禁止<\/strong>与<strong>连续 3 个月不从事原业务的资格取消风险<\/strong>最直接；月加班 100h 未满红线、住民税 / 社保滞纳 3 年 → 永住取消事由、在留卡 14 天地址变更义务与离日 1 年再入国期限同列。来源：handbook 01。标注：事实（条款罗列）；风险排序为基线判断。<\/li>\n<li><strong>政策环境<\/strong>：移民政策呈<strong>「扩大受入 + 管理强化」并行<\/strong>（特定技能分野扩大、育成就劳 2027 年施行；永住取消 2024 年改正、接受机关审查加严），<strong>政治波动对已落地者的影响小于制度过渡期内的合规质量<\/strong>。来源：handbook 02 三条主线与政党光谱。标注：事实（政策主线）；影响判断为推断。<\/li>\n<li><strong>维权路径<\/strong>：劳动纠纷维权为<strong>五级阶梯<\/strong>，行政渠道（劳动基准监督署）与法律援助（法テラス）并行。来源：handbook 03。标注：事实。<\/li>\n<li><strong>咨询窗口<\/strong>：登记册 #2 外国人劳动咨询窗口为 <strong>Hotline 0120-811-610<\/strong>（锚 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 清单）；另载 <strong>Yorisoi Hotline 0120-279-338<\/strong>（多语）。标注：事实；两热线口径并列。<\/li>\n<li><strong>政治常态<\/strong>：任何政权组合下「已入境者按既存法规运作」是常态。标注：推断。<\/li>\n<\/ol>\n<p><strong>监管态势一句话<\/strong>：法规框架稳定、政策环境「扩大 + 管理」并行；法规文本三层（法令条文 / 政府解说页 / 媒体转述）须分别标注，<strong>法规类结论只采信 e-Gov / ISA / 厚労省官方原文<\/strong>。<\/p>\n<p><strong>生效时间线要点<\/strong>：2024 年改正入管法（永住取消新事由）；令和 2 年 9 月总务省「地域における多文化共生推進プラン」改订；2027 年育成就劳施行（详见第七节）。<\/p>\n<p><strong>解读说明<\/strong>：本报告为 2026-11 月度（复用）生成，以 2026-11-11 / 11-12 核对的政策环境为准；政治动向影响判断一律标「推断」；原文有歧义处并列解读（见第四、八节）。本报告输出法规文本解读与影响评估，不构成法律意见；建议章（第六节）与事实分离。<\/p>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新活值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>入管法最新改正<\/td>\n<td>待基线确立<\/td>\n<td>e-Gov<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>外国人劳动咨询窗口<\/td>\n<td>Hotline 0120-811-610（锚 01-ssw-driver 清单）<\/td>\n<td>check-roudou.mhlw.go.jp<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>移民政策重大动向<\/td>\n<td>待基线确立<\/td>\n<td>官方公报 / 媒体<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>育成就労施行进度<\/td>\n<td>2027 年施行（02 篇）<\/td>\n<td>官房 / 厚労省<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>维权渠道联系方式现行口径<\/td>\n<td>待基线确立<\/td>\n<td>各都道府県労働局<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>注：本表逐项抄录登记册活值，未改写数值；「待基线确立」如实保留。<\/p>\n<\/blockquote>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告（2026-11-13）已修正事实清单，无新增修正。历史报告中登记册 #1、#3、#5 三项「待基线确立」仍如实保留，未以推断补值。<\/p>\n<h2 id=\"s2\"><a id=\"二政策台账与监测机制\" aria-hidden=\"true\"><\/a>二、政策台账与监测机制<\/h2>\n<p><strong>台账结构<\/strong>：本主题活值统一维护于 <a href=\"../data/politics_law_indicator_registry.md\">data/politics_law_indicator_registry.md<\/a>（5 项核心指标 + 研究边界档案）；ITJ / GFP 等维权渠道结论以 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 最新报告文首「已修正事实清单」为单一事实源，本登记册不重复维护。<\/p>\n<p><strong>监测节拍<\/strong>：基线报告 <code>reports/2026-11-politics-law.md<\/code>（v1.0 首期固定）；事件触发解读 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度台账复盘同名路径。政策动向季度核对，记录进 <a href=\"../../08-visa-immigration/handbook/09-policy-log.md\">08-visa-immigration · 09 政策更新日志<\/a>。无触发器命中且窗口未到时不启动新解读，不得为制造变化而虚构变化。<\/p>\n<p><strong>追踪表<\/strong>（研究维度 × 优先来源 × 回写项）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">监测指标<\/th>\n<th style=\"width:20%\">优先数据源<\/th>\n<th style=\"width:20%\">对应章节<\/th>\n<th style=\"width:20%\">回写登记册项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>入管法最新改正<\/td>\n<td>e-Gov<\/td>\n<td>三 / 四<\/td>\n<td>核心指标 #1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>外国人劳动咨询窗口<\/td>\n<td>check-roudou.mhlw.go.jp<\/td>\n<td>六<\/td>\n<td>核心指标 #2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>移民政策重大动向<\/td>\n<td>官方公报 / 媒体<\/td>\n<td>四 / 五<\/td>\n<td>核心指标 #3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>育成就労施行进度<\/td>\n<td>官房 / 厚労省<\/td>\n<td>四<\/td>\n<td>核心指标 #4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>维权渠道联系方式现行口径<\/td>\n<td>各都道府県労働局<\/td>\n<td>六<\/td>\n<td>核心指标 #5<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>官方发布渠道清单<\/strong>：<\/p>\n<ul>\n<li>法规：e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>；出入国在留管理庁（入管法解说）<a href=\"https://www.moj.go.jp/isa\">https://www.moj.go.jp/isa<\/a>。<\/li>\n<li>劳动：厚生労働省劳动基准 Q&amp;A <a href=\"https://www.mhlw.go.jp\">https://www.mhlw.go.jp<\/a>；劳动基准监督署 <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/\">https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/<\/a>；check-roudou.mhlw.go.jp（外国人劳动咨询）。<\/li>\n<li>共生施策：総務省「地域における多文化共生推進プラン」<a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html\">https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html<\/a>。<\/li>\n<li>政策环境信号：主要政党官网（jimin.jp、cdp-japan.jp、o-ishin.jp、new-kokumin.jp）；JILPT 研究报告；弁護士会 / 行政书士会公开指引。<\/li>\n<li>媒体（线索，须回溯）：NHK、日本経済新聞、Nikkei Asia。<\/li>\n<\/ul>\n<p><strong>触发器清单<\/strong>：<\/p>\n<ol>\n<li>入管法 / 相关法令改正（e-Gov 公布）→ 三 / 四；<\/li>\n<li>移民政策重大动向（受入方针、政党政策变化）→ 四 / 五；<\/li>\n<li>大选 / 党首更替（主要政党对外国人材政策口径变化）→ 四 光谱小节；<\/li>\n<li>外国人权利相关法案·制度动向（地方参政权、行政手续多语言化等）→ 四 观察点小节；<\/li>\n<li>劳动维权渠道 / 热线变化 → 六；<\/li>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 修正清单涉及维权条目（ITJ / GFP 类）→ 六。<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：唯一观察项 · 首要触发器 · 触发器结论均为「首期为空」。<\/p>\n<h2 id=\"s3\"><a id=\"三监管框架总览\" aria-hidden=\"true\"><\/a>三、监管框架总览<\/h2>\n<p><strong>与本项目相关的法律栈（8 部）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">法律<\/th>\n<th style=\"width:33%\">管什么<\/th>\n<th style=\"width:34%\">对个人的具体影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>出入国管理法（入管法）<\/strong><\/td>\n<td>在留资格、审查、取消、退去强制<\/td>\n<td>特定技能要件、永住许可 / 取消、资格外活动禁止<\/td>\n<\/tr>\n<tr>\n<td>職業安定法<\/td>\n<td>求职·雇佣介绍<\/td>\n<td>Hello Work、转职规则<\/td>\n<\/tr>\n<tr>\n<td>労働者派遣法<\/td>\n<td>派遣劳动<\/td>\n<td>司机派遣岗位的法律框架<\/td>\n<\/tr>\n<tr>\n<td><strong>貨物自動車運送事業法（货送法）<\/strong><\/td>\n<td>运输事业许可与运行体制<\/td>\n<td>运行管理者、点呼、运输规则<\/td>\n<\/tr>\n<tr>\n<td>労働基準法+働き方改革法<\/td>\n<td>工时·工资·解雇<\/td>\n<td>时间外上限（详见 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>労働安全衛生法<\/td>\n<td>安全管理<\/td>\n<td>安全管理者、健康诊断<\/td>\n<\/tr>\n<tr>\n<td>道路交通法<\/td>\n<td>驾照·运行规则<\/td>\n<td>驾照种类、L4 许可（详见 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>自動車損害賠償保障法<\/td>\n<td>车辆保险<\/td>\n<td>自赔责强制保险<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>法规分层口径<\/strong>：<strong>法令条文（e-Gov 原文）≠ 政府解说页 ≠ 媒体转述<\/strong>——三层须分别标注，不得混用；<strong>入管法（出入国管理法）≠ 関係法令<\/strong>（職業安定法 / 労働者派遣法 / 货送法 / 労働基準法 / 道路交通法等）。<\/p>\n<p><strong>检索入口<\/strong>：e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>；入管法条文（ISA 解说页）<a href=\"https://www.moj.go.jp/isa\">https://www.moj.go.jp/isa<\/a>；厚労省劳动基准 Q&amp;A <a href=\"https://www.mhlw.go.jp\">https://www.mhlw.go.jp<\/a>；综合法律支援（多语种法律咨询）法テラス <a href=\"https://www.houterasu.or.jp\">https://www.houterasu.or.jp<\/a>。<\/p>\n<p><strong>框架演变脉络<\/strong>：2024 年（令和 6 年）改正入管法新增永住取消事由；育成就劳 2027 年施行；多文化共生施策由总务省持续指导自治体。<\/p>\n<h2 id=\"s4\"><a id=\"四重点政策逐条解读\" aria-hidden=\"true\"><\/a>四、重点政策逐条解读<\/h2>\n<h3 id=\"41-top-5\"><a id=\"41-入管法与在留管理条款个人必熟-top-5\" aria-hidden=\"true\"><\/a>4.1 入管法与在留管理条款（个人必熟 Top 5）<\/h3>\n<ol>\n<li><strong>资格外活动禁止<\/strong>：特定技能 1 号只能从事受入计划书记载业务。<\/li>\n<li><strong>连续 3 个月不从事原业务 → 资格取消<\/strong>。<\/li>\n<li><strong>月加班 100h 未满红线<\/strong>（时间外 + 休日合计）。<\/li>\n<li><strong>住民税 / 社保滞纳 3 年 → 永住取消事由<\/strong>。<\/li>\n<li>\n<p><strong>在留卡 14 天地址变更义务<\/strong>、<strong>离日 1 年再入国期限<\/strong>。<\/p>\n<\/li>\n<li>\n<p><strong>解读<\/strong>：Top 5 中第 1、2 条与日常合规最直接；第 4 条与长期永住资格直接相关。<\/p>\n<\/li>\n<li><strong>来源<\/strong>：handbook 01；入管法条文（ISA 解说页）。<\/li>\n<\/ol>\n<h3 id=\"42-2024\"><a id=\"42-2024-年改正永住取消制度\" aria-hidden=\"true\"><\/a>4.2 2024 年改正：永住取消制度<\/h3>\n<ul>\n<li><strong>条款摘编<\/strong>：令和 6 年改正法新增永住者资格取消事由——无正当理由<strong>连续 3 年以上未履行纳税或社会保险缴费义务<\/strong>；出国时未取得再入国许可（含视同再入国）而长期离境等。<\/li>\n<li><strong>解读<\/strong>：永住资格不再是「一次取得、终身有效」；从入境第一年起的公的义务履行情况即为积累或破坏永住条件。<\/li>\n<li><strong>来源<\/strong>：handbook 01 / 02；入管法改正（e-Gov 法令检索可查）。<\/li>\n<\/ul>\n<h3 id=\"43\"><a id=\"43-劳动法栈工时工资安全\" aria-hidden=\"true\"><\/a>4.3 劳动法栈（工时·工资·安全）<\/h3>\n<ul>\n<li><strong>労働基準法+働き方改革法<\/strong>：时间外劳动上限（月加班 100h 未满红线为基线口径）；加班费 / 解雇 / 工资规则详见 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>。<\/li>\n<li><strong>労働安全衛生法<\/strong>：安全管理者、健康诊断。<\/li>\n<li><strong>職業安定法 / 労働者派遣法<\/strong>：求职·雇佣介绍与派遣劳动框架（司机派遣岗位）。<\/li>\n<li><strong>解读<\/strong>：劳动合规细节（工时 / 工资）归 02 主责，本主题只写法规框架与维权路径。<\/li>\n<li><strong>来源<\/strong>：厚生労働省劳动基准 Q&amp;A <a href=\"https://www.mhlw.go.jp\">https://www.mhlw.go.jp<\/a>。<\/li>\n<\/ul>\n<h3 id=\"44\"><a id=\"44-运输与交通法栈\" aria-hidden=\"true\"><\/a>4.4 运输与交通法栈<\/h3>\n<ul>\n<li><strong>货送法<\/strong>：运输事业许可与运行体制（运行管理者、点呼、运输规则）。<\/li>\n<li><strong>道路交通法<\/strong>：驾照种类、运行规则；自动驾驶法规与许可制度归 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>。<\/li>\n<li><strong>自動車損害賠償保障法<\/strong>：自赔责强制保险。<\/li>\n<li><strong>解读<\/strong>：运输业务合规主责在各运输企业与驾驶员所属会社的运行管理体制。<\/li>\n<li><strong>来源<\/strong>：handbook 01 法律栈表。<\/li>\n<\/ul>\n<h3 id=\"45\"><a id=\"45-移民外国人材政策的三条主线\" aria-hidden=\"true\"><\/a>4.5 移民·外国人材政策的三条主线<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主线<\/th>\n<th style=\"width:33%\">现状<\/th>\n<th style=\"width:34%\">对个人的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>扩大受入<\/strong><\/td>\n<td>特定技能分野扩大（2024 年自动车运送业加入）、育成就劳 2027 年施行<\/td>\n<td>入场通道持续打开<\/td>\n<\/tr>\n<tr>\n<td><strong>管理强化<\/strong><\/td>\n<td>永住取消（2024 改正）、接受机关审查加严<\/td>\n<td>合规成本上升＝证据链重要<\/td>\n<\/tr>\n<tr>\n<td><strong>共生政策<\/strong><\/td>\n<td>多文化共生推进（地方自治体对应）<\/td>\n<td>生活支援、日语教室、行政多语种服务增加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"46\"><a id=\"46-政党光谱与自治体层面推断口径\" aria-hidden=\"true\"><\/a>4.6 政党光谱与自治体层面（推断口径）<\/h3>\n<blockquote>\n<p>立场列均为<strong>推断<\/strong>（基于既有核对与政党官网公开活动，验证日期 2026-11-12）；大选 / 党首更替后本表须整体重写。未验证官网的政党不写立场。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">政党<\/th>\n<th style=\"width:33%\">对外国人材政策的主张方向（推断）<\/th>\n<th style=\"width:34%\">本次验证信号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.jimin.jp\">自民党<\/a><\/td>\n<td>扩大+管理并行：育成就劳推动方、2024 永住取消改正主导<\/td>\n<td>党官网公开「外国人政策本部」出入国管理适正化·外国人受入相关 PT 合同会议日程（2026-11-12 当日）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.cdp-japan.jp\">立宪民主党<\/a><\/td>\n<td>技能实习制度批判、对永住取消改正持批判立场（监督力量）<\/td>\n<td>官网可访问；政策页口径未逐一验证<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://o-ishin.jp\">日本维新会<\/a><\/td>\n<td>总体倾向扩大受入<\/td>\n<td>官网可访问；政策纲领页未逐一验证<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://new-kokumin.jp\">国民民主党<\/a><\/td>\n<td>总体倾向扩大<\/td>\n<td>官网可访问；「政策 2026」页存在，口径未逐一验证<\/td>\n<\/tr>\n<tr>\n<td>公明党 / 共产 / れいわ等<\/td>\n<td><strong>待复核<\/strong>（官网本次未验证）<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>歧义并列<\/strong>：立宪 / 维新 / 国民民主政策页口径未逐一验证——存在「已验证立场」与「仅确认官网可访问 + 推断方向」两种状态，并列保留。<\/li>\n<li><strong>自治体层面<\/strong>：特定技能者最多的自治体（爱知、东京、埼玉、大阪、千叶、神奈川等）配套最成熟；多文化共生担当窗口、外国人咨询窗口（免费行政书士 / 弁护士咨询日）值得入乡先查（与 <a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a> 联动）。<\/li>\n<li><strong>来源<\/strong>：各政党官网（2026-11-12 验证）。<\/li>\n<\/ul>\n<h3 id=\"47-4\"><a id=\"47-外国人权利动向观察点4-个\" aria-hidden=\"true\"><\/a>4.7 外国人权利动向观察点（4 个）<\/h3>\n<ol>\n<li><strong>永住者地方参政权<\/strong>：相关法案历次提交 / 审议动向，法律现状截至本次核对未变，<strong>最新国会状态待复核<\/strong>；若未来通过将影响定居地选择权重（推断）。<\/li>\n<li><strong>行政手续多语言化<\/strong>：总务省「地域における多文化共生推進プラン」（令和 2 年 9 月改订）持续指导自治体施策 <a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html\">https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html<\/a>。<\/li>\n<li><strong>执政党外国人政策审议动向<\/strong>：自民党外国人政策本部（出入国管理适正化·外国人受入相关 PT）持续审议，与「管理强化」主线呼应（推断）。<\/li>\n<li><strong>灾害时外国人支援体制<\/strong>：总务省推进避难所等对外国人被灾者的信息传达支援（情報難民ゼロ项目·灾害时外国人支援信息协调员）。<\/li>\n<\/ol>\n<h2 id=\"s5\"><a id=\"五影响对象矩阵\" aria-hidden=\"true\"><\/a>五、影响对象矩阵<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">政策 / 条款<\/th>\n<th style=\"width:20%\">受影响主体<\/th>\n<th style=\"width:20%\">影响方向<\/th>\n<th style=\"width:20%\">量级 / 口径<\/th>\n<th style=\"width:20%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>资格外活动禁止（入管法）<\/td>\n<td>特定技能 1 号司机<\/td>\n<td>只能从事受入计划书记载业务<\/td>\n<td>违反可致资格取消<\/td>\n<td>入管法 / handbook 01<\/td>\n<\/tr>\n<tr>\n<td>连续 3 个月不从事原业务 → 取消<\/td>\n<td>全在留者<\/td>\n<td>资格取消风险<\/td>\n<td>无正当理由即适用<\/td>\n<td>入管法 / ISA<\/td>\n<\/tr>\n<tr>\n<td>月加班 100h 未满红线<\/td>\n<td>司机 / 运输企业<\/td>\n<td>工时合规约束<\/td>\n<td>时间外 + 休日合计<\/td>\n<td>労働基準法+働き方改革法<\/td>\n<\/tr>\n<tr>\n<td>住民税 / 社保滞纳 3 年 → 永住取消<\/td>\n<td>永住者<\/td>\n<td>永住资格取消风险<\/td>\n<td>2024 改正新增事由<\/td>\n<td>入管法改正 / ISA<\/td>\n<\/tr>\n<tr>\n<td>在留卡 14 天地址变更、离日 1 年再入国期限<\/td>\n<td>全在留者<\/td>\n<td>合规义务 / 连续性风险<\/td>\n<td>违反可致不利<\/td>\n<td>入管法 / ISA<\/td>\n<\/tr>\n<tr>\n<td>货送法（运行管理者·点呼·运输规则）<\/td>\n<td>运输企业 / 司机<\/td>\n<td>运行体制约束<\/td>\n<td>事业许可要件<\/td>\n<td>货送法<\/td>\n<\/tr>\n<tr>\n<td>永住取消（2024 改正）<\/td>\n<td>永住者<\/td>\n<td>长期资格风险<\/td>\n<td>连续 3 年未履行义务<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>扩大受入（育成就劳 2027 施行）<\/td>\n<td>求职者 / 受入机关<\/td>\n<td>通道打开<\/td>\n<td>2027-04-01 施行<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>多文化共生推进（自治体施策）<\/td>\n<td>在住外国人 / 自治体<\/td>\n<td>生活支援增加<\/td>\n<td>令和 2 年 9 月改订<\/td>\n<td>総務省<\/td>\n<\/tr>\n<tr>\n<td>维权渠道（劳动基准监督署 / 法テラス / Yorisoi）<\/td>\n<td>劳动者<\/td>\n<td>权利实现路径<\/td>\n<td>行政 / 法律援助 / 多语咨询并列<\/td>\n<td>厚労省 / 法テラス<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s6\"><a id=\"六合规应对建议建议章\" aria-hidden=\"true\"><\/a>六、合规应对建议（建议章）<\/h2>\n<blockquote>\n<p>本章为「建议」，与事实分离；重大合规决策须咨询执业法律专业人士（弁护士 / 行政书士）。<\/p>\n<\/blockquote>\n<h3 id=\"61\"><a id=\"61-劳动纠纷自助阶梯建议\" aria-hidden=\"true\"><\/a>6.1 劳动纠纷自助阶梯（建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">级别<\/th>\n<th style=\"width:33%\">手段<\/th>\n<th style=\"width:34%\">入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>与上司 / 人事书面沟通（邮件留痕）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>公司内相談窓口 / 劳组（有则用）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>劳动基准监督署<\/strong>（加班费 / 解雇 / 工伤）<\/td>\n<td><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/\">https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/<\/a><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>劳动综合咨询（総合労働相談コーナー，免费匿名）<\/td>\n<td>各都道府县劳政事务所<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>劳动审判 / 诉讼<\/td>\n<td>弁护士（法テラス介绍）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>工伤适用<strong>劳灾保险<\/strong>（通勤事故和业务事故都适用），不留证＝白受伤。<\/p>\n<\/blockquote>\n<h3 id=\"62\"><a id=\"62-在留问题咨询建议\" aria-hidden=\"true\"><\/a>6.2 在留问题咨询（建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">问题<\/th>\n<th style=\"width:50%\">去处<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留资格疑义<\/td>\n<td>地方出入国在留管理局（有外语对应日）<\/td>\n<\/tr>\n<tr>\n<td>一般生活 / 劳动多语咨询<\/td>\n<td>Yorisoi Hotline（多语 0120-279-338）<\/td>\n<\/tr>\n<tr>\n<td>特定技能支援问题<\/td>\n<td>登录支援机关 / ISA 特定技能咨询<\/td>\n<\/tr>\n<tr>\n<td>法律支援（低收入者）<\/td>\n<td>法テラス <a href=\"https://www.houterasu.or.jp\">https://www.houterasu.or.jp<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"63\"><a id=\"63-证据留存规则建议\" aria-hidden=\"true\"><\/a>6.3 证据留存规则（建议）<\/h3>\n<ul>\n<li>一切沟通争取书面化：LINE → 邮件确认、口头指示 → 复述 + 事后邮件；<\/li>\n<li>给与明细、契约、规则集<strong>纸质 + 云盘双备份<\/strong>；<\/li>\n<li>健康診断结果、工伤记录永久保存。<\/li>\n<\/ul>\n<h3 id=\"64\"><a id=\"64-紧急情况速查建议\" aria-hidden=\"true\"><\/a>6.4 紧急情况速查（建议）<\/h3>\n<ul>\n<li>警察 <strong>110<\/strong> / 救护·消防 <strong>119<\/strong>；<\/li>\n<li>事故后：警方 → 公司运行管理者 → 保险 →（必要时）领事馆；<\/li>\n<li>签证权益受威胁时：ISA + 行政书士（先咨询后付费）。<\/li>\n<\/ul>\n<h3 id=\"65\"><a id=\"65-政策环境跟踪建议\" aria-hidden=\"true\"><\/a>6.5 政策环境跟踪（建议）<\/h3>\n<p>每季度核对：入管法 / 政令改正新闻（ISA 首页）；永住指南·取消指南运用动向；育成就劳分野方针发布；自治体外国人施策（居住地变更时重查）。记录入 <a href=\"../../08-visa-immigration/handbook/09-policy-log.md\">08-visa-immigration · 09 政策更新日志<\/a>。<\/p>\n<h2 id=\"s7\"><a id=\"七生效时间线\" aria-hidden=\"true\"><\/a>七、生效时间线<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">政策 / 事件<\/th>\n<th style=\"width:25%\">关键节点<\/th>\n<th style=\"width:25%\">日期<\/th>\n<th style=\"width:25%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>改正入管法（永住取消新事由）<\/td>\n<td>永住者资格取消制度确立<\/td>\n<td>2024 年（令和 6 年）<\/td>\n<td>ISA / e-Gov<\/td>\n<\/tr>\n<tr>\n<td>总务省「地域における多文化共生推進プラン」改订<\/td>\n<td>持续指导自治体施策<\/td>\n<td>令和 2 年 9 月<\/td>\n<td>総務省<\/td>\n<\/tr>\n<tr>\n<td>主要政党官网验证<\/td>\n<td>政策环境信号核对<\/td>\n<td>2026-11-12<\/td>\n<td>各党官网<\/td>\n<\/tr>\n<tr>\n<td>育成就劳制度施行<\/td>\n<td>技能实习 → 育成就劳<\/td>\n<td>2027 年（2027-04-01）<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>入管法 / 相关法令改正跟踪<\/td>\n<td>待 e-Gov 公布<\/td>\n<td>待生效<\/td>\n<td>e-Gov<\/td>\n<\/tr>\n<tr>\n<td>永住者地方参政权法案<\/td>\n<td>历次提交 / 审议动向<\/td>\n<td>现状未变，最新国会状态待复核<\/td>\n<td>衆参两院法案检索<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待生效与待细则清单<\/strong>：入管法 / 相关法令最新改正内容（登记册 #1）；移民政策重大动向（登记册 #3）；维权渠道联系方式现行口径（登记册 #5）；永住者地方参政权最新国会审议状态。<\/p>\n<h2 id=\"s8\"><a id=\"八数据治理与局限\" aria-hidden=\"true\"><\/a>八、数据治理与局限<\/h2>\n<p><strong>来源分级<\/strong>：<\/p>\n<ul>\n<li><strong>A 官方一手<\/strong>：e-Gov 法令检索、出入国在留管理庁、厚生労働省（check-roudou.mhlw.go.jp）、総務省、各都道府県労働局。<\/li>\n<li><strong>B 权威转引 / 行业机构<\/strong>：主要政党官网（jimin.jp 等，政策环境信号，须实际打开验证后才可写立场）、JILPT 研究报告、弁護士会 / 行政书士会公开指引。<\/li>\n<li><strong>C 平台抽样<\/strong>：本主题登记册无此类指标；媒体来源（NHK、日本経済新聞、Nikkei Asia）仅用于发现线索，须回溯。<\/li>\n<\/ul>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>法规文本<\/td>\n<td>法令条文（e-Gov）≠ 政府解说页 ≠ 媒体转述<\/td>\n<\/tr>\n<tr>\n<td>政党立场<\/td>\n<td>官网公开活动（已验证）≠ 既有核对推断（未验证）<\/td>\n<\/tr>\n<tr>\n<td>维权渠道<\/td>\n<td>劳动基准监督署（行政）≠ 法テラス（法律援助）≠ Yorisoi Hotline（多语咨询）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待复核清单<\/strong>（逐项给出复核入口）：<\/p>\n<ol>\n<li><strong>登记册 #1 入管法最新改正<\/strong>——复核入口：e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>、ISA 首页。<\/li>\n<li><strong>登记册 #3 移民政策重大动向<\/strong>——复核入口：ISA 首页 / 官房公报、主要政党官网。<\/li>\n<li><strong>登记册 #5 维权渠道联系方式现行口径<\/strong>——复核入口：各都道府県労働局、厚生労働省 <a href=\"https://www.mhlw.go.jp\">https://www.mhlw.go.jp<\/a>。<\/li>\n<li><strong>未验证政党（公明党 / 共产 / れいわ等）<\/strong>——复核入口：各党官网（验证后按「先归类再补立场」处理）。<\/li>\n<li><strong>永住者地方参政权最新国会审议状态<\/strong>——复核入口：衆参两院法案检索 / e-Gov 立法案检索。<\/li>\n<li><strong>立宪 / 维新 / 国民民主政策页口径<\/strong>——复核入口：cdp-japan.jp / o-ishin.jp / new-kokumin.jp 政策页。<\/li>\n<\/ol>\n<p><strong>文本时效声明<\/strong>：本报告以 <strong>2026-11-14<\/strong> 时点官方页面为准；历史报告信息核对日期为 2026-11-11 / 11-12，政策环境可能变化。<\/p>\n<p><strong>解读局限<\/strong>：本主题只写法规框架与维权路径——签证实务归 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；劳动合规细节归 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；自动驾驶法规归 <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>；永住年收财务归 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；官方统计活值归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手（e-Gov / ISA / 厚生労働省 / 総務省 / 労働局）<\/strong>：<\/p>\n<ol>\n<li>e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>（2026 核对）<\/li>\n<li>出入国在留管理庁（ISA）— 入管法解说 <a href=\"https://www.moj.go.jp/isa\">https://www.moj.go.jp/isa<\/a>（2026 核对）<\/li>\n<li>厚生労働省 — 劳动基准 Q&amp;A <a href=\"https://www.mhlw.go.jp\">https://www.mhlw.go.jp<\/a>（2026 核对）<\/li>\n<li>厚生労働省 — 劳动基准监督署 <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/\">https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/<\/a>（2026 核对）<\/li>\n<li>厚生労働省 — 外国人劳动咨询 check-roudou.mhlw.go.jp（登记册 #2 来源）<\/li>\n<li>総務省 — 地域における多文化共生推進プラン <a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html\">https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html<\/a>（令和 2 年 9 月改订）<\/li>\n<li>各都道府県労働局（维权渠道现行口径，登记册 #5 待基线确立项）<\/li>\n<\/ol>\n<p><strong>政策环境信号（政党官网 / 专业机构）<\/strong>：<\/p>\n<ol>\n<li>自民党（jimin.jp）— 政策环境信号（2026-11-12 验证）<a href=\"https://www.jimin.jp\">https://www.jimin.jp<\/a><\/li>\n<li>立宪民主党（cdp-japan.jp）— 政策环境信号（2026-11-12 验证官网可访问）<a href=\"https://www.cdp-japan.jp\">https://www.cdp-japan.jp<\/a><\/li>\n<li>日本维新会（o-ishin.jp）— 政策环境信号（2026-11-12 验证官网可访问）<a href=\"https://o-ishin.jp\">https://o-ishin.jp<\/a><\/li>\n<li>国民民主党（new-kokumin.jp）— 政策环境信号（2026-11-12 验证官网可访问）<a href=\"https://new-kokumin.jp\">https://new-kokumin.jp<\/a><\/li>\n<li>JILPT 研究报告；弁護士会 / 行政书士会公开指引（政策环境信号源，未逐条引用 URL）<\/li>\n<\/ol>\n<p><strong>法律援助<\/strong>：<\/p>\n<ol>\n<li>日本司法支援センター（法テラス）<a href=\"https://www.houterasu.or.jp\">https://www.houterasu.or.jp<\/a>（2026 核对）<\/li>\n<\/ol>\n<p><strong>跨主题只读引用<\/strong>：<\/p>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 最新报告文首「已修正事实清单」（ITJ / GFP 等维权渠道结论的单一事实源）<\/li>\n<li><a href=\"../../08-visa-immigration/handbook/09-policy-log.md\">08-visa-immigration · 09 政策更新日志<\/a>（政策动向季度核对记录）<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 203, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "09-politics-law/reports/2026-11-politics-law.html"}}}, "education-qualification": {"name": "教育与资格", "dir": "10-education-qualification", "months": {"2026-11": {"title": "日本资格与教育投资 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本资格与教育投资--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本资格与教育投资 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向拟在日本从事货运司机工作、需要职业资格与教育投资规划的读者，兼具资格路径与教育预算顾问视角。\n<strong>来源规则<\/strong>：① 文部科学省（mext.go.jp）、厚生労働省（技能士制度）、国土交通省（運行管理者等法定资格）＞ ② 各资格认定中央机构（フォークリフト運転技能講習登録機関、消防検定協会等）＞ ③ 全日本トラック協会 / 都道府県支部（讲习日程）＞ ④ 教习机构官网（费用，仅预期指标需交叉验证）；每条数据必须附可直接访问的 URL，并记录「机构 · 统计周期 · 公表日期 · 核验状态」。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：物流 / 运输相关资格地图（法定必携资格、任用有利资格、远期资格、投入产出规则）；学习体系与教育投资（语言 / 资格 / 学历三账户、年度预算纪律、公共免费资源包）；日本学校教育体系与子女教育（6-3-3-4 学制、公立 / 私立 / 国际学校对比、外国人子女就学手续、日本语指导体制、教育成本与就学援助）；高等教育与技人国学历路径（高等教育体系定位、社会人入学 / 编入、通信制大学在职学历、「大学毕业 vs 10 年实务经验」对比）。<\/li>\n<li><strong>不含<\/strong>：驾照取得路径与费用（→ 01-ssw-driver，本主题主责登记册 #14）；在留资格要件（→ 08-visa-immigration）；岗位资格需求、职业实操、管理岗过渡（→ 02-career-driver / 03-career-management）；日语备考与考试日程 / 费用 / 考位（→ 11-language-japanese）；地域教育资源与自治体支援（→ 13-regional-info）；永住年收财务与证据链（→ 07-economy-finance）。<\/li>\n<\/ul>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>法定必携资格（運行管理者）与任用有利资格（フォークリフト）的取得路径与费用现状如何？<\/li>\n<li>语言 / 资格 / 学历三账户的年度预算纪律如何落实？<\/li>\n<li>外国人子女就学手续、日本語指導体制与教育成本结构现状如何？<\/li>\n<li>通信制大学在职学历与「大学毕业 vs 10 年实务经验」两条技人国路线的成本-时间-风险对比如何？<\/li>\n<li>技人国学历·职历审查口径的最新变化是什么？<\/li>\n<\/ol>\n<p><strong>初步结论<\/strong>：<\/p>\n<ol>\n<li><strong>子女教育侧的官方统计已相当完整<\/strong>（事实）：学龄相当外国人儿童数、不就学可能性、日本語指導必要児童生徒数、私立初年度納付金、就学援助认定数均有文科省调查与公表日期支撑，可作为基线。<\/li>\n<li><strong>资格地图侧活值尚未闭合<\/strong>（事实）：#1、#2、#3 三项资格日程 / 要件均待基线确立，资格取得路径目前只有手册费用区间，无法核对具体开设期次。<\/li>\n<li><strong>通信制大学学费带已可溯源<\/strong>（事实）：放送大学毕业总费用 76.8 万円～与私立通信制年 27–31 万円级均有官方 / 学校来源，可作为学历账户的投入估算。<\/li>\n<li><strong>技人国两条路线的成本-时间-风险对比成立<\/strong>（事实）：大学毕业路线直接成本 76.8 万–120 万円但风险最低；10 年实务经验路线直接成本 0 円但受 1 号 5 年上限约束，须 Y5 前转资格续积累。<\/li>\n<li><strong>审查口径变化已触发复核<\/strong>（事实）：令和 8-04-15 起语言类业务 CEFR B2 相当证明要求，JLPT N2 视同达标，直接影响 N2 目标的价值评估。<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>登记册 9 项追踪指标截至 2026-11-14 的活值状态（来源：<code>data/education_indicator_registry.md<\/code>）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">追踪项<\/th>\n<th style=\"width:25%\">登记册活值<\/th>\n<th style=\"width:25%\">本期变动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>フォークリフト技能講習日程费用<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>運行管理者等法定资格要件<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>危険物取扱者试验日程<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人资格取得记录<\/td>\n<td>待记录<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>学龄相当外国人儿童数·不就学数<\/td>\n<td>177,726 人 / 不就学可能性 9,153 人（令和 7 年 5 月 1 日时点，2026-05-25 公表）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>日本語指導必要児童生徒数（公立 / 含私立）<\/td>\n<td>公立 84,759 人 / 含国公私立 88,045 人（R7 调查，2026-05-25 公表）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>学校教育费用行情（私立初年度納付金 / 就学援助认定数）<\/td>\n<td>私立初年度納付金：小 90.97 万 / 中 83.50 万 / 高 78.05 万円（R6 调查，2024-12-24 公表）；就学援助：要保護约 8 万 + 準要保護约 109 万人（R6）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>通信制大学学费带<\/td>\n<td>放送大学毕业总费用 76.8 万円～（124 单位计）；私立通信制年 27–31 万円（2026）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>公立学校給食費保護者負担平均月額<\/td>\n<td>待复核（R7 调查起算出方法变更；手册暂用区间 4,000–5,000 円级）<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：唯一观察项、首要触发器、触发器结论均为「首期为空」；business-config 第七节九个触发器（资格制度 / 讲习义务变化、讲习日程与费用变化、目标岗位资格要求变化、个人取得资格、文科省就学 / 日本語指導政策变化、学校教育费用调查发布、大学制度改革 / 编入·社会人入学变化、技人国审查口径变化、通信制 / 社会人入试制度与学费带变化）本期均未命中，无可报变化。<\/p>\n<p><strong>结构变更备注<\/strong>（非数据变动）：2026-11-14 原合并版知识手册已按四大维度拆分至 <code>handbook/<\/code>（00–04 共 5 个文档），编号 01–04 与登记册指标、触发器映射保持一一对应；原合并版全文存档于 <code>reports/archives/2026-11-education-qualification-merged-v1.0.md<\/code>。本报告为该结构下的首期九节骨架版。<\/p>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版为复用生成：继承历史报告（v1.0 首份分析，数据基准 2026-11-13）的口径裁决与来源分级，<strong>无新增修正<\/strong>。历史报告未列独立「已修正事实清单」；2026-11-12 维度扩充时已闭环的两项复核结论（公立小学給食費月额取令和 7 年度 5,196 円、食材费相当；编入制度「资格要件由国家规定、选考方式由各校自设」）原样保留于第二、七节。<\/p>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<p>本节承载教育制度与政策环境（business-config 3.2：03 章 → 本节 / 第八节）。<\/p>\n<p><strong>学制框架（事实）<\/strong>：日本学制为 6-3-3-4（1947 年学校教育法确立），义务教育为小 6 + 中 3 共 9 年（<a href=\"https://www.mext.go.jp/en/policy/education/overview/index.htm\">文科省 · 学校教育制度<\/a>，2026）。一贯制补充：義務教育学校（小中 1–9 年一贯）、中等教育学校（中高 6 年一贯）、高等专门学校（中卒入学 5 年一贯）；高等学校段階含全日制、定時制、通信制三种课程，均授予高中毕业资格。学期制度 4 月始业·3 月修了；转入插班以住民票办理时点为准。<\/p>\n<p><strong>外国人子女就学政策（事实）<\/strong>：对外国人子女<strong>无就学义务<\/strong>，但希望就读公立义务教育诸学校者，依据国际人权规约等与日本人儿童同样<strong>无偿接收<\/strong>（<a href=\"https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm\">文科省 · 公立小·中就学案内<\/a>，2026）。手续链（在留卡 × 住民票）：2012 年住民基本台账法改正后，3 个月以上中长期在留者登记住民票；市町村基于住基信息向监护人发送就学案内；就学手续时的居住地确认使用<strong>在留卡或特别永住者证明书<\/strong>，无提示时也可用可信书类柔性处理（<a href=\"https://www.mext.go.jp/a_menu/shotou/clarinet/004/1323374.htm\">文科省 · 就学手续<\/a>，2026）。文科省就学促進指针（令和 8-08-28 改订）要求自治体确认居住实态、在住民登记窗口进行就学说明（<a href=\"https://www.mext.go.jp/a_menu/shotou/clarinet/004/1415154_00018.html\">文科省 · 就学促進指针<\/a>，2026）。<\/p>\n<p><strong>日本語指導体制现状（事实，R7 调查，2026-05-25 公表）<\/strong>：公立学校日本語指導必要児童生徒 <strong>84,759 人<\/strong>（较前次 +22.6%）；含国公私立 <strong>88,045 人<\/strong>，其中外国籍 73,313 人；1 人以上在籍学校 12,668 校（占全部公立学校 <strong>39.4%<\/strong>）；母语构成中国語 24.3%、ポルトガル語 16.3%。体制缺口：受「特别照顾指导」者 88.6%，<strong>仍有 11.4%（9,699 人）未受任何形式指导<\/strong>；义务教育段階入「特别的教育课程」者占受指导者 76.4%。支援人力：日本語指導補助者 8,706 人、母語支援員 7,301 人（全国），自治体间体制差异大（<a href=\"https://www.mext.go.jp/content/20260525-mxt_kyokoku-000007294_00.pdf\">文科省 · 日本語指導受入状況调查<\/a>）。<\/p>\n<p><strong>就学现状数据（事实，令和 7 年 5 月 1 日时点，2026-05-25 公表）<\/strong>：学龄相当外国人儿童住基登载数 177,726 人（调查以来最多），义务教育诸学校在籍 150,786 人（85.0%）；不就学 911 人 + 就学状况无法把握 8,013 人 + 住基人数差 229 人 = 不就学可能性合计 <strong>9,153 人<\/strong>（<a href=\"https://www.mext.go.jp/content/20260525-mxt_kyokoku-000049969_02.pdf\">文科省 · 外国人子女就学状况调查<\/a>）。升学现实（该群体）：高中生中途退学率 6.4%、高中进学率 91.5% 低于全体 98.9%。<\/p>\n<p><strong>政策落地动作（建议）<\/strong>：转入驻地时在市役所办住民票 → 教育委员会窗口确认指定校与入学手续；保留在留卡与住民票复印件作为就学手续材料；带同子女前向驻地教育委员会确认有无日本語指導教室 / 抽离指导、母语支援员配置、特别的教育课程实施校——<strong>不要假设「附近学校有日语老师」<\/strong>。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<p>本节承载资格人才的需求侧信号、资格溢价与本人教育投入产出（business-config 3.2 未指定锚，本节为独立成节）。<\/p>\n<p><strong>需求侧法定信号（事实）<\/strong>：运行管理者「每 15 台车 1 名、公司必置」（运行管理者试验中心，2026）；运行管理辅助者无法定资格、基础讲习修了即可——构成资格人才需求的分层结构（详第五节）。<\/p>\n<p><strong>资格溢价（手册 01，费用为约值、待核验）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">资格<\/th>\n<th style=\"width:25%\">时机<\/th>\n<th style=\"width:25%\">费用（约）<\/th>\n<th style=\"width:25%\">作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>フォークリフト运転技能讲习<\/td>\n<td>Y2–3<\/td>\n<td>3–10 万（3–5 日）<\/td>\n<td>仓储转岗通行证；+5 千–2 万 / 月津贴<\/td>\n<\/tr>\n<tr>\n<td>危険物取扱者（乙 4）<\/td>\n<td>Y3+<\/td>\n<td>自学 + 考试 6 千<\/td>\n<td>化学品运输 + 月津贴<\/td>\n<\/tr>\n<tr>\n<td>けん引自动车运転者<\/td>\n<td>干线需要时<\/td>\n<td>15–25 万<\/td>\n<td>牵引车资格<\/td>\n<\/tr>\n<tr>\n<td>JLPT N3→N2<\/td>\n<td>Y2 / Y4<\/td>\n<td>各约 7,500 円<\/td>\n<td>管理岗 + 2 号<\/td>\n<\/tr>\n<tr>\n<td>ロジスティクス検定（L 検）<\/td>\n<td>Y3+<\/td>\n<td>6–8 千<\/td>\n<td>物流知识体系化证明<\/td>\n<\/tr>\n<tr>\n<td>準中型 / 中型 / 大型免许<\/td>\n<td>按车种<\/td>\n<td>各 20 万级<\/td>\n<td>车种升级<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>教育统计的需求侧背景（事实，登记册 #5 / #6 / #7）<\/strong>：学龄相当外国人儿童 177,726 人、不就学可能性 9,153 人；日本語指導必要児童生徒公立 84,759 人 / 含国公私立 88,045 人；私立初年度納付金小 90.97 万 / 中 83.50 万 / 高 78.05 万円；就学援助要保護约 8 万 + 準要保護约 109 万人（R6）。这些数字是「子女教育账本」的规模背景，与本人三账户分开记（见第四节口径）。<\/p>\n<p><strong>口径并列（不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">并列口径<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>讲习费用<\/td>\n<td>受讲料 ≠ 教习料 ≠ 検定料<\/td>\n<td>逐项标注，不得合并<\/td>\n<\/tr>\n<tr>\n<td>学校教育费用<\/td>\n<td>公立（授业料·教科书无偿 + 给食费）≠ 私立（初年度納付金）≠ 国际学校（无官方统一统计）<\/td>\n<td>三类并列<\/td>\n<\/tr>\n<tr>\n<td>通信制学费<\/td>\n<td>放送大学（单位制总额）≠ 私立通信制（年额制）<\/td>\n<td>计费方式不同<\/td>\n<\/tr>\n<tr>\n<td>就学援助<\/td>\n<td>国家制度框架 ≠ 自治体认定基准<\/td>\n<td>各市町村自定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：登记册 #1（フォークリフト技能講習日程费用）、#2（運行管理者等法定资格要件）、#3（危険物取扱者试验日程）均<strong>待基线确立<\/strong>，资格取得路径目前只有手册费用区间，无法核对具体开设期次。<\/p>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<p>本节按「资格与教育的供给主体类型」细分（business-config 3.2 未指定锚，本节为独立成节）。<\/p>\n<p><strong>资格实施主体（登记册主体清单）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主体类型<\/th>\n<th style=\"width:33%\">代表<\/th>\n<th style=\"width:34%\">本主题用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>官方制度方<\/td>\n<td>文部科学省、厚生労働省（技能士制度）、国土交通省、各都道府県労働局<\/td>\n<td>法定资格要件与制度框架<\/td>\n<\/tr>\n<tr>\n<td>资格认定中央机构<\/td>\n<td>フォークリフト運転技能講習登録機関、消防検定協会等<\/td>\n<td>讲习 / 试验日程与费用（登记册 #1 / #3）<\/td>\n<\/tr>\n<tr>\n<td>行业协会<\/td>\n<td>全日本トラック協会 / 都道府県支部<\/td>\n<td>讲习日程（来源优先级 ③）<\/td>\n<\/tr>\n<tr>\n<td>教习机构<\/td>\n<td>各讲习实施机构官网<\/td>\n<td>费用行情（来源优先级 ④，预期指标、须多源交叉）<\/td>\n<\/tr>\n<tr>\n<td>教育制度方<\/td>\n<td>mext.go.jp、moj.go.jp/isa、manapass.mext.go.jp、jasso.go.jp<\/td>\n<td>学制、就学、高等教育制度<\/td>\n<\/tr>\n<tr>\n<td>办学主体<\/td>\n<td>各通信制大学官网、各自治体教育委员会<\/td>\n<td>学费带与就学援助认定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>入选标准（登记册边界档案）<\/strong>：官方发布页可回溯；费用行情须多源交叉验证；引用须为具体页面而非门户首页。<\/p>\n<p><strong>通信制大学学费带（登记册 #8，2026）<\/strong>：放送大学全科履修生入学料 24,000 円 + 授课料 1 单位 6,000 円，毕业（124 单位）总费用 <strong>768,000 円～<\/strong>；10 年在学修满 124 单位总费用不变；3 年次编入（62 单位认定）例仅 406,000 円（<a href=\"https://tobe.ouj.ac.jp/fee/\">放送大学 · 学费<\/a>）。私立通信制年 27–31 万円级：近畿大学通信教育部授课料 306,000 円 / 年（<a href=\"https://www.kindai.ac.jp/tsushin/course/regular/architecture/expense/\">近畿大学<\/a>）；东京通信大学初年度 271,000 円～（4 年总 834,000 円～）（<a href=\"https://www.internet.ac.jp/english/\">东京通信大学<\/a>）。口径并列：放送大学（单位制总额）≠ 私立通信制（年额制）。<\/p>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<p>本节承载资格地图（business-config 3.2：01 章 → 本节 / 第六节）。<\/p>\n<p><strong>必备资格（主线，手册 01，信息核对日期 2026-11-11）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">资格<\/th>\n<th style=\"width:25%\">时机<\/th>\n<th style=\"width:25%\">费用（约）<\/th>\n<th style=\"width:25%\">作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第一种驾驶执照（外免切替或国内考取）<\/td>\n<td>入场前<\/td>\n<td>切换 3–5 万 / 考取 25–35 万<\/td>\n<td>行业入场券<\/td>\n<\/tr>\n<tr>\n<td>特定技能评价试验（卡车）<\/td>\n<td>入场前<\/td>\n<td>约 2 万<\/td>\n<td>在留要件<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic / JLPT N4<\/td>\n<td>入场前<\/td>\n<td>约 1 万<\/td>\n<td>在留要件<\/td>\n<\/tr>\n<tr>\n<td><strong>运行管理基础讲习<\/strong><\/td>\n<td>Y1<\/td>\n<td>1–3 万<\/td>\n<td>运行管理辅助者→试验受验资格<\/td>\n<\/tr>\n<tr>\n<td><strong>运行管理者试验<\/strong><\/td>\n<td>Y2<\/td>\n<td>约 1.5 万<\/td>\n<td>第一个法定管理资格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>资格与费用信息以运行管理者试验中心、JITCO 公开信息为准 [Source: https://www.unkan.or.jp/, 2026] [Source: https://www.jitco.or.jp/, 2026]。<\/p>\n<\/blockquote>\n<p><strong>加分资格（按需）与远期资格<\/strong>：加分资格见第三节资格溢价表；远期资格（阶段 4–5）为安全管理者選任時研修（被选任时公司安排）、賃金管理検定 / 労務管理系（管理岗深度化）、MOS Excel / G AI 检定（DX 岗位补强）。<\/p>\n<p><strong>投入产出规则（手册 01）<\/strong>：<strong>一次只攻一个<\/strong>——主线资格未完成不开新线；公司能报销的先走公司（讲习类常有补助）；每张证书扫描归档 → 成果档案（<a href=\"../../03-career-management/handbook/05-achievement-archive.md\">03-career-management · 05<\/a>）。<\/p>\n<p><strong>日语能力线（主责 11-language-japanese，只读）<\/strong>：N4（2027）→ N3（Y2）→ N2（Y4），考试费 + 教材每级 1–2 万円；落地后加学职场日语与自治体免费日语教室（先利用免费资源）。→ <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">../11-language-japanese/reports/2026-11-language-japanese.md<\/a>。<\/p>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<p>本节承载资格分层与学历称号口径（business-config 3.2：01 章 → 本节；04 章学历称号）。<\/p>\n<p><strong>资格分层口径（不得混用）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">口径<\/th>\n<th style=\"width:50%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>法定必携资格 ≠ 任用有利资格<\/td>\n<td>運行管理者为法定必携；フォークリフト为任用有利<\/td>\n<\/tr>\n<tr>\n<td>「技能講習」≠「特別教育」<\/td>\n<td>两类制度分别标注<\/td>\n<\/tr>\n<tr>\n<td>学历称号：学士 ≠ 短期大学士 ≠ 専門士 / 高度専門士<\/td>\n<td>称号与修业年限对应关系不同<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>高等教育体系定位（手册 04）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">机构<\/th>\n<th style=\"width:25%\">修业年限<\/th>\n<th style=\"width:25%\">学位 / 称号<\/th>\n<th style=\"width:25%\">对技人国路径的意义<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.mext.go.jp/en/policy/education/overview/index.htm\">大学<\/a><\/td>\n<td>4 年<\/td>\n<td>学士<\/td>\n<td>技人国「大学毕业」要件的标准学历<\/td>\n<\/tr>\n<tr>\n<td>大学院<\/td>\n<td>修士 2 年 + 博士 3 年<\/td>\n<td>修士 / 博士<\/td>\n<td>高度人材积分学历加分更高<\/td>\n<\/tr>\n<tr>\n<td>短期大学<\/td>\n<td>2–3 年<\/td>\n<td>短期大学士<\/td>\n<td>学分可计入大学学士（编入衔接）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mext.go.jp/a_menu/koutou/kousen/\">高等专门学校<\/a><\/td>\n<td>中卒入学 5 年一贯<\/td>\n<td>准学士<\/td>\n<td>实践型技术者养成，可编入大学<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://shirusen.mext.go.jp/senmon/\">专门学校（专修学校专门课程）<\/a><\/td>\n<td>2 年以上<\/td>\n<td>専門士（修业 2 年以上且达标者）<\/td>\n<td>修业 3 年以上等指定校修了者可获大学出愿资格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>技人国审查口径（事实，<a href=\"https://www.moj.go.jp/isa/applications/status/gijinkoku.html\">法务省 ISA<\/a>，令和 8-07-13 更新页）<\/strong>：申请材料要求「大学等卒业证明书」<strong>或<\/strong>「在职证明书等证明从事相关业务期间的书类（含大学·高专·高中·专修学校专门课程在校专攻相关科目期间）」；令和 8-04-15 起语言类业务（翻译 / 口译 / 接客等）需提交 <strong>CEFR B2 相当证明<\/strong>，<strong>JLPT N2 以上视同达标<\/strong>，日本国内大学毕业等情形可豁免。在留要件细节 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">../08-visa-immigration/reports/2026-11-visa-immigration.md<\/a>，本节不重写。<\/p>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本节为建议 / 推断层，与事实数据分离（business-config 3.2：02 章、04 章 → 本节）。<\/p>\n<\/blockquote>\n<p><strong>三账户与预算纪律（手册 02）<\/strong>：教育投资分语言 / 资格 / 学历三个账户；总预算纪律为<strong>每年教育支出 ≤ 月收入 1 倍<\/strong>。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">账户<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">金额（约）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>语言<\/td>\n<td>N4（2027）→ N3（Y2）→ N2（Y4）<\/td>\n<td>考试费 + 教材每级 1–2 万円<\/td>\n<\/tr>\n<tr>\n<td>资格<\/td>\n<td>Y1 运行管理基础讲习 1–3 万；Y2 运行管理者试验 + フォークリフト 5–12 万；Y3 危険物乙 4 1 万；Y4 L 検 + 补强证书 2–3 万<\/td>\n<td>年度分档<\/td>\n<\/tr>\n<tr>\n<td>学历（可选，非必需）<\/td>\n<td>放送大学（教养学部）年 30–40 万，远程 + N3 可读；専門学校（情报 / 物流）白天工作晚间制；通信制大学（经营 / 经济）学位 = 技术·人文·国际业务申请材料之一<\/td>\n<td>长期布局<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>判断原则（手册 02）<\/strong>：学历只在「在留资格变更」或「转职硬门槛」出现时才买——先让资格和实绩说话。<\/p>\n<p><strong>学习资源公共包（免费优先）<\/strong>：自治体日语教室（免费或数百円 / 次）；Hello Work 职业讲习（雇用保险加入者可领教育训练给付金，支给要件以 20% 以上费用 / 离职后使用等条件为准，申请前确认）；JF 教材いろどり / まるごと（免费）；図书馆（个人登录免费，物流 / Excel / 日语 N1–N2 教材齐全）。<\/p>\n<p><strong>核心对比：大学毕业 vs 10 年实务经验（技人国路线，手册 04）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">维度<\/th>\n<th style=\"width:33%\">① 大学毕业路线（含在职补学历）<\/th>\n<th style=\"width:34%\">② 10 年实务经验路线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>硬门槛<\/td>\n<td>学士学位（专业与业务相关）<\/td>\n<td>10 年相关实务经验（在校专攻期间可合并计算）<\/td>\n<\/tr>\n<tr>\n<td>时间<\/td>\n<td>通信制 2–4 年（可并行工作；编入可缩至 2 年）<\/td>\n<td>自入境起约 10 年；<strong>但特定技能 1 号上限 5 年<\/strong>，须 Y5 前转其他就劳资格续积累<\/td>\n<\/tr>\n<tr>\n<td>直接成本<\/td>\n<td>76.8 万–120 万円（通信制 4 年全额）<\/td>\n<td>0 円（材料工本费级）<\/td>\n<\/tr>\n<tr>\n<td>机会成本<\/td>\n<td>晚间 / 周末学习时间；N3 以上日语读授业能力（<strong>推断<\/strong>）<\/td>\n<td>无学习成本，但需 10 年持续相关岗位<\/td>\n<\/tr>\n<tr>\n<td>审查风险<\/td>\n<td>学历证明明确、专业相关性靠毕业证·成绩单；风险最低<\/td>\n<td>依赖职历证据链（在职证明 / 职务内容说明 / 勤务记录）；岗位不被认定即不成立<\/td>\n<\/tr>\n<tr>\n<td>高度人材积分<\/td>\n<td>学历 10 分（大学），后续可达 70 分路径<\/td>\n<td>学历 0 分 = 硬伤，70 分基本不可达<\/td>\n<\/tr>\n<tr>\n<td>适配<\/td>\n<td>无学位者最稳兜底；Y1 启动才赶得上 Y5 切换<\/td>\n<td>学历为零但职历可证据化的长期布局<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>决策规则（手册 04）<\/strong>：学历只在「在留资格变更」或「转职硬门槛」出现时才买；本人个案学历要件已满足（visa 05 5.5 收敛：路径 A 成立、补学历不启用），本章对比表供未来分叉时决策输入。行动要点：若启用补学历兜底，Y1 报名（编入优先，省 2 年时间与约 40 万円），专业选经营 / 物流 / 情报类保「相关性」；每年归档职历证据链（在职证明、职务说明、勤务记录）——无论走哪条路线都是审查刚需。<\/p>\n<p><strong>常见误区（手册 04）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">误区<\/th>\n<th style=\"width:50%\">实际<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>「有学位就一定能转技人国」<\/td>\n<td>岗位须为白领业务，纯驾驶不符合<\/td>\n<\/tr>\n<tr>\n<td>「专门学校任何专业都算学历」<\/td>\n<td>专业相关性与専門士 / 高度専門士称号须同时满足，认定以入管为准<\/td>\n<\/tr>\n<tr>\n<td>「10 年经验可替代学历所以不急」<\/td>\n<td>10 年从相关工作起算，且 1 号 5 年上限不等人；须 Y5 前转资格续积累<\/td>\n<\/tr>\n<tr>\n<td>「在线学位一定被认可」<\/td>\n<td>学位认证与专业相关性由入管个别审查<\/td>\n<\/tr>\n<tr>\n<td>「先随便读一个学历转岗再说」<\/td>\n<td>专业不对口等于白读，且挤占 Y4 前时间窗口<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>子女来日时点选择（手册 03，推断，个案判断）<\/strong>：小学入学前（6 岁前）日语接近母语习得、同伴关系从零建立，但家长日语与手续能力要求最高；小学低学年适应期短、日语指导资源易获得，需学校有抽离指导体制；中学以后母语学业基础稳，但高中入试日语门槛显著；高中阶段学分换算与入试难度最大，一般不推荐。本节与 02 章区分：02 是<strong>本人<\/strong>三账户，本章是<strong>子女<\/strong>教育支出，两本账分开记。<\/p>\n<p><strong>监测触发<\/strong>：大学制度改革 / 编入要项变化、技人国审查口径变化、通信制 / 社会人入试制度与学费带变化 → 更新本章（business-config 第七节触发器）。<\/p>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：<\/p>\n<ul>\n<li><strong>A 官方一手<\/strong>：文科省调查（就学状況、受入状況、私立納付金、就学援助、学校給食）、国土交通省 / 运行管理者试验中心 / JITCO 资格信息、法务省 ISA 页面、各校官网学费。<\/li>\n<li><strong>B 权威转引<\/strong>：JASSO（编入试验选考细节复核入口）。<\/li>\n<li><strong>C 平台抽样 / 估算<\/strong>：手册资格费用「约」值、国际学校学费带（推断）、本人三账户预算模板（空白）。<\/li>\n<\/ul>\n<p><strong>已知口径冲突（并列呈现，不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>讲习费用<\/td>\n<td>受讲料 ≠ 教习料 ≠ 検定料（逐项标注）<\/td>\n<\/tr>\n<tr>\n<td>学校教育费用<\/td>\n<td>公立（授业料·教科书无偿 + 给食费）≠ 私立（初年度納付金）≠ 国际学校（无官方统一统计）<\/td>\n<\/tr>\n<tr>\n<td>通信制学费<\/td>\n<td>放送大学（单位制总额）≠ 私立通信制（年额制）<\/td>\n<\/tr>\n<tr>\n<td>就学援助<\/td>\n<td>国家制度框架 ≠ 自治体认定基准（各市町村自定）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：#1、#2、#3（待基线确立）、#4（待记录）、#9（待复核）。<\/p>\n<p><strong>风险与不确定性<\/strong>：国际学校学费带为推断值，无官方统一统计，个案差异大；手册资格费用为「约」值，且未逐项标注核验状态，实际以登录机关 / 教习机构当期公示为准；编入试验选考细节国家无统一规则，逐校不同；登记册 #9 公立学校給食費因 R7 调查起算出方法变更待复核（手册暂用区间 4,000–5,000 円级）。<\/p>\n<h3 id=\"_11\"><a id=\"待复核清单\" aria-hidden=\"true\"><\/a>待复核清单<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>フォークリフト技能講習开设期次与日程费用首个基线值<\/td>\n<td>登録機関 / 都道府県労働局（登记册 #1）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>運行管理者等法定资格要件（受验资格、试验日程）最新口径<\/td>\n<td>mlit.go.jp / 全ト协 / 运行管理者试验中心（登记册 #2）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>危険物取扱者试验日程<\/td>\n<td>消防検定協会（登记册 #3）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>令和 8·9 年 8 月給食費调查口径变更后，公立学校給食費月額准确区间<\/td>\n<td>mext.go.jp 学校給食実施状況等調査（登记册 #9；手册暂用区间 4,000–5,000 円级）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>国际学校学费带（无官方统一统计，推断值）<\/td>\n<td>各校募集要项 / 要办性质按各種学校逐校确认<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>大学编入试验选考细节（国家无统一规则，各校自设）<\/td>\n<td>目标校「編入学募集要項」+ <a href=\"https://www.jasso.go.jp/\">JASSO<\/a><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>技人国学历·职历审查口径后续是否还有调整<\/td>\n<td>法务省 ISA https://www.moj.go.jp/isa/applications/status/gijinkoku.html （联动 08-visa-immigration）<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>个人资格取得记录与本人三账户实际支出建立<\/td>\n<td>手册 02 预算模板（自记录，登记册 #4）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://www.mext.go.jp/en/policy/education/overview/index.htm\">文部科学省 · 学校教育制度<\/a> — 6-3-3-4 学制，2026。<\/li>\n<li><a href=\"https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm\">文部科学省 · 公立小·中就学案内<\/a> — 外国人子女无偿接收，2026。<\/li>\n<li><a href=\"https://www.mext.go.jp/a_menu/koutou/shinkou/1412179_00006.htm\">文部科学省 · 私立学校初年度納付金调查<\/a> — 小 90.97 万 / 中 83.50 万 / 高 78.05 万円（R6），2026。<\/li>\n<li><a href=\"https://www.mext.go.jp/content/20260525-mxt_kyokoku-000049969_02.pdf\">文部科学省 · 外国人子女就学状况调查<\/a> — 177,726 人 / 不就学可能性 9,153 人，2026-05-25 公表。<\/li>\n<li><a href=\
