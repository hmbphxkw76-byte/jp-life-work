\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>核心判断<\/strong>（每条含数据、口径与来源；推断 / 自算处已标注）：<\/p>\n<ol>\n<li><strong>考试路径已明确<\/strong>：中国大陆无 JFT-Basic 考点（截至 2026-08 核实；JFT-Basic 开考国为菲律宾、越南、泰国、印尼、尼泊尔、蒙古等，不含中国大陆），也没有技能评价试验考点。在中国大陆备考，主攻 JLPT N4 是当前唯一可完成的达标路径。（事实，来源：01-ssw-driver 登记册 #3 锚定口径 / JFT-Basic 官方信息）<\/li>\n<li><strong>M1 目标场次为 2027-07 JLPT N4<\/strong>：从现在（2026-11）起约 8 个月备考期，与手册 32–34 周计划一致；报名窗口约在 2027 年 3 月中下旬。（事实 + 推断：报名开放日期为推断值，以 JLPT 官网公告为准）<\/li>\n<li><strong>学习量估算自洽<\/strong>：N4 累计 300–450h 与「工作日 1.5–2h + 周末 3h ≈ 12–16h/周 × 8 个月 ≈ 450h」的推算吻合，计划节奏可行。（事实 + 自算，来源：手册 01 学习量估算）<\/li>\n<li><strong>个人维度尚无法评估<\/strong>：当前学习进度与主用教材版本均待基线确立，里程碑看板（M0 / M1 / M1.5 / M2 / M3）全部未开始。（事实）<\/li>\n<li><strong>偏科风险集中于听解<\/strong>：JLPT 有分项底线，N4 听力底线 19/60，N3 / N2 各分项底线 19，偏科会直接挂科；每周必须固定听力时间。（事实，来源：手册 01 各级概要）<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>覆盖登记册全部 4 项追踪指标（活值以 <a href=\"../data/language_indicator_registry.md\">data/language_indicator_registry.md<\/a> 为准）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值（来源 / 年份）<\/th>\n<th style=\"width:20%\">基准版本<\/th>\n<th style=\"width:20%\">变更说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>JLPT 下一次考试报名窗口<\/td>\n<td>2026-12-06 考试（报名 9/1–9/8 已截止）；下一窗口为 2027 年上半年（推断）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新；「2027 年上半年」为推断值，须以 JLPT 官网正式公告为准<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>JFT-Basic 考场次与考位<\/td>\n<td>日本国内 10,000 円；中国大陆无考点<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>当前学习进度（N4/N3/N2）<\/td>\n<td>待基线确立<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新；须建立周记录表后回写<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>主用教材版本<\/td>\n<td>待基线确立<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新；教材选型定后回写<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>1–2 项为外部主责项（日程 / 费用 / 考位锚定 01-ssw-driver 登记册 #3），本主题只读引用，不独立改值或回写。<\/p>\n<\/blockquote>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告已修正事实清单，无新增修正。历史报告未设独立「已修正事实清单」，其口径裁决（见第八节）继续有效。<\/p>\n<h3 id=\"_4\"><a id=\"调研说明\" aria-hidden=\"true\"><\/a>调研说明<\/h3>\n<ul>\n<li><strong>来源语言规则<\/strong>：考试制度类须日 / 英官方原文；学习方法类不限（经验标注为经验）。<\/li>\n<li><strong>时效窗口<\/strong>：考试制度类近 12 个月内优先；个人进度标注记录日期。<\/li>\n<li><strong>标注约定<\/strong>：推断标「推断」，自算标「自算」，预测标「预测值（F）」；事实与推断分离。<\/li>\n<li><strong>跨主题分工<\/strong>：考试日程 / 费用 / 考位 → <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读锚）；在留制度侧的考试要求 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；现场日语 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；管理岗日语 → <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>；资格 / 学历路径 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>。<\/li>\n<\/ul>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<h3 id=\"21-jlpt-jft-basic\"><a id=\"21-考试制度框架jlpt-与-jft-basic-两条体系\" aria-hidden=\"true\"><\/a>2.1 考试制度框架：JLPT 与 JFT-Basic 两条体系<\/h3>\n<p>两考试体系、评分与考点不同，不得混用（并列口径，不合并）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">考试<\/th>\n<th style=\"width:20%\">主办 / 运营<\/th>\n<th style=\"width:20%\">评分<\/th>\n<th style=\"width:20%\">特定技能达标口径<\/th>\n<th style=\"width:20%\">考点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JLPT（日本语能力测试）<\/td>\n<td>国际交流基金 / 日本国际教育支援协会（jees.or.jp/jlpt）<\/td>\n<td>N5–N1 五级制，满分 180（N4/N3/N2）<\/td>\n<td>1 号卡车路径 N4；出租车 / 巴士 N3；管理岗 / 2 号 N2<\/td>\n<td>中国大陆有考点（教育部教育考试院组织）<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic（国际交流基金日语考试）<\/td>\n<td>国际交流基金 / Prometric CBT<\/td>\n<td>10–250 分；145–174 = A1，175–199 = A2.1，200–250 = A2<\/td>\n<td>200–250 = A2 为特定技能达标线，与 JLPT N4 同等有效<\/td>\n<td>中国大陆无考点；日本国内可考<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>口径依据<\/strong>：JFT-Basic 评分带与达标线、JLPT 各级满分 / 合格线 / 分项底线均取自手册 01（信息核对日期 2026-11-11），制度类数字锚定 01-ssw-driver 登记册 #3。<\/p>\n<h3 id=\"22\"><a id=\"22-达标线按职业路径分别标注\" aria-hidden=\"true\"><\/a>2.2 达标线：按职业路径分别标注<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">日语门槛<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特定技能 1 号卡车<\/td>\n<td>JLPT N4 或 JFT-Basic A2（二选一）<\/td>\n<td>本主题受众主路径<\/td>\n<\/tr>\n<tr>\n<td>出租车 / 巴士路径<\/td>\n<td>JLPT N3<\/td>\n<td>转岗硬门槛<\/td>\n<\/tr>\n<tr>\n<td>管理岗 / 特定技能 2 号<\/td>\n<td>JLPT N2<\/td>\n<td>阶段 3 目标<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>口径并列不合并<\/strong>：达标线按路径分别标注，不用单一「日语要求」概括；「在留制度侧哪些级够用」归 08-visa-immigration。<\/p>\n<h3 id=\"23-2026-08\"><a id=\"23-考点可及性截至-2026-08-核实\" aria-hidden=\"true\"><\/a>2.3 考点可及性（截至 2026-08 核实）<\/h3>\n<ul>\n<li>中国大陆：有 JLPT 考点，无 JFT-Basic 考点，也无技能评价试验考点。<\/li>\n<li>日本国内：JLPT 与 JFT-Basic 均可考；JFT-Basic 为 Prometric CBT，随约随考，60 分钟，出分快。<\/li>\n<li>东南亚 / 港澳：可顺路考 JFT-Basic，但不必为它专门出境。<\/li>\n<\/ul>\n<h3 id=\"24\"><a id=\"24-政策与趋势观察触发器\" aria-hidden=\"true\"><\/a>2.4 政策与趋势观察（触发器）<\/h3>\n<ul>\n<li>JLPT / JFT-Basic 报名日程或费用变更（与 08-visa-immigration 触发器联动）→ 本主题 01 / 05 模块。<\/li>\n<li>JFT-Basic 考场在中国大陆开设 / 调整 → 01 / 05。<\/li>\n<li>新版教材 / 题库发布 → 05。<\/li>\n<li>个人进度里程碑（模考 / 实考完成）→ 06。<\/li>\n<\/ul>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<strong>趋势判断（推断）<\/strong>：2027 年 7 月 JLPT N4 报名窗口大概率在 2027 年 3 月中下旬开放（推断，以官网公告为准）；JFT-Basic 在中国大陆的考点状态本期无变化证据，维持「无考点」口径。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-口径声明\" aria-hidden=\"true\"><\/a>3.1 口径声明<\/h3>\n<p>本主题不维护「人才供需」与「薪酬」类数据：招聘市场供需、岗位薪酬基准归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 与 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；本节按本主题范围呈现「日语门槛 × 职业路径」「学习投入量与成本」两类可核验口径，不编造供需与薪酬数字。<\/p>\n<h3 id=\"32\"><a id=\"32-目标矩阵与路线图对齐\" aria-hidden=\"true\"><\/a>3.2 目标矩阵（与路线图对齐）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">里程碑<\/th>\n<th style=\"width:25%\">证书<\/th>\n<th style=\"width:25%\">用途<\/th>\n<th style=\"width:25%\">目标时间<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M1<\/td>\n<td>JLPT N4 或 JFT-Basic（A2）<\/td>\n<td>特定技能 1 号卡车路径硬性门槛<\/td>\n<td>2027 年 7 月 JLPT<\/td>\n<\/tr>\n<tr>\n<td>M2<\/td>\n<td>JLPT N3<\/td>\n<td>出租车 / 巴士路径门槛；入境后职场沟通<\/td>\n<td>2027 年 12 月（激进）/ 2028 年 7 月（稳妥）<\/td>\n<\/tr>\n<tr>\n<td>M3<\/td>\n<td>JLPT N2<\/td>\n<td>管理岗（阶段 3）、特定技能 2 号、会议 / 报告 / 邮件<\/td>\n<td>2028 年 12 月～2029 年 7 月<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"33\"><a id=\"33-学习投入量与预算自算--经验值待核验\" aria-hidden=\"true\"><\/a>3.3 学习投入量与预算（自算 / 经验值，待核验）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">目标<\/th>\n<th style=\"width:33%\">累计学习小时<\/th>\n<th style=\"width:34%\">本计划节奏<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>N4<\/td>\n<td>300–450h<\/td>\n<td>工作日 1.5–2h + 周末 3h ≈ 12–16h/周 × 8 个月 ≈ 450h<\/td>\n<\/tr>\n<tr>\n<td>N3（在 N4 基础上）<\/td>\n<td>+150–250h<\/td>\n<td>4–6 个月<\/td>\n<\/tr>\n<tr>\n<td>N2（在 N3 基础上）<\/td>\n<td>+250–350h<\/td>\n<td>6–9 个月（入职后需挤出时间）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>预算参考：每级 300–600 元人民币（手册 05 采购建议，经验值）。<\/li>\n<li>以上为一般化经验值，个体差异（中文母语者汉字红利）可能改变实际所需时长。<\/li>\n<\/ul>\n<h3 id=\"34\"><a id=\"34-多口径并列不合并不取均值\" aria-hidden=\"true\"><\/a>3.4 多口径并列（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试体系<\/td>\n<td>JLPT（N 级制）≠ JFT-Basic（A 级制）<\/td>\n<\/tr>\n<tr>\n<td>达标线<\/td>\n<td>特定技能 1 号卡车路径（N4 / JFT-Basic A2）≠ 出租车 / 巴士路径（N3）≠ 管理岗 / 2 号（N2）<\/td>\n<\/tr>\n<tr>\n<td>考点<\/td>\n<td>中国大陆（JLPT 有考点、无 JFT-Basic 考点）≠ 日本国内（两者均有）<\/td>\n<\/tr>\n<tr>\n<td>学习方法<\/td>\n<td>官方公式資料 ≠ 市售模考 ≠ 社区经验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<h3 id=\"41\"><a id=\"41-边界声明\" aria-hidden=\"true\"><\/a>4.1 边界声明<\/h3>\n<p>本主题不含雇主（企业）细分：货运司机雇主生态、企业类型与招聘渠道归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 与 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>。本节仅对本主题涉及的主体类型做细分，避免与雇主调研混用。<\/p>\n<h3 id=\"42\"><a id=\"42-主体类型细分本主题范围\" aria-hidden=\"true\"><\/a>4.2 主体类型细分（本主题范围）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">主体类型<\/th>\n<th style=\"width:25%\">代表<\/th>\n<th style=\"width:25%\">角色<\/th>\n<th style=\"width:25%\">入选标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试主办方 / 官方<\/td>\n<td>JLPT 官方（jees.or.jp/jlpt、jlpt.jp、jlpt.neea.edu.cn）、JFT-Basic（prometric-jp.com、jft-basic.jp）<\/td>\n<td>考试日程、费用、考位、评分与达标线口径的权威来源<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>官方教学资源<\/td>\n<td>国際交流基金（いろどり、JF 日本语教育标准）<\/td>\n<td>免费教材与能力标准<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>出版社 / 教材方<\/td>\n<td>大家的日语 / 新标日 / TRY! / 新完全掌握等<\/td>\n<td>主线教材与应试书版本信息<\/td>\n<td>出版社 / 教材官网可回溯<\/td>\n<\/tr>\n<tr>\n<td>学习社区<\/td>\n<td>门户与博客经验<\/td>\n<td>学习方法参考<\/td>\n<td>标注为经验，不作事实引用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>未取得项：#4 主用教材版本待基线确立；确定后按「教材选型定后不换」回写登记册。<\/p>\n<\/blockquote>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<blockquote>\n<p>本节承载手册 02–04（N4 / N3 / N2 分阶段备考计划）的核心内容，对应「岗位技能要求」中的语言技能分段要求。<\/p>\n<\/blockquote>\n<h3 id=\"51\"><a id=\"51-各级别考试概要\" aria-hidden=\"true\"><\/a>5.1 各级别考试概要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">级别<\/th>\n<th style=\"width:25%\">构成与时长<\/th>\n<th style=\"width:25%\">满分 / 合格<\/th>\n<th style=\"width:25%\">分项底线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>N4<\/td>\n<td>文字语汇 25min + 文法读解 55min + 听解 35min<\/td>\n<td>180 / 90<\/td>\n<td>言语知识 38、听解 19<\/td>\n<\/tr>\n<tr>\n<td>N3<\/td>\n<td>文字语汇 30min + 文法读解 70min + 听解 40min<\/td>\n<td>180 / 95<\/td>\n<td>19 / 19 / 19<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>言语知识读解 105min + 听解 50min<\/td>\n<td>180 / 90<\/td>\n<td>19 / 19 / 19<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>教训<\/strong>：JLPT 有分项底线，偏科（尤其听解）会挂科——每周必须固定听力时间。<\/p>\n<h3 id=\"52-n4-m1\"><a id=\"52-n4-备考计划m1\" aria-hidden=\"true\"><\/a>5.2 N4 备考计划（M1）<\/h3>\n<ul>\n<li>起点：零基础（2026-11）；终点：2027-07 JLPT N4 合格；周期约 32–34 周。<\/li>\n<li>考察量：约 300 汉字、1,500 词汇、基本句型（て形 / た形 / 普通形 / 可能 / 被动使役等）。<\/li>\n<li>四阶段（约 33 周）：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">阶段<\/th>\n<th style=\"width:25%\">周次<\/th>\n<th style=\"width:25%\">内容<\/th>\n<th style=\"width:25%\">时长<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A 入门<\/td>\n<td>第 1–6 周<\/td>\n<td>五十音听写；《大家的日语》初级Ⅰ（1–10 课）或《新标日》初级上（1–12 课）；汉字每天 5 个；影子跟读<\/td>\n<td>~60h<\/td>\n<\/tr>\n<tr>\n<td>B N4 语法主体<\/td>\n<td>第 7–18 周<\/td>\n<td>大家的日语初级Ⅱ（至 50 课）或新标日初级下；TRY! N4 或《新完全掌握》N4 语法；动词变形专项；第 12 周全真模考<\/td>\n<td>~160h<\/td>\n<\/tr>\n<tr>\n<td>C 应试强化<\/td>\n<td>第 19–28 周<\/td>\n<td>JLPT 官方问题集 + 近年 N4 真题 3–5 套；错题四类归因；读解限时；第 28 周模考 ≥ 110<\/td>\n<td>~130h<\/td>\n<\/tr>\n<tr>\n<td>D 冲刺<\/td>\n<td>第 29–33 周<\/td>\n<td>每周 2 套限时模考 + 错题复盘；高频二刷；考前 1 周不做新题<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>每周节奏：周一–五 1.5–2h / 天；周六 语法专项 + 读解 3h；周日 复习 + 听力 + 总结 3h。<\/li>\n<li>自测线：第 12 周 ≥ 70 分；第 20 周 ≥ 90 分；第 28 周 ≥ 110 分；连续两次模考 ≥ 100 分判稳；若听力单项 &lt; 32/60 → 立即加听力权重。<\/li>\n<li>JFT-Basic 备用方案：若 2027-07 N4 失利，可在赴日后再考 JFT-Basic 兜底（随约随考），用《いろどり》与官方样题练习；两条线教材高度重叠，备考 N4 本身就是 JFT-Basic 的 80% 准备。<\/li>\n<\/ul>\n<h3 id=\"53-n3-m2\"><a id=\"53-n3-备考计划m2\" aria-hidden=\"true\"><\/a>5.3 N3 备考计划（M2）<\/h3>\n<ul>\n<li>前提：M1 已达成；N3 合格线 95/180，分项底线 19×3。<\/li>\n<li>时间方案：激进 2027-12-05（N4 后 5 个月，适合尚未入境、全职备考）；稳妥（推荐）2028-07 第一个周日（N4 后 12 个月，已入境工作、日均只能挤 1h）。入境前后生活巨变，推荐稳妥方案。<\/li>\n<li>内容：词汇 1,500 → 累计 3,750 词；汉字累计约 650 字；授受表现、敬语体系、条件形、传闻样态。<\/li>\n<li>五阶段（稳妥 48 周）：衔接期 1–8 周；主体期 9–24 周；读解期 25–34 周；听解期 35–42 周；冲刺期 43–48 周（官方问题集 3 套限时模考，目标 ≥ 115 分）。<\/li>\n<li>自测线：第 16 周 ≥ 80；第 32 周 ≥ 100；第 44 周 ≥ 115。<\/li>\n<li>失败预案：稳妥方案 7 月未过 → 12 月再战（同一计划后半段循环），不影响 1 号在留更新（N3 不是卡车路径的更新条件，只是职业升级条件）；若已决定转出租车 / 巴士，N3 变成硬门槛，须达标后再启动转岗。<\/li>\n<li>职场日语同步包：点呼 / 安全确认（「出発前点呼よろしくお願いします」「異常ありません」）；配送 / 仓库用语（「納品書」「伝票」「積み込み」「仕分け」）；请假与报联相句型；敬语最小集（いらっしゃる / 申し上げる / おります）。<\/li>\n<\/ul>\n<h3 id=\"54-n2-m3\"><a id=\"54-n2-备考计划m3\" aria-hidden=\"true\"><\/a>5.4 N2 备考计划（M3）<\/h3>\n<ul>\n<li>前提：N3 已达成；N2 合格线 90/180，分项 19×3。定位：阶段 3（管理岗过渡）的语言通行证。<\/li>\n<li>时间方案：激进 2028-12 第一个周日；推荐 2029-07 第一个周日（司机工作疲劳度高，留 18 个月）。按「日均 1h + 周末 4h」设计。<\/li>\n<li>内容：词汇累计 6,000 词；汉字累计约 1,000–1,050 字（中文母语者最大红利区）；N3 语法精细化 + 文言残留；读解为得分主战场；听解一次放完不重播。<\/li>\n<li>计划骨架（18 个月 / 78 周）：基础期 1–20 周（《新完全掌握》N2 词汇 + 文法主线）；读解期 21–36 周（每天 1 长文限时，泛读 NHK News Web Easy → 普通新闻）；听解期 37–52 周（真题 + ニュース解説番组精听，利用通勤车载音频）；冲刺期 53–78 周（官方问题集 + 市售模考 6–8 套，目标稳定 ≥ 115）。<\/li>\n<li>自测线：第 20 周 ≥ 85；第 40 周 ≥ 100；第 60 周 ≥ 115。<\/li>\n<li>风险与对策：工作疲劳断档 → 设「最低维持量」（每天 20min Anki + 15min 听力）；读解超时 → 从第 21 周起全部限时训练；中文字面陷阱 → 同形异义词（手紙、勉強、新聞…）专项整理。<\/li>\n<li>管理岗日语同步包：日報・月報定型文、会議表现、指示复述（「〜という理解でよろしいでしょうか」）；N2 后可叠加 BJT（非必需，作为能力标尺）。<\/li>\n<\/ul>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<blockquote>\n<p>本节承载手册 05（资源与工具清单）与证书路线内容。<\/p>\n<\/blockquote>\n<h3 id=\"61\"><a id=\"61-核心证书总览\" aria-hidden=\"true\"><\/a>6.1 核心证书总览<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">证书<\/th>\n<th style=\"width:20%\">发证 / 运营方<\/th>\n<th style=\"width:20%\">层级 / 评分<\/th>\n<th style=\"width:20%\">费用口径<\/th>\n<th style=\"width:20%\">认可证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JLPT<\/td>\n<td>国际交流基金 / 日本国际教育支援协会<\/td>\n<td>N5–N1；满分 180，合格线与分项底线逐级不同<\/td>\n<td>以 01-ssw-driver 登记册 #3 为准（本主题只读）<\/td>\n<td>特定技能 1 号卡车 N4 / 出租车·巴士 N3 / 管理岗·2 号 N2<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic<\/td>\n<td>国际交流基金 / Prometric<\/td>\n<td>10–250；A1 / A2.1 / A2<\/td>\n<td>日本国内 10,000 円（登记册 #2）<\/td>\n<td>200–250 = A2 为特定技能达标线，与 N4 同等有效<\/td>\n<\/tr>\n<tr>\n<td>BJT（ビジネス日本語能力テスト）<\/td>\n<td>商务日语能力测试<\/td>\n<td>商务日语能力分级<\/td>\n<td>—<\/td>\n<td>非必需，作为 N2 后能力标尺（手册 04）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>费用 / 考位活值一律只读引用 01-ssw-driver 登记册 #3；本主题不独立改值或回写。<\/p>\n<\/blockquote>\n<h3 id=\"62\"><a id=\"62-官方免费资源优先级最高\" aria-hidden=\"true\"><\/a>6.2 官方免费资源（优先级最高）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">资源<\/th>\n<th style=\"width:33%\">用途<\/th>\n<th style=\"width:34%\">链接<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>いろどり（Irodori）<\/td>\n<td>JF 免费·面向在日劳动者的生活职场日语，含中文版<\/td>\n<td>https://www.irodori.jpf.go.jp<\/td>\n<\/tr>\n<tr>\n<td>JLPT 官方问题集<\/td>\n<td>唯一权威模考题<\/td>\n<td>https://www.jlpt.jp/samples/sampleindex.html<\/td>\n<\/tr>\n<tr>\n<td>JLPT 题型说明<\/td>\n<td>熟悉题型<\/td>\n<td>https://www.jlpt.jp/guideline/testsections.html<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic 官方样题<\/td>\n<td>CBT 界面适应<\/td>\n<td>https://www.jft-basic.jp/sample/<\/td>\n<\/tr>\n<tr>\n<td>JF 日本语教育标准<\/td>\n<td>A1–C1 能力描述，校准学习目标<\/td>\n<td>https://jfstandard.jpf.go.jp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"63\"><a id=\"63-主线教材与工具\" aria-hidden=\"true\"><\/a>6.3 主线教材与工具<\/h3>\n<ul>\n<li>主线教材（三选一体系，定后不换）：方案 A（推荐·重口语）《大家的日语》；方案 B（重语法体系）《新标日》；N2 阶段《新完全掌握》N2 系列（词汇 / 文法 / 读解 / 听解）。<\/li>\n<li>应试书：每级一套即可（N4：TRY! N4 或新完全掌握 N4 文法 + 官方问题集；N3：新完全掌握 N3（文法 + 读解）+ 官方问题集；N2：新完全掌握 N2 全套 + 官方问题集 + 市售模拟 2–3 本）。<\/li>\n<li>App 与工具：Anki（+ 中文语音牌组，SRS 主力）；MOJi辞書 / 大辞泉；NHK News Web Easy（N3 期起泛读）；Podcast（Nihongo con Teppei 等，N3 起碎片听力）；YouTube 日本語の森（N4–N2 全覆盖）。<\/li>\n<li>采购建议：先买主线教材 1 套 + 对应级应试书 1 本 + Anki（免费）；不买真题盗版合集与多套重复教材。<\/li>\n<\/ul>\n<h3 id=\"64\"><a id=\"64-报名入口与本地考试可用性\" aria-hidden=\"true\"><\/a>6.4 报名入口与本地考试可用性<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">事项<\/th>\n<th style=\"width:50%\">入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JLPT 国内报名<\/td>\n<td>https://jlpt.neea.edu.cn / https://jlpt.neea.cn<\/td>\n<\/tr>\n<tr>\n<td>JLPT 全球官网<\/td>\n<td>https://www.jlpt.jp<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic（赴日后）<\/td>\n<td>https://www.jft-basic.jp（报名经 Prometric）<\/td>\n<\/tr>\n<tr>\n<td>特定技能官方中文站<\/td>\n<td>https://www.ssw.go.jp/cn/<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>本地考试可用性<\/strong>：中国大陆可报 JLPT（N4 下午场，N3/N4/N5 下午、N1/N2 上午）；不可报 JFT-Basic。报名先注册个人信息，抢考位（大城市考位紧张，放报当天即报）。<\/p>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>以下均为「建议 / 推断」，与事实数据分离；不承诺考试必过，不给 Go / No-Go 式断言。<\/p>\n<\/blockquote>\n<h3 id=\"71\"><a id=\"71-总时间线\" aria-hidden=\"true\"><\/a>7.1 总时间线<\/h3>\n<pre><code class=\"language-text\">2026-11          2027-03      2027-07         2027-12/2028-07     2028-12~/2029\n零基础启动  →  报名N4  →  M1: JLPT N4  →  M2: JLPT N3      →  M3: JLPT N2\n（五十音+基础）            （入境材料齐备）  （入境后初期）        （管理岗准备期）\n<\/code><\/pre>\n<p>M1 完成后即满足特定技能卡车路径的日语要件，可与技能试验并行推进（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）。<\/p>\n<h3 id=\"72\"><a id=\"72-报名与考试建议建议\" aria-hidden=\"true\"><\/a>7.2 报名与考试建议（建议）<\/h3>\n<ol>\n<li><strong>M1 报名<\/strong>：2027 年 3 月中下旬关注 JLPT 官网（https://jlpt.neea.edu.cn），报名开放当天完成注册与抢考位；报名窗口前 1 个月核对官网日程，回写登记册 #1。（建议；窗口日期为推断）<\/li>\n<li><strong>备考主线<\/strong>：在中国大陆以 JLPT N4 为主线；若 2027-07 失利，赴日后用 JFT-Basic 兜底（随约随考），两条线教材高度重叠。（建议）<\/li>\n<li><strong>听力权重<\/strong>：因分项底线存在，从第 1 天起固定听力时间，不把听力留到最后阶段。（建议）<\/li>\n<\/ol>\n<h3 id=\"73\"><a id=\"73-学习与职业并行建议建议\" aria-hidden=\"true\"><\/a>7.3 学习与职业并行建议（建议）<\/h3>\n<ol>\n<li><strong>入境后节奏<\/strong>：N3 采用稳妥方案（2028-07），避免与入职初期高强度工作硬撞；N2 按「日均 1h + 周末 4h」拉长战线。（建议）<\/li>\n<li><strong>里程碑联动<\/strong>：M1 与技能试验并行；M2 / M3 与职业升级（转岗 / 2 号 / 管理岗）对齐，避免先考证后补条件的错位。（建议 / 推断）<\/li>\n<li><strong>材料归档<\/strong>：合格后证书原件妥善保存，在雇主申请受入计划书认定时提交。（建议）<\/li>\n<\/ol>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：JLPT 官方日程与报名入口、JFT-Basic 官方信息（经 prometric-jp.com / jpf.go.jp）、01-ssw-driver 登记册 #3 锚定值。<\/li>\n<li><strong>B 权威转引<\/strong>：国際交流基金、日本語能力試験公式資料。<\/li>\n<li><strong>C 平台抽样 / 估算<\/strong>：手册学习量估算、自测线、周节奏模板、预算参考（均为规划经验值，<strong>待核验<\/strong>）；学习门户与社区经验标注为经验，不作事实。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试体系<\/td>\n<td>JLPT（N 级制）≠ JFT-Basic（A 级制）<\/td>\n<\/tr>\n<tr>\n<td>达标线<\/td>\n<td>特定技能 1 号卡车路径（N4 / JFT-Basic A2）≠ 出租车 / 巴士路径（N3）≠ 管理岗 / 2 号（N2）<\/td>\n<\/tr>\n<tr>\n<td>考点<\/td>\n<td>中国大陆（JLPT 有考点、无 JFT-Basic 考点）≠ 日本国内（两者均有）<\/td>\n<\/tr>\n<tr>\n<td>学习方法<\/td>\n<td>官方公式資料 ≠ 市售模考 ≠ 社区经验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"83\"><a id=\"83-未取得项与个人进度跟踪\" aria-hidden=\"true\"><\/a>8.3 未取得项与个人进度跟踪<\/h3>\n<ul>\n<li><strong>未取得项<\/strong>：#3 当前学习进度（待基线确立）、#4 主用教材版本（待基线确立）。<\/li>\n<li><strong>个人进度记录（自记录数据）<\/strong>：里程碑看板（M0 五十音全熟、M1 JLPT N4、M1.5 技能试验、M2 N3、M3 N2）状态均为未开始；周记录表与模考记录模板已建、记录为空；报名与证件提醒表已列（JLPT N4 报名 2027-03 中下旬、准考证打印考前约 2 周、合格证书原件归档等）。<\/li>\n<li><strong>记录规则<\/strong>：实际学时 &lt; 计划 80% → 下周不推进新课先补；听力周时长 &lt; 2h → 偏科预警；每周末更新，每月最后一个周日做月度复盘。<\/li>\n<\/ul>\n<h3 id=\"84\"><a id=\"84-待复核清单逐项给出复核入口\" aria-hidden=\"true\"><\/a>8.4 待复核清单（逐项给出复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>2027 年上半年报名窗口为推断值<\/td>\n<td>JLPT 官网 https://jlpt.neea.edu.cn 与 https://www.jlpt.jp 正式公告；核对后回写登记册 #1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>登记册 #3 当前学习进度<\/td>\n<td>建立周记录表并回写 <a href=\"../handbook/06-progress.md\">06-学习进度跟踪<\/a><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>登记册 #4 主用教材版本<\/td>\n<td>教材选型确定后回写登记册 #4（选型定后不换）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>01-ssw-driver 登记册 #3 锚定值<\/td>\n<td>只读同步，若官方一手来源冲突先回官方原文复核，再由 01-ssw-driver 主责更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>学习量估算与自测线为经验值<\/td>\n<td>以实际模考与学时记录校准，不写入事实层<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"85\"><a id=\"85-时间基准声明\" aria-hidden=\"true\"><\/a>8.5 时间基准声明<\/h3>\n<p>本报告数据基准日 2026-11-14；考试制度类信息核对日期 2026-11-11（手册 01）；登记册活值基准版本为 baseline；个人进度为自记录，标注记录日期。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手<\/strong><\/p>\n<ol>\n<li>JLPT 官方（教育部教育考试院报名站），https://jlpt.neea.edu.cn，2026。<\/li>\n<li>JLPT 全球官网，https://www.jlpt.jp，2026。<\/li>\n<li>JLPT 官方问题集，https://www.jlpt.jp/samples/sampleindex.html，2026。<\/li>\n<li>JLPT 题型说明，https://www.jlpt.jp/guideline/testsections.html，2026。<\/li>\n<li>JFT-Basic 官方样题，https://www.jft-basic.jp/sample/，2026。<\/li>\n<li>特定技能官方中文站，https://www.ssw.go.jp/cn/，2026。<\/li>\n<\/ol>\n<p><strong>权威组织 / 教学资源<\/strong><\/p>\n<ol>\n<li>国際交流基金 いろどり，https://www.irodori.jpf.go.jp，2026。<\/li>\n<li>JF 日本语教育标准，https://jfstandard.jpf.go.jp，2026。<\/li>\n<li>日本語能力試験公式資料（JLPT 官方发布资料），经 https://www.jlpt.jp 回溯。<\/li>\n<\/ol>\n<p><strong>只读锚（跨主题）<\/strong><\/p>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 指标登记册 #3（JLPT / JFT-Basic 日程、费用、考位单一事实源），只读引用。<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>（在留制度侧的考试要求），只读引用。<\/li>\n<\/ol>\n<p><strong>经验类（标注为经验，不作事实）<\/strong><\/p>\n<ol>\n<li>学习门户与社区经验（学习方法参考）：仅作经验，不作事实引用；无稳定官方 URL，按社区来源标注个案。<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 205, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "11-language-japanese/reports/2026-11-language-japanese.html"}}}, "culture-life": {"name": "文化与生活", "dir": "12-culture-life", "months": {"2026-11": {"title": "日本文化与生活 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本文化与生活--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本文化与生活 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要职场文化适应与日常生活落地的读者，兼具生活指南与心理适应视角。\n<strong>来源规则<\/strong>：① 厚生労働省（労働に関する制度）、総務省 / 自治体（生活制度、ゴミ分別等）＞ ② JILPT / 公共機関的职场调查 ＞ ③ 地域自治体多语言生活指南 ＞ ④ 在日生活门户与社区（经验类，标注个案）；每条数据必须附可直接访问的 URL，并记录「机构 · 统计周期 · 核验状态」。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>核心判断<\/strong>（每条含数据、口径与来源）：<\/p>\n<ol>\n<li><strong>制度框架类内容核验程度较高<\/strong>：窗口自付 3 割依据健康保険法第 74 条；处方笺「含交付日在内 4 日以内」依据「保険医療機関及び保険医療養担当規則」第 20 条・第 21 条；#7119 确认为自治体设置，截至令和 6 年 11 月共 36 地域（覆盖 36/47 都道府県）。（事实）<\/li>\n<li><strong>登记册活值尚未闭合<\/strong>：7 项指标中 #1、#2、#4 待基线确立，#3 待记录，#5、#6 待复核，仅 #7（UR 收入基准）已确立。（事实）<\/li>\n<li><strong>UR 收入基准可作为住房维度的锚定活值<\/strong>：家賃 62,500 円未満→基准月收=家賃 4 倍等三档参数有 2026-11 核实来源，可用于公营住宅申请资格初判。（事实）<\/li>\n<li><strong>文化类内容属一般化观察<\/strong>：报联相 / 挨拶 / 5S、评价体系、饮み会等均标注为一般化观察，不作统计事实，习惯性做法不得表述为法定要求。（事实）<\/li>\n<li><strong>经验类内容已标注个案<\/strong>：社群参与方式、生活适应记录等属生活经验，不作事实引用。（事实）<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>覆盖登记册全部 7 项追踪指标（活值以 <a href=\"../data/culture_life_indicator_registry.md\">data/culture_life_indicator_registry.md<\/a> 为准）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值（来源 / 年份）<\/th>\n<th style=\"width:20%\">基准版本<\/th>\n<th style=\"width:20%\">变更说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>在留相关生活手续流程变化<\/td>\n<td>待基线确立<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>职场文化相关官方调查<\/td>\n<td>待基线确立<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>个人生活适应记录<\/td>\n<td>待记录<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>医疗保险费率·自付上限·高额疗养费上限<\/td>\n<td>待基线确立<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新；待跟踪：高额疗养费令和 8·9 年 8 月见直し<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>房价 / 租金行情指针<\/td>\n<td>待复核（口径参考：https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html, 2026）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>防灾气象预警渠道（警戒レベル体系·推送 App）<\/td>\n<td>待复核（体系参考：https://www.jma.go.jp/jma/kishou/know/bosai/warning.html, 2026）<\/td>\n<td>baseline<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>UR 賃貸住宅申込收入基准<\/td>\n<td>家賃 62,500 円未満→基准月收=家賃 4 倍；62,500–200,000 円→25 万円；200,000 円以上→40 万円；储蓄基准=家賃 100 倍可替代收入基准（来源：https://dr.www.ur-net.go.jp/chintai/sp/rent/requirements/, 2026）<\/td>\n<td>2026-11-12<\/td>\n<td>已确立，无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告复核结论，无新增修正。历史报告 2026-11-12 复核已闭环 3 项：窗口自付 3 割依据健康保険法第 74 条；処方箋有效期 4 日依据「保険医療機関及び保険医療養担当規則」第 20 条・第 21 条；#7119 为自治体设置，截至令和 6 年 11 月共 36 地域（覆盖 36/47 都道府県）。<\/p>\n<h3 id=\"_4\"><a id=\"调研说明\" aria-hidden=\"true\"><\/a>调研说明<\/h3>\n<ul>\n<li><strong>来源语言规则<\/strong>：制度类须日文官方原文；经验类不限（标注为个案）。<\/li>\n<li><strong>时效窗口<\/strong>：制度类近 12 个月内优先；经验类标注记录日期。<\/li>\n<li><strong>标注约定<\/strong>：法规义务 ≠ 职场惯例 ≠ 一般化观察三层分别标注；推断标「推断」，自算标「自算」，预测标「预测值（F）」。<\/li>\n<li><strong>跨主题分工<\/strong>：维权流程与法规条文 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>；地域选择与生活成本 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a> / <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；税费社保与年金缴纳申报 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；现场安全制度与事故处理 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；在留手续与在留制度 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；日语学习计划 → <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>。<\/li>\n<\/ul>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<h3 id=\"21\"><a id=\"21-医疗保险制度框架两条轨道并列不合并\" aria-hidden=\"true\"><\/a>2.1 医疗保险制度框架（两条轨道，并列不合并）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">轨道<\/th>\n<th style=\"width:25%\">适用者<\/th>\n<th style=\"width:25%\">加入方式<\/th>\n<th style=\"width:25%\">保费口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保险（职场健保 / 协会けんぽ）<\/td>\n<td>正社員、特定技能者等被用者<\/td>\n<td>雇主办理，本人与公司折半负担<\/td>\n<td>按标准报酬 × 费率，费率因健保组合而异（活值）<\/td>\n<\/tr>\n<tr>\n<td>国民健康保险<\/td>\n<td>非被用者、退职后、未随社保的家属<\/td>\n<td>自行到市区役所办理<\/td>\n<td>按所得与均等割计算，自治体差异大<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>制度框架以厚生労働省公开信息为准：全民皆保险（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/index.html）；国保为「未加入被用者保险的全体住民」的保险（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/koukikourei/index_00002.html）。<\/li>\n<li>窗口自付比例：3 割（未满 70 岁；70–74 岁 2 割；75 岁起转入后期高龄者医疗制度），法律依据为健康保険法第 74 条（https://laws.e-gov.go.jp/law/334AC0000000070）。<\/li>\n<li>外国人被保险者：国保有含简繁中文在内 19 语种的在留外国人向指南（https://www.mhlw.go.jp/stf/newpage_21895.html）。<\/li>\n<li>高额疗养费制度：单月自付超过按所得区分的上限部分可申请给付；上限额每年调整，属活值。官方示例（令和 8 年 8 月起新制度）：70 岁未满·年收约 370–510 万円者，100 万円治疗自付约 9.3 万円封顶（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/juuyou/kougakuiryou/index.html）；令和 8·9 年 8 月各有见直し（监测触发器）。<\/li>\n<li>易漏点：退职后健保资格丧失，须在 14 天内转入国民健康保险或办理任意継続；断保会在永住审查的「公的义务」项留下记录（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）。<\/li>\n<\/ul>\n<h3 id=\"22\"><a id=\"22-就医体检与劳灾制度\" aria-hidden=\"true\"><\/a>2.2 就医、体检与劳灾制度<\/h3>\n<p><strong>就医全流程<\/strong>：选机构（先「診療所（かかりつけ医）」后大病院；无介绍状直接去大病院会被收「選定療養費」）→ 带证件（マイナ保険証 + 在留卡；初诊填写问诊票）→ 就诊（需要「診断書」时另付文书费）→ 取药（医薬分業，持处方笺到調剤薬局取药，含交付日在内 4 日以内；依据保険医療機関及び保険医療養担当規則第 20 条・第 21 条）→ 付款（窗口 3 割，保留领收书）→ 夜间 / 假日先拨「救急安心センター（#7119）」咨询再决定是否叫救护车（非全国统一，由自治体设置；未开设地区拨「#8000（儿童急救咨询）」或直接 119）。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">项目<\/th>\n<th style=\"width:25%\">依据 / 主体<\/th>\n<th style=\"width:25%\">频率<\/th>\n<th style=\"width:25%\">岗位要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>定期健康診断<\/td>\n<td>労働安全衛生法，雇主实施<\/td>\n<td>每年<\/td>\n<td>血压 / 血糖 / 听力 / 视力是驾照适性关联项<\/td>\n<\/tr>\n<tr>\n<td>特定健診<\/td>\n<td>40–74 岁健保加入者<\/td>\n<td>每年<\/td>\n<td>可与公司健诊合并，避免重复受检<\/td>\n<\/tr>\n<tr>\n<td>がん検診<\/td>\n<td>自治体<\/td>\n<td>按自治体案内<\/td>\n<td>多地有补助，落地后在役所确认<\/td>\n<\/tr>\n<tr>\n<td>睡眠時無呼吸症候群（SAS）筛查<\/td>\n<td>运输业自主规范 + 健保（行业实践，待复核）<\/td>\n<td>有症状时<\/td>\n<td>日间嗜睡＝事故风险，结论影响乗務判定<\/td>\n<\/tr>\n<tr>\n<td>ストレスチェック<\/td>\n<td>労働安全衛生法（一定规模事业场义务）<\/td>\n<td>每年<\/td>\n<td>结果不直接进人事评价，可主动利用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>劳灾保险与工伤<\/strong>（与职业安全直接衔接）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">健康保险<\/th>\n<th style=\"width:34%\">劳灾保险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>覆盖范围<\/td>\n<td>疾病·伤害（业务外也覆盖）<\/td>\n<td>业务上灾害与通勤灾害<\/td>\n<\/tr>\n<tr>\n<td>窗口自付<\/td>\n<td>3 割<\/td>\n<td>疗养给付范围内原则上本人 0 负担（待复核）<\/td>\n<\/tr>\n<tr>\n<td>申请主体<\/td>\n<td>本人<\/td>\n<td>雇主提出、本人配合；雇主不配合可自行向劳动基准监督署申请<\/td>\n<\/tr>\n<tr>\n<td>休业期间<\/td>\n<td>伤病津贴（条件严格）<\/td>\n<td>休业（补偿）给付<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>心理健康资源<\/strong>：公司内（产业医、保健师、相談窓口，一定规模事业场为法定义务）；公司外（自治体「こころの健康相談」、よりそいホットライン 0120-279-338，24h，含外语对应、いのちの電話）；窗口总览见厚労省电话相谈页（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/jisatsu/soudan_tel.html）。<\/p>\n<h3 id=\"23\"><a id=\"23-防灾预警体系与多语言情报渠道\" aria-hidden=\"true\"><\/a>2.3 防灾预警体系与多语言情报渠道<\/h3>\n<ul>\n<li><strong>预警口径<\/strong>：按気象警報・警戒レベル行动（https://www.jma.go.jp/jma/kishou/know/bosai/warning.html）——发布避难指示（警戒レベル 4）全员避难，不等レベル 5；土砂 / 洪水危险区域实况看キキクル（https://www.jma.go.jp/bosai/risk/）。驾驶途中遇特別警報：立即驶离低洼地·地下道，就近进入坚固建筑，不强行回家。<\/li>\n<li><strong>地震初期应对<\/strong>：护头躲入桌下 → 摇晃停止后关火·断电·开门确保出口 → 穿鞋带包撤离；家具翻倒·落物占受伤原因 3–5 成，家具固定是第一道防线；海边强震立即向高处转移（海啸）。<\/li>\n<li><strong>多语言灾害情报渠道<\/strong>：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">渠道<\/th>\n<th style=\"width:50%\">用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Safety tips（観光庁监修，https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html）<\/td>\n<td>15 语种推送：紧急地震速报·海啸·特別警報，附行动流程图与沟通卡<\/td>\n<\/tr>\n<tr>\n<td>NHK WORLD-JAPAN<\/td>\n<td>24 小时英语频道，大灾时的英语情报源<\/td>\n<\/tr>\n<tr>\n<td>JNTO Japan Visitor Hotline（050-3816-2787）<\/td>\n<td>英 / 中 / 韩 / 日 24h（事故·疾病·灾害支持）<\/td>\n<\/tr>\n<tr>\n<td>地域国際化協会相談窓口（https://www.clair.or.jp/j/multiculture/association/consultation_list.html）<\/td>\n<td>灾后生活咨询的多语言窗口全国一览<\/td>\n<\/tr>\n<tr>\n<td>自治体灾害支援体制<\/td>\n<td>総務省「情報難民ゼロ」项目培训災害時外国人支援情報コーディネーター（https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"24\"><a id=\"24-多文化共生政策与支援体系\" aria-hidden=\"true\"><\/a>2.4 多文化共生政策与支援体系<\/h3>\n<ul>\n<li>主管部门：総務省「地域の国際化の推進」。核心文件为「地域における多文化共生推進プラン」（令和 2 年改订，https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html），指导地方自治体制定指針·計画；策定状况逐年调查公开（令和 6 年 4 月时点为最新调查）。<\/li>\n<li>实践案例：多文化共生事例集（令和 3 年度版，https://www.soumu.go.jp/menu_seisaku/chiho/tabunkakyousei_suishin_r03.html）——外国人住民协働地域活化、留学生就职支援等。<\/li>\n<li>个人用法：搬家 / 换工作时用「自治体名 + 多文化共生 + 相談窓口」检索本地施策与窗口。<\/li>\n<\/ul>\n<h3 id=\"25\"><a id=\"25-政策与趋势观察触发器\" aria-hidden=\"true\"><\/a>2.5 政策与趋势观察（触发器）<\/h3>\n<p>劳动文化相关制度变化（联动 09）→ 01；生活制度变化（在留卡手续、年金手续等，联动 08）→ 02；个人新生活经验沉淀 → 02；医疗保险制度 / 自付比例 / 高额疗养费上限变化 → 03；劳灾保险给付口径、工伤申领流程变化 → 03；体检 / 健诊制度变化 → 03；賃贷保护法制 / 家賃补给等住宅施策变化 → 04；多文化共生施策、外国人支援体制变化 → 05；大规模灾害（震度 5 弱以上 / 特別警報发布）→ 02 防灾小节；防灾气象预警体系与 App 渠道变化 → 02 防灾小节。无触发器命中且窗口未到时<strong>不启动<\/strong>。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-口径声明\" aria-hidden=\"true\"><\/a>3.1 口径声明<\/h3>\n<p>本主题不维护「人才供需」与「薪酬」类数据：薪酬、税·社保·年金缴纳申报归 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；地域选择与生活成本归 <a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a> / 07。本节按本主题范围呈现「生活成本与制度给付口径」，不编造供需与薪酬数字。<\/p>\n<h3 id=\"32\"><a id=\"32-医疗成本口径\" aria-hidden=\"true\"><\/a>3.2 医疗成本口径<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">来源 / 时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>窗口自付<\/td>\n<td>3 割（未满 70 岁；70–74 岁 2 割；75 岁起后期高龄者）<\/td>\n<td>厚生労働省 / 健康保険法第 74 条，2026 核实<\/td>\n<\/tr>\n<tr>\n<td>高额疗养费<\/td>\n<td>单月自付超上限部分申请给付；上限额每年调整（活值）<\/td>\n<td>厚生労働省，令和 8 年 8 月起新制度<\/td>\n<\/tr>\n<tr>\n<td>官方示例<\/td>\n<td>70 岁未满·年收约 370–510 万円者，100 万円治疗自付约 9.3 万円封顶<\/td>\n<td>厚生労働省高额疗养费专页，2026<\/td>\n<\/tr>\n<tr>\n<td>保险费率<\/td>\n<td>因健保组合 / 自治体而异（活值，待基线确立）<\/td>\n<td>厚労省 / 健保组合，登记册 #4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"33\"><a id=\"33-住房成本口径\" aria-hidden=\"true\"><\/a>3.3 住房成本口径<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">来源 / 时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>敷金<\/td>\n<td>存管型押金，退去清算后余额返还；0–2 个月（行情因地域 / 物件而异）<\/td>\n<td>国交省 / 平台抽样，登记册口径<\/td>\n<\/tr>\n<tr>\n<td>礼金<\/td>\n<td>付与房东不返还；市场惯例，无法定上限（推断；行情倍数待复核）<\/td>\n<td>国交省，手册 04<\/td>\n<\/tr>\n<tr>\n<td>仲介手数料<\/td>\n<td>法定上限：居住用借主侧 1 个月房租 × 1.1（含税）以内，贷主侧 × 0.55；令和 6 年 7 月起长期空き家特例上限 × 2.2<\/td>\n<td>国交省（https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html），2026<\/td>\n<\/tr>\n<tr>\n<td>保証会社料·火災保険等<\/td>\n<td>惯例，数额依物件与公司（行情待复核）<\/td>\n<td>国交省，手册 04<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"34-ur-2026-11\"><a id=\"34-ur-賃貸住宅收入基准制度参数2026-11-核实\" aria-hidden=\"true\"><\/a>3.4 UR 賃貸住宅收入基准（制度参数，2026-11 核实）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">家賃区间<\/th>\n<th style=\"width:50%\">基准月收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>62,500 円未満<\/td>\n<td>家賃 4 倍<\/td>\n<\/tr>\n<tr>\n<td>62,500–200,000 円<\/td>\n<td>25 万円<\/td>\n<\/tr>\n<tr>\n<td>200,000 円以上<\/td>\n<td>40 万円<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>储蓄基准 = 家賃 100 倍可替代收入基准；收入不足可用家賃一時払い（1–10 年）制度。<\/li>\n<li>来源：https://dr.www.ur-net.go.jp/chintai/sp/rent/requirements/，2026-11-12 核实。<\/li>\n<\/ul>\n<h3 id=\"35\"><a id=\"35-多口径并列不合并不取均值\" aria-hidden=\"true\"><\/a>3.5 多口径并列（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>医疗保险<\/td>\n<td>健康保险（职场健保）≠ 国民健康保险（非被用者）<\/td>\n<\/tr>\n<tr>\n<td>房租成本<\/td>\n<td>敷金（存管型）≠ 礼金（不返还）≠ 仲介手数料（法定上限）<\/td>\n<\/tr>\n<tr>\n<td>防灾预警<\/td>\n<td>国家预警 ≠ 自治体通知 ≠ 个人接收渠道<\/td>\n<\/tr>\n<tr>\n<td>文化描述<\/td>\n<td>法规义务 ≠ 职场惯例 ≠ 一般化观察<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<h3 id=\"41\"><a id=\"41-边界声明\" aria-hidden=\"true\"><\/a>4.1 边界声明<\/h3>\n<p>本主题不含雇主（企业）细分：货运司机雇主生态归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 与 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>。本节仅对本主题涉及的制度与服务主体做类型细分。<\/p>\n<h3 id=\"42\"><a id=\"42-制度与服务主体类型\" aria-hidden=\"true\"><\/a>4.2 制度与服务主体类型<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">主体类型<\/th>\n<th style=\"width:25%\">代表<\/th>\n<th style=\"width:25%\">角色<\/th>\n<th style=\"width:25%\">入选标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>中央省厅<\/td>\n<td>厚生労働省、総務省、国土交通省、内閣府防災、気象庁<\/td>\n<td>制度框架与官方信息<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>执行机构<\/td>\n<td>健保组合、UR 都市機構、自治体（市区役所 / 水道局）<\/td>\n<td>保费征收、公营住宅、生活手续<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>支援组织<\/td>\n<td>CLAIR（自治体国際化協会）、地域国際化協会<\/td>\n<td>多语言咨询、多文化共生施策<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>调查研究机构<\/td>\n<td>JILPT<\/td>\n<td>职场调查（文化维度优先来源）<\/td>\n<td>公共機関调查<\/td>\n<\/tr>\n<tr>\n<td>经验类社区<\/td>\n<td>同乡会、特定技能者交流会<\/td>\n<td>社群参与（标注个案）<\/td>\n<td>经验类，不作事实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>未取得项：#2 职场文化相关官方调查待基线确立（JILPT / 厚労省）；#5 房价 / 租金行情指针待复核（国交省不動産情報 / 自治体公表）。<\/p>\n<\/blockquote>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<blockquote>\n<p>本节承载手册 01（职场文化与人际）与医疗日语最小集，对应「岗位技能要求」中的软技能与场景语言要求。<\/p>\n<\/blockquote>\n<h3 id=\"51\"><a id=\"51-司机现场的三大文化规则一般化观察\" aria-hidden=\"true\"><\/a>5.1 司机现场的三大文化规则（一般化观察）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">规则<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">实践<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>报联相（報告・連絡・相談）<\/td>\n<td>事前 / 事中 / 事后都要出声<\/td>\n<td>异常第一时间报，坏消息更要快<\/td>\n<\/tr>\n<tr>\n<td>挨拶文化<\/td>\n<td>早上 / 退勤 / 借用前后的寒暄是信用基础<\/td>\n<td>「おはようございます」大声说，成本最低的印象分<\/td>\n<\/tr>\n<tr>\n<td>5S（整理·整頓·清掃·清潔·躾）<\/td>\n<td>车辆 / 更衣室 / 传票的整洁＝职业度外显<\/td>\n<td>每天下班 10 分钟收拾，被看见<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"52\"><a id=\"52-上下关系与沟通一般化观察\" aria-hidden=\"true\"><\/a>5.2 上下关系与沟通（一般化观察）<\/h3>\n<ul>\n<li>敬语体系是职位语言：对先辈用「です・ます」起步，对方主动破解后再放松。<\/li>\n<li>指示复述是尊重：接到指示 → 复述 → 执行 → 完成报告，四步闭环。<\/li>\n<li>饮み会：参加 1–2 次建立关系即可，长期缺席会边缘化；饮酒不劝强（现场酒精管理严格）。<\/li>\n<li>给礼物（手土産）：回国出差带点心，300–1000 円价位即可，关系润滑剂。<\/li>\n<\/ul>\n<h3 id=\"53\"><a id=\"53-评价体系一般化观察\" aria-hidden=\"true\"><\/a>5.3 评价体系（一般化观察）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">被认可的<\/th>\n<th style=\"width:50%\">被扣分的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>声を出す（出声确认）<\/td>\n<td>沉默独自处理<\/td>\n<\/tr>\n<tr>\n<td>守时守序（时间提前 10 分钟）<\/td>\n<td>借口与解释先行<\/td>\n<\/tr>\n<tr>\n<td>清洁感（车辆·仪容·更衣室）<\/td>\n<td>现场杂乱<\/td>\n<\/tr>\n<tr>\n<td>前辈照顾后辈的姿态<\/td>\n<td>只顾自己<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"54\"><a id=\"54-跨文化生存策略\" aria-hidden=\"true\"><\/a>5.4 跨文化生存策略<\/h3>\n<ol>\n<li>把「不懂就问」包装成「確認させてください」——好学不丢脸。<\/li>\n<li>不参与是非话题（工资、他人评价），只谈工作和改善。<\/li>\n<li>中国背景是资产：对华供应链客户、中文系统的导入支持——让语言成为岗位价值而非标签。<\/li>\n<li>遇到排挤 / 歧视：先书面记录，走 <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a> 维权与合规工具箱流程。<\/li>\n<\/ol>\n<h3 id=\"55-n4\"><a id=\"55-医疗日语最小集n4-可用\" aria-hidden=\"true\"><\/a>5.5 医疗日语最小集（N4 可用）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">场景<\/th>\n<th style=\"width:50%\">说法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>挂号<\/td>\n<td>初めてです。保険証があります。<\/td>\n<\/tr>\n<tr>\n<td>症状<\/td>\n<td>頭が痛いです／熱があります／お腹が痛いです<\/td>\n<\/tr>\n<tr>\n<td>起病时间<\/td>\n<td>三日くらい前からです<\/td>\n<\/tr>\n<tr>\n<td>用药<\/td>\n<td>薬を飲んでいます。アレルギーはありません。<\/td>\n<\/tr>\n<tr>\n<td>文书<\/td>\n<td>診断書をお願いします。<\/td>\n<\/tr>\n<tr>\n<td>转诊<\/td>\n<td>紹介状をお願いします。<\/td>\n<\/tr>\n<tr>\n<td>劳灾<\/td>\n<td>仕事中のけがです。労災でお願いします。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<h3 id=\"61\"><a id=\"61-边界声明\" aria-hidden=\"true\"><\/a>6.1 边界声明<\/h3>\n<p>本主题不含职业资质证书内容：资格 / 学历路径归 <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>；驾照路径归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> / 10；日语考试归 <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>。本节呈现与生活制度直接相关的资格 / 证件与健诊制度资格。<\/p>\n<h3 id=\"62\"><a id=\"62-制度资格与证件总览\" aria-hidden=\"true\"><\/a>6.2 制度资格与证件总览<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">资格 / 证件<\/th>\n<th style=\"width:25%\">性质<\/th>\n<th style=\"width:25%\">要点<\/th>\n<th style=\"width:25%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保险被保险者证<\/td>\n<td>保险凭证<\/td>\n<td>职场健保 / 协会けんぽ由雇主办理；国保自行到市区役所办理<\/td>\n<td>厚生労働省（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/index.html）<\/td>\n<\/tr>\n<tr>\n<td>マイナ保険証<\/td>\n<td>My Number 卡作健保证用<\/td>\n<td>未持卡时医疗机构可在线确认资格<\/td>\n<td>厚生労働省（https://www.mhlw.go.jp/stf/newpage_08277.html）<\/td>\n<\/tr>\n<tr>\n<td>特定健診<\/td>\n<td>40–74 岁健保加入者健诊<\/td>\n<td>可与公司健诊合并<\/td>\n<td>厚生労働省 / 手册 03<\/td>\n<\/tr>\n<tr>\n<td>劳灾保险给付资格<\/td>\n<td>业务上灾害与通勤灾害<\/td>\n<td>疗养给付范围内原则上本人 0 负担（待复核）<\/td>\n<td>厚生労働省（https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/gyousei/rousai/040325-14.html）<\/td>\n<\/tr>\n<tr>\n<td>定期健康診断<\/td>\n<td>労働安全衛生法，雇主实施<\/td>\n<td>血压 / 血糖 / 听力 / 视力是驾照适性关联项<\/td>\n<td>厚生労働省 / 手册 03<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>待复核：マイナ保険証与纸保险证切换的确切时点（厚労省マイナ保険証专页未见明确日期）；劳灾疗养给付「本人原则上 0 负担」表述待以申领手册正文二次核实。<\/p>\n<\/blockquote>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>以下均为「建议 / 推断」，与事实数据分离。<\/p>\n<\/blockquote>\n<h3 id=\"71-2\"><a id=\"71-落地-2-周手续清单\" aria-hidden=\"true\"><\/a>7.1 落地 2 周手续清单<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">手续<\/th>\n<th style=\"width:33%\">期限<\/th>\n<th style=\"width:34%\">去处<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留卡地址登录<\/td>\n<td>落地 14 天内<\/td>\n<td>市区役所<\/td>\n<\/tr>\n<tr>\n<td>健康保险·年金加入确认<\/td>\n<td>同时<\/td>\n<td>同上（公司加社保则确认被保险者证）<\/td>\n<\/tr>\n<tr>\n<td>My Number 卡申请<\/td>\n<td>随时<\/td>\n<td>邮寄申请 + 役所领取<\/td>\n<\/tr>\n<tr>\n<td>银行开户<\/td>\n<td>第 1–2 周<\/td>\n<td>邮储 / Mega bank（在留卡 + 印章）<\/td>\n<\/tr>\n<tr>\n<td>手机契约<\/td>\n<td>第 2 周<\/td>\n<td>格安 SIM 优先（在留卡 + 信用卡）<\/td>\n<\/tr>\n<tr>\n<td>印章（実印未必需，认印必备）<\/td>\n<td>第 1 周<\/td>\n<td>100 円店起用，签约用姓名全称章<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（建议：在留手续细节以 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a> 与 <a href=\"../../14-life-operations/reports/2026-11-life-operations.md\">14-life-operations<\/a> 为准。）<\/p>\n<h3 id=\"72\"><a id=\"72-生活基础设施与安全习惯建议\" aria-hidden=\"true\"><\/a>7.2 生活基础设施与安全习惯（建议）<\/h3>\n<ul>\n<li>住宅：公司寮优先起步；自租注意礼金 / 敷金 / 保证人（保证会社）制度。<\/li>\n<li>交通：原付 / 自転车需在役所登记（防窃）；市区通勤多靠电车 + 接驳。<\/li>\n<li>医疗：健保 70% 报销；工作日白天病院、夜間救急センター分诊；指定药店（调剤药局）处方制度。<\/li>\n<li>购物：业务スーパー / イオン / 100 円店 + 中華物産店。<\/li>\n<li>金钱与安全：现金文化仍强（部分小店），但 IC 卡 + 信用卡覆盖 95% 生活；诈骗（特殊诈欺）高发，自称役所 / 警察要账号 = 100% 诈骗；家人（国内）也要同步防「孩子的电话」类跨境诈骗。<\/li>\n<\/ul>\n<h3 id=\"73\"><a id=\"73-住房与安家路径建议\" aria-hidden=\"true\"><\/a>7.3 住房与安家路径（建议）<\/h3>\n<ul>\n<li><strong>流程<\/strong>：物件探し（不動産店 / 网站）→ 内见 → 申込（入居审查）→ 重要事項説明 + 契约 → 交钥匙；宅建业者对借主负有书面重要事項説明义务（现也可在线办理 IT 重要事項説明）。<\/li>\n<li><strong>初期费用<\/strong>：前家賃（必付）+ 敷金 + 礼金 + 仲介手数料（法定上限见 3.3）+ 保証会社料·火災保険等；行情倍数待复核，以所在地业者报价为准。<\/li>\n<li><strong>外国人入住障碍<\/strong>：审查标准不透明、语言、无国内保证人；国交省「外国人の民間賃貸住宅入居円滑化ガイドライン」（14 国语，含标准契约书·重要事項説明书范本，https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000017.html）——被拒或条款不明时用它与业者对话。<\/li>\n<li><strong>公营选项（UR）<\/strong>：对外国籍开放（「UR が定める資格を持つ外国籍の方」可申込）；收入基准见 3.4；必要書類含住民票；收入不足可用家賃一時払い（1–10 年）。市営 / 県営住宅（所得限制 + 抽选）为另一条公营路线（抽选倍率等待复核）。<\/li>\n<li><strong>签约时序<\/strong>：在留卡（地址登录）→ 印章 → 银行口座 → 口座振替绑定房租 + 水电气；手机契约可与银行开户并行；水道向所在地水道局 / 役所做使用开始申报；电气、燃气、光纤网络开通流程按一般惯例（推断待复核），搬家前先确认可否「事前转移」。<\/li>\n<li><strong>退去与敷金清算<\/strong>：提出退去按契约书约定月数前通知（惯例 1 个月，推断）；敷金先抵扣未纳房租 + 修复费，余额返还；修复费仅限故意过失 / 通常使用范围外损耗，経年分由房东负担；要求出示明细、入退去时拍照留证；有争议以原状回復ガイドライン Q&amp;A（https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html）为依据交涉。<\/li>\n<\/ul>\n<h3 id=\"74\"><a id=\"74-防灾与应急建议\" aria-hidden=\"true\"><\/a>7.4 防灾与应急（建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">准备层<\/th>\n<th style=\"width:50%\">清单要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>非常用持ち出し袋<\/td>\n<td>饮水·食品、贵重品（存折·印章·现金·健康保险证）、救急品·常备药、手电·收音机·预备电池、头盔·防灾头巾、口罩·军手·暖贴<\/td>\n<\/tr>\n<tr>\n<td>自宅备蓄（3 天起步）<\/td>\n<td>饮水每人每天 3L × 3 天份、食品 3 天份（α 米约 5 食 / 人）、卡式炉·简易厕所·卫生纸；南海トラフ地震有「备蓄 1 周以上」的建议<\/td>\n<\/tr>\n<tr>\n<td>家具固定<\/td>\n<td>L 型金具 / 顶柱 / 粘着垫固定家具、玻璃防飞散膜、感震断路器（部分自治体有购置补助）<\/td>\n<\/tr>\n<tr>\n<td>滚动备蓄<\/td>\n<td>ローリングストック：日常多吃一份、消耗即补——不额外花钱、不过期<\/td>\n<\/tr>\n<tr>\n<td>安否联络<\/td>\n<td>事先约定集合点；电话不通用災害用伝言ダイヤル 171 与各运营商灾害用伝言板<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（来源：内閣府防災 https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html，2016；季节性防灾内容每年 6 月与 11 月各核对一次。）<\/p>\n<h3 id=\"75\"><a id=\"75-社会融入与心理健康建议--经验类\" aria-hidden=\"true\"><\/a>7.5 社会融入与心理健康（建议 / 经验类）<\/h3>\n<ul>\n<li><strong>社群<\/strong>：同乡会、特定技能者交流会有抗孤独价值；最稳入口为地域国際化协会的活动（日本語教室、地域交流イベント、防灾训练）；参与方式属生活经验（个案）：先从受援熟悉生态，再逐步转为志愿者。<\/li>\n<li><strong>心理适应<\/strong>：疲劳驾驶期（初入干线 / 夜班）是情绪低谷高发期：睡眠优先于学习计划（→ <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a> 的「最低维持量」设计）；与国内家人固定视频时间（时差 1 小时）；汇款计划 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>。<\/li>\n<li><strong>自我照顾<\/strong>：司机职业病预防——腰（装卸姿势）、眼（夜间驾驶）、体重（便利店依赖）；三件套对策：午餐带饭、每周 2 次锻炼、定期健诊；每季度 1 个挑战清单（登当地山、参加祭り、做一道日本料理给同事）。<\/li>\n<\/ul>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：厚生労働省（健康保険法第 74 条、高额疗养费、处方笺規則、劳灾）、気象庁 / 内閣府防災（预警体系、防灾清单）、国交省 / UR 都市機構（租赁制度与 UR 收入基准）、総務省 / CLAIR（多文化共生施策、咨询窗口）、総務省 / 消防庁（#7119）。<\/li>\n<li><strong>B 权威转引<\/strong>：JILPT / 公共機関的职场调查、地域自治体多语言生活指南。<\/li>\n<li><strong>C 平台抽样 / 估算<\/strong>：文化描述（报联相 / 挨拶 / 5S 等一般化观察）、经验类内容（社群参与、生活适应，标注个案）、水电煤网开通流程（推断）。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>医疗保险<\/td>\n<td>健康保险（职场健保）≠ 国民健康保险（非被用者）<\/td>\n<\/tr>\n<tr>\n<td>房租成本<\/td>\n<td>敷金（存管型）≠ 礼金（不返还）≠ 仲介手数料（法定上限）<\/td>\n<\/tr>\n<tr>\n<td>防灾预警<\/td>\n<td>国家预警 ≠ 自治体通知 ≠ 个人接收渠道<\/td>\n<\/tr>\n<tr>\n<td>文化描述<\/td>\n<td>法规义务 ≠ 职场惯例 ≠ 一般化观察<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"83\"><a id=\"83-未取得项\" aria-hidden=\"true\"><\/a>8.3 未取得项<\/h3>\n<ul>\n<li>\n<h1 id=\"1-2-3-4-5-6\"><a id=\"1-在留相关生活手续流程变化待基线确立2-职场文化相关官方调查待基线确立3-个人生活适应记录待记录4-医疗保险费率自付上限高额疗养费上限待基线确立5-房价--租金行情指针待复核6-防灾气象预警渠道待复核\" aria-hidden=\"true\"><\/a>1 在留相关生活手续流程变化（待基线确立）、#2 职场文化相关官方调查（待基线确立）、#3 个人生活适应记录（待记录）、#4 医疗保险费率·自付上限·高额疗养费上限（待基线确立）、#5 房价 / 租金行情指针（待复核）、#6 防灾气象预警渠道（待复核）。<\/h1>\n<\/li>\n<\/ul>\n<h3 id=\"84\"><a id=\"84-待复核清单逐项给出复核入口\" aria-hidden=\"true\"><\/a>8.4 待复核清单（逐项给出复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>大病院选定疗养加算通识口径<\/td>\n<td>厚労省现行告示（→ 手册 03）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>劳灾疗养给付「本人原则上 0 负担」表述<\/td>\n<td>劳灾申领手册正文（→ 手册 03）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>SAS 筛查为运输业行业实践，未核实现行规范出处<\/td>\n<td>厚労省 / 运输业自主规范（→ 手册 03）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>礼金 / 敷金市场行情倍数、保証会社费用水平<\/td>\n<td>行情类活值，归 regional / economy 登记册（→ 手册 04）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>UR「无礼金·敷金·保证人不要」等惯例性优势<\/td>\n<td>本次核实页面未直接确认，回 UR 官方页复核（→ 手册 04）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>电·燃气·水道开通各事业者标准流程与时限<\/td>\n<td>正文按一般惯例描述并标推断，回各事业者官网复核（→ 手册 04）<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>マイナ保険証全面切换后纸保险证停发时点<\/td>\n<td>厚労省マイナ保険証专页（→ 手册 03）<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>地域国際化協会各窗口对应语言与受付时间<\/td>\n<td>依地域而异，定居后逐一核实（→ 手册 05）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"85\"><a id=\"85-时间基准声明\" aria-hidden=\"true\"><\/a>8.5 时间基准声明<\/h3>\n<p>本报告数据基准日 2026-11-14；制度类信息核对日期 2026-11-12（手册 03/04/05）；防灾小节核对日期 2026-11-12；登记册活值基准版本为 baseline（#7 为 2026-11-12）；个人适应记录为自记录，标注记录日期。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手（省厅 / 机构）<\/strong><\/p>\n<ol>\n<li>厚生労働省（医療保険总览），https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/index.html，2026。<\/li>\n<li>厚生労働省（国民健康保険制度），https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/koukikourei/index_00002.html，2026。<\/li>\n<li>厚生労働省（高额疗养费制度），https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/juuyou/kougakuiryou/index.html，2026。<\/li>\n<li>e-Gov（健康 shin_r03.html，2021。<\/li>\n<li>CLAIR（多文化共生ポータルサイト / 咨询窗口一览），https://www.clair.or.jp/j/multiculture/association/consultation_list.html，2026。<\/li>\n<\/ol>\n<p><strong>只读锚（跨主题）<\/strong><\/p>\n<ol>\n<li><a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>（维权流程与法规条文），只读引用。<\/li>\n<li><a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>（现场安全制度与事故处理），只读引用。<\/li>\n<li><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>（税费社保与年金），只读引用。<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>（在留手续与在留制度），只读引用。<\/li>\n<li><a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a>（地域选择与生活笔记），只读引用。<\/li>\n<li><a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>（日语学习计划），只读引用。<\/li>\n<\/ol>\n<p><strong>经验类（标注个案，不作事实）<\/strong><\/p>\n<ol>\n<li>在日生活门户与社区经验（社群参与、生活适应），无稳定官方 URL，按个案标注。<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 255, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "12-culture-life/reports/2026-11-culture-life.html"}}}, "regional-info": {"name": "地区信息", "dir": "13-regional-info", "months": {"2026-11": {"title": "日本地域信息 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本地域信息--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本地域信息 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：市场指标监测型（market-monitoring）\n<strong>受众定位<\/strong>：面向拟在日本选择就业地 / 定居地、需要地域横向对比与决策框架的读者，兼具就业地选择与长期定居规划视角。\n<strong>来源规则<\/strong>：① 国土交通省（住居・地価統計）、総務省統計局（地域统计）、気象庁（警報・注意報 / 多言語防災気象情報）、防災庁（防灾政策与大规模灾情）、厚生労働省（医師・歯科医師・薬剤師統計）/ 文部科学省（外国人児童生徒调查）、各都道府県 / 市町村官网 ＞ ② HelloWork 地域检索、JETRO ＞ ③ 賃貸 / 生活门户（挂牌口径，仅预期指标）＞ ④ 地域媒体（business-config 第五节）。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、结论先行<\/a>\n<a href=\"#s2\">二、关键数字卡<\/a>\n<a href=\"#s3\">三、月度指标逐项对比<\/a>\n<a href=\"#s4\">四、信号灯判定<\/a>\n<a href=\"#s5\">五、与首期基线的偏离<\/a>\n<a href=\"#s6\">六、数据缺口与未核验项<\/a>\n<a href=\"#s7\">七、下期观察清单<\/a>\n<a href=\"#s8\">八、台账更新编号与来源<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一结论先行\" aria-hidden=\"true\"><\/a>一、结论先行<\/h2>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>本期为 2026-11 月度首跑，登记册（<a href=\"../data/regional_indicator_registry.md\">data/regional_indicator_registry.md<\/a>）全部追踪项复核如下：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:16%\">登记册项<\/th>\n<th style=\"width:16%\">指标<\/th>\n<th style=\"width:16%\">上期值（首期基线 2026-11-12）<\/th>\n<th style=\"width:16%\">本期值（2026-11-14）<\/th>\n<th style=\"width:16%\">变动<\/th>\n<th style=\"width:20%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>核心指标 #1<\/td>\n<td>目标地域司机求人件数<\/td>\n<td>待基线确立<\/td>\n<td>待基线确立<\/td>\n<td>无更新<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>核心指标 #2<\/td>\n<td>目标地域賃貸挂牌行情（预期指标）<\/td>\n<td>待基线确立<\/td>\n<td>待基线确立<\/td>\n<td>无更新<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>核心指标 #3<\/td>\n<td>目标地域外国人支援窗口<\/td>\n<td>待基线确立<\/td>\n<td>待基线确立<\/td>\n<td>无更新<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>核心指标 #4<\/td>\n<td>个人地域选定期<\/td>\n<td>待记录<\/td>\n<td>待记录<\/td>\n<td>无更新<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>观察项与触发器状态<\/td>\n<td>唯一观察项 / 首要触发器 / 触发器结论<\/td>\n<td>首期为空<\/td>\n<td>首期为空<\/td>\n<td>无更新<\/td>\n<td>本期无触发器命中，状态保持为空<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>登记册活值逐项抄录，未改写；「待基线确立 / 待记录」如实保留。<\/p>\n<\/blockquote>\n<h3 id=\"_3\"><a id=\"核心结论沿用首期基线\" aria-hidden=\"true\"><\/a>核心结论（沿用首期基线）<\/h3>\n<p><strong>结论 1<\/strong>：本主题当前处于「框架就绪、活值待建」状态。证据：7 维评分框架与决策流程已建立（<a href=\"../handbook/01-region-choice.md\">handbook/01-region-choice.md<\/a>）；登记册 #1–#4 均待基线确立 / 待记录。标注：事实。<\/p>\n<p><strong>结论 2<\/strong>：地域差在公共服务领域呈系统性存在。证据：病院一般病床 879,728 床（厚生労働省 令和 6 年医療施設調査，2024-10-01）；日本語指導が必要な児童生徒 84,759 人、其中外国籍 73,313 人、较上次 +27.0%（文部科学省，令和 7 年度）。标注：事实。<\/p>\n<p><strong>结论 3<\/strong>：横向比较须先固定口径，否则存在混算风险。证据：登记册口径清单列明登记口径 ≠ 挂牌口径、都道府県 ≠ 市町村、従業地 / 居住地口径须区分。标注：事实。<\/p>\n<p><strong>结论 4<\/strong>：不就学风险与日语指导资源存在地域差。证据：调查已全国实施但自治体间把握体制仍有差异；日语指导教室有无、教员配置密度因自治体差异大。标注：推断。<\/p>\n<p><strong>结论 5<\/strong>：候选地域速览为定性判断，不构成「最优地域」结论。证据：候选地域速览表（自述「待实地补充」）；business-config 第二节结论边界。标注：事实（属定性清单，非排名）。<\/p>\n<p><strong>结论 6<\/strong>：多语言防灾情报已具备国家级入口，自治体层登记动作待补齐。证据：气象厅多语言版、NHK WORLD-JAPAN 多语言链接可访问（2026-11-12 验证）；自治体防灾邮件 / LINE 具体渠道待定居地确定后复核。标注：事实 + 待办。<\/p>\n<h3 id=\"_4\"><a id=\"风险与不确定性\" aria-hidden=\"true\"><\/a>风险与不确定性<\/h3>\n<ul>\n<li>登记册 4 项活值均未建立，报告无法给出数值化地域对比。<\/li>\n<li>门户数据为预期指标，不等于实际成交 / 登记值。<\/li>\n<li>统计域口径（都道府県 vs 市町村、従業地 vs 居住地）未固定前，地域差解读存在混算风险。<\/li>\n<li>基线报告遗留项：无顶部导航（本期已由 md2html 渲染管线统一生成，见第五节）。<\/li>\n<li>个人定居地档案为空白模板，个人地域选择尚未记录。<\/li>\n<\/ul>\n<h3 id=\"_5\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告已修正事实清单，无新增修正。历史已闭环复核项：病床数取令和 6 年医療施設調査（病院一般病床 879,728 床）；NHK WORLD-JAPAN 多语言入口已确认可访问；日语指导调查数值取令和 7 年度（外国籍 73,313 人）。<\/p>\n<h2 id=\"s2\"><a id=\"二关键数字卡\" aria-hidden=\"true\"><\/a>二、关键数字卡<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:16%\">#<\/th>\n<th style=\"width:16%\">指标<\/th>\n<th style=\"width:16%\">最新读数<\/th>\n<th style=\"width:16%\">来源机构<\/th>\n<th style=\"width:16%\">统计周期 / 时点<\/th>\n<th style=\"width:20%\">核验状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>目标地域司机求人件数<\/td>\n<td>待基线确立<\/td>\n<td>HelloWork 地域检索<\/td>\n<td>逐次运行<\/td>\n<td>未取得<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>目标地域賃貸挂牌行情（预期指标）<\/td>\n<td>待基线确立<\/td>\n<td>賃貸门户<\/td>\n<td>逐次运行<\/td>\n<td>未取得<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>目标地域外国人支援窗口<\/td>\n<td>待基线确立<\/td>\n<td>自治体官网<\/td>\n<td>逐次运行<\/td>\n<td>未取得<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人地域选定期<\/td>\n<td>待记录<\/td>\n<td>自记录<\/td>\n<td>—<\/td>\n<td>未记录<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>病院的一般病床（全国）<\/td>\n<td>879,728 床<\/td>\n<td>厚生労働省 令和 6 年医療施設調査<\/td>\n<td>2024-10-01<\/td>\n<td>已核验<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>日本語指導が必要な児童生徒（公立）<\/td>\n<td>84,759 人<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年度<\/td>\n<td>已核验<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>其中外国籍<\/td>\n<td>73,313 人（较上次 +27.0%）<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年度<\/td>\n<td>已核验<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>外国人儿童就学把握体制<\/td>\n<td>第 6 回调查已全国实施（自治体间把握体制仍有差异）<\/td>\n<td>文部科学省<\/td>\n<td>令和 7 年 5 月 1 日现在<\/td>\n<td>已核验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>读数解读：#1–#4 为登记册核心监测指标，活值尚未建立；#5–#8 为公共服务地域差视角的已核验官方数值，仅作横向对比入口，不构成地域排名。\n口径提醒：登记口径（地価公示）≠ 挂牌口径（賃貸门户）；预期指标 ≠ 实际成交 / 登记值；都道府県 ≠ 市町村。<\/p>\n<\/blockquote>\n<h2 id=\"s3\"><a id=\"三月度指标逐项对比\" aria-hidden=\"true\"><\/a>三、月度指标逐项对比<\/h2>\n<h3 id=\"_8\"><a id=\"监测范围与跨主题分工\" aria-hidden=\"true\"><\/a>监测范围与跨主题分工<\/h3>\n<p><strong>含<\/strong>（business-config 3.1）：地域选择框架（7 维评分框架、候选地域速览、决策流程）；地域间公共服务差异视角（医疗资源地域差、教育资源地域差）；地域生活笔记（定居地档案模板、生活发现、防灾与安全、地域防灾情报渠道、季度观察）。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>地域选择框架中的薪资地域差<\/td>\n<td><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a><\/td>\n<\/tr>\n<tr>\n<td>求职渠道地域策略<\/td>\n<td><a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a><\/td>\n<\/tr>\n<tr>\n<td>保险体系与就医流程细节<\/td>\n<td><a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life<\/a><\/td>\n<\/tr>\n<tr>\n<td>就学手续与学制细节<\/td>\n<td><a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a><\/td>\n<\/tr>\n<tr>\n<td>灾害时外国人支援政策环境<\/td>\n<td><a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a><\/td>\n<\/tr>\n<tr>\n<td>岗位密度 / 薪资地域差活值<\/td>\n<td><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读引用）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_9\"><a id=\"监测维度与优先来源\" aria-hidden=\"true\"><\/a>监测维度与优先来源<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位供给<\/td>\n<td>目标地域在招司机岗位密度<\/td>\n<td>核心指标 #1<\/td>\n<td>HelloWork 地域检索<\/td>\n<td>季度窗口 + 月度触发核对<\/td>\n<\/tr>\n<tr>\n<td>居住成本<\/td>\n<td>目标地域挂牌租金水平（预期指标）<\/td>\n<td>核心指标 #2<\/td>\n<td>賃貸门户<\/td>\n<td>季度窗口采集<\/td>\n<\/tr>\n<tr>\n<td>外国人支援<\/td>\n<td>自治体外籍支援窗口与多语服务可得性<\/td>\n<td>核心指标 #3<\/td>\n<td>自治体官网<\/td>\n<td>季度触发（制度变化）<\/td>\n<\/tr>\n<tr>\n<td>公共服务地域差<\/td>\n<td>医师数 / 病床数 / 日语指导体制的地域差<\/td>\n<td>—（登记册未设独立指标，由差异视角小节承载）<\/td>\n<td>厚生労働省 / 文部科学省 / e-stat<\/td>\n<td>季度触发（统计年度发布）+ 年度<\/td>\n<\/tr>\n<tr>\n<td>个人地域选定期<\/td>\n<td>自记录决策时点与定居复盘<\/td>\n<td>核心指标 #4<\/td>\n<td>自记录<\/td>\n<td>Offer 比较 / 定居后复盘触发即时核对<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"7\"><a id=\"决策框架速览7-维评分与候选地域\" aria-hidden=\"true\"><\/a>决策框架速览（7 维评分）与候选地域<\/h3>\n<p>评分框架（每地打分 1–5，详见 <a href=\"../handbook/01-region-choice.md\">handbook/01-region-choice.md<\/a>）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">维度<\/th>\n<th style=\"width:33%\">权重<\/th>\n<th style=\"width:34%\">关键问题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位供给<\/td>\n<td>×3<\/td>\n<td>特定技能+干线岗位多吗？有 2 号移行先例的公司吗？<\/td>\n<\/tr>\n<tr>\n<td>薪资×成本<\/td>\n<td>×3<\/td>\n<td>名义薪资 − 房租/物价 = 可支配多少？<\/td>\n<\/tr>\n<tr>\n<td>外国人支援<\/td>\n<td>×2<\/td>\n<td>自治体窗口、多语医疗、日语教室<\/td>\n<\/tr>\n<tr>\n<td>同胞/前辈密度<\/td>\n<td>×1<\/td>\n<td>太少孤独，太多竞争——中间为佳<\/td>\n<\/tr>\n<tr>\n<td>交通/归国便利<\/td>\n<td>×1<\/td>\n<td>国际机场、港口<\/td>\n<\/tr>\n<tr>\n<td>灾害风险<\/td>\n<td>×1<\/td>\n<td>地震带/洪水地图/豪雪<\/td>\n<\/tr>\n<tr>\n<td>生活品质<\/td>\n<td>×1<\/td>\n<td>自然、育儿、医疗资源（长期定居视角）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>候选地域速览（定性，待实地补充）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">地域<\/th>\n<th style=\"width:33%\">优势<\/th>\n<th style=\"width:34%\">注意<\/th>\n<\/tr>\n<\/thead>\n<tb
