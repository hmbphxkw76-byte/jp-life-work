\/strong>：843 人 / 上限 22,100 / 充足率 3.8%（2026-08 末速报）<\/td>\n<td>https://www.moj.go.jp/isa/content/001472175.pdf<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>仍待跟踪（未解决）：<\/p>\n<ol>\n<li><strong>ssw.go.jp 中文页 24,500 人<\/strong>何时更正（月度检查）<\/li>\n<li><strong>B1 要求在留资格变更·更新的适用时间<\/strong>（ISA 公告）<\/li>\n<li><strong>外食业\"目前已停止接收\"<\/strong>的正式依据与适用范围（ssw.go.jp CN 页标注，未见 ISA 公告，待复核）<\/li>\n<\/ol>\n<h5 id=\"2026-11-11-45\">2026-11-11（阶段 4/5 长期路径重做）<\/h5>\n<ul>\n<li>05 第五节重写为三条路径：技人国（需学位或 10 年经验）、补学历后技人国、高度专门职（70 分门槛）；补充积分表与 Y1–Y5 时间表。<\/li>\n<li>07 备选路径表与行动清单同步；README 阶段 4/5 加入门槛与时点。<\/li>\n<li>结论：<strong>技人国是唯一现实主线<\/strong>；高度专门职在无学位时基本不可达（推断）。<\/li>\n<li>个案收敛（本科·相关专业 / 经验 &lt;3 年 / 30 岁以下）：<strong>走路径 A，无需补学历<\/strong>；Y4 前提交技人国变更，Y10 永住。动作表见 05 的 5.5。<\/li>\n<\/ul>\n<blockquote>\n<p>无实质变化的文档：04（仅新增签证费）。未虚构空窗期变化。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"01\">01 特定技能制度概览<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。日本官方制度更新频繁，执行前务必以出入国在留管理厅（ISA）官网最新公告为准。<\/p>\n<\/blockquote>\n<h4 id=\"_17\">一、制度定位<\/h4>\n<p>「特定技能」是为解决日本劳动力短缺而设立的就劳型在留资格，2019 年 4 月起施行，依据《出入国管理及び難民認定法》第 2 条の 5。<\/p>\n<ul>\n<li>官方综合网站：https://www.ssw.go.jp（有中文版）<\/li>\n<li>出入国在留管理厅：https://www.moj.go.jp/isa<\/li>\n<\/ul>\n<h4 id=\"1-2\">二、1 号与 2 号对比<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">特定技能 1 号<\/th>\n<th style=\"width:34%\">特定技能 2 号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.ssw.go.jp/cn/about/visa/\" title=\"来源：https://www.ssw.go.jp/cn/about/visa/, 2026\">适用行业<\/a><\/td>\n<td><strong>19 个指定分野<\/strong>（含自动车运送业）<\/td>\n<td><strong>11 个分野<\/strong>（<strong>不含自动车运送业、铁道、林业、木材产业<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>在留期间<\/td>\n<td>各 1 年/6 个月/4 个月，更新不超过上限（自动车运送业为 5 年）<\/td>\n<td>3 年/1 年/6 个月，可无限更新<\/td>\n<\/tr>\n<tr>\n<td>家族带同<\/td>\n<td>原则不可（例外：同等要件相当者等）<\/td>\n<td>可以（配偶者 + 子）<\/td>\n<\/tr>\n<tr>\n<td>技能要求<\/td>\n<td>各分野技能评价试验合格<\/td>\n<td>2 号评价试验合格 + 实务经验要件<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\" title=\"来源：https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026；https://www.moj.go.jp/isa/03_00198.html, 2026\">日语要求<\/a><\/td>\n<td>卡车：JFT-Basic（A2.2 相当）或 JLPT N4 以上；出租车·巴士：JLPT N3 以上且须 B1 相当以上（满足受入机关条件时可用 JFT-Basic/N4 替代）<\/td>\n<td>原则上 <strong>B1 相当以上<\/strong>（自 2027-04-01 起的 COE 申请适用；变更·更新待公告）<\/td>\n<\/tr>\n<tr>\n<td>支援义务<\/td>\n<td>接受机关/登录支援机关须提供生活支援<\/td>\n<td>无强制支援义务（自主自立）<\/td>\n<\/tr>\n<tr>\n<td>申请机关<\/td>\n<td>由企业申请，行业主管省厅审查（自动车运送业 = 国土交通省）<\/td>\n<td>同左<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"1-19-2-11\">三、主要分野一览（1 号 19 分野 / 2 号 11 分野）<\/h4>\n<p><strong>特定技能 1 号（19 分野）<\/strong>：介护、ビルクリーニング、工业制品制造业、建设、造船・舶用工业、自动车整备、航空、宿泊、<strong>自动车运送业<\/strong>、铁道、农业、渔业、饮食料品制造业、外食业、林业、木材产业、资源循环、リネンサプライ、物流仓库 [Source: https://www.ssw.go.jp/cn/about/visa/, 2026]<\/p>\n<p><strong>特定技能 2 号（11 分野）<\/strong>：ビルクリーニング、建设、工业制品制造业、造船・舶用工业、自动车整备、航空、宿泊、农业、渔业、饮食料品制造业、外食业 [Source: 同上, 2026]<\/p>\n<blockquote>\n<p><strong>关键限制<\/strong>：<strong>自动车运送业只有 1 号，没有 2 号<\/strong>（铁道、林业、木材产业同样无 2 号）。ISA 统计中该分野的 2 号在留者数为空 [Source: https://www.moj.go.jp/isa/content/001472175.pdf, 2026]。因此司机路线的 5 年上限之后<strong>不能靠 2 号延续<\/strong>，须另寻在留资格（详见 <a href=\"#05-特定技能2号与升级路径\">05<\/a>）。<\/p>\n<p>备注：2024 年（令和 6 年）起 <strong>自动车运送业<\/strong> 新加入 1 号对象；2 号未随之扩大到该分野。<\/p>\n<\/blockquote>\n<h4 id=\"_18\">四、与其他在留资格的关系<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">在留资格<\/th>\n<th style=\"width:50%\">与本规划的关系<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>技能実習 → 育成就労<\/td>\n<td>技能实习将自 2027 年 4 月被「育成就労」取代；育成就劳原则上以 3 年内移行至特定技能为目标。详见 <a href=\"#06-育成就劳制度与新动向\">06-育成就劳制度与新动向<\/a><\/td>\n<\/tr>\n<tr>\n<td>特定技能 1 号<\/td>\n<td>初期入场路径（司机岗位）<\/td>\n<\/tr>\n<tr>\n<td>特定技能 2 号<\/td>\n<td>中期升级路径，可无限更新、可带家属<\/td>\n<\/tr>\n<tr>\n<td>技術・人文知識・国際業務<\/td>\n<td>若后期转向物流技术/数字化岗位的备选资格（需大专以上学历或相应实务经验）<\/td>\n<\/tr>\n<tr>\n<td>永住者<\/td>\n<td>长期定居终点。详见 <a href=\"#07-永住与长期在留规划\">07-永住与长期在留规划<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_19\">五、与本项目路线图的对应<\/h4>\n<ul>\n<li>阶段 1（准备与入场）：理解 1 号要求 → <a href=\"#02-特定技能1号-自动车运送业\">02-特定技能1号-自动车运送业<\/a>、<a href=\"#03-考试与日语要求\">03-考试与日语要求<\/a><\/li>\n<li>阶段 2（司机岗位落地）：维持更新、遵守在留管理义务 → <a href=\"#04-申请流程与材料\">04-申请流程与材料<\/a><\/li>\n<li>阶段 3–5（管理岗/技术岗/永住）：→ <a href=\"#05-特定技能2号与升级路径\">05-特定技能2号与升级路径<\/a>、<a href=\"#07-永住与长期在留规划\">07-永住与长期在留规划<\/a><\/li>\n<\/ul>\n<h4 id=\"_20\">参考<\/h4>\n<ul>\n<li>特定技能制度概况：https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html<\/li>\n<li>汽车运送业分野官方页（中文）：https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/<\/li>\n<\/ul>\n<hr />\n<h3 id=\"02-1-\">02 特定技能1号-自动车运送业<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11（动态更新核验）；2026-11-12（验证运行：修正 2 号移行表述、中文页口径标注、补充健康检查说明）。数值以 ISA 日文页为准；中文支援站未同步处标注为线索。<\/p>\n<\/blockquote>\n<h4 id=\"_21\">一、业务范围<\/h4>\n<p>事业用（营业用）车辆的驾驶及相关业务：<\/p>\n<ol>\n<li>事业用汽车（<strong>卡车<\/strong>）驾驶及驾驶相关各类业务<\/li>\n<li>事业用汽车（<strong>出租车<\/strong>）驾驶及驾驶相关各类业务<\/li>\n<li>事业用汽车（<strong>巴士<\/strong>）驾驶及驾驶相关各类业务<\/li>\n<\/ol>\n<p>职位说明书：https://www.moj.go.jp/isa/applications/ssw/10_00179.html<\/p>\n<p><strong>本项目定位<\/strong>：以卡车驾驶（配送司机/仓储运输）为主路径，门槛最低（N4 即可）。<\/p>\n<h4 id=\"_22\">二、接收上限<\/h4>\n<ul>\n<li>自动车运送业分野接收上限：<strong>22,100 人<\/strong>（至 2029 年 3 月末＝令和 11 年 3 月末）[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/li>\n<li><strong>中文站未同步（以 22,100 为准）<\/strong>：特定技能综合支援站日/中文页仍显示 24,500 人（2024-04～2029-03），未随 2026-01-23 閣議決定后的分野别运用方针同步 [Source: https://www.ssw.go.jp/about/visa/automobile_transportation_business_1/, 2026；https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/, 2026]。<strong>本库一律采用 ISA 运用方针 22,100 人<\/strong>；中文页 24,500 仅作未同步线索，不作为并列口径。<\/li>\n<li>后续是否延长需跟踪国交省/ISA 公告 → 记入 <a href=\"#09-政策更新日志\">09-政策更新日志<\/a><\/li>\n<\/ul>\n<h4 id=\"_23\">三、人才基准（合格要件）<\/h4>\n<h5 id=\"_24\">技能水平<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">岗位<\/th>\n<th style=\"width:50%\">要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车<\/td>\n<td>汽车运送业分野特定技能 1 号评价试验（卡车）+ <strong>第一种驾驶执照<\/strong><\/td>\n<\/tr>\n<tr>\n<td>出租车<\/td>\n<td>评价试验（出租车）+ <strong>第二种驾驶执照<\/strong> + 新任驾驶员研修<\/td>\n<\/tr>\n<tr>\n<td>巴士<\/td>\n<td>评价试验（巴士）+ <strong>第二种驾驶执照<\/strong> + 新任驾驶员研修<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h5 id=\"_25\">日语能力<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">岗位<\/th>\n<th style=\"width:50%\">要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车<\/td>\n<td>JFT-Basic（国际交流基金日本语基础测试）或 JLPT <strong>N4 以上<\/strong><\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\" title=\"来源：https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026\">出租车<\/a><\/td>\n<td>JLPT <strong>N3 以上<\/strong>（须判定为 CEFR <strong>B1 相当以上<\/strong>）；受入机关落实第 9、10 项措施时，可用 JFT-Basic（A2.2 相当）或 JLPT <strong>N4<\/strong> 替代<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\" title=\"来源：https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026\">巴士<\/a><\/td>\n<td>同出租车（替代情形为第 9、10 <strong>或 11<\/strong> 项措施）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>过渡期（重要）<\/strong>：自 2027-04-01（令和 9 年 4 月 1 日）起提交的在留资格认定证明书（COE）申请，出租车·巴士区分须「B1 相当以上」；在留资格变更·期间更新申请的适用时间仍在检讨中 [Source: https://www.moj.go.jp/isa/03_00198.html, 2026]。<\/p>\n<\/blockquote>\n<h5 id=\"_26\">驾照注意事项（重要）<\/h5>\n<ul>\n<li>考试受验时只需持有有效的日本或外国驾照（含中国驾照，需通过外免切替或在国内考取）<\/li>\n<li>在日本实际从事事业用驾驶，需把外国驾照<strong>切换为日本驾照（外免切替）<\/strong>或在日本重新考取<\/li>\n<li>第一种驾照 AT 限定即可，但入行后视车种可能需要 MT 及限定解除<\/li>\n<li>出租车/巴士需第二种驾照（难度更高），初期不建议作为第一跳板<\/li>\n<li><strong>健康检查<\/strong>：本分野<strong>无健康检查义务<\/strong>（现行运用方针别纸 10 全 11 项课加条件中无健康检查条文）；唯一健康相关项为出租车/巴士新任驾驶员研修内的「適性診断」（旅客自動車運送事業運輸規則第 38 条第 2 項，驾驶适性诊断，非健康检查）[Source: https://www.moj.go.jp/isa/content/001473135.pdf, 2026]<\/li>\n<\/ul>\n<h4 id=\"classnk-portal\">四、受验资格（评价试验，ClassNK Portal）<\/h4>\n<p>依据 ClassNK 考试门户（https://sswt-portal.classnk.or.jp/area?tab=3）：<\/p>\n<ol>\n<li>受验日满 <strong>17 岁<\/strong>（印度尼西亚考场为 18 岁）<\/li>\n<li>持有有效的日本或外国取得的自动车驾驶执照<\/li>\n<li>无日本国籍<\/li>\n<li>在日本国内受验时，须持有在留资格<\/li>\n<li>退去强制令书等合规限制不适用者<\/li>\n<\/ol>\n<h5 id=\"_27\">考试构成（卡车）<\/h5>\n<ul>\n<li><strong>知识试<\/strong>：50 题笔试，<strong>45 题以上正确<\/strong>为合格（运转经历、知识、技能、视力等检查构成）<\/li>\n<li><strong>技能试<\/strong>：考试场实技运转<\/li>\n<li>语言支持：笔试提供多语种（含中文），报名与考场信息以 ClassNK Portal 为准<\/li>\n<\/ul>\n<h4 id=\"_28\">五、接受机关侧要件（就业前需确认雇主满足）<\/h4>\n<ul>\n<li>企业须持有国土交通省「特定技能受入计划书」的认定（分野主管：国交省）<\/li>\n<li>须加入国土交通省设置的「自動車運送業分野特定技能協議会」，并配合国交省及其委托方的调查与指导 [Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/li>\n<li>卡车受入机关须取得 ClassNK「運転者職場環境良好度認証制度」认证，或拥有全国货物自动车运送适正化事业实施机关（全ト協）认定的<strong>安全性优良事业所（G マーク）<\/strong> [Source: 同上, 2026]<\/li>\n<li>雇佣契约需满足与日本人同等的工资待遇、遵守货物运输/劳动相关法规<\/li>\n<li>企业需履行 1 号外国人生活支援义务（住宅、生活 Orientación、定期面谈等），可委托登录支援机关<\/li>\n<\/ul>\n<h4 id=\"_29\">六、申请流程概览<\/h4>\n<ol>\n<li>通过评价试验 + 取得日语资格（本文件第三节）<\/li>\n<li>与雇主签订雇佣契约<\/li>\n<li>雇主向国土交通省申请「特定技能 1 号受入计划书」认定<\/li>\n<li>本人申请在留资格认定证明书（海外申请）或在留资格变更/更新（国内）<\/li>\n<li>领取签证/更新在留卡<\/li>\n<\/ol>\n<p>详细材料清单 → <a href=\"#04-申请流程与材料\">04-申请流程与材料<\/a><\/p>\n<h4 id=\"_30\">七、在留期间与上限<\/h4>\n<ul>\n<li>每次在留期间：1 年/6 个月/4 个月<\/li>\n<li>自动车运送业 1 号总在留上限：<strong>5 年<\/strong><\/li>\n<li><strong>本分野无 2 号<\/strong>（2 号仅 11 分野）：满 5 年前须切换其他在留资格（技人国／高度专门职等），详见 <a href=\"#05-特定技能2号与升级路径\">05-特定技能2号与升级路径<\/a> 第五节<\/li>\n<\/ul>\n<h4 id=\"_31\">参考<\/h4>\n<ul>\n<li>ISA 自動車運送業分野：https://www.moj.go.jp/isa/policies/ssw/automobiletransportation<\/li>\n<li>中文官方说明：https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/<\/li>\n<li>ClassNK 试验 Portal：https://sswt-portal.classnk.or.jp/area?tab=3<\/li>\n<li>日本大使馆资料（考试构成）：https://www.vn.emb-japan.go.jp/files/100989367.pdf<\/li>\n<\/ul>\n<hr />\n<h3 id=\"03\">03 考试与日语要求<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11<\/p>\n<\/blockquote>\n<h4 id=\"_32\">一、两条考试线<\/h4>\n<p>以卡车驾驶为目标，需同时达成：<\/p>\n<ol>\n<li><strong>技能线<\/strong>：汽车运送业分野特定技能 1 号评价试验（卡车）<\/li>\n<li><strong>日语线<\/strong>：JFT-Basic 或 JLPT N4 以上<\/li>\n<\/ol>\n<h4 id=\"_33\">二、技能评价试验（卡车）<\/h4>\n<h5 id=\"_34\">受验资格<\/h5>\n<ul>\n<li>满 17 岁（印尼考场 18 岁）<\/li>\n<li>有效驾照（日本或外国均可；中国驾照可用，但需在国内先换证/认证状态良好）<\/li>\n<li>无日本国籍<\/li>\n<li>国内受验需有在留资格<\/li>\n<\/ul>\n<h5 id=\"_35\">考试内容<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">部分<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">合格线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>知识试（笔试）<\/td>\n<td>50 题：驾驶知识、安全、法规、运转经历相关<\/td>\n<td><strong>45 题以上正确<\/strong><\/td>\n<\/tr>\n<tr>\n<td>技能试（实技）<\/td>\n<td>考试场实技驾驶操作<\/td>\n<td>实技评分合格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h5 id=\"_36\">报名与实施<\/h5>\n<ul>\n<li>实施机关：ClassNK（一般财团法人日本海事协会）考试 Portal<\/li>\n<li>国内考场：日本国内 + 海外若干国家（以 Portal 公告为准）<\/li>\n<li>报名入口：https://sswt-portal.classnk.or.jp/area?tab=3<\/li>\n<li>考试语言：笔试支持多语种（含中文）<\/li>\n<li>费用：日本国内 <strong>6,500 円（税抜）<\/strong>、海外 <strong>45 美元<\/strong>（部分国家按当地规定为 50 美元）[Source: https://sswt-portal.classnk.or.jp/news/25, 2026]；合格证明书发行手续费另计<\/li>\n<li>日程：CBT 无固定考日，测试中心有空位即可预约 [Source: https://sswt-portal.classnk.or.jp/area?tab=3, 2026]<\/li>\n<\/ul>\n<h4 id=\"_37\">三、日语考试<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">考试<\/th>\n<th style=\"width:33%\">特点<\/th>\n<th style=\"width:34%\">对应要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>JFT-Basic<\/strong><\/td>\n<td>国际交流基金主办，CBT 机考，全年多场次，出分快（推荐）<\/td>\n<td>满足卡车路径要求<\/td>\n<\/tr>\n<tr>\n<td><strong>JLPT N4<\/strong><\/td>\n<td>每年 7 月/12 月两次，海外考点多<\/td>\n<td>满足卡车路径要求<\/td>\n<\/tr>\n<tr>\n<td>JLPT N3<\/td>\n<td>出租车/巴士路径要求（须 <strong>B1 相当以上<\/strong>；2027-04-01 起的 COE 申请适用）<\/td>\n<td>中期可提升<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>JFT-Basic 官网：https://jft-basic.jp<\/li>\n<li>JLPT 官网：https://www.jlpt.jp<\/li>\n<li>JFT-Basic 日本国内受験料 <strong>10,000 円<\/strong>，海外按国别不同 [Source: https://www.prometric-jp.com/ssw/exam/fee/, 2026]<\/li>\n<li>JLPT 中国考区：N3/N4/N5 <strong>450 元<\/strong>、N1/N2 550 元 [Source: https://jlpt.neea.edu.cn/faq.html, 2026]<\/li>\n<li>出租车·巴士的 B1 要求与 N4 替代条件，见 <a href=\"#02-特定技能1号-自动车运送业\">02-特定技能1号-自动车运送业<\/a> 第三节 [Source: https://www.moj.go.jp/isa/03_00198.html, 2026]<\/li>\n<\/ul>\n<p><strong>建议策略（2026-11 修订）<\/strong>：中国大陆没有 JFT-Basic 考点，国内只能考 JLPT → <strong>主攻 JLPT N4<\/strong>（2027 年 7 月场）；JFT-Basic 作为赴日后或顺路出境时的 CBT 备用选项（与 N4 同等有效）。详细备考计划 → <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.html#01-总体学习路线与考试选择\">11-日语学习 · 01-总体学习路线与考试选择<\/a><\/p>\n<h4 id=\"1\">四、备考顺序建议（与阶段 1 对齐）<\/h4>\n<ol>\n<li>日语达到 N4 稳定水平（约 300–600 学习小时）<\/li>\n<li>报名 ClassNK 评价试验，用官方样题练习<\/li>\n<li>通过技能试后尽快锁定雇主（考试合格有有效期的可能性需确认当期规则）<\/li>\n<li>雇主启动受入计划书认定，同步办理驾照外免切替或在日考照准备<\/li>\n<\/ol>\n<h4 id=\"_38\">五、驾照规划<\/h4>\n<ul>\n<li><strong>外免切替<\/strong>：中国驾照可在日本免试换发（知识试 10 题 + 场内技能试），通过率视地区而定<\/li>\n<li>若无本国驾照：在日本直接考取第一种驾照（学费约 25–35 万日元，合宿制约 20–30 万日元）<\/li>\n<li>事业用驾驶需通过雇主实施的<strong>日常・定期训练<\/strong>与驾驶前点名（点呼）制度<\/li>\n<\/ul>\n<h4 id=\"_39\">参考<\/h4>\n<ul>\n<li>ClassNK Portal 受验资格：https://sswt-portal.classnk.or.jp/area?tab=3<\/li>\n<li>ISA 人材基准：https://www.moj.go.jp/isa/policies/ssw/automobiletransportation<\/li>\n<\/ul>\n<hr />\n<h3 id=\"04\">04 申请流程与材料<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。材料清单为通用模板，实际以 ISA 及国土交通省当期格式为准。<\/p>\n<\/blockquote>\n<h4 id=\"_40\">一、两条申请路径<\/h4>\n<h5 id=\"a\">路径 A：海外直接申请（中国国内 → 日本）<\/h5>\n<ol>\n<li>在中国完成：评价试验（如本国设考场）或赴日/赴第三国受验 + JFT-Basic/JLPT N4<\/li>\n<li>与日本雇主签订雇佣契约<\/li>\n<li>雇主向国土交通省申请「特定技能 1 号受入计划书」认定<\/li>\n<li>雇主（或行政书士）代理本人向地方出入国在留管理局申请<strong>在留资格认定证明书（COE）<\/strong><\/li>\n<li>COE 寄回国内 → 向日本驻华使领馆（指定代办机构）申请签证；单次签证费 <strong>715 元<\/strong>（2026-07-01 起，代办机构另收手续费）[Source: https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html, 2026]<\/li>\n<li>入境，领取在留卡<\/li>\n<\/ol>\n<h5 id=\"b\">路径 B：国内移行（已持其他在留资格）<\/h5>\n<ul>\n<li>持技能实习（育成就劳）等资格者：完成同等技能·日语要件后，由雇主申请<strong>在留资格变更许可<\/strong><\/li>\n<li>2027 年育成就劳施行后，育成就劳 → 特定技能移行将成为主流通道（→ <a href=\"#06-育成就劳制度与新动向\">06-育成就劳制度与新动向<\/a>）<\/li>\n<\/ul>\n<h4 id=\"1_1\">二、申请材料清单（1 号·卡车）<\/h4>\n<h5 id=\"_41\">本人提供<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">材料<\/th>\n<th style=\"width:50%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留资格认定证明书交付申请书<\/td>\n<td>法务省指定格式<\/td>\n<\/tr>\n<tr>\n<td>护照复印件、证件照<\/td>\n<td>规格 4cm×3cm<\/td>\n<\/tr>\n<tr>\n<td>评价试验合格证明书<\/td>\n<td>ClassNK 发放<\/td>\n<\/tr>\n<tr>\n<td>日语能力证明<\/td>\n<td>JFT-Basic 成绩单或 JLPT 合格证书<\/td>\n<\/tr>\n<tr>\n<td>驾照复印件<\/td>\n<td>外国驾照需附翻译（日本自动车联盟 JAF 等）<\/td>\n<\/tr>\n<tr>\n<td>履历书<\/td>\n<td>记载学历、职历、驾驶经历<\/td>\n<\/tr>\n<tr>\n<td>返纳保证书等承诺文件<\/td>\n<td>指定格式<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h5 id=\"_42\">雇主提供<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">材料<\/th>\n<th style=\"width:50%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特定技能 1 号受入计划书认定证明<\/td>\n<td>国土交通省发放<\/td>\n<\/tr>\n<tr>\n<td>雇佣契约书复印件<\/td>\n<td>明示工资、工时、与日本人同等待遇<\/td>\n<\/tr>\n<tr>\n<td>支援计划书 + 支援实绩相关文件<\/td>\n<td>本人实施或委托登录支援机关<\/td>\n<\/tr>\n<tr>\n<td>公司登记事项证明书、损益计算书等<\/td>\n<td>证明经营稳定性<\/td>\n<\/tr>\n<tr>\n<td>雇用保险・社保加入证明<\/td>\n<td>合规要件<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_43\">三、在留管理与更新义务（落地后）<\/h4>\n<ol>\n<li>在留卡随身携带；地址变更 14 日内报备市役所/入管<\/li>\n<li>每次在留期满前申请更新（1 年/6 个月/4 个月）<\/li>\n<li>无正当理由连续 3 个月不从事原业务 → 资格取消风险<\/li>\n<li>工资、考勤、社会保险记录需长期留存 → 作为 2 号移行与永住的<strong>证据链<\/strong>（→ <a href=\"#07-永住与长期在留规划\">07-永住与长期在留规划<\/a>）<\/li>\n<\/ol>\n<h4 id=\"_44\">四、常见拒签/不许可风险点<\/h4>\n<ul>\n<li>雇主受入计划书认定瑕疵（工资低于同业水平、违规前科）<\/li>\n<li>日语能力证明与实际沟通能力差距过大（面谈/审查环节）<\/li>\n<li>驾照翻译件不符合要求<\/li>\n<li>支援体制不落实（无登录支援机关且企业自办能力不足）<\/li>\n<\/ul>\n<h4 id=\"_45\">五、办理机构<\/h4>\n<ul>\n<li>申请代理：行政书士（雇主任名义人申请义务，费用一般由雇主承担）<\/li>\n<li>自助确认：地方出入国在留管理局及 ISA 官网<\/li>\n<li>自动车运送业分野政策咨询：国土交通省综合政策局<\/li>\n<\/ul>\n<h4 id=\"_46\">参考<\/h4>\n<ul>\n<li>ISA 特定技能申请页：https://www.moj.go.jp/isa/applications/ssw/<\/li>\n<li>特定技能综合支援站点（中文）：https://www.ssw.go.jp/cn/<\/li>\n<\/ul>\n<hr />\n<h3 id=\"05-2\">05 特定技能2号与升级路径<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11（复核修正）。依据 ISA「在留资格『特定技能』」总页、特定技能综合支援站分野清单及 2026-08 末统计。<\/p>\n<p><strong>重要更正（2026-11-11）<\/strong>：特定技能 2 号仅覆盖 <strong>11 个分野<\/strong>，<strong>自动车运送业不在其中<\/strong>（铁道、林业、木材产业同样没有 2 号）[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]。ISA 统计中该分野 2 号在留者数为空 [Source: https://www.moj.go.jp/isa/content/001472175.pdf, 2026]；国交省只公布「自动车运送业分野特定技能<strong>1 号<\/strong>评价试验实施要领」，无 2 号试验。结论：<strong>「1 号司机 → 2 号」路径目前不存在<\/strong>。以下第二～四节为 2 号制度通则，仅供\"转入可适用 2 号的分野\"时参考；司机主线的长期方案见第五节。<\/p>\n<\/blockquote>\n<h4 id=\"2\">一、为什么升级 2 号（通则）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">维度<\/th>\n<th style=\"width:33%\">1 号<\/th>\n<th style=\"width:34%\">2 号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留上限<\/td>\n<td>自动车运送业 5 年<\/td>\n<td><strong>无上限<\/strong>（3 年/1 年/6 个月更新）<\/td>\n<\/tr>\n<tr>\n<td>家属<\/td>\n<td>原则不可<\/td>\n<td><strong>可带配偶与子女<\/strong><\/td>\n<\/tr>\n<tr>\n<td>支援义务<\/td>\n<td>企业强制支援<\/td>\n<td>无（自主生活）<\/td>\n<\/tr>\n<tr>\n<td>永住衔接<\/td>\n<td>5 年不够 10 年门槛<\/td>\n<td>可持续积累永住所需在留年数<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>对长期定居规划而言，<strong>2 号是从\"临时劳动力\"变为\"可定居劳动者\"的关键台阶<\/strong>。<\/p>\n<blockquote>\n<p>对本主线：上述优势<strong>无法通过司机分野取得<\/strong>——自动车运送业的 1 号到期即为上限。见第五节。<\/p>\n<\/blockquote>\n<h4 id=\"_47\">二、移行要件概要<\/h4>\n<p>依据 ISA（https://www.moj.go.jp/isa/applications/ssw/10_00001.html）：<\/p>\n<ol>\n<li><strong>前提<\/strong>：所属分野须为 2 号 11 分野之一（ビルクリーニング、建设、工业制品制造业、造船・舶用工业、自动车整备、航空、宿泊、农业、渔业、饮食料品制造业、外食业）。<strong>自动车运送业不符合<\/strong> [Source: https://www.ssw.go.jp/cn/about/visa/, 2026]<\/li>\n<li><strong>技能要件<\/strong>：2 号技能评价试验合格（各分野试验由行业团体实施）<\/li>\n<li><strong>实务要件<\/strong>：分野规定的实务经验（一般要求在 1 号业务上有一定年数的从事实绩，具体以该分野运用要领为准）<\/li>\n<li><strong>日语要件<\/strong>：<strong>B1 相当以上<\/strong>（2026-01-23 閣議決定后确定；自 2027-04-01 起提交的 COE 申请适用，在留资格变更·更新的适用时间待公告）[Source: https://www.moj.go.jp/isa/03_00198.html, 2026]<\/li>\n<li><strong>接受机关要件<\/strong>：雇主满足 2 号受入条件（审查更严）<\/li>\n<\/ol>\n<h4 id=\"_48\">三、移行手续要点<\/h4>\n<ul>\n<li>申请类型：在留资格变更（1 号 → 2 号）或特定活动（2 号移行准备期间的运用）<\/li>\n<li>由雇主提出；行业主管依分野而定（如自动车整备 = 国土交通省）<\/li>\n<li>实务经验认定：工资台账、勤务记录、雇用保险记录等书面证据 → <strong>平时留存证据是硬性要求<\/strong>（对应阶段 5 的\"证据链\"目标）<\/li>\n<\/ul>\n<h4 id=\"_49\">四、与永住规划的时间线（修正版）<\/h4>\n<pre><code class=\"language-text\">年 0             年 1–5                    年 5（1 号上限）\n入境 1 号   →   1 号更新（累计 ≤5 年）  →  必须切换其他在留资格\n<\/code><\/pre>\n<ul>\n<li>永住原则要件：<strong>连续 10 年在留，其中 5 年以上为就劳或受扶养身份<\/strong><\/li>\n<li>1 号的 5 年可计入 10 年在留，但<strong>无法靠 2 号续接<\/strong>；须在第 5 年前转入其他就労资格，且新资格需再满 5 年才够\"5 年就劳\"<\/li>\n<li>在留中断（回国超过再入国期限等）会重置连续性<\/li>\n<li><strong>推断<\/strong>：因此司机路线的现实永住时间线取决于第 5 年能否成功转换资格，而非自动延续<\/li>\n<\/ul>\n<h4 id=\"45-2\">五、长期路径重做（阶段 4/5，不依赖 2 号）<\/h4>\n<h5 id=\"51\">5.1 三条路径与可行性<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">路径<\/th>\n<th style=\"width:25%\">岗位<\/th>\n<th style=\"width:25%\">硬门槛<\/th>\n<th style=\"width:25%\">可行性<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/applications/status/gijinkoku.html\" title=\"来源：https://www.moj.go.jp/isa/applications/status/gijinkoku.html, 2026\"><strong>A. 技人国<\/strong>（首选）<\/a><\/td>\n<td>物流本社的运行管理、配车计划、仓配企划、对华业务<\/td>\n<td>① 大学（相关专业）毕业，<strong>或<\/strong> ② <strong>10 年<\/strong>相关实务经验（含在校相关科目期间）<\/td>\n<td>有学位或 10 年经验即可；司机经验须与转岗业务相关<\/td>\n<\/tr>\n<tr>\n<td><strong>B. 先补学历→技人国<\/strong>（兜底）<\/td>\n<td>同上<\/td>\n<td>通信制/海外大学（商科、物流、经营），2–4 年，可与 1 号并行<\/td>\n<td><strong>推断<\/strong>：无学位者最稳，但需提前 3–4 年启动<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/10_00279.html\" title=\"来源：https://www.moj.go.jp/isa/10_00279.html, 2026\"><strong>C. 高度专门职<\/strong><\/a><\/td>\n<td>技术/管理/研究<\/td>\n<td>积分 <strong>70 分<\/strong>（永住特例 70 分 3 年 / 80 分 1 年）<\/td>\n<td><strong>无学位时基本不可达<\/strong>（学历 0 分），有学位后再评估<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>补充：<strong>自动车整备<\/strong>分野有 2 号，但需重考该分野 1 号试验并转岗，成本高（推断），不作主线；<strong>经营・管理<\/strong>需事业实绩，不适合作为初期兜底。<\/p>\n<h5 id=\"52\">5.2 技人国的关键判定点<\/h5>\n<ul>\n<li><strong>岗位必须是\"白领\"业务<\/strong>：企划、管理、分析、翻译/海外业务；纯驾驶不属于技人国对象<\/li>\n<li><strong>专业相关性<\/strong>：学历专业或 10 年经验须与转岗业务相关（如物流管理、运行管理）<\/li>\n<li><strong>实务经验的算法<\/strong>：相关业务期间 + 在校相关科目专攻期间可合并计算；不要求 10 年都做同一岗位 [Source: https://www.moj.go.jp/isa/applications/status/gijinkoku.html, 2026]<\/li>\n<li><strong>日语<\/strong>：无法定等级，但语言类岗位需 CEFR B2 相当证明；实务上 N2 是转岗与审查的隐形门槛 [Source: 同上, 2026]<\/li>\n<\/ul>\n<h5 id=\"53\">5.3 高度人材积分（简化，仅列主要项）<\/h5>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">分值<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>学历<\/td>\n<td>博士 30 / 修士 20 / 大学 10<\/td>\n<td>无学位 = 0，是硬伤<\/td>\n<\/tr>\n<tr>\n<td>职历<\/td>\n<td>10 年 20 / 7–10 年 15 / 5–7 年 10<\/td>\n<td>须与从事业务相关<\/td>\n<\/tr>\n<tr>\n<td>年收<\/td>\n<td>约 400 万 10 起，500 万 15、600 万 20 …<\/td>\n<td>按年龄分档<\/td>\n<\/tr>\n<tr>\n<td>年龄<\/td>\n<td>30 未满 15 / 30–34 10 / 35–39 5<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>日语<\/td>\n<td>N1 15 / N2 10<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>计算例（<strong>推断<\/strong>）：大学 10 + 职历 5 年 10 + 年收 500 万 15 + 年龄 30–34 10 + N2 10 = <strong>55 分<\/strong>，未达 70。需靠更高年收、N1 或修士学位补足。<\/p>\n<\/blockquote>\n<h5 id=\"54-1-5\">5.4 时间表（与 1 号 5 年上限对齐）<\/h5>\n<pre><code class=\"language-text\">Y1–Y2           Y3                  Y4                    Y5（上限）\n日语 N2 / 岗位  →  转岗运行管理·企划  →  备齐学历/经验材料  →  完成资格变更\n积累管理经历       （决定成败）          提交技人国变更        （否则须离境）\nY6–Y10：新资格持续 5 年 + 收入/纳税/年金达标 → 永住申请\n<\/code><\/pre>\n<ul>\n<li><strong>最晚 Y4 提交变更<\/strong>：1 号累计上限 5 年，变更审查需数月，留出缓冲<\/li>\n<li><strong>若走路径 B<\/strong>：Y1 就要报名，否则 2–4 年学制赶不上 Y5<\/li>\n<li><strong>风险<\/strong>：转岗失败或岗位不被认定 → 无法变更，10 年连续性中断（<strong>推断<\/strong>）<\/li>\n<\/ul>\n<h5 id=\"55-3-30\">5.5 个案收敛（本科·相关专业 / 相关经验 &lt;3 年 / 30 岁以下）<\/h5>\n<p><strong>结论：路径 A 成立<\/strong>——学历已满足技人国要件，无需补学历（B 不启用）；高度人材当前不可达。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">年份<\/th>\n<th style=\"width:33%\">动作<\/th>\n<th style=\"width:34%\">完成判定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y0–Y1<\/td>\n<td>日语 N3→N2；取得第一种驾照；司机岗积累<\/td>\n<td>N2 合格、无事故记录<\/td>\n<\/tr>\n<tr>\n<td>Y1–Y2<\/td>\n<td>主动承担配车辅助、运行记录、异常处理；每月留档职责内容<\/td>\n<td>有书面职务说明<\/td>\n<\/tr>\n<tr>\n<td>Y2–Y3<\/td>\n<td>申请转岗至运行管理/仓配企划/对华业务；确认公司确有该岗位<\/td>\n<td>调岗通知或内定<\/td>\n<\/tr>\n<tr>\n<td>Y4<\/td>\n<td>备齐学位证、成绩单、在職証明、职务内容说明、公司概要；提交技人国变更<\/td>\n<td>提前 3–6 个月提交<\/td>\n<\/tr>\n<tr>\n<td>Y5<\/td>\n<td>完成变更（1 号 5 年上限前）<\/td>\n<td>取得技人国<\/td>\n<\/tr>\n<tr>\n<td>Y6–Y10<\/td>\n<td>技人国更新；收入、纳税、年金持续达标<\/td>\n<td>满 5 年就労<\/td>\n<\/tr>\n<tr>\n<td>Y10<\/td>\n<td>永住申请（连续 10 年，其中 5 年就労）<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>高度人材旁路（推断）<\/strong>：现时积分约 35–40 分（大学 10 + 职历 0–5 + 年收 10 + 年龄 15 + N2 10），不具条件。Y7 前后若年收达约 600–700 万日元并取得 N1，可接近 70 分（大学 10 + 职历 10 + 年收 20–25 + 年龄 10 + N1 15），届时可改走「70 分 3 年」特例，最早 Y8 申永住；80 分则 1 年。<\/p>\n<h4 id=\"345\">六、行动清单（对应阶段 3/4/5）<\/h4>\n<ul>\n<li>[x] 确认自动车运送业是否有 2 号 → <strong>已确认没有<\/strong>（2026-11-11）<\/li>\n<li>[x] 路径选定：<strong>A（技人国）<\/strong>，学历要件已满足，B 不启用（2026-11-11）<\/li>\n<li>[ ] 日语在 Y2 内达到 N2（技人国转岗与高度人材积分均需要）<\/li>\n<li>[ ] Y2–Y3 争取运行管理、配车计划、仓配企划等岗位，保留职务内容与业绩证据<\/li>\n<li>[ ] Y4 前完成技人国变更材料（学历证明/在職証明、职务内容说明、雇用契约）<\/li>\n<li>[ ] 每年归档：工资明细、源泉征收票、社保缴费记录、雇用保险<\/li>\n<li>[ ] 记录可量化业绩（准点率、事故率、管理人数、成本改善）作为转岗与实务能力证明<\/li>\n<\/ul>\n<h4 id=\"_50\">参考<\/h4>\n<ul>\n<li>特定技能 1 号/2 号分野清单（CN）：https://www.ssw.go.jp/cn/about/visa/<\/li>\n<li>ISA 统计（2026-08 末速报）：https://www.moj.go.jp/isa/content/001472175.pdf<\/li>\n<li>在留资格「特定技能」总页：https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html<\/li>\n<li>ISA 试验关系（仅有 1 号实施要领）：https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri01_00135.html<\/li>\n<\/ul>\n<hr />\n<h3 id=\"06\">06 育成就劳制度与新动向<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11；2026-11-12（验证运行：MOC 页面更新核验）。育成就劳（いくせいじゅうろう）是取代技能实习的新制度，与特定技能的衔接直接影响入场路径选择。<\/p>\n<\/blockquote>\n<h4 id=\"_51\">一、制度背景<\/h4>\n<ul>\n<li>2024 年（令和 6 年）6 月 21 日公布《入管法及び技能実習法改正法》<\/li>\n<li>技能实习制度（约 40 年历史）将被<strong>育成就劳制度<\/strong>取代<\/li>\n<li>目标：从\"人才移转\"转向\"<strong>人才培养与确保<\/strong>\"，外国人从入场起即有望长期在日工作<\/li>\n<\/ul>\n<h4 id=\"_52\">二、施行时间线（已确认）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时间<\/th>\n<th style=\"width:50%\">事项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2026-04-15<\/td>\n<td>监理支援机关许可申请受理开始<\/td>\n<\/tr>\n<tr>\n<td>2026-09-01<\/td>\n<td>育成就劳计划认定申请受理开始<\/td>\n<\/tr>\n<tr>\n<td>2026-10-09<\/td>\n<td><a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\" title=\"来源：https://www.moj.go.jp/isa/applications/index_00005.html, 2026\">运用要领新增 飲食料品製造業・資源循環 分野；改正 鉄道・木材産業 分野<\/a><\/td>\n<\/tr>\n<tr>\n<td>2026-10-13 / 10-20<\/td>\n<td><a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\" title=\"来源：https://www.moj.go.jp/isa/applications/index_00005.html\">育成就劳二国间协力备忘录（MOC）页面两次更新<\/a><\/td>\n<\/tr>\n<tr>\n<td>2026-10-16<\/td>\n<td><a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\" title=\"来源：https://www.moj.go.jp/isa/applications/index_00005.html\">运用要领新增 宿泊 分野<\/a><\/td>\n<\/tr>\n<tr>\n<td>2026-11-06<\/td>\n<td><a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\" title=\"来源：https://www.moj.go.jp/isa/applications/index_00005.html\">运用要领新增 漁業 分野<\/a><\/td>\n<\/tr>\n<tr>\n<td>2026-11-12<\/td>\n<td><a href=\"https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html\" title=\"来源：https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html, 2026\">育成就労二国間協力覚書（MOC）ページ更新<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>2027-04-01<\/strong><\/td>\n<td><strong>育成就劳制度施行<\/strong>（技能实习法废止/ replaced）<\/td>\n<\/tr>\n<tr>\n<td>2027-04-01<\/td>\n<td>特定技能 1 号支援体制要件改正（2026-07-28 公布）同步生效<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>来源：\n- ISA 育成就劳页更新信息：https://www.moj.go.jp/isa/applications/index_00005.html\n- ISA 特定技能更新信息（2026-07-28 两条公告）：https://www.moj.go.jp/isa/applications/ssw/\n- 施行日程说明：https://titp360.jp/words/nurturing-work/<\/p>\n<h4 id=\"_53\">三、核心机制<\/h4>\n<ol>\n<li><strong>与特定技能的衔接<\/strong>：育成就劳原则上以 <strong>3 年内移行至特定技能（1 号或 2 号）<\/strong> 为目标设计；技能与日语达标即可移行，无需再考同等试验（运用细节以分野运用于方针为准）<\/li>\n<li><strong>转职（换雇主）<\/strong>：条件放开——在育成阶段内可跨企业、跨地区转职（技能实习时代原则禁止）<\/li>\n<li><strong>监理支援机关<\/strong>：取代旧的监理团体，受严格许可制管理<\/li>\n<li><strong>家属<\/strong>：制度衔接特定技能 2 号后可带家属<\/li>\n<li><strong>接收国限定<\/strong>：育成就劳原则上仅从已与日本签署 MOC 的国家接收 [Source: https://www.otit.go.jp/employment_for_skill_development/05/, 2026]。<strong>口径区分（2026-11-12 核验）<\/strong>：ISA「育成就労に関する二国間の協力覚書」页（2026-11-12 更新）列 <strong>7 国<\/strong>（乌兹别克、斯里兰卡、泰国、孟加拉、越南、东帝汶、老挝）；OTIT「外国政府認定送出機関一覧」列 <strong>16 国<\/strong>，其中含「暫定リスト」国（MOC 尚在协议中）。<strong>两名单均不含中国<\/strong>——对中国国内招募渠道有直接影响（见第五节）<\/li>\n<\/ol>\n<h4 id=\"_54\">四、对本案（司机路径）的影响<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">情形<\/th>\n<th style=\"width:50%\">判断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>已有 N4 + 驾照，可直接过评价试验<\/td>\n<td><strong>直接走特定技能 1 号更优<\/strong>：省去育成期，直接进入正职雇佣<\/td>\n<\/tr>\n<tr>\n<td>日语/技能暂不达标<\/td>\n<td>育成就劳可作为\"预备校\"：先入场再在 3 年内移行特定技能<\/td>\n<\/tr>\n<tr>\n<td>已在日本持技能实习<\/td>\n<td>关注 2027 年施行时的旧制度衔接措施（ISA 已公告旧技能实习毕业者的特定技能移行处理）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"09-\">五、跟踪要点（记入 <a href=\"#09-政策更新日志\">09-政策更新日志<\/a>）<\/h4>\n<ul>\n<li>[ ] 各分野育成就劳运用要领发布情况：截至 2026-11-11 已公布 漁業（11-06）、宿泊（10-16）、飲食料品製造業・資源循環（10-09）、物流倉庫（08-28）等；<strong>自動車運送業 尚未公布<\/strong> [Source: https://www.moj.go.jp/isa/applications/index_00005.html, 2026]<\/li>\n<li>[ ] 自动车运送业育成就劳运用要领的公布与内容（尚未公布，继续跟踪）<\/li>\n<li>[x] 二国间协力备忘录（MOC）签署国名单：截至 2026-11-12，ISA MOC 页列 <strong>7 国<\/strong>（乌兹别克、斯里兰卡、泰国、孟加拉、越南、东帝汶、老挝）；OTIT 认定送出机关一览列 <strong>16 国<\/strong>（含暂定名单国：印尼、柬埔寨、吉尔吉斯、塔吉克、尼泊尔、巴基斯坦等）。<strong>两者均不含中国<\/strong> [Source: https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html, 2026；https://www.otit.go.jp/employment_for_skill_development/05/, 2026] → 育成就労渠道目前无法从中国招募<\/li>\n<li>[ ] 2027-04-01 施行细则的最终版本<\/li>\n<\/ul>\n<h4 id=\"_55\">参考<\/h4>\n<ul>\n<li>ISA 育成就劳制度：https://www.moj.go.jp/isa/applications/index_00005.html<\/li>\n<li>ISA 育成就労 MOC（二国間協力覚書）：https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html<\/li>\n<li>OTIT 外国政府認定送出機関一覧（育成就労制度）：https://www.otit.go.jp/employment_for_skill_development/05/<\/li>\n<li>育成就劳制度概要（日驻越使馆 PDF）：https://www.vn.emb-japan.go.jp/files/100881460.pdf<\/li>\n<li>WAM 特集（2024 改正法解说）：https://www.wam.go.jp/hp/wp-content/uploads/wam202511.pdf<\/li>\n<\/ul>\n<hr />\n<h3 id=\"07\">07 永住与长期在留规划<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11（复核修正）。依据 ISA「永住许可に关するガイドライン（令和 8 年 10 月 1 日改定）」及 2024 年（令和 6 年）改正入管法。<\/p>\n<p><strong>主线修正<\/strong>：自动车运送业<strong>没有特定技能 2 号<\/strong>，原\"1 号→2 号→永住\"时间线不成立；下方已改为\"1 号→其他就労资格→永住\"。<\/p>\n<\/blockquote>\n<h4 id=\"_56\">一、永住许可原则要件<\/h4>\n<p>依据最新指南（2026-10-01 改定版：https://www.moj.go.jp/isa/10_00279.html）：<\/p>\n<ol>\n<li><strong>在留年数<\/strong>：原则连续 10 年以上在留，其中** 5 年以上**为就劳或受扶养身份<\/li>\n<li><strong>现有资格期长<\/strong>：申请时持有目前资格的最长在留期间（如 3 年、5 年）<\/li>\n<li><strong>行为合规<\/strong>：无犯罪、履行纳税（所得税、住民税）、社会保险（健康保险、年金）、雇用保险等公的义务<\/li>\n<li><strong>生计<\/strong>：原则上以自身资产或技能实现独立生计（不依赖生活保护等）<\/li>\n<li><strong>收入<\/strong>：申请时点<strong>世帯年收<\/strong>需持续达到「世帯人数相应的日本人世帯平均收入」以上（<strong>年收水准<\/strong>）。世帯 = 同住且共同家计者；受扶养的海外亲属也计入世帯人数；「家族滞在」等非就労资格者的收入<strong>不计入<\/strong>世帯年收 [Source: https://www.moj.go.jp/isa/10_00279.html, 2026-10-01 改定]<\/li>\n<li><strong>健康保险・年金<\/strong>：未履行满 3 年（无正当理由）将成为不许可/取消事由<\/li>\n<li><strong>年金受給見込額<\/strong>（令和 8 年改定新增）：按申请时年龄、加入期间、平均收入推算的将来受給見込額，须达到「以年收水准工作 30 年并加入厚生年金」情形下的受給年金水準；不足时可用<strong>補填資産<\/strong>补足（基准按申请时年龄设定，越年轻要求越低）[Source: 同上, 2026]<\/li>\n<li><strong>日本語能力<\/strong>（令和 8 年改定新增）：申请时点具备一定水準的日语能力纳入考虑要素 [Source: 同上, 2026]<\/li>\n<\/ol>\n<h4 id=\"2024\">二、2024 年改正：永住取消制度（关键风险）<\/h4>\n<ul>\n<li>依据令和 6 年改正法，<strong>永住者资格可被取消<\/strong>的新事由：<\/li>\n<li>无正当理由<strong>连续 3 年以上未履行纳税或社会保险缴费义务<\/strong><\/li>\n<li>出国时未取得再入国许可（视同再入国含）而长期离境等<\/li>\n<li>指南：https://www.moj.go.jp/isa/11_00118.html<\/li>\n<li><strong>对策<\/strong>：从入境第一年起，所有税款、社保、年金必须足额按时缴纳——这不是拿到永住后的事，而是从工作第一天起就在积累或破坏永住条件。<\/li>\n<\/ul>\n<h4 id=\"10-1\">三、10 年时间线（从 1 号入境算起）<\/h4>\n<pre><code class=\"language-text\">Y0          Y1–5                     Y5                      Y6–10                  Y10\n1号入境  →  1号更新（累计≤5年）  →  切换其他在留资格      → 新资格持续+收入达标  → 永住申请\n                                 （2号不可用，见 05）      ↑ 世帯年收需持续达标\n<\/code><\/pre>\n<p>关键控制点：<\/p>\n<ol>\n<li><strong>Y5 前完成资格切换<\/strong>：自动车运送业<strong>没有 2 号<\/strong>，不能自动续接；须在 5 年上限前转为技術・人文知識・国際業務或高度专门职等（→ <a href=\"#05-特定技能2号与升级路径\">05-特定技能2号与升级路径<\/a>）。<strong>推断<\/strong>：切换失败则须离境，10 年连续性中断<\/li>\n<li><strong>世帯年收管理<\/strong>：令和 8 年改定后按<strong>世帯<\/strong>（家庭）计——家属来日的时机影响达标难度；司机/管理岗收入增长规划见 <a href=\"../../07-economy-finance/reports/\">07-economy<\/a><\/li>\n<li><strong>公的义务零瑕疵<\/strong>：每年 3 月確定申告、住民税、年金免许记录归档<\/li>\n<li><strong>连续性<\/strong>：离日需注意再入国期限（1 年内回国，或提前申请再入国许可）<\/li>\n<\/ol>\n<h4 id=\"_57\">四、证据链归档清单（每年更新）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">类别<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>收入<\/td>\n<td>源泉征收票、支给明细、确定申告书副本<\/td>\n<td>年收水准要件<\/td>\n<\/tr>\n<tr>\n<td>社保<\/td>\n<td>健康保险・年金缴费记录（ねんきん定期便）<\/td>\n<td>履行义务证明<\/td>\n<\/tr>\n<tr>\n<td>雇用<\/td>\n<td>雇用保险被保险者证、雇用契约、勤务记录<\/td>\n<td>5 年就劳要件、2 号移行<\/td>\n<\/tr>\n<tr>\n<td>在留<\/td>\n<td>在留卡复印件、全数更新许可书<\/td>\n<td>10 年连续在留证明<\/td>\n<\/tr>\n<tr>\n<td>能力<\/td>\n<td>JLPT/JFT 成绩、驾照、技能试验合格证<\/td>\n<td>资格升级<\/td>\n<\/tr>\n<tr>\n<td>业绩<\/td>\n<td>准点率、安全记录、表彰<\/td>\n<td>管理岗与审查加分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_58\">五、备选路径对比<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">永住所需时间<\/th>\n<th style=\"width:34%\">特点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.ssw.go.jp/cn/about/visa/\" title=\"来源：https://www.ssw.go.jp/cn/about/visa/, 2026\">~~1号→2号→永住~~（<strong>不可行<\/strong>）<\/a><\/td>\n<td>—<\/td>\n<td>自动车运送业无 2 号，路径不存在<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/applications/status/gijinkoku.html\" title=\"来源：https://www.moj.go.jp/isa/applications/status/gijinkoku.html, 2026\">1号→技人国→永住（<strong>已确认主线<\/strong>）<\/a><\/td>\n<td>约 10 年（1号 5 年 + 技人国 5 年）<\/td>\n<td>学历要件已满足（本科相关专业）；须在第 5 年前转入管理/企划岗<\/td>\n<\/tr>\n<tr>\n<td>1号→补学历→技人国→永住（兜底，<strong>不启用<\/strong>）<\/td>\n<td>10 年+学制时间<\/td>\n<td>通信制/海外大学商科·物流，可与 1 号并行（<strong>推断<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>高度专门职（积分 70/80）<\/td>\n<td>3 年/1 年<\/td>\n<td>需学位与高年收；无学位时基本不可达（详见 <a href=\"#05-特定技能2号与升级路径\">05<\/a> 5.3）<\/td>\n<\/tr>\n<tr>\n<td>经营管理<\/td>\n<td>需持续经营实绩<\/td>\n<td>不适合初期<\/td>\n<\/tr>\n<tr>\n<td>与永住者/日本人结婚<\/td>\n<td>3 年在留+1 年婚姻<\/td>\n<td>不作为规划主线<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"5\">六、行动清单（对应阶段 5）<\/h4>\n<ul>\n<li>[ ] 每年 1 月：归档前年税务·社保文件（见上表）<\/li>\n<li>[ ] 每年核对：永住指南改定、永住取消指南运用实例<\/li>\n<li>[ ] Y1–Y2：确定技人国路径（学位 or 10 年经验），启动 N2 与转岗准备<\/li>\n<li>[ ] Y4 前：提交在留资格变更（技人国），留出审查缓冲<\/li>\n<li>[ ] Y6 起：模拟世帯年收达标情况，提前 2 年补足<\/li>\n<li>[ ] 申请前：通过行政书士做一次要件预审<\/li>\n<\/ul>\n<h4 id=\"_59\">参考<\/h4>\n<ul>\n<li>永住许可指南（令和 8-10-01 改定）：https://www.moj.go.jp/isa/10_00279.html<\/li>\n<li>永住者取消指南：https://www.moj.go.jp/isa/11_00118.html<\/li>\n<li>在留资格取消（入管法 22 条の 4）：https://www.moj.go.jp/isa/applications/procedures/torikeshi_00002.html<\/li>\n<li>永住许可制度适正化 Q&amp;A：https://www.moj.go.jp/isa/immigration/faq/kanri_qa_00003.html<\/li>\n<\/ul>\n<hr />\n<h3 id=\"08\">08 家属带同与家庭规划<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。本章承接 <a href=\"#07-永住与长期在留规划\">07-永住与长期在留规划<\/a> 的「家属签证」要点展开，服务于阶段 5（永住定居）的家庭规划：何时能带家属、配偶能否工作、子女如何衔接就学。制度依据以出入国在留管理厅（ISA）现行口径为准。<\/p>\n<\/blockquote>\n<h4 id=\"_60\">一、「家族滞在」在留资格要件<\/h4>\n<p><strong>扶养人资格（谁能带家属）<\/strong>：<\/p>\n<ul>\n<li><a href=\"https://www.moj.go.jp/isa/applications/status/dependent\" title=\"来源：https://www.moj.go.jp/isa/applications/status/dependent, 2026\">「家族滞在」的扶养人资格范围<\/a>：教授、芸術、宗教、報道、高度専門職、経営・管理、法律・会計業務、医療、研究、教育、<strong>技術・人文知識・国際業務<\/strong>、企業内転勤、介護、興行、技能、<strong>特定技能 2 号<\/strong>、文化活動、<strong>留学<\/strong> 等在留资格者扶养的<strong>配偶者或子<\/strong> [Source: https://www.moj.go.jp/isa/applications/status/dependent, 2026]<\/li>\n<li><strong>特定技能 1 号原则上不可带家属<\/strong>（官方中文站表述「无法申请家人陪同」）[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]；永住指南亦把「技能実習」「育成就労」「特定技能 1 号」列为家族带同受限的资格 [Source: https://www.moj.go.jp/isa/10_00279.html, 2026]<\/li>\n<li>对本案：司机 1 号期间（Y0–Y5）<strong>不能带家属<\/strong>——家庭规划须安排在 Y4/Y5 技人国变更完成之后（→ <a href=\"#05-特定技能2号与升级路径\">05-特定技能2号与升级路径<\/a> 第五节）。1 号带同例外（同等要件相当者等）的适用细则无公开运用基准，<strong>待复核<\/strong>。<\/li>\n<li>年收门槛常识：ISA <strong>无公开数值基准<\/strong>，仅要求提交扶养者的职业·收入证明（在職証明書等＋住民税课税〔或非课税〕证明书＋纳税证明书）[Source: https://www.moj.go.jp/isa/applications/status/dependent, 2026]；实务上须证明可持续扶养全家的经济能力（<strong>推断<\/strong>），精确年收数值<strong>待复核<\/strong>。<\/li>\n<\/ul>\n<p><strong>在留期间与扶养人联动<\/strong>：<\/p>\n<ul>\n<li>家族滞在在留期间由法务大臣个别指定（<strong>不超过 5 年<\/strong>）[Source: https://www.moj.go.jp/isa/applications/status/dependent, 2026]；扶养人变更资格或更新期间时，家族成员须同步办理，每次均需重新提交扶养者职业·收入证明 [Source: 同上, 2026]<\/li>\n<li>死别/离婚须提交「配偶者に関する届出」[Source: 同上, 2026]<\/li>\n<\/ul>\n<h4 id=\"28\">二、配偶者的资格外活动许可（周 28 小时上限）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">许可类型<\/th>\n<th style=\"width:33%\">适用情形<\/th>\n<th style=\"width:34%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html\" title=\"来源：https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html, 2026\">包括许可<\/a><\/td>\n<td><strong>1 周 28 小时以内<\/strong>的报偿活动（所谓打工形态）<\/td>\n<td>仅需申请书<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html\" title=\"来源：https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html, 2026\">个别许可<\/a><\/td>\n<td>包括许可范围外：稼働时间不明确的事业（个人事业主等）、业务委托·承包契约等<\/td>\n<td>附活动内容说明文书；要件之一为<strong>从事期间不超过在留期间过半<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>一般原则要件：不妨碍本属在留资格的活动、无法令违反与风俗关联活动、素行良好等 [Source: https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00045.html, 2026]<\/li>\n<li>超过 28 小时/周或实质成为全职就业的情形，可能被判定为在留目的实质变更，须改办在留资格变更许可（<strong>推断<\/strong>）[Source: https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html, 2026]<\/li>\n<li>持「特定活动」（被扶养者指定）者原则上准用家族滞在的資格外活動許可处理 [Source: 同上, 2026]<\/li>\n<\/ul>\n<h4 id=\"_61\">三、子女带同时序与就学衔接（签证侧）<\/h4>\n<ul>\n<li><strong>带同最佳时点（推断）<\/strong>：与技人国变更（Y4–Y5）同步——1 号期间带同不可行（见一）；技人国在留期间稳定后再带同，可减少随扶养人资格变化的连带更新。<\/li>\n<li><strong>家属 COE（海外申请）材料要点<\/strong> [Source: https://www.moj.go.jp/isa/applications/status/dependent, 2026]：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">材料<\/th>\n<th style=\"width:50%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>身分关系证明<\/td>\n<td>户籍誊本 / 婚姻届受理证明书 / 结婚证明书（复印件）/ 出生证明书（复印件）任一（外文须附日文翻译）<\/td>\n<\/tr>\n<tr>\n<td>扶养者（本人）文件<\/td>\n<td>在留卡或护照复印件<\/td>\n<\/tr>\n<tr>\n<td>扶养者职业·收入证明<\/td>\n<td>在職証明書等＋住民税课税（或非课税）证明书＋纳税证明书（一年间总所得与纳税状况）<\/td>\n<\/tr>\n<tr>\n<td>共通<\/td>\n<td>申请书、照片、返信用信封；已在国内的家属走<strong>在留资格变更许可<\/strong>申请，材料同上<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>子女的就学手续、6-3-3-4 学制与外国人子女入学案内 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.html#03-日本学校教育体系与子女教育\">10-资格与教育投资 · 03-日本学校教育体系与子女教育<\/a>（education 手册，只管学校侧）<\/li>\n<li><strong>子女高中毕业后的签证衔接<\/strong>：以家族滞在持续在留＋义务教育·高中毕业＋入境时未满 18 岁＋就业单位已内定＋履行公的义务等要件，可变更为「<strong>定住者<\/strong>」直接就业；不符要件者经「特定活动」过渡 [Source: https://www.moj.go.jp/isa/applications/resources/nyuukokukanri07_00122.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"_62\">四、单身/成家路线对永住规划的财务影响<\/h4>\n<ul>\n<li><strong>世帯年収审查<\/strong>（令和 8-10-01 改定指南）：永住收入要件原则上按<strong>同一生計世帯<\/strong>单位审查，世帯年収须持续达到「世帯人数相应的日本人世帯平均收入」以上 [Source: https://www.moj.go.jp/isa/10_00279.html, 2026]<\/li>\n<li><strong>家族滞在成员的收入不计入世帯年収<\/strong>：配偶者凭資格外活動許可获得的例外的、限定的收入不作为合算对象 [Source: 同上, 2026]——配偶打工既不抬高收入侧、也不稀释门槛（推断）<\/li>\n<li><strong>世帯人数抬高门槛<\/strong>：家属来日 → 世帯人数增加 → 年収水準门槛金额上升；<strong>受扶养的海外亲属（未同居）也计入世帯人数<\/strong>；世帯 5 人以上还须加算生活费增分 [Source: 同上, 2026]<\/li>\n<li><strong>年金侧<\/strong>：配偶作为第 3 号被保险者（厚生年金加入者的被扶养配偶）的期间，按指南与申请人受給見込額合算判断（推断）[Source: 同上, 2026]<\/li>\n<li>对本案（<strong>推断<\/strong>）：带同使 Y6–Y10 永住申请的世帯年収门槛上升；收入增长曲线与转岗涨薪节奏见 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#01-收入结构与薪资行情\">01 收入结构与薪资行情<\/a>（economy 手册）。带同时点宜与技人国转岗涨薪联动，在 Y5 后、永住申请前 2–3 年完成，避免临申请时世帯人数骤增。<\/li>\n<\/ul>\n<h4 id=\"5_1\">五、行动清单（对应阶段 5）<\/h4>\n<ul>\n<li>[ ] 结婚证/出生证明等身分关系文件提前备齐并完成日文翻译（家族滞在申请必附）<\/li>\n<li>[ ] 每年归档：源泉征收票、住民税课税（非课税）证明书、纳税证明书——既是永住证据链（→ 07），也是家族滞在的扶养能力证明<\/li>\n<li>[ ] Y3–Y4：评估扶养能力与世帯年収影响（结合 economy 收入曲线）<\/li>\n<li>[ ] Y4–Y5：技人国变更许可后提交家属 COE（海外）/在留资格变更许可（国内）<\/li>\n<li>[ ] 配偶就业前申请資格外活動許可（包括许可，周 28 小时）<\/li>\n<li>[ ] 子女入学/转学时点对照 education 手册 03 章手续清单<\/li>\n<li>[ ] 每季度核对 ISA 家族滞在页与資格外活動許可页更新 → 记入 <a href=\"#09-政策更新日志\">09-政策更新日志<\/a><\/li>\n<\/ul>\n<h4 id=\"_63\">参考<\/h4>\n<ul>\n<li>ISA 在留资格「家族滞在」：https://www.moj.go.jp/isa/applications/status/dependent<\/li>\n<li>「家族滞在」資格外活動許可：https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html<\/li>\n<li>資格外活動許可について（一般原则）：https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00045.html<\/li>\n<li>家族滞在高卒后就业（定住者/特定活动）：https://www.moj.go.jp/isa/applications/resources/nyuukokukanri07_00122.html<\/li>\n<li>永住许可指南（世帯年収·家族滞在收入不计入）：https://www.moj.go.jp/isa/10_00279.html<\/li>\n<li>特定技能 1 号/2 号家族带同对比（官方中文）：https://www.ssw.go.jp/cn/about/visa/<\/li>\n<\/ul>\n<hr />\n<h3 id=\"09\">09 政策更新日志<\/h3>\n<blockquote>\n<p>用途：按时间倒序记录签证·在留相关制度变化与本次调研结论，供定期（建议每季度）核对官方公告后追加。<\/p>\n<\/blockquote>\n<h4 id=\"2026-11-12_1\">2026-11-12（验证运行：触发器与追踪表核对）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">事项<\/th>\n<th style=\"width:33%\">结论<\/th>\n<th style=\"width:34%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ISA 特定技能 更新情報（触发器 1）<\/td>\n<td>最新 2026-11-10（外食業 審査状況）、2026-11-06（分野别受入见込数・在留者数 PDF 更新＝8 月末值）；<strong>2026-10-09 自動車運送業分野 要領別冊 改正<\/strong>本主题此前未记录<\/td>\n<td>https://www.moj.go.jp/isa/applications/ssw/<\/td>\n<\/tr>\n<tr>\n<td>自動車運送業分野 要領別冊 改正（2026-10-09）<\/td>\n<td>已补记录；<strong>新旧対照表（001472544.pdf）未能取得，課加条件・様式追加的影响待复核<\/strong>（监测报告已按现行要領确认全 11 项、无健康检查义务）<\/td>\n<td>https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_ lassnk.or.jp/news/25<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic 日本国内受験料 10,000 円<\/td>\n<td>确认<\/td>\n<td>https://www.prometric-jp.com/ssw/exam/fee/<\/td>\n<\/tr>\n<tr>\n<td>中国受理领馆单次签证费 715 元（2026-07-01 起）<\/td>\n<td>确认<\/td>\n<td>https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html<\/td>\n<\/tr>\n<tr>\n<td>JLPT 中国考区 N4 450 元<\/td>\n<td>确认<\/td>\n<td>https://jlpt.neea.edu.cn/faq.html<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"2026-11-11_1\">2026-11-11（建档首次核对）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">事项<\/th>\n<th style=\"width:33%\">状态<\/th>\n<th style=\"width:34%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特定技能 1 号自动车运送业分野正常运作<\/td>\n<td>确认（ISA 分野页 2026-10-09 现在时点）<\/td>\n<td>https://www.moj.go.jp/isa/policies/ssw/automobiletransportation<\/td>\n<\/tr>\n<tr>\n<td>卡车路径要求：评价试验 + 第一种驾照 + JFT-Basic/N4<\/td>\n<td>确认<\/td>\n<td>https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/<\/td>\n<\/tr>\n<tr>\n<td>出租车/巴士路径：第二种驾照 + N3 + 新任驾驶员研修<\/td>\n<td>确认<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>评价试验受验资格：满 17 岁（印尼 18）、有效驾照、非日籍<\/td>\n<td>确认<\/td>\n<td>https://sswt-portal.classnk.or.jp/area?tab=3<\/td>\n<\/tr>\n<tr>\n<td>永住许可指南最新版：令和 8 年（2026）10 月 1 日改定，新增世帯年收水准考量<\/td>\n<td>确认<\/td>\n<td>https://www.moj.go.jp/isa/10_00279.html<\/td>\n<\/tr>\n<tr>\n<td>育成就劳：2026-04-15 监理支援机关申请受理、2026-09-01 计划认定受理、<strong>2027-04-01 施行<\/strong><\/td>\n<td>确认<\/td>\n<td>https://www.moj.go.jp/isa/applications/index_00005.html<\/td>\n<\/tr>\n<tr>\n<td>特定技能 1 号支援体制要件改正，2027-04-01 生效（2026-07-28 公布）<\/td>\n<td>确认<\/td>\n<td>https://www.moj.go.jp/isa/applications/ssw/<\/td>\n<\/tr>\n<tr>\n<td>自动车运送业 5 年接收上限 24,500 人（2024-04～2029-03）<\/td>\n<td>建档时记录；<strong>已于 2026-11-11 更正为 22,100 人<\/strong>（见上条）<\/td>\n<td>https://www.ssw.go.jp/cn/<\/td>\n<\/tr>\n<tr>\n<td>育成就劳分野別运用要领陆续公布（渔业 2026-11-06）<\/td>\n<td>进行中<\/td>\n<td>同上<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_64\">待跟踪清单<\/h4>\n<ul>\n<li>[ ] 自动车运送业分野育成就劳运用要领发布（预计随 2027 施行前公布）<\/li>\n<li>[x] 2 号评价试验（自动车运送业）：<strong>已确认该分野无 2 号<\/strong>（2026-11-11），本项关闭<\/li>\n<li>[ ] 特定技能 2 号及出租车·巴士「B1 相当以上」在留资格变更·更新的适用时间公告<\/li>\n<li>[ ] 永住指南「年收水准」的具体数值基准运用实例<\/li>\n<li>[ ] 2029-03 接收上限到期后的政策延续<\/li>\n<li>[ ] 中国与日本的二国间 MOC 签署情况（影响国内招募与考场设置）— 2026-11-12 核验仍不在<\/li>\n<li>[ ] <strong>2026-10-09 自動車運送業分野 要領別冊 改正<\/strong>の新旧対照表（001472544.pdf）核对：課加条件・様式追加（日本語学習プラン・バス運営連携同意書等）的影响<\/li>\n<li>[ ] ISA MOC ページと OTIT 認定送出機関一覧の更新時差（例：バングラデシュの暫定/認定）<\/li>\n<\/ul>\n<h4 id=\"_65\">更新方法<\/h4>\n<ol>\n<li>打开 ISA 特定技能总页与分野页，核对「更新情報」日期<\/li>\n<li>核对永住指南页「改定日」<\/li>\n<li>在本文件顶部追加新条目（日期倒序），标注来源链接<\/li>\n<li>若与已有文档冲突：先改正文，再在此记录变更<\/li>\n<\/ol>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 715, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "08-visa-immigration/reports/2026-11-visa-immigration.html"}}}, "politics-law": {"name": "政治与法律", "dir": "09-politics-law", "months": {"2026-11": {"title": "日本政治与法规 · 首份分析报告", "body": "\n<h1 id=\"_1\">日本政治与法规 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要法规框架与维权工具的读者，兼具制度查询与合规应对视角。\n<strong>来源规则<\/strong>：① e-Gov 法令检索、出入国在留管理庁、厚生労働省（check-roudou.mhlw.go.jp）、総務省（soumu.go.jp：多文化共生施策）、各都道府県労働局 ＞ ② 主要政党官网（jimin.jp 等——政策环境信号，须实际打开验证后才可写立场）＋ JILPT 研究报告 ＞ ③ 弁護士会 / 行政书士会公开指引 ＞ ④ NHK、日本経済新聞、Nikkei Asia（政治动向，须回溯）<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本政治与法规知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<h3 id=\"11\">1.1 主题定义与监测范围<\/h3>\n<p><strong>含<\/strong>（business-config 3.1）：在留法规框架（8 部相关法律栈、个人必熟 Top 5 条款、检索入口）；政治动向与移民政策环境（三条政策主线、政党光谱、自治体层面、跟踪清单）；维权与合规工具箱（劳动纠纷五级阶梯、在留咨询、证据留存规则、紧急速查）。<\/p>\n<p><strong>不含<\/strong>（交叉引用，不在本主题展开）：签证实务、申请流程、在留资格要件 → 08-visa-immigration；劳动合规细节（工时 / 工资）→ 02-career-driver；自动驾驶法规与许可制度 → 05-industry-autonomous；永住年收财务与证据链 → 07-economy-finance；地域信息与自治体生活 → 13-regional-info；官方统计活值 → 01-ssw-driver（只读引用）。<\/p>\n<h3 id=\"12\">1.2 受众与用途<\/h3>\n<p>面向在日本从事货运司机工作、需要法规框架与维权工具的读者；输出法规文本解读与影响评估，不构成法律意见；合规应对建议标「建议」，重大合规决策须提示咨询执业法律专业人士；政治动向影响判断一律标「推断」（business-config 第二节）。<\/p>\n<h3 id=\"13\">1.3 核心监测问题<\/h3>\n<ol>\n<li>与个人相关的法律栈（8 部）与必熟 Top 5 条款的最新状态如何？<\/li>\n<li>2026 年移民政策环境（三条政策主线、政党光谱、自治体层面）呈现什么特征？<\/li>\n<li>劳动纠纷与在留问题的维权路径（五级阶梯、咨询窗口、证据留存）最新口径如何？<\/li>\n<li>法规文本三层（法令条文 / 政府解说页 / 媒体转述）的口径差异如何影响解读？<\/li>\n<li>政策环境变化对已落地者的实际影响路径是什么？<\/li>\n<\/ol>\n<h3 id=\"14\">1.4 跨主题分工<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>签证实务、申请流程、在留资格要件<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>劳动合规细节（工时 / 工资）<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>自动驾驶法规与许可制度<\/td>\n<td>05-industry-autonomous<\/td>\n<\/tr>\n<tr>\n<td>永住年收财务与证据链<\/td>\n<td>07-economy-finance<\/td>\n<\/tr>\n<tr>\n<td>地域信息与自治体生活<\/td>\n<td>13-regional-info<\/td>\n<\/tr>\n<tr>\n<td>官方统计活值<\/td>\n<td>01-ssw-driver（只读引用）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留法规框架<\/td>\n<td>8 部法律栈、Top 5 条款与检索入口<\/td>\n<td>核心指标 #1<\/td>\n<td>e-Gov / ISA / 厚労省<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>政治动向与移民政策环境<\/td>\n<td>三条政策主线、政党光谱与自治体层面<\/td>\n<td>核心指标 #3 #4<\/td>\n<td>官方公报 / 媒体 / 官房 / 厚労省<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<tr>\n<td>维权与合规工具箱<\/td>\n<td>劳动纠纷五级阶梯、在留咨询与证据留存<\/td>\n<td>核心指标 #2 #5<\/td>\n<td>check-roudou.mhlw.go.jp / 各都道府県労働局<\/td>\n<td>事件触发解读 + 年度台账复盘<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>维度间关系：法规框架是底线约束，政策环境是外部变量，维权工具箱是权利实现路径；法规文本三层（法令条文 ≠ 政府解说页 ≠ 媒体转述）与维权渠道三类（劳动基准监督署 ≠ 法テラス ≠ Yorisoi Hotline）并列呈现，不合并。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 在留法规框架<\/h3>\n<ul>\n<li>登记册 #1 最新值：待基线确立。<\/li>\n<li>基线报告 8 部法律栈：出入国管理法（入管法）——在留资格、审查、取消、退去强制；職業安定法——求职·雇佣介绍；労働者派遣法——派遣劳动；貨物自動車運送事業法（货送法）——运输事业许可与运行体制；労働基準法+働き方改革法——工时·工资·解雇；労働安全衛生法——安全管理；道路交通法——驾照·运行规则；自動車損害賠償保障法——车辆保险。<\/li>\n<li>个人必熟 Top 5 条款：资格外活动禁止（特定技能 1 号只能从事受入计划书记载业务）；连续 3 个月不从事原业务 → 资格取消；月加班 100h 未满红线（时间外+休日合计）；住民税 / 社保滞纳 3 年 → 永住取消事由；在留卡 14 天地址变更义务、离日 1 年再入国期限。<\/li>\n<li>检索入口：e-Gov 法令检索 https://laws.e-gov.go.jp；入管法条文（ISA 解说页）https://www.moj.go.jp/isa；厚労省劳动基准 Q&amp;A https://www.mhlw.go.jp；综合法律支援（多语种法律咨询）法テラス https://www.houterasu.or.jp。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 政治动向与移民政策环境<\/h3>\n<ul>\n<li>登记册 #3 最新值：待基线确立；登记册 #4 最新值：2027 年施行（02 篇）。<\/li>\n<li>基线报告三条政策主线：扩大受入（特定技能分野扩大——2024 年自动车运送业加入、育成就劳 2027 年施行）；管理强化（永住取消——2024 年改正、接受机关审查加严）；共生政策（多文化共生推进、地方自治体对应）。<\/li>\n<li>政党光谱（推断口径，基于既有核对与政党官网公开活动，验证日期 2026-11-12）：自民党——扩大+管理并行（党官网公开「外国人政策本部」出入国管理适正化・外国人受入相关 PT 合同会议日程，2026-11-12 当日）；立宪民主党——技能实习制度批判、对永住取消改正持批判立场；日本维新会——总体倾向扩大受入；国民民主党——总体倾向扩大；公明党 / 共产 / れいわ等——待复核（官网本次未验证）。<\/li>\n<li>地方自治体层面：特定技能者最多的自治体（爱知、东京、埼玉、大阪、千叶、神奈川等）配套最成熟；多文化共生担当窗口、外国人咨询窗口（免费行政书士 / 弁护士咨询日）值得入乡先查。<\/li>\n<li>外国人权利动向观察点 4 个：永住者地方参政权（相关法案历次提交 / 审议动向，法律现状截至本次核对未变，最新国会状态待复核）；行政手续多语言化（总务省「地域における多文化共生推進プラン」令和 2 年 9 月改订持续指导自治体施策）；执政党外国人政策审议动向（自民党外国人政策本部持续审议）；灾害时外国人支援体制（总务省情報難民ゼロ项目、灾害时外国人支援信息协调员）。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 维权与合规工具箱<\/h3>\n<ul>\n<li>登记册 #2 最新值：Hotline 0120-811-610（锚 01-ssw-driver 清单）；登记册 #5 最新值：待基线确立。<\/li>\n<li>基线报告劳动纠纷自助阶梯（五级）：① 与上司 / 人事书面沟通（邮件留痕）；② 公司内相談窓口 / 劳组（有则用）；③ 劳动基准监督署（加班费 / 解雇 / 工伤）；④ 劳动综合咨询（総合労働相談コーナー，免费匿名）；⑤ 劳动审判 / 诉讼（弁護士，法テラス介绍）。工伤适用劳灾保险（通勤事故和业务事故都适用）。<\/li>\n<li>在留问题咨询：在留资格疑义 → 地方出入国在留管理局（有外语对应日）；一般生活 / 劳动多语咨询 → Yorisoi Hotline（多语 0120-279-338）；特定技能支援问题 → 登录支援机关 / ISA 特定技能咨询；法律支援（低收入者）→ 法テラス。<\/li>\n<li>证据留存规则：一切沟通争取书面化（LINE → 邮件确认、口头指示 → 复述+事后邮件）；给与明细、契约、规则集纸质+云盘双备份；健康診断结果、工伤记录永久保存。<\/li>\n<li>紧急情况速查：警察 110 / 救护·消防 119；事故后 警方 → 公司运行管理者 → 保险 →（必要时）领事馆；签证权益受威胁时 ISA + 行政书士（先咨询后付费）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 数据冲突并列（不可合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>法规文本<\/td>\n<td>法令条文（e-Gov）≠ 政府解说页 ≠ 媒体转述<\/td>\n<\/tr>\n<tr>\n<td>政党立场<\/td>\n<td>官网公开活动（已验证）≠ 既有核对推断（未验证）<\/td>\n<\/tr>\n<tr>\n<td>维权渠道<\/td>\n<td>劳动基准监督署（行政）≠ 法テラス（法律援助）≠ Yorisoi Hotline（多语咨询）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"35\">3.5 未取得 / 待核验项<\/h3>\n<ul>\n<li>登记册 #1（入管法最新改正）、#3（移民政策重大动向）、#5（维权渠道联系方式现行口径）：待基线确立。<\/li>\n<li>公明党 / 共产 / れいわ等政党官网本次未验证，光谱表立场行空缺——待复核。<\/li>\n<li>永住者地方参政权最新国会审议状态——待复核。<\/li>\n<li>立宪 / 维新 / 国民民主的政策页口径未逐一验证——待复核。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<p><strong>结论 1<\/strong>：与个人直接相关的法律栈为 8 部，其中入管法与货送法构成在留与运输业务的底线约束。证据：基线报告 01 章法律栈表。标注：事实。<\/p>\n<p><strong>结论 2<\/strong>：个人必熟 Top 5 条款中，资格外活动禁止与连续 3 个月不从事原业务的资格取消风险最直接。证据：基线报告 Top 5 条款。标注：事实（条款罗列）；风险排序为基线判断。<\/p>\n<p><strong>结论 3<\/strong>：移民政策呈\"扩大受入 + 管理强化\"并行，政治波动对已落地者的影响小于制度过渡期内的合规质量。证据：基线报告三条主线与政党光谱（推断口径）。标注：事实（政策主线）；影响判断为推断。<\/p>\n<p><strong>结论 4<\/strong>：劳动纠纷维权路径为五级阶梯，行政渠道（劳动基准监督署）与法律援助（法テラス）并行。证据：基线报告 03 章。标注：事实。<\/p>\n<p><strong>结论 5<\/strong>：登记册 #2 外国人劳动咨询窗口为 Hotline 0120-811-610（锚 01-ssw-driver 清单）；基线报告另载 Yorisoi Hotline 0120-279-338（多语）。证据：登记册 #2；基线报告 03 章。标注：事实；两热线口径并列。<\/p>\n<p><strong>结论 6<\/strong>：任何政权组合下\"已入境者按既存法规运作\"是常态。证据：基线报告 02 章。标注：推断。<\/p>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>登记册 #1、#3、#5 待基线确立，法规改正与政策动向缺权威锚。<\/li>\n<li>政党光谱中 4 党立场为推断（基于既有核对与政党官网公开活动，验证日期 2026-11-12）；公明党 / 共产 / れいわ等未验证。<\/li>\n<li>永住者地方参政权最新国会状态待复核。<\/li>\n<li>法规文本三层口径须分别标注，不得混用。<\/li>\n<li>基线报告信息核对日期为 2026-11-11 / 11-12，政策环境可能变化。<\/li>\n<\/ul>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>（分析层）：<\/p>\n<ol>\n<li>入管法 / 相关法令的最新改正内容是什么（登记册 #1）？<\/li>\n<li>移民政策重大动向（受入方针、政党政策变化）最新进展如何（登记册 #3）？<\/li>\n<li>维权渠道联系方式现行口径是否变化（登记册 #5）？<\/li>\n<li>永住者地方参政权法案的最新国会审议状态如何？<\/li>\n<li>公明党 / 共产 / れいわ等政党官网的对外国人材政策立场是什么？<\/li>\n<li>自治体外国人施策（多文化共生担当窗口）的最新变化如何？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：登记册 #1、#3、#5 待基线确立项；未验证政党官网；永住者地方参政权；维权渠道口径。<\/p>\n<p><strong>数据补全计划<\/strong>：登记册 #1、#3、#5 在年度台账复盘前补齐；建立法规文本三层口径并列台账；对未验证政党按 T4 规则先归类再补立场。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>入管法最新改正<\/td>\n<td>待基线确立<\/td>\n<td>e-Gov<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>外国人劳动咨询窗口<\/td>\n<td>Hotline 0120-811-610（锚 01-ssw-driver 清单）<\/td>\n<td>check-roudou.mhlw.go.jp<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>移民政策重大动向<\/td>\n<td>待基线确立<\/td>\n<td>官方公报 / 媒体<\/td>\n<td>待核验<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>育成就労施行进度<\/td>\n<td>2027 年施行（02 篇）<\/td>\n<td>官房 / 厚労省<\/td>\n<td>2027 年<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>维权渠道联系方式现行口径<\/td>\n<td>待基线确立<\/td>\n<td>各都道府県労働局<\/td>\n<td>待核验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>注：本表逐项抄录登记册活值，未改写数值；「待基线确立」如实保留。<\/p>\n<\/blockquote>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：<\/p>\n<ul>\n<li>基线：<code>reports/2026-11-politics-law.md<\/code>（v1.0 首期固定）。<\/li>\n<li>事件触发解读：<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>。<\/li>\n<li>年度台账复盘：<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>。<\/li>\n<li>无触发器命中且窗口未到时<strong>不启动<\/strong>新解读；不得为制造变化而虚构变化。<\/li>\n<\/ul>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节，逐条列出）：<\/p>\n<ol>\n<li>入管法 / 相关法令改正（e-Gov 公布）→ 01<\/li>\n<li>移民政策重大动向（受入方针、政党政策变化）→ 02<\/li>\n<li>大选 / 党首更替（主要政党对外国人材政策口径变化）→ 02 光谱小节<\/li>\n<li>外国人权利相关法案·制度动向（地方参政权、行政手续多语言化等）→ 02 观察点小节<\/li>\n<li>劳动维权渠道 / 热线变化 → 03<\/li>\n<li>01-ssw-driver 修正清单涉及维权条目（ITJ / GFP 类）→ 03<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong> tbody>\n<tr>\n<td>导航<\/td>\n<td>政策更新日志引用随 visa 手册章节顺延<\/td>\n<td>08-政策更新日志<\/td>\n<td>09-政策更新日志（2 处）<\/td>\n<td>修订<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>新增小节「政党移民政策光谱（政策环境信号源）」<\/td>\n<td>无<\/td>\n<td>4 党验证立场表（推断口径，政党官网验证 2026-11-12）<\/td>\n<td>新增<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>新增小节「外国人权利动向观察点」<\/td>\n<td>无<\/td>\n<td>4 个观察点，链接 09-政策更新日志跟踪（soumu.go.jp、jimin.jp 验证 2026-11-12）<\/td>\n<td>新增<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待复核清单<\/strong><\/p>\n<ul>\n<li>公明党/共产/れいわ等政党官网本次未验证，光谱表立场行空缺（验证后按 T4 规则先归类再补）<\/li>\n<li>永住者地方参政权最新国会审议状态（推荐入口：众参两院法案检索 e-Gov 立法案检索）<\/li>\n<li>立宪/维新/国民民主的政策页口径未逐一验证，仅确认官网可访问与推断方向<\/li>\n<\/ul>\n<hr />\n<h3 id=\"01\">01 在留法规框架<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。个人只需精通与自己在留资格直接相关的部分，其余建立索引即可。签证实务 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html\">08-签证与在留<\/a>。<\/p>\n<\/blockquote>\n<h4 id=\"_18\">一、与本项目相关的法律栈<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">法律<\/th>\n<th style=\"width:33%\">管什么<\/th>\n<th style=\"width:34%\">对个人的具体影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>出入国管理法（入管法）<\/strong><\/td>\n<td>在留资格、审查、取消、退去强制<\/td>\n<td>特定技能要件、永住许可/取消、资格外活动禁止<\/td>\n<\/tr>\n<tr>\n<td>職業安定法<\/td>\n<td>求职·雇佣介绍<\/td>\n<td>Hello Work、转职规则<\/td>\n<\/tr>\n<tr>\n<td>労働者派遣法<\/td>\n<td>派遣劳动<\/td>\n<td>司机派遣岗位的法律框架<\/td>\n<\/tr>\n<tr>\n<td>貨物自動車運送事業法（货送法）<\/td>\n<td>运输事业许可与运行体制<\/td>\n<td>运行管理者、点呼、运输规则<\/td>\n<\/tr>\n<tr>\n<td>労働基準法+働き方改革法<\/td>\n<td>工时·工资·解雇<\/td>\n<td>时间外上限（→ <a href=\"../../02-career-driver/reports/2026-11-career-driver.html#02-薪资结构与工时合规\">02 薪资结构与工时合规<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>労働安全衛生法<\/td>\n<td>安全管理<\/td>\n<td>安全管理者、健康诊断<\/td>\n<\/tr>\n<tr>\n<td>道路交通法<\/td>\n<td>驾照·运行规则<\/td>\n<td>驾照种类、L4 许可（→ <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.html#02-法规与许可制度\">05-自动驾驶与自动化 · 02<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>自動車損害賠償保障法<\/td>\n<td>车辆保险<\/td>\n<td>自赔责强制保险<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"top-5\">二、个人必须烂熟的条款（Top 5）<\/h4>\n<ol>\n<li><strong>资格外活动禁止<\/strong>：特定技能 1 号只能从事受入计划书记载业务<\/li>\n<li><strong>连续 3 个月不从事原业务 → 资格取消<\/strong><\/li>\n<li><strong>月加班 100h 未满红线<\/strong>（时间外+休日合计）<\/li>\n<li><strong>住民税/社保滞纳 3 年 → 永住取消事由<\/strong><\/li>\n<li><strong>在留卡 14 天地址变更义务<\/strong>、离日 1 年再入国期限<\/li>\n<\/ol>\n<h4 id=\"_19\">三、法规检索入口<\/h4>\n<ul>\n<li>e-Gov 法令检索：https://laws.e-gov.go.jp [Source: https://laws.e-gov.go.jp, 2026]<\/li>\n<li>入管法条文（ISA 解说页）：https://www.moj.go.jp/isa<\/li>\n<li>厚労省劳动基准 Q&amp;A：https://www.mhlw.go.jp<\/li>\n<li>综合法律支援（多语种法律咨询）：法テラス https://www.houterasu.or.jp<\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 政治动向与移民政策环境<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。观察对个人路线有直接影响的政策变量，不做政治立场判断。<\/p>\n<\/blockquote>\n<h4 id=\"_20\">一、移民·外国人材政策的三条主线<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主线<\/th>\n<th style=\"width:33%\">现状<\/th>\n<th style=\"width:34%\">对个人的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>扩大受入<\/strong><\/td>\n<td>特定技能分野扩大（2024 自动车运送业加入）、育成就劳 2027 施行<\/td>\n<td>入场通道持续打开<\/td>\n<\/tr>\n<tr>\n<td><strong>管理强化<\/strong><\/td>\n<td>永住取消（2024 改正）、接受机关审查加严<\/td>\n<td>合规成本上升=证据链重要<\/td>\n<\/tr>\n<tr>\n<td><strong>共生政策<\/strong><\/td>\n<td>多文化共生推进（地方自治体对应）<\/td>\n<td>生活支援、日语教室、行政多语种服务增加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_21\">二、政党与政策光谱（常识级速查）<\/h4>\n<ul>\n<li>自民党系：扩大+管理并行路线为主流<\/li>\n<li>立宪民主等在野：技能实习废止批判、永住取消法批判——监督力量<\/li>\n<li>维新/国民民主：总体倾向扩大<\/li>\n<li>共产/令和：原则性反对扩大的立场<\/li>\n<\/ul>\n<p>任何政权组合下，\"已入境者按既存法规运作\"是常态——<strong>政治波动对已落地者的影响远小于制度过渡期内的合规质量<\/strong>。<\/p>\n<h4 id=\"12-regional\">三、地方自治体层面（与 12-regional 联动）<\/h4>\n<ul>\n<li>特定技能者最多的自治体（爱知、东京、埼玉、大阪、千叶、神奈川等）配套最成熟<\/li>\n<li>多文化共生担当窗口、外国人咨询窗口（免费行政书士/弁护士咨询日）值得入乡先查<\/li>\n<\/ul>\n<h4 id=\"_22\">政党移民政策光谱（政策环境信号源）<\/h4>\n<!-- updated: 2026-11-12 | 新增小节 -->\n\n<blockquote>\n<p>仅作政策环境信号源，不做政党斗争/外交分析。立场列均为<strong>推断<\/strong>（基于既有核对与政党官网公开活动，验证日期 2026-11-12）；大选/党首更替后本表须整体重写。未验证官网的政党不写立场（先归类再引用）。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">政党<\/th>\n<th style=\"width:33%\">对外国人材政策的主张方向（推断）<\/th>\n<th style=\"width:34%\">本次验证信号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.jimin.jp\" title=\"来源：https://www.jimin.jp, 2026\">自民党<\/a><\/td>\n<td>扩大+管理并行：育成就劳推动方、2024 永住取消改正主导<\/td>\n<td>党官网公开「外国人政策本部」出入国管理适正化・外国人受入相关 PT 合同会议日程（2026-11-12 当日）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.cdp-japan.jp\" title=\"来源：https://www.cdp-japan.jp, 2026\">立宪民主党<\/a><\/td>\n<td>技能实习制度批判、对永住取消改正持批判立场（监督力量）<\/td>\n<td>官网可访问；政策页口径未逐一验证<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://o-ishin.jp\" title=\"来源：https://o-ishin.jp, 2026\">日本维新会<\/a><\/td>\n<td>总体倾向扩大受入<\/td>\n<td>官网可访问；政策纲领页未逐一验证<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://new-kokumin.jp\" title=\"来源：https://new-kokumin.jp, 2026\">国民民主党<\/a><\/td>\n<td>总体倾向扩大<\/td>\n<td>官网可访问；「政策 2026」页存在，口径未逐一验证<\/td>\n<\/tr>\n<tr>\n<td>公明党/共产/れいわ等<\/td>\n<td>待复核（官网本次未验证）<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>任何政权组合下\"已入境者按既存法规运作\"是常态——光谱变化对已落地者的影响小于制度过渡期内的合规质量（推断）。<\/p>\n<h4 id=\"_23\">外国人权利动向观察点<\/h4>\n<!-- updated: 2026-11-12 | 新增小节 -->\n\n<p>只记录与个人在留/生活权益直接相关的制度动向（信号源定位，不做法理研究），按季度核对：<\/p>\n<ol>\n<li><strong>永住者地方参政权<\/strong><\/li>\n<li>相关法案历次提交/审议动向，法律现状截至本次核对未变，最新国会状态待复核<\/li>\n<li>影响：若未来通过将影响定居地选择权重（推断）<\/li>\n<li><strong>行政手续多语言化<\/strong><\/li>\n<li>总务省「地域における多文化共生推進プラン」（令和 2 年 9 月改订）持续指导自治体施策，并有指針・計画策定状况调查 [Source: https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html, 2026]<\/li>\n<li>用法：查目标自治体多语言支援体制时，以该页与自治体官网为入口<\/li>\n<li><strong>执政党外国人政策审议动向<\/strong><\/li>\n<li>自民党外国人政策本部（出入国管理适正化・外国人受入相关 PT）持续审议 [Source: https://www.jimin.jp, 2026]<\/li>\n<li>解读：与\"管理强化\"主线呼应——强化证据链意识（推断）<\/li>\n<li><strong>灾害时外国人支援体制<\/strong><\/li>\n<li>总务省推进避难所等对外国人被灾者的信息传达支援（情報難民ゼロ项目・灾害时外国人支援信息协调员），与 13-regional 防灾情报渠道互补<\/li>\n<\/ol>\n<p>→ 跟踪：<a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#09-政策更新日志\">08-签证与在留 · 09<\/a><\/p>\n<h4 id=\"_24\">四、跟踪清单（每季度）<\/h4>\n<ul>\n<li>[ ] 入管法/政令改正新闻（ISA 首页）<\/li>\n<li>[ ] 永住指南·取消指南运用动向<\/li>\n<li>[ ] 育成就劳分野方针发布<\/li>\n<li>[ ] 自治体外国人施策（居住地变更时重查）<\/li>\n<\/ul>\n<p>→ 记录：<a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#09-政策更新日志\">08-签证与在留 · 09<\/a><\/p>\n<hr />\n<h3 id=\"03\">03 维权与合规工具箱<\/h3>\n<blockquote>\n<p>出问题时的自助路径。原则：<strong>先书面留证、再内部解决、后外部求助<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"_25\">一、劳动纠纷自助阶梯<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">级别<\/th>\n<th style=\"width:33%\">手段<\/th>\n<th style=\"width:34%\">入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>与上司/人事书面沟通（邮件留痕）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>公司内相談窓口/劳组（有则用）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>劳动基准监督署<\/strong>（加班费/解雇/工伤）<\/td>\n<td>https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/roumu/<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>劳动综合咨询（総合労働相談コーナー，免费匿名）<\/td>\n<td>各都道府县劳政事务所<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>劳动审判/诉讼<\/td>\n<td>弁护士（法テラス介绍）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>工伤：<strong>劳灾保险<\/strong>——通勤事故和业务事故都适用，不留证=白受伤。<\/p>\n<h4 id=\"_26\">二、在留问题咨询<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">问题<\/th>\n<th style=\"width:50%\">去处<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留资格疑义<\/td>\n<td>地方出入国在留管理局（有外语对应日）<\/td>\n<\/tr>\n<tr>\n<td>一般生活/劳动多语咨询<\/td>\n<td><strong>Yorisoi Hotline<\/strong>（多语 0120-279-338）<\/td>\n<\/tr>\n<tr>\n<td>特定技能支援问题<\/td>\n<td>登录支援机关/ISA 特定技能咨询<\/td>\n<\/tr>\n<tr>\n<td>法律支援（低收入者）<\/td>\n<td>法テラス https://www.houterasu.or.jp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_27\">三、证据留存规则（与永住证据链共用）<\/h4>\n<ul>\n<li>一切沟通争取书面化： LINE → 邮件确认、口头指示 → 复述+事后邮件<\/li>\n<li>给与明细、契约、规则集<strong>纸质+云盘双备份<\/strong><\/li>\n<li>健康診断结果、工伤记录永久保存<\/li>\n<\/ul>\n<h4 id=\"_28\">四、紧急情况速查<\/h4>\n<ul>\n<li>警察 110 / 救护·消防 119<\/li>\n<li>事故后：警方→公司运行管理者→保险→（必要时）领事馆<\/li>\n<li>签证权益受威胁时：ISA + 行政书士（先咨询后付费）<\/li>\n<\/ul>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 274, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "09-politics-law/reports/2026-11-politics-law.html"}}}, "education-qualification": {"name": "教育与资格", "dir": "10-education-qualification", "months": {"2026-11": {"title": "资格与教育投资 · 首份分析报告", "body": "\n<h1 id=\"_1\">资格与教育投资 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向拟在日本从事货运司机工作、需要职业资格与教育投资规划的读者，兼具资格路径与教育预算顾问视角。\n<strong>来源规则<\/strong>：① 文部科学省（mext.go.jp）、厚生労働省（技能士制度）、国土交通省（運行管理者等法定资格）＞ ② 各资格认定中央机构（フォークリフト運転技能講習登録機関、消防検定協会等）＞ ③ 全日本トラック協会 / 都道府県支部（讲习日程）＞ ④ 教习机构官网（费用，仅预期指标需交叉验证）；每条数据必须附可直接访问的 URL，并记录「机构 · 统计周期 · 公表日期 · 核验状态」。<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本资格与教育投资知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：物流 / 运输相关资格地图（法定必携资格、任用有利资格、远期资格、投入产出规则）；学习体系与教育投资（语言 / 资格 / 学历三账户、年度预算纪律、公共免费资源包）；日本学校教育体系与子女教育（6-3-3-4 学制、公立 / 私立 / 国际学校对比、外国人子女就学手续、日本语指导体制、教育成本与就学援助）；高等教育与技人国学历路径（高等教育体系定位、社会人入学 / 编入、通信制大学在职学历、「大学毕业 vs 10 年实务经验」对比）。<\/li>\n<li><strong>不含<\/strong>：驾照取得路径与费用（→ 01-ssw-driver，本主题主责登记册 #14）；在留资格要件（→ 08-visa-immigration）；岗位资格需求、职业实操、管理岗过渡（→ 02-career-driver / 03-career-management）；日语备考与考试日程 / 费用 / 考位（→ 11-language-japanese）；地域教育资源与自治体支援（→ 13-regional-info）；永住年收财务与证据链（→ 07-economy-finance）。<\/li>\n<\/ul>\n<p><strong>受众与用途<\/strong>：为拟赴日货运司机提供资格取得路径、教育投资决策框架与成本-时间对比，用途为资格路线选择与年度教育预算纪律的参照基线。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. 法定必携资格（運行管理者）与任用有利资格（フォークリフト）的取得路径与费用现状如何？\n2. 语言 / 资格 / 学历三账户的年度预算纪律如何落实？\n3. 外国人子女就学手续、日本語指導体制与教育成本结构现状如何？\n4. 通信制大学在职学历与「大学毕业 vs 10 年实务经验」两条技人国路线的成本-时间-风险对比如何？\n5. 技人国学历·职历审查口径的最新变化是什么？<\/p>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>驾照取得路径与费用<\/td>\n<td>01-ssw-driver<\/td>\n<\/tr>\n<tr>\n<td>在留资格要件（技人国学历 / 职历门槛）<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>岗位资格需求、职业实操、管理岗过渡<\/td>\n<td>02-career-driver / 03-career-management<\/td>\n<\/tr>\n<tr>\n<td>日语备考与考试日程 / 费用 / 考位<\/td>\n<td>11-language-japanese<\/td>\n<\/tr>\n<tr>\n<td>地域教育资源与自治体支援<\/td>\n<td>13-regional-info<\/td>\n<\/tr>\n<tr>\n<td>永住年收财务与证据链<\/td>\n<td>07-economy-finance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>资格地图<\/td>\n<td>法定必携 / 任用有利 / 远期资格与投入产出规则<\/td>\n<td>#1、#2、#3<\/td>\n<td>登録機関 / 都道府県労働局 / mlit.go.jp / 全ト协<\/td>\n<td>资格制度类近 12 个月内优先；讲习日程标注开设期次<\/td>\n<\/tr>\n<tr>\n<td>学习体系与教育投资<\/td>\n<td>语言 / 资格 / 学历三账户与年度预算纪律<\/td>\n<td>#4<\/td>\n<td>自记录<\/td>\n<td>年度（1 月复盘）<\/td>\n<\/tr>\n<tr>\n<td>学校教育体系与子女教育<\/td>\n<td>学制、就学手续、日本語指導体制、教育成本<\/td>\n<td>#5、#6、#7、#9<\/td>\n<td>mext.go.jp<\/td>\n<td>年度（调查公表后）<\/td>\n<\/tr>\n<tr>\n<td>高等教育与技人国学历路径<\/td>\n<td>在职学历可行性与技人国两条路线对比<\/td>\n<td>#8<\/td>\n<td>文科省 / 放送大学 / 各校官网<\/td>\n<td>年度（制度与学费带变化时）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：资格地图是本人三账户中「资格账户」的投入对象；学校教育体系与子女教育是「子女教育账本」，与本人三账户分开记；高等教育与技人国学历路径是「学历账户」的延伸，且其审查口径与 08-visa-immigration 联动。四个维度口径各自独立（受讲料 ≠ 教习料 ≠ 検定料），不得合并。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 资格地图<\/h3>\n<ul>\n<li>必备资格（主线，手册）：第一种驾驶执照（外免切替 3–5 万 / 国内考取 25–35 万）；特定技能评价试验（卡车）约 2 万；JFT-Basic / JLPT N4 约 1 万；运行管理基础讲习 1–3 万（Y1）；运行管理者试验 约 1.5 万（Y2）。来源：运行管理者试验中心、JITCO，https://www.unkan.or.jp/、https://www.jitco.or.jp/，2026。<\/li>\n<li>加分资格（手册）：フォークリフト 3–10 万（3–5 日）；危険物取扱者（乙 4）6 千；けん引自动车 15–25 万；JLPT N3→N2 各约 7,500 円；ロジスティクス検定（L 検）6–8 千；準中型 / 中型 / 大型免许 各 20 万级。<\/li>\n<li>登记册活值：#1 フォークリフト技能講習日程费用 <strong>待基线确立<\/strong>；#2 運行管理者等法定资格要件 <strong>待基线确立<\/strong>；#3 危険物取扱者试验日程 <strong>待基线确立<\/strong>。<\/li>\n<li>投入产出规则：一次只攻一个；公司能报销的先走公司；每张证书扫描归档。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 学习体系与教育投资<\/h3>\n<ul>\n<li>三账户：语言、资格、学历；总预算纪律为每年教育支出 ≤ 月收入 1 倍（手册）。<\/li>\n<li>语言账户：N4（2027）→ N3（Y2）→ N2（Y4），考试费+教材每级 1–2 万円。<\/li>\n<li>资格账户（手册）：Y1 运行管理基础讲习 1–3 万；Y2 运行管理者试验+フォークリフト 5–12 万；Y3 危険物乙 4 1 万；Y4 L 検+补强证书 2–3 万。<\/li>\n<li>学历账户：放送大学（教养学部）年 30–40 万；専門学校；通信制大学（经营 / 经济）。<\/li>\n<li>判断原则：学历只在「在留资格变更」或「转职硬门槛」出现时才买（手册）。<\/li>\n<li>登记册活值：#4 个人资格取得记录 <strong>待记录<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 日本学校教育体系与子女教育<\/h3>\n<ul>\n<li>学制：6-3-3-4（1947 年学校教育法确立），义务教育为小 6+中 3 共 9 年（来源 https://www.mext.go.jp/en/policy/education/overview/index.htm，2026）。<\/li>\n<li>公立（小·中）：授业料·教科书无偿，外国人子女希望就学者与日本人同样无偿接收（来源 https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm，2026）。<\/li>\n<li>私立初年度納付金：小 90.97 万 / 中 83.50 万 / 高 78.05 万円（R6 调查，2024-12-24 公表）。<\/li>\n<li>国际学校：学费带无官方统一统计，通常百万円级/年（<strong>推断<\/strong>）。<\/li>\n<li>现状数据：学龄相当外国人儿童住基登载数 177,726 人（调查以来最多），义务教育诸学校在籍 150,786 人（85.0%）；不就学 911 人 + 就学状况无法把握 8,013 人 + 住基人数差 229 人 = 不就学可能性 9,153 人（令和 7 年 5 月 1 日时点，2026-05-25 公表；来源 https://www.mext.go.jp/content/20260525-mxt_kyokoku-000049969_02.pdf）。<\/li>\n<li>日本語指導：公立 84,759 人（较前次 +22.6%），含国公私立 88,045 人，其中外国籍 73,313 人；1 人以上在籍学校 12,668 校（占全部公立学校 39.4%）；未受任何形式指导 11.4%（9,699 人）；日本語指導補助者 8,706 人、母語支援員 7,301 人（R7 调查，2026-05-25 公表）。<\/li>\n<li>升学现实（该群体）：高中生中途退学率 6.4%、高中进学率 91.5% 低于全体 98.9%。<\/li>\n<li>就学援助：要保護约 8 万人 + 準要保護约 109 万人（R6）；认定基准由各市町村自定。<\/li>\n<li>公立学校給食費：令和 7 年度公立小学月额 5,196 円（食材费相当，按都道府县学校数加权；来源 https://www.mext.go.jp/content/20260730-mxt-kenshoku-000051287_03.pdf）。<\/li>\n<li>登记册活值：#5 177,726 人 / 不就学可能性 9,153 人；#6 公立 84,759 人 / 含国公私立 88,045 人；#7 私立初年度納付金 + 就学援助认定数；#9 <strong>待复核<\/strong>（R7 调查起算出方法变更；手册暂用区间 4,000–5,000 円级）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 高等教育与技人国学历路径<\/h3>\n<ul>\n<li>高等教育体系：大学 4 年学士；大学院 修士 2 年+博士 3 年；短期大学 2–3 年；高等专门学校 5 年一贯；专门学校 2 年以上（専門士）。<\/li>\n<li>编入制度：国家只统一规定编入资格要件，选考方式与是否要求出身校成绩证明由各校自设（来源 https://www.mext.go.jp/en/policy/education/highered/title02/detail02/1373913.html，2025）。<\/li>\n<li>通信制大学：放送大学入学料 24,000 円+授课料 1 单位 6,000 円，毕业（124 单位）总费用 768,000 円～；3 年次编入（62 单位认定）例仅 406,000 円；私立通信制年 27–31 万円级（2026）。<\/li>\n<li>核心对比：① 大学毕业路线（硬门槛=学士学位，直接成本 76.8 万–120 万円，风险最低）vs ② 10 年实务经验路线（硬门槛=10 年相关实务经验，直接成本 0 円，但特定技能 1 号上限 5 年，须 Y5 前转其他就劳资格续积累）。<\/li>\n<li>审查口径变化：令和 8-04-15 起语言类业务需提交 CEFR B2 相当证明，JLPT N2 以上视同达标；日本国内大学毕业等情形可豁免（来源 https://www.moj.go.jp/isa/applications/status/gijinkoku.html，2026）。<\/li>\n<li>登记册活值：#8 放送大学毕业总费用 76.8 万円～（124 单位计）；私立通信制年 27–31 万円（2026）。<\/li>\n<\/ul>\n<p><strong>未取得 / 待核验项<\/strong>：\n- #1 フォークリフト技能講習日程费用——待基线确立。\n- #2 運行管理者等法定资格要件——待基线确立。\n- #3 危険物取扱者试验日程——待基线确立。\n- #4 个人资格取得记录——待记录。\n- #9 公立学校給食費保護者負担平均月額——待复核。\n- 国际学校学费带——无官方统一统计，<strong>推断<\/strong>值。<\/p>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>子女教育侧的官方统计已相当完整<\/strong>：学龄相当外国人儿童数、不就学可能性、日本語指導必要児童生徒数、私立初年度納付金、就学援助认定数均有文科省调查与公表日期支撑，可作为基线。（事实）<\/li>\n<li><strong>资格地图侧活值尚未闭合<\/strong>：#1、#2、#3 三项资格日程 / 要件均待基线确立，资格取得路径目前只有手册费用区间，无法核对具体开设期次。（事实）<\/li>\n<li><strong>通信制大学学费带已可溯源<\/strong>：放送大学毕业总费用 76.8 万円～与私立通信制年 27–31 万円级均有官方 / 学校来源，可作为学历账户的投入估算。（事实）<\/li>\n<li><strong>技人国两条路线的成本-时间-风险对比成立<\/strong>：大学毕业路线直接成本 76.8 万–120 万円但风险最低；10 年实务经验路线直接成本 0 円但受 1 号 5 年上限约束，须 Y5 前转资格续积累。（事实）<\/li>\n<li><strong>审查口径变化已触发复核<\/strong>：令和 8-04-15 起语言类业务 CEFR B2 相当证明要求，JLPT N2 视同达标，直接影响 N2 目标的价值评估。（事实）<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：\n- 国际学校学费带为推断值，无官方统一统计，个案差异大。\n- 手册资格费用为「约」值，且未逐项标注核验状态，实际以登录机关 / 教习机构当期公示为准。\n- 编入试验选考细节国家无统一规则，逐校不同。<\/p>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题（分析层）<\/strong>：\n1. フォークリフト技能講習的开设期次与日程费用首个基线值何时取得？\n2. 運行管理者等法定资格要件（受验资格、试验日程）的最新口径是什么？\n3. 令和 8·9 年 8 月給食費调查口径变更后，公立学校給食費月額的准确区间是多少？\n4. 技人国学历·职历审查口径后续是否还有调整？\n5. 个人资格取得记录与本人三账户实际支出何时建立？<\/p>\n<p><strong>下一期重点核实项<\/strong>：\n- 从登録機関 / 都道府県労働局取得 #1、#3 活值。\n- 从 mlit.go.jp / 全ト协取得 #2 活值。\n- 从 mext.go.jp 学校給食実施状況等調査取得 #9 复核值。<\/p>\n<p><strong>数据补全计划<\/strong>：月度核验仅更新登记册观察项；命中资格制度 / 讲习义务变化、文科省调查发布、大学制度改革、技人国审查口径变化等触发器时升级为季度重点更新；每年 1 月对照 02-学习体系与教育投资预算模板复盘。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>フォークリフト技能講習日程费用<\/td>\n<td>待基线确立<\/td>\n<td>登録機関 / 都道府県労働局<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>運行管理者等法定资格要件<\/td>\n<td>待基线确立<\/td>\n<td>mlit.go.jp / 全ト协<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>危険物取扱者试验日程<\/td>\n<td>待基线确立<\/td>\n<td>消防検定協会<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人资格取得记录<\/td>\n<td>待记录<\/td>\n<td>自记录<\/td>\n<td>待记录<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>学龄相当外国人儿童数·不就学数<\/td>\n<td>177,726 人 / 不就学可能性 9,153 人<\/td>\n<td>mext.go.jp（外国人の子供の就学状況等調査）<\/td>\n<td>令和 7 年 5 月 1 日时点，2026-05-25 公表<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>日本語指導必要児童生徒数（公立/含私立）<\/td>\n<td>公立 84,759 人 / 含国公私立 88,045 人<\/td>\n<td>mext.go.jp（受入状況等に関する調査）<\/td>\n<td>R7 调查，2026-05-25 公表<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>学校教育费用行情（私立初年度納付金/就学援助认定数）<\/td>\n<td>私立初年度納付金：小 90.97 万 / 中 83.50 万 / 高 78.05 万円；就学援助：要保護约 8 万 + 準要保護约 109 万人<\/td>\n<td>mext.go.jp<\/td>\n<td>R6 调查，2024-12-24 公表 / R6<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>通信制大学学费带<\/td>\n<td>放送大学毕业总费用 76.8 万円～（124 单位计）；私立通信制年 27–31 万円<\/td>\n<td>文科省 / 放送大学 / 各校官网<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>公立学校給食費保護者負担平均月額<\/td>\n<td>待复核（R7 调查起算出方法变更；手册暂用区间 4,000–5,000 円级）<\/td>\n<td>mext.go.jp（学校給食実施状況等調査）<\/td>\n<td>待复核<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：基线 <code>reports/2026-11-education-qualification.md<\/code>（v1.0 首期固定）；月度核验不重写报告，仅更新登记册「观察项与触发器状态」；季度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；事件触发插刷 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>（追加件）。<\/p>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节）：\n- 资格制度 / 讲习义务变化 → 01\n- 讲习日程与费用变化 → 01 / 02\n- 目标岗位资格要求变化（联动 02-career-driver、03-career-management 触发器）→ 01\n- 个人取得资格 → 01 / 02\n- 文科省外国人子女就学 / 日本語指導政策变化 → 03\n- 学校教育费用调查（学習費調査 / 私立納付金 / 給食費）发布 → 03\n- 大学制度改革 / 编入·社会人入学制度变化 → 04\n- 技人国学历·职历审查口径变化（联动 08-visa-immigration）→ 04\n- 通信制 / 社会人入试制度与学费带变化 → 04<\/p>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">状态项<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">更新于<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>唯一观察项<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>首要触发器<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>触发器结论<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：\n- <strong>A 官方一手<\/strong>：文科省调查（就学状況、受入状況、私立納付金、就学援助、学校給食）、国土交通省 / 运行管理者试验中心 / JITCO 资格信息、法务省 ISA 页面、各校官网学费。\n- <strong>B 权威转引<\/strong>：JASSO（编入试验选考细节复核入口）。\n- <strong>C 平台抽样 / 估算<\/strong>：手册资格费用「约」值、国际学校学费带（推断）、本人三账户预算模板（空白）。<\/p>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>讲习费用<\/td>\n<td>受讲料 ≠ 教习料 ≠ 検定料（逐项标注）<\/td>\n<\/tr>\n<tr>\n<td>学校教育费用<\/td>\n<td>公立（授业料·教科书无偿 + 给食费）≠ 私立（初年度納付金）≠ 国际学校（无官方统一统计）<\/td>\n<\/tr>\n<tr>\n<td>通信制学费<\/td>\n<td>放送大学（单位制总额）≠ 私立通信制（年额制）<\/td>\n<\/tr>\n<tr>\n<td>就学援助<\/td>\n<td>国家制度框架 ≠ 自治体认定基准（各市町村自定）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：#1、#2、#3（待基线确立）、#4（待记录）、#9（待复核）。<\/p>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li>文部科学省（
