<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jp-life-work · 报告阅读器</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#15202b; --ink2:#465667; --ink3:#6d7c8c;
  --line:#e1e7ee; --line2:#eef2f6;
  --navy:#16324f; --navy2:#2f5597; --blue:#3f6fb0; --blue-l:#eaf1fa;
  --green:#1c7444; --green-l:#eaf5ef;
  --amber:#9a6a12; --amber-l:#fdf4e2;
  --red:#a33a3a; --red-l:#fbecec;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,70,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14.5px}
a{color:var(--navy2);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}

/* ── 布局 ── */
.reader{display:flex;min-height:100vh;align-items:flex-start}
.rd-sidebar{width:280px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);background:#fbfcfe;padding:14px 10px 40px}
.rd-sidebar::-webkit-scrollbar{width:6px}
.rd-sidebar::-webkit-scrollbar-thumb{background:#d3dce6;border-radius:3px}
.rd-brand{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.rd-brand .logo{width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(128deg,#0f2338,#2f5597);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700}
.rd-brand .name{font-size:13px;font-weight:700;color:var(--navy);line-height:1.35}
.rd-brand .sub{font-size:10.5px;color:var(--ink3);font-weight:400}
.rd-toc{display:flex;flex-direction:column;gap:2px}
.rd-toc a{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--ink2);
  padding:5px 8px;border-radius:6px;line-height:1.4}
.rd-toc a:hover{background:var(--blue-l);text-decoration:none}
.rd-toc a.active{background:var(--blue-l);color:var(--navy);font-weight:700}
.rd-toc .num{font-size:10.5px;color:var(--ink3);flex:none}
.rd-toc .cnt{margin-left:auto;font-size:10.5px;color:var(--ink3);flex:none}

.rd-main{flex:1;min-width:0;padding:18px 26px 70px;max-width:1180px}

/* ── 报告头 ── */
.rd-head{position:sticky;top:0;z-index:30;background:rgba(244,246,249,.95);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  margin:-18px -26px 16px;padding:14px 26px 10px}
.rd-head .crumb{font-size:11.5px;color:var(--ink3)}
.rd-head h1{font-size:21px;color:var(--navy);margin:2px 0 6px;line-height:1.4}
.rd-head .sum{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.rd-head .sum b{color:var(--navy)}
.rd-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rd-months{display:flex;flex-wrap:wrap;gap:6px}
.rd-month{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:3px 11px;cursor:pointer;color:var(--ink2);font-family:inherit}
.rd-month:hover{border-color:var(--blue)}
.rd-month.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.rd-month.old{opacity:.55}
.rd-toggle{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:4px 11px;cursor:pointer;color:var(--navy2);font-family:inherit}
.rd-toggle:hover{border-color:var(--blue)}

/* ── 图例 ── */
.rd-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink3);
  margin:0 0 12px}
.rd-legend .k{display:inline-flex;align-items:center;gap:5px}
.rd-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ── 报告正文（沿用 md2html 通用模板风格） ── */
.rd-body{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px 30px;box-shadow:var(--shadow);max-width:1160px}
.rd-body h1,.rd-body h2,.rd-body h3{color:#16213e}
.rd-body table{border-collapse:collapse;width:100%;overflow-x:auto;display:block;
  margin:10px 0;font-size:13px}
.rd-body th,.rd-body td{border:1px solid #cbd5e1;padding:6px 10px;text-align:left}
.rd-body th{background:#f1f5f9}
.rd-body img{max-width:100%}
.rd-body code{background:#f6f8fa;padding:2px 4px;border-radius:3px}
.rd-body blockquote{border-left:4px solid #94a3b8;margin:8px 0;
  padding-left:12px;color:#475569}
.rd-body pre{background:#f6f8fa;padding:10px;border-radius:6px;overflow-x:auto}
.rd-body pre code{background:none;padding:0}

/* ── 差异高亮 ── */
.diff-badge{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;
  border-radius:3px;padding:2px 6px;margin-right:6px;vertical-align:middle;
  white-space:nowrap}
.diff-block{border-radius:6px;padding:4px 8px;margin:4px -8px}
.diff-new{background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)}
.diff-new .diff-badge{background:var(--green);color:#fff}
.diff-mod{background:var(--amber-l);box-shadow:inset 3px 0 0 var(--amber)}
.diff-mod .diff-badge{background:var(--amber);color:#fff}
.diff-del-group{margin:6px 0;border:1px dashed var(--line);border-radius:6px;
  background:#fbfcfe}
.diff-del-group>summary{cursor:pointer;font-size:12px;color:var(--ink3);
  padding:6px 10px;user-select:none;list-style:none}
.diff-del-group>summary::-webkit-details-marker{display:none}
.diff-del-group>summary::before{content:"▸ ";color:var(--gray)}
.diff-del-group[open]>summary::before{content:"▾ "}
.diff-del-group .diff-del-body{padding:2px 8px 8px;color:var(--ink3)}
.diff-del-group .diff-del-body s,.diff-del-group .diff-del-body del{color:var(--red)}
.diff-del-group .diff-badge{background:var(--gray-l);color:var(--gray)}
/* 隐藏更新标记：对照阅读模式 */
.rd-body.hide-diff .diff-badge{display:none}
.rd-body.hide-diff .diff-block{background:none;box-shadow:none;padding:0;margin:0}
.rd-body.hide-diff .diff-del-group{display:none}

/* ── 空态 ── */
.rd-empty{padding:50px 20px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ── 响应式 ── */
@media (max-width: 960px){
  .reader{flex-direction:column}
  .rd-sidebar{position:static;width:100%;height:auto;max-height:240px;border-right:0;
    border-bottom:1px solid var(--line)}
  .rd-main{padding:14px 14px 50px}
  .rd-head{margin:-14px -14px 14px;padding:12px 14px 8px}
  .rd-body{padding:16px}
}
</style>
</head>
<body>
<div class="reader">
  <aside class="rd-sidebar">
    <div class="rd-brand">
      <div class="logo">报</div>
      <div class="name">日本生活与工作 · 报告阅读器</div>
      <div class="sub">月度报告 · 跨月对比高亮</div>
    </div>
    <nav class="rd-toc" id="rd-toc"></nav>
  </aside>
  <main class="rd-main">
    <div class="rd-head" id="rd-head"></div>
    <div class="rd-legend">
      <span class="k"><span class="sw" style="background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)"></span>已更新 · 新增</span>
      <span class="k"><span class="sw" style="background:var(--amber-l);box-shadow:inset 3px 0 0 var(--amber)"></span>已更新 · 修改</span>
      <span class="k"><span class="sw" style="background:var(--gray-l)"></span>已更新 · 删除（折叠，可展开）</span>
      <span class="k">未变更内容保持原样</span>
    </div>
    <div class="rd-body" id="rd-body"></div>
  </main>
</div>

>\n<td>买东西<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><tr>\n<td>医疗<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><tr>\n<td>治安<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><tr>\n<td>教育<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><tr>\n<td>灾害<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><tr>\n<td>生活成本<\/td>\n<td><\/td>\n<td>13 登记册<\/td>\n<\/tr><hr><h3 id=\"_12\">七、变更记录<\/h3><tr>\n<th style=\"width:33%\">日期<\/th>\n<th style=\"width:33%\">变更<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr><tr>\n<td>2026-11-14<\/td>\n<td>建立空白模板<\/td>\n<td>由 00-decision-hub 首建；13 模板同源<\/td>\n<\/tr><hr><h3 id=\"_13\">八、版本记录<\/h3><tr>\n<th style=\"width:25%\">版本<\/th>\n<th style=\"width:25%\">日期<\/th>\n<th style=\"width:25%\">变更<\/th>\n<th style=\"width:25%\">说明<\/th>\n<\/tr><tr>\n<td>v1.0<\/td>\n<td>2026-11-14<\/td>\n<td>初始版本<\/td>\n<td>首建定居地档案模板（八节 + 免责）<\/td>\n<\/tr><hr><h3 id=\"_14\">九、免责声明<\/h3><p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p><hr><p>本档案为 v1.0 空白模板，确定居住地后填写并改名。<\/p><\/details>", "stats": {"new": 95, "mod": 0, "del": 139, "equal": 14, "prev": 153}, "summary": "2026-12 期与 2026-11 期对比：新增 95 处、修改 0 处、删除 139 处，未变更 14 处。", "path": "00-decision-hub/reports/2026-12-decision-hub.html"}}}, "ssw-driver": {"name": "特定技能司机", "dir": "01-ssw-driver", "months": {"2026-11": {"title": "日本特定技能司机 · 首份分析报告", "body": "\n<h1 id=\"_1\">日本特定技能司机 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向拟通过特定技能（SSW）签证赴日从事货运司机工作的读者，兼具行业监测与求职落地顾问视角。\n<strong>来源规则<\/strong>：① 日本政府官方一手：出入国在留管理庁（isa.go.jp）、国土交通省（mlit.go.jp）、厚生労働省（mhlw.go.jp）、警察庁（npa.go.jp）、内閣府、e-Gov 法令检索、総務省統計<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本特定技能司机与物流行业监测报告（基线版）<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义<\/strong>：特定技能「自動車運送業」分野（卡车 / 出租车 / 巴士运転者区分）的制度框架与在留路径、司机人才供需与薪资待遇、物流行业态势的指标面、L4 自动驾驶对司机岗位影响的结论面、就业落地路径。<\/p>\n<p><strong>监测范围（含）<\/strong>：特定技能「自動車運送業」分野制度与要件；司机供需与薪资待遇（缺口、工资、运賃、求人抽样、净收入模型）；物流行业态势指标面（倒産、运賃适正化、「2024 年問題」、企业动向）；L4 自动驾驶对司机岗位影响的结论面；就业落地路径（考试准备、招募渠道、在留落地、驾照路径、风险与维权）。<\/p>\n<p><strong>监测范围（不含）<\/strong>：技能实习与其他分野在留资格（→ 08-visa-immigration）；薪资结构与求职执行细节（→ 02-career-driver）；行业结构与赛道（→ 04-industry-logistics）；自动驾驶技术路线与法规（→ 05-industry-autonomous）；法规条文解读（→ 09-politics-law）；经济与收入环境（→ 07-economy-finance）。<\/p>\n<p><strong>受众与用途<\/strong>：供拟通过 SSW 签证赴日从事货运司机工作的读者判断进入窗口、考试与驾照路径、行业态势，兼具行业监测与求职落地顾问用途。<\/p>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>「自動車運送業」分野的受入上限与在留者规模处于什么水平？<\/li>\n<li>司机供需缺口与工资、运賃的走势如何，传导是否完全？<\/li>\n<li>物流行业（倒産、运賃适正化、「2024 年問題」）对司机就业与收入的影响如何？<\/li>\n<li>L4 自动驾驶对司机岗位的替代节奏如何？<\/li>\n<li>就业落地路径（考试、驾照、中介、支援机关）的关键瓶颈是什么？<\/li>\n<\/ol>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>制度规则、申请材料、在留资格细节<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>薪资结构、求职执行、现场操作细节<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>行业结构、赛道分析、自动化产业面<\/td>\n<td>04-industry-logistics<\/td>\n<\/tr>\n<tr>\n<td>自动驾驶技术路线、法规与实装细节<\/td>\n<td>05-industry-autonomous<\/td>\n<\/tr>\n<tr>\n<td>法规条文与政策解读<\/td>\n<td>09-politics-law<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>制度与签证路径<\/td>\n<td>分野要件、受入上限、在留者数、试验与支援体制<\/td>\n<td>#1 #2 #3 #12<\/td>\n<td>ISA / MLIT<\/td>\n<td>季度 / 事件触发<\/td>\n<\/tr>\n<tr>\n<td>司机供需与薪酬<\/td>\n<td>缺口、求人倍率、工资、求人抽样<\/td>\n<td>#4 #5 #6<\/td>\n<td>厚労省 / MLIT / 平台<\/td>\n<td>月度 / 季度<\/td>\n<\/tr>\n<tr>\n<td>物流行业态势<\/td>\n<td>倒産、运賃、适正化、「2024 年問題」、企业动向<\/td>\n<td>#7 #8 #9 #11<\/td>\n<td>TDB / TSR / MLIT / 企业 IR<\/td>\n<td>月度 / 季度<\/td>\n<\/tr>\n<tr>\n<td>智能驾驶展望<\/td>\n<td>L4 许可区域、实证进展与岗位影响结论面<\/td>\n<td>#10<\/td>\n<td>NPA / MLIT / SOZ<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>就业落地与中介<\/td>\n<td>考试路径、中介资质、驾照费用、在留落地<\/td>\n<td>#13 #14<\/td>\n<td>商务部 / 领馆 / 警察庁 / 教习所<\/td>\n<td>季度 / 事件触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：制度与签证路径决定「能否进入」的门槛与名额上限；司机供需与薪酬是核心模块，其缺口与运賃水平共同决定雇主付费意愿；物流行业态势通过运賃与倒産影响薪酬传导的可持续性；智能驾驶展望只输出结论面，不展开技术细节；就业落地与中介是前述制度与成本在个人层面的执行层，其中驾照路径是关键瓶颈。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 制度与签证路径<\/h3>\n<ul>\n<li>受入上限：<strong>22,100 人<\/strong>（2026-01-23 阁议，现行；ISA 自動車運送業分野页，2026-10-09 现在）；并列：<strong>24,500 人<\/strong>（SSW 官网中文页，2026）——两组官方数字并存，列入待复核；待核验：ssw.go.jp 仍写 24,500、未同步更正（登记册观察项，连续五次）（事实）。<\/li>\n<li>在留者数：自動車運送業 1 号 <strong>843 人<\/strong>（充足率 3.8%、年間増加 803）；SSW 1 号全体 <strong>438,128<\/strong>、2 号 <strong>23,348<\/strong>（ISA 统计月报，2026-08 末速报；ISA 2026-11-06 换版数据仍为 8 月末）（事实）。<\/li>\n<li>分野要件：卡车 A2.2 不变；<strong>出租车 / 巴士区分 2027-04-01 起 COE 申请须 B1 相当以上<\/strong>（JLPT N3 以上＋CEFR B1 判定）；本分野不得 2 号；无健康检查义务、仅適性診断（ISA / MLIT，令和 8 年 10 月 9 日改正）（事实）。<\/li>\n<li>试验与费用：ClassNK 技能試験 <strong>6,500 円<\/strong>（US$45、越南 US$50）、证明书 <strong>15,000 円<\/strong>；JFT-Basic <strong>10,000 円<\/strong>；JLPT N4 <strong>450 元<\/strong>；实施国 18，<strong>中国大陆无考点<\/strong>（ClassNK / Prometric / JLPT，2026-09 月报，2026-10-15）（事实）。<\/li>\n<li>登录支援机关：行情 <strong>2–4 万円/人·月<\/strong>；登录费 <strong>28,400 円<\/strong>；<strong>支援体制要件改正 2027-04-01 施行<\/strong>（支援責任者等常勤选任、养成讲习义务、担当者数 ≤10 机关 / ≤50 人基准）（ISA / 行业机构，2026）（事实）。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 司机供需与薪酬<\/h3>\n<ul>\n<li>缺口（并列口径）：现状 <strong>14%<\/strong>（14 万人相当）/ 2030 年 <strong>34%<\/strong>（34 万人相当）；2025 年度不足 <strong>110,809<\/strong>、2030 年度不足 <strong>162,912<\/strong>（政策パッケージ / NX 总研试算）；再检证：2030 年度平均约 <strong>7%<\/strong>／最大约 <strong>25%<\/strong>（MLIT 白書 2025／再检证资料，2025–2026）（事实并列，不可合并）。<\/li>\n<li>求人倍率与抽样：职业别 <strong>2.56<\/strong>（2026-09，常用含パート，2026-10-30 公布；较上月 +0.02pt）（事实）；基线并列：汽车驾驶业 2.54 vs 全产业 1.06（2026-08）；求人抽样 <strong>9 样本<\/strong>全部四元组立档、官网回溯完成（东京圈 22–45 万円／大阪圈 28–40.5 万円／地方 25–36 万円，聚合平台转载，2026）（事实 / C 级；待核验：原企业页未逐一回溯、中国同岗到手收入对比未建立）。<\/li>\n<li>工资：运输业·邮政业现金给与总额 <strong>341,158 円<\/strong>（+4.9%，2026-09，2026-11-06 公布；全产业对照 311,409 円、+4.6%）（厚労省毎月勤労統計，事实）。<\/li>\n<li>工资（转引）：全ト协 2025 年度版——男性大型司机月薪 <strong>39.5 万円<\/strong>（+4%）、全职务平均 <strong>35.98 万円<\/strong>（+5.3%）、含奖金 <strong>41.64 万円<\/strong>（+7.1%）（经 LogiShift 转引，原件待复核）（事实 / 待复核）。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 物流行业态势<\/h3>\n<ul>\n<li>倒産（双机构并列）：TSR 2026-10 全国 <strong>934 件<\/strong>（-3.2%）、運輸業 <strong>38 件<\/strong>（+2.7%，连续 2 个月增）、人手不足関連 <strong>50 件<\/strong>（10 月最多）；TDB 同月 <strong>950 件<\/strong>（-1.6%）、1–10 月 <strong>8,949 件<\/strong>（+4.3%）、人手不足倒産 <strong>56 件<\/strong>历史最多（事实）。基线并列：FY2025 道路货物运输业 <strong>321 件<\/strong>（TDB）vs 历年 <strong>308 件<\/strong>（TSR）——统计期间不同，不可比较或加总。<\/li>\n<li>运賃：日銀 SPPI「道路貨物輸送」<strong>+4.6%<\/strong>（2026-09 速報，8 月 +4.3%）；大分類「運輸・郵便」+8.4%（外航貨物拉动，不可混用）；SPPI 総平均 <strong>115.5<\/strong>（+3.7%）／WebKit <strong>142<\/strong>（2026-10）（事实）。标准运賃 +8%（令和 6 年告示第 209 号，2024-03）；价格转嫁率 24.2% → <strong>34.7%<\/strong>（2023-09 → 2025-09，中小企业厅）。<\/li>\n<li>「2024 年問題」：适正化二法 <strong>2025-06-11 公布<\/strong>；[1]–[3] 已于 <strong>2026-04-01 施行<\/strong>；[4] 许可更新制、[5] 適正原価下限（含标准运賃废止）未施行；物流効率化法 2026-04 起特定事業者·中長期計画；再配送率降至 <strong>7.6%<\/strong>（2026-04）（MLIT，事实）。<\/li>\n<li>企业动向：SGHD FY2027/3 上半期（官方決算短信，2026-11-06）営業収益 <strong>9,204.37 億円<\/strong>（+17.6%）、営業利益 <strong>414.40 億円<\/strong>（+7.5%）、経常利益 <strong>397.91 億円<\/strong>（+4.4%）、純利益 <strong>279.29 億円<\/strong>（+19.8%）；佐川急便 2027-01-01 起宅配便平均 <strong>+13.8%<\/strong>（事实；待核验：SGHD 数字引自 release.tdnet.info 決算短信，日通加薪报道列入待复核清单）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 智能驾驶展望<\/h3>\n<ul>\n<li>实绩与进展：<strong>截至 2026-02 全国 10 カ所实现 L4 社会实装<\/strong>（国交省官方口径，未公布按许可件数汇总值；原「12 件」无官方来源已废止）；いすゞ路線バス 2026 年度 L4 認可申請·2027 年度事業化；柏市 2025-11-12 取得县内首个许可（事实）。<\/li>\n<li>时间表：《モビリティ・ロードマップ 2026》（2026-07-21）——2027 年度起社会实装；2030 年度前国内导入自动驾驶服务车辆 <strong>1 万台<\/strong>；货运专项「2026 年以后在高速公路实现 L4 卡车社会实装」；先行事业化地域 <strong>13 处<\/strong>（事实）。<\/li>\n<li>岗位影响（<strong>推断<\/strong>）：干线夜行最先受影响；市内配送 2030 年前难以规模化替代；2027 年度前对求职者的实质就业影响约等于 0；岗位将转型而非直接消失。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 就业落地与中介<\/h3>\n<ul>\n<li>入境路径：海外申请者先以「特定活动」（特定自动车运送业准备）入境（2025-02-17 起；卡车最长 6 个月）；COE 手续费免费、标准审查 1–3 个月；未取得日本驾照则不能转入特定技能 1 号（ISA，2026）（事实）。<\/li>\n<li>签证费：单次约 <strong>15,000 円<\/strong>、多次约 <strong>30,000 円<\/strong>（2026-07-01 起改定）；并列驻日领馆人民币口径 <strong>715 元<\/strong>（一次）/ <strong>1,430 元<\/strong>（二次・数次），上海 / 青岛 / 重庆三馆一致（事实并列）。<\/li>\n<li>驾照费用：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09，最新月）；MT 通学 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）；大型 <strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06）；外免切替知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025-10–12，警察庁，经 drivey.jp 转引）（事实）。<\/li>\n<li>中介资质：路径＝商务部资质对外劳务合作企业＋日方送出机关体系；资质查询入口已核实；无资质出国务工属违法（商务部，2024）（事实）。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>窗口已开但名额有限<\/strong>（事实）：受入上限 22,100 人（2026-01-23 阁议）与 24,500 人（SSW 官网中文页）两组官方数字并存；在留者 843 人、充足率 3.8%（2026-08 末）。相对 84 万现役司机（2024，MLIT 杂志）属「高确定性、但窄口径」的进入窗口。<\/li>\n<li><strong>中国大陆考生面临「无考场」现实<\/strong>（事实）：ClassNK 技能試験 CBT 与 JFT-Basic 实施地均不含中国大陆；中国考生实际路径为赴第三国考试或在日本国内受验，日语考试主路径为 JLPT（每年 7 月、12 月两次）。<\/li>\n<li><strong>供需缺口决定雇主付费意愿<\/strong>（事实）：有效求人倍率 2.56（2026-09）；运输业月均现金给与 341,158 円（+4.9%）；但缺口精确值存在 14%/34% 与 7%/25% 两套口径，不可合并。<\/li>\n<li><strong>运价→工资传导已启动但不完全<\/strong>（推断）：2026 春斗卡车业加薪率 3.85% 低于全产业 5.02%；全ト协调查显示大型司机月薪已达 39.5 万円（+4%）；头部企业待遇公告显著高于行业均值。<\/li>\n<li><strong>自动驾驶暂不构成就业威胁<\/strong>（推断）：L4 现阶段限定「深夜·限定区间·路车协调」的新东名约 100km 实证，商用化目标在 2027–2028 年度以后，首波聚焦幹線运送；市内配送替代节奏预计显著更慢。<\/li>\n<li><strong>落地最大风险在驾照与中介<\/strong>（事实＋推断）：外免切替 2025-10 起大幅严格化（知识确认合格率 42.8%、技能确认 13.1%）；招募必须走商务部资质企业；警惕月给低于行情 20% 以上且无手当明细的转介合同（推断）。<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>受入上限两组官方数字并存，名额判断存在口径风险。<\/li>\n<li>缺口精确值两套口径差异大，影响对「窗口期长度」的判断。<\/li>\n<li>求人样本为聚合平台转载（C 级），原企业页未逐一回溯。<\/li>\n<li>L4 岗位影响全部为推断，尚无官方就业替代测算。<\/li>\n<li>2027-04-01 两项要件（出租车/巴士 B1、支援体制改正）生效前的政策细节未完全核实。<\/li>\n<\/ul>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>：<\/p>\n<ol>\n<li>ISA 9 月末速报何时发布？在留者数与充足率是否更新？<\/li>\n<li>ssw.go.jp 受入上限 24,500 与 ISA 22,100 差异的官方解释是什么？<\/li>\n<li>2027-04-01 两项要件对现存与新增申請者的实际影响？<\/li>\n<li>求人样本能否回溯至原企业求人页核对「各種手当」明细？<\/li>\n<li>中国同岗到手收入对比能否建立（需中文来源回溯）？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：受入上限差异（ISA 分野页与 ssw.go.jp 对照）；各领馆现行签证费；MLIT 司机不足实态调查原文；全ト协工资调查原件；SGHD 決算短信原件；ClassNK 国内受验费官方数额表；本分野健康检查义务条文；「ITJ」/「GFP」官方名称；技能实习 / 特定技能 2 号完整对比表官方口径。<\/p>\n<p><strong>数据补全计划<\/strong>：优先补 ISA 统计月报分野别总数与 9 月末速报；建立求人样本原企业页回溯留痕；补中国侧收入对比输入；待次期按骨架重写时补齐免责声明节与顶部导航。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>特定技能在留者总数（分野别）<\/td>\n<td>自動車運送業 1 号 843 人（充足率 3.8%、年間増加 803）；SSW 1 号全体 438,128、2 号 23,348；ISA 2026-11-06 已换版但数据仍为 8 月末 [001472175.pdf]<\/td>\n<td>ISA 统计月报（moj.go.jp）<\/td>\n<td>2026-08 末速报<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>「自動車運送業」分野要件<\/td>\n<td>受入上限 22,100（2026-01-23 阁议）；卡车 A2.2 不变；出租车/巴士区分 2027-04-01 起 COE 申请须 B1 相当以上（JLPT N3 以上＋CEFR B1 判定）；本分野不得 2 号；无健康检查义务、仅適性診断 [001472534.pdf 令和8年10月9日改正; 03_00198.html 2026]<\/td>\n<td>isa.go.jp / mlit.go.jp<\/td>\n<td>2026-01-23 / 令和 8 年 10 月 9 日改正<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>技能試験・日本語試験日程与费用<\/td>\n<td>ClassNK 6,500 円（US$45、越南 US$50）、证明书 15,000 円；JFT-Basic 10,000 円；JLPT N4 450 元；月报最新 2026-09（2026-10-15，实施国 18，中国大陆无考点）；2026-12 JLPT N1–N5 全等级报名截止前满员，官方引导转 JFT-Basic [news/; 001471906.pdf]<\/td>\n<td>ClassNK portal / Prometric / JLPT<\/td>\n<td>2026-09 / 2026-10-15 / 2026-12<\/td>\n<\/tr <td>基线确立<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>登録支援機関<\/td>\n<td>待基线确立<\/td>\n<td>支援月额行情 2–4 万円/人、登录机构逾 8,000 家（第三方，2026）；登录手续费官方 28,400 円<\/td>\n<td>基线确立<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>中国中介渠道<\/td>\n<td>待基线确立<\/td>\n<td>路径＝商务部资质对外劳务合作企业＋日方送出机关体系（ssw.go.jp 中文页，2026）；资质查询入口已核实<\/td>\n<td>基线确立<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>驾照路径与费用<\/td>\n<td>待基线确立<\/td>\n<td>外免切替 2025-10 严格化（知识确认合格率 42.8%）；普通 MT 教习约 40 万円、大型（持中型）约 21.4 万円（2026 示例）<\/td>\n<td>基线确立<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"_13\">一、核心结论（摘要）<\/h3>\n<ol>\n<li><strong>窗口已开但名额有限<\/strong>：「自動車運送業」分野 2024-12-19 起正式接收特定技能 1 号外国人，五年受入上限存在 <strong>22,100 人 vs 24,500 人<\/strong> 两组官方数字并存（详见待复核清单），相对 84 万现役司机的行业规模属于\"高确定性、但窄口径\"的进入窗口。[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026; https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/, 2026]<\/li>\n<li><strong>中国大陆考生面临\"无考场\"现实<\/strong>：ClassNK 技能試験 CBT 与 JFT-Basic 的实施地均<strong>不含中国大陆<\/strong>，中国考生实际路径为赴第三国考试或在日本国内受验，日语考试只能走 JLPT（每年 7 月、12 月两次）。[Source: https://sswt-portal.classnk.or.jp/area?tab=3, 2026; https://www.prometric-jp.com/zh-CHS/ssw/, 2026; https://jlpt.neea.cn/faq.html, 2026]<\/li>\n<li><strong>供需缺口决定雇主付费意愿<\/strong>：国交省再检证将 2030 年度卡车运力缺口从旧估 34% 修正为\"对策下平均约 7%／最大约 25%\"，2026 年 8 月司机有效求人倍率高达 <strong>2.54<\/strong>（全产业 1.06）。薪资端运输业月均现金给与 34.1 万円（同比+4.9%），但司机绝对收入仍低于全产业均值。[Source: https://www.mlit.go.jp/seisakutokatsu/freight/content/001984794.pdf, 2025; https://www.mhlw.go.jp/content/11602000/001753011.pdf, 2026; https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/2609p.html, 2026]<\/li>\n<li><strong>运价→工资传导已启动但不完全<\/strong>（推断）：2026 春斗卡车业加薪率 3.85% 低于全产业 5.02%，但全ト协调查显示大型司机月薪已达 39.5 万円（+4%）；头部企业（佐川、雅玛多）待遇公告显著高于行业均值。<strong>此传导判断为推断，非官方结论。<\/strong>[Source: https://logishift.net/2026/08/06/post-7782/, 2026; https://www.jil.go.jp/kokunai/blt/backnumber/2026/06/blm_sanbetsu.html, 2026]<\/li>\n<li><strong>自动驾驶暂不构成就业威胁<\/strong>（推断）：L4 现阶段限定\"深夜·限定区间·路车协调\"的新东名约 100km 实证，商用化目标在 2027–2028 年度以后，且首波聚焦幹線运送；市内配送司机的替代节奏预计显著更慢。<strong>全部为推断。<\/strong>[Source: https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/2415ad00-6a79-4ebc-8fb1-51a47b1b0552/11045673/20260721_meeting_mobility_01.pdf, 2026]<\/li>\n<li><strong>落地最大风险在驾照与中介<\/strong>：中国驾照外免切替 2025-10 起大幅严格化（技能确认合格率仅 13.1%），办理路径建议优先\"特定活动（准备）入境＋在日直考\"；招募必须走商务部资质企业。[Source: https://www.police.pref.chiba.jp/menkyoka/licence_info-11.html, 2025; https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<\/ol>\n<hr />\n<h3 id=\"_14\">二、特定技能制度与签证路径<\/h3>\n<h4 id=\"21-2026-11-11\">2.1 制度框架（截至 2026-11-11）<\/h4>\n<ul>\n<li><strong>特定技能 1 号<\/strong>：在留期间合计上限 5 年、不可携家属；<strong>2 号<\/strong>：无上限、可携配偶子女。[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]<\/li>\n<li><strong>分野规模<\/strong>：1 号可从事 19 个分野、2 号 11 个（出入国在留管理庁中文版）。[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]<\/li>\n<li><strong>「自動車運送業」分野<\/strong>：2024-03-29 阁议决定新增（同批：铁道、林业、木材产业），监管省厅为<strong>国土交通省<\/strong>；2024-12-19 上乗せ基准告示施行后正式开始接收；分野运用方针已于 2026-01-23 重新阁议决定。[Source: https://www.moj.go.jp/isa/applications/ssw/2024.03.29.kakugikettei.html, 2024–2026; https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/li>\n<li><strong>受入上限（冲突并列）<\/strong>：<\/li>\n<li>22,100 人（2024 年 4 月–2029 年 3 月末，ISA 自動車運送業分野页）[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026-10-09 现在]<\/li>\n<li>24,500 人（卡车/出租车/巴士合计，SSW 官网中文页）[Source: https://www.ssw.go.jp/about/visa/automobile_transportation_business_1/, 2026]<\/li>\n<li>两组官方数字并存，未辨析差异（疑为不同时点修订或含/不含某岗位），列入待复核。<\/li>\n<li><strong>⚠️ 本分野仅设 1 号<\/strong>：卡车司机不存在 2 号路径；1→2 号转换、育成就劳制度是否覆盖本分野\"现时点未定\"。[Source: https://www.mlit.go.jp/jidosha/content/002004573.pdf, 2026-06]<\/li>\n<\/ul>\n<h4 id=\"22\">2.2 「自動車運送業」分野人材基准<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">岗位<\/th>\n<th style=\"width:25%\">技能要件<\/th>\n<th style=\"width:25%\">日语要件<\/th>\n<th style=\"width:25%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车司机（监测重点）<\/td>\n<td>评价试验（卡车）合格 ＋ 第一种驾照<\/td>\n<td>JFT-Basic A2.2 相当 <strong>或<\/strong> JLPT N4 以上<\/td>\n<td>技能实习 2 号良好修業者免日语<\/td>\n<\/tr>\n<tr>\n<td>出租车/巴士司机<\/td>\n<td>评价试验 ＋ <strong>第二种驾照<\/strong> ＋ 新任驾驶员研修<\/td>\n<td>原则 JLPT N3（CEFR B1）；雇主落实 B1 学习计划等措施可放宽至 N4/A2.2<\/td>\n<td>课加条件第 9/10/11 条<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/p>\n<ul>\n<li>业务范围：卡车/出租车/巴士驾驶员（限事业用车辆）及附带业务。<\/li>\n<li>健康检查义务条文：本次未在 ISA 分野页核实到统一规定 → 待复核。<\/li>\n<\/ul>\n<h4 id=\"23\">2.3 试验信息（技能試験 + 日本語試験）<\/h4>\n<p><strong>技能試験<\/strong>（实施主体：一般财团法人日本海事协会 ClassNK）\n- 形式：CBT 或纸面；学科 30 问（○×）＋实技 20 问（三选一），共 80 分钟，各正答率 ≥60% 合格；试题日语（附注音）。[Source: https://www.mlit.go.jp/jidosha/content/001851696.pdf, 2024-12 施行]\n- CBT 无固定考期、考位有空随时可考；实施地：日本、印度、印尼、乌兹别克、吉尔吉斯、柬埔寨、斯里兰卡、泰国、尼泊尔、巴基斯坦、孟加拉、菲律宾、马来西亚、缅甸、蒙古、老挝、越南、塔吉克——<strong>中国大陆无考场<\/strong>；出差考试限企业申请（海外 50 枠起）。[Source: https://sswt-portal.classnk.or.jp/area?tab=3, 2026]\n- 受验费：<strong>日本国内 6,500 円（税抜）、海外 US$45<\/strong>（2026-09-01 起改定）；合格证明书发行手续费 15,000 円（税抜）；合格证有效期 10 年。[Source: https://sswt-portal.classnk.or.jp/news/25, 2026]\n- 官方免费样本题在 ClassNK Portal 公开（声明与实考同源）。[Source: https://sswt-portal.classnk.or.jp/area?tab=3-1, 2026]\n- 全日本トラック协会发布面向外国人的学習用テキスト。[Source: https://jta.or.jp/member/driver/ssw_text.html, 2026]<\/p>\n<p><strong>日本語試験<\/strong>\n- JFT-Basic：随時 CBT，海外 14 国（Prometric 中文页）／27 都市＋日本国内 10 都道府县——<strong>中国大陆不在实施地<\/strong>；2026-08 起增判 A1/A2.1（育成就劳对应）。[Source: https://www.prometric-jp.com/zh-CHS/ssw/, 2026; https://www.jpf.go.jp/jft-basic/report/pdf/2025-12-202601.pdf, 2026]\n- JLPT：中国大陆每年 2 回（2026 年：7 月 5 日、12 月 6 日），<strong>N4 报名费 450 元人民币<\/strong>（N1/N2 550 元）——中国考生实际主路径。[Source: https://jlpt.neea.cn/faq.html, 2026]<\/p>\n<h4 id=\"24\">2.4 申请流程与费用<\/h4>\n<ol>\n<li>海外申请者先以<strong>「特定活动」（特定自动车运送业准备）<\/strong>入境（2025-02-17 起受理；卡车最长 6 个月），办理驾照（外免切替）与研修——未取得日本驾照则<strong>不能<\/strong>转入特定技能 1 号；变更审查期可特例在留最长 2 个月。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li>雇主代办在留资格认定证明书（COE）：<strong>手续费免费、标准审查 1–3 个月<\/strong> → 驻外使领馆签证 → 入境。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li>签证费：2026-07-01 起改定——单次有效约 <strong>15,000 円<\/strong>、多次约 30,000 円（当地货币缴纳）。冲突并列：驻沈阳总领馆旧页为 200 元人民币＋受理后第 5 个工作日发证（年份未标注）。[Source: https://www.mofa.go.jp/mofaj/toko/visa/tetsuzuki/pagew_000001_02672.html, 2026-06-24 更新; https://shenyang.cn.emb-japan.go.jp, 年份未标注]<\/li>\n<li>在留期间更新/变更许可手续费 5,500 円。[Source: https://www.moj.go.jp/isa/11_00108.html, 2026]<\/li>\n<\/ol>\n<h4 id=\"25\">2.5 登録支援機関<\/h4>\n<ul>\n<li>职责：代雇主实施\"义务性支援 10 项目\"（事前指导、接送、住房·生活契约、生活指导、陪同行政手续、日语学习机会、咨询处理、交流促进、转职支援、每 3 个月以上面谈·通报）；不得再委托。[Source: https://www.moj.go.jp/isa/policies/ssw/supportssw.html, 2026]<\/li>\n<li>登录要件：须能实施支援计划全部项目；登录 5 年有效，手续费新登录 <strong>28,400 円<\/strong>／更新 11,100 円；本分野受托支援机关还须加入国交省协议会（免费）。[Source: 同上; https://www.mlit.go.jp/jidosha/content/002004573.pdf, 2026]<\/li>\n<li>市场行情（官方不定价；第三方 2026-04 更新）：初期 0–10 万円＋<strong>月额 2–4 万円/人<\/strong>，登录机构逾 8,000 家；月额 1 万円以下属异常低价。[Source: https://foreignworker-guide.com/articles/how-to-choose-support-agency/, 2026]（推断性经验值，非官方定价）<\/li>\n<\/ul>\n<h4 id=\"26\">2.6 制度口径对比（术语不混用提示）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">特定技能（SSW）1号<\/th>\n<th style=\"width:20%\">特定技能 2号<\/th>\n<th style=\"width:20%\">技能实习<\/th>\n<th style=\"width:20%\">特定活动（本分野准备用）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留期间<\/td>\n<td>合计 5 年上限<\/td>\n<td>无上限<\/td>\n<td>原则最长 3 年（2025 年制度改正后口径待复核）<\/td>\n<td>卡车最长 6 个月<\/td>\n<\/tr>\n<tr>\n<td>家属<\/td>\n<td>不可<\/td>\n<td>可（配偶子女）<\/td>\n<td>不可<\/td>\n<td>不可<\/td>\n<\/tr>\n<tr>\n<td>定位<\/td>\n<td>即战力劳力<\/td>\n<td>更高熟练度<\/td>\n<td>人材育成/技能转让目的<\/td>\n<td>驾照·研修过渡<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>SSW 数据行：[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]；特定活动行：[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li>⚠️ 技能实习、特定技能 2 号分野适用性的完 rong>265,020 円<\/strong><\/td>\n<td>N3＋第一种免许、升给赏与あり<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>企业待遇公告参考：佐川急便招聘面月收例 32 万円、年收 480 万起 [Source: https://www.trucknews.biz/article/r091138/, 2025]；雅玛多 SD 司机\"年收 600 万円以上可\"（例：30 岁·入社 5 年·月收 40 万円）[Source: https://www.kuronekoyamato.co.jp/ytc/corp/recruit/sales-driver/benefits-and-training.html, 2026]。<\/p>\n<h4 id=\"34_1\">3.4 运赁（司机工资的行情基础）<\/h4>\n<ul>\n<li>日银企业向服务价格指数「道路货物运输」：2026-09 = 113.3（2020=100），<strong>同比+4.6%<\/strong>。[Source: https://www.dlri.co.jp/files/macro/666907.pdf, 2026（引日银 SPPI）]<\/li>\n<li>WebKit 成约运赁指数：2026-10 = <strong>142<\/strong>（同比+5pt）；并列：2026-09 = 143（LogiShift 口径）。[Source: https://cargo-news.online/news/detail.php?id=12653, 2026; https://logishift.net/stats/truck-freight-rate-index/, 2026]<\/li>\n<li>标准运赁：令和 6 年告示第 209 号（2024-03）水准 <strong>+8%<\/strong> 并新增装卸费加算。[Source: https://jta.or.jp/member/kaisei_jigyoho/unchin_new.html, 2024]<\/li>\n<li>价格转嫁率：2023-09 的 24.2% → 2025-09 的 <strong>34.7%<\/strong>（中小企业厅）。[Source: https://www.jil.go.jp/event/ro_forum/20260529/houkoku/01-keynote-shuto.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"35_1\">3.5 净收入参考模型（推断）<\/h4>\n<p><strong>模型输入参数（均官方来源）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">参数<\/th>\n<th style=\"width:50%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.kyoukaikenpo.or.jp/about/business/insurance_rate/rate_prefectures/r08/\" title=\"来源：https://www.kyoukaikenpo.or.jp/about/business/insurance_rate/rate_prefectures/r08/, 2026\">健康保险料率（协会けんぽ令和 8 年度，劳动折半）<\/a><\/td>\n<td>东京 9.85%／大阪 10.13%＋子ども·子育て支援金 0.23%（2026-04 起全国）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.nenkin.go.jp/service/kounen/hokenryo/hoshu/20150515-01.html\" title=\"来源：https://www.nenkin.go.jp/service/kounen/hokenryo/hoshu/20150515-01.html, 2026\">厚生年金<\/a><\/td>\n<td>18.3%、本人折半 9.15%<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://jsite.mhlw.go.jp/yamagata-roudoukyoku/koyouhoken-20260316.html\" title=\"来源：https://jsite.mhlw.go.jp/yamagata-roudoukyoku/koyouhoken-20260316.html, 2026\">雇用保险（一般事业，本人负担）<\/a><\/td>\n<td>0.5%<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.nta.go.jp/publication/pamph/gensen/zeigakuhyo2026/01.htm\" title=\"来源：https://www.nta.go.jp/publication/pamph/gensen/zeigakuhyo2026/01.htm, 2026\">源泉征收<\/a><\/td>\n<td>国税厅令和 8 年分税额表（2026-01 改定）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>示例概算（月给总额 30 万円、东京、40 岁未满、单身无扶养——全部为推断）<\/strong>：社保约 4.4 万円（健康保険折半约 1.5 万＋年金折半 2.7 万＋雇用 0.15 万）＋所得税约 0.44 万＋住民税约 0.85 万 → <strong>到手约 24.3 万円/月<\/strong>（入职首年无前年住民税约 25.2 万）。模型未含赏与、通勤手当等非课税/变动项；中国同岗到手收入对比因需中文来源回溯未建立 → 待次期补充。<\/p>\n<hr />\n<h3 id=\"_16\">四、物流行业态势<\/h3>\n<h4 id=\"41-2024\">4.1 \"2024年問題\"后续<\/h4>\n<ul>\n<li>官方定调：2024 年度约 14% 运力缺口经官民对策\"基本克服\"；宅配件数 FY2024 约 50 亿个维持高位。[Source: https://www.mlit.go.jp/seisakutokatsu/freight/content/001984794.pdf, 2025]<\/li>\n<li>未发生全国性停运，总合物流施策大纲记载\"部分地区出现运输限制\"；再配送率降至 7.6%（2026-04）。[Source: https://www.mlit.go.jp/report/press/tokatsu01_hh_001025.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"42\">4.2 物流倒産（双机构双口径并列）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">统计机构<\/th>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:34%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.tdb.co.jp/report/bankruptcy/aggregation/20260408-bankruptfy2025/\" title=\"来源：https://www.tdb.co.jp/report/bankruptcy/aggregation/20260408-bankruptfy2025/, 2026\">帝国データバンク<\/a><\/td>\n<td>FY2025（2025.4–2026.3）<\/td>\n<td>道路货物运输业 <strong>321 件<\/strong>＝史上第 4 高（前三位：2008 年度 371、FY2024 351、2009 年度 341）；其中人手不足倒产 55 件、物价高涨 91 件<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.tsr-net.co.jp/data/detail/1202864_1527.html\" title=\"来源：https://www.tsr-net.co.jp/data/detail/1202864_1527.html, 2026\">东京商工リサーチ<\/a><\/td>\n<td>历年 2025 年<\/td>\n<td>道路货运倒产 <strong>308 件（-17.6%）<\/strong>；2026 年 1–4 月 108 件（+11.3%），人手不足倒产 23 件创 2013 年统计以来新高<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 两个机构统计期间不同（事业年度 vs 历年），<strong>不可直接比较或加总<\/strong>。<\/p>\n<h4 id=\"43\">4.3 运价与政策<\/h4>\n<ul>\n<li>运价谈判实施率：FY2022 68% → FY2024 74% → <strong>FY2025 90%<\/strong>；但收受达标准运价 8 成以上者仅约 35%。[Source: https://www.mlit.go.jp/report/press/jidosha04_hh_000361.html, 2026]<\/li>\n<li>企业改定：佐川急便 2027-01-01 起宅配便平均 <strong>+13.8%<\/strong> [Source: https://www2.sagawa-exp.co.jp/newsrelease/detail/2026/1002_2672.html, 2026]；福山通运 2026-11 起较 FY2024 约 <strong>+20%<\/strong> [Source: https://logishift.net/2026/10/27/post-9951/, 2026]；雅玛多 2024-04 个人报价约 +2% [Source: https://www.yamato-hd.co.jp/english/news/2023/pdf/newsrelease_20240112_en01.pdf, 2024]。<\/li>\n<li><strong>トラック适正化二法<\/strong>：2025-06-11 公布，国家设定\"适正原价\"，荷主与运送双方均不得低于该水平收付，公布后 3 年内施行；\"适正原价设定检讨会\"2026 年已开 4 次，年内拟出建言；2026-04 起禁止委托无许可\"白牌卡车\"（荷主罚 100 万円以下）。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2025–2026; https://www.mlit.go.jp/jidosha/jidosha_mn4_000020.html, 2026; https://wwwtb.mlit.go.jp/kinki/content/000365947.pdf, 2026]<\/li>\n<li><strong>运价→工资传导（推断声明）<\/strong>：全日协调查大型司机月薪 +4% 表明转嫁已部分传导；但卡车业加薪率 3.85% 低于全产业 5.02% 表明传导不完全。两处判断均为<strong>推断<\/strong>。[Source: https://logishift.net/2026/08/06/post-7782/, 2026; https://www.jil.go.jp/kokunai/blt/backnumber/2026/06/blm_sanbetsu.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"44-ma\">4.4 行业 M&amp;A 与企业动态<\/h4>\n<ul>\n<li>SGHD：2024-07 将名糖运输、ヒューテックノオリン纳入集团；2025 年度收购 Morrison；FY2026/3 上半期销售额 9,204 亿円（转引待核 IR 原件）。[Source: https://www.sg-hldgs.co.jp/ir/management/directormessage/, 2026]<\/li>\n<li>日通：出售低收益资产资金投入 M&amp;A。[Source: https://pdf.irpocket.com/C9147/doF3/OcDN/QgbQ.pdf, 2025]<\/li>\n<li>政策支援：国交省依产业竞争力强化法认定\"特别事业再编计划\"；SMRJ 事业承继门户、政策金融公库承继 Matching 支援累计约 700 社（2022）。[Source: https://www.mlit.go.jp/jidosha/jidosha_tk5_000038.html; https://shoukei.smrj.go.jp/; https://www.jfc.go.jp/n/release/pdf/topics_220805a.pdf, 2022]<\/li>\n<li><strong>外国人雇佣动向<\/strong>：佐川急便 2025 年以特定技能接收<strong>越南司机<\/strong>（业界首批案例之一）；2025-09 与 TDG 合办特定技能司机采用讲座。[Source: https://yuso.co.jp/20251014-12/, 2025; https://www.trucknews.biz/article/r091138/, 2025]<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_17\">五、智能驾驶与未来展望<\/h3>\n<h4 id=\"51\">5.1 制度框架与实绩<\/h4>\n<ul>\n<li>等级口径：SAE L0–L4（日本政府文件注记采用）；L4＝限定区域内系统替代全部驾驶操作、无需驾驶人。[Source: https://www8.cao.go.jp/koutu/taisaku/r05kou_haku/zenbun/genkyo/topics/topic_1.html, 2023]<\/li>\n<li>令和 4 年改正道交法（2022-04 施行）创设\"特定自动运行许可\"（无驾驶人公道运行，需都道府县公安委员会批准）。实绩：<strong>截至 2026-05 许可累计 12 件<\/strong>；2025 年度全国 60+ 地点实施实证（含有人驾驶辅助类）。[Source: https://www.npa.go.jp/bureau/traffic/selfdriving/index.html, 2026; https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/2415ad00-6a79-4ebc-8fb1-51a47b1b0552/11045673/20260721_meeting_mobility_01.pdf, 2026]<\/li>\n<li>首辆 L4 车辆认证：2023-03-30 福井县永平寺町。[Source: https://www.mlit.go.jp/report/press/jidosha07_hh_000442.html, 2023]<\/li>\n<\/ul>\n<h4 id=\"52-20262026-07-21\">5.2 官方时间表（《モビリティ・ロードマップ2026》，2026-07-21 数字社会推进会议决定）<\/h4>\n<ul>\n<li>2027 年度起社会实装；2030 年度前国内导入自动驾驶服务车辆 1 万台；2030 年代全球 AV 销量份额约 25%。[Source: 同上 PDF, 2026]<\/li>\n<li>货运专项：\"2026 年以后在高速公路实现 L4 卡车社会实装\"；企业口径无人卡车 2027 年度事业化、RoboTruck 2028 年度事业化；《総合物流施策大綱(2026-2030)》（2026-03 阁议）将自动驾驶卡车社会实装列为物流效率化支柱。[Source: 同上; https://www.cas.go.jp/jp/seisaku/nipponseichosenryaku/kaigi/dai5/shiryou3.pdf, 2026]<\/li>\n<li>先行事业化地域 13 处（横滨、堺、神户、日立、盐尻、仙台、筑波、川崎、平冢、小松、爱知、京都、三丰），2027 年度事业化。[Source: https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/57849d08-38bd-4c73-be1d-7b38606a6ee0/c238efb2/20260324_meeting_mobility-working-group15_outline_09.pdf, 2026]<\/li>\n<\/ul>\n<h4 id=\"53\">5.3 货车/干线实证<\/h4>\n<ul>\n<li>新东名骏河湾沼津 SA—滨松 SA 约 100km：2025-03 起深夜设\"自动驾驶车优先车道\"，L4 卡车公道实证进行中（合流支援、坠物/施工信息等路车协调）。[Source: 同路线图 PDF; https://www.mlit.go.jp/report/press/road01_hh_001845.html, 2024]<\/li>\n<li>2024-11-05 丰田通商等 4 社＋五十铃/日野/三菱扶桑/UD 启动新东名大型卡车公道实证。[Source: https://www.isuzu-global.com/ja/newsroom/20241105_1.html, 2024]<\/li>\n<li>RoAD to the L4 主题 3（2021–2025）最终年度综合走行实证约 50,000km；物流 6 社参画：佐川、西浓运输、日通、日本邮便、福山通运、大和运输。[Source: https://www.road-to-the-l4.go.jp/activity/theme03/, 2025]<\/li>\n<li>T2：2026-03 以 L2 无人工介入完成关东—关西约 500km 行驶。[Source: 同路线图 PDF, 2026]<\/li>\n<li>技术要件：L4 车辆需道运车两法\"基准缓和认定\"（远程型系统）＋走行环境条件付与；数据存 DSSAD；《自动驾驶车辆安全确保指南第 2 版》（2025-09 更新）。[Source: https://www.mlit.go.jp/jidosha/jidosha_tk7_000043.html, 2025]<\/li>\n<\/ul>\n<h4 id=\"54\">5.4 对司机岗位的影响评估（<strong>全部为推断<\/strong>）<\/h4>\n<ul>\n<li><strong>幹線运送 vs 市内配送替代节奏差异<\/strong>：现行 ODD 限定\"深夜·约 100km 干线区间·专用优先车道·路车协调\"，商用化目标 2027–2028 年度以后——幹线夜行长途最先受影响；市内配送（接驳、装卸、复杂路况）预计远晚于干线，2030 年前难以规模化替代。此为基于 ODD 限制与路线图时间表的推断。<\/li>\n<li>制度信号：无驾驶人运行以特定自动运行许可为前提；运行管理/远程监视人才育成列入 2026 路线图——<strong>岗位将转型而非直接消失<\/strong>（推断）。<\/li>\n<li>时间线综合判断（推断）：2027 年度前对求职者的实质就业影响≈0；2027–2030 年干线 L4 试点扩大会影响干线夜行岗位增量；2030 年代市内配送替代才进入观察期。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_18\">六、就业落地建议（结论章）<\/h3>\n<h4 id=\"61\">6.1 考试准备路径<\/h4>\n<ol>\n<li>技能試験：官方免费样本题（ClassNK Portal）＋全ト协学習用テキスト为唯一官方教材。[Source: https://sswt-portal.classnk.or.jp/area?tab=3-1, 2026; https://jta.or.jp/member/driver/ssw_text.html, 2026]<\/li>\n<li>日语：中国大陆考生主路径为 <strong>JLPT N4<\/strong>（每年 7/12 两次，450 元）；JFT-Basic 中国无考点（赴第三国时可选）。[Source: https://jlpt.neea.cn/faq.html, 2026; https://www.prometric-jp.com/zh-CHS/ssw/, 2026]<\/li>\n<li>考试地点策略（推断）：无考场于中国大陆 → 最现实路径为持有效中国驾照先赴日本以\"特定活动\"入境后国内受验（国内受验费 6,500 円），或赴越南/泰国等已有 CBT 考场的第三国。<\/li>\n<\/ol>\n<h4 id=\"62\">6.2 招募渠道与中介资质<\/h4>\n<ul>\n<li>中国路径官方明示：<strong>商务部批准资质的对外劳务合作企业<\/strong>＋日方公共职业安定所（ハローワーク）。[Source: https://www.ssw.go.jp/cn/about/step/, 2026]<\/li>\n<li>资质查询入口：商务部对外劳务合作企业名单 http://femhzs.mofcom.gov.cn/fecpmvc_zj/pages/fem/CorpLWList.html ；商务部提醒原文：无资质出国务工属违法。[Source: https://ao.mofcom.gov.cn/aqtz/art/2024/art_f0ce83f61c9240d39e775a23fcff8827.html, 2024]<\/li>\n<li>非法中介特征（推断汇总）：无法提供商务部资质编号、要求前置大额\"保证金\"、承诺\"免考包过\"（技能試験为 ClassNK 统一实施，无免考通道）。<\/li>\n<\/ul>\n<h4 id=\"63\">6.3 在留落地清单<\/h4>\n<ul>\n<li>在留卡：成田/羽田/中部/关西/新千岁机场当场发放；入住后 <strong>14 日内<\/strong>向市区町村住民登记（逾期可处 20 万円以下罚金，上陆 90 日不申报可取消在留资格）。[Source: https://www.moj.go.jp/isa/publications/faq/newimmiact_4_q-and-a_page3.html, 2026]<\/li>\n<li>银行/手机：受入机关负有支援义务（住房确保、生活 orientiation 含银行/手机合同协助）。[Source: https://www.moj.go.jp/isa/policies/ssw/faq.html, 2026]<\/li>\n<li>在线手续：持 My Number 卡可在留诸申请电子化；引越し转出/转入可在线办理。[Source: https://www.moj.go.jp/isa/about/guidance/?hl=en, 2026; https://www.digital.go.jp/policies/moving_onestop_service, 2025-2026]<\/li>\n<li>生活咨询总入口：入管厅外国人生活支援 Portal。[Source: https://www.moj.go.jp/isa/support/portal/, 2026]<\/li>\n<\/ul>\n<h4 id=\"64\">6.4 驾照路径（关键瓶颈）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">要点<\/th>\n<th style=\"width:34%\">费用/合格率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.police.pref.chiba.jp/menkyoka/licence_info-11.html\" title=\"来源：https://www.police.pref.chiba.jp/menkyoka/licence_info-11.html, 2025；https://drivey.jp/blog/gaimen-kirikae-knowledge-test（转引警察庁）, 2025-2026\">外免切替（持中国驾照）<\/a><\/td>\n<td>中国不在 29 国免除对象；知识确认 50 题正确率 90%＋技能确认（2025-10 严格化：新增横断步道课题、审查基准 70%）<\/td>\n<td>知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025 年 10–12 月，警察庁）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.kesennuma-ds.com/price\" title=\"来源：https://www.kesennuma-ds.com/price, 2026\">在日新考取（普通 MT）<\/a><\/td>\n<td>18 岁～<\/td>\n<td>约 <strong>400,550 円<\/strong>（税込示例，气仙沼中央自动车学校）<\/td>\n<\/tr>\n<tr>\n<td>中型<\/td>\n<td>20 岁＋持其他驾照满 2 年<\/td>\n<td>全国均价待核实<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.iac-ds.co.jp/ajima/driver-license/oogata/\" title=\"来源：https://www.iac-ds.co.jp/ajima/driver-license/oogata/, 2026\">大型<\/a><\/td>\n<td>21 岁＋满 3 年<\/td>\n<td>约 <strong>213,550 円<\/strong>（持中型起，阿自马达 DS 示例）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 特定活动入境后未取得日本驾照则不能转特定技能 1 号——驾照是全流程的关键路径依赖。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/p>\n<h4 id=\"65\">6.5 风险提示与维权渠道<\/h4>\n<ul>\n<li>工资拖欠/不当解雇：劳动基准监督署受理；劳动条件咨询 Hotline <strong>0120-811-610<\/strong>（免费、匿名、多语言）。[Source: https://www.check-roudou.mhlw.go.jp/lp/hotline/, 2026]<\/li>\n<li>劳动局外国人特别咨询·支援室（东京 FRESC 有中文页面）。[Source: https://jsite.mhlw.go.jp/tokyo-roudoukyoku/fresc_cn.html, 2026]<\/li>\n<li>提示词中的\"ITJ\"窗口与\"GFP\"机构名称本次未能核实到官方原文 → 待复核清单。<\/li>\n<li>警示（推断汇总）：警惕月给低于当地行情 20% 以上且无手当明细的特定技能转介合同；支援费异常低价（月额 1 万円以下）的登録支援機関可能降低法定支援质量。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"_19\">七、数据可靠性与局限说明<\/h3>\n<p><strong>核验程度分级<\/strong>\n- A 级（官方一手直接引用）：制度框架、试验要件、签证费用、厚労省统计、MLIT 政策页、NPA/路线图、TDB/TSR 倒产。\n- B 级（权威机构经第三方转引）：全ト协工资调查（经 LogiShift）、WebKit 运赁指数（经 Cargo News/LogiShift）、外免切替合格率（经 drivey.jp 转引警察庁）。\n- C 级（平台抽样/转载）：求人样本（聚合平台转载，原企业页未逐一回溯）。<\/p>\n<p><strong>已知口径冲突（双份保留）<\/strong>\n1. 受入上限 22,100 vs 24,500 人（两组官方数字）。\n2. 签证费 15,000 円（MOFA 新规）vs 200 元人民币（沈阳领馆旧页）。\n3. 2030 年度缺口 34%（不采取措施）vs 7%/25%（再检证修正）。\n4. 倒产件数 FY2025 321 件（TDB 事业年度）vs 历年 308 件（TSR）。\n5. WebKit 运赁指数 2026-10=142 vs 2026-09=143（不同发布渠道）。\n6. L4 卡车商用化时间：政府环境整备口径\"2026 年以后\"vs 企业事业化口径 2027/2028 年度。<\/p>\n<p><strong>未取得项（次期优先）<\/strong>\n- ISA 统计月报中特定技能在留者分野别总数（追踪表 #1）；MLIT 司机不足实态调查专项原文精确值；中国同岗到手收入对比；JFT-Basic 现行受验费；教习所全国均价。<\/p>\n<p><strong>待复核清单（推荐复核入口）<\/strong>\n1. 受入上限差异 → isa.go.jp 分野页与 ssw.go.jp 对照核阅原文。\n2. 中国大陆使领馆现行签证费 → 各领馆官网签证页。\n3. MLIT 不足实态调查原文 → 国交省自动车局\"貨物自動車運送事業の運賃等の適正化\"专题页。\n4. 全ト协工资调查原件 → 全日本トラック協会会员工资调查发布页。\n5. \"ITJ\"/\"GFP\"官方名称 → 厚労省外国人雇佣对策相关页。\n6. 本分野健康检查义务条文 → ISA 运用要领 PDF（001977550.pdf）。\n7. ClassNK 国内受验费官方数额表 → sswt-portal.classnk.or.jp/news/25。\n8. 日通司机加薪\"月最大 5 万円\"（2024-02 报道）→ 日通官方新闻室。\n9. SGHD FY2026 上半期销售额 9,204 亿円 → SGHD IR 决算短信原件。\n10. 技能实习/特定技能 2 号完整对比表官方口径 → isa.go.jp。<\/p>\n<hr />\n<h3 id=\"_20\">八、参考来源清单<\/h3>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\">ISA 自動車運送業分野<\/a> — 出入国在留管理庁, 2026<\/li>\n<li><a href=\"https://www.moj.go.jp/isa/applications/ssw/2024.03.29.kakugikettei.html\">2024.3.29 阁议决定<\/a> — 出入国在留管理庁, 2024–2026<\/li>\n<li><a href=\"https://www.ssw.go.jp/cn/about/visa/\">特定技能总合支援站（中文）<\/a> — 2026<\/li>\n<li><a href=\"https://www.ssw.go.jp/cn/about/step/\">特定技能步骤（中文）<\/a> — 2026<\/li>\n<li><a href=\"https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/\">自動車運送業分野页面（中文）<\/a> — 2026<\/li>\n \/td>\n<td>#4 #5 #6<\/td>\n<td>厚労省 / MLIT / 平台<\/td>\n<td>月度 / 季度<\/td>\n<\/tr><tr>\n<td>物流行业态势<\/td>\n<td>倒産、运賃、适正化、「2024 年問題」、企业动向<\/td>\n<td>#7 #8 #9 #11<\/td>\n<td>TDB / TSR / MLIT / 企业 IR<\/td>\n<td>月度 / 季度<\/td>\n<\/tr><tr>\n<td>智能驾驶展望<\/td>\n<td>L4 许可区域、实证进展与岗位影响结论面<\/td>\n<td>#10<\/td>\n<td>NPA / MLIT / SOZ<\/td>\n<td>事件触发<\/td>\n<\/tr><tr>\n<td>就业落地与中介<\/td>\n<td>考试路径、中介资质、驾照费用、在留落地<\/td>\n<td>#13 #14<\/td>\n<td>商务部 / 领馆 / 警察庁 / 教习所<\/td>\n<td>季度 / 事件触发<\/td>\n<\/tr><p><strong>维度间关系<\/strong>：制度与签证路径决定「能否进入」的门槛与名额上限；司机供需与薪酬是核心模块，其缺口与运賃水平共同决定雇主付费意愿；物流行业态势通过运賃与倒産影响薪酬传导的可持续性；智能驾驶展望只输出结论面，不展开技术细节；就业落地与中介是前述制度与成本在个人层面的执行层，其中驾照路径是关键瓶颈。<\/p><h2 id=\"s3\">三、当前现状梳理<\/h2><h3 id=\"31\">3.1 制度与签证路径<\/h3><li>受入上限：<strong>22,100 人<\/strong>（2026-01-23 阁议，现行；ISA 自動車運送業分野页，2026-10-09 现在）；并列：<strong>24,500 人<\/strong>（SSW 官网中文页，2026）——两组官方数字并存，列入待复核；待核验：ssw.go.jp 仍写 24,500、未同步更正（登记册观察项，连续五次）（事实）。<\/li><li>在留者数：自動車運送業 1 号 <strong>843 人<\/strong>（充足率 3.8%、年間増加 803）；SSW 1 号全体 <strong>438,128<\/strong>、2 号 <strong>23,348<\/strong>（ISA 统计月报，2026-08 末速报；ISA 2026-11-06 换版数据仍为 8 月末）（事实）。<\/li><li>分野要件：卡车 A2.2 不变；<strong>出租车 / 巴士区分 2027-04-01 起 COE 申请须 B1 相当以上<\/strong>（JLPT N3 以上＋CEFR B1 判定）；本分野不得 2 号；无健康检查义务、仅適性診断（ISA / MLIT，令和 8 年 10 月 9 日改正）（事实）。<\/li><li>试验与费用：ClassNK 技能試験 <strong>6,500 円<\/strong>（US$45、越南 US$50）、证明书 <strong>15,000 円<\/strong>；JFT-Basic <strong>10,000 円<\/strong>；JLPT N4 <strong>450 元<\/strong>；实施国 18，<strong>中国大陆无考点<\/strong>（ClassNK / Prometric / JLPT，2026-09 月报，2026-10-15）（事实）。<\/li><li>登录支援机关：行情 <strong>2–4 万円/人·月<\/strong>；登录费 <strong>28,400 円<\/strong>；<strong>支援体制要件改正 2027-04-01 施行<\/strong>（支援責任者等常勤选任、养成讲习义务、担当者数 ≤10 机关 / ≤50 人基准）（ISA / 行业机构，2026）（事实）。<\/li><h3 id=\"32\">3.2 司机供需与薪酬<\/h3><li>缺口（并列口径）：现状 <strong>14%<\/strong>（14 万人相当）/ 2030 年 <strong>34%<\/strong>（34 万人相当）；2025 年度不足 <strong>110,809<\/strong>、2030 年度不足 <strong>162,912<\/strong>（政策パッケージ / NX 总研试算）；再检证：2030 年度平均约 <strong>7%<\/strong>／最大约 <strong>25%<\/strong>（MLIT 白書 2025／再检证资料，2025–2026）（事实并列，不可合并）。<\/li><li>求人倍率与抽样：职业别 <strong>2.56<\/strong>（2026-09，常用含パート，2026-10-30 公布；较上月 +0.02pt）（事实）；基线并列：汽车驾驶业 2.54 vs 全产业 1.06（2026-08）；求人抽样 <strong>9 样本<\/strong>全部四元组立档、官网回溯完成（东京圈 22–45 万円／大阪圈 28–40.5 万円／地方 25–36 万円，聚合平台转载，2026）（事实 / C 级；待核验：原企业页未逐一回溯、中国同岗到手收入对比未建立）。<\/li><li>工资：运输业·邮政业现金给与总额 <strong>341,158 円<\/strong>（+4.9%，2026-09，2026-11-06 公布；全产业对照 311,409 円、+4.6%）（厚労省毎月勤労統計，事实）。<\/li><li>工资（转引）：全ト协 2025 年度版——男性大型司机月薪 <strong>39.5 万円<\/strong>（+4%）、全职务平均 <strong>35.98 万円<\/strong>（+5.3%）、含奖金 <strong>41.64 万円<\/strong>（+7.1%）（经 LogiShift 转引，原件待复核）（事实 / 待复核）。<\/li><h3 id=\"33\">3.3 物流行业态势<\/h3><li>倒産（双机构并列）：TSR 2026-10 全国 <strong>934 件<\/strong>（-3.2%）、運輸業 <strong>38 件<\/strong>（+2.7%，连续 2 个月增）、人手不足関連 <strong>50 件<\/strong>（10 月最多）；TDB 同月 <strong>950 件<\/strong>（-1.6%）、1–10 月 <strong>8,949 件<\/strong>（+4.3%）、人手不足倒産 <strong>56 件<\/strong>历史最多（事实）。基线并列：FY2025 道路货物运输业 <strong>321 件<\/strong>（TDB）vs 历年 <strong>308 件<\/strong>（TSR）——统计期间不同，不可比较或加总。<\/li><li>运賃：日銀 SPPI「道路貨物輸送」<strong>+4.6%<\/strong>（2026-09 速報，8 月 +4.3%）；大分類「運輸・郵便」+8.4%（外航貨物拉动，不可混用）；SPPI 総平均 <strong>115.5<\/strong>（+3.7%）／WebKit <strong>142<\/strong>（2026-10）（事实）。标准运賃 +8%（令和 6 年告示第 209 号，2024-03）；价格转嫁率 24.2% → <strong>34.7%<\/strong>（2023-09 → 2025-09，中小企业厅）。<\/li><li>「2024 年問題」：适正化二法 <strong>2025-06-11 公布<\/strong>；[1]–[3] 已于 <strong>2026-04-01 施行<\/strong>；[4] 许可更新制、[5] 適正原価下限（含标准运賃废止）未施行；物流効率化法 2026-04 起特定事業者·中長期計画；再配送率降至 <strong>7.6%<\/strong>（2026-04）（MLIT，事实）。<\/li><li>企业动向：SGHD FY2027/3 上半期（官方決算短信，2026-11-06）営業収益 <strong>9,204.37 億円<\/strong>（+17.6%）、営業利益 <strong>414.40 億円<\/strong>（+7.5%）、経常利益 <strong>397.91 億円<\/strong>（+4.4%）、純利益 <strong>279.29 億円<\/strong>（+19.8%）；佐川急便 2027-01-01 起宅配便平均 <strong>+13.8%<\/strong>（事实；待核验：SGHD 数字引自 release.tdnet.info 決算短信，日通加薪报道列入待复核清单）。<\/li><h3 id=\"34\">3.4 智能驾驶展望<\/h3><li>实绩与进展：<strong>截至 2026-02 全国 10 カ所实现 L4 社会实装<\/strong>（国交省官方口径，未公布按许可件数汇总值；原「12 件」无官方来源已废止）；いすゞ路線バス 2026 年度 L4 認可申請·2027 年度事業化；柏市 2025-11-12 取得县内首个许可（事实）。<\/li><li>时间表：《モビリティ・ロードマップ 2026》（2026-07-21）——2027 年度起社会实装；2030 年度前国内导入自动驾驶服务车辆 <strong>1 万台<\/strong>；货运专项「2026 年以后在高速公路实现 L4 卡车社会实装」；先行事业化地域 <strong>13 处<\/strong>（事实）。<\/li><li>岗位影响（<strong>推断<\/strong>）：干线夜行最先受影响；市内配送 2030 年前难以规模化替代；2027 年度前对求职者的实质就业影响约等于 0；岗位将转型而非直接消失。<\/li><h3 id=\"35\">3.5 就业落地与中介<\/h3><li>入境路径：海外申请者先以「特定活动」（特定自动车运送业准备）入境（2025-02-17 起；卡车最长 6 个月）；COE 手续费免费、标准审查 1–3 个月；未取得日本驾照则不能转入特定技能 1 号（ISA，2026）（事实）。<\/li><li>签证费：单次约 <strong>15,000 円<\/strong>、多次约 <strong>30,000 円<\/strong>（2026-07-01 起改定）；并列驻日领馆人民币口径 <strong>715 元<\/strong>（一次）/ <strong>1,430 元<\/strong>（二次・数次），上海 / 青岛 / 重庆三馆一致（事实并列）。<\/li><li>驾照费用：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09，最新月）；MT 通学 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）；大型 <strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06）；外免切替知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025-10–12，警察庁，经 drivey.jp 转引）（事实）。<\/li><li>中介资质：路径＝商务部资质对外劳务合作企业＋日方送出机关体系；资质查询入口已核实；无资质出国务工属违法（商务部，2024）（事实）。<\/li><h2 id=\"s4\">四、初步结论<\/h2><li><strong>窗口已开但名额有限<\/strong>（事实）：受入上限 22,100 人（2026-01-23 阁议）与 24,500 人（SSW 官网中文页）两组官方数字并存；在留者 843 人、充足率 3.8%（2026-08 末）。相对 84 万现役司机（2024，MLIT 杂志）属「高确定性、但窄口径」的进入窗口。<\/li><li><strong>中国大陆考生面临「无考场」现实<\/strong>（事实）：ClassNK 技能試験 CBT 与 JFT-Basic 实施地均不含中国大陆；中国考生实际路径为赴第三国考试或在日本国内受验，日语考试主路径为 JLPT（每年 7 月、12 月两次）。<\/li><li><strong>供需缺口决定雇主付费意愿<\/strong>（事实）：有效求人倍率 2.56（2026-09）；运输业月均现金给与 341,158 円（+4.9%）；但缺口精确值存在 14%/34% 与 7%/25% 两套口径，不可合并。<\/li><li><strong>运价→工资传导已启动但不完全<\/strong>（推断）：2026 春斗卡车业加薪率 3.85% 低于全产业 5.02%；全ト协调查显示大型司机月薪已达 39.5 万円（+4%）；头部企业待遇公告显著高于行业均值。<\/li><li><strong>自动驾驶暂不构成就业威胁<\/strong>（推断）：L4 现阶段限定「深夜·限定区间·路车协调」的新东名约 100km 实证，商用化目标在 2027–2028 年度以后，首波聚焦幹線运送；市内配送替代节奏预计显著更慢。<\/li><li><strong>落地最大风险在驾照与中介<\/strong>（事实＋推断）：外免切替 2025-10 起大幅严格化（知识确认合格率 42.8%、技能确认 13.1%）；招募必须走商务部资质企业；警惕月给低于行情 20% 以上且无手当明细的转介合同（推断）。<\/li><p><strong>风险与不确定性<\/strong>：<\/p><li>受入上限两组官方数字并存，名额判断存在口径风险。<\/li><li>缺口精确值两套口径差异大，影响对「窗口期长度」的判断。<\/li><li>求人样本为聚合平台转载（C 级），原企业页未逐一回溯。<\/li><li>L4 岗位影响全部为推断，尚无官方就业替代测算。<\/li><li>2027-04-01 两项 中長期計画与定期報告，其中货主须选任物流統括管理者。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2026; https://www.mlit.go.jp/seisakutokatsu/freight/seisakutokatsu_freight_mn1_000034.html, 2026]<\/p><\/div><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><p>⚠️ 两个机构统计期间不同（事业年度 vs 历年），<strong>不可直接比较或加总<\/strong>。<\/p><\/details><div class=\"diff-block diff-new\"><span class=\"diff-badge\">已更新 · 新增<\/span><p>结论（推断）：2026-04 起进入&quot;可核查的合规期&quot;——货主侧被要求书面化委托链与装载效率改善，司机侧的直接现金效果尚未可测；真正的运价硬约束（適正原価下限）仍在 2027 年以后窗口。<strong>若&quot;标准运赁&quot;正式废止而適正原価尚未告示，过渡期货主与事业者的谈判基准将出现空窗<\/strong>，需持续跟踪告示文本。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2026]<\/p><\/div><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><h4 id=\"43\">4.3 运价与政策<\/h4><\/details><div class=\"diff-block diff-mod\"><span class=\"diff-badge\">已更新 · 修改<\/span><h3 id=\"43-34\">4.3 运价与成本（本版口径拆分，见 3.4）<\/h3><\/div><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><li>运价谈判实施率：FY2022 68% → FY2024 74% → <strong>FY2025 90%<\/strong>；但收受达标准运价 8 成以上者仅约 35%。[Source: https://www.mlit.go.jp/report/press/jidosha04_hh_000361.html, 2026]<\/li><\/details><div class=\"diff-block diff-new\"><span class=\"diff-badge\">已更新 · 新增<\/span><p>指标：道路貨物輸送 +4.6%（2026-09）、運輸・郵便 +8.4%（外航拉动）、SPPI 総平均 115.5（+3.7%）。结论：国内卡车运价涨幅仍在 4–5% 区间稳步上行，但<strong>低于同期运输业现金给与 +4.9% 的名义工资涨幅<\/strong>（口径不同，仅并列观察，推断：单位运价对工资的覆盖在边际上收紧）。[Source: https://www.boj.or.jp/statistics/pi/cspi_release/sppi2609.pdf, 2026; https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/xls/2609c01p.xlsx, 2026]<\/p><\/div><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><li>企业改定：佐川急便 2027-01-01 起宅配便平均 <strong>+13.8%<\/strong> [Source: https://www2.sagawa-exp.co.jp/newsrelease/detail/2026/1002_2672.html, 2026]；福山通运 2026-11 起较 FY2024 约 <strong>+20%<\/strong> [Source: https://logishift.net/2026/10/27/post-9951/, 2026]；雅玛多 2024-04 个人报价约 +2% [Source: https://www.yamato-hd.co.jp/englis v>", "stats": {"new": 205, "mod": 26, "del": 420, "equal": 17, "prev": 437}, "summary": "2026-12 期与 2026-11 期对比：新增 205 处、修改 26 处、删除 420 处，未变更 17 处。", "path": "01-ssw-driver/reports/2026-12-ssw-driver.html"}}}, "career-driver": {"name": "司机职业发展", "dir": "02-career-driver", "months": {"2026-11": {"title": "日本司机职业发展 · 首份分析报告", "body": "\n<h1 id=\"_1\">日本司机职业发展 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向准备或正在日本从事货运司机工作的读者，兼具求职顾问与现场落地指导视角。\n<strong>来源规则<\/strong>：① 日本政府官方一手：厚生労働省（労働基准法、工资・工时统计、driver-roudou-jikan）、国土交通省（自动车运送业、运行管理者）、警察庁（驾照・违规点数）、内閣府 / 総務省<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本司机职业知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义<\/strong>：货运司机职业（路线配送 / 仓库内配送 / 一般区域 / 冷链 / 中型・大型干线 / 特殊车辆）的岗位谱系与车种驾照对应、薪资结构与工时合规、安全规范与现场制度、现场经验积累与可量化成果记录、求职渠道与契约审查、实际工作条件记录（月度 / 半年 / 凭证归档，兼永住证据链）。<\/p>\n<p><strong>监测范围（含）<\/strong>：司机岗位谱系与车种驾照对应（2024 年新制度后）；薪资结构与工时合规（工资构成、2024 年働き方改革新规、入职必问清单）；安全规范与现场制度（点呼 / 点检 / 运行记录、事故处理、红线）；现场经验积累与可量化成果记录；求职渠道、简历面试与契约审查；实际工作条件记录（月度 / 半年 / 凭证归档，兼永住证据链）。<\/p>\n<p><strong>监测范围（不含）<\/strong>：制度规则与在留资格细节（→ 08-visa-immigration）；行业结构与 2024 年問題（→ 04-industry-logistics）；自动驾驶技术路线（→ 05-industry-autonomous）；法规条文解读（→ 09-politics-law）；收入环境与地域差（→ 07-economy-finance）；日语学习计划（→ 11-language-japanese）；管理岗过渡与晋升档案（→ 03-career-management）；官方统计活值（→ 01-ssw-driver 主责，本主题只读引用）。<\/p>\n<p><strong>受众与用途<\/strong>：供准备或正在日本从事货运司机工作的读者做岗位选择、薪资谈判、契约审查与现场合规自查，兼具求职顾问与现场落地指导用途。<\/p>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>卡车司机的薪资构成与含赏与年收水平处于什么区间？<\/li>\n<li>2024 年働き方改革新规（时间外上限）对司机收入与入职选择的影响如何？<\/li>\n<li>求职渠道与契约审查的关键风险点是什么？<\/li>\n<li>现场安全规范与红线如何影响在留更新与职业升级？<\/li>\n<li>个人工作条件记录（月度 / 半年）如何支撑转职谈判与永住证据链？<\/li>\n<\/ol>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>制度规则、申请材料、在留资格细节<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>行业结构、2024 年問題、自动化产业面<\/td>\n<td>04-industry-logistics<\/td>\n<\/tr>\n<tr>\n<td>自动驾驶技术路线、法规与实装细节<\/td>\n<td>05-industry-autonomous<\/td>\n<\/tr>\n<tr>\n<td>管理岗过渡与晋升档案<\/td>\n<td>03-career-management<\/td>\n<\/tr>\n<tr>\n<td>官方统计活值（工资 / 缺口 / 求人倍率）<\/td>\n<td>01-ssw-driver（本主题只读引用）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>岗位谱系与驾照路径<\/td>\n<td>岗位类型、车种驾照对应、取得费用<\/td>\n<td>#4<\/td>\n<td>警察庁 / 指定教习所<\/td>\n<td>季度 / 事件触发<\/td>\n<\/tr>\n<tr>\n<td>薪资结构与工时合规<\/td>\n<td>年收口径、工资构成、时间外上限<\/td>\n<td>#1 #2<\/td>\n<td>厚労省<\/td>\n<td>月度 / 季度<\/td>\n<\/tr>\n<tr>\n<td>安全规范与现场制度<\/td>\n<td>点呼 / 点检 / 运行记录、事故处理、红线<\/td>\n<td>手册 03（无登记册项）<\/td>\n<td>厚労省 / 行业制度<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>求职渠道与契约审查<\/td>\n<td>渠道矩阵、地域策略、面试与契约要点<\/td>\n<td>#3 #4<\/td>\n<td>求人平台 / 登录支援机关<\/td>\n<td>季度<\/td>\n<\/tr>\n<tr>\n<td>工作条件记录与成果<\/td>\n<td>月度 / 半年记录、凭证归档、行动判断<\/td>\n<td>#5<\/td>\n<td>自记录<\/td>\n<td>月度 / 半年<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：岗位谱系与驾照路径决定「能开什么车、能拿多少」的起点；薪资结构与工时合规是核心模块，其口径直接决定 offer 的可比性；安全规范是现场制度底座，安全实绩直接影响续更与升级；求职渠道与契约审查是进入环节的风险控制；工作条件记录与成果是落地后的自我保护与证据积累，服务转职与永住。官方统计活值（工资 / 缺口 / 求人倍率）由 01-ssw-driver 主责，本主题只读引用。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 岗位谱系与驾照路径<\/h3>\n<ul>\n<li>岗位类型谱系（手册 01，2026-11-11 核对）：路线配送（★ 最适合入场）→ 仓库内配送 / 场内运输（★）→ 一般区域配送（★★）→ 冷链配送（★★ 薪资略高）→ 中型·大型干线（★★★ 薪资最高）→ 特殊车辆（★★★★，需追加资格）。<\/li>\n<li>车种与驾照对应（2024 年新制度后）：普通免许（总重 3.5t 未满，货物 2t 未满；2024-05 起新设<strong>準中型<\/strong>，普通范围收窄）；準中型（总重 3.5–7.5t）；中型（7.5–11t，需 21 岁＋驾龄 2 年）；大型（11t 以上，需 21 岁＋驾龄 3 年）；第二种免许（载客，特定技能出租车 / 巴士路径才需要）（事实）。<\/li>\n<li>取得费用：大型 <strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06）；MT 通学 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）；锚 01-ssw-driver #14：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09，最新月）（事实）。<\/li>\n<li>外免切替：普通免许可换；准中 / 中型需另考（手册 01，2026-11-11）（事实）。<\/li>\n<li>待核验：中型驾照取得费用未在本主题素材中给出（本主题仅登记大型与 MT 通学行情，锚 01-ssw-driver #14）。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 薪资结构与工时合规<\/h3>\n<ul>\n<li>卡车司机平均年收：<strong>约 430 万日元<\/strong>（月收约 27 万＋年间赏与约 106 万，<strong>含赏与年收口径<\/strong>；手册 02，2026 年市场数据，原始来源待核验）；<strong>不可<\/strong>与官方月均现金给与 <strong>341,158 円<\/strong>（不含赏与，厚労省毎月勤労統計 2026-09，锚 01-ssw-driver #5）直接对比（事实 / 待核验）。<\/li>\n<li>全ト协賃金実態：<strong>2025 年度版<\/strong>（+5.3% 全职务）（jta.or.jp；登记册 #2）（事实）。<\/li>\n<li>求人市场示例：大型干线 月给 <strong>35–43 万<\/strong>；一般配送 <strong>25–33 万<\/strong>；冷链 / 危险品附加 <strong>2–5 万<\/strong>（手册 02，2026，原始来源待核验）。<\/li>\n<li>时间外上限（厚生劳动省 driver-roudou-jikan，2026）：原则 <strong>月 45 小时·年 360 小时<\/strong>；36 协定特别条项 <strong>年 960 小时<\/strong>；时间外＋休日合计 <strong>月 100 小时未满<\/strong>、2–6 个月平均 80 小时以内（事实）。<\/li>\n<li>行业背景：2030 年度缺口 <strong>162,912 人<\/strong>（约 16 万；锚 01-ssw-driver #4，手册 02 引用）（事实）。<\/li>\n<li>待核验：430 万平均年收、求人市场示例的原始来源与采集日期。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 安全规范与现场制度<\/h3>\n<ul>\n<li>法定运行管理制度：点呼（出车前后由运行管理者指示＋确认）、运行指示書、运行记录、连续驾驶 <strong>4.5h<\/strong> 后至少 <strong>30min<\/strong> 休息、每年法定 <strong>5 项<\/strong>训练、日常点检 <strong>60+ 项<\/strong>（手册 03，2026-11-11 核对）（事实）。<\/li>\n<li>红线：酒测出车前后各一次，检出即点呼不通过→当日停驾；特定技能者因酒精 / 药物事故几乎必然失去在留资格（手册 03，风险表述）。<\/li>\n<li>事故与异常处理流程：救护优先→报警→联系运行管理者→不可私了；冷链温度异常为高责任场景（手册 03）。<\/li>\n<li>90 天安全路线图：W1–2 流程背熟→W3–6 独立短路线→W7–12 全路线独立（手册 03）。<\/li>\n<li>本维度无统计数字，属合规要点（事实）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 求职渠道与契约审查<\/h3>\n<ul>\n<li>渠道矩阵：特定技能专门中介 / 登录支援机关（★★★ 主渠道）＞ Hello Work（★★）＞ Indeed Japan / 求人ボックス（★★）＞ トラバイト等运输专门转职站（★★）＞ 行业团体（★）＞ 直接应聘地方中坚企业（★）（手册 05，2026-11-11）。<\/li>\n<li>筛选原则：只投能做「特定技能受入计划书认定」的企业；未认定企业无法雇特定技能者（手册 05）。<\/li>\n<li>契约审查清单：雇佣契约书一致性、受入计划书认定编号、支援体制（费用由企业负担——法定）、社保加入说明、住宅条件、退职金 / 赏与规则书面化（手册 05）。<\/li>\n<li>求人样本：<strong>9 样本<\/strong>全部四元组立档（岗位×地域×月収×URL）、官网回溯完成（锚 01-ssw-driver 3.3 表；登记册 #3）（事实）。<\/li>\n<li>待核验：平台样本的「月収」含 / 不含手当口径与采集日期。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 工作条件记录与成果<\/h3>\n<ul>\n<li>记录模板：公司概况（入职时填写）、月度记录表（实收工资 / 构成 / 加班 h / 出勤日 / 夜班数）、半年对比表、工作环境定性记录、凭证归档索引（手册 06，模板待填写）。<\/li>\n<li>登记册 #5「个人工作条件记录最新周期」= <strong>待记录<\/strong>。<\/li>\n<li>行动判断基准（手册 06）：连续 2 半年加班 &gt; 月 80h → 违反月 100h 未满红线风险，准备退路；实收低于契约 → 当月质询＋留证；收入 / 成长停滞 2 年 → 启动转职评估（建议 / 推断）。<\/li>\n<\/ul>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>薪资口径必须区分含赏与与不含赏与<\/strong>（事实）：含赏与年收约 430 万（手册 02）与官方月均现金给与 341,158 円（厚労省 2026-09）不可直接对比；谈 offer 时须先确认口径。<\/li>\n<li><strong>2024 新规降低加班收入天花板，但运力缺口构成长期利好<\/strong>（事实＋推断）：月 45h / 年 360h 上限与月 100h 未满红线压低加班收入；2030 年度缺口 162,912 人（锚 01 #4）意味着行业结构性缺人（推断：对外国人司机长期利好）。<\/li>\n<li><strong>特定技能专门中介 / 登录支援机关是风险最低主渠道<\/strong>（建议）：与接受企业绑定、包支援义务；筛选须核「受入计划书认定」（手册 05）。<\/li>\n<li><strong>驾照路径是落地关键瓶颈<\/strong>（事实）：外免切替普通免许可换、准中 / 中型需另考；普通教习全国官方均价 324,381 円（AT 限定，総務省 2026-09）；大型 25–28 万円（TRUCK-BANK 2026-06）；MT 通学 30–40 万円（くらシム 2026-10-18）。<\/li>\n<li><strong>个人工作条件记录是永住证据链与转职谈判的基础设施<\/strong>（建议 / 推断）：月度 / 半年记录与凭证归档直接服务自我保护、转职谈判与永住审查。<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：<\/p>\n<ul>\n<li>430 万平均年收与求人市场示例未标注原始来源，存在口径与时效风险。<\/li>\n<li>平台样本「月収」含 / 不含手当口径未注明，可比性受限。<\/li>\n<li>个人工作条件记录尚处「待记录」状态，无实际数据。<\/li>\n<li>安全规范与红线为合规要点，无量化统计支撑。<\/li>\n<li>官方统计活值依赖 01-ssw-driver 主责，本主题不独立改值。<\/li>\n<\/ul>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题<\/strong>：<\/p>\n<ol>\n<li>430 万平均年收的原始来源与统计口径是什么？<\/li>\n<li>中型驾照全国均价与取得要件细节？<\/li>\n<li>主要求人平台司机岗位样本（月収）的采集日期与含 / 不含手当口径？<\/li>\n<li>登录支援机关名单与费用行情的最新数据？<\/li>\n<li>个人工作条件记录何时开始填写并建立首条数据？<\/li>\n<\/ol>\n<p><strong>下一期重点核实项<\/strong>：430 万原始来源；中型均价；求人样本口径与采集日期；登录支援机关费用行情；外免切替最新流程与费用（联动 10-education-qualification）。<\/p>\n<p><strong>数据补全计划<\/strong>：优先补登记册 #5 个人工作条件记录首条；补求人样本口径标注；补中型驾照均价；按「增量留痕」原则回写登记册。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>運輸業月均工资<\/td>\n<td>341,158 円（2026-09，锚 01-ssw-driver #5）<\/td>\n<td>厚労省每月勤労統計<\/td>\n<td>2026-09<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>全ト协賃金実態最新版<\/td>\n<td>2025 年度版（+5.3% 全职务）<\/td>\n<td>jta.or.jp<\/td>\n<td>2025 年度<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>求人样本库规模与核实状态<\/td>\n<td>9 样本全部四元组立档、官网回溯完成<\/td>\n<td>01-ssw-driver 3.3 表<\/td>\n<td>v2026.11.12_5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>大型 / 中型免许取得路径费用<\/td>\n<td>大型 25–28 万円（TRUCK-BANK 2026-06）；MT 通学 30–40 万円（くらシム 2026-10-18）；锚 01-ssw-driver #14<\/td>\n<td>教习所官方 / TRUCK-BANK / くらシム<\/td>\n<td>2026-06 / 2026-10-18<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>个人工作条件记录最新周期<\/td>\n<td>待记录<\/td>\n<td>06 文档<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：基线（2026-11-12 已产出，v1.0 首期固定）；月度核验（不重写报告，仅登记册「观察项与触发器状态」更新记录，命中触发器时升级为季度重点更新）；季度（<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>）；年度（<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>，按「增量留痕」原则回写登记册）；事件触发插刷（<code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code> 追加件）。<\/p>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节）：<\/p>\n<ul>\n<li>労働基准法 / 働き方改革相关告示或通知 → 02 章（薪资与工时合规）<\/li>\n<li>自动车运送业运行管理者讲习大纲或资格要件变化 → 03 / 04 章<\/li>\n<li>主要求人平台司机岗位样本（月収）显著波动 → 02 / 05 章<\/li>\n<li>登录支援机关制度变化（联动 08-visa-immigration） → 05 章<\/li>\n<li>外免切替（中国驾照）流程或费用变化 → 01 / 05 章<\/li>\n<li>个人求职 / 入职进展 → 05 / 06 章<\/li>\n<\/ul>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：首期为空（唯一观察项、首要触发器、触发器结论均为空）。<\/p>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：<\/p>\n<ul>\n<li>A 级（官方一手）：厚生劳动省 driver-roudou-jikan（时间外上限，2026）；运行管理者试验中心（unkan.or.jp，2026）。<\/li>\n<li>B 级（权威机构 / 行情）：全ト协賃金実態 2025 年度版（jta.or.jp）；TRUCK-BANK / くらシム（驾照费用行情）。<\/li>\n<li>C 级（平台 / 转载）：求人市场示例（手册 02，未标注平台与采集日期，待核验）。<\/li>\n<\/ul>\n<p><strong>已知口径冲突（并列呈现，不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车司机平均年收<\/td>\n<td>含赏与年收约 430 万 ≠ 官方月均现金给与 341,158 円（不含赏与）<\/td>\n<\/tr>\n<tr>\n<td>时间外上限<\/td>\n<td>月 45h·年 360h（原则）≠ 年 960h（36 协定特别条项）≠ 月 100h 未满（红线）<\/td>\n<\/tr>\n<tr>\n<td>求人样本月収<\/td>\n<td>平台标注口径（含 / 不含手当）≠ 实收<\/td>\n<\/tr>\n<tr>\n<td>外免切替<\/td>\n<td>普通免许可直接换 ≠ 准中 / 中型需另考<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：登记册 #5 个人工作条件记录（待记录）；中型驾照取得费用（本主题素材未给出）；手册 02 的 430 万与求人市场示例原始来源；求人样本采集日期与口径标注。<\/p>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li><a href=\"https://driver-roudou-jikan.mhlw.go.jp/truck/notice\">厚生劳动省 driver-roudou-jikan（时间外上限）<\/a> — 厚生劳动省, 2026<\/li>\n<li><a href=\"https://www.unkan.or.jp/about.html\">运行管理者试验中心<\/a> — 2026<\/li>\n<li><a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/01-ssw-driver/data/ssw_driver_indicator_registry.md\">01-ssw-driver 指标登记册（官方统计活值锚）<\/a> — 2026-11-12<\/li>\n<li><a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 基线报告<\/a> — 2026-11-11<\/li>\n<li>02-career-driver 基线手册（司机职业知识手册） — 2026-11-12<\/li>\n<li>厚生劳动省（労働基准法 / 工资・工时统计） — 2026<\/li>\n<li>国土交通省（自动车运送业 / 运行管理者） — 2026<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本司机职业知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本司机职业知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11-12\n<strong>说明<\/strong>：本文档由原分散的多份章节文档合并整理而成，保留全部原内容与层级关系。后续更新请直接维护本单份文档。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">导航与使用约定<\/h3>\n<h3 id=\"02-career-driver\">02-career-driver 索引<\/h3>\n<p>司机职业区。覆盖阶段 1 的岗位调研与阶段 2 的现场落地。<\/p>\n<h4 id=\"_14\">文件一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>司机岗位全景<\/td>\n<td>岗位谱系、车种驾照对应（2024 新制）、一天工作流、深化方向<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>薪资结构与工时合规<\/td>\n<td>平均年收约 430 万、工资构成、2024 时间外劳动新规、入职必问清单<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>安全规范与现场制度<\/td>\n<td>点呼/点检/运行记录、事故处理、酒精红线、90 天路线图<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>现场经验积累清单<\/td>\n<td>四大能力域、可量化成果表、2 年技能升级路径<\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td>求职渠道与简历面试<\/td>\n<td>渠道矩阵、地域策略、面试问答、契约审查清单<\/td>\n<\/tr>\n<tr>\n<td>06<\/td>\n<td>实际工作条件记录<\/td>\n<td>落地后的月度/半年记录模板，兼永住证据链<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_15\">关联目录<\/h4>\n<ul>\n<li>签证与资格 → ../../08-visa-immigration<\/li>\n<li>日语备考 → ../../11-language-japanese<\/li>\n<li>管理岗过渡（阶段 3）→ <a href=\"../../03-career-management/reports/\">../../03-career-management<\/a><\/li>\n<li>行业大势（2024 问题、自动化）→ <a href=\"../../04-industry-logistics/reports/\">../../04-industry-logistics<\/a><\/li>\n<\/ul>\n<h4 id=\"_16\">使用约定<\/h4>\n<ul>\n<li>入职前：用 02 的\"必问清单\"和 05 的\"契约审查清单\"逐项核对。<\/li>\n<li>入职后：每月更新 06-实际工作条件记录。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"01\">01 司机岗位全景<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。对应路线图阶段 2（司机岗位落地）。<\/p>\n<\/blockquote>\n<h4 id=\"_17\">一、岗位类型谱系<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">类型<\/th>\n<th style=\"width:25%\">车辆<\/th>\n<th style=\"width:25%\">特点<\/th>\n<th style=\"width:25%\">新人难度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>路线配送（ルート配送）<\/td>\n<td>轻型～普通（2t 前后）<\/td>\n<td>固定客户、每日同路线，家庭配达/法人配达<\/td>\n<td>★ 最适合入场<\/td>\n<\/tr>\n<tr>\n<td>仓库内配送/场内运输<\/td>\n<td>托盘车、2t<\/td>\n<td>仓库与厂区间短驳，节奏稳定<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td>一般区域配送<\/td>\n<td>普通～中型（2–4t）<\/td>\n<td>多点配送、要搬运装卸<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>冷链配送（冷蔵/冷凍）<\/td>\n<td>冷藏冷冻车<\/td>\n<td>生鲜/医药，时限严、温控管理责任重<\/td>\n<td>★★ 薪资略高<\/td>\n<\/tr>\n<tr>\n<td>中型·大型干线<\/td>\n<td>中型(4–11t)/大型(11t+)<\/td>\n<td>长距离、夜间多、体力要求高<\/td>\n<td>★★★ 薪资最高<\/td>\n<\/tr>\n<tr>\n<td>特殊车辆<\/td>\n<td>牵引（トレーラー）、罐车、危险品<\/td>\n<td>需追加资格（けん引/危険物乙4 等）<\/td>\n<td>★★★★<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>入场策略<\/strong>：从特定技能 1 号（卡车）入境 → 先做路线配送/仓库关联岗位 → 1–2 年内视条件向中型/冷链/干线升级。<\/p>\n<h4 id=\"2024\">二、车种与驾照对应（2024 年新制度后）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">车牌种类<\/th>\n<th style=\"width:33%\">对应车辆<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>普通免许<\/td>\n<td>总重 3.5t 未满（货物 2t 未满）<\/td>\n<td>2024-05 起新设<strong>準中型<\/strong>，普通范围收窄<\/td>\n<\/tr>\n<tr>\n<td>準中型免许<\/td>\n<td>总重 3.5–7.5t<\/td>\n<td>新制度下进入中型世界的第一张牌<\/td>\n<\/tr>\n<tr>\n<td>中型免许<\/td>\n<td>总重 7.5–11t<\/td>\n<td>需 21 岁+驾龄 2 年（取得時点）<\/td>\n<\/tr>\n<tr>\n<td>大型免许<\/td>\n<td>11t 以上<\/td>\n<td>需 21 岁+驾龄 3 年（取得時点）<\/td>\n<\/tr>\n<tr>\n<td>第二种免许<\/td>\n<td>载客（出租/巴士）<\/td>\n<td>特定技能出租车/巴士路径才需要<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>特定技能 1 号考试：第一种驾照即可；AT 限定需在期限内解除或换 MT<\/li>\n<li>外免切替（中国驾照）：普通免许可换；准中/中型需另考——手续与在留条件见 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html\">08-签证与在留<\/a><\/li>\n<li>职业驾驶资格=驾照 + 雇主实施的<strong>事業用自動車運転者講習<\/strong>（新任驾驶员讲习）<\/li>\n<\/ul>\n<h4 id=\"_18\">三、一天的工作流（典型路线配送）<\/h4>\n<pre><code class=\"language-text\">出勤 → 点呼（酒测/健康确认/运行指示） → 日常点検 → 出库\n→ 配送循环（積込→搬入→伝票受领） ×N → 归库 → 后处理（伝票整理/清扫/充电加油）\n→ 退勤（点呼确认）\n<\/code><\/pre>\n<ul>\n<li>点呼（てんこ）：每次出车前后的法定程序（酒测、健康、指示传达）——运行业务的中枢制度<\/li>\n<li>日常点検：出车前检查项目 60+ 项，记录入点检表<\/li>\n<\/ul>\n<h4 id=\"3\">四、分野内的职业深化方向（对应阶段 3）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">方向<\/th>\n<th style=\"width:50%\">关键能力<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>冷链专家<\/td>\n<td>温度管理记录、医药/生鲜 GSP 意识<\/td>\n<\/tr>\n<tr>\n<td>干线/大型<\/td>\n<td>长距离耐力、车检/油耗管理<\/td>\n<\/tr>\n<tr>\n<td>调度（配車）<\/td>\n<td>排班、路线优化、客户调整<\/td>\n<\/tr>\n<tr>\n<td>运行管理员<\/td>\n<td>法定资格：运行管理者资任者讲习 + 1 年实务（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#05-特定技能2号与升级路径\">08-签证与在留 · 05<\/a>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_19\">五、关联文件<\/h4>\n<ul>\n<li>薪资与工时 → <a href=\"#02-薪资结构与工时合规\">02-薪资结构与工时合规<\/a><\/li>\n<li>安全规范 → <a href=\"#03-安全规范与现场制度\">03-安全规范与现场制度<\/a><\/li>\n<li>求职 → <a href=\"#05-求职渠道与简历面试\">05-求职渠道与简历面试<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 薪资结构与工时合规<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。对应阶段 1（整理岗位条件）与阶段 2（记录实际条件）。<\/p>\n<\/blockquote>\n<h4 id=\"2026\">一、薪资水平（2026 年市场数据）<\/h4>\n<ul>\n<li>卡车司机平均年收：<strong>约 430 万日元<\/strong>（月收约 27 万 + 年间赏与约 106 万，<strong>含赏与年收口径<\/strong>；与监测项目「月均现金给与 341,158 円（不含赏与）」不可直接对比），高于全职业平均<\/li>\n<li>官方月均统计值与年度变化以 <a href=\"../../01-ssw-driver/data/ssw_driver_indicator_registry.md\">监测项目指标登记册<\/a> #5 为准；本节只讲工资构成与谈判口径。<\/li>\n<li>求人市场示例：大型干线 月给 35–43 万；一般配送 月给 25–33 万；冷链/危险品附加 2–5 万<\/li>\n<li>特定技能 1 号硬性要求：<strong>工资与日本人同等以上<\/strong>——面试时拿同岗位日本员工待遇基准对照<\/li>\n<\/ul>\n<h4 id=\"offer\">二、工资构成拆解（看 offer 必看项）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">说明<\/th>\n<th style=\"width:34%\">警惕点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基本给<\/td>\n<td>固定部分<\/td>\n<td>占比过低=靠加班凑收入<\/td>\n<\/tr>\n<tr>\n<td>乗務手当/出勤手当<\/td>\n<td>按乘务日数/出勤次数<\/td>\n<td>请假即减收<\/td>\n<\/tr>\n<tr>\n<td>时间外手当<\/td>\n<td>加班费（1.25 倍起）<\/td>\n<td>是否按法定计算、有无\"固定残業代\"<\/td>\n<\/tr>\n<tr>\n<td>早朝/深夜手当<\/td>\n<td>22–29 时 1.25 倍以上<\/td>\n<td>夜间干线的主要收入来源<\/td>\n<\/tr>\n<tr>\n<td>积込/积下ろし手当<\/td>\n<td>装卸费<\/td>\n<td>有无——影响实际劳动强度<\/td>\n<\/tr>\n<tr>\n<td>赏与<\/td>\n<td>年 1–4 个月不等<\/td>\n<td>特定技能初期公司是否同等待遇<\/td>\n<\/tr>\n<tr>\n<td>各类保险<\/td>\n<td>雇保/健保/厚生年金<\/td>\n<td>必须加入（永住证据链）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>年收换算公式<\/strong>：（基本给+诸手当）×12 + 赏与 − 欠勤减额。<\/p>\n<h4 id=\"2024-6-2024\">三、2024 年（令和 6 年）劳动合规新规——\"物流 2024 年问题\"<\/h4>\n<p>2024-04-01 起，自动车运送业全面适用働き方改革：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">规制<\/th>\n<th style=\"width:50%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>时间外劳动上限（原则）<\/td>\n<td><strong>月 45 小时 · 年 360 小时<\/strong><\/td>\n<\/tr>\n<tr>\n<td>特别条项（36 协定）上限<\/td>\n<td><strong>年 960 小时<\/strong><\/td>\n<\/tr>\n<tr>\n<td>时间外+休日劳动合计<\/td>\n<td><strong>月 100 小时未满<\/strong>、2–6 个月平均 80 小时以内<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>来源：厚生劳动省ポータサイト https://driver-roudou-jikan.mhlw.go.jp/truck/notice [Source: https://driver-roudou-jikan.mhlw.go.jp/truck/notice, 2026]<\/p>\n<p><strong>对个人的影响<\/strong>：<\/p>\n<ol>\n<li>加班收入天花板下降（新规前月 100h+ 加班的公司很多）——工资谈判时看公司<strong>是否已适应新规<\/strong>（适应差的公司可能转嫁为倒班增加或大量离职）<\/li>\n<li>运力不足 → 行业结构性缺人 → <strong>对外国人司机反而是长期利好<\/strong>（2030 年度缺口 162,912 人、约 16 万，见监测项目 #4）<\/li>\n<li>月 100h 未满是红线：超过说明公司违法或制度混乱，入职前必须问清<\/li>\n<\/ol>\n<h4 id=\"_20\">四、入职前必问清单（面试验证用）<\/h4>\n<ul>\n<li>[ ] 平均月加班时间？最近 3 个月实绩？<\/li>\n<li>[ ] 36 协定特别条项是否签订？年加班上限多少？<\/li>\n<li>[ ] 固定残业代制还是全额实算制？<\/li>\n<li>[ ] 休日：月 several 回？运输行业常见的\"シフト休\"如何安排？<\/li>\n<li>[ ] 赏与・昇给实绩（前 3 年）？<\/li>\n<li>[ ] 特定技能员工现有几名？支援体制（自家/登录支援机关）？<\/li>\n<li>[ ] 社保（健保+厚生年金）加入？——从第一天起影响永住证据链<\/li>\n<\/ul>\n<h4 id=\"_21\">五、红牌信号（出现即谨慎）<\/h4>\n<ul>\n<li>月给数字漂亮但\"乗務手当\"占比 &gt;50% 且无加班实算<\/li>\n<li>\"残業は自己申告制\"（=不给加班费的话术）<\/li>\n<li>无厚生年金（只有国民年金）→ 违法+毁永住积累<\/li>\n<li>高离职率（面试可问\"先辈特定技能员工现在几人在职\"）<\/li>\n<\/ul>\n<h4 id=\"_22\">六、关联文件<\/h4>\n<ul>\n<li>工资/社保记录归档 → <a href=\"#06-实际工作条件记录\">06-实际工作条件记录<\/a>、<a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a><\/li>\n<li>收入与日本经济大环境 → <a href=\"../../07-economy-finance/reports/\">../../07-economy-finance<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"03\">03 安全规范与现场制度<\/h3>\n<blockquote>\n<p>信息核对日期：2026-11-11。对应阶段 2（熟悉安全规范、劳动法规）。安全记录直接决定续更、2 号移行与职业升级。<\/p>\n<\/blockquote>\n<h4 id=\"_23\">一、法定运行管理制度（货运）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">制度<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">个人要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>点呼<\/strong><\/td>\n<td>出车前后由运行管理者进行指示+确认<\/td>\n<td>酒气检查（アルコールチェック）必须配合；拒检=重大违规<\/td>\n<\/tr>\n<tr>\n<td><strong>运行指示書<\/strong><\/td>\n<td>记载行车路线、时刻、载货<\/td>\n<td>必须携带并按其运行<\/td>\n<\/tr>\n<tr>\n<td><strong>驾驶时间纪录（運行記録）<\/strong><\/td>\n<td>每日记录驾驶开始/结束、行驶距离<\/td>\n<td>数字化（デジタル走行記録計）公司为主<\/td>\n<\/tr>\n<tr>\n<td><strong>连续驾驶休息<\/strong><\/td>\n<td>4.5h 连续驾驶后至少 30min 休息<\/td>\n<td>长途干线关键规则<\/td>\n<\/tr>\n<tr>\n<td><strong>定期训练<\/strong><\/td>\n<td>每年法定 5 项训练（安全/省燃费等）<\/td>\n<td>出席率记入个人档案<\/td>\n<\/tr>\n<tr>\n<td><strong>日常点检<\/strong><\/td>\n<td>出车前 60+ 项检查<\/td>\n<td>发现异常必须报告，禁止\"带病出车\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_24\">二、事故与异常处理流程<\/h4>\n<ol>\n<li>事故发生：确保安全 → 救护优先 → 报警（110）→ 联系公司运行管理者 → 不可自行与对方\"私了\"<\/li>\n<li>车辆异常：立即靠边 → 报告 → 等指示（自行处置可能违反点呼制度）<\/li>\n<li>货物异常（破损/短缺/温度异常）：拍照 → 保留传票 → 当日报告——冷链温度异常是高责任场景<\/li>\n<li>交通违规：点数制（6 点内停驾照 courses），特定技能者重大违规直接影响在留更新<\/li>\n<\/ol>\n<h4 id=\"_25\">三、饮酒与药物（红线）<\/h4>\n<ul>\n<li>酒测：出车前后各一次，<strong>检出即点呼不通过 → 当日停驾<\/strong><\/li>\n<li>前夜饮酒次日晨检出（残留酒精）也是事故实绩高发点——当天的酒当天止<\/li>\n<li>特定技能者因酒精/药物事故 = 几乎必然失去在留资格<\/li>\n<\/ul>\n<h4 id=\"_26\">四、恶劣天气与季节性风险<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">场景<\/th>\n<th style=\"width:50%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>冬季积雪（北陆/东北/北海道）<\/td>\n<td>冬用轮胎、链子携带义务地区、排雪期运费变化<\/td>\n<\/tr>\n<tr>\n<td>台风（7–10 月）<\/td>\n<td>停运判断权在公司，个人不硬闯<\/td>\n<\/tr>\n<tr>\n<td>夏季高温<\/td>\n<td>冷链货物风险、车厢内热中症<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"90\">五、入职初期 90 天安全路线图<\/h4>\n<pre><code class=\"language-text\">W1–2   点呼/点检/传票流程背熟，跟乘先辈路线\nW3–6   独立短路线，每日复盘：急刹/急转/礼让记录\nW7–12  全路线独立，学习异常处理与客户对应\n<\/code><\/pre>\n<p>安全实绩（无事故无违规月数）是阶段 3 管理岗评估与 2 号移行审查的正面材料。<\/p>\n<h4 id=\"_27\">六、关联<\/h4>\n<ul>\n<li>可量化安全成果记录 → <a href=\"#04-现场经验积累清单\">04-现场经验积累清单<\/a><\/li>\n<li>运输业法规大框架 → <a href=\"../../09-politics-law/reports/\">../../09-politics-law<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"04\">04 现场经验积累清单<\/h3>\n<blockquote>\n<p>对应阶段 2（积累现场经验）→ 阶段 3（可量化成果）。原则：<strong>每项经验都留下可写进简历和审查材料的记录<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"_28\">一、四大现场能力域<\/h4>\n<h5 id=\"1\">1. 装卸与货物处理<\/h5>\n<ul>\n<li>[ ] 7 种主要搬运姿势与腰保护（培训后自查）<\/li>\n<li>[ ] 托盘作业：叉车观察（资格另考：フォークリフト运転技能讲习）<\/li>\n<li>[ ] 冷链装卸：温度带知识（冷藏 0–10°C / 冷冻 −15°C 以下）与开门时间控制<\/li>\n<li>[ ] 破损率记录：月度破损件数归零记录<\/li>\n<\/ul>\n<h5 id=\"2\">2. 调度与配车（转管理岗的种子技能）<\/h5>\n<ul>\n<li>[ ] 理解配车表的构成：车型/司机的匹配逻辑<\/li>\n<li>[ ] 跟踪排班影响因素：运休、客户指定时间、法定驾驶时间<\/li>\n<li>[ ] 用日语读懂并口头确认运行指示書全部字段<\/li>\n<\/ul>\n<h5 id=\"3_1\">3. 客户对接<\/h5>\n<ul>\n<li>[ ] 搬入寒暄流程（「お世話になっております」→ 伝票确认 → 置き位置确认）<\/li>\n<li>[ ] 拒收/延迟的现场应对话术（不擅自承诺）<\/li>\n<li>[ ] 每月记录 1 个\"客户好评\"实例<\/li>\n<\/ul>\n<h5 id=\"4\">4. 异常处理<\/h5>\n<ul>\n<li>[ ] 完成 1 次以上的异常事件完整处理并写报告（事故未遂/货损/车辆故障/天气停运）<\/li>\n<li>[ ] 建立个人异常处理 checklist（报告对象→顺序→证据）<\/li>\n<\/ul>\n<h4 id=\"_29\">二、可量化成果记录表（每月更新，写简历直接用）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:16%\">月份<\/th>\n<th style=\"width:16%\">准点率<\/th>\n<th style=\"width:16%\">安全实绩（无事故月）<\/th>\n<th style=\"width:16%\">破损/投诉<\/th>\n<th style=\"width:16%\">效率改善实例<\/th>\n<th style=\"width:20%\">学到的流程<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>本表是原始运营数据的唯一录入口；管理岗晋升用的 KPI 汇总与 STAR 卡见 <a href=\"../../03-career-management/reports/2026-11-career-management.html#05-成果档案与晋升材料\">03-管理岗过渡 · 05<\/a>，不在此重复建表。<\/p>\n<\/blockquote>\n<p>成果话术模板：\n- 「月間○件の配送で納期遵守率○○%を維持」\n- 「積込み手順を改善し、1 便あたり○分短縮」\n- 「年間無事故・無違反」<\/p>\n<h4 id=\"2-3\">三、技能升级路径时间表（阶段 2 → 3）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">入职后<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–6 月<\/td>\n<td>独立执行固定路线 + 安全实绩零瑕疵<\/td>\n<\/tr>\n<tr>\n<td>6–12 月<\/td>\n<td>多路线/多客户适配；开始帮带新人和实习司机<\/td>\n<\/tr>\n<tr>\n<td>12–24 月<\/td>\n<td>申请追加资格（フォークリフト/危険物乙4/けん引视需要）；JLPT N3<\/td>\n<\/tr>\n<tr>\n<td>24 月+<\/td>\n<td>争取进入配车/教育辅助角色；JLPT N2 启动 → 转入 <a href=\"../../03-career-management/reports/\">../../03-career-management<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_30\">四、证据归档（与永住证据链共用）<\/h4>\n<ul>\n<li>每月：给与明细（PDF 保存）<\/li>\n<li>每年：源泉征收票、雇用保险年金的「ねんきん定期便」、年度安全表彰<\/li>\n<li>随时：表彰状、感谢状、研修修了证扫描件 → 存入个人云盘或本地加密归档<\/li>\n<\/ul>\n<h4 id=\"_31\">五、关联<\/h4>\n<ul>\n<li>管理岗过渡完整计划 → <a href=\"../../03-career-management/reports/\">../../03-career-management<\/a><\/li>\n<li>日语职场表达 → <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.html#03-n3备考计划\">11-日语学习 · 03-N3备考计划<\/a>（职场日语同步包）<\/li>\n<\/ul>\n<hr />\n<h3 id=\"05\">05 求职渠道与简历面试<\/h3>\n<blockquote>\n<p>对应阶段 1（准备简历、资格材料、面试话术和求职渠道）。<\/p>\n<\/blockquote>\n<h4 id=\"_32\">一、求职渠道矩阵<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">渠道<\/th>\n<th style=\"width:33%\">特点<\/th>\n<th style=\"width:34%\">优先级<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>特定技能专门中介/登录支援机关<\/strong><\/td>\n<td>与接受企业绑定，包支援义务，风险最低<\/td>\n<td>★★★ 主渠道<\/td>\n<\/tr>\n<tr>\n<td>Hello Work（ハローワーク）<\/td>\n<td>公共职介，契约·待遇透明，部分招外国人<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>Indeed Japan / 求人ボックス<\/td>\n<td>汇总检索，筛\"特定技能 可\"关键词<\/td>\n<td>★★ 情报源<\/td>\n<\/tr>\n<tr>\n<td>トラバイト等运输专门转职站<\/td>\n<td>司机岗位全、薪资行情直观<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>行业团体（全日ト協各県支部等）介绍<\/td>\n<td>信度高，小企业多<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td>直接应聘地方中坚运输企业官网<\/td>\n<td>竞争小，地方生活成本低<\/td>\n<td>★<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>筛选原则：<strong>只投能做\"特定技能受入计划书认定\"的企业<\/strong>（未认定企业无法雇特定技能者——让对方出示认定证明或说明申请进度）。<\/p>\n<h4 id=\"_33\">二、地域选择策略（影响收入与生活）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">因素<\/th>\n<th style=\"width:50%\">建议方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>运输需求<\/td>\n<td>大都市圈岗位多但竞争/物价高；地方（北关东、东海、九州）缺人更明显<\/td>\n<\/tr>\n<tr>\n<td>薪资<\/td>\n<td>干线/大型岗位：地方反而高（月 35 万+常见）<\/td>\n<\/tr>\n<tr>\n<td>生活支持<\/td>\n<td>选有特定技能前辈/多文化对应的企业聚集地（爱知、埼玉、群马、福冈等）<\/td>\n<\/tr>\n<tr>\n<td>冬季<\/td>\n<td>避免初入行就选豪雪地带（驾驶风险）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_34\">三、简历（履歴書/職務経歴書）要点<\/h4>\n<ul>\n<li>履歴書：JIS 规格手写或打印均可，照片正装，全角日期，学历职历从新往旧不空白（空白期写「日本語学習」等）<\/li>\n<li>职务经历书：突出<strong>驾驶经历（车种/里程/事故率）、装卸/仓库经验、资格（驾照/试验合格）<\/strong><\/li>\n<li>中文驾照驾龄换算为「運転歴○年」并注明车种<\/li>\n<li>附上：ClassNK 合格证明、JLPT/JFT 成绩（复印件）<\/li>\n<\/ul>\n<h4 id=\"_35\">四、面试高频问题与回答方向<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">问题<\/th>\n<th style=\"width:50%\">回答方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>なぜ日本で？なぜ運送業？<\/td>\n<td>物流职业规划（司机→管理→技术）+ 已考取的试验合格=行动证明<\/td>\n<\/tr>\n<tr>\n<td>運転歴・車種？<\/td>\n<td>实话+车种对应表（→ <a href=\"#01-司机岗位全景\">01-司机岗位全景<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>夜勤・長距離できる？<\/td>\n<td>诚实回答体能边界，给出意向区间<\/td>\n<\/tr>\n<tr>\n<td>日本語は？<\/td>\n<td>当场演示：点呼应答/传票确认/事故报告三段话术<\/td>\n<\/tr>\n<tr>\n<td>給与の希望？<\/td>\n<td>参考市场数据报价区间，问清构成（→ <a href=\"#02-薪资结构与工时合规\">02-薪资结构与工时合规<\/a>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_36\">五、契约审查清单（签约前逐项核对）<\/h4>\n<ul>\n<li>[ ] 雇佣契约书：职务/场所/工资构成/时间外/休日与面试口径一致<\/li>\n<li>[ ] 特定技能 1 号受入计划书认定编号<\/li>\n<li>[ ] 支援体制：自家实施还是登录支援机关（费用由企业负担——法定）<\/li>\n<li>[ ] 社保加入说明（健保/厚生年金/雇保）<\/li>\n<li>[ ] 住宅：公司寮的条件与租金扣款额<\/li>\n<li>[ ] 退职金/赏与规则书面化<\/li>\n<\/ul>\n<h4 id=\"_37\">六、面试日语速成包<\/h4>\n<pre><code class=\"language-text\">自己紹介：中国から参りました〇〇です。自動車運転免許を持っており、\n        特定技能の試験に合格しています。長く運送業で働き、\n        将来は運行管理もできるようになりたいと思っています。\n点呼应答：はい、体調に問題ありません。異常ありません。\n確認表現：〜という理解でよろしいでしょうか。\n辞退表現：検討して、明日までにお返事いたします。\n<\/code><\/pre>\n<hr />\n<h3 id=\"06\">06 实际工作条件记录<\/h3>\n<blockquote>\n<p>对应阶段 2（记录实际工作条件）。落地日本后开始维护，每月更新。这份记录同时服务三个目的：自我保护、转职谈判、永住证据链。<\/p>\n<\/blockquote>\n<h4 id=\"_38\">一、公司概况（入职时填写）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">项目<\/th>\n<th style=\"width:50%\">记录<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>公司名称/所在地<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>车种与路线类型<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>特定技能员工数（入职时）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>支援体制（自家/登录支援机关名）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>受入计划书认定编号<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_39\">二、月度记录表<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:14%\">月<\/th>\n<th style=\"width:14%\">实收工资(円)<\/th>\n<th style=\"width:14%\">构成(基本/手当/残業)<\/th>\n<th style=\"width:14%\">加班h<\/th>\n<th style=\"width:14%\">出勤日<\/th>\n<th style=\"width:14%\">夜班数<\/th>\n<th style=\"width:16%\">备注(异常/表彰/纠纷)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_40\">三、半年对比表<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:16%\">半年<\/th>\n<th style=\"width:16%\">月均收入<\/th>\n<th style=\"width:16%\">月均加班<\/th>\n<th style=\"width:16%\">与契约差异<\/th>\n<th style=\"width:16%\">与同行(offer数据)对比<\/th>\n<th style=\"width:20%\">行动判断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>行动判断基准<\/strong>：\n- 连续 2 半年加班 &gt; 月 80h → 公司违反月 100h 未满红线风险，准备退路\n- 实收低于契约 → 当月质询+留证（劳动基准监督署 turbara は最終手段）\n- 收入/成长停滞 2 年 → 启动转职评估（→ <a href=\"#05-求职渠道与简历面试\">05-求职渠道与简历面试<\/a>）<\/p>\n<h4 id=\"1_1\">四、工作环境定性记录（每半年 1 次）<\/h4>\n<ul>\n<li>公司文化：指示清晰度 / 异常报告的安心度 / 前辈关系<\/li>\n<li>运行管理：点呼执行质量 / 加班申报透明度<\/li>\n<li>日语环境：业务外日语使用机会（判断学习暴露量）<\/li>\n<li>居住：通勤、寮环境、周边生活成本<\/li>\n<\/ul>\n<h4 id=\"_41\">五、凭证归档索引<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">凭证<\/th>\n<th style=\"width:33%\">频率<\/th>\n<th style=\"width:34%\">存放位置<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>给与明细 PDF<\/td>\n<td>每月<\/td>\n<td>个人云盘 + 本地加密归档<\/td>\n<\/tr>\n<tr>\n<td>雇佣契约/规则集副本<\/td>\n<td>入职时<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>表彰/感谢状<\/td>\n<td>随时<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td>与公司的书面沟通<\/td>\n<td>随时<\/td>\n<td>同上<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>提醒：给与明细不要只用公司系统查看就删——永住审查要看多年流水（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a>）。<\/p>\n<\/blockquote>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 375, "prev": null}, "summar
