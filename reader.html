https://www.unkan.or.jp/, 2026] [Source: https://www.jitco.or.jp/, 2026]。<\/p>\n<\/blockquote>\n<h4 id=\"_19\">二、加分资格（按需）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">资格<\/th>\n<th style=\"width:25%\">时机<\/th>\n<th style=\"width:25%\">费用<\/th>\n<th style=\"width:25%\">作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>フォークリフト运転技能讲习<\/td>\n<td>Y2–3<\/td>\n<td>3–10 万（3–5 日）<\/td>\n<td>仓储转岗通行证<\/td>\n<\/tr>\n<tr>\n<td>危険物取扱者（乙 4）<\/td>\n<td>Y3+<\/td>\n<td>自学+考试 6 千<\/td>\n<td>化学品运输+月津贴<\/td>\n<\/tr>\n<tr>\n<td>けん引自动车运転者<\/td>\n<td>干线需要时<\/td>\n<td>15–25 万<\/td>\n<td>牵引车资格<\/td>\n<\/tr>\n<tr>\n<td>JLPT N3→N2<\/td>\n<td>Y2/Y4<\/td>\n<td>各约 7,500 円<\/td>\n<td>管理岗+2 号<\/td>\n<\/tr>\n<tr>\n<td>ロジスティクス検定（L検）<\/td>\n<td>Y3+<\/td>\n<td>6–8 千<\/td>\n<td>物流知识体系化证明<\/td>\n<\/tr>\n<tr>\n<td>準中型/中型/大型免许<\/td>\n<td>按车种<\/td>\n<td>各 20 万级<\/td>\n<td>车种升级<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"45\">三、远期资格（阶段 4–5）<\/h4>\n<ul>\n<li>安全管理者選任時研修（被选任时公司安排）<\/li>\n<li>賃金管理検定/労務管理系——管理岗深度化<\/li>\n<li>MOS Excel / G AI 检定——DX 岗位补强<\/li>\n<\/ul>\n<h4 id=\"_20\">四、规则<\/h4>\n<ul>\n<li><strong>一次只攻一个<\/strong>：主线资格未完成不开新线<\/li>\n<li>公司能报销的先走公司（讲习类常有补助）<\/li>\n<li>每张证书扫描归档 → <a href=\"../../03-career-management/reports/2026-11-career-management.html#05-成果档案与晋升材料\">03-管理岗过渡 · 05<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"02\">02 学习体系与教育投资<\/h3>\n<blockquote>\n<p>教育投资的三个账户：语言、资格、学历。总预算纪律：<strong>每年教育支出 ≤ 月收入 1 倍<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"11-\">一、语言账户（→ <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.html\">11-日语学习<\/a>）<\/h4>\n<ul>\n<li>N4（2027）→ N3（Y2）→ N2（Y4）：考试费+教材每级 1–2 万円<\/li>\n<li>落地后加学：职场日语（公司研修）、自治体免费日语教室（先利用免费资源）<\/li>\n<\/ul>\n<h4 id=\"01-\">二、资格账户（→ <a href=\"#01-资格地图\">01-资格地图<\/a>）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">年<\/th>\n<th style=\"width:33%\">投资<\/th>\n<th style=\"width:34%\">金额<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y1<\/td>\n<td>运行管理基础讲习<\/td>\n<td>1–3 万<\/td>\n<\/tr>\n<tr>\n<td>Y2<\/td>\n<td>运行管理者试验+フォークリフト<\/td>\n<td>5–12 万<\/td>\n<\/tr>\n<tr>\n<td>Y3<\/td>\n<td>危険物乙4（可选）<\/td>\n<td>1 万<\/td>\n<\/tr>\n<tr>\n<td>Y4<\/td>\n<td>L検+补强证书<\/td>\n<td>2–3 万<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_21\">三、学历账户（可选，非必需）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">选项<\/th>\n<th style=\"width:33%\">说明<\/th>\n<th style=\"width:34%\">时机<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>放送大学（教养学部）<\/td>\n<td>年 30–40 万，远程+N3 可读<\/td>\n<td>Y4+ 若转岗需要学历证明<\/td>\n<\/tr>\n<tr>\n<td>専門学校（情报/物流）<\/td>\n<td>白天工作晚间制<\/td>\n<td>Y5+ 路径 C 需要<\/td>\n<\/tr>\n<tr>\n<td>通信制大学（经营/经济）<\/td>\n<td>学位=技术·人文·国际业务申请材料之一<\/td>\n<td>长期布局<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>判断原则<\/strong>：学历只在\"在留资格变更\"或\"转职硬门槛\"出现时才买——先让资格和实绩说话。<\/p>\n<h4 id=\"_22\">四、学习资源公共包<\/h4>\n<ul>\n<li>自治体日语教室：免费或数百円/次<\/li>\n<li>Hello Work 职业讲习：雇用保险加入者可领教育训练给付金（支给要件以 20% 以上费用/离职后使用等条件为准，申请前确认）<\/li>\n<li>JF 教材いろどり/まるごと：免费<\/li>\n<li>図书馆（个人登录免费）：物流/Excel/日语 N1–N2 教材齐全<\/li>\n<\/ul>\n<h4 id=\"_23\">五、年度教育预算模板<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">年度<\/th>\n<th style=\"width:25%\">预算上限<\/th>\n<th style=\"width:25%\">实际<\/th>\n<th style=\"width:25%\">产出（证书/实绩）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"03\">03 日本学校教育体系与子女教育<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。制度+手续+成本框架，不做学区/升学策略深水区。承接家属带同后子女落地就学场景，在留资格与家族滞在要件归 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">07 永住与长期在留规划<\/a>。<\/p>\n<\/blockquote>\n<h4 id=\"_24\">一、学制全景（学校教育法框架）<\/h4>\n<p>日本学制为 6-3-3-4（1947 年学校教育法确立），义务教育为小 6+中 3 共 9 年 [Source: https://www.mext.go.jp/en/policy/education/overview/index.htm, 2026]。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">学校<\/th>\n<th style=\"width:25%\">修业年限<\/th>\n<th style=\"width:25%\">义务性<\/th>\n<th style=\"width:25%\">入学节点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小学校<\/td>\n<td>6 年<\/td>\n<td>义务<\/td>\n<td>满 6 周岁（4 月入学）<\/td>\n<\/tr>\n<tr>\n<td>中学校<\/td>\n<td>3 年<\/td>\n<td>义务<\/td>\n<td>小学课程修了<\/td>\n<\/tr>\n<tr>\n<td>高等学校<\/td>\n<td>3 年（全日制；定時制/通信制 3 年以上）<\/td>\n<td>非义务，须入学选考<\/td>\n<td>中学课程修了<\/td>\n<\/tr>\n<tr>\n<td>大学/大学院<\/td>\n<td>学士 4 年；修士 2 年+博士 3 年<\/td>\n<td>非义务<\/td>\n<td>高校课程修了或同等学力<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>一贯制补充：義務教育学校（小中 1–9 年一贯）、中等教育学校（中高 6 年一贯）、高等专门学校（中卒入学 5 年一贯）<\/li>\n<li>高等学校段階含全日制、定時制、通信制三种课程，均授予高中毕业资格 [Source: https://www.mext.go.jp/en/policy/education/overview/index.htm, 2026]<\/li>\n<li>学期制度 4 月始业·3 月修了；转入插班以住民票办理时点为准（<strong>常识<\/strong>）<\/li>\n<\/ul>\n<h4 id=\"_25\">二、公立/私立/国际学校对比<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">类型<\/th>\n<th style=\"width:25%\">入学方式<\/th>\n<th style=\"width:25%\">费用特征<\/th>\n<th style=\"width:25%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm, 2026\">公立（小·中）<\/a><\/td>\n<td>住民票对应学区指定<\/td>\n<td>授业料·教科书无偿；主要负担为给食费与学外活动费<\/td>\n<td>外国人子女希望就学者与日本人同样无偿接收<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mext.go.jp/a_menu/koutou/shinkou/1412179_00006.htm\" title=\"来源：https://www.mext.go.jp/a_menu/koutou/shinkou/1412179_00006.htm, 2026\">私立<\/a><\/td>\n<td>自主选考（试験）<\/td>\n<td>初年度納付金年額：小约 91 万/中约 83.5 万/高约 78 万円（R6 调查）<\/td>\n<td>高校有就学支援金实质减负（见五）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422252.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422252.htm, 2026\">国际学校<\/a><\/td>\n<td>逐校选考、可随时插班<\/td>\n<td>学费带无官方统计（待复核，通常百万円级/年，<strong>推断<\/strong>）<\/td>\n<td>多数非「一条校」；日本国籍子女就读不构成就学义务履行，升学衔接需逐校确认<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_26\">三、外国人子女就学手续（自治体联动）<\/h4>\n<ul>\n<li><strong>法律定位<\/strong>：对外国人子女<strong>无就学义务<\/strong>，但希望就读公立义务教育诸学校者，依据国际人权规约等与日本人儿童同样<strong>无偿接收<\/strong> [Source: https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1422256.htm, 2026]<\/li>\n<li><strong>手续链（在留卡×住民票）<\/strong>：2012 年住民基本台账法改正后，3 个月以上中长期在留者登记住民票；市町村基于住基信息向监护人发送就学案内；就学手续时的居住地确认使用<strong>在留卡或特别永住者证明书<\/strong>，无提示时也可用可信书类柔性处理 [Source: https://www.mext.go.jp/a_menu/shotou/clarinet/004/1323374.htm, 2026]<\/li>\n<li><strong>把握与促進<\/strong>：文科省就学促進指针（令和 8-08-28 改订）要求自治体确认居住实态（必要时向入管照会出入国记录）、在住民登记窗口进行就学说明 [Source: https://www.mext.go.jp/a_menu/shotou/clarinet/004/1415154_00018.html, 2026]<\/li>\n<li><strong>中文官方指南<\/strong>：「面向外国人的就学指南」（文科省，中文版）覆盖公立小·中入学手续要点 [Source: https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2015/06/01/1358329_05.pdf, 2015]<\/li>\n<li><strong>现状数据<\/strong>：学龄相当外国人儿童住基登载数 177,726 人（调查以来最多），其中义务教育诸学校在籍 150,786 人（85.0%）；<strong>不就学 911 人<\/strong>，加上「就学状况无法把握 8,013 人」「住基人数差 229 人」，不就学可能性合计 <strong>9,153 人<\/strong> [Source: https://www.mext.go.jp/content/20260525-mxt_kyokoku-000049969_02.pdf, 2026]<\/li>\n<li><strong>落地动作<\/strong>：转入驻地时在市役所办住民票→教育委员会窗口确认指定校与入学手续；保留在留卡与住民票复印件作为就学手续材料<\/li>\n<\/ul>\n<h4 id=\"_27\">四、日本語指导体制现状<\/h4>\n<ul>\n<li>规模：公立学校日本語指導必要児童生徒 <strong>84,759 人<\/strong>（较前次 +22.6%）；含国公私立 <strong>88,045 人<\/strong>；其中外国籍 73,313 人 [Source: https://www.mext.go.jp/content/20260525-mxt_kyokoku-000007294_00.pdf, 2026]<\/li>\n<li>覆盖面：1 人以上在籍学校 12,668 校，占全部公立学校 <strong>39.4%<\/strong>；母语构成中国語 24.3%、ポルトガル語 16.3%<\/li>\n<li>体制缺口：受「特别照顾指导」者 88.6%，<strong>仍有 11.4%（9,699 人）未受任何形式指导<\/strong>；义务教育段階入「特别的教育课程」者占受指导者 76.4%<\/li>\n<li>支援人力：日本語指導補助者 8,706 人、母語支援員 7,301 人（全国）；自治体间体制差异大<\/li>\n<li>升学现实（该群体）：高中生中途退学率 6.4%、高中进学率 91.5% 低于全体 98.9% [Source: https://www.mext.go.jp/content/20260525-mxt_kyokoku-000007294_00.pdf, 2026]<\/li>\n<li><strong>落地动作<\/strong>：带同子女前向驻地教育委员会确认：有无日本語指導教室/抽离指导、母语支援员配置、特别的教育课程实施校——<strong>不要假设「附近学校有日语老师」<\/strong><\/li>\n<\/ul>\n<h4 id=\"_28\">五、教育成本结构与就学援助<\/h4>\n<ul>\n<li>公立义务教育：授业料·教科书无偿；实际负担=给食费（<a href=\"https://www.mext.go.jp/content/20260730-mxt-kenshoku-000051287_03.pdf\" title=\"来源：https://www.mext.go.jp/content/20260730-mxt-kenshoku-000051287_03.pdf, 2025\">令和 7 年度公立小学月额 5,196 円<\/a>，食材费相当、按都道府县学校数加权；自治体间有差）+学用品/通学/学外活动费<\/li>\n<li><a href=\"https://www.mext.go.jp/a_menu/koutou/shinkou/1412179_00006.htm\" title=\"来源：https://www.mext.go.jp/a_menu/koutou/shinkou/1412179_00006.htm, 2026\">私立差距<\/a>：R6 初年度納付金（授业料+入学金+施設整備費等）小 909,697/中 834,964/高 780,460 円；私立成本集中于初年度<\/li>\n<li><a href=\"https://www.mext.go.jp/en/policy/education/elsec/title02/detail02/1373867.htm\" title=\"来源：https://www.mext.go.jp/en/policy/education/elsec/title02/detail02/1373867.htm, 2026\">高校就学支援金<\/a>：私立高校每户月 9,900 円的 1.2–2.5 倍补助（市町村民税约 30.42 万円以下、年收约 910 万円未満模型世帯）<\/li>\n<li><a href=\"https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1385578.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/shugaku/detail/1385578.htm, 2026\">私立小中支援实证事业<\/a>：年收 400 万円未満且资产 600 万円以下世帯为对象<\/li>\n<li><a href=\"https://www.mext.go.jp/a_menu/shotou/career/05010502/017.htm\" title=\"来源：https://www.mext.go.jp/a_menu/shotou/career/05010502/017.htm, 2026\">就学援助制度<\/a>：学校教育法第 19 条下市町村<strong>必须<\/strong>援助就学困难家庭；对象=要保護者（R6 约 8 万人）+準要保護者（R6 约 109 万人）；援助品目含学用品费/通学费/修学旅行费/学校给食费/医疗费等；<strong>认定基准由各市町村自定<\/strong><\/li>\n<li>与永住联动：子女教育支出影响世帯年收管理与「公的义务」缴纳 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">07 永住与长期在留规划<\/a><\/li>\n<\/ul>\n<h4 id=\"_29\">六、子女来日时点选择（<strong>推断<\/strong>，个案判断）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">时点<\/th>\n<th style=\"width:33%\">优势<\/th>\n<th style=\"width:34%\">风险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小学入学前（6 岁前）<\/td>\n<td>日语接近母语习得，同伴关系从零建立<\/td>\n<td>家长日语与手续能力要求最高<\/td>\n<\/tr>\n<tr>\n<td>小学低学年<\/td>\n<td>适应期短，日语指导资源易获得<\/td>\n<td>需学校有抽离指导体制<\/td>\n<\/tr>\n<tr>\n<td>中学以后<\/td>\n<td>母语学业基础稳<\/td>\n<td>高中入试日语门槛显著<\/td>\n<\/tr>\n<tr>\n<td>高中阶段<\/td>\n<td>—<\/td>\n<td>学分换算与入试难度最大，一般不推荐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>一般化观察而非统计结论；实际取决于子女日语水平与自治体支援资源（见四）。本节与 02 章区分：02 是<strong>本人<\/strong>三账户，本章是<strong>子女<\/strong>教育支出，两本账分开记。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"04\">04 高等教育与技人国学历路径<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。本章只做教育侧分析；「技人国」在留要件细节归 visa 手册 05 章（不重写在留要件），核心交付为<strong>「大学毕业 vs 10 年实务经验」两条技人国路线的成本-时间-风险对比表<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"_30\">一、高等教育体系定位<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">机构<\/th>\n<th style=\"width:25%\">修业年限<\/th>\n<th style=\"width:25%\">学位/称号<\/th>\n<th style=\"width:25%\">对技人国路径的意义<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.mext.go.jp/en/policy/education/overview/index.htm\" title=\"来源：https://www.mext.go.jp/en/policy/education/overview/index.htm, 2026\">大学<\/a><\/td>\n<td>4 年<\/td>\n<td>学士<\/td>\n<td>技人国「大学毕业」要件的标准学历<\/td>\n<\/tr>\n<tr>\n<td>大学院<\/td>\n<td>修士 2 年+博士 3 年<\/td>\n<td>修士/博士<\/td>\n<td>高度人材积分学历加分更高<\/td>\n<\/tr>\n<tr>\n<td>短期大学<\/td>\n<td>2–3 年<\/td>\n<td>短期大学士<\/td>\n<td>学分可计入大学学士（编入衔接）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mext.go.jp/a_menu/koutou/kousen/\" title=\"来源：https://www.mext.go.jp/a_menu/koutou/kousen/, 2026\">高等专门学校<\/a><\/td>\n<td>中卒入学 5 年一贯<\/td>\n<td>准学士<\/td>\n<td>实践型技术者养成，可编入大学<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://shirusen.mext.go.jp/senmon/\" title=\"来源：https://shirusen.mext.go.jp/senmon/, 2026\">专门学校（专修学校专门课程）<\/a><\/td>\n<td>2 年以上<\/td>\n<td>専門士（修业 2 年以上且达标者）<\/td>\n<td>修业 3 年以上等指定校修了者可获大学出愿资格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_31\">二、社会人入学与大学编入制度<\/h4>\n<ul>\n<li><strong>社会人入试<\/strong>：大学自设选考（小论文/面试/职历书类为主流，<strong>常识<\/strong>），要件逐校不同——例：<a href=\"https://www.tus.ac.jp/admissions/university/list/society/\" title=\"来源：https://www.tus.ac.jp/admissions/university/list/society/, 2026\">东京理科大学<\/a>社会人特别选拔面向「当前无学籍者」（高卒等）；<a href=\"https://www.kagawa-u.ac.jp/files/4517/5022/8969/82fba96ce15731d14c05d8f83cec33fa.pdf\" title=\"来源：https://www.kagawa-u.ac.jp/files/4517/5022/8969/82fba96ce15731d14c05d8f83cec33fa.pdf, 2026\">香川大学<\/a>夜间主课程要求满 22 岁+2 年以上社会人经验。报考前逐校核对募集要项<\/li>\n<li><strong>大学编入<\/strong>：2 年次/3 年次编入为主流，短大·高専·专门学校毕业生为主要对象；已修得单位可被认定抵免（<strong>常识<\/strong>）——例：<a href=\"https://www.internet.ac.jp/for/transfer/\" title=\"来源：https://www.internet.ac.jp/for/transfer/, 2026\">东京通信大学<\/a>接受 2·3 年次编入，按既有单位认定后最高认定 61 单位<\/li>\n<li><strong>编入试验常识<\/strong>：国家只统一规定编入<strong>资格要件<\/strong>（短大/高専/专修等毕业），选考方式与是否要求出身校成绩证明<strong>由各校自设<\/strong>（<a href=\"https://www.mext.go.jp/en/policy/education/highered/title02/detail02/1373913.html\" title=\"来源：https://www.mext.go.jp/en/policy/education/highered/title02/detail02/1373913.html, 2025\">文科省 高等教育制度说明<\/a>）；书类审查+小论文+面试为典型组合，报考前以目标校「編入学募集要項」为准<\/li>\n<\/ul>\n<h4 id=\"_32\">三、通信制大学：在职取得学历的可行性<\/h4>\n<ul>\n<li><strong>可行性<\/strong>：按修得单位计学费、最长 10 年在学（放送大学），与全职工作并行是制度设计前提；文科省<a href=\"https://manapass.mext.go.jp/\" title=\"来源：https://manapass.mext.go.jp/, 2026\">マナパス<\/a>将其列为主要リカレント教育渠道<\/li>\n<li><strong>学费带（在职取得学位）<\/strong>：<\/li>\n<li><a href=\"https://tobe.ouj.ac.jp/fee/\" title=\"来源：https://tobe.ouj.ac.jp/fee/, 2026\">放送大学<\/a>全科履修生：入学料 24,000 円+授课料 1 单位 6,000 円，毕业（124 单位）总费用 <strong>768,000 円～<\/strong>；10 年在学修满 124 单位总费用不变；3 年次编入（62 单位认定）例仅 406,000 円<\/li>\n<li>私立通信制：年 27–31 万円级——<a href=\"https://www.kindai.ac.jp/tsushin/course/regular/architecture/expense/\" title=\"来源：https://www.kindai.ac.jp/tsushin/course/regular/architecture/expense/, 2026\">近畿大学通信教育部<\/a>授课料 306,000 円/年、<a href=\"https://www.internet.ac.jp/english/\" title=\"来源：https://www.internet.ac.jp/english/, 2026\">东京通信大学<\/a>初年度 271,000 円～（4 年总 834,000 円～）<\/li>\n<li>与 02 章「学历账户」衔接：先单科目履修试水 → 全科履修；见 <a href=\"#02-学习体系与教育投资\">02 学习体系与教育投资<\/a><\/li>\n<li><strong>注意<\/strong>：学位取得与「专业相关性」需同步规划——技人国审查看学历专业与业务的相关性（见四）<\/li>\n<\/ul>\n<h4 id=\"vs-10\">四、核心对比：大学毕业 vs 10 年实务经验（技人国路线）<\/h4>\n<p>前置：技人国申请材料要求「大学等卒业证明书」<strong>或<\/strong>「在职证明书等证明从事相关业务期间的书类（含大学·高专·高中·专修学校专门课程在校专攻相关科目期间）」[Source: https://www.moj.go.jp/isa/applications/status/gijinkoku.html, 2026]；在留要件细节 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#05-特定技能2号与升级路径\">05 特定技能2号与升级路径<\/a>。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">维度<\/th>\n<th style=\"width:33%\">① 大学毕业路线（含在职补学历）<\/th>\n<th style=\"width:34%\">② 10 年实务经验路线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>硬门槛<\/td>\n<td>学士学位（专业与业务相关）<\/td>\n<td>10 年相关实务经验（在校专攻期间可合并计算）<\/td>\n<\/tr>\n<tr>\n<td>时间<\/td>\n<td>通信制 2–4 年（可并行工作；编入可缩至 2 年）<\/td>\n<td>自入境起约 10 年；<strong>但特定技能 1 号上限 5 年<\/strong>，须 Y5 前转其他就劳资格续积累（引 visa 05 结论）<\/td>\n<\/tr>\n<tr>\n<td>直接成本<\/td>\n<td>76.8 万–120 万円（通信制 4 年全额，见三）<\/td>\n<td>0 円（材料工本费级）<\/td>\n<\/tr>\n<tr>\n<td>机会成本<\/td>\n<td>晚间/周末学习时间；N3 以上日语读授业能力（<strong>推断<\/strong>）<\/td>\n<td>无学习成本，但需 10 年持续相关岗位<\/td>\n<\/tr>\n<tr>\n<td>审查风险<\/td>\n<td>学历证明明确、专业相关性靠毕业证·成绩单；风险最低<\/td>\n<td>依赖职历证据链（在职证明/职务内容说明/勤务记录）；岗位不被认定即不成立（引 visa 05 5.2）<\/td>\n<\/tr>\n<tr>\n<td>高度人材积分<\/td>\n<td>学历 10 分（大学），后续可达 70 分路径<\/td>\n<td>学历 0 分=硬伤，70 分基本不可达（引 visa 05 5.3）<\/td>\n<\/tr>\n<tr>\n<td>适配<\/td>\n<td>无学位者最稳兜底；Y1 启动才赶得上 Y5 切换（引 visa 05 5.4）<\/td>\n<td>学历为零但职历可证据化的长期布局<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>审查口径变化信号<\/strong>：令和 8-04-15 起语言类业务（翻译/口译/接客等）需提交 CEFR B2 相当证明，<strong>JLPT N2 以上视同达标<\/strong>；日本国内大学毕业等情形可豁免 [Source: https://www.moj.go.jp/isa/applications/status/gijinkoku.html, 2026]——审查口径变化须触发 04 章复核<\/li>\n<li><strong>决策规则<\/strong>（承接 02 章原则）：学历只在「在留资格变更」或「转职硬门槛」出现时才买；本人个案学历要件已满足（visa 05 5.5 收敛：路径 A 成立、补学历不启用），本章对比表供未来分叉时决策输入<\/li>\n<\/ul>\n<h4 id=\"_33\">五、行动要点<\/h4>\n<ul>\n<li>若启用补学历兜底：Y1 报名（编入优先，省 2 年时间与约 40 万円），专业选经营/物流/情报类保「相关性」<\/li>\n<li>每年归档职历证据链（在职证明、职务说明、勤务记录）——无论走哪条路线都是审查刚需（引 visa 05 行动清单）<\/li>\n<li>监测触发：大学制度改革/编入要项变化、技人国审查口径变化 → 更新本章（见 prompt 触发器）<\/li>\n<\/ul>\n<h4 id=\"_34\">六、常见误区<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">误区<\/th>\n<th style=\"width:50%\">实际<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>「有学位就一定能转技人国」<\/td>\n<td>岗位须为白领业务，纯驾驶不符合（引 visa 05 5.2）<\/td>\n<\/tr>\n<tr>\n<td>「专门学校任何专业都算学历」<\/td>\n<td>专业相关性与専門士/高度専門士称号须同时满足，认定以入管为准<\/td>\n<\/tr>\n<tr>\n<td>「10 年经验可替代学历所以不急」<\/td>\n<td>10 年从相关工作起算，且 1 号 5 年上限不等人；须 Y5 前转资格续积累（引 visa 05）<\/td>\n<\/tr>\n<tr>\n<td>「在线学位一定被认可」<\/td>\n<td>学位认证与专业相关性由入管个别审查<\/td>\n<\/tr>\n<tr>\n<td>「先随便读一个学历转岗再说」<\/td>\n<td>专业不对口等于白读，且挤占 Y4 前时间窗口<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 311, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "10-education-qualification/reports/2026-11-education-qualification.html"}}}, "language-japanese": {"name": "日语语言", "dir": "11-language-japanese", "months": {"2026-11": {"title": "日语学习 · 首份分析报告", "body": "\n<h1 id=\"_1\">日语学习 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向拟通过特定技能（SSW）签证赴日从事货运司机工作、需要分阶段日语学习规划的读者，兼具考试路径与学习执行顾问视角。\n<strong>来源规则<\/strong>：① JLPT 官方（jees.or.jp/jlpt / jlpt.jp / jlpt.neea.edu.cn）、JFT-Basic（prometric-jp.com / jpf.go.jp）＞ ② 国際交流基金、日本語能力試験公式資料 ＞ ③ 出版社 / 教材官网（参考书版本信息）＞ ④ 学习门户与社区经验（标注为经验，不作事实）；考试日程 / 费用 / 考位以 01-ssw-driver 登记册 #3 为单一事实源，本主题只读同步。<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本日语学习知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：总体学习路线与考试选择（目标矩阵、JFT-Basic vs JLPT 选择、JLPT 日程报名、各级概要、总时间线）；N4 / N3 / N2 分阶段备考计划（四阶段 / 五阶段计划、每周节奏、自测线、失败预案）；资源与工具清单（主线教材、官方免费资源、App、报名入口）；学习进度跟踪（里程碑看板、周记录表、模考记录、月度复盘）。<\/li>\n<li><strong>不含<\/strong>：考试日程 / 费用 / 考位等制度类数字（→ 01-ssw-driver，本主题主责登记册 #3，只读同步）；在留制度侧的考试要求（→ 08-visa-immigration）；现场日语、劳动合规细节（→ 02-career-driver）；管理岗日语与业务知识（→ 03-career-management）；永住年收财务与证据链（→ 07-economy-finance）。<\/li>\n<\/ul>\n<p><strong>受众与用途<\/strong>：为拟赴日货运司机提供分阶段日语学习路线、考试选择与进度跟踪框架，用途为个人备考执行与报名时点提醒的参照基线。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. JLPT 与 JFT-Basic 两条考试路径如何选择？\n2. N4 / N3 / N2 的分阶段目标时间与现实学习量是否匹配？\n3. 中国大陆无 JFT-Basic 考点对备考策略的影响有多大？\n4. 学习进度与主用教材版本现状如何？\n5. N4 失利后的 JFT-Basic 兜底方案是否可行？<\/p>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试日程 / 费用 / 考位<\/td>\n<td>01-ssw-driver（只读锚）<\/td>\n<\/tr>\n<tr>\n<td>在留制度侧的考试要求<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>现场日语、劳动合规细节<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>管理岗日语与业务知识<\/td>\n<td>03-career-management<\/td>\n<\/tr>\n<tr>\n<td>资格 / 学历路径<\/td>\n<td>10-education-qualification<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试选择与路径<\/td>\n<td>目标矩阵与 JLPT / JFT-Basic 选择<\/td>\n<td>#1、#2<\/td>\n<td>jees.or.jp / jlpt.neea.edu.cn / prometric-jp.com<\/td>\n<td>逐次运行（报名窗口）<\/td>\n<\/tr>\n<tr>\n<td>N4 备考<\/td>\n<td>零基础到 N4 的四阶段计划<\/td>\n<td>#3<\/td>\n<td>自记录<\/td>\n<td>每周（进度跟踪）<\/td>\n<\/tr>\n<tr>\n<td>N3 备考<\/td>\n<td>N4 后到 N3 的五阶段计划<\/td>\n<td>#3<\/td>\n<td>自记录<\/td>\n<td>每周（进度跟踪）<\/td>\n<\/tr>\n<tr>\n<td>N2 备考<\/td>\n<td>N3 后到 N2 的 18 个月计划<\/td>\n<td>#3<\/td>\n<td>自记录<\/td>\n<td>每周（进度跟踪）<\/td>\n<\/tr>\n<tr>\n<td>资源与工具<\/td>\n<td>主线教材、官方免费资源与报名入口<\/td>\n<td>#4<\/td>\n<td>出版社页面 / 官方资源<\/td>\n<td>教材版本变化时<\/td>\n<\/tr>\n<tr>\n<td>学习进度跟踪<\/td>\n<td>里程碑看板、周记录与模考记录<\/td>\n<td>#3<\/td>\n<td>自记录（06 文档）<\/td>\n<td>每周 / 每月<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：考试选择与路径决定 N4 / N3 / N2 三个备考阶段的目标时点；三个备考阶段共用同一套资源与工具，并共同汇入学习进度跟踪；学习进度跟踪又是判断备考计划是否需要重排的依据。考试制度类数字（日程 / 费用 / 考位）不在本主题维护，只读同步 01-ssw-driver 登记册 #3。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 考试选择与路径<\/h3>\n<ul>\n<li>目标矩阵（手册）：M1 = JLPT N4 或 JFT-Basic（A2），目标 2027 年 7 月 JLPT；M2 = JLPT N3，目标 2027 年 12 月（激进）/ 2028 年 7 月（稳妥）；M3 = JLPT N2，目标 2028 年 12 月～2029 年 7 月。<\/li>\n<li>中国大陆目前没有 JFT-Basic 考点（截至 2026-08 核实；JFT-Basic 开考国为菲律宾、越南、泰国、印尼、尼泊尔、蒙古等，不含中国大陆），也没有技能评价试验考点。<\/li>\n<li>策略（手册）：在中国大陆备考主攻 JLPT N4（每年 7 月 / 12 月两次，国内教育部考试院组织）；已在日本改考 JFT-Basic（Prometric CBT，随约随考，60 分钟，出分快）。<\/li>\n<li>JFT-Basic 评分 10–250：145–174 = A1，175–199 = A2.1，200–250 = A2（特定技能达标线）。<\/li>\n<li>JLPT 日程（手册）：2026-12-06 场次报名 8 月底已截止；2027 年 7 月（第一个周日）为 M1 目标场次，约 2027 年 3 月中下旬报名；2027 年 12 月 M2 备选；2028 年 7 月 / 12 月 M3 备选。<\/li>\n<li>登记册活值：#1 JLPT 下一次考试报名窗口 = 2026-12-06 考试（报名 9/1–9/8 已截止）；下一窗口为 2027 年上半年（推断）；#2 JFT-Basic 考场次与考位 = 日本国内 10,000 円；中国大陆无考点。<\/li>\n<\/ul>\n<h3 id=\"32-n4\">3.2 N4 备考计划<\/h3>\n<ul>\n<li>起点：零基础（2026-11）；终点：2027-07 JLPT N4 合格；周期约 32–34 周（手册）。<\/li>\n<li>考察量：约 300 汉字、1,500 词汇、基本句型（手册）。<\/li>\n<li>四阶段（手册）：A 入门（第 1–6 周，~60h）；B N4 语法主体（第 7–18 周，~160h）；C 应试强化（第 19–28 周，~130h）；D 冲刺（第 29–33 周）。<\/li>\n<li>自测线：第 12 周 ≥ 70 分；第 20 周 ≥ 90 分；第 28 周 ≥ 110 分；若听力单项 &lt; 32/60 立即加听力权重。<\/li>\n<li>学习量估算：N4 累计 300–450h；工作日 1.5–2h + 周末 3h ≈ 12–16h/周 × 8 个月 ≈ 450h（手册）。<\/li>\n<li>JFT-Basic 备用方案：若 2027-07 N4 失利，可在赴日后再考 JFT-Basic 兜底（随约随考）。<\/li>\n<\/ul>\n<h3 id=\"33-n3\">3.3 N3 备考计划<\/h3>\n<ul>\n<li>前提：M1（N4 或 JFT-Basic）已达成；N3 合格线 95/180，分项底线 19×3（手册）。<\/li>\n<li>时间方案：激进 2027-12-05（N4 后 5 个月）；稳妥（推荐）2028-07（N4 后 12 个月，已入境工作、日均只能挤 1h）。<\/li>\n<li>内容：词汇 1,500 → 累计 3,750 词；汉字累计约 650 字；敬语体系专项。<\/li>\n<li>五阶段（稳妥 48 周）：衔接期 1–8 周；主体期 9–24 周；读解期 25–34 周；听解期 35–42 周；冲刺期 43–48 周。<\/li>\n<li>自测线：第 16 周 ≥ 80；第 32 周 ≥ 100；第 44 周 ≥ 115。<\/li>\n<\/ul>\n<h3 id=\"34-n2\">3.4 N2 备考计划<\/h3>\n<ul>\n<li>前提：N3 已达成；N2 合格线 90/180，分项 19×3（手册）。<\/li>\n<li>时间方案：激进 2028-12（第一个周日）；推荐 2029-07（第一个周日），留 18 个月。<\/li>\n<li>内容：词汇累计 6,000 词；汉字累计约 1,000–1,050 字；读解为得分主战场；听解一次放完不重播。<\/li>\n<li>计划骨架（18 个月 / 78 周）：基础期 1–20 周；读解期 21–36 周；听解期 37–52 周；冲刺期 53–78 周。<\/li>\n<li>自测线：第 20 周 ≥ 85；第 40 周 ≥ 100；第 60 周 ≥ 115。<\/li>\n<li>风险与对策：工作疲劳断档（设「最低维持量」）；读解超时（全部限时训练）；中文字面陷阱（同形异义词专项）。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 资源与工具清单<\/h3>\n<ul>\n<li>主线教材：方案 A（推荐·重口语）《大家的日语》；方案 B（重语法体系）《新标日》；N2《新完全掌握》系列（手册）。<\/li>\n<li>官方免费资源：いろどり（JF 免费·面向在日劳动者）；JLPT 官方问题集；JLPT 题型说明；JFT-Basic 官方样题；JF 日本语教育标准（手册）。<\/li>\n<li>App 与工具：Anki；MOJi 辞書 / 大辞泉；NHK News Web Easy；Podcast；YouTube 日本語の森（手册）。<\/li>\n<li>报名入口：https://jlpt.neea.edu.cn / https://jlpt.neea.cn；https://www.jlpt.jp；https://www.jft-basic.jp；https://www.ssw.go.jp/cn/。<\/li>\n<li>预算参考：每级 300–600 元人民币（手册）。<\/li>\n<li>登记册活值：#4 主用教材版本 <strong>待基线确立<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"36\">3.6 学习进度跟踪<\/h3>\n<ul>\n<li>里程碑看板（手册）：M0 五十音全熟、M1 JLPT N4（2027-07）、M1.5 特定技能技能试验、M2 JLPT N3、M3 JLPT N2，状态均未开始。<\/li>\n<li>周记录表与模考记录：模板已建，记录为空。<\/li>\n<li>登记册活值：#3 当前学习进度（N4/N3/N2）<strong>待基线确立<\/strong>。<\/li>\n<\/ul>\n<p><strong>未取得 / 待核验项<\/strong>：\n- #1 下一窗口 2027 年上半年为<strong>推断<\/strong>，须以 JLPT 官网正式公告为准。\n- #3 当前学习进度——待基线确立。\n- #4 主用教材版本——待基线确立。<\/p>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>考试路径已明确<\/strong>：中国大陆无 JFT-Basic 考点，主攻 JLPT N4 是当前唯一可在中国大陆完成的达标路径。（事实）<\/li>\n<li><strong>M1 目标场次为 2027-07 JLPT N4<\/strong>：从现在（2026-11）起约 8 个月备考期，与手册 32–34 周计划一致。（事实）<\/li>\n<li><strong>学习量估算自洽<\/strong>：N4 累计 300–450h 与「12–16h/周 × 8 个月 ≈ 450h」的推算吻合，计划节奏可行。（事实 + 推断）<\/li>\n<li><strong>个人维度尚无法评估<\/strong>：当前学习进度与主用教材版本均待基线确立，里程碑看板全部未开始。（事实）<\/li>\n<li><strong>偏科风险集中于听解<\/strong>：JLPT 有分项底线，N4 听力底线 19/60、N3/N2 各分项 19，偏科会直接挂科。（事实）<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：\n- 2027 年 7 月报名窗口为推断值，实际开放日期以 JLPT 官网公告为准。\n- 手册学习量估算为一般化经验值，个体差异（中文母语者汉字红利）可能改变实际所需时长。\n- 入职后工作强度可能迫使 N3 / N2 目标时间后移，稳妥方案已预留弹性。<\/p>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题（分析层）<\/strong>：\n1. 2027-03 JLPT N4 报名窗口是否如期开放？大城市考位是否充足？\n2. 个人学习进度（N4/N3/N2）与主用教材版本何时确立基线？\n3. JFT-Basic 在中国大陆是否开设或调整考点？\n4. N3 / N2 目标时间是否随入职后工作强度调整？\n5. N4 失利后转考 JFT-Basic 的兜底路径是否仍然可行？<\/p>\n<p><strong>下一期重点核实项<\/strong>：\n- 报名窗口前 1 个月核对 JLPT 官网日程，回写登记册 #1。\n- 建立周记录表，回写登记册 #3。\n- 确定主用教材版本，回写登记册 #4。<\/p>\n<p><strong>数据补全计划<\/strong>：每周更新 06-学习进度跟踪；报名窗口前 1 个月核对 JLPT 官网日程；月度核验仅更新登记册观察项，命中 JLPT / JFT-Basic 报名日程或费用变更、考点调整等触发器时升级为季度重点更新。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>JLPT 下一次考试报名窗口<\/td>\n<td>2026-12-06 考试（报名 9/1–9/8 已截止）；下一窗口为 2027 年上半年（推断）<\/td>\n<td>jees.or.jp / jlpt.neea.edu.cn<\/td>\n<td>2026-12-06<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>JFT-Basic 考场次与考位<\/td>\n<td>日本国内 10,000 円；中国大陆无考点<\/td>\n<td>prometric-jp.com/ssw<\/td>\n<td>2026<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>当前学习进度（N4/N3/N2）<\/td>\n<td>待基线确立<\/td>\n<td>自记录（06 文档）<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>主用教材版本<\/td>\n<td>待基线确立<\/td>\n<td>出版社页面<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：基线 <code>reports/2026-11-language-japanese.md<\/code>（v1.0 首期固定）；月度核验不重写报告，仅更新登记册「观察项与触发器状态」；季度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；事件触发插刷 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>（追加件）。<\/p>\n<p><strong>触发器清单<\/strong>（摘自 business-config 第七节）：\n- JLPT / JFT-Basic 报名日程或费用变更（08-visa-immigration 触发器联动）→ 01 / 05\n- JFT-Basic 考场在中国大陆开设 / 调整 → 01 / 05\n- 新版教材 / 题库发布 → 05\n- 个人进度里程碑（模考 / 实考完成）→ 06<\/p>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">状态项<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">更新于<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>唯一观察项<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>首要触发器<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>触发器结论<\/td>\n<td>首期为空<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s8\">八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：\n- <strong>A 官方一手<\/strong>：JLPT 官方日程与报名入口、JFT-Basic 官方信息（经 prometric-jp.com / jpf.go.jp）、01-ssw-driver 登记册 #3 锚定值。\n- <strong>B 权威转引<\/strong>：国際交流基金、日本語能力試験公式資料。\n- <strong>C 平台抽样 / 估算<\/strong>：手册学习量估算、自测线、周节奏模板、预算参考（均为规划经验值，<strong>待核验<\/strong>）；学习门户与社区经验标注为经验，不作事实。<\/p>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>考试体系<\/td>\n<td>JLPT（N 级制）≠ JFT-Basic（A 级制）<\/td>\n<\/tr>\n<tr>\n<td>达标线<\/td>\n<td>特定技能 1 号卡车路径（N4 / JFT-Basic A2）≠ 出租车 / 巴士路径（N3）≠ 管理岗 / 2 号（N2）<\/td>\n<\/tr>\n<tr>\n<td>考点<\/td>\n<td>中国大陆（JLPT 有考点、无 JFT-Basic 考点）≠ 日本国内（两者均有）<\/td>\n<\/tr>\n<tr>\n<td>学习方法<\/td>\n<td>官方公式資料 ≠ 市售模考 ≠ 社区经验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：#3 当前学习进度（待基线确立）、#4 主用教材版本（待基线确立）。<\/p>\n<h2 id=\"s9\">九、免责声明<\/h2>\n<p><strong>本报告仅供参考，不构成投资建议或决策依据。<\/strong><\/p>\n<h2 id=\"s10\">十、参考来源清单<\/h2>\n<ol>\n<li>JLPT 官方（教育部教育考试院报名站），https://jlpt.neea.edu.cn，2026。<\/li>\n<li>JLPT 全球官网，https://www.jlpt.jp，2026。<\/li>\n<li>JLPT 官方问题集，https://www.jlpt.jp/samples/sampleindex.html，2026。<\/li>\n<li>JFT-Basic 官方样题，https://www.jft-basic.jp/sample/，2026。<\/li>\n<li>国際交流基金 いろどり，https://www.irodori.jpf.go.jp，2026。<\/li>\n<li>JF 日本语教育标准，https://jfstandard.jpf.go.jp，2026。<\/li>\n<li>特定技能官方中文站，https://www.ssw.go.jp/cn/，2026。<\/li>\n<li>01-ssw-driver 指标登记册 #3（JLPT / JFT-Basic 日程、费用、考位单一事实源），只读引用。<\/li>\n<li>08-visa-immigration 报告（考试与日语要求 / 特定技能制度概览），只读引用。<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本日语学习知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本日语学习知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11 td>M3<\/td>\n<td><strong>JLPT N2<\/strong><\/td>\n<td>管理岗（阶段 3）、特定技能 2 号、会议/报告/邮件<\/td>\n<td>2028 年 12 月～2029 年 7 月<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_18\">二、关键结论：考试怎么选<\/h4>\n<p><strong>中国大陆目前没有 JFT-Basic 考点<\/strong>（截至 2026-08 核实，JFT-Basic 开考国为菲律宾、越南、泰国、印尼、尼泊尔、蒙古等，不含中国大陆），也没有技能评价试验考点。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">情形<\/th>\n<th style=\"width:50%\">策略<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在中国大陆备考<\/td>\n<td><strong>主攻 JLPT N4<\/strong>（每年 7 月/12 月两次，国内教育部考试院组织）<\/td>\n<\/tr>\n<tr>\n<td>已在日本<\/td>\n<td><strong>改考 JFT-Basic<\/strong>（Prometric CBT，随约随考，60 分钟，出分快）<\/td>\n<\/tr>\n<tr>\n<td>可赴东南亚/港澳行程顺路<\/td>\n<td>可顺带考 JFT-Basic，但不必为它专门出境<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>JFT-Basic 评分 10–250：145–174 = A1，175–199 = A2.1，<strong>200–250 = A2（特定技能达标线）<\/strong><\/li>\n<li>JFT-Basic 与 JLPT N4 在特定技能制度中同等有效，二选一即可<\/li>\n<\/ul>\n<h4 id=\"jlpt\">三、JLPT 日程与报名（中国大陆）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">场次<\/th>\n<th style=\"width:25%\">考试日<\/th>\n<th style=\"width:25%\">报名窗口<\/th>\n<th style=\"width:25%\">对本计划<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2026 年 12 月 6 日<\/td>\n<td>已过报名（8 月底截止）<\/td>\n<td>无法参加<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>2027 年 7 月（第一个周日）<\/strong><\/td>\n<td>约 2027 年 3 月中下旬<\/td>\n<td><strong>M1 目标场次，从现在起约 8 个月备考期<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2027 年 12 月（第一个周日）<\/td>\n<td>约 2027 年 8 月底–9 月初<\/td>\n<td>M2 备选<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2028 年 7 月 / 12 月<\/td>\n<td>同规律<\/td>\n<td>M3 备选<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>报名网址：https://jlpt.neea.edu.cn 或 https://jlpt.neea.cn（教育部教育考试院）[Source: https://jlpt.neea.edu.cn, 2026]<\/li>\n<li>报名先注册个人信息，抢考位（大城市考位紧张，放报当天即报）<\/li>\n<li>N3/N4/N5 在<strong>下午<\/strong>举行；N1/N2 在上午<\/li>\n<\/ul>\n<h4 id=\"_19\">四、各级别考试概要<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">级别<\/th>\n<th style=\"width:25%\">构成与时长<\/th>\n<th style=\"width:25%\">满分/合格<\/th>\n<th style=\"width:25%\">分项底线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>N4<\/td>\n<td>文字语汇 25min + 文法读解 55min + 听解 35min<\/td>\n<td>180/90<\/td>\n<td>言语知识 38、听解 19<\/td>\n<\/tr>\n<tr>\n<td>N3<\/td>\n<td>文字语汇 30min + 文法读解 70min + 听解 40min<\/td>\n<td>180/95<\/td>\n<td>19/19/19<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>言语知识读解 105min + 听解 50min<\/td>\n<td>180/90<\/td>\n<td>19/19/19<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>教训<\/strong>：JLPT 有分项底线，偏科（尤其听解）会挂科——每周必须固定听力时间。<\/p>\n<h4 id=\"_20\">五、学习量估算（零基础起）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">目标<\/th>\n<th style=\"width:33%\">累计学习小时<\/th>\n<th style=\"width:34%\">本计划节奏<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>N4<\/td>\n<td>300–450h<\/td>\n<td>工作日 1.5–2h + 周末 3h ≈ 12–16h/周 × 8 个月 ≈ 450h<\/td>\n<\/tr>\n<tr>\n<td>N3（在 N4 基础上）<\/td>\n<td>+150–250h<\/td>\n<td>4–6 个月<\/td>\n<\/tr>\n<tr>\n<td>N2（在 N3 基础上）<\/td>\n<td>+250–350h<\/td>\n<td>6–9 个月（入职后需挤出时间）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_21\">六、总时间线<\/h4>\n<pre><code class=\"language-text\">2026-11          2027-03      2027-07         2027-12/2028-07     2028-12~/2029\n零基础启动  →  报名N4  →  M1: JLPT N4  →  M2: JLPT N3      →  M3: JLPT N2\n（五十音+基础）            （入境材料齐备）  （入境后初期）        （管理岗准备期）\n<\/code><\/pre>\n<p>M1 完成后即满足特定技能卡车路径的日语要件，可与技能试验并行推进（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#03-考试与日语要求\">08-签证与在留 · 03<\/a>）。<\/p>\n<h4 id=\"_22\">七、分计划文件<\/h4>\n<ul>\n<li><a href=\"#02-n4备考计划\">02-N4备考计划<\/a> —— M1 详细执行<\/li>\n<li><a href=\"#03-n3备考计划\">03-N3备考计划<\/a> —— M2<\/li>\n<li><a href=\"#04-n2备考计划\">04-N2备考计划<\/a> —— M3<\/li>\n<li><a href=\"#05-资源与工具清单\">05-资源与工具清单<\/a><\/li>\n<li><a href=\"#06-学习进度跟踪\">06-学习进度跟踪<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"02-n4\">02 N4备考计划<\/h3>\n<blockquote>\n<p>起点：零基础（2026-11）。终点：2027-07 JLPT N4 合格（180 分制，总分 90 + 分项底线）。周期约 32–34 周。<\/p>\n<\/blockquote>\n<h4 id=\"_23\">一、目标拆解<\/h4>\n<p>N4 考察约 300 汉字、1500 词汇、基本句型（て形/た形/普通形/可能/被动使役等）。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">模块<\/th>\n<th style=\"width:33%\">考试占比感受<\/th>\n<th style=\"width:34%\">训练权重<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>文字·语汇<\/td>\n<td>25min<\/td>\n<td>每日 20–30min（碎片时间）<\/td>\n<\/tr>\n<tr>\n<td>文法·读解<\/td>\n<td>55min<\/td>\n<td>每周 3 次 × 40min<\/td>\n<\/tr>\n<tr>\n<td>听解<\/td>\n<td>35min（有分项底线 19/60）<\/td>\n<td><strong>每天 20–30min 不可断<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"33\">二、四阶段计划（约 33 周）<\/h4>\n<h5 id=\"a-16-60h\">阶段 A：入门（第 1–6 周，~60h）<\/h5>\n<ul>\n<li>五十音（平/片假名）听写滚瓜烂熟，1 周内完成<\/li>\n<li>教材：<strong>《大家的日语》初级 Ⅰ<\/strong>（1–10 课）或《新标日》初级上（1–12 课）<\/li>\n<li>目标：基本寒暄、自我介绍、名词句/形容词句、ます形<\/li>\n<li>汉字：每天 5 个（读法+写法），用 Anki 建牌组<\/li>\n<li>听力：每天 15min 跟读课文音频（影子跟读）<\/li>\n<\/ul>\n<h5 id=\"bn4-718-160h\">阶段 B：N4 语法主体（第 7–18 周，~160h）<\/h5>\n<ul>\n<li>教材完成：大家的日语初级 Ⅱ（至 50 课）或新标日初级下<\/li>\n<li>语法书：<strong>TRY! N4<\/strong> 或《新完全掌握》N4 语法（二选一为主线）<\/li>\n<li>词汇：每周 100 词节奏（1500 词目标），Anki 复习不欠账<\/li>\n<li>动词变形专项：て形/た形/ない形/可能/被动/使役——N4 命题核心<\/li>\n<li>听力：教材音频 + 《いろどり》（JF 免费教材，正是面向在日劳动者的场景日语）<\/li>\n<li><strong>第 12 周做一次全真模考<\/strong>，暴露弱项<\/li>\n<\/ul>\n<h5 id=\"c-1928-130h\">阶段 C：应试强化（第 19–28 周，~130h）<\/h5>\n<ul>\n<li>真题/模考：<strong>JLPT 官方问题集（公式問題集）<\/strong> + 近年 N4 真题 3–5 套<\/li>\n<li>错题本：按「文字语汇/文法/读解/听解」四类归因<\/li>\n<li>读解速度训练：限时 55min 内完成文法+读解<\/li>\n<li>听力专项：JLPT N4 听解题型（课题理解/要点理解/发话表现/即时应答）逐题型练<\/li>\n<li>第 28 周：全真模考 ≥ 110 分（留出考场波动余量）<\/li>\n<\/ul>\n<h5 id=\"d-2933\">阶段 D：冲刺（第 29–33 周）<\/h5>\n<ul>\n<li>每周 2 套限时模考 + 错题复盘<\/li>\n<li>高频语法/词汇二刷<\/li>\n<li>考前 1 周：调整生物钟（N4 下午考），不做新题<\/li>\n<\/ul>\n<h4 id=\"_24\">三、每周节奏模板<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">日<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">时长<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>周一–五<\/td>\n<td>词汇 Anki + 课文推进 + 听力<\/td>\n<td>1.5–2h/天<\/td>\n<\/tr>\n<tr>\n<td>周六<\/td>\n<td>语法专项 + 读解<\/td>\n<td>3h<\/td>\n<\/tr>\n<tr>\n<td>周日<\/td>\n<td>复习 + 听力 + 当周总结<\/td>\n<td>3h<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_25\">四、合格判定自测线<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时点<\/th>\n<th style=\"width:50%\">模考目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 12 周<\/td>\n<td>≥ 70 分<\/td>\n<\/tr>\n<tr>\n<td>第 20 周<\/td>\n<td>≥ 90 分<\/td>\n<\/tr>\n<tr>\n<td>第 28 周<\/td>\n<td>≥ 110 分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>连续两次模考 ≥ 100 分 → 稳；若听力单项 &lt; 32/60 → 立即加听力权重。<\/p>\n<h4 id=\"jft-basic\">五、JFT-Basic 备用方案<\/h4>\n<ul>\n<li>JFT-Basic 为 CBT：文字语汇/会话表现/听解/读解四节，约 50–60 题，60 分钟，无分节限时<\/li>\n<li>判定 200/250 = A2 即达标（比 N4 更重\"会话与场景\"）<\/li>\n<li>若 2027-07 N4 失利：可在赴日后再考 JFT-Basic 兜底（随约随考），期间用《いろどり》和官方样题（https://www.jft-basic.jp/sample/）练习<\/li>\n<li>两条线教材高度重叠，备考 N4 本身就是 JFT-Basic 的 80% 准备<\/li>\n<\/ul>\n<h4 id=\"_26\">六、并行提醒<\/h4>\n<ul>\n<li>报名：2027 年 3 月中下旬（→ <a href=\"#01-总体学习路线与考试选择\">01-总体学习路线与考试选择<\/a> 第三节）<\/li>\n<li>合格后：证书在雇主申请受入计划书认定时提交，原件妥善保存<\/li>\n<li>下一关：<a href=\"#03-n3备考计划\">03-N3备考计划<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"03-n3\">03 N3备考计划<\/h3>\n<blockquote>\n<p>前提：M1（N4 或 JFT-Basic）已达成。N3 合格线 95/180，分项底线 19×3。<\/p>\n<\/blockquote>\n<h4 id=\"n3\">一、为什么 N3 是职业关键级<\/h4>\n<ul>\n<li>出租车/巴士路径的硬门槛（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#02-特定技能1号-自动车运送业\">08-签证与在留 · 02<\/a>）<\/li>\n<li>入境后现场沟通、安全指示、客户对接的实际工作语言量<\/li>\n<li>N3 → N2 的桥梁：N3 内容与职场日语重叠度最高，性价比最高<\/li>\n<\/ul>\n<h4 id=\"_27\">二、时间方案<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">方案<\/th>\n<th style=\"width:25%\">考试<\/th>\n<th style=\"width:25%\">周期<\/th>\n<th style=\"width:25%\">适用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>激进<\/td>\n<td>2027-12-05<\/td>\n<td>N4 后 5 个月<\/td>\n<td>尚未入境、全职备考时间充裕<\/td>\n<\/tr>\n<tr>\n<td><strong>稳妥（推荐）<\/strong><\/td>\n<td>2028-07（第一个周日）<\/td>\n<td>N4 后 12 个月<\/td>\n<td>已入境工作，日均只能挤 1h<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>入境前后生活巨变，推荐稳妥方案：把 N3 目标放在入境后第一个 7 月考季。<\/p>\n<h4 id=\"_28\">三、内容拆解<\/h4>\n<ul>\n<li>词汇：N4 的 1500 → 累计 3750 词<\/li>\n<li>汉字：累计约 650 字<\/li>\n<li>语法：授受表现、敬语体系（尊敬/谦让/丁宁）、条件形、传闻样态等<\/li>\n<li>读解：中长文（说明文、 avis 文章），速度是关键<\/li>\n<li>听解：段落较长，需要边听边记要点<\/li>\n<\/ul>\n<h4 id=\"48\">四、五阶段计划（以稳妥 48 周为例）<\/h4>\n<ol>\n<li><strong>衔接期（1–8 周）<\/strong>：新标日中级上/大家的日语进阶 Ⅰ 前半；把 N4 语法普通形体系复习成\"骨架图\"<\/li>\n<li><strong>主体期（9–24 周）<\/strong>：TRY! N3 或《新完全掌握》N3 语法+词汇主线；敬语专项 2 周突破<\/li>\n<li><strong>读解期（25–34 周）<\/strong>：《新完全掌握》N3 读解；每天 1 篇限时<\/li>\n<li><strong>听解期（35–42 周）<\/strong>：真题听解 + NHK Easy News 精听；练\"边听边记\"<\/li>\n<li><strong>冲刺期（43–48 周）<\/strong>：官方问题集 3 套限时模考，目标 ≥ 115 分<\/li>\n<\/ol>\n<h4 id=\"2\">五、职场日语同步包（与阶段 2 对齐）<\/h4>\n<p>考 N3 的同时积累现场高频表达，直接服务于工作与 2 号移行：<\/p>\n<ul>\n<li>点呼/安全确认用语：「出発前点呼よろしくお願いします」「異常ありません」<\/li>\n<li>配送/仓库用语：「納品書」「伝票」「積み込み」「仕分け」<\/li>\n<li>请假/报联相（報告・連絡・相談）句型<\/li>\n<li>敬语最小集：いらっしゃる/申し上げる/おります 三组先练熟<\/li>\n<\/ul>\n<h4 id=\"_29\">六、自测线与失败预案<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时点<\/th>\n<th style=\"width:50%\">模考目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 16 周<\/td>\n<td>≥ 80<\/td>\n<\/tr>\n<tr>\n<td>第 32 周<\/td>\n<td>≥ 100<\/td>\n<\/tr>\n<tr>\n<td>第 44 周<\/td>\n<td>≥ 115<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>若稳妥方案 7 月未过：12 月再战（同一计划后半段循环），不影响 1 号在留更新——N3 不是卡车路径的更新条件，只是职业升级条件<\/li>\n<li>若已决定转出租车/巴士：N3 变成硬门槛，必须达标后再启动转岗<\/li>\n<\/ul>\n<h4 id=\"_30\">七、下一关<\/h4>\n<p><a href=\"#04-n2备考计划\">04-N2备考计划<\/a><\/p>\n<hr />\n<h3 id=\"04-n2\">04 N2备考计划<\/h3>\n<blockquote>\n<p>前提：N3 已达成。N2 合格线 90/180，分项 19×3。定位：阶段 3（管理岗过渡）的语言通行证。<\/p>\n<\/blockquote>\n<h4 id=\"n2\">一、N2 的职业意义<\/h4>\n<ul>\n<li>管理岗/团队长的门槛级：会议发言、书面报告（日報/月報）、邮件、与客户和警方·行政打交道<\/li>\n<li>特定技能 2 号审查中体现沟通能力的事实标准<\/li>\n<li>读物流单据、运行管理规程、劳务法规原文的能力基础<\/li>\n<li>为阶段 4（物流数字化岗位）读文档、写报告打底<\/li>\n<\/ul>\n<h4 id=\"_31\">二、时间方案<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">方案<\/th>\n<th style=\"width:33%\">考试<\/th>\n<th style=\"width:34%\">适用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>激进<\/td>\n<td>2028-12（第一个周日）<\/td>\n<td>N3 达成后 12 个月内、工作强度可控<\/td>\n<\/tr>\n<tr>\n<td>推荐<\/td>\n<td>2029-07（第一个周日）<\/td>\n<td>司机工作疲劳度高，留 18 个月<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>N2 备考期大概率与全职司机工作重叠（驾驶疲劳、早出晚归），<strong>按\"日均 1h + 周末 4h\"设计<\/strong>，宁可拉长战线不硬冲。<\/p>\n<h4 id=\"_32\">三、内容拆解<\/h4>\n<ul>\n<li>词汇：累计 6000 词；惯用句、拟声拟态词开始进入<\/li>\n<li>汉字：累计约 1000–1050 字（N2 汉字量接近中文母语者的舒适区，<strong>中文母语者最大红利区<\/strong>）<\/li>\n<li>语法：N3 语法精细化 + 文言残留（〜ざるを得ない、〜かねる、〜ものの）<\/li>\n<li>读解：长文（社说、评论）+ 信息检索题；<strong>得分主战场<\/strong><\/li>\n<li>听解：长对话·独白，一次放完不重播<\/li>\n<\/ul>\n<h4 id=\"18-78\">四、计划骨架（以 18 个月 / 78 周为例）<\/h4>\n<ol>\n<li><strong>基础期（1–20 周）<\/strong>：《新完全掌握》N2 词汇+文法主线；每天 Anki 30 词新牌 + 复习<\/li>\n<li><strong>读解期（21–36 周）<\/strong>：《新完全掌握》N2 读解；每天 1 长文限时；泛读 NHK News Web Easy → 普通新闻过渡<\/li>\n<li><strong>听解期（37–52 周）<\/strong>：真题 + ニュース解説番组精听；利用通勤时间（司机职业优势：车载音频）<\/li>\n<li><strong>冲刺期（53–78 周）<\/strong>：官方问题集 + 市售模考 6–8 套，目标稳定 ≥ 115<\/li>\n<\/ol>\n<h4 id=\"3\">五、管理岗日语同步包（与阶段 3 对齐）<\/h4>\n<ul>\n<li>日報・月報定型文：「本日の運行状況は以下の通りです」「特記事項として〜」<\/li>\n<li>会議表現：「〜についてご報告いたします」「ご検討いただけますでしょうか」<\/li>\n<li>现场指示与确认：指差呼称、指示复述（「〜という理解でよろしいでしょうか」）<\/li>\n<li>后续可叠加：BJT 商务日语（非必需，作为 N2 后的能力标尺）<\/li>\n<\/ul>\n<h4 id=\"_33\">六、自测线与风险<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时点<\/th>\n<th style=\"width:50%\">模考目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 20 周<\/td>\n<td>≥ 85<\/td>\n<\/tr>\n<tr>\n<td>第 40 周<\/td>\n<td>≥ 100<\/td>\n<\/tr>\n<tr>\n<td>第 60 周<\/td>\n<td>≥ 115<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>风险与对策：<\/p>\n<ul>\n<li><strong>工作疲劳导致断档<\/strong>：设\"最低维持量\"（每天 20min Anki + 15min 听力），断档不停摆<\/li>\n<li><strong>读解超时<\/strong>：N2 时间压力大于 N3/N4，从第 21 周起全部限时训练<\/li>\n<li><strong>中文字面陷阱<\/strong>：同形异义词（手紙、勉強、新聞…）专项整理<\/li>\n<\/ul>\n<h4 id=\"n2_1\">七、N2 之后<\/h4>\n<ul>\n<li>面向阶段 3–4：商务日语（邮件/敬语体系完整化）、物流专业术语表（→ <a href=\"../../03-career-management/reports/\">../../03-career-management<\/a>、<a href=\"../../04-industry-logistics/reports/\">../../04-industry-logistics<\/a>）<\/li>\n<li>面向永住/长期定居：社会生活日语（税金、年金、保险用语，→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">08-签证与在留 · 07<\/a>）<\/li>\n<\/ul>\n<hr />\n<h3 id=\"05\">05 资源与工具清单<\/h3>\n<blockquote>\n<p>精选而非罗列。主线教材二选一后不要中途换。<\/p>\n<\/blockquote>\n<h4 id=\"_34\">一、主线教材（三选一体系）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">方案 A（推荐·重口语）<\/th>\n<th style=\"width:34%\">方案 B（重语法体系）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>N4<\/td>\n<td>《大家的日语》初级 Ⅰ+Ⅱ<\/td>\n<td>《新标日》初级上下<\/td>\n<\/tr>\n<tr>\n<td>N3<\/td>\n<td>《大家的日语》进阶<\/td>\n<td>《新标日》中级上下<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>《新完全掌握》N2 系列（词汇/文法/读解/听解）<\/td>\n<td>同左<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_35\">二、官方免费资源（优先级最高）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">资源<\/th>\n<th style=\"width:33%\">用途<\/th>\n<th style=\"width:34%\">链接<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>いろどり（Irodori）<\/strong><\/td>\n<td>JF 免费·面向在日劳动者的生活职场日语，含中文版，特定技能人群指定感最强<\/td>\n<td>https://www.irodori.jpf.go.jp<\/td>\n<\/tr>\n<tr>\n<td>JLPT 官方问题集<\/td>\n<td>唯一权威模考题<\/td>\n<td>https://www.jlpt.jp/samples/sampleindex.html<\/td>\n<\/tr>\n<tr>\n<td>JLPT 题型说明<\/td>\n<td>熟悉题型<\/td>\n<td>https://www.jlpt.jp/guideline/testsections.html<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic 官方样题<\/td>\n<td>CBT 界面适应<\/td>\n<td>https://www.jft-basic.jp/sample/<\/td>\n<\/tr>\n<tr>\n<td>JF 日本语教育标准<\/td>\n<td>A1–C1 能力描述，校准学习目标<\/td>\n<td>https://jfstandard.jpf.go.jp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_36\">三、应试书（每级一套即可）<\/h4>\n<ul>\n<li>N4：TRY! N4 或 新完全掌握 N4 文法 + 官方问题集<\/li>\n<li>N3：新完全掌握 N3（文法+读解）+ 官方问题集<\/li>\n<li>N2：新完全掌握 N2 全套 + 官方问题集 + 市售模拟 2–3 本<\/li>\n<\/ul>\n<h4 id=\"app\">四、App 与工具<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">工具<\/th>\n<th style=\"width:50%\">用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anki（+ 中文语音牌组）<\/td>\n<td>词汇/汉字 SRS 主力，所有级别共用牌组体系<\/td>\n<\/tr>\n<tr>\n<td>MOJi辞書 / 大辞泉<\/td>\n<td>查词、例句<\/td>\n<\/tr>\n<tr>\n<td>NHK News Web Easy<\/td>\n<td>N3 期起泛读<\/td>\n<\/tr>\n<tr>\n<td>Podcast：「Nihongo con Teppei」「 incompetent 」<\/td>\n<td>N3 起碎片听力<\/td>\n<\/tr>\n<tr>\n<td>YouTube：日本語の森（N4–N2 全覆盖）<\/td>\n<td>语法视频讲解，免费<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_37\">五、应试信息入口<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">事项<\/th>\n<th style=\"width:50%\">入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JLPT 国内报名<\/td>\n<td>https://jlpt.neea.edu.cn / https://jlpt.neea.cn<\/td>\n<\/tr>\n<tr>\n<td>JLPT 全球官网<\/td>\n<td>https://www.jlpt.jp<\/td>\n<\/tr>\n<tr>\n<td>JFT-Basic（赴日后）<\/td>\n<td>https://www.jft-basic.jp（报名经 Prometric）<\/td>\n<\/tr>\n<tr>\n<td>特定技能官方中文站<\/td>\n<td>https://www.ssw.go.jp/cn/<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_38\">六、采购建议<\/h4>\n<ul>\n<li>先买：主线教材 1 套 + TRY!/新完全掌握对应级 1 本 + Anki（免费）<\/li>\n<li>不买：真题盗版合集（官方问题集足够）、多套重复教材<\/li>\n<li>预算参考：每级 300–600 元人民币<\/li>\n<\/ul>\n<hr />\n<h3 id=\"06\">06 学习进度跟踪<\/h3>\n<blockquote>\n<p>用法：每周末更新一次。原则——记录实际小时数与模考分，不写感想。<\/p>\n<\/blockquote>\n<h4 id=\"_39\">一、里程碑看板<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">里程碑<\/th>\n<th style=\"width:25%\">目标<\/th>\n<th style=\"width:25%\">状态<\/th>\n<th style=\"width:25%\">完成日<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M0<\/td>\n<td>五十音全熟<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>M1<\/td>\n<td>JLPT N4 合格（2027-07）<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>M1.5<\/td>\n<td>特定技能技能试验合格<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>M2<\/td>\n<td>JLPT N3 合格（2027-12 / 2028-07）<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>M3<\/td>\n<td>JLPT N2 合格（2028-12 / 2029-07）<\/td>\n<td>☐<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_40\">二、周记录表（滚动追加）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:14%\">周次<\/th>\n<th style=\"width:14%\">日期范围<\/th>\n<th style=\"width:14%\">实际学时<\/th>\n<th style=\"width:14%\">主线进度（课/章）<\/th>\n<th style=\"width:14%\">新词累计<\/th>\n<th style=\"width:14%\">听力时长<\/th>\n<th style=\"width:16%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>W01<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>W02<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>规则：\n- 实际学时 &lt; 计划 80% → 下周不推进新课，先补\n- 听力周时长 &lt; 2h → 视为偏科预警<\/p>\n<h4 id=\"_41\">三、模考记录<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:12%\">日期<\/th>\n<th style=\"width:12%\">级别<\/th>\n<th style=\"width:12%\">卷源<\/th>\n<th style=\"width:12%\">总分<\/th>\n<th style=\"width:12%\">言语知识<\/th>\n<th style=\"width:12%\">读解<\/th>\n<th style=\"width:12%\">听解<\/th>\n<th style=\"width:16%\">弱项归因<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_42\">四、月度复盘问题（每月最后一个周日回答）<\/h4>\n<ol>\n<li>本月学时是否达标？缺口原因（加班/惰性/材料不合适）？<\/li>\n<li>弱项排序变化？下月权重怎么调？<\/li>\n<li>距离下一个 JLPT 报名窗口还有几天？考位计划？<\/li>\n<li>与职业路线（签证文件、求职）是否有冲突需要重排？<\/li>\n<\/ol>\n<h4 id=\"_43\">五、报名与证件提醒<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">事项<\/th>\n<th style=\"width:33%\">时间点<\/th>\n<th style=\"width:34%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JLPT N4 报名（2027-03 中下旬）<\/td>\n<td>报名开放当天<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>准考证打印<\/td>\n<td>考前约 2 周<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>合格证书原件归档<\/td>\n<td>成绩发布后<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>N3 报名<\/td>\n<td>2027-08 底 / 2028-03<\/td>\n<td>☐<\/td>\n<\/tr>\n<tr>\n<td>N2 报名<\/td>\n<td>2028-08 底 / 2029-03<\/td>\n<td>☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 391, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "11-language-japanese/reports/2026-11-language-japanese.html"}}}, "culture-life": {"name": "文化与生活", "dir": "12-culture-life", "months": {"2026-11": {"title": "文化与生活 · 首份分析报告", "body": "\n<h1 id=\"_1\">文化与生活 · 首份分析报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（首份分析）　<strong>数据基准日<\/strong>：2026-11-13\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向在日本从事货运司机工作、需要职场文化适应与日常生活落地的读者，兼具生活指南与心理适应视角。\n<strong>来源规则<\/strong>：① 厚生労働省（労働に関する制度）、総務省 / 自治体（生活制度、ゴミ分別等）＞ ② JILPT / 公共機関的职场调查 ＞ ③ 地域自治体多语言生活指南 ＞ ④ 在日生活门户与社区（经验类，标注个案）；每条数据必须附可直接访问的 URL，并记录「机构 · 统计周期 · 核验状态」。<\/p>\n<\/blockquote>\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、主题核心概述<\/a>\n<a href=\"#s2\">二、关键维度拆解<\/a>\n<a href=\"#s3\">三、当前现状梳理<\/a>\n<a href=\"#s4\">四、初步结论<\/a>\n<a href=\"#s5\">五、后续观察方向<\/a>\n<a href=\"#s6\">六、核心指标速览<\/a>\n<a href=\"#s7\">七、监测机制与触发器<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、免责声明<\/a>\n<a href=\"#s10\">十、参考来源清单<\/a>\n<a href=\"#s11\">日本文化与生活知识手册<\/a>\n<\/nav>\n<h2 id=\"s1\">一、主题核心概述<\/h2>\n<p><strong>主题定义与监测范围<\/strong>（摘自 business-config 3.1）：<\/p>\n<ul>\n<li><strong>含<\/strong>：职场文化与人际（报联相 / 挨拶 / 5S、上下关系、评价体系、跨文化策略）；生活指南与适应（落地手续清单、生活基础设施、安全习惯、心理健康、防灾与应急）；医疗与健康（健保体系、就医全流程、体检、劳灾保险、心理资源、就医日语）；住房与安家（租房流程与初期费用、外国人入住、公营住宅、签约时序、退去清算）；社会融入与社群（外国人支援体系、多文化共生施策、同乡会 / 志愿组织）。<\/li>\n<li><strong>不含<\/strong>：维权流程与法规条文（→ 09-politics-law）；地域选择与生活成本（→ 13-regional-info / 07-economy-finance）；税费社保与年金缴纳申报（→ 07-economy-finance）；现场安全制度与事故处理（→ 02-career-driver）；永住年收财务与证据链（→ 07-economy-finance）；劳动文化相关制度（→ 09-politics-law）；在留手续与在留制度（→ 08-visa-immigration）。<\/li>\n<\/ul>\n<p><strong>受众与用途<\/strong>：为在日货运司机提供职场文化适应、生活制度落地与防灾医疗的参照基线，用途为落地前通读与季节性复核。<\/p>\n<p><strong>核心监测问题<\/strong>：\n1. 报联相 / 挨拶 / 5S 等司机现场文化规则如何落地？\n2. 落地 2 周内的行政手续与生活基础设施如何打通？\n3. 健保与国保两条轨道的加入方式、自付比例与高额疗养费上限现状如何？\n4. 租房流程、初期费用结构与外国人入住障碍如何？\n5. 防灾预警体系与多语言灾害情报渠道有哪些？<\/p>\n<p><strong>跨主题分工<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">对象<\/th>\n<th style=\"width:50%\">归属主题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>维权流程与法规条文<\/td>\n<td>09-politics-law<\/td>\n<\/tr>\n<tr>\n<td>地域选择与生活成本<\/td>\n<td>13-regional-info / 07-economy-finance<\/td>\n<\/tr>\n<tr>\n<td>税费社保与年金缴纳申报<\/td>\n<td>07-economy-finance<\/td>\n<\/tr>\n<tr>\n<td>现场安全制度与事故处理<\/td>\n<td>02-career-driver<\/td>\n<\/tr>\n<tr>\n<td>在留手续与在留制度<\/td>\n<td>08-visa-immigration<\/td>\n<\/tr>\n<tr>\n<td>日语学习计划<\/td>\n<td>11-language-japanese<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s2\">二、关键维度拆解<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">定义<\/th>\n<th style=\"width:20%\">对应指标（登记册 #）<\/th>\n<th style=\"width:20%\">优先来源<\/th>\n<th style=\"width:20%\">监测频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>职场文化与人际<\/td>\n<td>报联相 / 挨拶 / 5S、上下关系与评价体系<\/td>\n<td>#2<\/td>\n<td>JILPT / 厚労省<\/td>\n<td>制度类近 12 个月内优先<\/td>\n<\/tr>\n<tr>\n<td>生活指南与适应<\/td>\n<td>落地手续、生活基础设施、防灾应急<\/td>\n<td>#1、#3、#6<\/td>\n<td>自治体 / 入管庁 / 気象庁 / 内閣府防災<\/td>\n<td>季节性（6 月 / 11 月）+ 逐次运行<\/td>\n<\/tr>\n<tr>\n<td>医疗与健康<\/td>\n<td>健保 / 国保、就医流程、体检与劳灾<\/td>\n<td>#4<\/td>\n<td>厚労省 / 健保组合<\/td>\n<td>逐次运行（费率与上限调整时）<\/td>\n<\/tr>\n<tr>\n<td>住房与安家<\/td>\n<td>租房流程、初期费用、公营住宅与退去<\/td>\n<td>#5、#7<\/td>\n<td>国交省 / UR 都市機構<\/td>\n<td>逐次运行（行情与制度参数变化时）<\/td>\n<\/tr>\n<tr>\n<td>社会融入与社群<\/td>\n<td>支援体系、多文化共生施策、社群参与<\/td>\n<td>—（首期为空）<\/td>\n<td>総務省 / CLAIR<\/td>\n<td>逐次运行<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>维度间关系<\/strong>：职场文化与人际是软技能底座，决定现场适应质量；生活指南与适应是落地基础设施，与住房与安家构成「住」的连续链条；医疗与健康承接制度类保障，与 07-economy-finance 的税社年金边界相接；社会融入与社群服务阶段 5 定居质量。文化描述属一般化观察，与制度类事实分层标注，不得混用。<\/p>\n<h2 id=\"s3\">三、当前现状梳理<\/h2>\n<h3 id=\"31\">3.1 职场文化与人际<\/h3>\n<ul>\n<li>司机现场三大文化规则（手册）：报联相（報告・連絡・相談，事前 / 事中 / 事后都要出声）；挨拶文化（寒暄是信用基础）；5S（整理·整頓·清掃·清潔·躾，车辆 / 更衣室 / 传票整洁）。<\/li>\n<li>上下关系与沟通（手册）：敬语体系是职位语言；指示复述四步闭环（接到指示→复述→执行→完成报告）；饮み会参加 1–2 次即可；手土産 300–1000 円价位。<\/li>\n<li>评价体系（手册）：被认可 = 声を出す、守时守序、清洁感、前辈照顾后辈；被扣分 = 沉默独自处理、借口先行、现场杂乱、只顾自己。<\/li>\n<li>跨文化生存策略（手册）：把「不懂就问」包装成「確認させてください」；不参与是非话题；让语言成为岗位价值而非标签；遇排挤 / 歧视先书面记录并走 09 维权流程。<\/li>\n<li>登记册活值：#2 职场文化相关官方调查 <strong>待基线确立<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"32\">3.2 生活指南与适应<\/h3>\n<ul>\n<li>行政手续（落地 2 周内，手册）：在留卡地址登录（14 天内，市区役所）；健康保险·年金加入确认（同时）；My Number 卡申请（随时）；银行开户（第 1–2 周）；手机契约（第 2 周）；印章（第 1 周）。<\/li>\n<li>生活基础设施（手册）：公司寮优先起步；自租注意礼金 / 敷金 / 保证人（保证会社）制度；原付 / 自転车需在役所登记；医疗为健保 70% 报销、调剤药局处方制度。<\/li>\n<li>金钱与安全习惯（手册）：现金文化仍强，但 IC 卡+信用卡覆盖 95% 生活；特殊诈欺高发，自称役所 / 警察要账号 = 100% 诈骗。<\/li>\n<li>防灾与应急（手册，2026-11-12 核对）：非常用持ち出し袋；自宅备蓄 3 天起步（饮水每人每天 3L×3 天份）；家具固定（家具翻倒·落物占受伤原因 3–5 成）；滚动备蓄（ローリングストック）；安否联络（災害用伝言ダイヤル 171）。<\/li>\n<li>多语言灾害情报渠道（手册）：Safety tips（観光庁监修，15 语种推送）；NHK WORLD-JAPAN（24 小时英语）；JNTO Japan Visitor Hotline（050-3816-2787，英 / 中 / 韩 / 日 24h）；地域国際化協会相談窓口；自治体灾害支援体制。<\/li>\n<li>登记册活值：#1 在留相关生活手续流程变化 <strong>待基线确立<\/strong>；#3 个人生活适应记录 <strong>待记录<\/strong>；#6 防灾气象预警渠道 <strong>待复核<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"33\">3.3 医疗与健康<\/h3>\n<ul>\n<li>两条轨道（手册）：健康保险（职场健保 / 协会けんぽ，雇主办理、本人与公司折半负担）≠ 国民健康保险（非被用者、退职后、未随社保的家属，自行到市区役所办理）。<\/li>\n<li>窗口自付比例：3 割（未满 70 岁；70–74 岁 2 割；75 岁起转入后期高龄者医疗制度）——法律依据为健康保険法第 74 条。<\/li>\n<li>高额疗养费制度：单月自付超过按所得区分的上限部分可申请给付；官方示例（令和 8 年 8 月起新制度）70 岁未满·年收约 370–510 万円者，100 万円治疗自付约 9.3 万円封顶；令和 8·9 年 8 月各有见直し。<\/li>\n<li>就医全流程（手册）：选机构（先診療所后大病院）→带证件（マイナ保険証+在留卡）→就诊→取药（处方笺含交付日 4 日以内，依据保険医療機関及び保険医療養担当規則第 20 条・第 21 条）→付款（窗口 3 割，保留领收书）→夜间 / 假日拨救急安心センター（#7119）。<\/li>\n<li>\n<h1 id=\"7119-6-11-36-3647\">7119 为自治体设置，截至令和 6 年 11 月共 36 地域（覆盖 36/47 都道府县）。<\/h1>\n<\/li>\n<li>体检与预防（手册）：定期健康診断每年（労働安全衛生法，雇主实施）；特定健診 40–74 岁每年；がん検診按自治体案内；SAS 筛查为运输业行业实践（待复核）；ストレスチェック每年。<\/li>\n<li>劳灾保险：疗养给付范围内原则上本人 0 负担（待复核）；申请主体为雇主，雇主不配合可自行向劳动基准监督署申请。<\/li>\n<li>心理健康资源（手册）：公司内产业医 / 保健师 / 相談窓口；公司外自治体「こころの健康相談」、よりそいホットライン（0120-279-338，24h，含外语对应）。<\/li>\n<li>登记册活值：#4 医疗保险费率·自付上限·高额疗养费上限 <strong>待基线确立<\/strong>；待跟踪事项 2 项（高额疗养费见直し、マイナ保険証切换时点）。<\/li>\n<\/ul>\n<h3 id=\"34\">3.4 住房与安家<\/h3>\n<ul>\n<li>租房流程（手册）：物件探し→内见→申込（入居审查）→重要事項説明＋契约→交钥匙；宅建业者对借主负有书面重要事項説明义务。<\/li>\n<li>初期费用（手册）：前家賃（必付）；敷金（存管型押金，退去清算后余额返还）；礼金（付与房东不返还，无法定上限，<strong>推断<\/strong>；行情倍数待复核）；仲介手数料（法定上限：居住用借主侧 1 个月房租×1.1 含税以内，贷主侧×0.55）；保証会社料·火災保険等（惯例，待复核）。<\/li>\n<li>外国人入住障碍（手册）：审查标准不透明、语言、无国内保证人；国交省发布「外国人の民間賃貸住宅入居円滑化ガイドライン」（14 国语，含标准契约书·重要事項説明书范本）。<\/li>\n<li>UR 賃貸住宅（手册）：对外国籍开放；收入基准（2026-11 核实）——家賃 62,500 円未満→基准月收=家賃 4 倍；62,500–200,000 円→25 万円；200,000 円以上→40 万円；存款基准=家賃 100 倍可替代收入基准；收入不足可用家賃一時払い（1–10 年）制度。<\/li>\n<li>签约时序（手册）：在留卡（地址登录）→印章→银行口座→口座振替绑定房租+水电气；水道向所在地水道局 / 役所做使用开始申报；电气、燃气、光纤网络开通流程按一般惯例描述（<strong>推断<\/strong>待复核）。<\/li>\n<li>退去与敷金清算（手册）：契约书约定月数前通知（惯例 1 个月，<strong>推断<\/strong>）；敷金先抵扣未纳房租+修复费，余额返还；修复费仅限故意过失 / 通常使用范围外损耗。<\/li>\n<li>登记册活值：#5 房价 / 租金行情指针 <strong>待复核<\/strong>；#7 UR 賃貸住宅申込收入基准已确立（2026-11-12）。<\/li>\n<\/ul>\n<h3 id=\"35\">3.5 社会融入与社群<\/h3>\n<ul>\n<li>外国人支援体系（手册）：各都道府县·政令指定城市的地域国際化協会提供多语言生活咨询；CLAIR 维护全国多语言生活咨询窗口一览（13 语种宣传资料）。<\/li>\n<li>多文化共生施策（手册）：主管部门为総務省「地域の国際化の推進」；核心文件为「地域における多文化共生推進プラン」（令和 2 年改订）；策定状况逐年调查公开（令和 6 年 4 月时点为最新调查）。<\/li>\n<li>同乡会与志愿组织（手册）：最稳入口为地域国際化協会的活动（日本語教室、地域交流イベント、防灾训练）；CLAIR 运营「多文化 Opinion Exchange」等全国性平台；参与方式属生活经验，标注个案。<\/li>\n<li>登记册活值：无独立登记册项（首期为空）。<\/li>\n<\/ul>\n<p><strong>未取得 / 待核验项<\/strong>：\n- #1 在留相关生活手续流程变化——待基线确立。\n- #2 职场文化相关官方调查——待基线确立。\n- #3 个人生活适应记录——待记录。\n- #4 医疗保险费率·自付上限·高额疗养费上限——待基线确立。\n- #5 房价 / 租金行情指针——待复核。\n- #6 防灾气象预警渠道——待复核。\n- 手册待复核清单 8 项（大病院选定疗养加算、劳灾疗养给付表述、SAS 筛查出处、礼金 / 敷金行情倍数、UR 无礼金惯例、水电煤网开通流程、マイナ保険証切换时点、CLAIR 窗口语言与受付时间）。<\/p>\n<h2 id=\"s4\">四、初步结论<\/h2>\n<ol>\n<li><strong>制度框架类内容核验程度较高<\/strong>：窗口自付 3 割依据健康保険法第 74 条；处方笺 4 日以内依据保険医療機関及び保険医療養担当規則第 20 条・第 21 条；#7119 覆盖 36/47 都道府县均有明确来源。（事实）<\/li>\n<li><strong>登记册活值尚未闭合<\/strong>：7 项指标中 #1、#2、#4 待基线确立，#3 待记录，#5、#6 待复核，仅 #7（UR 收入基准）已确立。（事实）<\/li>\n<li><strong>UR 收入基准可作为住房维度的锚定活值<\/strong>：家賃 62,500 円未満→基准月收=家賃 4 倍等三档参数有 2026-11 核实来源，可用于公营住宅申请资格初判。（事实）<\/li>\n<li><strong>文化类内容属一般化观察<\/strong>：报联相 / 挨拶 / 5S、评价体系、饮み会等均标注为一般化观察，不作统计事实，习惯性做法不得表述为法定要求。（事实）<\/li>\n<li><strong>经验类内容已标注个案<\/strong>：社群参与方式、生活适应记录等属生活经验，不作事实引用。（事实）<\/li>\n<\/ol>\n<p><strong>风险与不确定性<\/strong>：\n- 手册待复核清单 8 项与登记册待跟踪事项 2 项尚未闭环，医疗与住房维度的活值缺口最大。\n- 水电煤网开通流程、礼金 / 敷金行情倍数、UR 无礼金惯例等为推断或待复核，实际以所在地自治体与业者为准。\n- 劳动文化相关制度归 09-politics-law，本主题只做衔接索引，不展开法规条文。<\/p>\n<h2 id=\"s5\">五、后续观察方向<\/h2>\n<p><strong>待答问题（分析层）<\/strong>：\n1. 医疗保险费率·自付上限·高额疗养费上限的首个基线值何时取得（令和 8·9 年 8 月见直し后）？\n2. マイナ保険証与纸保险证切换的确切时点是什么？\n3. 房价 / 租金行情指针与 UR 收入基准如何联动用于选址？\n4. 防灾气象预警体系与推送 App 渠道是否变化？\n5. 在留相关生活手续流程是否有变化（联动 08-visa-immigration）？<\/p>\n<p><strong>下一期重点核实项<\/strong>：\n- 核对高额疗养费上限结构（厚労省专页，2026-07 更新）。\n- 核对マイナ保険証切换时点。\n- 逐项闭环手册待复核清单 8 项。<\/p>\n<p><strong>数据补全计划<\/strong>：季节性防灾内容每年 6 月（台风前）与 11 月（冬季前）各核对一次；月度核验仅更新登记册观察项；命中劳动文化制度、生活制度、医疗保险、劳灾、体检、住宅施策、多文化共生、大规模灾害、防灾预警体系等触发器时升级为季度重点更新。<\/p>\n<h2 id=\"s6\">六、核心指标速览<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>在留相关生活手续流程变化<\/td>\n<td>待基线确立<\/td>\n<td>自治体 / 入管庁<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>职场文化相关官方调查<\/td>\n<td>待基线确立<\/td>\n<td>JILPT / 厚労省<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>个人生活适应记录<\/td>\n<td>待记录<\/td>\n<td>自记录<\/td>\n<td>待记录<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>医疗保险费率·自付上限·高额疗养费上限<\/td>\n<td>待基线确立<\/td>\n<td>厚労省 / 健保组合<\/td>\n<td>待基线确立<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>房价/租金行情指针<\/td>\n<td>待复核（口径参考：https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html, 2026）<\/td>\n<td>国交省不動産情報 / 自治体公表（联动 regional 登记册）<\/td>\n<td>待复核<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>防灾气象预警渠道（警戒レベル体系·推送 App）<\/td>\n<td>待复核（体系参考：https://www.jma.go.jp/jma/kishou/know/bosai/warning.html, 2026）<\/td>\n<td>気象庁 / 内閣府防災 / Safety tips<\/td>\n<td>待复核<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>UR 賃貸住宅申込收入基准（制度参数）<\/td>\n<td>家賃 62,500 円未満→基准月收=家賃 4 倍；62,500–200,000 円→25 万円；200,000 円以上→40 万円；储蓄基准=家賃 100 倍可替代收入基准<\/td>\n<td>https://dr.www.ur-net.go.jp/chintai/sp/rent/requirements/<\/td>\n<td>2026-11-12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\">七、监测机制与触发器<\/h2>\n<p><strong>监测节奏<\/strong>（摘自 business-config 第一节）：基线 <code>reports/2026-11-culture-life.md<\/code>（v1.0 首期固定）；月度核验不重写报告，仅更新登记册「观察项与触发器状态」；季度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；事件触发插刷 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>（追加件）。<\/p>\n<p><strong>触发器清单<\/strong>（摘自 lair.or.jp/j/multiculture/association/consultation_list.html，2026。<\/li>\n<\/ol>\n<hr />\n<p>本报告为 v1.0 首份分析，数据基准 2026-11-13。<\/p>\n<hr />\n<blockquote>\n<p><strong>附录说明<\/strong>：以下为原报告《日本文化与生活知识手册》（2026-11_baseline_report.md）全文，作为附录保留，内容未删改。<\/p>\n<\/blockquote>\n<h2 id=\"s11\">日本文化与生活知识手册<\/h2>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（合并整理版）　<strong>整理日期<\/strong>：2026-11-12\n<strong>说明<\/strong>：本文档由原分散的多份章节文档合并整理而成，保留全部原内容与层级关系。后续更新请直接维护本单份文档。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"_13\">导航与使用约定<\/h3>\n<h3 id=\"12-culture-life\">12-culture-life 索引<\/h3>\n<p>文化与生活区。覆盖阶段 2–5：职场软技能、日常生活、心理适应。<\/p>\n<h4 id=\"_14\">文件一览<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">文件<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>职场文化与人际<\/td>\n<td>报联相/挨拶/5S、上下关系、评价体系、跨文化策略<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>生活指南与适应<\/td>\n<td>落地 2 周手续清单、生活基础设施、安全习惯、心理健康、防灾与应急<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>医疗与健康<\/td>\n<td>健保体系、就医全流程、体检、劳灾保险、心理资源、就医日语<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td>住房与安家<\/td>\n<td>租房流程与初期费用、外国人入住、公营住宅、签约时序、退去清算<\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td>社会融入与社群<\/td>\n<td>外国人支援体系、多文化共生施策、同乡会/志愿组织<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_15\">关联目录<\/h4>\n<ul>\n<li>维权流程 → ../../09-politics-law<\/li>\n<li>地域选择 → ../../13-regional-info<\/li>\n<li>生活成本 → ../../07-economy-finance<\/li>\n<li>税费社保与年金 → ../../07-economy-finance（03 章）<\/li>\n<li>现场安全制度与事故处理 → ../../02-career-driver（03 章）<\/li>\n<\/ul>\n<h4 id=\"_16\">使用约定<\/h4>\n<ul>\n<li>落地前通读 02 的手续清单；季节性防灾内容每年 6 月（台风前）与 11 月（冬季前）各核对一次。<\/li>\n<li>医疗费率、高额疗养费上限等活值查 <a href=\"../data/culture_life_indicator_registry.md\">data/culture_life_indicator_registry.md<\/a>，正文不硬编码。<\/li>\n<\/ul>\n<h4 id=\"_17\">更新日志<\/h4>\n<h5 id=\"2026-11-12-030405-02\">2026-11-12（维度扩充：新增 03/04/05 章、02 章防灾小节）<\/h5>\n<p><strong>变更摘要<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">变更类型<\/th>\n<th style=\"width:33%\">位置<\/th>\n<th style=\"width:34%\">内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>新增<\/td>\n<td>03 医疗与健康<\/td>\n<td>健保体系/就医全流程/体检/劳灾申领/心理资源/就医日语（来源：厚労省・UR 等已验证 URL）<\/td>\n<\/tr>\n<tr>\n<td>新增<\/td>\n<td>04 住房与安家<\/td>\n<td>初期费用/外国人入住/UR 公营/签约时序/退去清算（来源：国交省・UR）<\/td>\n<\/tr>\n<tr>\n<td>新增<\/td>\n<td>05 社会融入与社群<\/td>\n<td>支援体系/多文化共生/同乡会参与（来源：総務省・CLAIR）<\/td>\n<\/tr>\n<tr>\n<td>增补<\/td>\n<td>02 章 → 六、防灾与应急<\/td>\n<td>备品备蓄/地震台风初期应对/多语言灾害情报（来源：内閣府防災・気象庁・観光庁）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待复核清单<\/strong><\/p>\n<ul>\n<li>[ ] 大病院选定疗养加算：通识口径待以现行告示核实<\/li>\n<li>[ ] 劳灾疗养给付「本人原则上 0 负担」表述待以申领手册正文二次核实<\/li>\n<li>[ ] SAS 筛查为运输业行业实践，未核实现行规范出处<\/li>\n<li>[ ] 礼金/敷金市场行情倍数、保証会社费用水平：行情类活值，归 regional/economy 登记册<\/li>\n<li>[ ] UR「无礼金·敷金·保证人不要」等惯例性优势未在本次核实页面直接确认<\/li>\n<li>[ ] 电·燃气·水道开通的各事业者标准流程与时限（正文按一般惯例描述并标推断）<\/li>\n<li>[ ] マイナ保険証全面切换后纸保险证停发的确切时点（厚労省专页未见明确日期）<\/li>\n<li>[ ] 地域国際化協会各窗口的具体对应语言与受付时间（依地域而异，定住后逐一核实）<\/li>\n<\/ul>\n<blockquote>\n<p>2026-11-12 复核已闭环：窗口自付 3 割依据健康保険法第 74 条；処方箋有效期 4 日依据「保険医療機関及び保険医療養担当規則」第 20 条・第 21 条；#7119 确认为自治体设置，截至令和 6 年 11 月共 36 地域（覆盖 36/47 都道府县）。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"01\">01 职场文化与人际<\/h3>\n<blockquote>\n<p>对应阶段 2–3 的软技能底座。核心认知：<strong>日本职场文化是可学习的规则系统，不是玄学<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"_18\">一、司机现场的三大文化规则<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">规则<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">实践<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>报联相（報告・連絡・相談）<\/strong><\/td>\n<td>事前/事中/事后都要出声<\/td>\n<td>异常第一时间报，坏消息更要快<\/td>\n<\/tr>\n<tr>\n<td><strong>挨拶文化<\/strong><\/td>\n<td>早上/退勤/借用前后的寒暄是信用基础<\/td>\n<td>\"おはようございます\"大声说，成本最低的印象分<\/td>\n<\/tr>\n<tr>\n<td><strong>5S（整理·整頓·清掃·清潔·躾）<\/strong><\/td>\n<td>车辆/更衣室/传票的整洁=职业度外显<\/td>\n<td>每天下班 10 分钟收拾，被看见<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_19\">二、上下关系与沟通<\/h4>\n<ul>\n<li>敬语体系是职位语言：对先辈用「です・ます」起步，对方主动破解后再放松<\/li>\n<li>指示复述是尊重：接到指示→复述→执行→完成报告，四步闭环<\/li>\n<li>饮み会：参加 1–2 次建立关系即可，长期缺席会边缘化；饮酒不劝强（现场酒精管理严格）<\/li>\n<li>给礼物（手土産）：回国出差带点心，300–1000 円价位即可，关系润滑剂<\/li>\n<\/ul>\n<h4 id=\"_20\">三、评价体系（日本人怎么看工作）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">被认可的<\/th>\n<th style=\"width:50%\">被扣分的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>声を出す（出声确认）<\/td>\n<td>沉默独自处理<\/td>\n<\/tr>\n<tr>\n<td>守时守序（时间提前 10 分钟）<\/td>\n<td>借口与解释先行<\/td>\n<\/tr>\n<tr>\n<td>清洁感（车辆·仪容·更衣室）<\/td>\n<td>现场杂乱<\/td>\n<\/tr>\n<tr>\n<td>前辈照顾后辈的姿态<\/td>\n<td>只顾自己<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_21\">四、跨文化生存策略<\/h4>\n<ol>\n<li>把\"不懂就问\"包装成「確認させてください」——好学不丢脸<\/li>\n<li>不参与是非话题（工资、他人评价），只谈工作和改善<\/li>\n<li>中国背景是资产：对华供应链客户、中文系统的导入支持——<strong>让语言成为岗位价值而非标签<\/strong><\/li>\n<li>遇到排挤/歧视：先书面记录，走 <a href=\"../../09-politics-law/reports/2026-11-politics-law.html#03-维权与合规工具箱\">09-政治与法规 · 03-维权与合规工具箱<\/a> 流程<\/li>\n<\/ol>\n<hr />\n<h3 id=\"02\">02 生活指南与适应<\/h3>\n<blockquote>\n<p>落地生活的基础设施清单。地域细节 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.html\">13-地域信息<\/a>。行政手续与社保制度以总务省、出入国在留管理厅公开信息为准 [Source: https://www.soumu.go.jp/, 2026] [Source: https://www.moj.go.jp/isa, 2026]。<\/p>\n<\/blockquote>\n<h4 id=\"2\">一、行政手续（落地 2 周内）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">手续<\/th>\n<th style=\"width:33%\">期限<\/th>\n<th style=\"width:34%\">去处<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留卡地址登录<\/td>\n<td>落地 14 天内<\/td>\n<td>市区役所<\/td>\n<\/tr>\n<tr>\n<td>健康保险·年金加入确认<\/td>\n<td>同时<\/td>\n<td>同上（公司加社保则确认被保险者证）<\/td>\n<\/tr>\n<tr>\n<td>My Number 卡申请<\/td>\n<td>随时<\/td>\n<td>邮寄申请+役所领取<\/td>\n<\/tr>\n<tr>\n<td>银行开户<\/td>\n<td>第 1–2 周<\/td>\n<td>邮储/Mega bank（在留卡+印章）<\/td>\n<\/tr>\n<tr>\n<td>手机契约<\/td>\n<td>第 2 周<\/td>\n<td>格安 SIM 优先（在留卡+信用卡）<\/td>\n<\/tr>\n<tr>\n<td>印章（実印未必需，认印必备）<\/td>\n<td>第 1 周<\/td>\n<td>100 円店起用，签约用姓名全称章<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_22\">二、生活基础设施<\/h4>\n<ul>\n<li>住宅：公司寮优先起步；自租注意<strong>礼金/敷金/保证人（保证会社）<\/strong>制度<\/li>\n<li>交通：原付/自転车需在役所登记（防窃）；市区通勤多靠电车+接驳<\/li>\n<li>医疗：健保 70% 报销；工作日白天病院、夜間救急センター分诊；指定药店（调剤药局）处方制度<\/li>\n<li>购物：业务スーパー/イオン/100 円店+中華物産店（三松、 タオル系 app：Youjie 等）<\/li>\n<\/ul>\n<h4 id=\"_23\">三、金钱与安全习惯<\/h4>\n<ul>\n<li>现金文化仍强（部分小店），但 IC 卡+信用卡覆盖 95% 生活<\/li>\n<li>诈骗（特殊诈欺）高发：自称役所/警察要账号=100% 诈骗；家人（国内）也要同步防「孩子的电话」类跨境诈骗<\/li>\n<li>地震防灾：防灾袋（水/干粮/手电/哨子）、住所附近避难所确认、 семей内联络卡（不通时的集合点）<\/li>\n<\/ul>\n<h4 id=\"_24\">四、心理健康与社群<\/h4>\n<ul>\n<li>疲劳驾驶期（初入干线/夜班）是情绪低谷高发期：睡眠优先于学习计划——<a href=\"../../11-language-japanese/reports/2026-11-language-japanese.html#04-n2备考计划\">11-日语学习 · 04-N2备考计划<\/a> 的\"最低维持量\"设计就是这个原因<\/li>\n<li>社群：同乡会、特定技能者交流会有抗孤独价值；但职业信息以日本本地渠道为主<\/li>\n<li>与国内家人：固定视频时间差（时差 1 小时，无大碍）；汇款计划 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#02-生活成本与储蓄规划\">07-经济与财务 · 02<\/a><\/li>\n<\/ul>\n<h4 id=\"_25\">五、饮食与自我照顾<\/h4>\n<ul>\n<li>司机职业病预防：腰（装卸姿势）、眼（夜间驾驶）、体重（便利店依赖）——三件套对策：午餐带饭、每周 2 次锻炼、定期健诊<\/li>\n<li>挑战清单（每季度 1 个）：登当地山、参加祭り、做一道日本料理给同事——适应期的成就感燃料<\/li>\n<\/ul>\n<h4 id=\"_26\">六、防灾与应急<\/h4>\n<!-- updated: 2026-11-12 | 新增小节 -->\n\n<blockquote>\n<p>补充小节。信息核对日期：2026-11-12。预警口径每年台风季（6 月）前复核。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">准备层<\/th>\n<th style=\"width:50%\">清单要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>非常用持ち出し袋（随身避难包）<\/td>\n<td>饮水·食品、贵重品（存折·印章·现金·<a href=\"https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html\" title=\"来源：https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html, 2016\">健康保险证<\/a>）、救急品·常备药、手电·收音机·预备电池、头盔·防灾头巾、口罩·军手·暖贴<\/td>\n<\/tr>\n<tr>\n<td>自宅备蓄（3 天起步）<\/td>\n<td>饮水每人每天 3L×3 天份、食品 3 天份（α 米约 5 食/人）、<a href=\"https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html\" title=\"来源：https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html, 2016\">卡式炉·简易厕所·卫生纸<\/a>；南海トラフ级地震有「备蓄 1 周以上」的建议<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html\" title=\"来源：https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html, 2016\">家具固定<\/a><\/td>\n<td>L 型金具/顶柱/粘着垫固定家具、玻璃防飞散膜、感震断路器（部分自治体有购置补助）<\/td>\n<\/tr>\n<tr>\n<td>滚动备蓄<\/td>\n<td>ローリングストック：日常多吃一份、消耗即补——不额外花钱、不过期<\/td>\n<\/tr>\n<tr>\n<td>安否联络<\/td>\n<td>事先约定集合点；电话不通用<a href=\"https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html\" title=\"来源：https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html, 2016\">災害用伝言ダイヤル 171<\/a>与各运营商灾害用伝言板<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>地震初期应对<\/strong>：护头躲入桌下 → 摇晃停止后关火·断电·开门确保出口 → 穿鞋带包撤离；家具翻倒·落物占受伤原因 3–5 成，家具固定是第一道防线 [Source: https://www.bousai.go.jp/kohou/kouhoubousai/h28/83/special_03.html, 2016]；海边强震立即向高处转移（海啸）<\/li>\n<li><strong>台风/大雨初期应对<\/strong>：按<a href=\"https://www.jma.go.jp/jma/kishou/know/bosai/warning.html\" title=\"来源：https://www.jma.go.jp/jma/kishou/know/bosai/warning.html, 2026\">気象警報・警戒レベル<\/a>行动——发布避难指示（警戒レベル 4）全员避难，不等レベル 5；土砂/洪水危险区域实况看<a href=\"https://www.jma.go.jp/bosai/risk/\" title=\"来源：https://www.jma.go.jp/bosai/risk/, 2026\">キキクル<\/a>。驾驶途中遇特別警報：立即驶离低洼地·地下道，就近进入坚固建筑，不强行回家<\/li>\n<li><strong>灾害时外国人多语言情报渠道<\/strong>：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">渠道<\/th>\n<th style=\"width:50%\">用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html\" title=\"来源：https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html, 2026\">Safety tips（観光庁监修）<\/a><\/td>\n<td>15 语种推送：紧急地震速报·海啸·特別警報，附行动流程图与沟通卡<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html\" title=\"来源：https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html, 2026\">NHK WORLD-JAPAN<\/a><\/td>\n<td>24 小时英语频道，大灾时的英语情报源<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html\" title=\"来源：https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/jizoku_kankochi/anzenkakuho/inbound/tool.html, 2026\">JNTO Japan Visitor Hotline<\/a><\/td>\n<td>050-3816-2787，英/中/韩/日 24h（事故·疾病·灾害支持）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.clair.or.jp/j/multiculture/association/consultation_list.html\" title=\"来源：https://www.clair.or.jp/j/multiculture/association/consultation_list.html, 2026\">地域国際化協会相談窓口<\/a><\/td>\n<td>灾后生活咨询的多语言窗口全国一览（→ 05 章）<\/td>\n<\/tr>\n<tr>\n<td>自治体灾害支援体制<\/td>\n<td>総務省「情報難民ゼロ」项目培训<a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html\" title=\"来源：https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html, 2026\">災害時外国人支援情報コーディネーター<\/a>支援避难所信息传达<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3 id=\"03\">03 医疗与健康<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。对应阶段 2–5：落地初期的就医门槛、司机岗位的工伤与健康风险、长期定居的医疗使用。<\/p>\n<p><strong>边界<\/strong>：保险费率、高额疗养费上限等活值统一维护于 <a href=\"../data/culture_life_indicator_registry.md\">data/culture_life_indicator_registry.md<\/a>，本节只写制度结构与操作流程；税·社保·年金的缴纳义务与归档 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#03-税务社保年金\">03-税务社保年金<\/a>。<\/p>\n<\/blockquote>\n<h4 id=\"_27\">一、医疗保险的两条轨道<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">轨道<\/th>\n<th style=\"width:25%\">适用者<\/th>\n<th style=\"width:25%\">加入方式<\/th>\n<th style=\"width:25%\">保费口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保险（职场健保/协会けんぽ）<\/td>\n<td>正社員、特定技能者等被用者<\/td>\n<td>雇主办理，本人与公司折半负担<\/td>\n<td>按标准报酬 × 费率，费率因健保组合而异（活值）<\/td>\n<\/tr>\n<tr>\n<td>国民健康保险<\/td>\n<td>非被用者、退职后、未随社保的家属<\/td>\n<td>自行到市区役所办理<\/td>\n<td>按所得与均等割计算，自治体差异大<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>制度框架以厚生労働省公开信息为准：全民皆保险 → <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/index.html\" title=\"来源：https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/index.html, 2026\">医療保険总览<\/a>；国保为「未加入被用者保险的全体住民」的保险 → <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/koukikourei/index_00002.html\" title=\"来源：https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/koukikourei/index_00002.html, 2026\">国民健康保険制度<\/a><\/li>\n<li>窗口自付比例为 3 割（未满 70 岁；70–74 岁 2 割；75 岁起转入后期高龄者医疗制度）——法律依据为<a href=\"https://laws.e-gov.go.jp/law/334AC0000000070\" title=\"来源：https://laws.e-gov.go.jp/law/334AC0000000070, 2026\">健康保険法第 74 条<\/a><\/li>\n<li>外国人被保险者：国保有含简繁中文在内 19 语种的<a href=\"https://www.mhlw.go.jp/stf/newpage_21895.html\" title=\"来源：https://www.mhlw.go.jp/stf/newpage_21895.html, 2026\">在留外国人向指南<\/a><\/li>\n<li>高额疗养费制度：单月自付超过按所得区分的上限部分可申请给付；上限额每年调整，属活值，查厚労省或健保组合现行表，不写入本手册。官方示例（令和 8 年 8 月起新制度）：70 岁未满·年收约 370–510 万円者，100 万円治疗自付约 9.3 万円封顶 [Source: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/juuyou/kougakuiryou/index.html, 2026]；令和 8·9 年 8 月各有见直し（监测触发器）<\/li>\n<li>易漏点：退职后健保资格丧失，须在 14 天内转入国民健康保险或办理任意継続；断保会在永住审查的\"公的义务\"项留下记录（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.html#07-永住与长期在留规划\">07-永住与长期在留规划<\/a>）<\/li>\n<\/ul>\n<h4 id=\"_28\">二、就医全流程<\/h4>\n<ol>\n<li><strong>选机构<\/strong>：先「診療所（かかりつけ医）」后大病院；无介绍状直接去大病院会被收「選定療養費」<\/li>\n<li><strong>带证件<\/strong>：<a href=\"https://www.mhlw.go.jp/stf/newpage_08277.html\" title=\"来源：https://www.mhlw.go.jp/stf/newpage_08277.html, 2026\">マイナ保険証<\/a>（My Number 卡作健保证用；未持卡时医疗机构可在线确认资格）+ 在留卡；初诊填写问诊票（問診票）<\/li>\n<li><strong>就诊<\/strong>：症状描述 → 检查 → 处方；需要「診断書」时另付文书费——工伤申报、公司请假都要用<\/li>\n<li><strong>取药<\/strong>：日本实行医薬分業，持处方笺（処方箋）到調剤薬局取药（<strong>含交付日在内的 4 日以内<\/strong>，依据<a href=\"https://www.mhlw.go.jp/stf/newpage_32041.html\" title=\"来源：https://www.mhlw.go.jp/stf/newpage_32041.html, 2025\">保険医療機関及び保険医療養担当規則 第 20 条・第 21 条<\/a>；长期旅行等由医生另注期限）；処方箋标注可变更时可选ジェネリック（后发品，平成 22 年 4 月起制度化）[Source: https://www.mhlw.go.jp/web/t_doc?dataId=00tb5919&amp;dataType=1, 2010]<\/li>\n<li><strong>付款<\/strong>：窗口付 3 割，保留领收书（医療費控除与公司报销都要）<\/li>\n<li><strong>夜间/假日<\/strong>：先拨所在地「救急安心センター（#7119）」咨询再决定是否叫救护车（<strong>非全国统一<\/strong>，由自治体设置；截至令和 6 年 11 月共 36 地域，覆盖 36/47 都道府县——<a href=\"https://www.fdma.go.jp/publication/hakusho/r6/report4/67976.html\" title=\"来源：https://www.fdma.go.jp/publication/hakusho/r6/report4/67976.html, 2024\">消防庁 消防白書<\/a>）；未开设地区拨「#8000（儿童急救咨询）」或直接 119<\/li>\n<\/ol>\n<blockquote>\n<p>与 07 的边界：医療費控除的申告操作 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#03-税务社保年金\">03-税务社保年金<\/a>；本节只管\"看病怎么走通\"。<\/p>\n<\/blockquote>\n<h4 id=\"_29\">三、体检与预防（司机岗位特化）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">项目<\/th>\n<th style=\"width:25%\">依据/主体<\/th>\n<th style=\"width:25%\">频率<\/th>\n<th style=\"width:25%\">岗位要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>定期健康診断<\/td>\n<td>労働安全衛生法，雇主实施<\/td>\n<td>每年<\/td>\n<td>血压/血糖/听力/视力是驾照适性关联项<\/td>\n<\/tr>\n<tr>\n<td>特定健診<\/td>\n<td>40–74 岁健保加入者<\/td>\n<td>每年<\/td>\n<td>可与公司健诊合并，避免重复受检<\/td>\n<\/tr>\n<tr>\n<td>がん検診<\/td>\n<td>自治体<\/td>\n<td>按自治体案内<\/td>\n<td>多地有补助，落地后在役所确认<\/td>\n<\/tr>\n<tr>\n<td>睡眠時無呼吸症候群（SAS）筛查<\/td>\n<td>运输业自主规范 + 健保（行业实践，待复核）<\/td>\n<td>有症状时<\/td>\n<td>日间嗜睡＝事故风险，结论影响乗務判定<\/td>\n<\/tr>\n<tr>\n<td>ストレスチェック<\/td>\n<td>労働安全衛生法（一定规模事业场义务）<\/td>\n<td>每年<\/td>\n<td>结果不直接进人事评价，可主动利用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>[Source: https://anzeninfo.mhlw.go.jp/yougo/yougo51_1.html, 2026]<\/p>\n<ul>\n<li>夜班/长途司机三项自保：睡眠时长优先于学习计划、腰（装卸姿势）、体重（便利店依赖）——与 <a href=\"#02-生活指南与适应\">02-生活指南与适应<\/a> 第五节呼应<\/li>\n<\/ul>\n<h4 id=\"_30\">四、劳灾保险与工伤（与职业安全直接衔接）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">健康保险<\/th>\n<th style=\"width:34%\">劳灾保险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>覆盖范围<\/td>\n<td>疾病·伤害（业务外也覆盖）<\/td>\n<td>业务上灾害与通勤灾害<\/td>\n<\/tr>\n<tr>\n<td>窗口自付<\/td>\n<td>3 割<\/td>\n<td>疗养给付范围内原则上本人 0 负担<\/td>\n<\/tr>\n<tr>\n<td>申请主体<\/td>\n<td>本人<\/td>\n<td>雇主提出、本人配合；雇主不配合可自行向劳动基准监督署申请<\/td>\n<\/tr>\n<tr>\n<td>休业期间<\/td>\n<td>伤病津贴（条件严格）<\/td>\n<td>休业（补偿）给付<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>流程（司机现场版）：<\/p>\n<ol>\n<li>事故/受伤 → 先确保安全与报警（→ <a href=\"../../02-career-driver/reports/2026-11-career-driver.html#03-安全规范与现场制度\">03-安全规范与现场制度<\/a>）<\/li>\n<li>当日内口头+书面报告公司运行管理者，记录时间/地点/目击者/点呼记录<\/li>\n<li>到労災指定医院就诊，明确说明「労災です」，走労災窗口而非医保窗口<\/li>\n<li>公司提交「療養補償給付たる療養の給付請求書」；本人保留诊断书、领收书、事故报告副本<\/li>\n<li>\n<p>公司拖延或否认 → 劳动基准监督署（労基署）相談，或走 <a href=\"../../09-politics-law/reports/2026-11-politics-law.html#03-维权与合规工具箱\">09-政治与法规 · 03-维权与合规工具箱<\/a><\/p>\n<\/li>\n<li>\n<p>咨询与资料：<a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/gyousei/rousai/040325-14.html\" title=\"来源：https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/gyousei/rousai/040325-14.html, 2026\">療養（補償）等給付の請求手続<\/a>（労災保険相談ダイヤル 0570-006031，月–金 8:30–17:15）；<a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/gyousei/rousai/gaikoku-pamphlet.html\" title=\"来源：https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/gyousei/rousai/gaikoku-pamphlet.html, 2026\">外国人劳动者向劳灾保险给付手册<\/a>有含中文在内 14 语种版本<\/p>\n<\/li>\n<\/ol>\n<blockquote>\n<p>特定技能者的工伤本身不直接导致在留资格丧失，但长期休业会影响雇用継続与更新材料——<strong>证据要留全<\/strong>。<\/p>\n<\/blockquote>\n<h4 id=\"_31\">五、心理健康资源<\/h4>\n<ul>\n<li>公司内：产业医、保健师、相談窓口（一定规模事业场为法定义务）<\/li>\n<li>公司外：自治体「こころの健康相談」、よりそいホットライン（0120-279-338，24h，含外语对应）、いのちの電話——窗口总览见厚労省<a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/jisatsu/soudan_tel.html\" title=\"来源：https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/jisatsu/soudan_tel.html, 2026\">電話相谈页<\/a><\/li>\n<li>最实际的障碍是语言：先用「相談したい」开口，必要时申请多语言/通译支援<\/li>\n<\/ul>\n<h4 id=\"n4\">六、医疗日语最小集（N4 可用）<\/h4>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">场景<\/th>\n<th style=\"width:50%\">说法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>挂号<\/td>\n<td>初めてです。保険証があります。<\/td>\n<\/tr>\n<tr>\n<td>症状<\/td>\n<td>頭が痛いです／熱があります／お腹が痛いです<\/td>\n<\/tr>\n<tr>\n<td>起病时间<\/td>\n<td>三日くらい前からです<\/td>\n<\/tr>\n<tr>\n<td>用药<\/td>\n<td>薬を飲んでいます。アレルギーはありません。<\/td>\n<\/tr>\n<tr>\n<td>文书<\/td>\n<td>診断書をお願いします。<\/td>\n<\/tr>\n<tr>\n<td>转诊<\/td>\n<td>紹介状をお願いします。<\/td>\n<\/tr>\n<tr>\n<td>劳灾<\/td>\n<td>仕事中のけがです。労災でお願いします。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_32\">关联<\/h4>\n<ul>\n<li>保险费率、自付上限等活值 → <a href=\"../data/culture_life_indicator_registry.md\">data/culture_life_indicator_registry.md<\/a><\/li>\n<li>税·社保·年金缴纳与归档 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.html#03-税务社保年金\">03-税务社保年金<\/a><\/li>\n<li>现场安全制度与事故处理 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.html#03-安全规范与现场制度\">03-安全规范与现场制度<\/a><\/li>\n<li>就医资源的地域差 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.html#01-地域选择框架\">13-地域信息 · 01-地域选择框架<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"04\">04 住房与安家<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。对应阶段 2（落地安家）与阶段 5（定居换房）。本节只写流程与费用结构；租金行情等活值 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.html#02-地域生活笔记\">13-地域信息 · 02-地域生活笔记<\/a> 与 economy 手册成本章。<\/p>\n<\/blockquote>\n<h4 id=\"_33\">一、租房流程与初期费用<\/h4>\n<p>流程：物件探し（不動産店/网站）→ 内见 → 申込（入居审查）→ 重要事項説明＋契约 → 交钥匙。宅建业者对借主负有书面重要事項説明义务（现也可在线办理 IT 重要事項説明）[Source: https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html, 2026]<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">费用项<\/th>\n<th style=\"width:33%\">性质<\/th>\n<th style=\"width:34%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>前家賃<\/td>\n<td>必付<\/td>\n<td>当月租金，签约时支付<\/td>\n<\/tr>\n<tr>\n<td>敷金<\/td>\n<td>存管型押金<\/td>\n<td>退去清算后余额返还 → 见「五」<\/td>\n<\/tr>\n<tr>\n<td>礼金<\/td>\n<td>付与房东不返还<\/td>\n<td>市场惯例，无法定上限（推断；行情倍数待复核 → 登记册）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html\" title=\"来源：https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html, 2026\">仲介手数料<\/a><\/td>\n<td>法定上限<\/td>\n<td>居住用借主侧：1 个月房租×1.1（含税）以内，贷主侧×0.55；令和 6 年 7 月起长期空き家特例上限×2.2<\/td>\n<\/tr>\n<tr>\n<td>保証会社料·火災保険等<\/td>\n<td>惯例<\/td>\n<td>数额依物件与公司，行情待复核<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4 id=\"_34\">二、保证会社与外国人入住障碍<\/h4>\n<ul>\n<li>保证人制度：多数民赁要求保证人；无保证人时以保証会社替代（费用惯例，待复核）<\/li>\n<li>外国人常见障碍：审查标准不透明、语言、无国内保证人——国交省为此发布<a href=\"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000017.html\" title=\"来源：https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000017.html, 2026\">外国人の民間賃貸住宅入居円滑化ガイドライン<\/a>（14 国语，含標準契約書·重要事項説明書范本），被拒或条款不明时用它与业者对话<\/li>\n<li>退去责任边界（原状回復）：只赔故意·过失·超过通常使用的损耗；経年变化与通常损耗为房东负担 [Source: https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html, 2026]<\/li>\n<\/ul>\n<h4 id=\"ur\">三、公营选项：UR 賃貸住宅<\/h4>\n<ul>\n<li>独立行政法人都市再生機構（UR）賃貸住宅对外国籍开放（「UR が定める資格を持つ外国籍の方」可申込）[Source: https://dr.www.ur-net.go.jp/chintai/sp/rent/requirements/, 2026]<\/li>\n<li>收入基准（2026-11 核实）：家賃 62,500 円未満→基准月收=家賃 4 倍；62,500–200,000 円→25 万円；200,000 円以上→40 万円；存款基准=家賃 100 倍可替代收入基准；收入不足可用家賃一時払い（1–10 年）制度 [Source: https://dr.www.ur-net.go.jp/chintai/sp/rent/requirements/, 2026]<\/li>\n<li>必要書類含住民票；外国籍者注意住民票记载事项被省略的问题 [Source: https://www.ur-net.go.jp/chintai/rent/documents/, 2026]<\/li>\n<li>市営/県営住宅（所得限制+抽选）为另一条公营路线（抽选倍率等行情待复核）<\/li>\n<\/ul>\n<h4 id=\"_35\">四、签约时序与水电煤网开通<\/h4>\n<p>依赖链（落地 2 周手续 → <a href=\"#02-生活指南与适应\">02-生活指南与适应<\/a>）：<\/p>\n<pre><code>在留卡（地址登录）→ 印章 → 银行口座 → 口座振替绑定房租+水电气\n手机契约（在留卡+支付手段）可与银行开户并行推进\n<\/code><\/pre>\n<ul>\n<li>水道：向所在地水道局/役所做使用开始申报（入住前可办）<\/li>\n<li>电气：向电力公司申込，一般入住当日合闸供电、事后补手续（一般惯例，推断待复核）<\/li>\n<li>燃气：都市ガス需预约上门开栓（推断待复核）；プロパンガス为区域供应商<\/li>\n<li>光纤网络：初装常有等待期（行情类，待复核）——搬家前先确认可否「事前转移」；夜班作息与施工时段冲突，预约尽早<\/li>\n<\/ul>\n<h4 id=\"_36\">五、退去与敷金清算<\/h4>\n<ul>\n<li>提出退去：契约书约定月数前通知（惯例 1 个月，推断）<\/li>\n<li>清算逻辑：敷金先抵扣未纳房租+修复费，余额返还；修复费仅限「故意过失/通常使用范围外损耗」，経年分由房东负担 [Source: https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html, 2026]<\/li>\n<li>清算对账：要求出示明细；入退去时拍照留证；有争议以<a href=\"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html\" title=\"来源：https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html, 2026\">原状回復ガイドライン Q&amp;A<\/a>为依据交涉<\/li>\n<li>退去联动：水电气停用申报、転出届 → 新地址 14 天内在留卡变更 → <a href=\"#02-生活指南与适应\">02-生活指南与适应<\/a><\/li>\n<\/ul>\n<hr />\n<h3 id=\"05\">05 社会融入与社群<\/h3>\n<!-- updated: 2026-11-12 | 新增章节 -->\n\n<blockquote>\n<p>信息核对日期：2026-11-12。服务阶段 5 定居质量：从「能生活」到「有社群」。地域性信息 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.html#02-地域生活笔记\">13-地域信息 · 02-地域生活笔记<\/a>。<\/p>\n<\/blockquote>\n<h4 id=\"_37\">一、外国人支援体系<\/h4>\n<ul>\n<li>全国网络：各都道府县·政令指定城市的地域国際化協会提供多语言生活咨询与专门咨询（法律/福祉/教育）；CLAIR 维护<a href=\"https://www.clair.or.jp/j/multiculture/association/consultation_list.html\" title=\"来源：https://www.clair.or.jp/j/multiculture/association/consultation_list.html, 2026\">全国多语言生活咨询窗口一览<\/a>（13 语种宣传资料可直接使用）<\/li>\n<li>主题门户：CLAIR <a href=\"https://www.clair.or.jp/tabunka/portal/\" title=\"来源：https://www.clair.or.jp/tabunka/portal/, 2026\">多文化共生ポータルサイト<\/a>——国家政策/统计/补助金/取组事例/全国咨询窗口一站检索，另有やさしい日本语版<\/li>\n<li>役所层：市区役所外国人相談窗口、国保·年金窗口的通译对应（是否多语言化依自治体，待复核——定住后先查本地）<\/li>\n<\/ul>\n<h4 id=\"_38\">二、多文化共生施策<\/h4>\n<ul>\n<li>主管部门：総務省「地域の国際化の推進」。核心文件为<a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html\" title=\"来源：https://www.soumu.go.jp/menu_seisaku/chiho/02gyosei05_03000060.html, 2026\">地域における多文化共生推進プラン<\/a>（令和 2 年改订），指导地方自治体制定指針·計画；策定状况逐年调查公开（令和 6 年 4 月时点为最新调查）<\/li>\n<li>灾害时外国人支援：総務省「情報難民ゼロ」项目培训災害時外国人支援情報コーディネーター（同上来源）→ <a href=\"#02-生活指南与适应\">02-生活指南与适应（六、防灾与应急）<\/a><\/li>\n<li>实践案例：<a href=\"https://www.soumu.go.jp/menu_seisaku/chiho/tabunkakyousei_suishin_r03.html\" title=\"来源：https://www.soumu.go.jp/menu_seisaku/chiho/tabunkakyousei_suishin_r03.html, 2021\">多文化共生事例集（令和 3 年度版）<\/a>——外国人住民协働地域活化、留学生就职支援等<\/li>\n<li>个人用法：搬家/换工作时用「自治体名 + 多文化共生 + 相談窓口」检索本地施策与窗口<\/li>\n<\/ul>\n<h4 id=\"_39\">三、同乡会与志愿组织参与<\/h4>\n<ul>\n<li>最稳入口：地域国際化協会的活动——日本語教室（志愿者教室多为免费，一般化观察）、地域交流イベント、防灾训练（→ <a href=\"#02-生活指南与适应\">02-生活指南与适应（六）<\/a> 的防灾训练建议）<\/li>\n<li>外国人社区网络：CLAIR 运营「多文化 Opinion Exchange（旧外国人コミュニティ全国会議）」等全国性平台 [Source: https://clair.or.jp/j/multiculture/, 2026]——同乡会、特定技能者交流会正被这类正式网络补充衔接<\/li>\n<li>参与方式（生活经验，个案）：先从受援（咨询/日语教室
