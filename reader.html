/iryosd/24/index.html （2024）<\/li>\n<li>文部科学省 帰国・外国人児童生徒等の現状 — https://www.mext.go.jp/a_menu/shotou/clarinet/genjyou/1295897.htm （2026 核对，令和 7 年度调查）<\/li>\n<li>気象庁 警報・注意報 — https://www.jma.go.jp/bosai/warning/ （2026 核对）<\/li>\n<li>気象庁 多言語ページ（防災気象情報多语言版） — https://www.data.jma.go.jp/multi/yoho/index.html?lang=cn_zs （2026 核对）<\/li>\n<li>防災庁 — https://www.bousai.go.jp （2026 核对；2026-11-02 发足）<\/li>\n<li>NHK WORLD-JAPAN 多言語リンク — https://www3.nhk.or.jp/nhkworld/en/multilingual_links/ （2026 核对）<\/li>\n<li>総務省自治体「外国人生活ガイド」入口 — https://www.soumu.go.jp/ （2026 核对）<\/li>\n<\/ol>\n<p><strong>B 权威转引 / 聚合<\/strong>：HelloWork 地域检索（岗位密度一手聚合，登记册 #1 优先来源）；JETRO 地域信息。<\/p>\n<p><strong>C 平台抽样 / 门户<\/strong>：賃貸 / 生活门户（挂牌口径，仅预期指标，登记册 #2 优先来源）；地域媒体。<\/p>\n<h3 id=\"_35\"><a id=\"跨主题链接\" aria-hidden=\"true\"><\/a>跨主题链接<\/h3>\n<ul>\n<li>薪资地域差 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">../07-economy-finance/reports/2026-11-economy-finance.md<\/a><\/li>\n<li>求职渠道地域策略 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">../02-career-driver/reports/2026-11-career-driver.md<\/a><\/li>\n<li>保险体系与就医流程细节 → <a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">../12-culture-life/reports/2026-11-culture-life.md<\/a><\/li>\n<li>就学手续与学制细节 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">../10-education-qualification/reports/2026-11-education-qualification.md<\/a><\/li>\n<li>灾害时外国人支援政策环境 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">../09-politics-law/reports/2026-11-politics-law.md<\/a><\/li>\n<li>岗位密度 / 薪资地域差活值（只读引用） → <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">../01-ssw-driver/reports/2026-11-ssw-driver.md<\/a><\/li>\n<li>手册与登记册 → <a href=\"../handbook/00-navigation.md\">handbook/00-navigation.md<\/a> · <a href=\"../handbook/01-region-choice.md\">handbook/01-region-choice.md<\/a> · <a href=\"../handbook/02-region-notes.md\">handbook/02-region-notes.md<\/a> · <a href=\"../data/regional_indicator_registry.md\">data/regional_indicator_registry.md<\/a><\/li>\n<\/ul>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 222, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "13-regional-info/reports/2026-11-regional-info.html"}}}, "life-operations": {"name": "在日生活实务与行政手续", "dir": "14-life-operations", "months": {"2026-11": {"title": "在日生活实务与行政手续 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"在日生活实务与行政手续--2026-11-月度报告\" aria-hidden=\"true\"><\/a>在日生活实务与行政手续 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人执行层\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）的生活实务执行层。\n<strong>来源规则<\/strong>：① 総務省 / 厚生労働省 / 国土交通省 / 内閣府 / デジタル庁 / e-Gov / 各自治体官网 ＞ ② 金融 / 通信机构官网（各银行、携帯运营商、电力燃气公司）＞ ③ 行业专业机构 ＞ ④ 平台 / 门户抽样（转载须回溯官网）＞ ⑤ 主流媒体（仅作线索，须回原文）。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>核心判断<\/strong>（每条含数据、口径与来源）：<\/p>\n<ol>\n<li><strong>落地手续有明确时限<\/strong>（事实）：在留卡与住民登记均为<strong>抵达 / 迁入后 14 日内<\/strong>；健康保険与年金随住民登记一并办理，逾期会影响后续手续。[出入国在留管理庁 / 総務省 / 厚生労働省]<\/li>\n<li><strong>住房是最大初期费用<\/strong>（事实）：租房初期费用通常含敷金 + 礼金 + 仲介手数料 + 保证会社 + 更新料，合计可达 <strong>4–8 个月<\/strong>房租；外国人常需保证会社或在日保证人。[国土交通省]<\/li>\n<li><strong>公共交通与通信已高度电子化<\/strong>（事实）：IC 卡覆盖绝大多数铁路与巴士，并可电子支付；格安 SIM 显著低于大手运营商，但回线与品质不同，不可直接比价。[総務省 / JR 東日本]<\/li>\n<li><strong>银行开户存在在留期限门槛<\/strong>（推断）：部分银行要求在留 <strong>6 个月以上<\/strong>，刚抵达时可先用支持外国人的银行或邮局账户过渡。[各银行官网]<\/li>\n<li><strong>水电燃气已自由化<\/strong>（事实）：电力（2016）与燃气（2017）全面自由化，可比较切换；开通需申请与使用开始。[資源エネルギー庁]<\/li>\n<li><strong>最大信息差在「执行细节」<\/strong>（事实）：本基线为初析级，通信费用 / 银行开户 / 自治体窗口 / 定期券行情的具体现行值标记「⚠ 待核实」，待次期或定居地确定后补齐。<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>覆盖登记册全部 10 项追踪指标（活值以 <a href=\"../data/life_operations_indicator_registry.md\">data/life_operations_indicator_registry.md<\/a> 为准，基准版本均为 v2026.11.14_1）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">最新值（来源 / 年份）<\/th>\n<th style=\"width:25%\">变更说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>在留卡・住民登记时限与书类<\/td>\n<td>在留卡：抵达后 14 日内在机场 / 市区町村登记；住民登记：迁入后 14 日内提交転入届；需护照 + 在留卡（或 COE）[出入国在留管理庁; 総務省]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>国民健康保険 / 被用者保険要件与自付比例<\/td>\n<td>国保：非公司职员等，自付通常 3 割；被用者：公司职员，自付通常 3 割（年龄 / 收入差异）；加入为住民登记后义务 [厚生労働省]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>年金加入要件（国民 / 厚生）<\/td>\n<td>20 岁以上 60 岁以下住民须加入；国保与年金在同一窗口办理；脱退一时金需满足条件 [日本年金機構]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>租房费用结构<\/td>\n<td>初期费用含敷金（0–2 个月）+ 礼金（0–2 个月）+ 仲介手数料（约 1 个月）+ 保证会社（首次约 0.5–1 个月）+ 更新料（约 1 个月 / 2 年）；因地域 / 物件而异 [国土交通省; 平台抽样 C 级]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>公共交通费用<\/td>\n<td>定期券为通勤 / 通学主流；月费因区间而异（示例区间待核实）；IC 卡为乘车与支付工具 [国土交通省]<\/td>\n<td>截至 2026-11-14 无更新；⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>通信费用<\/td>\n<td>大手运营商月费高于格安 SIM；光回线月费因回线与捆绑而异；⚠ 具体数值待核实 [総務省; 运营商官网]<\/td>\n<td>截至 2026-11-14 无更新；⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>银行开户条件<\/td>\n<td>通常需在留卡 + 住民票 / 住所证明 + 印鉴；部分银行要求在留 6 个月以上；⚠ 各银行现行口径待核实 [各银行官网]<\/td>\n<td>截至 2026-11-14 无更新；⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>水电燃气开通与费用<\/td>\n<td>上下水道由自治体管理；電気 / ガス可自由选择（2016 / 2017 全面自由化）；开通需申请与使用开始 [各公司 / 自治体]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>行政手续 90 天清单完成状态<\/td>\n<td>模板已建（见 00-decision-hub 落地清单）；个人填写状态待记录<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>自治体多语言支援窗口<\/td>\n<td>多语言窗口因自治体而异；⚠ 具体窗口清单待补（定居地确定后复核）<\/td>\n<td>截至 2026-11-14 无更新；⚠ 待核实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>观察项与触发器状态<\/strong>：首要待核实 = 通信费用 / 银行开户 / 自治体窗口的具体现行值；触发器 = 个人定居地确定 → 模块八重点更新（未命中）。<\/p>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告已修正事实清单，无新增修正。历史报告未设独立清单，其口径裁决（见第八节）继续有效。<\/p>\n<h3 id=\"_4\"><a id=\"调研说明\" aria-hidden=\"true\"><\/a>调研说明<\/h3>\n<ul>\n<li><strong>来源语言规则<\/strong>：日文官方一手优先；运营商 / 金融機関官网次之；中文来源仅作线索。<\/li>\n<li><strong>时效窗口<\/strong>：官方一手最新；费用 / 要件以官方页与运营商官网为准。<\/li>\n<li><strong>标注约定<\/strong>：事实与推断分离；建议标「建议 / 推断」；缺失事实显式标记「⚠ 待核实」，不补值、不外推。<\/li>\n<li><strong>跨主题分工<\/strong>：在留资格制度、申请审查、永住归化 → <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>；税制、社保费、年金脱退、投资 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；日语学习、考试 → <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>；文化习俗、礼仪、节庆 → <a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life<\/a>；地域选择、定居地档案 → <a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a>；驾照路径与费用、车辆成本 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a> / <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>。<\/li>\n<\/ul>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<h3 id=\"21\"><a id=\"21-落地制度框架在留住民保险年金\" aria-hidden=\"true\"><\/a>2.1 落地制度框架（在留・住民・保险・年金）<\/h3>\n<ul>\n<li><strong>在留卡<\/strong>：抵达后 14 日内在机场 / 市区町村完成登记；在留卡为身份与在留资格的唯一凭证，需随身携带。[出入国在留管理庁]<\/li>\n<li><strong>住民登记（転入届）<\/strong>：迁入新住所后 14 日内向新自治体申报；需护照 + 在留卡（或 COE）。迁出前向原自治体申报并领取転出証明書。[総務省]<\/li>\n<li><strong>健康保険<\/strong>：国民健康保険面向非公司职员等居民，自付比例通常 3 割（小学生未満 2 割、70–74 岁因收入 1–2 割）；被用者健康保険面向公司职员，自付通常 3 割，由公司与个人分担保费；高額療養費制度对超上限部分由公费承担差额。[厚生労働省]<\/li>\n<li><strong>年金<\/strong>：20 岁以上 60 岁以下住民有加入义务；国民年金（基础年金）与厚生年金（公司职员）并行；离开日本时可申请脱退一时金（需满足条件，详见 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>）。[日本年金機構]<\/li>\n<\/ul>\n<h3 id=\"22\"><a id=\"22-市场化与自由化进程\" aria-hidden=\"true\"><\/a>2.2 市场化与自由化进程<\/h3>\n<ul>\n<li><strong>电力<\/strong>：2016 年全面自由化，可从各电力公司选择。[資源エネルギー庁]<\/li>\n<li><strong>燃气<\/strong>：2017 年全面自由化，可从各燃气公司选择。[資源エネルギー庁]<\/li>\n<li><strong>通信<\/strong>：大手运营商（docomo / au / softbank）自有一回线；格安 SIM（MVNO）租用大手回路，月租通常显著低于大手，但回线与品质不同，不可直接比价；光回线为住宅主流方案，常与手机契约捆绑。[総務省]<\/li>\n<li><strong>交通<\/strong>：JR、私铁、地下铁构成城市公共交通主干；定期券为通勤 / 通学主流；IC 卡（Suica、PASMO 等）可乘车与电子支付，多数区间互通。[国土交通省 / JR 東日本]<\/li>\n<\/ul>\n<h3 id=\"23\"><a id=\"23-政策与趋势观察触发器\" aria-hidden=\"true\"><\/a>2.3 政策与趋势观察（触发器）<\/h3>\n<p>在留 / 住民 / 保险制度改定（要件、时限、费用）→ 模块二；租房相关法规变更（契约、敷金礼金、保证人）→ 模块三；公共交通 IC 卡 / 定期券规则变更 → 模块四；通信运营商资费 / 制度变更 → 模块五；银行开户 / 外汇 / 送金规则变更 → 模块六；水电燃气开通 / 费用变更 → 模块七；个人定居地确定 / 赴日 → 模块八（90 天清单）。无触发器命中且窗口未到时<strong>不启动<\/strong>。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-口径声明\" aria-hidden=\"true\"><\/a>3.1 口径声明<\/h3>\n<p>本主题不维护「人才供需」与「薪酬」类数据：薪酬、税制与社保费归 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；地域选择与生活成本归 <a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a>。本节呈现本主题核心的「落地成本口径」，不编造供需与薪酬数字。<\/p>\n<h3 id=\"32-c\"><a id=\"32-租房初期费用结构事实--平台抽样-c-级\" aria-hidden=\"true\"><\/a>3.2 租房初期费用结构（事实 + 平台抽样 C 级）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">费用项<\/th>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:34%\">倍数 / 金额<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>敷金<\/td>\n<td>押金，退还时结算<\/td>\n<td>0–2 个月<\/td>\n<\/tr>\n<tr>\n<td>礼金<\/td>\n<td>谢礼，不退还<\/td>\n<td>0–2 个月<\/td>\n<\/tr>\n<tr>\n<td>仲介手数料<\/td>\n<td>中介手续费<\/td>\n<td>约 1 个月（含消费税）<\/td>\n<\/tr>\n<tr>\n<td>保证会社<\/td>\n<td>租赁保证<\/td>\n<td>首次约 0.5–1 个月（外国人常需）<\/td>\n<\/tr>\n<tr>\n<td>更新料<\/td>\n<td>契约更新费<\/td>\n<td>约 1 个月（通常 2 年一次）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>合计口径：可达 <strong>4–8 个月<\/strong>房租（历史报告结论，口径为「通常含…合计可达」）。[国土交通省 / 平台抽样]<\/li>\n<li>契约类型：普通赁贷借（可更新）/ 定期赁贷借（期满返还）；更新料与解约预告期需在契约中确认。<\/li>\n<li>因地域 / 物件而异，本表为区间口径，不取单一数值。<\/li>\n<\/ul>\n<h3 id=\"33\"><a id=\"33-交通--通信--水电费用口径-待核实\" aria-hidden=\"true\"><\/a>3.3 交通 / 通信 / 水电费用口径（⚠ 待核实）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>定期券<\/td>\n<td>通勤 / 通学主流，月费因区间而异<\/td>\n<td>⚠ 示例区间待核实<\/td>\n<\/tr>\n<tr>\n<td>IC 卡<\/td>\n<td>乘车与支付工具<\/td>\n<td>事实（覆盖范围）<\/td>\n<\/tr>\n<tr>\n<td>携帯 / 格安 SIM / 光回线<\/td>\n<td>大手月费高于格安；光回线因回线与捆绑而异<\/td>\n<td>⚠ 具体月费待核实<\/td>\n<\/tr>\n<tr>\n<td>电气 / ガス / 水道<\/td>\n<td>自由化可选择；水道由自治体管理<\/td>\n<td>⚠ 典型月费待核实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"34\"><a id=\"34-汇率与计价单位\" aria-hidden=\"true\"><\/a>3.4 汇率与计价单位<\/h3>\n<ul>\n<li>汇率交叉验证输入见 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a> 登记册（中国外汇交易中心中间价）；本报告金额以日元计价，人民币换算须注明汇率时点。<\/li>\n<\/ul>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<h3 id=\"41\"><a id=\"41-边界声明\" aria-hidden=\"true\"><\/a>4.1 边界声明<\/h3>\n<p>本主题不含雇主（企业）细分：货运司机雇主生态归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 与 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>。本节仅对本主题涉及的服务主体做类型细分。<\/p>\n<h3 id=\"42\"><a id=\"42-服务主体类型\" aria-hidden=\"true\"><\/a>4.2 服务主体类型<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">主体类型<\/th>\n<th style=\"width:25%\">代表<\/th>\n<th style=\"width:25%\">角色<\/th>\n<th style=\"width:25%\">入选标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>官方窗口<\/td>\n<td>出入国在留管理庁、総務省、厚生労働省、国土交通省、自治体<\/td>\n<td>制度与手续<\/td>\n<td>官方发布页可回溯<\/td>\n<\/tr>\n<tr>\n<td>金融机构<\/td>\n<td>各银行（含邮局银行 / 地方银行 / 网络银行）、金融庁<\/td>\n<td>口座、送金、外汇<\/td>\n<td>机构官网可回溯<\/td>\n<\/tr>\n<tr>\n<td>通信运营商<\/td>\n<td>docomo / au / softbank（大手）、MVNO（格安 SIM）、光回线事业者<\/td>\n<td>携帯 / 网络<\/td>\n<td>运营商官网可回溯<\/td>\n<\/tr>\n<tr>\n<td>能源事业者<\/td>\n<td>各电力公司、都市ガス / プロパンガス供应商、水道局<\/td>\n<td>水电燃气开通<\/td>\n<td>各公司 / 自治体官网可回溯<\/td>\n<\/tr>\n<tr>\n<td>住宅相关<\/td>\n<td>不动产公司、保証会社、UR 都市機構、管理会社<\/td>\n<td>租房 / 保证<\/td>\n<td>平台抽样须回溯官网；排除无资质中介<\/td>\n<\/tr>\n<tr>\n<td>搬家 / 送金<\/td>\n<td>搬家公司、专业送金服务<\/td>\n<td>搬家、国际汇款<\/td>\n<td>平台抽样须回溯官网<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>入选标准：官方窗口、指定机构、运营商官方渠道；排除无资质中介。<\/p>\n<\/blockquote>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<h3 id=\"51\"><a id=\"51-边界声明\" aria-hidden=\"true\"><\/a>5.1 边界声明<\/h3>\n<p>本主题不含岗位技能：司机岗位技能与现场日语归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> / <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；生活文化技能归 <a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life<\/a>。本节呈现「落地执行层能力要求」，即把每一步办成所需的书类、时限与语言能力。<\/p>\n<h3 id=\"52\"><a id=\"52-执行层能力要求建议\" aria-hidden=\"true\"><\/a>5.2 执行层能力要求（建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">能力<\/th>\n<th style=\"width:33%\">要求<\/th>\n<th style=\"width:34%\">来源口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>书类准备<\/td>\n<td>在留卡 / 护照 / COE、住民票、印鉴、银行账户等需随身携带或提前备齐<\/td>\n<td>出入国在留管理庁 / 総務省<\/td>\n<\/tr>\n<tr>\n<td>时限意识<\/td>\n<td>14 日（在留卡地址登录、住民登记）、1 个月（银行 / 手机）、1–3 个月（住房 / 水电）<\/td>\n<td>登记册 #1 / 历史报告 90 天清单<\/td>\n<\/tr>\n<tr>\n<td>语言与窗口<\/td>\n<td>手续日语 + 多语言窗口利用（自治体多语言窗口因自治体而异）<\/td>\n<td>各自治体官网（⚠ 清单待补）<\/td>\n<\/tr>\n<tr>\n<td>费用管理<\/td>\n<td>初期费用 4–8 个月房租的现金准备<\/td>\n<td>国土交通省 / 平台抽样<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"53\"><a id=\"53-常见坑-待核实项\" aria-hidden=\"true\"><\/a>5.3 常见坑（⚠ 待核实项）<\/h3>\n<ul>\n<li>银行开户：在留期限门槛（3 个月 / 6 个月各银行口径不同）可能影响开户，需逐行核实。<\/li>\n<li>通信：格安 SIM 与大手回线 / 品质不同，不可直接比价。<\/li>\n<li>住房：部分房东 / 管理会社不接受外国人（推断，需平台抽样核实）。<\/li>\n<li>水电：开通流程与时限因事业者而异（推断待核实）。<\/li>\n<\/ul>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<h3 id=\"61\"><a id=\"61-边界声明\" aria-hidden=\"true\"><\/a>6.1 边界声明<\/h3>\n<p>本主题不含职业资质证书：资格 / 学历路径归 <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>；驾照路径归 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> / 10。本节呈现落地所需的官方证件与资格口径。<\/p>\n<h3 id=\"62\"><a id=\"62-落地所需官方证件与资格\" aria-hidden=\"true\"><\/a>6.2 落地所需官方证件与资格<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">证件 / 资格<\/th>\n<th style=\"width:25%\">性质<\/th>\n<th style=\"width:25%\">要点<\/th>\n<th style=\"width:25%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留卡<\/td>\n<td>身份与在留资格凭证<\/td>\n<td>抵达后 14 日内登记；随身携带<\/td>\n<td>出入国在留管理庁（https://www.moj.go.jp/isa/applications/procedures/01-1.html）<\/td>\n<\/tr>\n<tr>\n<td>住民票<\/td>\n<td>住所证明<\/td>\n<td>转入后 14 日内申报；需护照 + 在留卡（或 COE）<\/td>\n<td>総務省（https://www.soumu.go.jp/main_sosiki/jichi_gyousei/busyou/seido/kihon.html）<\/td>\n<\/tr>\n<tr>\n<td>健康保险证<\/td>\n<td>医保凭证<\/td>\n<td>国保 / 被用者两条轨道；自付通常 3 割<\/td>\n<td>厚生労働省（https://www.mhlw.go.jp/stf/seisakunitsuite/benko/hoken_kenkou/index.html）<\/td>\n<\/tr>\n<tr>\n<td>年金手帳<\/td>\n<td>年金凭证<\/td>\n<td>20–60 岁加入义务；脱退一时金需满足条件<\/td>\n<td>日本年金機構（https://www.nenkin.go.jp/n_kaihatu/zenpen/034.html）<\/td>\n<\/tr>\n<tr>\n<td>マイナンバーカード<\/td>\n<td>个人编号卡<\/td>\n<td>行政手续与健保证用<\/td>\n<td>デジタル庁 / 総務省（口径见 12-culture-life）<\/td>\n<\/tr>\n<tr>\n<td>印鉴<\/td>\n<td>认印 / 実印<\/td>\n<td>签约与手续用；认印必备<\/td>\n<td>一般惯例（经验）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>口径提醒：在留カード ≠ 在留資格 ≠ 住民票（身份 / 资格 / 住所证明三者不得混用）；国民健康保険 ≠ 被用者健康保険。<\/p>\n<\/blockquote>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>以下均为「建议 / 推断」，与事实数据分离；不承诺结果。<\/p>\n<\/blockquote>\n<h3 id=\"71-90\"><a id=\"71-行政手续-90-天清单执行顺序\" aria-hidden=\"true\"><\/a>7.1 行政手续 90 天清单（执行顺序）<\/h3>\n<blockquote>\n<p>详见 <a href=\"../../00-decision-hub/reports/2026-11-decision-hub.md\">00-decision-hub<\/a> 落地清单；本主题为执行要点。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">事项<\/th>\n<th style=\"width:34%\">时限<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>抵达时<\/td>\n<td>在留卡领取<\/td>\n<td>机场 / 14 日内<\/td>\n<\/tr>\n<tr>\n<td>14 日内<\/td>\n<td>住民登记、健康保険、年金<\/td>\n<td>14 日内<\/td>\n<\/tr>\n<tr>\n<td>30 日内<\/td>\n<td>银行口座、手机 / 网络<\/td>\n<td>1 个月<\/td>\n<\/tr>\n<tr>\n<td>30–90 日<\/td>\n<td>住房签约、水电燃气开通<\/td>\n<td>1–3 个月<\/td>\n<\/tr>\n<tr>\n<td>90 日内<\/td>\n<td>驾照转换 / 在留资格变更<\/td>\n<td>视驾照进度（→ 10 / 01）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"72\"><a id=\"72-住房执行路径建议\" aria-hidden=\"true\"><\/a>7.2 住房执行路径（建议）<\/h3>\n<ol>\n<li>先算初期费用：敷金 + 礼金 + 仲介手数料 + 保证会社 + 更新料（区间见 3.2），按 4–8 个月房租准备现金。<\/li>\n<li>无保证人时优先询保证会社方案；用国交省「外国人入住円滑化ガイドライン」与业者对话（→ <a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life<\/a> 7.3）。<\/li>\n<li>公营选项：UR 賃貸住宅对外国籍开放，收入基准见登记册 / 12 报告；市営 / 県営住宅走抽选。<\/li>\n<li>签约时序：在留卡 → 住民票 → 印章 → 银行口座 → 口座振替绑定房租与水电气。<\/li>\n<\/ol>\n<h3 id=\"73\"><a id=\"73-公共交通执行路径建议\" aria-hidden=\"true\"><\/a>7.3 公共交通执行路径（建议）<\/h3>\n<ul>\n<li>通勤 / 通学优先办定期券；IC 卡（Suica / PASMO 等）覆盖乘车与电子支付，多数区间互通。<\/li>\n<li>换乘查询用乗換案内应用（时刻与费用）。<\/li>\n<li>⚠ 典型通勤区间定期券月费待核实（需按定居地具体区间查询）。<\/li>\n<\/ul>\n<h3 id=\"74\"><a id=\"74-通信与网络执行路径建议\" aria-hidden=\"true\"><\/a>7.4 通信与网络执行路径（建议）<\/h3>\n<ul>\n<li>刚抵达可先办格安 SIM（在留卡 + 支付手段）；光回线初装常有等待期，搬家前先确认可否「事前转移」。<\/li>\n<li>大手 / 格安 / 光回线具体月费待核实；不可直接比价（回线与品质不同）。<\/li>\n<\/ul>\n<h3 id=\"75\"><a id=\"75-银行与支付执行路径建议\" aria-hidden=\"true\"><\/a>7.5 银行与支付执行路径（建议）<\/h3>\n<ul>\n<li>开户通常需：在留卡 + 住民票 / 住所证明 + 印鉴；部分银行要求在留 6 个月以上（各银行口径不同，待核实）。<\/li>\n<li>推断：邮局银行（ゆうちょ銀行）、部分地方银行与网络银行对外国人较友好，可作过渡。<\/li>\n<li>支付：信用卡、电子マネー（Suica / PayPay 等）、银行振込并行；送金走银行或专业送金服务，汇率与手续费差异大。<\/li>\n<\/ul>\n<h3 id=\"76\"><a id=\"76-水电燃气执行路径建议\" aria-hidden=\"true\"><\/a>7.6 水电燃气执行路径（建议）<\/h3>\n<ul>\n<li>水道：向所在地水道局 / 役所做使用开始申报（入住前可办）。<\/li>\n<li>电气：向电力公司申込，一般入住当日合闸供电、事后补手续（一般惯例，推断待复核）。<\/li>\n<li>燃气：都市ガス需预约上门开栓（推断待复核）；プロパンガス为区域供应商。<\/li>\n<li>搬家时办理旧地址解约与新地址开通，通常通过网络或电话申请。<\/li>\n<\/ul>\n<h3 id=\"77\"><a id=\"77-多语言窗口与个人记录建议\" aria-hidden=\"true\"><\/a>7.7 多语言窗口与个人记录（建议）<\/h3>\n<ul>\n<li>定居地确定后先查本地自治体多语言窗口（清单待补），并回填登记册 #10。<\/li>\n<li>90 天清单按 7.1 顺序执行并逐项记录，个人填写状态回写登记册 #9。<\/li>\n<\/ul>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 官方一手<\/strong>：出入国在留管理庁、総務省、厚生労働省、国土交通省、資源エネルギー庁、日本年金機構、金融庁。<\/li>\n<li><strong>B 机构官网<\/strong>：各银行、携帯运营商（docomo / au / softbank / MVNO）、电力燃气公司。<\/li>\n<li><strong>C 平台抽样<\/strong>：租房费用、通信费用（需回溯官网）；经验类标注个案。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保険自付比例<\/td>\n<td>国保 3 割 ≠ 被用者 3 割（报销范围与后期高龄者不同）<\/td>\n<\/tr>\n<tr>\n<td>租房初期费用<\/td>\n<td>礼金 0–2 个月 ≠ 敷金 0–2 个月 ≠ 更新料 约 1 个月（因地域 / 物件而异）<\/td>\n<\/tr>\n<tr>\n<td>通信费用<\/td>\n<td>大手运营商 ≠ 格安 SIM（回线与品质不同，不可直接比价）<\/td>\n<\/tr>\n<tr>\n<td>银行开户<\/td>\n<td>在留 3 个月以上 ≠ 6 个月以上（各银行口径不同）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"83\"><a id=\"83-未取得--待复核清单逐项给出复核入口\" aria-hidden=\"true\"><\/a>8.3 未取得 / 待复核清单（逐项给出复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>各银行现行在留期限门槛与书类<\/td>\n<td>各银行官网 / 金融庁；回填登记册 #7<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>大手 / 格安 SIM / 光回线具体月费<\/td>\n<td>総務省 / 运营商官网；回填登记册 #6<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>典型通勤区间定期券月费<\/td>\n<td>国土交通省 / 各运营商；回填登记册 #5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>自治体多语言窗口清单<\/td>\n<td>各自治体官网；定居地确定后复核，回填登记册 #10<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>90 天清单个人完成状态<\/td>\n<td>个人记录（00-decision-hub 落地清单）；回填登记册 #9<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>部分房东 / 管理会社不接受外国人<\/td>\n<td>平台抽样核实（推断项）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"84\"><a id=\"84-主要局限\" aria-hidden=\"true\"><\/a>8.4 主要局限<\/h3>\n<ol>\n<li>本基线为<strong>初析级<\/strong>，通信费用 / 银行开户 / 自治体窗口 / 定期券行情的具体现行值未核实。<\/li>\n<li>租房与通信费用因地域与方案差异大，用「区间 / 口径」呈现，不取单一数值。<\/li>\n<li>个人定居地未定，地域差异（如东京 vs 地方）无法收敛。<\/li>\n<\/ol>\n<h3 id=\"85\"><a id=\"85-时间基准声明\" aria-hidden=\"true\"><\/a>8.5 时间基准声明<\/h3>\n<p>本报告数据基准日 2026-11-14；登记册活值基准版本 v2026.11.14_1；⚠ 待核实项在次期或定居地确定后补齐。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手（省厅 / 机构）<\/strong><\/p>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/applications/procedures/01-1.html\">出入国在留管理庁 · 在留卡<\/a> — 2026。<\/li>\n<li><a href=\"https://www.moj.go.jp/isa/\">出入国在留管理庁（ISA 首页）<\/a> — 2026。<\/li>\n<li><a href=\"https://www.soumu.go.jp/main_sosiki/jichi_gyousei/busyou/seido/kihon.html\">総務省 · 住民基本台帳制度<\/a> — 2026。<\/li>\n<li><a href=\"https://www.soumu.go.jp/\">総務省（首页）<\/a> — 2026。<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/benko/hoken_kenkou/index.html\">厚生労働省 · 国民健康保険<\/a> — 2026。<\/li>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省（首页）<\/a> — 2026。<\/li>\n<li><a href=\"https://www.nenkin.go.jp/n_kaihatu/zenpen/034.html\">日本年金機構 · 年金制度<\/a> — 2026。<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構（首页）<\/a> — 2026。<\/li>\n<li><a href=\"https://www.mlit.go.jp/jutakukentiku/house/\">国土交通省 · 住宅<\/a> — 2026。<\/li>\n<li><a href=\"https://www.mlit.go.jp/sogoseisaku/transport/\">国土交通省 · 公共交通<\/a> — 2026。<\/li>\n<li><a href=\"https://www.mlit.go.jp/\">国土交通省（首页）<\/a> — 2026。<\/li>\n<li><a href=\"https://www.soumu.go.jp/johotsusintokei/\">総務省 · 情報通信<\/a> — 2026。<\/li>\n<li><a href=\"https://www.enecho.meti.go.jp/\">資源エネルギー庁 · 電力・ガス<\/a> — 2026。<\/li>\n<li><a href=\"https://www.fsa.go.jp/\">金融庁<\/a> — 2026。<\/li>\n<li><a href=\"https://www.jreast.co.jp/suica/\">JR 東日本 · Suica<\/a> — 2026。<\/li>\n<\/ol>\n<p><strong>只读锚（跨主题）<\/strong><\/p>\n<ol>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>（在留资格制度与申请审查），只读引用。<\/li>\n<li><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>（税制、社保、年金脱退），只读引用。<\/li>\n<li><a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life<\/a>（文化习俗、礼仪、防灾、医疗），只读引用。<\/li>\n<li><a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info<\/a>（地域选择与定居地档案），只读引用。<\/li>\n<li><a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>（驾照路径与费用），只读引用。<\/li>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（落地路径、考试、驾照），只读引用。<\/li>\n<li><a href=\"../../00-decision-hub/reports/2026-11-decision-hub.md\">00-decision-hub<\/a>（落地清单），只读引用。<\/li>\n<\/ol>\n<p><strong>平台抽样 / 经验类（C 级，标注口径）<\/strong><\/p>\n<ol>\n<li>租房平台与比价网站（转载须回溯官网）；在日生活门户经验类，标注个案。<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 199, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "14-life-operations/reports/2026-11-life-operations.html"}}}, "health-wellbeing": {"name": "医疗", "dir": "15-health-wellbeing", "months": {"2026-11": {"title": "医疗·健康·心理 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"医疗健康心理--2026-11-月度报告\" aria-hidden=\"true\"><\/a>医疗·健康·心理 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 个人健康管理\n<strong>受众定位<\/strong>：本人（拟赴日 / 已在日特定技能司机）\n<strong>来源规则<\/strong>：① 厚生労働省 / 日本年金機構官方一手；② 各学会 / 医疗机构官网；③ 多语言医疗支援机构<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势（医保制度框架）<\/a>\n<a href=\"#s3\">三、医疗资源供需与就医费用（核心模块）<\/a>\n<a href=\"#s4\">四、医疗机构与介護设施类型细分<\/a>\n<a href=\"#s5\">五、就医与健康管理的能力要求<\/a>\n<a href=\"#s6\">六、健康相关资格与凭证<\/a>\n<a href=\"#s7\">七、就医落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>核心判断<\/strong>（每条含数据、口径、来源）：<\/p>\n<ol>\n<li><strong>医保是落地第一义务<\/strong>（事实）：住民登记后须加入健康保険（国保或被用者），窗口自付比例通常 <strong>3 割<\/strong>；未加入会累积高额费用。（来源：厚生労働省，2026）<\/li>\n<li><strong>高额疗养费制度是关键兜底<\/strong>（事实）：医疗费超过自付上限时由公费承担差额，上限按年龄与收入分层；⚠ 现行各收入层具体上限额待核实。（来源：厚生労働省，2026）<\/li>\n<li><strong>多语言支援是外国人就医的主要变量<\/strong>（推断）：大型医院与都市圈多语言窗口较完善，地方与中小医院可能仅日语对应；医疗通译需提前确认。（来源：各自治体 / 支援机构，2026）<\/li>\n<li><strong>牙科与精神科部分适用保险<\/strong>（事实）：牙科大部分治疗适用保险，但种植、矫正、部分材料为自付；精神科 / 心疗内科适用保险，但首次可能需初诊料。（来源：日本歯科医師会 / 日本精神神経学会，2026）<\/li>\n<li><strong>心理健康易被忽视<\/strong>（推断）：孤独、文化冲击、语言障碍、过劳是外国劳动者常见风险；精神保健福祉センター与电话相談是兜底渠道。（来源：厚生労働省 / 自治体，2026）<\/li>\n<li><strong>体检与预防是成本最低的健康投资<\/strong>（事实）：雇主 / 自治体实施健康診断，应按时参加；特定技能司机有<strong>適性診断<\/strong>义务。（来源：厚生労働省，2026；→ 01-ssw-driver）<\/li>\n<li><strong>本基线为初析级<\/strong>（事实）：具体费用、自付上限、多语言窗口清单标记「⚠ 待核实」，待次期或定居地确定后补齐。<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<blockquote>\n<p>登记册版本 <strong>v2026.11.14_1<\/strong>；8 项追踪项均无更新，最新值如下（登记册活值优先）。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">追踪项<\/th>\n<th style=\"width:25%\">最新值（来源 / 年份）<\/th>\n<th style=\"width:25%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>医保自付比例与限额<\/td>\n<td>国保 / 被用者通常 3 割；小学生未満 2 割；70–74 岁因收入 1–2 割；⚠ 现行细则待核实 [厚生労働省]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>高额疗养费制度<\/td>\n<td>医疗费超过自付上限时由公费承担差额；上限按年龄与收入分层；⚠ 现行上限额待核实 [厚生労働省]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>就医流程与初诊费用<\/td>\n<td>挂号 → 诊疗 → 处方 → 药房；初诊费用因医院而异；⚠ 行情待核实 [各学会]<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>多语言医疗支援与通译<\/td>\n<td>多语言窗口与医疗通译因自治体 / 医院而异；⚠ 清单待补<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>牙科 / 精神科费用与保险适用<\/td>\n<td>牙科与精神科部分适用保险；⚠ 具体行情待核实<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>心理健康支援<\/td>\n<td>カウンセリング / 精神保健福祉センター / 電話相談；⚠ 渠道清单待补<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>健康診断 / 予防接種<\/td>\n<td>雇主 / 自治体实施健康診断；予防接種按计划；⚠ 外国人对应待核实<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>介護保険要件与费用<\/td>\n<td>40 岁以上加入；介護サービス自付 1–3 割；⚠ 现行细则待核实<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告已修正事实清单，无新增修正。<\/p>\n<h3 id=\"_4\"><a id=\"关键数字卡\" aria-hidden=\"true\"><\/a>关键数字卡<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">数值<\/th>\n<th style=\"width:25%\">口径<\/th>\n<th style=\"width:25%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>窗口自付比例<\/td>\n<td>通常 3 割（小学生未満 2 割；70–74 岁因收入 1–2 割）<\/td>\n<td>国保 / 被用者<\/td>\n<td>厚生労働省，2026<\/td>\n<\/tr>\n<tr>\n<td>高额疗养费<\/td>\n<td>超过上限部分公费承担；⚠ 现行上限额待核实<\/td>\n<td>按年龄 / 收入分层<\/td>\n<td>厚生労働省，2026<\/td>\n<\/tr>\n<tr>\n<td>介護保険加入<\/td>\n<td>40 岁以上<\/td>\n<td>介護保険<\/td>\n<td>厚生労働省，2026<\/td>\n<\/tr>\n<tr>\n<td>急救电话<\/td>\n<td>119<\/td>\n<td>救急搬送<\/td>\n<td>消防庁，2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势医保制度框架\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势（医保制度框架）<\/h2>\n<h3 id=\"21\"><a id=\"21-两大体系与一层高龄者制度\" aria-hidden=\"true\"><\/a>2.1 两大体系与一层高龄者制度<\/h3>\n<ul>\n<li><strong>国民健康保険<\/strong>（国保）：面向非公司职员、自营业、无业者等居民，自付通常 <strong>3 割<\/strong>；由市区町村运营。（事实）[厚生労働省]<\/li>\n<li><strong>被用者健康保険<\/strong>：公司职员加入，自付通常 3 割，由公司与个人分担保费。（事实）[厚生労働省]<\/li>\n<li><strong>后期高龄者医療<\/strong>：75 岁以上（或 65–74 岁有一定障碍者）加入，自付比例更低。（事实）[厚生労働省]<\/li>\n<\/ul>\n<h3 id=\"22\"><a id=\"22-高额疗养费制度\" aria-hidden=\"true\"><\/a>2.2 高额疗养费制度<\/h3>\n<ul>\n<li>医疗费超过自付上限时，由公费承担差额；上限按<strong>年龄与收入<\/strong>分层。（事实）[厚生労働省]<\/li>\n<li>⚠ <strong>待核实<\/strong>：现行各收入层的具体上限额。<\/li>\n<li>与<strong>医療費控除<\/strong>（税制，→ 07-economy-finance）不同：前者为当月报销，后者为年度报税，二者不得混用。<\/li>\n<\/ul>\n<h3 id=\"23\"><a id=\"23-外国人加入与制度分层\" aria-hidden=\"true\"><\/a>2.3 外国人加入与制度分层<\/h3>\n<ul>\n<li>住民登记后须办理健康保険加入；在留卡与住民票为必要书类。（事实）[厚生労働省 / 14-life-operations]<\/li>\n<li>短期停留与特定活动资格的医疗保障范围可能不同。（推断）<\/li>\n<li>制度分层：<strong>医保 / 医疗供给 / 精神健康 / 介護福祉<\/strong>四层。<\/li>\n<\/ul>\n<h3 id=\"24\"><a id=\"24-政策改定触发器\" aria-hidden=\"true\"><\/a>2.4 政策改定触发器<\/h3>\n<ul>\n<li>医保制度改定（自付比例、高额疗养费、后期高龄者）→ 本报告模块二；<\/li>\n<li>医疗费 / 药价改定 → 模块三；<\/li>\n<li>多语言医疗支援制度变更 → 模块三；<\/li>\n<li>精神科 / 牙科 / 分娩支援政策变更 → 模块四；<\/li>\n<li>介護保険制度变更 → 模块七；<\/li>\n<li>个人健康情况变化（伤病 / 家族）→ 事件触发。<\/li>\n<\/ul>\n<p>无触发器命中且窗口未到时<strong>不启动<\/strong>；不得为制造变化而虚构变化。<\/p>\n<h3 id=\"25\"><a id=\"25-术语口径区分\" aria-hidden=\"true\"><\/a>2.5 术语口径区分<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">易混概念<\/th>\n<th style=\"width:50%\">区分<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>国民健康保険 / 被用者健康保険 / 后期高龄者医療<\/td>\n<td>加入主体与自付不同，三者不混用<\/td>\n<\/tr>\n<tr>\n<td>健康保険証 / マイナンバーカード<\/td>\n<td>保险证 vs 身份编号卡<\/td>\n<\/tr>\n<tr>\n<td>高額療養費制度 / 医療費控除<\/td>\n<td>当月报销 / 限度额适用 vs 年度税制<\/td>\n<\/tr>\n<tr>\n<td>精神科 / 心疗内科<\/td>\n<td>重笃な精神疾患 vs 轻症 / 心理因素<\/td>\n<\/tr>\n<tr>\n<td>健康診断 / 人間ドック<\/td>\n<td>雇主 / 自治体实施 vs 自费综合检查<\/td>\n<\/tr>\n<tr>\n<td>介護保険 / 医療保険<\/td>\n<td>40 岁以上加入的介护制度 vs 治疗保险<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s3\"><a id=\"三医疗资源供需与就医费用核心模块\" aria-hidden=\"true\"><\/a>三、医疗资源供需与就医费用（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-供给面\" aria-hidden=\"true\"><\/a>3.1 供给面<\/h3>\n<ul>\n<li><strong>病床<\/strong>：全国病院一般病床 <strong>879,728 床<\/strong>（厚生労働省 令和 6 年医療施設調査，2024-10-01）。（事实，→ 13-regional-info）<\/li>\n<li><strong>医师<\/strong>：人口 10 万対医師数（従業地 / 居住地口径须区分）具体数值待核验；医师向大都市圈集中，地方都市的夜间救急 / 专科就医半径需先查到二次医疗圈。（事实 + 推断，→ 13-regional-info）<\/li>\n<li><strong>介護<\/strong>：介護保険 40 岁以上加入；介護サービス自付 1–3 割。（事实）[厚生労働省]<\/li>\n<li>地域间公共服务差异（医疗 / 教育资源地域差）需纳入个人选址判断。（推断，→ 13-regional-info）<\/li>\n<\/ul>\n<h3 id=\"32\"><a id=\"32-费用面\" aria-hidden=\"true\"><\/a>3.2 费用面<\/h3>\n<ul>\n<li><strong>就医流程<\/strong>：挂号 → 诊疗 → 处方 → 药房配药；部分医院需初诊料。（事实）<\/li>\n<li><strong>自付<\/strong>：适用保险后自付 3 割；初诊费用与检查费因医院而异。（事实；⚠ 行情待核实）<\/li>\n<li><strong>高额疗养费<\/strong>：医疗费超过自付上限时由公费承担差额，是大病负担的关键兜底。（事实；⚠ 现行上限额待核实）<\/li>\n<li><strong>多语言<\/strong>：都市圈大型医院较完善；地方中小医院可能仅日语；⚠ 清单待补。<\/li>\n<\/ul>\n<h3 id=\"33\"><a id=\"33-净负担口径\" aria-hidden=\"true\"><\/a>3.3 净负担口径<\/h3>\n<ul>\n<li>窗口自付 = 医疗费 × 自付比例；单月超过高额疗养费上限部分由公费承担。<\/li>\n<li>与<strong>医療費控除<\/strong>（年度税制）分离计算，不合并、不互抵。<\/li>\n<\/ul>\n<h3 id=\"34\"><a id=\"34-口径并列不合并不取均值\" aria-hidden=\"true\"><\/a>3.4 口径并列（不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自付比例<\/td>\n<td>国保 3 割 ≠ 被用者 3 割（年龄 / 收入 / 报销范围不同）<\/td>\n<\/tr>\n<tr>\n<td>初诊费用<\/td>\n<td>医院自由定价 ≠ 保险适用（自付 3 割后）<\/td>\n<\/tr>\n<tr>\n<td>体检<\/td>\n<td>健康診断（保险 / 雇主）≠ 人間ドック（自费）<\/td>\n<\/tr>\n<tr>\n<td>心理健康<\/td>\n<td>精神科（医疗）≠ カウンセリング（非医疗）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s4\"><a id=\"四医疗机构与介護设施类型细分\" aria-hidden=\"true\"><\/a>四、医疗机构与介護设施类型细分<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">类型<\/th>\n<th style=\"width:25%\">保险适用<\/th>\n<th style=\"width:25%\">费用 / 自付要点<\/th>\n<th style=\"width:25%\">多语言<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>病院 / 診療所<\/td>\n<td>适用<\/td>\n<td>初诊料因医院而异（⚠ 行情待核实）<\/td>\n<td>因医院而异<\/td>\n<\/tr>\n<tr>\n<td>歯科医院<\/td>\n<td>大部分适用<\/td>\n<td>种植、矫正、部分材料为自付（⚠ 行情待核实）<\/td>\n<td>因医院而异<\/td>\n<\/tr>\n<tr>\n<td>精神科 / 心疗内科<\/td>\n<td>适用<\/td>\n<td>首次可能需初诊料与较长诊察时间（⚠ 待核实）<\/td>\n<td>因医院而异<\/td>\n<\/tr>\n<tr>\n<td>分娩（助产所 / 产科）<\/td>\n<td>适用<\/td>\n<td>有<strong>出産育児一時金<\/strong>一次性补助（→ 08-visa-immigration）<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>介護保険施設 / 福祉设施<\/td>\n<td>介護服务适用<\/td>\n<td>自付 1–3 割；要介護認定为前提<\/td>\n<td>因设施而异<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>外国人对应<\/strong>：多语言窗口与医疗通译因机构而异；部分自治体 / 医院提供多语言通译服务，需提前预约。（⚠ 待核实）<\/li>\n<li><strong>未取得项<\/strong>：各类型常见治疗的自付行情；产前检查与多语言支援的外国人对应；障碍福祉（障害者手帳等）的具体服务。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s5\"><a id=\"五就医与健康管理的能力要求\" aria-hidden=\"true\"><\/a>五、就医与健康管理的能力要求<\/h2>\n<h3 id=\"51\"><a id=\"51-语言与沟通\" aria-hidden=\"true\"><\/a>5.1 语言与沟通<\/h3>\n<ul>\n<li>日语沟通是就医的基础；医疗通译（医療通訳 / 多言語診療）需提前确认是否提供与预约。（事实；⚠ 待核实）<\/li>\n<li>就诊时携带健康保険証与在留卡；处方笺交付后 <strong>4 日以内<\/strong> 有效（依据保険医療機関及び保険医療養担当規則第 20 条・第 21 条，→ 12-culture-life）。<\/li>\n<\/ul>\n<h3 id=\"52\"><a id=\"52-手续与流程\" aria-hidden=\"true\"><\/a>5.2 手续与流程<\/h3>\n<ul>\n<li>挂号 → 诊疗 → 处方 → 药房配药；保留领收书与明细。<\/li>\n<li>急救：<strong>119<\/strong> 为急救电话；救急病院按轮值制。（事实）[消防庁 / 厚生労働省]<\/li>\n<li>夜间 / 假日救急咨询：#7119（自治体设置，截至令和 6 年 11 月共 36 地域，覆盖 36/47 都道府县，→ 12-culture-life）。<\/li>\n<\/ul>\n<h3 id=\"53\"><a id=\"53-健康管理与自我觉察\" aria-hidden=\"true\"><\/a>5.3 健康管理与自我觉察<\/h3>\n<ul>\n<li>常见风险：孤独、文化冲击、语言障碍、过劳。（事实 / 推断）<\/li>\n<li>支援渠道：精神保健福祉センター（自治体）；电话相談（いのちの電話 等）；カウンセリング（非医疗，自费）；雇主 / 支援机关的相談窓口。（⚠ 各渠道的多语言对应与费用待核实）<\/li>\n<li>特定技能司机：<strong>適性診断<\/strong>义务（→ 01-ssw-driver）；健康診断按时参加并保留记录。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s6\"><a id=\"六健康相关资格与凭证\" aria-hidden=\"true\"><\/a>六、健康相关资格与凭证<\/h2>\n<h3 id=\"61\"><a id=\"61-本人持有凭证\" aria-hidden=\"true\"><\/a>6.1 本人持有凭证<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">凭证<\/th>\n<th style=\"width:33%\">用途<\/th>\n<th style=\"width:34%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保険証<\/td>\n<td>就医时窗口结算<\/td>\n<td>与マイナンバーカード区分<\/td>\n<\/tr>\n<tr>\n<td>介護保険被保险者证<\/td>\n<td>40 岁以上介護保险凭证<\/td>\n<td>介護保険 ≠ 医療保険<\/td>\n<\/tr>\n<tr>\n<td>障害者手帳<\/td>\n<td>障碍福祉服务<\/td>\n<td>⚠ 取得要件与多语言对应待核实<\/td>\n<\/tr>\n<tr>\n<td>精神障害者保健福祉手帳<\/td>\n<td>精神障碍者保健福祉<\/td>\n<td>⚠ 取得要件与多语言对应待核实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"62\"><a id=\"62-资格边界\" aria-hidden=\"true\"><\/a>6.2 资格边界<\/h3>\n<ul>\n<li>本主题<strong>不研究医疗执业资格<\/strong>（医师 / 歯科医师 / 看护师等），也不提供治疗建议。<\/li>\n<li>介護行业从业资格（如介護福祉士等）不在本主题范围；本主题只覆盖本人作为<strong>被保险者 / 患者<\/strong>的保障与使用。<\/li>\n<li>多语言医疗通译服务的提供主体因自治体 / 医院而异，非全国统一资格。（⚠ 待核实）<\/li>\n<\/ul>\n<h3 id=\"63\"><a id=\"63-待核实\" aria-hidden=\"true\"><\/a>6.3 待核实<\/h3>\n<ul>\n<li>障害者手帳 / 精神障害者保健福祉手帳的取得要件、认定流程与外国人对应；<\/li>\n<li>介護保険被保险者证的发证时点与所需书类。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s7\"><a id=\"七就医落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就医落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本章为「建议」，与事实数据分离；不替代医疗诊断。<\/p>\n<\/blockquote>\n<h3 id=\"71\"><a id=\"71-落地时序建议\" aria-hidden=\"true\"><\/a>7.1 落地时序（建议）<\/h3>\n<ol>\n<li><strong>住民登记后立即<\/strong>：办理健康保険加入，确认保险证发放时点（→ 14-life-operations）。<\/li>\n<li><strong>抵达 1 个月内<\/strong>：确认居住地域的かかりつけ病院与夜间救急；记录附近药局。<\/li>\n<li><strong>抵达前<\/strong>：建立至少一个可联系的心理健康支援渠道；出现持续失眠 / 情绪低落时及早就医。（推断）<\/li>\n<li><strong>按雇主 / 自治体安排<\/strong>：按时参加健康診断与特定技能適性診断，保留记录。<\/li>\n<\/ol>\n<h3 id=\"72\"><a id=\"72-就医实务要点建议\" aria-hidden=\"true\"><\/a>7.2 就医实务要点（建议）<\/h3>\n<ul>\n<li>就诊携带健康保険証与在留卡；处方笺 4 日以内交付；保留领收书与费用明细。<\/li>\n<li>大病就医前先了解高额疗养费上限与申请方式，避免一次性垫付压力。<\/li>\n<li>牙科 / 精神科就诊前确认保险适用项目与自付行情；首次就诊可能需初诊料。<\/li>\n<li>需要通译时，提前向自治体 / 医院确认是否提供与预约方式。<\/li>\n<\/ul>\n<h3 id=\"73\"><a id=\"73-长期兜底建议\" aria-hidden=\"true\"><\/a>7.3 长期兜底（建议）<\/h3>\n<ul>\n<li>介護保険 40 岁以上加入，非近期必需但属长期兜底知识；<\/li>\n<li>生活保护制度（→ 08-visa-immigration）与障碍福祉服务（⚠ 待核实）作为困难时的兜底索引。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：厚生労働省、日本年金機構、消防庁、内閣府（介護）。<\/li>\n<li><strong>B 级（学会 / 医疗机构官网）<\/strong>：日本医師会、日本歯科医師会、日本精神神経学会。<\/li>\n<li><strong>C 级（平台抽样）<\/strong>：本主题登记册无此类指标。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-主要局限\" aria-hidden=\"true\"><\/a>8.2 主要局限<\/h3>\n<ol>\n<li>本报告为<strong>初析级<\/strong>，自付上限、初诊费用、多语言窗口、心理健康渠道的具体值未核实；<\/li>\n<li>医疗费用因医院与病种差异大，需用「区间 / 口径」呈现；<\/li>\n<li>个人定居地未定，地域差异无法收敛。<\/li>\n<\/ol>\n<h3 id=\"83\"><a id=\"83-口径差异说明\" aria-hidden=\"true\"><\/a>8.3 口径差异说明<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">并列口径<\/th>\n<th style=\"width:34%\">处理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自付比例<\/td>\n<td>国保 3 割 ≠ 被用者 3 割<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>高额疗养费<\/td>\n<td>当月报销 ≠ 医療費控除（年度税制）<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>心理健康<\/td>\n<td>精神科（医疗）≠ カウンセリング（非医疗）<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<tr>\n<td>体检<\/td>\n<td>健康診断 ≠ 人間ドック<\/td>\n<td>并列呈现<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"84\"><a id=\"84-待复核清单逐项复核入口\" aria-hidden=\"true\"><\/a>8.4 待复核清单（逐项复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>自付比例细则<\/td>\n<td>厚生労働省 健康保険页<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>高额疗养费现行上限额<\/td>\n<td>厚生労働省 高額療養費制度页（12-culture-life 手册载令和 8 年 8 月新制度官方示例，待本主题核验后回写）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>多语言医疗窗口清单<\/td>\n<td>各自治体 / 医疗机构官网<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>心理健康渠道清单<\/td>\n<td>厚生労働省 / 自治体<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>初诊费用行情<\/td>\n<td>医疗机构 / 学会<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>精神科初诊费用与候诊时间<\/td>\n<td>日本精神神経学会 / 医疗机构<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>介護自付细则<\/td>\n<td>厚生労働省 介護保険页<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>外国人体检 / 予防接種对应<\/td>\n<td>厚生労働省 / 自治体<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"85\"><a id=\"85-时间基准与来源语言\" aria-hidden=\"true\"><\/a>8.5 时间基准与来源语言<\/h3>\n<ul>\n<li>数据基准日：<strong>2026-11-14<\/strong>；登记册版本 <strong>v2026.11.14_1<\/strong>。<\/li>\n<li>来源语言规则：日文官方一手优先；医疗机构 / 学会官网次之；中文来源仅作线索。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<h3 id=\"_13\"><a id=\"官方一手\" aria-hidden=\"true\"><\/a>官方一手<\/h3>\n<ol>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/benko/hoken_kenkou/index.html\">厚生労働省 · 健康保険<\/a> — 2026<\/li>\n<li><a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/kenkouhoken24.html\">厚生労働省 · 高額療養費制度<\/a> — 2026<\/li>\n<li><a href=\"https://www.nenkin.go.jp/\">日本年金機構<\/a> — 2026<\/li>\n<li><a href=\"https://www.fdma.go.jp/\">消防庁 · 救急<\/a> — 2026<\/li>\n<li><a href=\"https://www8.cao.go.jp/kaigo/\">内閣府 · 介護<\/a> — 2026<\/li>\n<\/ol>\n<h3 id=\"_14\"><a id=\"学会--医疗机构\" aria-hidden=\"true\"><\/a>学会 / 医疗机构<\/h3>\n<ol>\n<li><a href=\"https://www.med.or.jp/\">日本医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.jda.or.jp/\">日本歯科医師会<\/a> — 2026<\/li>\n<li><a href=\"https://www.neuropsychology.jp/\">日本精神神経学会<\/a> — 2026<\/li>\n<\/ol>\n<h3 id=\"_15\"><a id=\"跨主题引用只读\" aria-hidden=\"true\"><\/a>跨主题引用（只读）<\/h3>\n<ol>\n<li><a href=\"../../14-life-operations/reports/2026-11-life-operations.md\">14-life-operations · 2026-11 月度报告<\/a> — 保险加入手续 / 住房与行政<\/li>\n<li><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance · 2026-11 月度报告<\/a> — 社保费 / 医疗費控除<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration · 2026-11 月度报告<\/a> — 在留 / 家属 / 生活保护 / 出産育児一時金<\/li>\n<li><a href=\"../../12-culture-life/reports/2026-11-culture-life.md\">12-culture-life · 2026-11 月度报告<\/a> — 就医全流程 / 体检 / 心理健康资源<\/li>\n<li><a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info · 2026-11 月度报告<\/a> — 地域医疗资源差异<\/li>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver · 2026-11 月度报告<\/a> — 特定技能司机適性診断<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 193, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "15-health-wellbeing/reports/2026-11-health-wellbeing.html"}}}, "exit-transition-return": {"name": "退出·转型·回国", "dir": "16-exit-transition-return", "months": {"2026-11": {"title": "退出·转型·回国 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"退出转型回国--2026-11-月度报告\" aria-hidden=\"true\"><\/a>退出·转型·回国 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）· 个人执行层\n<strong>受众定位<\/strong>：本人（已在日或拟赴日的外国人，以特定技能司机为参照），需要评估退出当前岗位 / 行业、在日期间转型或最终回国。\n<strong>来源规则<\/strong>：① 出入国在留管理庁（isa.go.jp / moj.go.jp）、法務省、e-Gov 法令检索 ＞ ② 厚生労働省、日本年金機構、ハローワーク ＞ ③ 国税庁、総務省、地方自治体 ＞ ④ 银行 / 运营商 / 运输 / 车辆相关机构官网（仅执行流程）＞ ⑤ 媒体（仅线索，引用须回溯官方原文）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、退出·转型·回国制度台账与监测机制<\/a>\n<a href=\"#s3\">三、制度框架与三段路径<\/a>\n<a href=\"#s4\">四、退出与转型政策逐条解读<\/a>\n<a href=\"#s5\">五、个人场景影响矩阵<\/a>\n<a href=\"#s6\">六、退出·转型·回国行动建议（建议章）<\/a>\n<a href=\"#s7\">七、制度变更与个人行动时间线<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>核心判断<\/strong>（编号条目）：<\/p>\n<ol>\n<li><strong>退出、转型、回国是三件不同的事<\/strong>（事实）：退職是劳动关系终止，在留資格変更 / 取消是资格状态变化，回国是离境与结算——三者不可互相替代。<\/li>\n<li><strong>退出阶段的关键是「资格状态 + 保险衔接」<\/strong>（推断）：退職本身不会自动取消在留资格，但长期不从事原业务、未转换资格或未办理保险退出，会分别触发不同风险。<\/li>\n<li><strong>转型阶段的关键是「新资格要件 + 业务限制」<\/strong>（推断）：能否继续留在日本，取决于新雇主、新资格、语言 / 资格条件与特定技能 2 号限制。<\/li>\n<li><strong>回国阶段的关键是「钱、身份、生活三条线并行」<\/strong>（推断）：年金脱退、确定申告、住民税、在留卡与再入国、退室与车辆 / 通信 / 银行账户应在离境前完成。<\/li>\n<li><strong>本基线为初析级<\/strong>（事实）：本主题只研究执行层；税制、年金计算与资格取消制度正文分别引用 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a> / <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>，不重复展开；具体金额 / 期限 / 要件统一标「⚠ 待核实」。<\/li>\n<\/ol>\n<p><strong>三段路径关键判断<\/strong>：退出决定「资格与保险状态」；转型决定「能否继续留日」；回国决定「离境前钱、身份与生活如何结算」。<\/p>\n<p><strong>条件化建议<\/strong>：见第六节（建议章），与事实分离；本主题不预设个人 Go / No-Go。<\/p>\n<p><strong>关键待核验项<\/strong>：健康保険任意継続期限与保险料、厚生年金脱退书类与窗口、在留資格取消 / 変更 / 特定活動申请时点、帰国前確定申告期限、退室解約预告期（详见第八节待复核清单）。<\/p>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>本主题为首期基线，登记册 12+1 项指标均为首值；除第 13 项（来源治理，复核中）外，各执行项均标「⚠ 待核实」，截至 2026-11-14 无更新。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:16%\">#<\/th>\n<th style=\"width:16%\">指标<\/th>\n<th style=\"width:16%\">研究阶段<\/th>\n<th style=\"width:16%\">最新值 / 规则<\/th>\n<th style=\"width:16%\">来源机构<\/th>\n<th style=\"width:20%\">核验状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>退職与労働条件终止规则<\/td>\n<td>退出<\/td>\n<td>退職区分・退職事由・退職予告等依劳动基准法与契约；⚠ 具体通知书类与窗口待核实<\/td>\n<td>厚生労働省 / e-Gov<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>雇用保険 / 失業給付衔接<\/td>\n<td>退出<\/td>\n<td>退職后符合受给资格者可申请失业给付；⚠ 受给期间・手続期限・必要书类待核实<\/td>\n<td>ハローワーク / 厚生労働省<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>健康保険任意継続要件与期限<\/td>\n<td>退出<\/td>\n<td>满足条件者可申请任意继续；⚠ 申请期限、继续期间、保险料与必要书类待核实<\/td>\n<td>日本年金機構<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>国民健康保険 / 被用者保険退出<\/td>\n<td>退出<\/td>\n<td>退职后须办理退出并转入住民保险或任意继续；⚠ 各自治体窗口与书类待核实<\/td>\n<td>厚生労働省 / 地方自治体<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>厚生年金脱退一时金申请资格、书类、时限与复核入口<\/td>\n<td>回国<\/td>\n<td>满足加入期间・未领取年金・未在日住址等条件者可申请；⚠ 具体金额计算、书类清单、申请窗口待核实<\/td>\n<td>日本年金機構<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>年金・社保后续纳付与永住 / 归化影响<\/td>\n<td>退出 / 回国<\/td>\n<td>脱退后仍可能有住民税・年金后续纳付义务；⚠ 具体判断基准待核实<\/td>\n<td>日本年金機構 / 08-visa-immigration<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>在留資格取消・変更・特定活動衔接<\/td>\n<td>退出 / 转型<\/td>\n<td>资格取消、变更与特定活動为不同程序；⚠ 具体申请时点、必要书类与审查基准待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>特定技能 1 号业务限制与 2 号路径<\/td>\n<td>转型<\/td>\n<td>1 号有业务限制与在留上限；2 号限定分野，自动车运送业无 2 号；⚠ 最新分野清单与变更适用时间按 08 最新报告核验<\/td>\n<td>出入国在留管理庁 / ssw.go.jp<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>転職与资格外活动边界<\/td>\n<td>转型<\/td>\n<td>転職须在许可范围内；资格外活动须另获许可；⚠ 个别许可与时间上限待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>帰国前確定申告与住民税 / 所得税<\/td>\n<td>回国<\/td>\n<td>归国前后须确认所得税确定申报、住民税与转出申报；⚠ 具体申报期限・分离课税・届出书类待核实<\/td>\n<td>国税庁 / 総務省 / 地方自治体<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>在留卡返还・再入国許可・みなし再入国<\/td>\n<td>回国<\/td>\n<td>再入国許可与みなし再入国为不同制度；⚠ 在留卡处理、有效期与再入国条件待核实<\/td>\n<td>出入国在留管理庁<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>退室・解約・车辆・通信・银行账户清理<\/td>\n<td>回国<\/td>\n<td>退室・契约解除・车辆处置与账户清理须在离境前完成；⚠ 解约预告期・车辆手続・账户关闭条件按各机构最新页核验<\/td>\n<td>国土交通省 / 各机构官网 / 地方自治体<\/td>\n<td>⚠ 待核实<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>官方来源更新与口径冲突<\/td>\n<td>全阶段<\/td>\n<td>逐条登记版本日期与口径冲突，不取均值<\/td>\n<td>全来源<\/td>\n<td>复核中<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版为首期基线（2026-11-14）复用生成；历史报告无已修正事实清单可继承，无新增修正。执行项「⚠ 待核实」在次期或事件触发后补齐。<\/p>\n<h2 id=\"s2\"><a id=\"二退出转型回国制度台账与监测机制\" aria-hidden=\"true\"><\/a>二、退出·转型·回国制度台账与监测机制<\/h2>\n<p><strong>制度台账（来源治理）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">领域<\/th>\n<th style=\"width:25%\">官方来源<\/th>\n<th style=\"width:25%\">监测内容<\/th>\n<th style=\"width:25%\">更新节奏<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留・资格<\/td>\n<td>出入国在留管理庁 / 法務省 / e-Gov<\/td>\n<td>取消、変更、特定活動、再入国、在留卡<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>劳动・保险<\/td>\n<td>厚生労働省 / 日本年金機構 / ハローワーク<\/td>\n<td>退職、雇用保険、健康保険任意継続、被用者保険退出<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>年金・脱退<\/td>\n<td>日本年金機構<\/td>\n<td>厚生年金脱退一时金申请资格、书类、时限<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>税务・住民<\/td>\n<td>国税庁 / 総務省 / 地方自治体<\/td>\n<td>帰国前確定申告、住民税、所得税、転出届<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<tr>\n<td>生活清理<\/td>\n<td>各机构官网 / 地方自治体<\/td>\n<td>退室、解約、车辆、通信、银行账户<\/td>\n<td>事件触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>监测节拍<\/strong>：事件触发单份解读 + 年度台账复盘；个人情况变化时启动个人情况变化件。无触发器命中且窗口未到时不启动新解读；不得为制造变化而虚构变化。<\/p>\n<p><strong>触发器<\/strong>：<\/p>\n<ul>\n<li>退職・労働条件・雇用保険改定；<\/li>\n<li>健康保険任意継続要件 / 期限改定；<\/li>\n<li>厚生年金脱退要件 / 手续改定；<\/li>\n<li>在留資格取消・変更・特定活動规则改定；<\/li>\n<li>特定技能 2 号路径 / 业务限制改定；<\/li>\n<li>転職・资格外活动规则改定；<\/li>\n<li>帰国前確定申告・住民税 / 所得税规则改定；<\/li>\n<li>退室・解約・车辆・通信规则改定；<\/li>\n<li>个人情况变化（资格 / 雇主 / 家庭 / 资产 / 离境计划）。<\/li>\n<\/ul>\n<p><strong>登记册字段<\/strong>：<a href=\"../data/exit_transition_return_indicator_registry.md\">data/exit_transition_return_indicator_registry.md<\/a> 维护指标编号、指标、研究阶段、口径、最新值 / 规则、来源机构、来源 URL、版本 / 发布日期、核验状态、关联章节、更新时间；活值统一维护于登记册，prompt 模板内不填活值；台账修改采用增量方式，保留历史值，不覆盖。<\/p>\n<p><strong>观察项与触发器状态<\/strong>：首要待核实 = 各制度的现行书类、期限、金额与窗口口径；触发器结论 = 首期为空，待事件触发后逐项登记。<\/p>\n<h2 id=\"s3\"><a id=\"三制度框架与三段路径\" aria-hidden=\"true\"><\/a>三、制度框架与三段路径<\/h2>\n<h3 id=\"31\"><a id=\"31-三段路径\" aria-hidden=\"true\"><\/a>3.1 三段路径<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">核心问题<\/th>\n<th style=\"width:34%\">关键制度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退出<\/td>\n<td>当前轨道如何合法、低损失地结束？<\/td>\n<td>退職、雇用保険、健康保険任意継続、被用者保険退出、在留资格状态<\/td>\n<\/tr>\n<tr>\n<td>转型<\/td>\n<td>不退出日本时还有哪些路？<\/td>\n<td>在留資格変更、特定活動、其他就労资格、転職边界、语言 / 资格补强、2 号限制<\/td>\n<\/tr>\n<tr>\n<td>回国<\/td>\n<td>最终离境前后的手续与钱如何结算？<\/td>\n<td>年金脱退执行、帰国前確定申告、在留卡、再入国、退室、通信 / 银行 / 车辆<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"32\"><a id=\"32-制度关系推断\" aria-hidden=\"true\"><\/a>3.2 制度关系（推断）<\/h3>\n<pre><code class=\"language-text\">退職\n ├─ 雇用保険 → 失业给付\n ├─ 健康保険任意継続 ↔ 国民健康保険\n └─ 在留资格状态 → 変更 / 特定活動 / 取消风险\n转型\n ├─ 新雇主 / 新资格\n ├─ 特定技能 2 号（限定分野）\n └─ 転職边界 / 资格外活动\n回国\n ├─ 年金脱退执行\n ├─ 确定申告 / 住民税 / 転出届\n ├─ 在留卡 / 再入国\n └─ 退室 / 解約 / 车辆 / 账户\n<\/code><\/pre>\n<h3 id=\"33\"><a id=\"33-跨主题分工只读引用\" aria-hidden=\"true\"><\/a>3.3 跨主题分工（只读引用）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主题<\/th>\n<th style=\"width:33%\">本主题只读引用<\/th>\n<th style=\"width:34%\">本主题主责<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a><\/td>\n<td>税制、年金制度、脱退金额计算口径<\/td>\n<td>退职前后的税务结算、年金脱退、保险衔接执行<\/td>\n<\/tr>\n<tr>\n<td><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a><\/td>\n<td>永住、归化、在留资格取消 / 再入国制度正文<\/td>\n<td>退出时点如何申请与衔接<\/td>\n<\/tr>\n<tr>\n<td><a href=\"../../14-life-operations/reports/2026-11-life-operations.md\">14-life-operations<\/a><\/td>\n<td>赴日落地、保险加入、住房与行政 90 天清单<\/td>\n<td>退室、解約、离境前住所 / 通信 / 银行 / 车辆清理<\/td>\n<\/tr>\n<tr>\n<td><a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a><\/td>\n<td>求职、薪资、晋升、转职知识手册<\/td>\n<td>司机岗位退出条件、转型与资格外活动边界<\/td>\n<\/tr>\n<tr>\n<td><a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a><\/td>\n<td>法规条文深度解读<\/td>\n<td>本主题只写制度要点与流程<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四退出与转型政策逐条解读\" aria-hidden=\"true\"><\/a>四、退出与转型政策逐条解读<\/h2>\n<h3 id=\"41\"><a id=\"41-退職与労働条件终止\" aria-hidden=\"true\"><\/a>4.1 退職与労働条件终止<\/h3>\n<ul>\n<li><strong>退職<\/strong>是劳动者与雇主之间劳动关系的终止，依合意、解雇或定年发生；<strong>退去強制<\/strong>是入管法上的强制离境，二者不得混用（事实）。<\/li>\n<li>退職后需确认：退職日与最终出勤日、退職金、雇用保険受给资格、健康保険处理、在留资格状态（推断）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：退職手続的具体书类、预告期、窗口与外国人专属口径，须按厚生労働省与雇主规则核验。<\/li>\n<li>来源：厚生労働省 / e-Gov。<\/li>\n<\/ul>\n<h3 id=\"42\"><a id=\"42-雇用保険--失業給付\" aria-hidden=\"true\"><\/a>4.2 雇用保険 / 失業給付<\/h3>\n<ul>\n<li>退職后符合受给资格者可申请失业给付（事实）[ハローワーク]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：受给期间、手続期限、必要书类、再就业活动要求。<\/li>\n<li>来源：ハローワーク <a href=\"https://www.mhlw.go.jp/stf/hellowork/\">https://www.mhlw.go.jp/stf/hellowork/<\/a>。<\/li>\n<\/ul>\n<h3 id=\"43\"><a id=\"43-健康保険任意継続\" aria-hidden=\"true\"><\/a>4.3 健康保険任意継続<\/h3>\n<ul>\n<li>被用者保险退职后满足条件者可申请任意继续；该制度是<strong>被用者保险继续<\/strong>，不是国民健康保険加入（事实）[日本年金機構]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：申请期限、继续期间、保险料与必要书类。<\/li>\n<li>来源：日本年金機構 <a href=\"https://www.nenkin.go.jp/\">https://www.nenkin.go.jp/<\/a>。<\/li>\n<\/ul>\n<h3 id=\"44\"><a id=\"44-国民健康保険--被用者保険退出\" aria-hidden=\"true\"><\/a>4.4 国民健康保険 / 被用者保険退出<\/h3>\n<ul>\n<li>被用者保险退职后须办理退出，并转入住民保险或任意继续（推断）[厚生労働省]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：各自治体窗口、书类与切换时点。<\/li>\n<li>来源：厚生労働省 <a href=\"https://www.mhlw.go.jp/\">https://www.mhlw.go.jp/<\/a> / 地方自治体。<\/li>\n<\/ul>\n<h3 id=\"45\"><a id=\"45-在留资格状态取消--変更--特定活動\" aria-hidden=\"true\"><\/a>4.5 在留资格状态（取消 / 変更 / 特定活動）<\/h3>\n<ul>\n<li><strong>在留資格取消 ≠ 在留資格変更<\/strong>（事实）：取消是资格丧失；变更是资格切换。<\/li>\n<li><strong>特定活動 ≠ 技能実習<\/strong>（事实）：特定活動是告示指定的个别活动；技能実習是独立的在留资格。<\/li>\n<li>退職本身不等于在留资格取消；但长期不从事原业务、未转换资格或未按规则变更，会分别触发不同风险（推断）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：退職后资格取消、変更、特定活動的具体申请时点、必要书类与审查基准。<\/li>\n<li>来源：出入国在留管理庁 <a href=\"https://www.moj.go.jp/isa/\">https://www.moj.go.jp/isa/<\/a>；制度正文只读引用 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>。<\/li>\n<\/ul>\n<h3 id=\"46-1-2\"><a id=\"46-特定技能-1-号业务限制与-2-号路径\" aria-hidden=\"true\"><\/a>4.6 特定技能 1 号业务限制与 2 号路径<\/h3>\n<ul>\n<li>特定技能 1 号有业务限制与在留上限；<strong>特定技能 2 号仅适用限定分野，自动车运送业无 2 号<\/strong>（事实，引用 08 最新口径）。<\/li>\n<li>⚠ <strong>待核实<\/strong>：最新分野清单与变更适用时间，按 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a> 最新报告核验。<\/li>\n<\/ul>\n<h3 id=\"47\"><a id=\"47-転職与资格外活动边界\" aria-hidden=\"true\"><\/a>4.7 転職与资格外活动边界<\/h3>\n<ul>\n<li>転職须在许可范围内；资格外活动须另获许可（推断）[出入国在留管理庁]。<\/li>\n<li>⚠ <strong>待核实<\/strong>：个别许可与时间上限。<\/li>\n<\/ul>\n<h3 id=\"48\"><a id=\"48-年金社保后续纳付义务退出后\" aria-hidden=\"true\"><\/a>4.8 年金・社保后续纳付义务（退出后）<\/h3>\n<ul>\n<li>脱退后仍可能有住民税・年金后续纳付义务；对永住 / 归化的影响须结合 08 最新口径（⚠ 待核实）。<\/li>\n<li>金额计算口径只读引用 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；本主题只写申请执行。<\/li>\n<li>来源：日本年金機構 / 08-visa-immigration。<\/li>\n<\/ul>\n<h2 id=\"s5\"><a id=\"五个人场景影响矩阵\" aria-hidden=\"true\"><\/a>五、个人场景影响矩阵<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">场景<\/th>\n<th style=\"width:20%\">退出影响<\/th>\n<th style=\"width:20%\">转型影响<\/th>\n<th style=\"width:20%\">回国影响<\/th>\n<th style=\"width:20%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>有稳定新雇主<\/td>\n<td>退職 → 新雇主接收<\/td>\n<td>可能申请在留資格変更<\/td>\n<td>一般不触发回国<\/td>\n<td>出入国在留管理庁（推断）<\/td>\n<\/tr>\n<tr>\n<td>无新雇主但考虑留日<\/td>\n<td>需确认资格状态与保险<\/td>\n<td>特定活動 / 其他资格<\/td>\n<td>期限压力上升<\/td>\n<td>出入国在留管理庁（推断）<\/td>\n<\/tr>\n<tr>\n<td>准备回国<\/td>\n<td>退職与保险退出<\/td>\n<td>一般不启动<\/td>\n<td>年金脱退、确定申告、退室、车辆<\/td>\n<td>日本年金機構 / 国税庁<\/td>\n<\/tr>\n<tr>\n<td>有家属<\/td>\n<td>家属资格状态需单独确认<\/td>\n<td>家属带同与扶养要件变化<\/td>\n<td>家属离境与在留卡处理<\/td>\n<td>08-visa-immigration（推断）<\/td>\n<\/tr>\n<tr>\n<td>有资产<\/td>\n<td>保险与税务衔接<\/td>\n<td>资产处置时点变化<\/td>\n<td>车辆 / 通信 / 银行账户清理<\/td>\n<td>各机构官网（推断）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>推断说明<\/strong>：上表用于条件化决策，不构成法律 / 税务意见；个案须咨询专业人士。<\/p>\n<\/blockquote>\n<h2 id=\"s6\"><a id=\"六退出转型回国行动建议建议章\" aria-hidden=\"true\"><\/a>六、退出·转型·回国行动建议（建议章）<\/h2>\n<blockquote>\n<p>本章为「建议」，与事实分离；重大决策须咨询执业法律 / 税务专业人士。<\/p>\n<\/blockquote>\n<h3 id=\"61\"><a id=\"61-退出阶段建议\" aria-hidden=\"true\"><\/a>6.1 退出阶段建议<\/h3>\n<ol>\n<li><strong>先确认资格状态<\/strong>：退職前确认在留资格、受入计划、受雇规则与更新时点（建议）。<\/li>\n<li><strong>再确认保险<\/strong>：被用者保险退职后，尽快确认健康保険任意継続与国民健康保険切换（建议）。<\/li>\n<li><strong>保留书类<\/strong>：退職証明、雇用保険受给资格者证、社会保险料纳付证明、纳税证明（建议）。<\/li>\n<\/ol>\n<h3 id=\"62\"><a id=\"62-转型阶段建议\" aria-hidden=\"true\"><\/a>6.2 转型阶段建议<\/h3>\n<ol>\n<li><strong>先找新雇主 / 新资格<\/strong>：再申请在留資格変更；不要先退職后长期滞留（建议）。<\/li>\n<li><strong>确认业务限制<\/strong>：特定技能 1 号业务限制与 2 号分野限制须逐项核对（建议）。<\/li>\n<li><strong>语言 / 资格补强<\/strong>：按新资格要件准备日语与资格证明（建议）。<\/li>\n<\/ol>\n<h3 id=\"63\"><a id=\"63-回国阶段建议\" aria-hidden=\"true\"><\/a>6.3 回国阶段建议<\/h3>\n<ol>\n<li><strong>离境前 1–3 个月<\/strong>：确认年金脱退、确定申告、住民税、転出届、在留卡与再入国（建议）。<\/li>\n<li><strong>离境前 2–4 周<\/strong>：完成退室、通信 / 银行 / 车辆解约或处置（建议）。<\/li>\n<li><strong>离境后<\/strong>：确认日本国内是否仍有纳税、年金或保险后续义务（建议）。<\/li>\n<\/ol>\n<h3 id=\"64\"><a id=\"64-时间线建议\" aria-hidden=\"true\"><\/a>6.4 时间线（建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">阶段<\/th>\n<th style=\"width:33%\">时点<\/th>\n<th style=\"width:34%\">事项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退出前<\/td>\n<td>退職前 1–3 个月<\/td>\n<td>资格状态、保险、书类<\/td>\n<\/tr>\n<tr>\n<td>退出时<\/td>\n<td>退職日<\/td>\n<td>退職手続、雇用保険、保险退出<\/td>\n<\/tr>\n<tr>\n<td>转型<\/td>\n<td>留日决定后<\/td>\n<td>新雇主 / 新资格、变更申请<\/td>\n<\/tr>\n<tr>\n<td>回国前<\/td>\n<td>离境前 1–3 个月<\/td>\n<td>年金脱退、确定申告、住民税<\/td>\n<\/tr>\n<tr>\n<td>回国前<\/td>\n<td>离境前 2–4 周<\/td>\n<td>退室、车辆、通信、银行账户<\/td>\n<\/tr>\n<tr>\n<td>回国后<\/td>\n<td>离境后<\/td>\n<td>后续义务确认<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s7\"><a id=\"七制度变更与个人行动时间线\" aria-hidden=\"true\"><\/a>七、制度变更与个人行动时间线<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">时点<\/th>\n<th style=\"width:25%\">制度 / 事件<\/th>\n<th style=\"width:25%\">来源<\/th>\n<th style=\"width:25%\">个人行动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2026-11-14<\/td>\n<td>本基线建立<\/td>\n<td>16<\/td>\n<td>建立登记册与三段框架<\/td>\n<\/tr>\n<tr>\n<td>触发时<\/td>\n<td>官方规则改定<\/td>\n<td>出入国在留管理庁 / 厚生労働省 / 日本年金機構 / 国税庁<\/td>\n<td>启动事件触发解读<\/td>\n<\/tr>\n<tr>\n<td>个人情况变化<\/td>\n<td>资格 / 雇主 / 家庭 / 资产 / 离境计划<\/td>\n<td>个人记录<\/td>\n<td>启动个人情况变化件<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待跟踪清单<\/strong>：退職・労働条件・雇用保険改定；健康保険任意継続改定；厚生年金脱退改定；在留資格取消・変更・特定活動规则改定；特定技能 2 号路径改定；転職・资格外活动规则改定；帰国前確定申告・住民税 / 所得税规则改定；退室・解約・车辆・通信规则改定。<\/p>\n<p><strong>说明<\/strong>：本主题不预设个人 Go / No-Go；时间线仅用于条件化决策。<\/p>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：出入国在留管理庁 / 法務省 / e-Gov；厚生労働省 / 日本年金機構 / ハローワーク；国税庁 / 総務省 / 地方自治体。<\/li>\n<li><strong>B 级（机构官网）<\/strong>：银行 / 运营商 / 运输 / 车辆相关机构。<\/li>\n<li><strong>C 级（平台抽样）<\/strong>：本主题登记册无此类指标。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-主要局限\" aria-hidden=\"true\"><\/a>8.2 主要局限<\/h3>\n<ol>\n<li><strong>执行层研究<\/strong>：本主题不展开税制、年金计算与资格取消制度正文，相关结论引用 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07<\/a> / <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08<\/a>。<\/li>\n<li><strong>初析级<\/strong>：具体金额、期限、要件与窗口多数标「⚠ 待核实」，待事件触发或年度复盘补齐。<\/li>\n<li><strong>个案差异大<\/strong>：资格、收入、家属、资产、离境时点不同，建议必须条件化。<\/li>\n<\/ol>\n<h3 id=\"83\"><a id=\"83-待复核清单次期优先逐项附复核入口\" aria-hidden=\"true\"><\/a>8.3 待复核清单（次期优先，逐项附复核入口）<\/h3>\n<ol>\n<li><strong>健康保険任意継続<\/strong>申请期限、继续期间、保险料与必要书类——复核入口：日本年金機構 <a href=\"https://www.nenkin.go.jp/\">https://www.nenkin.go.jp/<\/a>。<\/li>\n<li><strong>厚生年金脱退一时金<\/strong>书类清单、申请窗口与复核入口——复核入口：日本年金機構 <a href=\"https://www.nenkin.go.jp/\">https://www.nenkin.go.jp/<\/a>。<\/li>\n<li><strong>在留資格取消・変更・特定活動<\/strong>的具体申请时点与审查基准——复核入口：出入国在留管理庁 <a href=\"https://www.moj.go.jp/isa/\">https://www.moj.go.jp/isa/<\/a>；正文引用 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>。<\/li>\n<li><strong>退職手続<\/strong>书类、预告期、窗口——复核入口：厚生労働省 <a href=\"https://www.mhlw.go.jp/\">https://www.mhlw.go.jp/<\/a> / e-Gov。<\/li>\n<li><strong>雇用保険受给<\/strong>期间与书类——复核入口：ハローワーク <a href=\"https://www.mhlw.go.jp/stf/hellowork/\">https://www.mhlw.go.jp/stf/hellowork/<\/a>。<\/li>\n<li><strong>帰国前確定申告<\/strong>申报期限、分离课税与届出书类——复核入口：国税庁 <a href=\"https://www.nta.go.jp/\">https://www.nta.go.jp/<\/a> / 総務省 <a href=\"https://www.soumu.go.jp/\">https://www.soumu.go.jp/<\/a>。<\/li>\n<li><strong>在留卡 / 再入国許可 / みなし再入国<\/strong>条件——复核入口：出入国在留管理庁 <a href=\"https://www.moj.go.jp/isa/\">https://www.moj.go.jp/isa/<\/a>。<\/li>\n<li><strong>退室・解約・车辆・通信・银行账户<\/strong>解约预告期与关闭条件——复核入口：国土交通省 <a href=\"https://www.mlit.go.jp/\">https://www.mlit.go.jp/<\/a> / 各机构官网 / 地方自治体。<\/li>\n<\/ol>\n<h3 id=\"84\"><a id=\"84-口径冲突并列不可合并不取均值\" aria-hidden=\"true\"><\/a>8.4 口径冲突并列（不可合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>健康保険任意継続<\/td>\n<td>被用者保险继续 ≠ 国民健康保険加入<\/td>\n<\/tr>\n<tr>\n<td>再入国<\/td>\n<td>再入国許可（事前）≠ みなし再入国（离境时满足条件）<\/td>\n<\/tr>\n<tr>\n<td>年金脱退<\/td>\n<td>申请执行（16）≠ 金额计算口径（07）<\/td>\n<\/tr>\n<tr>\n<td>在留资格<\/td>\n<td>取消（资格丧失）≠ 変更（资格切换）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>文本时效声明<\/strong>：本报告以 <strong>2026-11-14<\/strong> 时点官方页面为准；入口页多无版本日期，具体资格页面深链待事件触发时补齐。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手（出入国在留管理庁 / 法務省 / e-Gov / 厚生労働省 / 日本年金機構 / ハローワーク / 国税庁 / 総務省 / 国土交通省）<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://www.moj.go.jp/isa/\">出入国在留管理庁<\/a> — 入口页无版本日期；核验日期：2026-11-14；核验状态：入口已核对，具体资格页面深链待事件触发时补齐<\/li>\n<li><a href=\"https://www.moj.go.jp/\">法務省<\/a> — 入口页无版本日期；核验日期：202 <script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('report-data').textContent);
  var RECENT_MONTHS = 12;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* ---------- 侧栏主题列表 ---------- */
  function renderSidebar() {
    var box = $('#rd-toc');
    if (!box) return;
    var html = '';
    Object.keys(DATA).sort().forEach(function (rs) {
      var t = DATA[rs];
      var months = Object.keys(t.months).sort().reverse();
      html += '<a href="#topic=' + rs + '&month=' + months[0] + '" data-rs="' + rs + '">'
        + '<span class="num">' + (t.dir || '').replace(/^\d+-/, '') + '</span>'
        + '<span>' + escapeHtml(t.name) + '</span>'
        + '<span class="cnt">' + months.length + ' 期</span></a>';
    });
    box.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- 路由 ---------- */
  function parseHash() {
    var h = location.hash || '';
    var m = /^#topic=([^&]+)(?:&month=(\d{4}-\d{2}))?/.exec(h);
    if (!m) return null;
    return { rs: decodeURIComponent(m[1]), month: m[2] || null };
  }

  function currentPeriods(rs) {
    return Object.keys(DATA[rs].months).sort();  // 升序（时间正序）
  }

  function render() {
    var route = parseHash();
    var sidebar = $('#rd-toc');
    if (!route || !DATA[route.rs]) {
      // 默认落到第一个主题的最新一期
      var first = Object.keys(DATA).sort()[0];
      if (first) {
        var months = currentPeriods(first);
        location.replace('#topic=' + first + '&month=' + months[months.length - 1]);
        return;
      }
      $('#rd-main').innerHTML = '<p class="rd-empty">暂无已产出报告。</p>';
      return;
    }
    var t = DATA[route.rs];
    var periods = currentPeriods(route.rs);
    var month = route.month && t.months[route.month] ? route.month : periods[periods.length - 1];
    var rec = t.months[month];

    // 侧栏高亮
    $all('a[data-rs]', sidebar).forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-rs') === route.rs);
    });

    // 头部
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth() - (RECENT_MONTHS - 1), 1);
    var startPeriod = start.getFullYear() + '-' + pad(start.getMonth() + 1);
    var monthsHtml = periods.map(function (p) {
      var cls = 'rd-month' + (p === month ? ' on' : '') + (p < startPeriod ? ' old' : '');
      return '<button class="' + cls + '" data-month="' + p + '">' + p + '</button>';
    }).join('');
    var stats = rec.stats || {};
    $('#rd-head').innerHTML =
      '<div class="crumb">' + escapeHtml(t.dir) + ' · ' + escapeHtml(t.name) + '</div>'
      + '<h1>' + escapeHtml(rec.title || (month + ' 期报告')) + '</h1>'
      + '<div class="sum">' + escapeHtml(rec.summary || '') + '</div>'
      + '<div class="rd-toolbar">'
      +   '<div class="rd-months">' + monthsHtml + '</div>'
      +   '<button class="rd-toggle" id="tg-diff">隐藏更新标记</button>'
      +   '<button class="rd-toggle" id="tg-del">展开全部删除</button>'
      + '</div>';

    // 正文
    var body = $('#rd-body');
    body.innerHTML = rec.body || '<p class="rd-empty">本期报告无内容。</p>';

    // 月份切换
    $all('.rd-month', $('#rd-head')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.getAttribute('data-month');
        if (p === month) return;
        location.hash = '#topic=' + route.rs + '&month=' + p;  // 触发 hashchange -> render
      });
    });

    // 对照阅读开关
    var tgDiff = $('#tg-diff');
    tgDiff.addEventListener('click', function () {
      var hide = body.classList.toggle('hide-diff');
      tgDiff.textContent = hide ? '显示更新标记' : '隐藏更新标记';
    });

    // 展开全部删除
    var tgDel = $('#tg-del');
    tgDel.addEventListener('click', function () {
      var open = tgDel.getAttribute('data-open') === '1';
      $all('details.diff-del-group', body).forEach(function (d) { d.open = !open; });
      tgDel.setAttribute('data-open', open ? '0' : '1');
      tgDel.textContent = open ? '展开全部删除' : '收起全部删除';
    });

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  renderSidebar();
  render();
})();
</script>
</body>
</html>
