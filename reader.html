GHD 官方決算短信<\/td>\n<td>FY2027/3 上半期（2026-11-06）<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>登録支援機関<\/td>\n<td>2–4 万円/人·月；登录费 28,400 円；2027-04-01 改正施行<\/td>\n<td>isa.go.jp / 行业机构<\/td>\n<td>2026 / 2027-04-01<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>中国中介渠道<\/td>\n<td>签证费 715 元 / 二次·数次 1,430 元<\/td>\n<td>商务部 / 驻日领馆<\/td>\n<td>2026-07-01 起<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>驾照路径与费用<\/td>\n<td>普通 AT 限定均价 324,381 円；MT 通学 30–40 万円；大型 25–28 万円<\/td>\n<td>総務省 e-Stat / くらシム / TRUCK-BANK<\/td>\n<td>2026-09 / 2026-10-18 / 2026-06<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_5\"><a id=\"调研说明\" aria-hidden=\"true\"><\/a>调研说明<\/h3>\n<ul>\n<li><strong>来源语言规则<\/strong>：统计与制度类均取日文官方一手（ISA / MLIT / 厚労省 / 警察庁 / 内閣府 / 総務省 / 日銀）；行业机构（全ト协、TDB、TSR、大和总研）与考试实施机构（ClassNK、JPF、Prometric）次之；中文来源仅作线索，引用回溯日 / 英原文。中国侧国家统计局、外汇交易中心、驻日领馆费用页为项目指定例外，仅用于中国侧输入。<\/li>\n<li><strong>时效窗口<\/strong>：近 12 个月内数据优先；超过 24 个月标注年份（如「现役事业用卡车司机约 84 万人」为 2024 年口径）。<\/li>\n<li><strong>推断标注约定<\/strong>：凡标「推断」均为分析判断，非官方结论；凡标「自算」为基于官方参数的算术推导；预测标「预测值（F）」。<\/li>\n<li><strong>结论边界<\/strong>：允许框架性求职路径建议，不承诺就业结果、不保证薪资水平、不给「必过」式断言；不给投资评级、不出具 Go/No-Go 决策建议。<\/li>\n<li><strong>结构说明<\/strong>：本报告按职业就业调研型九节骨架组织；第 5 节「岗位技能要求」与第 6 节「行业认可的职业资质与证书」为按骨架新设的独立节（原由现行报告二、三、六合并承载试验信息与驾照路径）。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<h3 id=\"21\"><a id=\"21-制度框架与受入上限\" aria-hidden=\"true\"><\/a>2.1 制度框架与受入上限<\/h3>\n<ul>\n<li><strong>分野设立<\/strong>：「自動車運送業」分野于 2024-03-29 阁议决定新增（同批：铁道、林业、木材产业），监管省厅为<strong>国土交通省<\/strong>；2024-12-19 上乗け基准告示施行后正式开始接收；分野運用方針已于 2026-01-23 重新阁议决定。[Source: https://www.moj.go.jp/isa/applications/ssw/2024.03.29.kakugikettei.html, 2024–2026; https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/li>\n<li><strong>受入上限（现行口径）<\/strong>：<strong>22,100 人<\/strong>（2024 年 4 月–2029 年 3 月末，2026-01-23 阁议决定的新运用方针）；旧方针 24,500 人<strong>已废止<\/strong>。ISA 受入见込数·在留者数表（2026-11-06 更新版）「自動車運送業」列示值即为 <strong>22,100<\/strong>；ssw.go.jp 日 / 中文版仍显示 24,500，属<strong>未同步观察项<\/strong>（连续五次），不作现行值使用。[Source: https://www.moj.go.jp/isa/content/001472175.pdf, 2026]<\/li>\n<li><strong>在留者规模<\/strong>：自動車運送業 1 号 <strong>843 人<\/strong>（充足率 3.8%、年間増加 803）；SSW 1 号全体 <strong>438,128 人<\/strong>、2 号全体 <strong>23,348 人<\/strong>（2026-08 末速报）。本分野<strong>在 2 号栏为空白<\/strong>，即不得接收 2 号。[Source: https://www.moj.go.jp/isa/content/001472175.pdf, 2026]<\/li>\n<li><strong>制度定位<\/strong>：特定技能 1 号在留期间合计上限 5 年、原则不可携家属；2 号无上限、可携配偶子女——但本分野不适用 2 号，永住路径须经其他在留资格转接，不得按已废止的升级路径表述。[Source: https://www.ssw.go.jp/cn/about/visa/, 2026]<\/li>\n<li><strong>运用口径对比<\/strong>：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">维度<\/th>\n<th style=\"width:20%\">SSW 1 号<\/th>\n<th style=\"width:20%\">SSW 2 号<\/th>\n<th style=\"width:20%\">技能实习<\/th>\n<th style=\"width:20%\">特定活动（本分野准备用）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>在留期间<\/td>\n<td>更新累计上限 5 年<\/td>\n<td>3 年 / 1 年 / 6 个月更新，回数无限制<\/td>\n<td>合计最长 5 年<\/td>\n<td>卡车最长 6 个月<\/td>\n<\/tr>\n<tr>\n<td>家属<\/td>\n<td>原则不可<\/td>\n<td>要件满足可（配偶·子）<\/td>\n<td>不可<\/td>\n<td>不可<\/td>\n<\/tr>\n<tr>\n<td>本分野可否<\/td>\n<td>可（卡车 / 出租 / 巴士三区分）<\/td>\n<td><strong>不可<\/strong><\/td>\n<td>—<\/td>\n<td>可（準備）<\/td>\n<\/tr>\n<tr>\n<td>实习→SSW 免试<\/td>\n<td>第 2 号技能实习良好修了者，当分の間免试并视为满足日语 A2 相当<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>⚠️ 引用数据时<strong>严禁将技能实习统计与特定技能混算<\/strong>；技能实习、特定技能 2 号分野适用性的完整官方口径以 ISA 原文为准。<\/li>\n<\/ul>\n<h3 id=\"22-2027-04-01-b1\"><a id=\"22-自動車運送業分野人材基准2027-04-01-起-b1\" aria-hidden=\"true\"><\/a>2.2 「自動車運送業」分野人材基准（2027-04-01 起 B1）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">岗位区分<\/th>\n<th style=\"width:25%\">技能要件<\/th>\n<th style=\"width:25%\">日语要件（现行）<\/th>\n<th style=\"width:25%\">日语要件（2027-04-01 起 COE 申请）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车运転者（监测重点）<\/td>\n<td>評価試験（トラック）合格 ＋ 第一種運転免許<\/td>\n<td>A2.2 相当以上：JFT-Basic A2.2 以上 <strong>或<\/strong> JLPT N4 以上<\/td>\n<td><strong>不变<\/strong>（卡车不适用 B1 上调）<\/td>\n<\/tr>\n<tr>\n<td>出租车运転者<\/td>\n<td>評価試験（タクシー）＋ 第二種運転免許 ＋ 新任運転者研修<\/td>\n<td>B1 相当以上（JLPT N3 以上且 CEFR B1 判定）；满足例外要件时可按 A2.2<\/td>\n<td><strong>B1 相当以上<\/strong>（例外仅限「非包车＋B1 学习计划＋日语支援者同乘」等）<\/td>\n<\/tr>\n<tr>\n<td>巴士运転者<\/td>\n<td>評価試験（バス）＋ 第二種運転免許 ＋ 新任運転者研修<\/td>\n<td>同上<\/td>\n<td><strong>B1 相当以上<\/strong>（离岛·半岛路线且有自治体协力同意书时可单独乘务）<\/td>\n<\/tr>\n<tr>\n<td>分野整体<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td><strong>本分野不接收特定技能 2 号<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>健康检查裁定<\/strong>：本分野<strong>无<\/strong>健康检查义务条文；唯一健康相关项为出租车 / 巴士新任研修内的「適性診断」（旅客自動車運送事業運輸規則第 38 条第 2 項）。[Source: https://www.moj.go.jp/isa/content/001473135.pdf, 2026]<\/li>\n<li><strong>運用要領別冊制定履历<\/strong>：令和 6 年 12 月 19 日公表 → 令和 7 年 2 月 17 日、7 月 15 日、<strong>令和 8 年 10 月 9 日<\/strong>三次一部改正；告示仍为令和 6 年国土交通省告示第 1362 号。[Source: https://www.moj.go.jp/isa/content/001472534.pdf, 2026]<\/li>\n<li><strong>技能实习 2 号良好修了者<\/strong>的免试 / 免日语待遇不因本次改正而变化（卡车侧原文口径维持「当分の間…証明は要しません」）。[Source: 同上]<\/li>\n<\/ul>\n<h3 id=\"23\"><a id=\"23-试验与在留路径制度侧\" aria-hidden=\"true\"><\/a>2.3 试验与在留路径（制度侧）<\/h3>\n<ul>\n<li><strong>技能試験<\/strong>（实施主体：一般财团法人日本海事协会 ClassNK）：CBT 无固定考期、考位有空随时可考；学科 30 问（○×）＋实技 20 问（三选一），共 80 分钟，各正答率 ≥60% 合格；试题日语（附注音）。实施地 18 国——<strong>中国大陆无考点<\/strong>；出差考试限企业申请（海外 50 枠起）。[Source: https://sswt-portal.classnk.or.jp/area?tab=3, 2026]<\/li>\n<li><strong>日本語試験<\/strong>：JFT-Basic 随時 CBT，海外 14 国 / 27 都市＋日本国内 10 都道府县——<strong>中国大陆不在实施地<\/strong>；JLPT 中国大陆每年 2 回（2026 年 7 月 5 日、12 月 6 日），N4 报名费 450 元人民币。<strong>2026 年 12 月 JLPT N1–N5 全等级报名截止前满员<\/strong>，官方建议改考 JFT-Basic。[Source: https://www.prometric-jp.com/zh-CHS/ssw/, 2026; https://jlpt.neea.cn/faq.html, 2026; https://www.moj.go.jp/isa/content/001471906.pdf, 2026]<\/li>\n<li><strong>申请流程<\/strong>：海外申请者先以「特定活动」（特定自动车运送业准备）入境（2025-02-17 起受理；卡车最长 6 个月），办理驾照（外免切替）与研修——<strong>未取得日本驾照则不能转入特定技能 1 号<\/strong>；雇主代办 COE（手续费免费、标准审查 1–3 个月）→ 驻外使领馆签证 → 入境。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li><strong>登録支援機関<\/strong>：代雇主实施「义务性支援 10 项目」，不得再委托；登录 5 年有效，新登录手续费 28,400 円 / 更新 11,100 円；本分野受托支援机关须加入国交省协议会（免费）。<strong>支援体制要件改正 2027-04-01 施行<\/strong>（详见 6.3）。[Source: https://www.moj.go.jp/isa/policies/ssw/supportssw.html, 2026]<\/li>\n<\/ul>\n<h3 id=\"24-2024\"><a id=\"24-物流行业态势2024-年问题与运賃适正化\" aria-hidden=\"true\"><\/a>2.4 物流行业态势：2024 年问题与运賃适正化<\/h3>\n<ul>\n<li><strong>官方定调<\/strong>：2024 年度约 14% 运力缺口经官民对策「基本克服」；未发生全国性停运，总合物流施策大纲记载「部分地区出现运输限制」；再配送率降至 <strong>7.6%<\/strong>（2026-04）。[Source: https://www.mlit.go.jp/report/press/tokatsu01_hh_001025.html, 2026]<\/li>\n<li><strong>トラック适正化二法<\/strong>（令和 7 年法律第 60 号·第 61 号，2025-06-11 公布）：国家设定「适正原価」，荷主与运送双方均不得低于该水平收付。其中「公布后 1 年内」的 [1] 违法白トラ利用的货主规制、[2] 委托次数限制努力义务、[3] 对货物利用运送事业者的准用，<strong>施行日为 2026-04-01<\/strong>；[4] 许可更新制、[5]「適正原価」低于限制（含<strong>标准运赁废止<\/strong>）属「公布后 3 年内」，截至基准日<strong>未施行<\/strong>。2026-04 起禁止委托无许可「白牌卡车」（荷主罚 100 万円以下）。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2026]<\/li>\n<li><strong>物流効率化法<\/strong>（法律名变更）：2026-04 起对一定规模以上货主 / 物流事业者实施「特定事業者」指定与中長期計画·定期報告义务，货主须选任物流統括管理者。[Source: https://www.mlit.go.jp/seisakutokatsu/freight/seisakutokatsu_freight_mn1_000034.html, 2026]<\/li>\n<li><strong>结论（推断）<\/strong>：2026-04 起进入「可核查的合规期」——货主侧被要求书面化委托链与装载效率改善，司机侧的直接现金效果尚未可测；真正的运价硬约束（適正原価下限）仍在 2027 年以后窗口。<strong>若「标准运赁」正式废止而適正原価尚未告示，过渡期货主与事业者的谈判基准将出现空窗<\/strong>，需持续跟踪告示文本。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2026]<\/li>\n<\/ul>\n<h3 id=\"25\"><a id=\"25-物流倒产双机构双口径并列\" aria-hidden=\"true\"><\/a>2.5 物流倒产（双机构双口径并列）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">统计机构<\/th>\n<th style=\"width:33%\">口径<\/th>\n<th style=\"width:34%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.tsr-net.co.jp/news/status/detail/1203416_1610.html\" title=\"来源：https://www.tsr-net.co.jp/news/status/detail/1203416_1610.html, 2026\">東京商工リサーチ（TSR）<\/a><\/td>\n<td>2026 年 10 月<\/td>\n<td>全国 <strong>934 件（-3.2%）<\/strong>、負債総額 1,293 億 1,800 万円（+1.4%）；10 産業中 <strong>運輸業 38 件（+2.7%，连续 2 个月增加）<\/strong>；「人手不足」関連倒产 <strong>50 件<\/strong>（10 月单月最多，其中人件費高騰 32 件）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.tdb.co.jp/report/bankruptcy/aggregation/20261110-bankruptcy202610/\" title=\"来源：https://www.tdb.co.jp/report/bankruptcy/aggregation/20261110-bankruptcy202610/, 2026\">帝国データバンク（TDB）<\/a><\/td>\n<td>2026 年 10 月<\/td>\n<td>全国 <strong>950 件（-1.6%）<\/strong>、負債総額 1,130 億 3,500 万円（-20.6%）；2026 年 1–10 月累计 <strong>8,949 件（+4.3%）<\/strong>；「人手不足倒産」<strong>56 件创历史最多<\/strong><\/td>\n<\/tr>\n<tr>\n<td>基线并列（历史口径）<\/td>\n<td>FY2025 / 历年 2025<\/td>\n<td>TDB 道路货物运输业 <strong>321 件<\/strong>（史上第 4 高）≠ TSR 道路货运倒产 <strong>308 件（-17.6%）<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>⚠️ <strong>两个机构统计期间、定义与分類不同，不可直接比较或加总<\/strong>（TSR 934 与 TDB 950 不可视为同一统计的修订）。<\/li>\n<li><strong>结论（推断）<\/strong>：倒产总量连续 2 个月同比下降，但运输业与「人手不足型」倒产逆势上升，中小运输事业者被劳动力成本与司机流失双向挤压；对求职者的含义是「雇主稳定性筛查」比「行业景气判断」更重要。<\/li>\n<\/ul>\n<h3 id=\"26\"><a id=\"26-智能驾驶展望结论面全部标推断\" aria-hidden=\"true\"><\/a>2.6 智能驾驶展望（结论面，全部标「推断」）<\/h3>\n<ul>\n<li><strong>L4 实绩<\/strong>：国交省 2026-05-11 公开口径为<strong>截至 2026 年 2 月、全国 10 カ所实现 L4（特定自動運行）社会实装<\/strong>；官方未公布按「许可件数」汇总的统计，原登记册「12 件」无官方来源，已废止。[Source: https://www.magazine.mlit.go.jp/interview/vol62-c-1/, 2026]<\/li>\n<li><strong>新增线索<\/strong>：いすゞ在 RoAD to the L4 成果报告会（2026-03-05）披露路线巴士 <strong>2026 年度提出 L4 認可申請<\/strong>、<strong>2027 年度事业化<\/strong>目标；千叶县柏市「柏の叶」地区于 <strong>2025-11-12<\/strong> 取得县内首个 L4（特定自動運行）许可。[Source: https://www.road-to-the-l4.go.jp/publication/pdf/03-3_ISUZU_20260305.pdf, 2026; https://www.city.kashiwa.lg.jp/koho/pressrelease/r7houdou/12gatsu/r7121004.html, 2025]<\/li>\n<li><strong>官方时间表<\/strong>（《モビリティ・ロードマップ 2026》，2026-07-21 数字社会推进会议决定）：2027 年度起社会实装；2030 年度前国内导入自动驾驶服务车辆 <strong>1 万台<\/strong>；货运专项「2026 年以后在高速公路实现 L4 卡车社会实装」；先行事业化地域 <strong>13 处<\/strong>（横滨、堺、神户、日立、盐尻、仙台、筑波、川崎、平冢、小松、爱知、京都、三丰），2027 年度事业化。[Source: https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/2415ad00-6a79-4ebc-8fb1-51a47b1b0552/11045673/20260721_meeting_mobility_01.pdf, 2026]<\/li>\n<li><strong>实证进展<\/strong>：新东名骏河湾沼津 SA—滨松 SA 约 100km，2025-03 起深夜设「自动驾驶车优先车道」，L4 卡车公道实证进行中；2024-11-05 丰田通商等 4 社＋五十铃 / 日野 / 三菱扶桑 / UD 启动新东名大型卡车公道实证。[Source: https://www.isuzu-global.com/ja/newsroom/20241105_1.html, 2024]<\/li>\n<li><strong>岗位影响评估（推断）<\/strong>：①<strong>干线先于市内配送<\/strong>——高速公路区间、固定路线、夜间时段与 L4 卡车 ODD 匹配度最高，2027–2030 年更可能先出现「无人区间的中转接力」而非整段无人化；②<strong>市内配送替代最慢<\/strong>——混流交通、驻车装卸、客户交接仍依赖人，2030 年前岗位数量冲击有限；③<strong>特定技能司机的风险窗口<\/strong>——1 号在留上限 5 年，若 2027–2031 年干线无人化落地，首批入国者的第 3–5 年可能遇到长途岗位减少，建议在 3 年内完成大型驾照、運行管理者资格或叉车 / 仓库管理方向的技能叠加；④本分野不得转 2 号，「以 2 号续命」策略不可用。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-供需缺口多口径并列不合并\" aria-hidden=\"true\"><\/a>3.1 供需缺口（多口径并列，不合并）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">数值<\/th>\n<th style=\"width:34%\">口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.cas.go.jp/jp/seisaku/buturyu_kakushin/pdf/20231226_1.pdf\" title=\"来源：https://www.cas.go.jp/jp/seisaku/buturyu_kakushin/pdf/20231226_1.pdf, 2023\">2024 年度运力不足<\/a><\/td>\n<td><strong>14%（トラックドライバー 14 万人相当）<\/strong><\/td>\n<td>不采取对策情形；政策包正文（示意图口径）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.cas.go.jp/jp/seisaku/buturyu_kakushin/pdf/20231226_1.pdf\" title=\"来源：同上\">2030 年度缺口<\/a><\/td>\n<td><strong>34%（34 万人相当）<\/strong><\/td>\n<td>不采取对策；政策包正文<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/seisakutokatsu/freight/content/001984794.pdf\" title=\"来源：https://www.mlit.go.jp/seisakutokatsu/freight/content/001984794.pdf, 2025\">2030 年度缺口（再检证）<\/a><\/td>\n<td><strong>平均约 7%／最大约 25%<\/strong><\/td>\n<td>采取官民对策后修正<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/seisakutokatsu/freight/content/001583917.pdf\" title=\"来源：https://www.mlit.go.jp/seisakutokatsu/freight/content/001583917.pdf, 2022\"><strong>不足人数精确值（NX 总研，调整后）<\/strong><\/a><\/td>\n<td><strong>2025 年度 110,809 人<\/strong>（13.4%／3.7 亿吨）；<strong>2030 年度 162,912 人<\/strong>（19.5%／5.4 亿吨）<\/td>\n<td>调查间调整 ×76.1% 后推计<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.magazine.mlit.go.jp/interview/vol50-1-c-1/\" title=\"来源：https://www.magazine.mlit.go.jp/interview/vol50-1-c-1/, 2024\">现役事业用卡车司机<\/a><\/td>\n<td>约 <strong>84 万人<\/strong><\/td>\n<td>干线运输事业用（2024，&gt;24 个月标注）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mhlw.go.jp/stf/newpage_76960.html\" title=\"来源：https://www.mhlw.go.jp/stf/newpage_76960.html, 2026\">有效求人倍率<\/a><\/td>\n<td><strong>2.56（2026-09，汽车驾驶业，常用含パート）<\/strong> vs 全产业 1.19<\/td>\n<td>厚労省（2026-09 分，2026-10-30 公布；较上月 +0.02pt）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1111000.html\" title=\"来源：https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1111000.html, 2025\">年龄结构<\/a><\/td>\n<td>运输业 55 岁以上占 <strong>33.9%<\/strong>、29 岁以下仅 <strong>11.0%<\/strong>（全产业 16.9%）<\/td>\n<td>2024 年劳动力调查<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.mlit.go.jp/report/press/tokatsu02_hh_000084.html\" title=\"来源：https://www.mlit.go.jp/report/press/tokatsu02_hh_000084.html, 2026\">劳动强度<\/a><\/td>\n<td>大型司机年均劳动 2,544 小时（全产业 2,136）；每运次拘束 10 小时 13 分（同比 -1h33m）<\/td>\n<td>2023 年 / FY2025<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>⚠️ <strong>口径提示<\/strong>：全产业有效求人倍率 1.19（季节调整值）与「汽车驾驶业 2.56」（职业别·常用含パート）口径不同，不得相除或直接对比，仅用于说明驾驶职业的相对紧缺程度（推断）。<\/li>\n<li>⚠️ 「トラックドライバー不足実態調査」调查名不存在；不足人数精确值以国交省检讨会中间总结（NX 总研试算）为准，政策包 14% / 34% 仅为示意图。<\/li>\n<\/ul>\n<h3 id=\"32\"><a id=\"32-薪资统计厚労省--全ト协口径警示\" aria-hidden=\"true\"><\/a>3.2 薪资统计（厚労省 + 全ト协，口径警示）<\/h3>\n<p><strong>厚労省毎月勤労統計 2026 年 9 月分<\/strong>（2026-11-06 公布，運輸業・郵便業，5 人以上事业所）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">运输业·邮政业<\/th>\n<th style=\"width:34%\">全产业对照<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>现金给与总额（月）<\/td>\n<td><strong>341,158 円（+4.9%）<\/strong><\/td>\n<td>311,409 円（+4.6%）<\/td>\n<\/tr>\n<tr>\n<td>固定给与<\/td>\n<td>334,957 円（+4.5%）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>所定内给与<\/td>\n<td>292,610 円（+5.4%）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>所定外给与（加班等）<\/td>\n<td>42,347 円（-0.6%）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>一般劳动者总额<\/td>\n<td>386,399 円（+4.7%）<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>口径：名义月额、<strong>未含年度赏与<\/strong>；「运输业·邮政业」为产业中分类，未细分子行业。[Source: https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/xls/2609c01p.xlsx, 2026]<\/p>\n<p><strong>全ト协「2025 年度版トラック運送事業の賃金・労働時間等の実態」<\/strong>（2026-07-01 公表，A 级）：调查 4,624 社、回答 589 社（12.7%）、支付期 2025 年 5–7 月；<strong>男性大型運転者月薪 395,300 円（+4.1%）<\/strong>、含赏与 441,100 円；<strong>全职务平均 359,800 円（+5.3%）<\/strong>、含奖金额 416,400 円（+7.1%）；男性運転者平均 374,900 円。[Source: https://jta.or.jp/member/chosa/chinginjittai2025.html, 2026]<\/p>\n<ul>\n<li><strong>口径警示（继承，务必保留）<\/strong>：341,158 円为「運輸業・郵便業」全体（含仓储、邮政、事务岗）现金给与，<strong>不含赏与<\/strong>；「司机平均年收 430 万円」类数字为<strong>含赏与<\/strong>口径。两者不可直接对比；若并列必须标注口径。<\/li>\n<li>年龄别年收（2023，白書）：大型司机 485 万円 / 中小型 438 万円（全产业 507 万円）。[Source: https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1111000.html, 2025]<\/li>\n<\/ul>\n<h3 id=\"33-9-url\"><a id=\"33-求人抽样9-样本四元组立档岗位--地域--月収--url\" aria-hidden=\"true\"><\/a>3.3 求人抽样（9 样本四元组立档，岗位 × 地域 × 月収 × URL）<\/h3>\n<p>登记册 #6 记 <strong>9 样本<\/strong>，全部完成四元组立档与官网回溯；下表列示其中已回溯样本（B 级为企业官网 / 采用站一手，C 级为聚合转载）。月给为平台 / 官网标注口径，含 / 不含手当须逐条核对。<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">地域<\/th>\n<th style=\"width:25%\">企业·岗位（四元组立档）<\/th>\n<th style=\"width:25%\">月给<\/th>\n<th style=\"width:25%\">核实状态（截至本版）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>东京圈<\/td>\n<td><a href=\"https://xn--pckua2a7gp15o89zb.com/運送業-トラックの仕事\">第一自动车运送（世田谷，2t）<\/a><\/td>\n<td>22 万–45 万円<\/td>\n<td>未回溯（区间样本，聚合口径，历版维持）<\/td>\n<\/tr>\n<tr>\n<td>东京圈<\/td>\n<td><a href=\"https://en.genbars.jp/kanto/jobdetail/?id=10151701\">株式会社メジャーサービスジャパン（genbars JOB 10151701，中型夜勤，关东多据点）<\/a><\/td>\n<td>346,650 円～<\/td>\n<td>已回溯·定位修正（夜勤 2:00–11:00·月 25 勤）<\/td>\n<\/tr>\n<tr>\n<td>大阪圈<\/td>\n<td><a href=\"https://kuwabaraservice.co.jp/recruit/\">桑原服务（茨木，夜勤 4t）<\/a><\/td>\n<td>32 万–38 万円（官网）<\/td>\n<td>已回溯·数值修正（输送部 31.5–38 万円；赏与年 2 回）<\/td>\n<\/tr>\n<tr>\n<td>大阪圈<\/td>\n<td><a href=\"https://www.kanemasa.co.jp/group_company06/\">マルマサフード物流（大阪市東住吉区，2t）<\/a><\/td>\n<td>30 万円～<\/td>\n<td>已回溯·转载一致·官网不公开薪资<\/td>\n<\/tr>\n<tr>\n<td>大阪圈<\/td>\n<td><a href=\"https://kofuji-recruit.jp/job/-/info/detail/M0000015\">コフジ物流 東大阪支店（JOB M0000015）<\/a><\/td>\n<td>280,000 円～（4t 给与例 33–40 万円）<\/td>\n<td>已回溯·官网首次立档（＋資格 / 役職 / 評価手当月 2 万円）<\/td>\n<\/tr>\n<tr>\n<td>地方<\/td>\n<td><a href=\"https://asahi-unyu.biz/recruit/\">朝日运输（富山射水，中 / 大型）<\/a><\/td>\n<td>25 万–33.5 万円<\/td>\n<td>已回溯·一致（賞与実績 50–60 万円、通勤手当 10,000 円/月）<\/td>\n<\/tr>\n<tr>\n<td>地方<\/td>\n<td><a href=\"http://www.nishikyu.com/jobs/833\">西本急送（广岛）<\/a><\/td>\n<td>25 万–36 万円<\/td>\n<td>已回溯·一致（佐证）<\/td>\n<\/tr>\n<tr>\n<td>地方<\/td>\n<td><a href=\"https://works.aqsh.co.jp/jobs/midcareer/15030-04340661\">中越运送（注册地新潟市中央区；富山～新潟定期便）<\/a><\/td>\n<td>41 万–49 万円（定期便）<\/td>\n<td>已回溯·定位修正（非富山企业）<\/td>\n<\/tr>\n<tr>\n<td>地方<\/td>\n<td><a href=\"https://gojob.go.goinc.jp/jobs/Z9S78ZH0\">株式会社大富（福岡市，2t 深夜班）<\/a><\/td>\n<td>28.5 万–30.7 万円<\/td>\n<td>已回溯·转载一致（＋報奨金 6 万円×年 3 回）<\/td>\n<\/tr>\n<tr>\n<td><strong>特定技能专项<\/strong><\/td>\n<td><a href=\"https://mintoku.work/work/B00888\">Mintoku Work JOB B00888（埼玉市浦和区「育成 Driver」）<\/a><\/td>\n<td><strong>265,020 円<\/strong><\/td>\n<td>已回溯·编号更正（研修期 236,000 円、賞与年 2 回）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>抽样结论（推断）<\/strong>：9 样本中唯一带「特定技能 / 育成」标签的岗位（B00888，265,020 円）低于普通岗位中位数（约 30 万円），与「特定技能首年薪资低于同业有经验者」的一般模式一致；但单一含标签样本不足以支撑定量结论。<\/li>\n<li><strong>来源分级<\/strong>：B 级（企业官网 / 采用站一手）——桑原服务、朝日运输、Mintoku Work、コフジ物流、中越グループ采用站、メジャーサービスジャパン、マルマサフード物流、株式会社大富；C 级（聚合转载）——genbars、works.aqsh、gojob、求人Box。<\/li>\n<li>企业待遇公告参考：佐川急便招聘面月收例 32 万円、年收 480 万起 [Source: https://www.trucknews.biz/article/r091138/, 2025]；雅玛多 SD 司机「年收 600 万円以上可」 [Source: https://www.kuronekoyamato.co.jp/ytc/corp/recruit/sales-driver/benefits-and-training.html, 2026]。<\/li>\n<\/ul>\n<h3 id=\"34-sppi\"><a id=\"34-运賃指数sppi-口径拆分\" aria-hidden=\"true\"><\/a>3.4 运賃指数（SPPI 口径拆分）<\/h3>\n<ul>\n<li>日銀企業向けサービス価格指数（SPPI，2020 年基准）<strong>2026 年 9 月速報<\/strong>（2026-10-27 公表）：「<strong>道路貨物輸送<\/strong>」前年同月比 <strong>+4.6%<\/strong>（8 月 +4.3%、+0.3pt 加速）——与本项目最相关的运价口径。[Source: https://www.boj.or.jp/statistics/pi/cspi_release/sppi2609.pdf, 2026]<\/li>\n<li>大分類「<strong>運輸・郵便<\/strong>」+8.4%（8 月 +6.8%），但加速主因为<strong>外航貨物輸送 +97.7%<\/strong>（国际海运市况），与国内卡车运价不可混同；「運輸・郵便（除く国際運輸）」+3.2%。[Source: 同上]<\/li>\n<li>総平均指数 <strong>115.5（+3.7%）<\/strong>；総平均（除く国際運輸）114.4（+2.9%）。SPPI 与 CGPI 为不同统计，CGPI 不覆盖运输服务，故本项目运价指标以 SPPI 为准。[Source: https://www.boj.or.jp/statistics/pi/sppi_2020/, 2026]<\/li>\n<li>WebKit 运賃指数 <strong>142<\/strong>（2026-10）为媒体转引口径，与 SPPI 口径不同，仅作旁证；并列 2026-09 = 143（LogiShift 口径）。[Source: https://cargo-news.online/news/detail.php?id=12653, 2026; https://logishift.net/stats/truck-freight-rate-index/, 2026]<\/li>\n<li>标准运賃：令和 6 年告示第 209 号（2024-03）水准 <strong>+8%<\/strong> 并新增装卸费加算；价格转嫁率 2023-09 的 24.2% → 2025-09 的 <strong>34.7%<\/strong>（中小企业厅）。[Source: https://jta.or.jp/member/kaisei_jigyoho/unchin_new.html, 2024]<\/li>\n<li><strong>结论（推断）<\/strong>：国内卡车运价涨幅仍在 4–5% 区间稳步上行，但<strong>低于同期运输业现金给与 +4.9% 的名义工资涨幅<\/strong>（口径不同，仅并列观察）——单位运价对工资的覆盖在边际上收紧。<\/li>\n<\/ul>\n<h3 id=\"35-2026-11-12\"><a id=\"35-净收入参考模型推断汇率-2026-11-12\" aria-hidden=\"true\"><\/a>3.5 净收入参考模型（推断，汇率 2026-11-12）<\/h3>\n<p><strong>模型输入参数（均官方来源）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">参数<\/th>\n<th style=\"width:50%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://www.kyoukaikenpo.or.jp/about/business/insurance_rate/rate_prefectures/r08/\">健康保险料率（协会けんぽ令和 8 年度，劳动折半）<\/a><\/td>\n<td>东京 9.85%／大阪 10.13%＋子ども·子育て支援金 0.23%（2026-04 起全国）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.nenkin.go.jp/service/kounen/hokenryo/hoshu/20150515-01.html\">厚生年金<\/a><\/td>\n<td>18.3%、本人折半 9.15%<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://jsite.mhlw.go.jp/yamagata-roudoukyoku/koyouhoken-20260316.html\">雇用保险（一般事业，本人负担）<\/a><\/td>\n<td>0.5%<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://www.nta.go.jp/publication/pamph/gensen/zeigakuhyo2026/01.htm\">源泉征收<\/a><\/td>\n<td>国税厅令和 8 年分税额表（2026-01 改定）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>示例概算（月给总额 30 万円、东京、40 岁未满、单身无扶养——全部为推断）<\/strong>：社保约 4.4 万円＋所得税约 0.44 万＋住民税约 0.85 万 → <strong>到手约 24.3 万円/月<\/strong>（入职首年无前年住民税约 25.2 万円）。模型未含赏与、通勤手当等非课税 / 变动项。<\/p>\n<p><strong>中日对比（推断，自算折算）<\/strong>：日本司机到手约 24.3 万円/月，按中国外汇交易中心 2026-11-12 中间价（100 日元 = <strong>4.2024 元<\/strong>）折算约 <strong>1.02 万元人民币/月<\/strong>（243,000 円 × 0.042024 ≈ 10,212 元，自算）；对照中国交通运输、仓储和邮政业（城镇非私营单位）年均工资 <strong>133,981 元<\/strong>（约 11,165 元/月，2025 年数据，2026-05-15 发布，税前毛、年薪均摊）。<strong>判断（推断）<\/strong>：日本到手低于中国同行业税前毛均值，但显著高于中国同岗实际到手；中国侧为行业平均（含仓储邮政及管理、文职岗，非司机岗位精确值）。口径差异声明：日本侧为名义月额（含超勤等现金支付、未含赏与），中国侧为税前毛年薪 ÷12 均摊，两国社保 / 税扣除结构不同，折算采用单一时点中间价，未做期间平均——<strong>上述比较全部为推断，非同口径精确对位<\/strong>。[Source: https://www.chinamoney.com.cn/chinese/bkccpr/, 2026; https://www.stats.gov.cn/sj/zxfb/202605/t20260515_1963707.html, 2026]<\/p>\n<hr />\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<h3 id=\"41-ma\"><a id=\"41-雇主生态与-mampa\" aria-hidden=\"true\"><\/a>4.1 雇主生态与 M&amp;A<\/h3>\n<ul>\n<li><strong>行业整合<\/strong>：SGHD 2024-07 将名糖运输、ヒューテックノオリン纳入集团，2025 年度收购 Morrison；日通出售低收益资产资金投入 M&amp;A。[Source: https://www.sg-hldgs.co.jp/ir/management/directormessage/, 2026; https://pdf.irpocket.com/C9147/doF3/OcDN/QgbQ.pdf, 2025]<\/li>\n<li><strong>政策支援<\/strong>：国交省依产业竞争力强化法认定「特别事业再编计划」；SMRJ 事业承继门户、政策金融公库承继 Matching 支援累计约 700 社（2022）。[Source: https://www.mlit.go.jp/jidosha/jidosha_tk5_000038.html; https://shoukei.smrj.go.jp/; https://www.jfc.go.jp/n/release/pdf/topics_220805a.pdf, 2022]<\/li>\n<li><strong>雇主类型（货运司机视角）<\/strong>：大型综合物流（佐川急便 / SGHD、雅玛多、日通、福山通运）——全国网络、特定技能接收先行、待遇公告高于行业均值；地方中坚运输企业——地方缺人明显、竞争小、直接应聘官网；仓储 / 冷链 / 特殊车辆专业业者——附加手当、时限严。行业结构与赛道分析见 <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>。<\/li>\n<\/ul>\n<h3 id=\"42-sghd\"><a id=\"42-重点雇主核实sghd-财报\" aria-hidden=\"true\"><\/a>4.2 重点雇主核实（SGHD 财报）<\/h3>\n<ul>\n<li><strong>SGHD（9143）FY2027/3 第 2 四半期累计<\/strong>（2026.4–9，2026-11-06 官方決算短信）：営業収益 <strong>9,204 億 3,700 万円（+17.6%）<\/strong>、営業利益 <strong>414 億 4,000 万円（+7.5%）<\/strong>、経常利益 <strong>397 億 9,100 万円（+4.4%）<\/strong>、純利益 <strong>279 億 2,900 万円（+19.8%）<\/strong>；同时上调通期経常利益 3%、增配 1 円。[Source: https://www.release.tdnet.info/inbs/140120261106567754.pdf, 2026]<\/li>\n<li><strong>结论（推断）<\/strong>：增收显著快于增利（+17.6% vs +4.4%），符合「电商宅配量增＋人工成本上升」的组合；对外籍司机招聘的含义是<strong>用工需求仍在扩张，但薪资谈判空间受利润率约束<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"43\"><a id=\"43-运价改定与企业动向\" aria-hidden=\"true\"><\/a>4.3 运价改定与企业动向<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">企业<\/th>\n<th style=\"width:33%\">动向<\/th>\n<th style=\"width:34%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>佐川急便<\/td>\n<td>2027-01-01 起宅配便平均 <strong>+13.8%<\/strong><\/td>\n<td><a href=\"https://www2.sagawa-exp.co.jp/newsrelease/detail/2026/1002_2672.html\">佐川急便新闻稿<\/a><\/td>\n<\/tr>\n<tr>\n<td>福山通运<\/td>\n<td>2026-11 起较 FY2024 约 <strong>+20%<\/strong><\/td>\n<td><a href=\"https://logishift.net/2026/10/27/post-9951/\">LogiShift<\/a><\/td>\n<\/tr>\n<tr>\n<td>雅玛多<\/td>\n<td>2024-04 个人报价约 <strong>+2%<\/strong><\/td>\n<td><a href=\"https://www.yamato-hd.co.jp/english/news/2023/pdf/newsrelease_20240112_en01.pdf\">雅玛多 HD 公告<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>运賃→工资传导（推断声明）<\/strong>：全日本トラック協会（全ト协）调查大型司机月薪 +4% 表明转嫁已部分传导；但 2026 春斗卡车业加薪率 3.85% 低于全产业 5.02%，表明传导不完全。两处判断均为<strong>推断<\/strong>。[Source: https://logishift.net/2026/08/06/post-7782/, 2026; https://www.jil.go.jp/kokunai/blt/backnumber/2026/06/blm_sanbetsu.html, 2026]<\/li>\n<\/ul>\n<h3 id=\"44\"><a id=\"44-外国人雇佣动向\" aria-hidden=\"true\"><\/a>4.4 外国人雇佣动向<\/h3>\n<ul>\n<li>佐川急便 2025 年以特定技能接收<strong>越南司机<\/strong>（业界首批案例之一）；2025-09 与 TDG 合办特定技能司机采用讲座。[Source: https://yuso.co.jp/20251014-12/, 2025; https://www.trucknews.biz/article/r091138/, 2025]<\/li>\n<li>特定技能专门中介 / 登录支援机关为风险最低的招募主渠道（与接受企业绑定、包支援义务）——详见 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>。<\/li>\n<\/ul>\n<h3 id=\"45\"><a id=\"45-未核实实体\" aria-hidden=\"true\"><\/a>4.5 未核实实体<\/h3>\n<ul>\n<li>日通「月最大 5 万円加薪」报道无法溯源，已降级为未证实，不在本报告作为事实引用。<\/li>\n<li>各企业「特定技能受入计划书认定」状态未在本版逐家核实 → 见 8.4 待复核清单。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<h3 id=\"51\"><a id=\"51-岗位区分与技能日语要件\" aria-hidden=\"true\"><\/a>5.1 岗位区分与技能·日语要件<\/h3>\n<p>见 2.2 分野人材基准表。要点：本分野岗位按<strong>卡车运転者 / 出租车运転者 / 巴士运転者<\/strong>三区分管理，日语要件与技能要件各不相同；卡车为监测重点，技能要件为「評価試験（トラック）合格＋第一種運転免許」，日语为 A2.2 相当以上（JFT-Basic A2.2 或 JLPT N4）。业务范围为卡车 / 出租车 / 巴士驾驶员（限事业用车辆）及附带业务。[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/p>\n<h3 id=\"52\"><a id=\"52-技能試験内容实施要领\" aria-hidden=\"true\"><\/a>5.2 技能試験内容实施要领<\/h3>\n<ul>\n<li><strong>形式<\/strong>：CBT 或纸面；学科 30 问（○×）＋实技 20 问（三选一），共 80 分钟，各正答率 ≥60% 合格；试题日语（附注音）。[Source: https://www.mlit.go.jp/jidosha/content/001851696.pdf, 2024-12 施行]<\/li>\n<li><strong>考期与考位<\/strong>：CBT 无固定考期、考位有空随时可考；实施地 18 国（日本、印度、印尼、乌兹别克、吉尔吉斯、柬埔寨、斯里兰卡、泰国、尼泊尔、巴基斯坦、孟加拉、菲律宾、马来西亚、缅甸、蒙古、老挝、越南、塔吉克）——<strong>中国大陆无考点<\/strong>；出差考试限企业申请（海外 50 枠起）。月报最新为 2026 年 9 月分（2026-10-15 发布）；2026 年 10 月分截至基准日未发布。[Source: https://sswt-portal.classnk.or.jp/area?tab=3, 2026; https://sswt-portal.classnk.or.jp/news/, 2026]<\/li>\n<li><strong>官方教材<\/strong>：官方免费样本题见 ClassNK Portal；全日本トラック協会发布面向外国人的学習用テキスト。[Source: https://sswt-portal.classnk.or.jp/area?tab=3-1, 2026; https://jta.or.jp/member/driver/ssw_text.html, 2026]<\/li>\n<\/ul>\n<h3 id=\"53\"><a id=\"53-日本語試験要求\" aria-hidden=\"true\"><\/a>5.3 日本語試験要求<\/h3>\n<ul>\n<li><strong>JFT-Basic<\/strong>：随時 CBT；海外 14 国 / 27 都市＋日本国内 10 都道府县——<strong>中国大陆不在实施地<\/strong>；2026-08 起增判 A1 / A2.1（育成就労对应）；日本国内受验费 <strong>10,000 円<\/strong>（含消费税相当额，因国而异）。[Source: https://www.prometric-jp.com/zh-CHS/ssw/, 2026; https://www.prometric-jp.com/ssw/exam/fee/, 2026]<\/li>\n<li><strong>JLPT<\/strong>：中国大陆每年 2 回（2026 年 7 月 5 日、12 月 6 日）；N4 / N5 报名费 <strong>450 元<\/strong>、N1 / N2 550 元。<strong>2026 年 12 月 N1–N5 全等级报名截止前满员<\/strong>。[Source: https://jlpt.neea.cn/faq.html, 2026]<\/li>\n<li><strong>适用口径<\/strong>：卡车区分 A2.2 相当以上（JFT-Basic A2.2 以上或 JLPT N4 以上）；出租车 / 巴士区分 2027-04-01 起 COE 申请须 B1 相当以上。技能实习 2 号良好修了者免试并视为满足 A2 相当。<\/li>\n<\/ul>\n<h3 id=\"54\"><a id=\"54-考试准备路径建议--推断\" aria-hidden=\"true\"><\/a>5.4 考试准备路径（建议 / 推断）<\/h3>\n<ol>\n<li><strong>技能試験优先<\/strong>：官方样本题＋全ト协テキスト为唯一官方教材；CBT 随时可考、80 分钟 / 60% 合格线、10 年有效；中国大陆无考点，需在日或第三国受验（越南、印尼等）。<\/li>\n<li><strong>日语路径重排（建议）<\/strong>：①首选 JFT-Basic A2.2（日本国内 11 处、每月多次；境外考点须查当年度实施国）②次选 2027 年上半年 JLPT（报名窗口通常在 3 月前后，需按当年公告确认，推断）③已在日者可先以特定活动（準備）入境再受验。<\/li>\n<li><strong>全流程费用速算（推断汇总）<\/strong>：技能試験 6,500 円＋JFT-Basic 10,000 円（或 JLPT 450 元）＋签证 715 元＋COE 免费＋（如需在日考驾照另计 30–40 万円）——制度性现金门槛仍低，主要成本在驾照与支援环节。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<h3 id=\"61-2024\"><a id=\"61-驾照体系与车种对应2024-年新制度后\" aria-hidden=\"true\"><\/a>6.1 驾照体系与车种对应（2024 年新制度后）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">车牌种类<\/th>\n<th style=\"width:33%\">对应车辆<\/th>\n<th style=\"width:34%\">取得要件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>普通免许<\/td>\n<td>总重 3.5t 未满（货物 2t 未满）<\/td>\n<td>2024-05 起新设<strong>準中型<\/strong>，普通范围收窄<\/td>\n<\/tr>\n<tr>\n<td>準中型免许<\/td>\n<td>总重 3.5–7.5t<\/td>\n<td>新制度下进入中型世界的第一张牌<\/td>\n<\/tr>\n<tr>\n<td>中型免许<\/td>\n<td>总重 7.5–11t<\/td>\n<td>需 21 岁＋驾龄 2 年（取得时点）<\/td>\n<\/tr>\n<tr>\n<td>大型免许<\/td>\n<td>11t 以上<\/td>\n<td>需 21 岁＋驾龄 3 年（取得时点）<\/td>\n<\/tr>\n<tr>\n<td>第二种免许<\/td>\n<td>载客（出租车 / 巴士）<\/td>\n<td>特定技能出租车 / 巴士路径才需要<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>特定技能 1 号<\/strong>：第一种驾照即可；AT 限定需在期限内解除或换 MT。[Source: https://www.moj.go.jp/isa/policies/ssw/automobiletransportation, 2026]<\/li>\n<li><strong>外免切替（中国驾照）<\/strong>：中国不在 29 国免除对象；普通免许可换，<strong>准中 / 中型需另考<\/strong>；2025-10 起严格化（知识确认 50 题正确率 90%＋技能确认，审查基准 70%）。[Source: https://www.police.pref.chiba.jp/menkyoka/licence_info-11.html, 2025]<\/li>\n<\/ul>\n<h3 id=\"62\"><a id=\"62-驾照取得路径与费用\" aria-hidden=\"true\"><\/a>6.2 驾照取得路径与费用<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">要点<\/th>\n<th style=\"width:34%\">费用 / 合格率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>外免切替（持中国驾照）<\/td>\n<td>知识确认＋技能确认（2025-10 严格化：新增横断步道课题）<\/td>\n<td>知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025-10–12，警察庁，经 drivey.jp 转引）<\/td>\n<\/tr>\n<tr>\n<td>在日新考取（普通 MT）<\/td>\n<td>18 岁～<\/td>\n<td>约 400,550 円（税込示例，气仙沼中央自动车学校）；全国 MT 通学行情 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）<\/td>\n<\/tr>\n<tr>\n<td>普通（AT 限定）<\/td>\n<td>官方月次均价<\/td>\n<td><strong>324,381 円<\/strong>（総務省「小売物価統計調査」2026-09 全国平均，最新月）<\/td>\n<\/tr>\n<tr>\n<td>大型<\/td>\n<td>21 岁＋满 3 年<\/td>\n<td><strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06，持中型起）<\/td>\n<\/tr>\n<tr>\n<td>中型<\/td>\n<td>20 岁＋持其他驾照满 2 年<\/td>\n<td>全国均价待核实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>口径说明<\/strong>：総務省口径为 AT 限定月次均价，くらシム / TRUCK-BANK 为 MT / 大型区间行情，两者口径不同，仅作区间级交叉验证，不作精确对位；<strong>全国无 MT 专用官方均价<\/strong>。hajimen.com「普通 MT 全国平均 308,090 円」为 2015 年调查值，不得作为现行均价引用。[Source: https://www.e-stat.go.jp/stat-search/database?layout=dataset&amp;statdisp_id=0003449368, 2026; https://kurasim.com/blog/driving-school-cost-guide, 2026; https://www.truck-bank.net/knowledge/06-license-regulations/license-acquisition-cost/, 2026]<\/li>\n<li>⚠️ 特定活动入境后未取得日本驾照则不能转特定技能 1 号——<strong>驾照是全流程的关键路径依赖<\/strong>。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<\/ul>\n<h3 id=\"63\"><a id=\"63-登録支援機関制度与费用行情\" aria-hidden=\"true\"><\/a>6.3 登録支援機関（制度与费用行情）<\/h3>\n<ul>\n<li><strong>职责<\/strong>：代雇主实施「义务性支援 10 项目」（事前指导、接送、住房·生活契约、生活指导、陪同行政手续、日语学习机会、咨询处理、交流促进、转职支援、每 3 个月以上面谈·通报）；不得再委托。[Source: https://www.moj.go.jp/isa/policies/ssw/supportssw.html, 2026]<\/li>\n<li><strong>登录要件<\/strong>：须能实施支援计划全部项目；登录 5 年有效，手续费新登录 <strong>28,400 円<\/strong> / 更新 11,100 円；本分野受托支援机关还须加入国交省协议会（免费）。<\/li>\n<li><strong>市场行情<\/strong>（官方不定价；第三方 2026-04 更新）：初期 0–10 万円＋<strong>月额 2–4 万円/人<\/strong>；登录机构逾 8,000 家；月额 1 万円以下属异常低价（推断性经验值，非官方定价）。[Source: https://foreignworker-guide.com/articles/how-to-choose-support-agency/, 2026]<\/li>\n<li><strong>支援体制要件改正（2027-04-01 施行）<\/strong>：①支援責任者及支援担当者按支援事业所各选任 1 名以上常勤役员或职员（可兼任）；②可从事支援业务者限定为支援責任者等；③支援責任者须受讲支援能力提升养成讲习（施行后当分の間未修了亦可）；④支援担当者数须超过「受托特定技能所属机关数 ÷10」且超过「在支援 1 号人数 ÷50」。[Source: https://www.moj.go.jp/isa/10_00263.html, 2026]<\/li>\n<\/ul>\n<h3 id=\"64\"><a id=\"64-证书路线图分阶段建议\" aria-hidden=\"true\"><\/a>6.4 证书路线图（分阶段，建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">阶段<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>入境前<\/td>\n<td>JLPT N4 / JFT-Basic A2.2 ＋ 技能試験合格 → COE → 签证<\/td>\n<\/tr>\n<tr>\n<td>特定活动（準備）期间<\/td>\n<td>外免切替或新考驾照（普通 / 準中型）＋ 新任驾驶员讲习<\/td>\n<\/tr>\n<tr>\n<td>入职后 0–12 个月<\/td>\n<td>第一种驾照实务积累；视条件向中型 / 大型升级（21 岁＋驾龄要件）<\/td>\n<\/tr>\n<tr>\n<td>入职后 12 个月＋<\/td>\n<td>運行管理者资格、安全運転管理者讲习等管理类资格（→ <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本章为建议与推断层，与前三节事实数据分离；不承诺就业结果、不保证薪资水平、不给「必过」式断言。<\/p>\n<\/blockquote>\n<h3 id=\"71\"><a id=\"71-入境路径与在留手续建议\" aria-hidden=\"true\"><\/a>7.1 入境路径与在留手续（建议）<\/h3>\n<ol>\n<li><strong>路径主干<\/strong>：海外申请者先以「特定活动」（特定自动车运送业准备）入境（2025-02-17 起受理；卡车最长 6 个月），办理驾照（外免切替）与研修；未取得日本驾照则不能转入特定技能 1 号，变更审查期可特例在留最长 2 个月。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li><strong>COE 与签证<\/strong>：雇主代办在留资格认定证明书（手续费免费、标准审查 1–3 个月）→ 驻外使领馆签证（单次 715 元、二次 / 数次 1,430 元，2026-07-01 起受理件）→ 入境。[Source: https://www.moj.go.jp/isa/applications/procedures/16-1, 2026]<\/li>\n<li><strong>在留落地<\/strong>：在留卡在成田 / 羽田 / 中部 / 关西 / 新千岁机场当场发放；入住后 <strong>14 日内<\/strong>向市区町村住民登记（逾期可处 20 万円以下罚金）；持 My Number 卡可在留诸申请电子化；引越し转出 / 转入可在线办理。[Source: https://www.moj.go.jp/isa/publications/faq/newimmiact_4_q-and-a_page3.html, 2026]<\/li>\n<li><strong>生活支援<\/strong>：受入机关负有支援义务（住房确保、生活 orientation 含银行 / 手机合同协助）；生活咨询总入口为入管厅外国人生活支援 Portal。[Source: https://www.moj.go.jp/isa/support/portal/, 2026]<\/li>\n<\/ol>\n<h3 id=\"72\"><a id=\"72-招募渠道与中介资质建议\" aria-hidden=\"true\"><\/a>7.2 招募渠道与中介资质（建议）<\/h3>\n<ul>\n<li><strong>中国路径官方明示<\/strong>：<strong>商务部批准资质的对外劳务合作企业<\/strong>＋日方公共职业安定所（ハローワーク）。资质查询入口：商务部对外劳务合作企业名单（femhzs.mofcom.gov.cn）；无资质出国务工属违法。[Source: https://www.ssw.go.jp/cn/about/step/, 2026; https://ao.mofcom.gov.cn/aqtz/art/2024/art_f0ce83f61c9240d39e775a23fcff8827.html, 2024]<\/li>\n<li><strong>非法中介特征（推断汇总）<\/strong>：无法提供商务部资质编号、要求前置大额「保证金」、承诺「免考包过」（技能試験为 ClassNK 统一实施，无免考通道）。<\/li>\n<li><strong>渠道建议<\/strong>：特定技能专门中介 / 登录支援机关为风险最低主渠道（与接受企业绑定、包支援义务）；签约前核对「对外劳务合作经营资格证书」与日本侧受入机关名（可与 ISA 登录支援機関名单交叉核对）。<\/li>\n<li>渠道矩阵、地域选择、简历面试与契约审查的完整清单见 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a> 第 7 节。<\/li>\n<\/ul>\n<h3 id=\"73\"><a id=\"73-薪酬谈判与成本速算建议--推断\" aria-hidden=\"true\"><\/a>7.3 薪酬谈判与成本速算（建议 / 推断）<\/h3>\n<ul>\n<li><strong>谈判基准<\/strong>：特定技能 1 号硬性要求「工资与日本人同等以上」——面试时拿同岗位日本员工待遇基准对照；谈 offer 时先确认口径（含赏与年收 ≠ 月均现金给与）。<\/li>\n<li><strong>成本速算（推断汇总）<\/strong>：技能試験 6,500 円＋JFT-Basic 10,000 円（或 JLPT 450 元）＋签证 715 元＋COE 免费＋（如需在日考驾照另计 30–40 万円）＋支援费行情 2–4 万円/人·月。<\/li>\n<li><strong>警惕点（推断）<\/strong>：月给低于当地行情 20% 以上且无手当明细的特定技能转介合同；支援费异常低价（月额 1 万円以下）的登録支援機関可能降低法定支援质量。<\/li>\n<\/ul>\n<h3 id=\"74\"><a id=\"74-风险提示与维权渠道建议\" aria-hidden=\"true\"><\/a>7.4 风险提示与维权渠道（建议）<\/h3>\n<ul>\n<li><strong>工资拖欠 / 不当解雇<\/strong>：劳动基准监督署受理；劳动条件咨询 Hotline <strong>0120-811-610<\/strong>（免费、匿名、多语言）。[Source: https://www.check-roudou.mhlw.go.jp/lp/hotline/, 2026]<\/li>\n<li><strong>外国人专门窗口<\/strong>：各都道府県労働局「外国人労働者相談コーナー」与「外国人特別相談·支援室」（东京 FRESC 有中文页面）。[Source: https://www.check-roudou.mhlw.go.jp/soudan/foreigner.html, 2026; https://jsite.mhlw.go.jp/tokyo-roudoukyoku/fresc_cn.html, 2026]<\/li>\n<li><strong>合规提示（推断）<\/strong>：登録支援機関侧 2027-04-01 起实施支援体制要件改正，若签约时对方以「人数上限」为由缩减支援频次，属于可核查的合规问题，应要求书面说明并向労働局咨询。<\/li>\n<li><strong>安全红线<\/strong>：酒测出车前后各一次，检出即当日停驾；特定技能者因酒精 / 药物事故几乎必然失去在留资格——安全规范与红线详见 <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a> 第 2 节。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 级（官方原件直接读取）<\/strong>：ISA 受入见込数·在留者数表（001472175.pdf，2026-11-06 版）；ISA「B1 相当以上の確認開始時期」页（2026-09-30）；運用要領別冊 自動車運送業分野（001472534.pdf，令和 8 年 10 月 9 日一部改正）；ISA「JFT-Basic 活用」公告（001471906.pdf，2026-10-05）；ISA 支援体制要件改正页（10_00263.html，2026-07-28）；MLIT トラック適正化二法页与物流効率化法页；日銀 SPPI 2026 年 9 月速报（sppi2609.pdf，2026-10-27）；TSR / TDB 2026 年 10 月倒产页；上海 / 青岛 / 重庆总领事馆签证费页；厚労省毎月勤労統計 2026-09 分。<\/li>\n<li><strong>B 级（行业机构 / 企业一手）<\/strong>：ClassNK Portal 公告一览（最终更新 2026-10-15）；RoAD to the L4 いすゞ成果报告（2026-03-05）；柏市新闻发布（2025-12-10）；全ト协「2025 年度版」工资调查；SGHD 官方決算短信（release.tdnet.info）。<\/li>\n<li><strong>C 级（媒体 / 聚合转载）<\/strong>：kabutan SGHD 决算速报；logi-today 工资数值比对；求人聚合层（genbars / works.aqsh / gojob / 求人Box）；LogiShift / Cargo News 转引。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>受入上限<\/td>\n<td><strong>22,100<\/strong>（2026-01-23 阁议，现行）≠ 24,500（旧方针，已废止；ssw.go.jp 未同步）<\/td>\n<\/tr>\n<tr>\n<td>司机缺口<\/td>\n<td>政策包 14% / 34%（示意图）≠ NX 总研试算 2025 年度 110,809 / 2030 年度 162,912<\/td>\n<\/tr>\n<tr>\n<td>工资<\/td>\n<td>厚労省毎月勤労統計（现金给与总额，不含赏与）≠ 全ト协「賃金・労働時間等の実態」（含赏与）<\/td>\n<\/tr>\n<tr>\n<td blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向准备或正在日本从事货运司机工作的读者，兼具求职顾问与现场落地指导视角。\n<strong>来源规则<\/strong>：统计与制度类须取日文官方原文（厚生労働省 / 国土交通省 / 警察庁）；求人样本标注平台与采集日期，官方统计活值只读引用 01-ssw-driver 登记册。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>主题定义<\/strong>：货运司机职业（路线配送 / 仓库内配送 / 一般区域 / 冷链 / 中型・大型干线 / 特殊车辆）的岗位谱系与车种驾照对应、薪资结构与工时合规、安全规范与现场制度、现场经验积累与可量化成果记录、求职渠道与契约审查、实际工作条件记录（月度 / 半年 / 凭证归档，兼永住证据链）。<\/p>\n<p><strong>监测边界<\/strong>：不含载客（出租车 / 巴士）与技能实习（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）、不含行业结构与 2024 年問題（→ <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>）、不含自动驾驶技术路线（→ <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>）、不含法规条文解读（→ <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>）、不含收入环境与地域差（→ <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>）、不含日语学习计划（→ <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>）、不含管理岗过渡与晋升档案（→ <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>）；官方统计活值（工资 / 缺口 / 求人倍率）由 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 主责，本主题只读引用。<\/p>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<blockquote>\n<p>本版为 2026-11 月度报告复用生成。登记册活值基准为 <strong>baseline<\/strong>（首值取自 2026-11-12 追踪表硬编码值迁移）；下表覆盖登记册全部 <strong>5 项核心指标<\/strong>；未变动项注明「截至 2026-11-14 无更新」。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">本版活值（来源 · 时点）<\/th>\n<th style=\"width:25%\">变更状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>運輸業月均工资<\/td>\n<td><strong>341,158 円<\/strong>（2026-09，锚 01-ssw-driver #5；厚労省毎月勤労統計，2026-11-06 公布）<\/td>\n<td>无更新（截至 2026-11-14）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>全ト协賃金実態最新版<\/td>\n<td><strong>2025 年度版<\/strong>（+5.3% 全职务；jta.or.jp，2026-07-01 公表）<\/td>\n<td>无更新（截至 2026-11-14）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>求人样本库规模与核实状态<\/td>\n<td><strong>9 样本<\/strong>全部四元组立档、官网回溯完成（锚 01-ssw-driver 3.3 表）<\/td>\n<td>无更新（截至 2026-11-14）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>大型 / 中型免许取得路径费用<\/td>\n<td>大型 <strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06）；MT 通学 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）；锚 01-ssw-driver #14：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09）<\/td>\n<td>无更新（截至 2026-11-14）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>个人工作条件记录最新周期<\/td>\n<td><strong>待记录<\/strong>（06 文档模板已建立，尚无首条数据）<\/td>\n<td>无更新（截至 2026-11-14）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>口径清单（并列不合并，无更新）<\/strong>：含赏与年收（约 430 万，行业报告 2026）≠ 月均现金给与（341,158 円，厚労省 2026-09）；时间外上限（月 45h·年 360h / 年 960h / 月 100h 未满，厚労省 2024-04 起）；求人样本月収（平台标注含 / 不含手当口径须注明）。<\/li>\n<li><strong>观察项与触发器状态<\/strong>（摘自登记册）：首期为空——唯一观察项、首要触发器、触发器结论均为空。<\/li>\n<\/ul>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>首期为空；本版为复用生成，<strong>继承历史报告已修正事实清单，无新增修正<\/strong>。<\/p>\n<h3 id=\"_4\"><a id=\"核心判断\" aria-hidden=\"true\"><\/a>核心判断<\/h3>\n<ol>\n<li><strong>薪资口径必须区分含赏与与不含赏与<\/strong>（事实）：含赏与年收约 <strong>430 万日元<\/strong>（月收约 27 万＋年间赏与约 106 万，行业报告口径，原始来源待核验）与官方月均现金给与 <strong>341,158 円<\/strong>（不含赏与，厚労省毎月勤労統計 2026-09，锚 01-ssw-driver #5）<strong>不可直接对比<\/strong>；谈 offer 时须先确认口径。[Source: https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/2609p.html, 2026]<\/li>\n<li><strong>2024 新规降低加班收入天花板，但运力缺口构成长期利好<\/strong>（事实＋推断）：月 45h / 年 360h 上限与月 100h 未满红线压低加班收入；2030 年度缺口 <strong>162,912 人<\/strong>（约 16 万，锚 01-ssw-driver #4，NX 总研试算）意味着行业结构性缺人——<strong>推断：对外国人司机长期利好<\/strong>。[Source: https://driver-roudou-jikan.mhlw.go.jp/truck/notice, 2026]<\/li>\n<li><strong>特定技能专门中介 / 登录支援机关是风险最低主渠道<\/strong>（建议）：与接受企业绑定、包支援义务；筛选须核「特定技能受入计划书认定」（未认定企业无法雇特定技能者）。<\/li>\n<li><strong>驾照路径是落地关键瓶颈<\/strong>（事实）：外免切替普通免许可换、准中 / 中型需另考；普通教习全国官方均价 324,381 円（AT 限定，総務省 2026-09）；大型 25–28 万円（TRUCK-BANK 2026-06）；MT 通学 30–40 万円（くらシム 2026-10-18）。<\/li>\n<li><strong>个人工作条件记录是永住证据链与转职谈判的基础设施<\/strong>（建议 / 推断）：月度 / 半年记录与凭证归档直接服务自我保护、转职谈判与永住审查；登记册 #5 目前为「待记录」。<\/li>\n<\/ol>\n<h3 id=\"_5\"><a id=\"关键数字卡\" aria-hidden=\"true\"><\/a>关键数字卡<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新值<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">时点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>運輸業月均工资<\/td>\n<td>341,158 円（不含赏与）<\/td>\n<td>厚労省毎月勤労統計（锚 01 #5）<\/td>\n<td>2026-09（2026-11-06 公布）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>全ト协賃金実態最新版<\/td>\n<td>2025 年度版（+5.3% 全职务）<\/td>\n<td>全日本トラック協会<\/td>\n<td>2025 年度（2026-07-01 公表）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>求人样本库<\/td>\n<td>9 样本四元组立档、官网回溯完成<\/td>\n<td>01-ssw-driver 3.3 表<\/td>\n<td>v2026.11.12_5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>驾照取得费用<\/td>\n<td>大型 25–28 万円；MT 通学 30–40 万円；普通 AT 限定均价 324,381 円<\/td>\n<td>TRUCK-BANK / くらシム / 総務省 e-Stat<\/td>\n<td>2026-06 / 2026-10-18 / 2026-09<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>个人工作条件记录<\/td>\n<td>待记录<\/td>\n<td>06 文档<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"_6\"><a id=\"调研说明\" aria-hidden=\"true\"><\/a>调研说明<\/h3>\n<ul>\n<li><strong>来源语言规则<\/strong>：统计与制度类须取日文官方原文（厚生労働省、国土交通省、警察庁）；求人样本标注平台与采集日期；官方统计活值（工资 / 缺口 / 求人倍率）以 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 为单一事实源，本主题只读引用、不独立改值。<\/li>\n<li><strong>时效窗口<\/strong>：统计类近 12 个月内优先；求人样本标注采集日期。<\/li>\n<li><strong>推断标注约定<\/strong>：凡标「推断」均为分析判断，非官方结论；建议章标「建议 / 推断」，与事实数据明确分离。<\/li>\n<li><strong>结论边界<\/strong>：允许框架性求职、谈判与自我管理建议，不承诺就业结果、不保证薪资水平、不给「必过」式断言；不给投资评级、不出具 Go/No-Go 决策建议。<\/li>\n<li><strong>结构说明<\/strong>：本报告按职业就业调研型九节骨架组织；第 4 节「雇主与企业类型细分」为按骨架新设的独立节（本主题素材以手册 05 渠道矩阵、手册 06 公司概况模板与只读引用 01 雇主信息构建）。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<h3 id=\"21-2024\"><a id=\"21-岗位制度框架2024-年新制度后\" aria-hidden=\"true\"><\/a>2.1 岗位制度框架（2024 年新制度后）<\/h3>\n<ul>\n<li><strong>车种与驾照对应<\/strong>（2024 年新制度后，见 5.2 表）：普通免许（总重 3.5t 未满）、準中型（3.5–7.5t，2024-05 新设）、中型（7.5–11t）、大型（11t 以上）、第二种免许（载客）。（来源：本主题知识手册 01，2026-11-11 核对）<\/li>\n<li><strong>特定技能 1 号考试<\/strong>：第一种驾照即可；AT 限定需在期限内解除或换 MT。<\/li>\n<li><strong>职业驾驶资格<\/strong>＝驾照＋雇主实施的<strong>事業用自動車運転者講習<\/strong>（新任驾驶员讲习）。<\/li>\n<li><strong>外免切替（中国驾照）<\/strong>：普通免许可直接换；准中 / 中型需另考——手续与在留条件见 <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>，驾照费用行情见 <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification<\/a>。<\/li>\n<\/ul>\n<h3 id=\"22-2024-6-2024\"><a id=\"22-2024-年令和-6-年劳动合规新规物流-2024-年问题\" aria-hidden=\"true\"><\/a>2.2 2024 年（令和 6 年）劳动合规新规——「物流 2024 年问题」<\/h3>\n<p>2024-04-01 起，自动车运送业全面适用働き方改革：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">规制<\/th>\n<th style=\"width:50%\">数值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>时间外劳动上限（原则）<\/td>\n<td><strong>月 45 小时 · 年 360 小时<\/strong><\/td>\n<\/tr>\n<tr>\n<td>特别条项（36 协定）上限<\/td>\n<td><strong>年 960 小时<\/strong><\/td>\n<\/tr>\n<tr>\n<td>时间外＋休日劳动合计<\/td>\n<td><strong>月 100 小时未满<\/strong>、2–6 个月平均 80 小时以内<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>来源：厚生劳动省ポータルサイト <a href=\"https://driver-roudou-jikan.mhlw.go.jp/truck/notice\">driver-roudou-jikan<\/a>（2026）。<\/p>\n<p><strong>对个人的影响<\/strong>：<\/p>\n<ol>\n<li><strong>加班收入天花板下降<\/strong>（新规前月 100h+ 加班的公司很多）——工资谈判时看公司<strong>是否已适应新规<\/strong>（适应差的公司可能转嫁为倒班增加或大量离职）。<\/li>\n<li><strong>运力不足 → 行业结构性缺人 → 对外国人司机反而是长期利好<\/strong>（2030 年度缺口 162,912 人、约 16 万，见监测项目 #4，锚 01-ssw-driver）。<\/li>\n<li><strong>月 100h 未满是红线<\/strong>：超过说明公司违法或制度混乱，入职前必须问清。<\/li>\n<\/ol>\n<h3 id=\"23\"><a id=\"23-安全规范与现场制度\" aria-hidden=\"true\"><\/a>2.3 安全规范与现场制度<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">制度<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">个人要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>点呼<\/strong><\/td>\n<td>出车前后由运行管理者进行指示＋确认<\/td>\n<td>酒气检查（アルコールチェック）必须配合；拒检＝重大违规<\/td>\n<\/tr>\n<tr>\n<td><strong>运行指示書<\/strong><\/td>\n<td>记载行车路线、时刻、载货<\/td>\n<td>必须携带并按其运行<\/td>\n<\/tr>\n<tr>\n<td><strong>驾驶时间记录（運行記録）<\/strong><\/td>\n<td>每日记录驾驶开始 / 结束、行驶距离<\/td>\n<td>数字化（デジタル走行記録計）公司为主<\/td>\n<\/tr>\n<tr>\n<td><strong>连续驾驶休息<\/strong><\/td>\n<td>4.5h 连续驾驶后至少 30min 休息<\/td>\n<td>长途干线关键规则<\/td>\n<\/tr>\n<tr>\n<td><strong>定期训练<\/strong><\/td>\n<td>每年法定 5 项训练（安全 / 省燃费等）<\/td>\n<td>出席率记入个人档案<\/td>\n<\/tr>\n<tr>\n<td><strong>日常点检<\/strong><\/td>\n<td>出车前 60+ 项检查<\/td>\n<td>发现异常必须报告，禁止「带病出车」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>事故与异常处理流程<\/strong>：事故发生→确保安全、救护优先→报警（110）→联系公司运行管理者→<strong>不可自行与对方「私了」<\/strong>；车辆异常→立即靠边→报告→等指示；货物异常（破损 / 短缺 / 温度异常）→拍照、保留传票、当日报告（冷链温度异常是高责任场景）；交通违规→点数制（6 点内停驾照 courses），特定技能者重大违规直接影响在留更新。<\/li>\n<li><strong>饮酒与药物（红线）<\/strong>：酒测出车前后各一次，<strong>检出即点呼不通过→当日停驾<\/strong>；前夜饮酒次日晨检出（残留酒精）也是事故实绩高发点——当天的酒当天止；特定技能者因酒精 / 药物事故＝几乎必然失去在留资格。<\/li>\n<li><strong>恶劣天气与季节性风险<\/strong>：冬季积雪（北陆 / 东北 / 北海道）——冬用轮胎、链子携带义务地区；台风（7–10 月）——停运判断权在公司，个人不硬闯；夏季高温——冷链货物风险、车厢内热中症。<\/li>\n<li><strong>入职初期 90 天安全路线图<\/strong>：W1–2 点呼 / 点检 / 传票流程背熟、跟乘先辈路线；W3–6 独立短路线、每日复盘（急刹 / 急转 / 礼让记录）；W7–12 全路线独立、学习异常处理与客户对应。安全实绩（无事故无违规月数）是阶段 3 管理岗评估与 2 号移行审查的正面材料。<\/li>\n<li><strong>局限说明<\/strong>：本维度无统计数字，属合规要点（事实），故在第 8 节一并声明其证据边界。<\/li>\n<\/ul>\n<h3 id=\"24\"><a id=\"24-行业大势交叉引用\" aria-hidden=\"true\"><\/a>2.4 行业大势交叉引用<\/h3>\n<ul>\n<li>2024 年問題的后续、运賃适正化与物流倒产 → <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>。<\/li>\n<li>L4 自动驾驶技术路线、法规与实装细节 → <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>。<\/li>\n<li>法规条文与政策解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<h3 id=\"31\"><a id=\"31-薪资水平多口径并列不合并\" aria-hidden=\"true\"><\/a>3.1 薪资水平（多口径并列，不合并）<\/h3>\n<ul>\n<li><strong>卡车司机平均年收<\/strong>：<strong>约 430 万日元<\/strong>（月收约 27 万＋年间赏与约 106 万，<strong>含赏与年收口径<\/strong>；手册 02，2026 年市场数据，<strong>原始来源待核验<\/strong>）——与官方「月均现金给与 341,158 円（不含赏与）」<strong>不可直接对比<\/strong>。[Source: https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/2609p.html, 2026]<\/li>\n<li><strong>官方月均统计值<\/strong>：運輸業・郵便業 现金给与总额 <strong>341,158 円（+4.9%）<\/strong>（厚労省毎月勤労統計 2026-09，2026-11-06 公布；不含赏与）——官方活值以 <a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/01-ssw-driver/data/ssw_driver_indicator_registry.md\">01-ssw-driver 登记册 #5<\/a> 为准。<\/li>\n<li><strong>全ト协賃金実態<\/strong>：<strong>2025 年度版<\/strong>（+5.3% 全职务；jta.or.jp，2026-07-01 公表）——男性大型司机月薪 39.5 万円（+4%）、含奖金 41.64 万円（+7.1%）（经行业媒体转引，原件待复核）。[Source: https://jta.or.jp/member/chosa/chinginjittai2025.html, 2026]<\/li>\n<li><strong>求人市场示例<\/strong>（手册 02，2026，<strong>原始来源待核验<\/strong>）：大型干线 月给 <strong>35–43 万<\/strong>；一般配送 <strong>25–33 万<\/strong>；冷链 / 危险品附加 <strong>2–5 万<\/strong>。<\/li>\n<li><strong>特定技能 1 号硬性要求<\/strong>：<strong>工资与日本人同等以上<\/strong>——面试时拿同岗位日本员工待遇基准对照。<\/li>\n<\/ul>\n<h3 id=\"32-offer\"><a id=\"32-工资构成拆解看-offer-必看项\" aria-hidden=\"true\"><\/a>3.2 工资构成拆解（看 offer 必看项）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">说明<\/th>\n<th style=\"width:34%\">警惕点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基本给<\/td>\n<td>固定部分<\/td>\n<td>占比过低＝靠加班凑收入<\/td>\n<\/tr>\n<tr>\n<td>乗務手当 / 出勤手当<\/td>\n<td>按乘务日数 / 出勤次数<\/td>\n<td>请假即减收<\/td>\n<\/tr>\n<tr>\n<td>时间外手当<\/td>\n<td>加班费（1.25 倍起）<\/td>\n<td>是否按法定计算、有无「固定残業代」<\/td>\n<\/tr>\n<tr>\n<td>早朝 / 深夜手当<\/td>\n<td>22–29 时 1.25 倍以上<\/td>\n<td>夜间干线的主要收入来源<\/td>\n<\/tr>\n<tr>\n<td>积込 / 积下ろし手当<\/td>\n<td>装卸费<\/td>\n<td>有无——影响实际劳动强度<\/td>\n<\/tr>\n<tr>\n<td>赏与<\/td>\n<td>年 1–4 个月不等<\/td>\n<td>特定技能初期公司是否同等待遇<\/td>\n<\/tr>\n<tr>\n<td>各类保险<\/td>\n<td>雇保 / 健保 / 厚生年金<\/td>\n<td>必须加入（永住证据链）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>年收换算公式<\/strong>：（基本给＋诸手当）×12＋赏与−欠勤减额。<\/p>\n<h3 id=\"33\"><a id=\"33-入职前必问清单与红牌信号\" aria-hidden=\"true\"><\/a>3.3 入职前必问清单与红牌信号<\/h3>\n<p><strong>必问清单（面试验证用）<\/strong>：<\/p>\n<ul>\n<li>[ ] 平均月加班时间？最近 3 个月实绩？<\/li>\n<li>[ ] 36 协定特别条项是否签订？年加班上限多少？<\/li>\n<li>[ ] 固定残业代制还是全额实算制？<\/li>\n<li>[ ] 休日：每月休息天数？运输行业常见的「シフト休」如何安排？<\/li>\n<li>[ ] 赏与・昇给实绩（前 3 年）？<\/li>\n<li>[ ] 特定技能员工现有几名？支援体制（自家 / 登录支援机关）？<\/li>\n<li>[ ] 社保（健保＋厚生年金）加入？——从第一天起影响永住证据链<\/li>\n<\/ul>\n<p><strong>红牌信号（出现即谨慎）<\/strong>：<\/p>\n<ul>\n<li>月给数字漂亮但「乗務手当」占比 &gt;50% 且无加班实算<\/li>\n<li>「残業は自己申告制」（＝不给加班费的话术）<\/li>\n<li>无厚生年金（只有国民年金）→ 违法＋毁永住积累<\/li>\n<li>高离职率（面试可问「先辈特定技能员工现在几人在职」）<\/li>\n<\/ul>\n<h3 id=\"34-01-ssw-driver\"><a id=\"34-求人样本只读引用-01-ssw-driver\" aria-hidden=\"true\"><\/a>3.4 求人样本（只读引用 01-ssw-driver）<\/h3>\n<ul>\n<li>登记册 #3 记 <strong>9 样本<\/strong>全部完成四元组立档（岗位 × 地域 × 月収 × URL）与官网回溯；样本分层为东京圈 / 大阪圈 / 地方＋特定技能专项，月给区间汇总为东京圈 22–45 万円、大阪圈 28–40.5 万円、地方 25–36 万円（聚合平台转载口径）。逐条样本、核实状态与来源分级见 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 第 3.3 节<\/a>。<\/li>\n<li><strong>口径提示<\/strong>：平台样本「月収」含 / 不含手当口径须逐条注明，不得与实收直接对比；本主题不独立改值。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<blockquote>\n<p>本主题的研究对象为货运司机职业，雇主维度从「求职者可筛选的雇主类型」切入；官方统计活值与行业结构只读引用 01-ssw-driver / 04-industry-logistics。<\/p>\n<\/blockquote>\n<h3 id=\"41\"><a id=\"41-雇主类型谱系货运司机视角\" aria-hidden=\"true\"><\/a>4.1 雇主类型谱系（货运司机视角）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">类型<\/th>\n<th style=\"width:25%\">特征<\/th>\n<th style=\"width:25%\">对求职者的含义<\/th>\n<th style=\"width:25%\">来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>大型综合物流（佐川急便 / SGHD、雅玛多、日通、福山通运）<\/td>\n<td>全国网络、特定技能接收先行（佐川 2025 年接收越南司机，业界首批案例之一）<\/td>\n<td>待遇公告高于行业均值；认定与支援体制较完整<\/td>\n<td><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读引用）<\/td>\n<\/tr>\n<tr>\n<td>地方中坚运输企业<\/td>\n<td>地方缺人明显、竞争小、生活成本低<\/td>\n<td>直接应聘地方企业官网；干线 / 大型岗位地方反而高（月 35 万+常见）<\/td>\n<td>手册 05 地域策略<\/td>\n<\/tr>\n<tr>\n<td>仓储内配送 / 冷链 / 特殊车辆专业业者<\/td>\n<td>附加手当、时限严、温控管理责任重<\/td>\n<td>冷链 / 危险品附加 2–5 万；需追加资格<\/td>\n<td>手册 01 / 02<\/td>\n<\/tr>\n<tr>\n<td>特定技能专门中介 / 登录支援机关绑定企业<\/td>\n<td>与接受企业绑定、包支援义务<\/td>\n<td>风险最低主渠道（★★★）<\/td>\n<td>手册 05 渠道矩阵<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"42\"><a id=\"42-受入资格筛查雇主侧硬条件\" aria-hidden=\"true\"><\/a>4.2 受入资格筛查（雇主侧硬条件）<\/h3>\n<ul>\n<li><strong>只投能做「特定技能受入计划书认定」的企业<\/strong>：未认定企业无法雇特定技能者——让对方出示认定证明或说明申请进度。<\/li>\n<li><strong>支援体制<\/strong>：自家实施还是登录支援机关（费用由企业负担——法定）；登记支援机关名单与费用行情见 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 第 6.3 节<\/a>。<\/li>\n<li><strong>社保加入<\/strong>：健保 / 厚生年金 / 雇保从第一天起影响永住证据链。<\/li>\n<\/ul>\n<h3 id=\"43\"><a id=\"43-待遇公告参考只读引用\" aria-hidden=\"true\"><\/a>4.3 待遇公告参考（只读引用）<\/h3>\n<ul>\n<li>佐川急便招聘面月收例 32 万円、年收 480 万起；雅玛多 SD 司机「年收 600 万円以上可」（例：30 岁·入社 5 年·月收 40 万円）。来源见 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 第 3.3 节<\/a>（B / C 级，须回溯原企业页）。<\/li>\n<\/ul>\n<h3 id=\"44\"><a id=\"44-未核实项\" aria-hidden=\"true\"><\/a>4.4 未核实项<\/h3>\n<ul>\n<li>各企业「特定技能受入计划书认定」状态未在本版逐家核实 → 见 8.4 待复核清单。<\/li>\n<li>大型综合物流的财报与运价改定细节归 01-ssw-driver 主责，本主题不独立改值。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<h3 id=\"51\"><a id=\"51-岗位类型谱系\" aria-hidden=\"true\"><\/a>5.1 岗位类型谱系<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">类型<\/th>\n<th style=\"width:25%\">车辆<\/th>\n<th style=\"width:25%\">特点<\/th>\n<th style=\"width:25%\">新人难度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>路线配送（ルート配送）<\/td>\n<td>轻型～普通（2t 前后）<\/td>\n<td>固定客户、每日同路线，家庭配达 / 法人配达<\/td>\n<td>★ 最适合入场<\/td>\n<\/tr>\n<tr>\n<td>仓库内配送 / 场内运输<\/td>\n<td>托盘车、2t<\/td>\n<td>仓库与厂区间短驳，节奏稳定<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td>一般区域配送<\/td>\n<td>普通～中型（2–4t）<\/td>\n<td>多点配送、要搬运装卸<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>冷链配送（冷蔵 / 冷凍）<\/td>\n<td>冷藏冷冻车<\/td>\n<td>生鲜 / 医药，时限严、温控管理责任重<\/td>\n<td>★★ 薪资略高<\/td>\n<\/tr>\n<tr>\n<td>中型·大型干线<\/td>\n<td>中型（4–11t）/ 大型（11t+）<\/td>\n<td>长距离、夜间多、体力要求高<\/td>\n<td>★★★ 薪资最高<\/td>\n<\/tr>\n<tr>\n<td>特殊车辆<\/td>\n<td>牵引（トレーラー）、罐车、危险品<\/td>\n<td>需追加资格（けん引 / 危険物乙4 等）<\/td>\n<td>★★★★<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>入场策略（建议）<\/strong>：从特定技能 1 号（卡车）入境 → 先做路线配送 / 仓库关联岗位 → 1–2 年内视条件向中型 / 冷链 / 干线升级。<\/p>\n<h3 id=\"52-2024\"><a id=\"52-车种与驾照对应2024-年新制度后\" aria-hidden=\"true\"><\/a>5.2 车种与驾照对应（2024 年新制度后）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">车牌种类<\/th>\n<th style=\"width:33%\">对应车辆<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>普通免许<\/td>\n<td>总重 3.5t 未满（货物 2t 未满）<\/td>\n<td>2024-05 起新设<strong>準中型<\/strong>，普通范围收窄<\/td>\n<\/tr>\n<tr>\n<td>準中型免许<\/td>\n<td>总重 3.5–7.5t<\/td>\n<td>新制度下进入中型世界的第一张牌<\/td>\n<\/tr>\n<tr>\n<td>中型免许<\/td>\n<td>总重 7.5–11t<\/td>\n<td>需 21 岁＋驾龄 2 年（取得时点）<\/td>\n<\/tr>\n<tr>\n<td>大型免许<\/td>\n<td>11t 以上<\/td>\n<td>需 21 岁＋驾龄 3 年（取得时点）<\/td>\n<\/tr>\n<tr>\n<td>第二种免许<\/td>\n<td>载客（出租车 / 巴士）<\/td>\n<td>特定技能出租车 / 巴士路径才需要<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"53\"><a id=\"53-一天的工作流典型路线配送\" aria-hidden=\"true\"><\/a>5.3 一天的工作流（典型路线配送）<\/h3>\n<pre><code class=\"language-text\">出勤 → 点呼（酒测/健康确认/运行指示） → 日常点検 → 出库\n→ 配送循环（積込→搬入→伝票受领） ×N → 归库 → 后处理（伝票整理/清扫/充电加油）\n→ 退勤（点呼确认）\n<\/code><\/pre>\n<ul>\n<li><strong>点呼（てんこ）<\/strong>：每次出车前后的法定程序（酒测、健康、指示传达）——运行业务的中枢制度。<\/li>\n<li><strong>日常点検<\/strong>：出车前检查项目 60+ 项，记录入点检表。<\/li>\n<\/ul>\n<h3 id=\"54\"><a id=\"54-分野内的职业深化方向\" aria-hidden=\"true\"><\/a>5.4 分野内的职业深化方向<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">方向<\/th>\n<th style=\"width:50%\">关键能力<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>冷链专家<\/td>\n<td>温度管理记录、医药 / 生鲜 GSP 意识<\/td>\n<\/tr>\n<tr>\n<td>干线 / 大型<\/td>\n<td>长距离耐力、车检 / 油耗管理<\/td>\n<\/tr>\n<tr>\n<td>调度（配車）<\/td>\n<td>排班、路线优化、客户调整<\/td>\n<\/tr>\n<tr>\n<td>运行管理员<\/td>\n<td>法定资格：运行管理者资任者讲习＋1 年实务（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<h3 id=\"61\"><a id=\"61-驾照体系与取得费用\" aria-hidden=\"true\"><\/a>6.1 驾照体系与取得费用<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">要点<\/th>\n<th style=\"width:34%\">费用 / 合格率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>外免切替（持中国驾照）<\/td>\n<td>中国不在 29 国免除对象；知识确认 50 题正确率 90%＋技能确认（2025-10 严格化：新增横断步道课题、审查基准 70%）<\/td>\n<td>知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025 年 10–12 月，警察庁，经 drivey.jp 转引）<\/td>\n<\/tr>\n<tr>\n<td>普通（AT 限定）<\/td>\n<td>官方月次均价<\/td>\n<td><strong>324,381 円<\/strong>（総務省「小売物価統計調査」2026-09 全国平均，最新月）<\/td>\n<\/tr>\n<tr>\n<td>在日新考取（普通 MT）<\/td>\n<td>18 岁～<\/td>\n<td>MT 通学 <strong>30–40 万円<\/strong>（くらシム 2026-10-18）<\/td>\n<\/tr>\n<tr>\n<td>大型<\/td>\n<td>21 岁＋满 3 年（持中型起）<\/td>\n<td><strong>25–28 万円<\/strong>（TRUCK-BANK 2026-06）<\/td>\n<\/tr>\n<tr>\n<td>中型<\/td>\n<td>20 岁＋持其他驾照满 2 年<\/td>\n<td>全国均价待核实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>口径说明<\/strong>：総務省口径为 AT 限定月次均价，くらシム / TRUCK-BANK 为 MT / 大型区间行情，口径不同，仅作区间级交叉验证，不作精确对位。[Source: https://www.e-stat.go.jp/stat-search/database?layout=dataset&amp;statdisp_id=0003449368, 2026; https://kurasim.com/blog/driving-school-cost-guide, 2026; https://www.truck-bank.net/knowledge/06-license-regulations/license-acquisition-cost/, 2026]<\/li>\n<li>⚠️ <strong>驾照路径是落地关键瓶颈<\/strong>：特定活动入境后未取得日本驾照则不能转特定技能 1 号。<\/li>\n<\/ul>\n<h3 id=\"62\"><a id=\"62-追加资格\" aria-hidden=\"true\"><\/a>6.2 追加资格<\/h3>\n<ul>\n<li><strong>フォークリフト<\/strong>（フォークリフト運転技能講習）：托盘作业；<strong>玉掛け<\/strong>（玉掛け技能講習）：吊装挂钩；<strong>危険物乙種第4類<\/strong>（乙4）：危险品；<strong>けん引免許<\/strong>：牵引车。<\/li>\n<li><strong>运行管理者资格<\/strong>（運行管理者試験 / 運行管理者講習）＋1 年实务：管理岗法定资格（→ <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a>）；<strong>安全運転管理者講習<\/strong>；<strong>衛生管理者<\/strong>；<strong>物流管理士 / ロジスティクス管理士<\/strong>。<\/li>\n<li><strong>応急救護処置<\/strong>、<strong>車両点検技能<\/strong>（日々点検整備）。<\/li>\n<\/ul>\n<h3 id=\"63-1-01-ssw-driver\"><a id=\"63-特定技能-1-号资格要件只读引用-01-ssw-driver\" aria-hidden=\"true\"><\/a>6.3 特定技能 1 号资格要件（只读引用 01-ssw-driver）<\/h3>\n<ul>\n<li>技能要件：分野評価試験合格＋第一種運転免許；日语要件：A2.2 相当以上（JFT-Basic A2.2 或 JLPT N4；2026-12 JLPT 全等级满员，官方引导转 JFT-Basic）。详见 <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 第 2.2 / 5 节<\/a> 与 <a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\">ISA 自動車運送業分野<\/a>。<\/li>\n<li><strong>本主题不含载客（出租车 / 巴士）路径<\/strong>：第二种免许与 B1 日语要件属 01-ssw-driver 监测范围。<\/li>\n<\/ul>\n<h3 id=\"64\"><a id=\"64-证书路线图分阶段建议\" aria-hidden=\"true\"><\/a>6.4 证书路线图（分阶段，建议）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">入职后<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–6 月<\/td>\n<td>独立执行固定路线＋安全实绩零瑕疵<\/td>\n<\/tr>\n<tr>\n<td>6–12 月<\/td>\n<td>多路线 / 多客户适配；开始帮带新人和实习司机<\/td>\n<\/tr>\n<tr>\n<td>12–24 月<\/td>\n<td>申请追加资格（フォークリフト / 危険物乙4 / けん引视需要）；JLPT N3<\/td>\n<\/tr>\n<tr>\n<td>24 月+<\/td>\n<td>争取进入配车 / 教育辅助角色；JLPT N2 启动 → 转入 <a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本章为建议与推断层，与前三节事实数据分离；不承诺就业结果、不保证薪资水平、不给「必过」式断言。<\/p>\n<\/blockquote>\n<h3 id=\"71\"><a id=\"71-求职渠道矩阵\" aria-hidden=\"true\"><\/a>7.1 求职渠道矩阵<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">渠道<\/th>\n<th style=\"width:33%\">特点<\/th>\n<th style=\"width:34%\">优先级<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>特定技能专门中介 / 登录支援机关<\/strong><\/td>\n<td>与接受企业绑定，包支援义务，风险最低<\/td>\n<td>★★★ 主渠道<\/td>\n<\/tr>\n<tr>\n<td>Hello Work（ハローワーク）<\/td>\n<td>公共职介，契约·待遇透明，部分招外国人<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>Indeed Japan / 求人ボックス<\/td>\n<td>汇总检索，筛「特定技能 可」关键词<\/td>\n<td>★★ 情报源<\/td>\n<\/tr>\n<tr>\n<td>トラバイト等运输专门转职站<\/td>\n<td>司机岗位全、薪资行情直观<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>行业团体（全日ト協各県支部等）介绍<\/td>\n<td>信度高，小企业多<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td>直接应聘地方中坚运输企业官网<\/td>\n<td>竞争小，地方生活成本低<\/td>\n<td>★<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>筛选原则<\/strong>：只投能做「特定技能受入计划书认定」的企业。<\/p>\n<h3 id=\"72\"><a id=\"72-地域选择策略影响收入与生活\" aria-hidden=\"true\"><\/a>7.2 地域选择策略（影响收入与生活）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">因素<\/th>\n<th style=\"width:50%\">建议方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>运输需求<\/td>\n<td>大都市圈岗位多但竞争 / 物价高；地方（北关东、东海、九州）缺人更明显<\/td>\n<\/tr>\n<tr>\n<td>薪资<\/td>\n<td>干线 / 大型岗位：地方反而高（月 35 万+常见）<\/td>\n<\/tr>\n<tr>\n<td>生活支持<\/td>\n<td>选有特定技能前辈 / 多文化对应的企业聚集地（爱知、埼玉、群马、福冈等）<\/td>\n<\/tr>\n<tr>\n<td>冬季<\/td>\n<td>避免初入行就选豪雪地带（驾驶风险）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"73\"><a id=\"73-简历与面试\" aria-hidden=\"true\"><\/a>7.3 简历与面试<\/h3>\n<ul>\n<li><strong>履歴書<\/strong>：JIS 规格手写或打印均可，照片正装，全角日期，学历职历从新往旧不空白（空白期写「日本語学習」等）。<\/li>\n<li><strong>职务经历书<\/strong>：突出<strong>驾驶经历（车种 / 里程 / 事故率）、装卸 / 仓库经验、资格（驾照 / 试验合格）<\/strong>；中文驾照驾龄换算为「運転歴○年」并注明车种；附上 ClassNK 合格证明、JLPT / JFT 成绩（复印件）。<\/li>\n<li><strong>面试高频问题与回答方向<\/strong>：<\/li>\n<\/ul>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">问题<\/th>\n<th style=\"width:50%\">回答方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>なぜ日本で？なぜ運送業？<\/td>\n<td>物流职业规划（司机→管理→技术）＋已考取的试验合格＝行动证明<\/td>\n<\/tr>\n<tr>\n<td>運転歴・車種？<\/td>\n<td>实话＋车种对应表（→ 5.2）<\/td>\n<\/tr>\n<tr>\n<td>夜勤・長距離できる？<\/td>\n<td>诚实回答体能边界，给出意向区间<\/td>\n<\/tr>\n<tr>\n<td>日本語は？<\/td>\n<td>当场演示：点呼应答 / 传票确认 / 事故报告三段话术<\/td>\n<\/tr>\n<tr>\n<td>給与の希望？<\/td>\n<td>参考市场数据报价区间，问清构成（→ 3.2）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>面试日语速成包<\/strong>：自己紹介（中国から参りました…特定技能の試験に合格しています…将来は運行管理も…）、点呼应答（はい、体調に問題ありません。異常ありません。）、確認表現（〜という理解でよろしいでしょうか。）、辞退表現（検討して、明日までにお返事いたします。）。<\/li>\n<\/ul>\n<h3 id=\"74\"><a id=\"74-契约审查清单签约前逐项核对\" aria-hidden=\"true\"><\/a>7.4 契约审查清单（签约前逐项核对）<\/h3>\n<ul>\n<li>[ ] 雇佣契约书：职务 / 场所 / 工资构成 / 时间外 / 休日与面试口径一致<\/li>\n<li>[ ] 特定技能 1 号受入计划书认定编号<\/li>\n<li>[ ] 支援体制：自家实施还是登录支援机关（费用由企业负担——法定）<\/li>\n<li>[ ] 社保加入说明（健保 / 厚生年金 / 雇保）<\/li>\n<li>[ ] 住宅：公司寮的条件与租金扣款额<\/li>\n<li>[ ] 退职金 / 赏与规则书面化<\/li>\n<\/ul>\n<h3 id=\"75\"><a id=\"75-工作条件记录与永住证据链建议--推断\" aria-hidden=\"true\"><\/a>7.5 工作条件记录与永住证据链（建议 / 推断）<\/h3>\n<ul>\n<li><strong>记录模板<\/strong>（手册 06）：公司概况（公司名称 / 所在地、车种与路线类型、特定技能员工数、支援体制、受入计划书认定编号）；月度记录表（实收工资、构成、加班 h、出勤日、夜班数、备注）；半年对比表（月均收入、月均加班、与契约差异、与同行 offer 数据对比、行动判断）；工作环境定性记录（每半年 1 次）；凭证归档索引。<\/li>\n<li><strong>行动判断基准<\/strong>：连续 2 半年加班 &gt; 月 80h → 公司违反月 100h 未满红线风险，准备退路；实收低于契约 → 当月质询＋留证（劳动基准监督署は最終手段）；收入 / 成长停滞 2 年 → 启动转职评估。<\/li>\n<li><strong>凭证归档（与永住证据链共用）<\/strong>：每月给与明细（PDF 保存）；每年源泉征收票、雇用保险年金的「ねんきん定期便」、年度安全表彰；随时表彰状、感谢状、研修修了证扫描件。提醒：给与明细不要只用公司系统查看就删——永住审查要看多年流水（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）。<\/li>\n<li>登记册 #5「个人工作条件记录最新周期」目前为<strong>待记录<\/strong>——首条数据建立后按「增量留痕」原则回写登记册。<\/li>\n<\/ul>\n<h3 id=\"76\"><a id=\"76-建议与推断分离声明\" aria-hidden=\"true\"><\/a>7.6 建议与推断分离声明<\/h3>\n<p>本章所有路径、渠道、话术与判断基准均为<strong>建议<\/strong>；其中涉及市场走向、雇主行为、收入比较的表述为<strong>推断<\/strong>，与前三节的事实数据分离。事实数据以第 1 节登记册活值与官方来源为准。<\/p>\n<hr />\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：厚生劳动省 <a href=\"https://driver-roudou-jikan.mhlw.go.jp/truck/notice\">driver-roudou-jikan<\/a>（时间外上限，2026）；厚生劳动省（労働基准法 / 工资·工时统计）；国土交通省（自动车运送业 / 运行管理者）；総務省 e-Stat 自動車教習料（0003449368）。<\/li>\n<li><strong>B 级（权威机构 / 行情）<\/strong>：全日本トラック協会 <a href=\"https://jta.or.jp/member/chosa/chinginjittai2025.html\">賃金・労働時間等の実態 2025 年度版<\/a>；运行管理者试验中心（<a href=\"https://www.unkan.or.jp/about.html\">unkan.or.jp<\/a>）；<a href=\"https://www.truck-bank.net/knowledge/06-license-regulations/license-acquisition-cost/\">TRUCK-BANK<\/a> / <a href=\"https://kurasim.com/blog/driving-school-cost-guide\">くらシム<\/a>（驾照费用行情）。<\/li>\n<li><strong>C 级（平台 / 转载）<\/strong>：求人市场示例（手册 02，未标注平台与采集日期，待核验）；求人聚合层转载样本（只读引用 01-ssw-driver）。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车司机平均年收<\/td>\n<td>含赏与年收约 430 万 ≠ 官方月均现金给与 341,158 円（不含赏与）<\/td>\n<\/tr>\n<tr>\n<td>时间外上限<\/td>\n<td>月 45h·年 360h（原则）≠ 年 960h（36 协定特别条项）≠ 月 100h 未满（红线）<\/td>\n<\/tr>\n<tr>\n<td>求人样本月収<\/td>\n<td>平台标注口径（含 / 不含手当）≠ 实收<\/td>\n<\/tr>\n<tr>\n<td>外免切替<\/td>\n<td>普通免许可直接换 ≠ 准中 / 中型需另考<\/td>\n<\/tr>\n<tr>\n<td>驾照费用<\/td>\n<td>総務省 AT 限定月次均价 324,381 円 ≠ くらシム MT 通学 30–40 万円 ≠ TRUCK-BANK 大型 25–28 万円<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"83\"><a id=\"83-未取得项\" aria-hidden=\"true\"><\/a>8.3 未取得项<\/h3>\n<ul>\n<li>登记册 #5 个人工作条件记录（待记录）。<\/li>\n<li>中型驾照全国均价（本主题素材未给出）。<\/li>\n<li>手册 02 的「约 430 万平均年收」与求人市场示例的原始来源与采集日期。<\/li>\n<li>求人样本采集日期与含 / 不含手当口径标注。<\/li>\n<\/ul>\n<h3 id=\"84\"><a id=\"84-待复核清单逐项给出复核入口\" aria-hidden=\"true\"><\/a>8.4 待复核清单（逐项给出复核入口）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>430 万平均年收的原始来源与统计口径<\/td>\n<td>行业报告原件 / 全日本トラック協会（jta.or.jp）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>中型驾照全国均价与取得要件细节<\/td>\n<td>警察庁 / 指定自動車教習所（→ 10-education-qualification）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>求人样本「月収」采集日期与含 / 不含手当口径<\/td>\n<td>平台样本回溯（只读引用 01-ssw-driver 3.3）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>登录支援机关名单与费用行情最新数据<\/td>\n<td>isa.go.jp / 行业机构（→ 01-ssw-driver 6.3）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>外免切替最新流程与费用<\/td>\n<td>警察庁 / 指定教习所（→ 10-education-qualification）<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>各企业「特定技能受入计划书认定」状态逐家核实<\/td>\n<td>ISA 登录支援機関名单 / 企业 IR<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>个人工作条件记录何时开始填写并建立首条数据<\/td>\n<td>本主题 06 文档 / 登记册 #5<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>安全规范与红线的量化支撑（现为合规要点，无统计）<\/td>\n<td>厚労省 / 运输业法规（→ 09-politics-law）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"85\"><a id=\"85-时间基准与来源语言规则执行声明\" aria-hidden=\"true\"><\/a>8.5 时间基准与来源语言规则执行声明<\/h3>\n<ul>\n<li><strong>数据基准日<\/strong>：2026-11-14；登记册活值基准为 baseline（2026-11-12 迁移）。<\/li>\n<li><strong>来源语言规则<\/strong>：统计与制度类取日文官方原文；求人样本标注平台与采集日期。<\/li>\n<li><strong>只读引用声明<\/strong>：官方统计活值（工资 / 缺口 / 求人倍率）以 <a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/01-ssw-driver/data/ssw_driver_indicator_registry.md\">01-ssw-driver 登记册<\/a> 为单一事实源，本主题不独立改值或回写。<\/li>\n<li><strong>局限声明<\/strong>：安全规范与红线维度无量化统计支撑；个人工作条件记录尚处「待记录」状态，无实际数据。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<blockquote>\n<p>按来源分级分组，完整 URL。<\/p>\n<\/blockquote>\n<h3 id=\"1\"><a id=\"①-日本政府官方一手\" aria-hidden=\"true\"><\/a>① 日本政府官方一手<\/h3>\n<ol>\n<li><a href=\"https://driver-roudou-jikan.mhlw.go.jp/truck/notice\">厚生劳动省 driver-roudou-jikan（时间外上限）<\/a> — 2026<\/li>\n<li><a href=\"https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/2609p.html\">厚生劳动省（労働基准法 / 工资・工时统计）<\/a> — 2026<\/li>\n<li><a href=\"https://www.mlit.go.jp/jidosha/\">国土交通省（自动车运送业 / 运行管理者）<\/a> — 2026<\/li>\n<li><a href=\"https://www.e-stat.go.jp/stat-search/database?layout=dataset&amp;statdisp_id=0003449368\">総務省 e-Stat 自動車教習料（0003449368）<\/a> — 2026<\/li>\n<li><a href=\"https://www tics/reports/2026-11-industry-logistics.md\">04-industry-logistics · 2026-11 月度报告<\/a>（行业结构、2024 年問題、自动化产业面）<\/li>\n<li><a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous · 2026-11 月度报告<\/a>（自动驾驶技术路线、法规与实装）<\/li>\n<li><a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance · 2026-11 月度报告<\/a>（收入环境与地域差）<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration · 2026-11 月度报告<\/a>（制度、驾照换领、永住证据链）<\/li>\n<li><a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law · 2026-11 月度报告<\/a>（法规条文与政策解读）<\/li>\n<li><a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">10-education-qualification · 2026-11 月度报告<\/a>（驾照费用与教习所行情）<\/li>\n<li><a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese · 2026-11 月度报告<\/a>（日语学习计划与考试选择）<\/li>\n<li><a href=\"../../13-regional-info/reports/2026-11-regional-info.md\">13-regional-info · 2026-11 月度报告<\/a>（求人四元组定位教训）<\/li>\n<\/ul>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 295, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "02-career-driver/reports/2026-11-career-driver.html"}}}, "career-management": {"name": "职业管理与晋升", "dir": "03-career-management", "months": {"2026-11": {"title": "日本管理岗过渡 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本管理岗过渡--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本管理岗过渡 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向已在日本从事货运司机工作、计划向运行管理 / 配车 / 现场管理岗过渡的读者，兼具职业规划与现场管理视角。\n<strong>来源规则<\/strong>：① 国土交通省（mlit.go.jp 运送事业制度、安全管理）＞ ② 日本ロジスティクスシステム協会、全日本トラック協会（管理者讲习、安全管理责者）＞ ③ 主要物流企业官网 / IR（日通、佐川、雅玛多、SGHD 的职级与采用信息）＞ ④ 求人门户管理岗频道（预期指标）＞ ⑤ 行业媒体（LNEWS、物流ウィークリー，须回溯）；每条数据附可直接访问的 URL，并记录「机构 · 统计周期 · 发布日期 · 核验状态」。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>主题定义<\/strong>：运输 / 仓储公司内管理岗（运行管理者 / 运行管理辅助者 / 配车 / 仓库现场リーダー / 安全管理者 / 保管・仓库管理 / 事务所营业）的岗位地图与路径评估、业务知识体系、管理岗日语与沟通、48 个月分年学习计划、成果档案与晋升材料。<\/p>\n<p><strong>监测范围（含）<\/strong>：管理岗地图与路径评估；业务知识体系（仓储运营、运输管理 KPI、安全管理、系统与数据基础）；管理岗日语与沟通（会议 / 报告 / 邮件 / 现场指示、敬语最小集）；管理岗过渡学习计划（48 个月分年计划、周节奏、失败预案）；成果档案与晋升材料（KPI 月度表、STAR 成果卡、晋升面谈材料包）。<\/p>\n<p><strong>监测范围（不含）<\/strong>：制度规则与在留资格细节（→ 08-visa-immigration）；行业结构与 2024 年問題（→ 04-industry-logistics）；自动驾驶技术路线（→ 05-industry-autonomous）；技术数字化技能（→ 06-industry-technology）；法规条文解读（→ 09-politics-law）；收入环境与地域差（→ 07-economy-finance）；日语学习计划（→ 11-language-japanese）；资格与教育投资（→ 10-education-qualification）；现场层执行细节（→ 02-career-driver）；官方统计活值（→ 01-ssw-driver 主责，本主题只读引用）。<\/p>\n<p><strong>核心监测问题<\/strong>：<\/p>\n<ol>\n<li>目标企业的管理岗采用条件与职级结构如何？<\/li>\n<li>运行管理者试验与讲习的日程、费用与合格路径是什么？<\/li>\n<li>管理岗求人薪资口径（含 / 不含手当）处于什么水平？<\/li>\n<li>从司机到管理岗的过渡路径与决策时点如何安排？<\/li>\n<li>个人晋升档案（KPI / STAR 卡）如何支撑晋升与 2 号移行？<\/li>\n<\/ol>\n<p><strong>初步结论<\/strong>：<\/p>\n<ol>\n<li><strong>管理岗过渡的主线是内部升格（路径 A）<\/strong>（建议 / 推断）：公司已认识你、资格与实绩连续、雇主支持 2 号移行；路径 B 转职过渡存在 2 号移行中断风险，须在转职前确认新公司做受入计划书变更。<\/li>\n<li><strong>本主题尚处知识整理期<\/strong>（事实）：登记册 4 项指标中 #1 #2 #3 为「待基线确立」、#4 为「待记录」；首期样本待基线运行后补记。<\/li>\n<li><strong>资格≠岗位，在留资格联动是主要制度约束<\/strong>（事实＋推断）：运行管理者试验合格只给入场券，公司是否选任取决于信任与空缺；管理岗跳转可能需在留资格变更（如技术·人文·国际业务，需学历或 10 年实务）。<\/li>\n<li><strong>48 个月计划与周节奏以「最低维持量」保连续性<\/strong>（建议）：工作日总投入 ≤1h/天，避免司机疲劳期两头塌。<\/li>\n<li><strong>成果档案是晋升与 2 号移行 / 永住审查的共用材料<\/strong>（建议 / 推断）：KPI 月度表、STAR 卡与晋升面谈材料包同时服务内部晋升、转职简历与在留审查。<\/li>\n<\/ol>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<p>登记册 4 项追踪指标截至 2026-11-14 的活值状态（来源：<code>data/career_logistics_indicator_registry.md<\/code>）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">追踪项<\/th>\n<th style=\"width:25%\">登记册活值<\/th>\n<th style=\"width:25%\">本期变动<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>目标企业管理岗采用条件<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>管理者讲习 / 安全管理责者讲习日程<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>管理岗求人薪资口径<\/td>\n<td>待基线确立<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>个人晋升档案最新条目<\/td>\n<td>待记录<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：唯一观察项、首要触发器、触发器结论均为「首期为空」，无触发器命中；按 business-config 第七节「无触发器命中且窗口未到时<strong>不启动<\/strong>」，本期无变化可报。<\/p>\n<p><strong>结构变更备注<\/strong>（非数据变动）：2026-11-14 原合并版知识手册已按五大维度拆分至 <code>handbook/<\/code>（00–05 共 6 个文档），编号 01–05 与登记册指标、触发器映射保持一一对应；原合并版全文存档于 <code>reports/archives/2026-11-career-management-merged-v1.0.md<\/code>。本报告为该结构下的首期九节骨架版。<\/p>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版为复用生成：继承历史报告（v1.0 首份分析，数据基准 2026-11-13）的口径裁决、来源分级与结论，<strong>无新增修正<\/strong>。历史报告未列独立「已修正事实清单」，其口径要点（讲习修了 ≠ 试验合格 ≠ 选任；资格≠岗位；STAR 卡示例数字为示例非事实）原样保留于第八、七节。<\/p>\n<h2 id=\"s2\"><a id=\"二行业与政策发展趋势\" aria-hidden=\"true\"><\/a>二、行业与政策发展趋势<\/h2>\n<p>本节只写管理岗监测面可核验的制度与环境信号；行业结构、自动化产业面、法规条文分别归 04-industry-logistics、05-industry-autonomous、09-politics-law，本主题不重复展开。<\/p>\n<p><strong>法定需求侧信号（事实）<\/strong>：运行管理者按「每 15 台车 1 名、公司必置」设置，是最现实的第一个管理台阶；运行管理辅助者无法定资格，基础讲习修了即可（运行管理者试验中心，2026，A 级；<a href=\"https://www.unkan.or.jp/about.html\">运行管理者试验中心<\/a>）。<\/p>\n<p><strong>资格制度三阶段（事实）<\/strong>：运行管理实务 1 年以上<strong>或<\/strong>基础讲习修了 → 通过运行管理者试验 → 公司选任；<strong>讲习修了 ≠ 试验合格 ≠ 选任<\/strong>，三者不可互称（business-config 第四节）。安全管理者需实务经验年数 + 選任時研修（中型以上车辆企业另设安全管理相关职务）。<\/p>\n<p><strong>2024 年問題的政策传导（触发器观察方向）<\/strong>：运賃适正化、M&amp;A 等对策可能改变管理岗职责与配车 / 运行管理的工作方式，属 business-config 第七节的触发器（命中 → 01 / 02 章）；截至 2026-11-14 无触发器命中、无可报变化，不虚构变化。<\/p>\n<p><strong>交叉引用<\/strong>：行业结构、2024 年問題产业面 → <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">../04-industry-logistics/reports/2026-11-industry-logistics.md<\/a>；法规条文与政策解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">../09-politics-law/reports/2026-11-politics-law.md<\/a>；自动驾驶技术路线 → <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">../05-industry-autonomous/reports/2026-11-industry-autonomous.md<\/a>；技术数字化技能 → <a href=\"../../06-industry-technology/reports/2026-11-industry-technology.md\">../06-industry-technology/reports/2026-11-industry-technology.md<\/a>。<\/p>\n<h2 id=\"s3\"><a id=\"三人才供需与薪酬核心模块\" aria-hidden=\"true\"><\/a>三、人才供需与薪酬（核心模块）<\/h2>\n<p><strong>需求侧分层（事实）<\/strong>：管理岗供给分层为「运行管理辅助者 → 运行管理者 → 配车 / 现场リーダー → 主任 / 系长 → 安全管理者」（business-config 第九节研究边界档案）；法定需求信号为运行管理者每 15 台车 1 名必置（见第二节）。<\/p>\n<p><strong>薪酬口径现状<\/strong>：登记册 #3「管理岗求人薪资口径」= <strong>待基线确立<\/strong>，本期无活值；求人门户的预期指标数据尚未采集（历史报告已列为待答问题）。官方统计活值（工资 / 缺口 / 求人倍率）由 01-ssw-driver 主责，本主题只读引用（<a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">../01-ssw-driver/reports/2026-11-ssw-driver.md<\/a>），不独立改值或回写。<\/p>\n<p><strong>口径并列（不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">指标<\/th>\n<th style=\"width:33%\">并列口径<\/th>\n<th style=\"width:34%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>管理岗求人薪资<\/td>\n<td>求人门户标注（含 / 不含手当）≠ 实收<\/td>\n<td>门户为预期指标，须注明口径<\/td>\n<\/tr>\n<tr>\n<td>讲习 / 试验 / 选任<\/td>\n<td>讲习修了 ≠ 试验合格 ≠ 选任<\/td>\n<td>三阶段各自独立<\/td>\n<\/tr>\n<tr>\n<td>管理成果<\/td>\n<td>活动数量（发言 / 議事録 / 带人）≠ 业务结果（准点率 / 误出库率）<\/td>\n<td>过程量与结果量分开记录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s4\"><a id=\"四雇主与企业类型细分\" aria-hidden=\"true\"><\/a>四、雇主与企业类型细分<\/h2>\n<p><strong>主体清单与入选标准（登记册边界档案）<\/strong>：企业样本入选标准 = 官网采用页可回溯、职级与采用条件可核实；样本进出须留痕；<strong>首期样本待基线运行后补记<\/strong>，截至 2026-11-14 无样本留痕。<\/p>\n<p><strong>目标企业范围（来源优先级 ③）<\/strong>：主要物流企业官网 / IR——日通、佐川、雅玛多、SGHD 的职级与采用信息。截至本期，登记册 #1「目标企业管理岗采用条件」仍为<strong>待基线确立<\/strong>，企业样本的具体采用条件、职级结构尚未采集（待复核清单见第八节）。<\/p>\n<p><strong>企业类型观察（本主题边界内）<\/strong>：运输公司按业务形态分为大型干线运输、3PL·仓储、配送类；管理岗设置差异体现在「运行管理者必置」与「运行管理辅助者 / 配车 / 现场リーダー」等无法定资格岗位的配置比例上。行业结构与企业动向的主责为 04-industry-logistics（<a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">../04-industry-logistics/reports/2026-11-industry-logistics.md<\/a>），本节只写管理岗采用条件维度，不重复行业面数字。<\/p>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<p><strong>目标岗位地图<\/strong>（手册 01，信息核对日期 2026-11-11；来源：运行管理者试验中心 [Source: https://www.unkan.or.jp/about.html, 2026]）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">岗位<\/th>\n<th style=\"width:25%\">职责<\/th>\n<th style=\"width:25%\">法定资格<\/th>\n<th style=\"width:25%\">入口难度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>运行管理者（運行管理者）<\/strong><\/td>\n<td>点呼、运行指示、驾驶者管理、运行记录审查——每 15 台车 1 名，公司必置<\/td>\n<td>运行管理实务 1 年以上<strong>或<\/strong>基础讲习修了 → 通过运行管理者试验<\/td>\n<td>★★ 最现实的第一个台阶<\/td>\n<\/tr>\n<tr>\n<td>运行管理辅助者<\/td>\n<td>协助运行管理者<\/td>\n<td>基础讲习修了即可<\/td>\n<td>★ 无门槛，先干起来<\/td>\n<\/tr>\n<tr>\n<td>配车（调度）担当<\/td>\n<td>排班、路线、客户调整<\/td>\n<td>无法定资格，靠业务能力<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>仓库现场リーダー<\/td>\n<td>班组管理、作业效率、人才培养<\/td>\n<td>无法定资格<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td>安全管理者<\/td>\n<td>安全体制构建、事故分析、教育培训<\/td>\n<td>实务经验年数 + 選任時研修（中型以上车辆企业另设安全管理相关职务）<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td>保管/仓库管理（WMS 操作）<\/td>\n<td>库存管理、入出库流程、系统操作<\/td>\n<td>无，WMS 系统经验是硬通货<\/td>\n<td>★★★ 对接阶段 4<\/td>\n<\/tr>\n<tr>\n<td>事务所/运输营业<\/td>\n<td>计费、传票、客户对应<\/td>\n<td>无<\/td>\n<td>★★<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>业务知识体系（手册 02）<\/strong>：<\/p>\n<ul>\n<li>仓储运营：入出库流程（受入→検収→入庫→保管→ピッキング→検品→出庫→配送）、FIFO 与在庫回転率、误出库率与件 / 人 / 时、3PL 受託契約与 KPI 契约（SLA）。<\/li>\n<li>运输管理：运行管理法制（点呼、运行指示書、运行记录、驾驶时间规制→ 02-career-driver）、配车逻辑、成本结构（固定费 vs 变动费、原価率）、异常运营。<\/li>\n<li>安全管理（管理者视角）：ヒヤリハット收集与再现性分析、PDCA 对策立案、月次安全委员会、安全统括管理者 / 安全管理者职责分工。<\/li>\n<li>系统与数据基础：Excel VLOOKUP / 透视表、WMS / TMS 概念认知、手工台账起步的数据整理习惯。<\/li>\n<\/ul>\n<p><strong>核心 KPI 口径（各自独立，不得混用）<\/strong>：纳期遵守率（准点率）≠ 装载率 ≠ 空驶率 ≠ 每车日件数；管理活动月度记录为过程口径，活动数量 ≠ 业务结果（business-config 第四节、第十节）。<\/p>\n<p><strong>管理岗日语与沟通（手册 03，前提 N3 达成）<\/strong>：<\/p>\n<ul>\n<li>四大场景武器库：会议（发言开场 / 报告 / 提案 / 質問）、报告（日報・月報固定模板）、邮件（件名 / 定型句 / 期限 / 结尾）、现场指示（对象 / 内容 / 期限 / 确认 + 复述文化 + 指差呼称）。<\/li>\n<li>敬语最小必需集：对上 = 尊敬语、对己 = 谦让语；现场用错的成本低于不敢用的成本——先敢说再修正。<\/li>\n<li>训练节奏：每天日報 3 行；每周会议发言 1 次 + 議事録 1 份；每月月報 1 份 + 邮件改写 2 封；每半年对照四大场景自评并记入成果档案。<\/li>\n<\/ul>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<p><strong>法定资格路径（事实）<\/strong>：运行管理者试验受验资格 = 运行管理实务 1 年以上<strong>或<\/strong>基础讲习修了；试验合格只给入场券，公司是否选任取决于信任与空缺（手册 01，来源：运行管理者试验中心，2026，A 级）。<\/p>\n<p><strong>术语口径（不得混用）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">口径<\/th>\n<th style=\"width:50%\">说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>运行管理者（選任）≠ 运行管理辅助者<\/td>\n<td>前者有法定资格，后者讲习修了即可<\/td>\n<\/tr>\n<tr>\n<td>讲习修了 ≠ 试验合格 ≠ 选任<\/td>\n<td>三阶段，不可互称<\/td>\n<\/tr>\n<tr>\n<td>管理岗（管理職）≠ 现场リーダー（班長）<\/td>\n<td>职责与法定资格不同<\/td>\n<\/tr>\n<tr>\n<td>「技能講習」≠「特別教育」<\/td>\n<td>资格制度术语分别标注<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>费用与日程<\/strong>：基础讲习「数千円，周末 1 日课程为主」（手册 04，<strong>待核验<\/strong>）；运行管理者试验费用与具体日程以试验中心官方公布为准。资格日程与费用的主责为 10-education-qualification（<a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">../10-education-qualification/reports/2026-11-education-qualification.md<\/a>），本主题只读引用、不独立改值；登记册 #2「管理者讲习 / 安全管理责者讲习日程」待基线确立。<\/p>\n<p><strong>证书归档<\/strong>：每张证书扫描归档，进入成果档案（手册 05），作为晋升面谈与 2 号移行 / 永住审查材料的组成部分。<\/p>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本节为建议 / 推断层，与前三节的事实数据分离。<\/p>\n<\/blockquote>\n<p><strong>三条过渡路径（手册 01）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">路径<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">评估<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A 内部升格（推荐主线）<\/td>\n<td>司机 → 运行管理辅助（讲习修了）→ 运行管理者试验合格 → 配车 / 现场リーダー → 主任 / 系长<\/td>\n<td>公司已认识你、资格与实绩连续、雇主支持 2 号移行<\/td>\n<\/tr>\n<tr>\n<td>B 转职过渡<\/td>\n<td>2–3 年司机经验 + N3 → 转职到仓储 / 3PL 公司的现场管理 / 配车岗<\/td>\n<td>仓库系岗位对日语口语要求低于纯管理，KPI 可量化；风险：在留资格变更需新雇主配合、2 号移行中断风险<\/td>\n<\/tr>\n<tr>\n<td>C 学历 / 资格加持（叠加项，非主线）<\/td>\n<td>夜校 / 通信制专门学校（物流・供应链课程）、ロジスティクス検定（L 検）、フォークリフト讲习<\/td>\n<td>只在路径 A/B 需要差异化时启用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>决策时点表（手册 01，建议）<\/strong>：入职即观察（本公司是否有辅助者→运行管理者晋升先例）→ 第 12 个月（启动基础讲习报名）→ 第 24 个月（运行管理者试验受验；N3 达成）→ 第 36 个月（竞聘配车 / リーダー；2 号移行申请同步）→ 第 48–60 个月（主任级 + N2；评估内部转 WMS / 事务方向）。<\/p>\n<p><strong>48 个月分年计划（手册 04，主线）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">年<\/th>\n<th style=\"width:25%\">主题<\/th>\n<th style=\"width:25%\">月投入（业余）<\/th>\n<th style=\"width:25%\">年内里程碑<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 1 年<\/td>\n<td>站稳 + 摸清组织<\/td>\n<td>8h/月<\/td>\n<td>基础讲习修了证 + 运行管理业务观察笔记 1 份<\/td>\n<\/tr>\n<tr>\n<td>第 2 年<\/td>\n<td>资格 + 知识体系<\/td>\n<td>12h/月<\/td>\n<td>N3 合格 + 运行管理者试验受验（力争合格）<\/td>\n<\/tr>\n<tr>\n<td>第 3 年<\/td>\n<td>岗位落地 + 2 号移行<\/td>\n<td>12h/月<\/td>\n<td>2 号移行完成 + 管理辅助岗位在任 + 带人经验<\/td>\n<\/tr>\n<tr>\n<td>第 4 年<\/td>\n<td>主任级 + N2<\/td>\n<td>12h/月<\/td>\n<td>N2 合格 + 晋升面谈材料组装 + 阶段 4 评估启动<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>总目标：运行管理者试验合格 + 公司内管理辅助岗位在任 + JLPT N2 合格 + 特定技能 2 号身份稳定 + 手持 3 年可量化管理辅助成果档案（建议）。<\/p>\n<p><strong>每周节奏模板（手册 04，建议）<\/strong>：周一–五 日语 30min（N2 线）+ 日報 / 邮件练习 15min（45min/天）；周三晚业务知识 1h；周六资格学习 2h；周日 N2 主线 + 当周复盘 2h。原则：<strong>工作日总投入 ≤ 1h/天<\/strong>——司机疲劳期硬撑学习反而两头塌，宁可以「最低维持量」（30min）保住连续性。<\/p>\n<p><strong>失败预案（手册 04，建议）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">情形<\/th>\n<th style=\"width:50%\">预案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>运行管理者试验不合格<\/td>\n<td>半年后再考（可无限重考）；期间继续辅助岗积累<\/td>\n<\/tr>\n<tr>\n<td>公
