>\n<th style=\"width:50%\">形态<\/th>\n<th style=\"width:50%\">对收入 / 成本的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>提供公司寮的运输 / 仓储企业<\/td>\n<td>房租可压到 2–3.5 万 / 月，直接抬升储蓄率（模型中的「月生活 12 万」一档）<\/td>\n<\/tr>\n<tr>\n<td>地方干线 vs 东京圈<\/td>\n<td>名义薪资地方 ≥ 东京圈，叠加房租差后可支配收入差距更大（经验法则）<\/td>\n<\/tr>\n<tr>\n<td>3PL·仓储公司<\/td>\n<td>岗位多在北关东等仓库密集区，成本适中；特定技能聚居区支援资源相对多<\/td>\n<\/tr>\n<tr>\n<td>求人门户渠道<\/td>\n<td>大型干线 35–43 万、一般配送 25–33 万为行情标注，含 / 不含手当口径须注明（来源优先级 ④，预期指标）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>边界<\/strong>：岗位薪资细节、工资构成与工时合规归 02-career-driver（<a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">../02-career-driver/reports/2026-11-career-driver.md<\/a>）；行业结构、2024 年問題、企业动向归 04-industry-logistics（<a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">../04-industry-logistics/reports/2026-11-industry-logistics.md<\/a>）；本节不重复岗位层数字。<\/p>\n<h2 id=\"s5\"><a id=\"五岗位技能要求\" aria-hidden=\"true\"><\/a>五、岗位技能要求<\/h2>\n<p>本节承载「与收入直接相关的岗位能力与合规副收边界」（business-config 3.2 未指定锚，本节为独立成节）。<\/p>\n<p><strong>技能提升收入的三条路径（手册 01）<\/strong>：<\/p>\n<ul>\n<li>深夜 / 早朝班切换：1.25 倍系数。<\/li>\n<li>资格津贴：フォークリフト、危険物乙 4（+5 千–2 万 / 月）。<\/li>\n<li>车种升级：大型 / 冷键 / けん引等对应月给区间上移（收入增长曲线 Y3–5 档）。<\/li>\n<\/ul>\n<p><strong>合规红线（明令禁止，事实）<\/strong>：特定技能 1 号<strong>资格外活动原则不可<\/strong>——只能从事受入计划书记载的业务，违法打工 = 在留风险，禁止尝试副收打工。<\/p>\n<p><strong>能力底座（跨主题引用）<\/strong>：岗位技能细节与实操 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">../02-career-driver/reports/2026-11-career-driver.md<\/a>；管理岗技能地图 → <a href=\"../../03-career-management/reports/2026-11-career-management.md\">../03-career-management/reports/2026-11-career-management.md<\/a>；资格取得路径与费用主责 → <a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">../10-education-qualification/reports/2026-11-education-qualification.md<\/a>。<\/p>\n<h2 id=\"s6\"><a id=\"六行业认可的职业资质与证书\" aria-hidden=\"true\"><\/a>六、行业认可的职业资质与证书<\/h2>\n<p><strong>资格与津贴对应（手册 01，费用为约值、待核验）<\/strong>：フォークリフト（3–10 万，3–5 日）与危険物乙 4（6 千，自学 + 考试）对应 +5 千–2 万 / 月津贴；けん引自动车运転者（15–25 万）对应干线牵引岗位；L 検（6–8 千）为物流知识体系化证明。<\/p>\n<p><strong>分工声明<\/strong>：物流 / 运输相关资格的日程、费用与取得路径主责为 10-education-qualification（<a href=\"../../10-education-qualification/reports/2026-11-education-qualification.md\">../10-education-qualification/reports/2026-11-education-qualification.md<\/a>），本主题只从「收入回报」角度引用，不重复维护资格地图；驾照取得路径与费用归 01-ssw-driver（只读）。<\/p>\n<h2 id=\"s7\"><a id=\"七就业落地路径建议结论章\" aria-hidden=\"true\"><\/a>七、就业落地路径建议（结论章）<\/h2>\n<blockquote>\n<p>本节为建议 / 推断层，与事实数据分离。<\/p>\n<\/blockquote>\n<p><strong>10 年财务里程碑（手册 04）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">时点<\/th>\n<th style=\"width:50%\">目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Y1<\/td>\n<td>应急金 50 万円（3 个月生活费）+ 无负债<\/td>\n<\/tr>\n<tr>\n<td>Y3<\/td>\n<td>应急金 100 万円 + 技能投资预算独立（资格 / 驾校）<\/td>\n<\/tr>\n<tr>\n<td>Y5（2 号移行后）<\/td>\n<td>婚姻 / 家族计划评估；储蓄 400–600 万円<\/td>\n<\/tr>\n<tr>\n<td>Y6–8<\/td>\n<td>家族来日成本（住房升级、语言学校、机票）：预留 150–250 万円<\/td>\n<\/tr>\n<tr>\n<td>Y10（永住申请）<\/td>\n<td>储蓄 800 万円+ / 世帯年收达标 / 无任何滞纳记录<\/td>\n<\/tr>\n<tr>\n<td>Y10+<\/td>\n<td>住宅评估（永住者可申请全额房贷）· 子女教育基金<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>世帯年收达标模拟（永住「年收水准」要件，手册假设）<\/strong>：日本二人世帯平均年收约 650 万円量级（各年官方数据为准）。Y6 本人 430 万 → 单身期可过；Y8 本人 480 万 + 配偶者 200 万（Part→正社）= 680 万，达标窗口；Y10 本人 520 万 + 配偶者 260 万 = 780 万，稳。策略含义：<strong>配偶者的就业收入是永住年收达标的关键变量<\/strong>——2 号带家属后，支持配偶者日语学习与就业即是财务规划的一部分（推断）。<\/p>\n<p><strong>大额决策清单与时机（建议）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">决策<\/th>\n<th style=\"width:33%\">建议时机<\/th>\n<th style=\"width:34%\">要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>购车（家庭用车）<\/td>\n<td>Y5 后<\/td>\n<td>永住前可贷款但额度低；车检 / 保险成本计入<\/td>\n<\/tr>\n<tr>\n<td>住宅购入<\/td>\n<td>永住取得后<\/td>\n<td>永住者房贷利率最优（フラット 35 等）；北海道等土地便宜但要绑定就业地<\/td>\n<\/tr>\n<tr>\n<td>子女教育<\/td>\n<td>Y8 前<\/td>\n<td>公立校免费 + 给食；大学阶段教育费 500 万+（国立自宅）<\/td>\n<\/tr>\n<tr>\n<td>保险组合<\/td>\n<td>Y3<\/td>\n<td>生命保险克制：公司福利 + 健保已覆盖大部分，重点补死亡 / 工伤<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>汇款建议（建议 / 推断）<\/strong>：渠道 Wise / Revolut（汇率优）、银行电汇（sofh 银行·住信 SBI 网银对华有优惠线路）、家族汇款用「在住证明 + 用途」文件准备；频率建议按季度集中汇款摊薄手续费，10 万円以下汇款手续简化；汇率在 1 CNY ≈ 19–22 JPY 区间低位多汇（历史波动参考，不做投机）。<\/p>\n<p><strong>落地后动作（手册 02，建议）<\/strong>：第 1 个月银行开户（邮储 / 主要 mega bank 都接受在留卡开户）、办 My Number 卡；第 2 个月建立家用账本（Money Forward / freee 家计簿 app）；每半年对比本文件模型 vs 实际，修正偏差。<\/p>\n<p><strong>年金与归档（手册 03，建议）<\/strong>：厚生年金按工资比例自动扣——不停职就不断缴，风险最低；ねんきん定期便每年生日月前后寄达 / My Number Portal 可查，<strong>每年存档一份<\/strong> = 缴费证据；脱退一时金若最终不永住归国可申请（最多 5 年分），本规划走永住则长期复利留下更划算。归档清单：每年 1–2 月前年源泉征收票；每年ねんきん定期便、住民税决定通知书；My Number Portal 按年导出缴费记录 PDF。<\/p>\n<p><strong>金融习惯（手册 04，建议）<\/strong>：活期 + 定期组合（Net 系银行利率略高）；iDeCo / つみたてNISA 在留资格稳定（2 号）后再开启——永住前投资账户的处理要向税务士确认；信用卡按时还款积累信用信息（Y1 就开始）。<\/p>\n<p><strong>年度复盘模板（手册 04）<\/strong>：每年 1 月对照刷新——储蓄余额 / 世帯年收 / 公的义务记录（零瑕疵）/ 大额决策进度；每年 10 月刷新最低賃金与行情数据。<\/p>\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<p><strong>核验程度分级<\/strong>：<\/p>\n<ul>\n<li><strong>A 官方一手<\/strong>：运输業月均工资（厚労省）、最低賃金（厚生労働省）、100 日元汇率（chinamoney.com.cn）、国税厅 / 厚生劳动省来源标注的统计。<\/li>\n<li><strong>B 权威转引<\/strong>：本主题素材未含权威转引层数据。<\/li>\n<li><strong>C 平台抽样 / 估算<\/strong>：卡车司机平均年收、月给区间、月度成本模型、储蓄模型、到手工资比例、世帯年收模拟（均为手册规划估算，<strong>待核验<\/strong>）。<\/li>\n<\/ul>\n<p><strong>已知口径冲突（并列呈现，不合并、不取均值）<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>收入<\/td>\n<td>税引前月収 ≠ 手取り（社保・税后）<\/td>\n<\/tr>\n<tr>\n<td>工资统计<\/td>\n<td>家計調査（世帯）≠ 勤労統計（事業所）<\/td>\n<\/tr>\n<tr>\n<td>最低賃金<\/td>\n<td>全国平均 ≠ 都道府県加权平均<\/td>\n<\/tr>\n<tr>\n<td>司机收入<\/td>\n<td>运输業月均工资（厚労省）≠ 卡车司机平均年收（含赏与）<\/td>\n<\/tr>\n<tr>\n<td>中日对比<\/td>\n<td>100 日元中间价 ≠ 1 CNY 折算（汇率日不同）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>未取得项<\/strong>：CPI 综合指数（登记册 #4，待基线确立）、年金 / 社保个人负担率（#5，待基线确立）、个人月度收支结算（#6，待记录）；卡车司机平均年收、月给区间、到手工资比例、月度成本模型为手册估算，待核验。<\/p>\n<p><strong>风险与不确定性<\/strong>：手册中市场类数字（司机年收、月给、到手比例）无发布机构标注，核验前存在偏差风险；个人收支与 CPI 缺失使储蓄率与世帯年收模拟无法验证；永住年收要件与取消风险归 08-visa-immigration，本主题只提供财务证据链，不构成要件判断。<\/p>\n<h3 id=\"_11\"><a id=\"待复核清单\" aria-hidden=\"true\"><\/a>待复核清单<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">#<\/th>\n<th style=\"width:33%\">待复核项<\/th>\n<th style=\"width:34%\">复核入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>运输業月均工资下一期（2026-10 及以后）是否延续 341,158 円水平<\/td>\n<td>厚生労働省 毎月勤労統計（锚 01-ssw-driver #5）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>2026 年度最低賃金改定后全国平均与时给带<\/td>\n<td>厚生労働省 https://www.mhlw.go.jp/<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>100 日元汇率中间价 2026-11 之后是否落在 1 CNY ≈ 19–22 JPY 参考带<\/td>\n<td>中国外汇交易中心 chinamoney.com.cn<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>CPI 综合指数首个基线值<\/td>\n<td>総務省統計局 https://www.stat.go.jp/<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>年金 / 社保个人负担率首个基线值<\/td>\n<td>日本年金機構 / 厚生労働省<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>个人月度收支结算与手册模型（10.5–17.0 万円/月）的偏差<\/td>\n<td>自记录（Money Forward / freee 家计簿）<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>卡车司机平均年收 / 月给区间 / 到手比例 / 成本模型<\/td>\n<td>手册估算，需多源交叉验证后回写<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://www.mhlw.go.jp/\">厚生労働省<\/a> — 毎月勤労統計 / 最低賃金，2025–2026。<\/li>\n<li><a href=\"https://www.nta.go.jp/\">国税厅<\/a> — 民间给与实态统计，2025。<\/li>\n<li>中国外汇交易中心（chinamoney.com.cn）— 100 日元汇率中间价，2026-11-10。<\/li>\n<li><a href=\"https://www.stat.go.jp/\">総務省統計局<\/a> — 消费物价指数（CPI 综合指数），待基线确立。<\/li>\n<li>日本年金機構 / 厚生労働省 — 年金・社保费率，待基线确立。<\/li>\n<li>中国国家统计局 — 工资对比输入（项目指定例外），本主题未引用具体数值。<\/li>\n<\/ol>\n<p><strong>内部知识库（本主题）<\/strong>：<\/p>\n<ol>\n<li><a href=\"https://github.com/hmbphxkw76-byte/jp-life-work/blob/main/07-economy-finance/data/economy_indicator_registry.md\">07-economy-finance 指标登记册<\/a> — 活值与口径清单，2026-11-12（2026-11-14 结构拆分后维护）。<\/li>\n<li>07-economy-finance 知识手册（handbook/01–04，拆分整理版）— 2026-11-14；原合并版存档 <code>reports/archives/2026-11-economy-finance-merged-v1.0.md<\/code>（2026-11-12）。<\/li>\n<\/ol>\n<p><strong>交叉引用主题<\/strong>：<\/p>\n<ol>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver 报告<\/a> — 登记册 #5（运输業月均工资锚）、交叉验证输入（100 日元汇率）、3.5 节净收入模型口径，只读引用。<\/li>\n<li><a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver 报告<\/a> — 薪资结构与工时合规 / 实际工作条件记录，只读引用。<\/li>\n<li><a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration 报告<\/a> — 永住年收要件与取消风险，只读引用。<\/li>\n<li><a href=\"../../03-career-management/reports/2026-11-career-management.md\">03-career-management 报告<\/a> — 管理岗晋升与收入曲线，只读引用。<\/li>\n<\/ol>\n", "stats": {"new": 0, "mod": 0, "del": 0, "equal": 164, "prev": null}, "summary": "2026-11 期为首期报告，无上期对比。", "path": "07-economy-finance/reports/2026-11-economy-finance.html"}}}, "visa-immigration": {"name": "签证与移民", "dir": "08-visa-immigration", "months": {"2026-11": {"title": "日本签证与在留资格 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本签证与在留资格--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本签证与在留资格 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：政策法规解读型（policy-analysis）\n<strong>受众定位<\/strong>：面向拟通过特定技能（SSW）赴日从事货运司机工作、并规划长期在留的读者，兼具制度查询与路径规划视角。\n<strong>来源规则<\/strong>：① 出入国在留管理庁（isa.go.jp / moj.go.jp）、ssw.go.jp、e-Gov 法令检索、国土交通省（mlit.go.jp）＞ ② JFT-Basic（国際交流基金 / Prometric）、JLPT（JEES）、外国人技能実習機構（otit.go.jp）＞ ③ 全日本トラック協会、登录支援机关行业信息 ＞ ④ 指定取次 / 中介机构官网（仅流程参考，不作数据源）＞ ⑤ NHK、日本経済新聞、Nikkei Asia、外務省各领馆中文页（费用类可作一手）<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要<\/a>\n<a href=\"#s2\">二、政策台账与监测机制<\/a>\n<a href=\"#s3\">三、监管框架总览<\/a>\n<a href=\"#s4\">四、重点政策逐条解读<\/a>\n<a href=\"#s5\">五、影响对象矩阵<\/a>\n<a href=\"#s6\">六、合规应对建议（建议章）<\/a>\n<a href=\"#s7\">七、生效时间线<\/a>\n<a href=\"#s8\">八、数据治理与局限<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要\" aria-hidden=\"true\"><\/a>一、执行摘要<\/h2>\n<p><strong>核心判断<\/strong>（编号条目，每条含政策、条款与来源）：<\/p>\n<ol>\n<li><strong>受入上限<\/strong>：自动车运送业特定技能 1 号受入上限为 <strong>22,100 人<\/strong>（至 2029 年 3 月末＝令和 11 年 3 月末，2026-01-23 阁议）；ssw.go.jp 中文页仍显示 24,500，属未同步线索。2026-08 末该分野 1 号在留 <strong>843 人<\/strong>、充足率 3.8%。来源：moj.go.jp 分野运用方针；ISA 统计月报 2026-08 末速报原件 <a href=\"https://www.moj.go.jp/isa/content/001472175.pdf\">https://www.moj.go.jp/isa/content/001472175.pdf<\/a>。标注：事实。<\/li>\n<li><strong>升级路径<\/strong>：特定技能 2 号仅 <strong>11 分野<\/strong>，<strong>自动车运送业无 2 号<\/strong>，「1 号→2 号」路径不存在；长期主线为 <strong>1 号→技人国→永住（约 10 年）<\/strong>。来源：ssw.go.jp 分野清单 <a href=\"https://www.ssw.go.jp/cn/about/visa/\">https://www.ssw.go.jp/cn/about/visa/<\/a>；handbook 05。标注：事实。<\/li>\n<li><strong>育成就劳<\/strong>：2027-04-01 施行（技能实习法废止），MOC 名单（ISA 页 7 国 / OTIT 一览 16 国）<strong>均不含中国<\/strong>——育成就劳渠道目前无法从中国招募；<strong>自动车运送业运用要领未公布<\/strong>。来源：isa.go.jp / otit.go.jp（2026-11-12 核验）。标注：事实。<\/li>\n<li><strong>永住要件<\/strong>：永住许可指南于<strong>令和 8-10-01 改定<\/strong>（2027-04-01 起申请适用），新增<strong>世帯年収、年金受給見込、日本語能力<\/strong>考量。来源：ISA 永住许可指南 <a href=\"https://www.moj.go.jp/isa/10_00279.html\">https://www.moj.go.jp/isa/10_00279.html<\/a>。标注：事实。<\/li>\n<li><strong>家属带同<\/strong>：特定技能 1 号期间<strong>原则不能带家属<\/strong>；家族滞在扶养人限特定就劳资格·留学等持有者的配偶·子，<strong>年收门槛无官方数值（待复核）<\/strong>；配偶资格外活動許可包括许可为<strong>1 周 28 小时以内<\/strong>。来源：moj.go.jp「家族滞在」页 <a href=\"https://www.moj.go.jp/isa/applications/status/dependent\">https://www.moj.go.jp/isa/applications/status/dependent<\/a>。标注：事实（制度要件）；带同时点为推断。<\/li>\n<li><strong>时间线判断<\/strong>：司机路线的现实永住时间线取决于<strong>第 5 年能否成功转换资格<\/strong>，而非自动延续。标注：推断。<\/li>\n<\/ol>\n<p><strong>监管态势一句话<\/strong>：制度面「扩大受入（育成就劳 2027 年施行）＋管理强化（永住要件改定、接受机关审查加严）」并行；本分野入场通道（1 号）持续开放，但 <strong>5 年上限后的资格切换<\/strong>是长期定居的硬约束。<\/p>\n<p><strong>生效时间线要点<\/strong>：2026-07-01 签证费 715 元；2026-10-01 永住指南改定；2026-11-12 MOC 页更新；<strong>2027-04-01<\/strong> 育成就劳施行、1 号支援体制要件改正生效、出租车·巴士 B1 要求适用于 COE 申请；<strong>2029-03<\/strong> 受入上限到期（详见第七节）。<\/p>\n<p><strong>解读说明<\/strong>：本报告为 2026-11 月度（复用）生成，政策解读以官方原文为准，登记册活值优先；原文有歧义处并列两种以上解读（见第四、八节）。本报告输出政策文本解读与影响评估，不构成法律意见；建议章（第六节）与事实分离。<\/p>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">指标<\/th>\n<th style=\"width:20%\">最新活值<\/th>\n<th style=\"width:20%\">来源 / 时点<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>特定技能受入上限（自动车运送业）<\/td>\n<td>22,100（至 2029-03 末；ssw.go.jp 仍显示 24,500）<\/td>\n<td>moj.go.jp 运用方针；2026-01-23 阁议<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>分野在留者数<\/td>\n<td>843 人（2026-08 末速报；充足率 3.8%）<\/td>\n<td>ISA 统计月报<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>技能试験费用与日程<\/td>\n<td>6,500 円；月报至 2026-09（实施国 18、中国大陆无考点）<\/td>\n<td>ClassNK portal<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>JFT-Basic 日本国内费用<\/td>\n<td>10,000 円<\/td>\n<td>Prometric<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>签证费用（中国受理领馆）<\/td>\n<td>715 元（2026-07-01 起）<\/td>\n<td>领馆费用专页<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>育成就労 運用要領 分野公布<\/td>\n<td>漁業 2026-11-06、宿泊 10-16、飲食料品・資源循環 10-09 等；自动车运送业 未公布<\/td>\n<td>isa.go.jp / otit.go.jp<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>育成就労 MOC 国家名单<\/td>\n<td>16 国（中国不在名单内；ISA MOC 页 7 国）<\/td>\n<td>otit.go.jp<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>永住要件现行口径<\/td>\n<td>令和 8-10-01 改定（2027-04-01 起申请适用）：世帯年収・年金受給見込・日本語 B1・制度理解<\/td>\n<td>isa.go.jp ガイドライン<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>2 号适用分野<\/td>\n<td>11 分野（自动车运送业无 2 号）<\/td>\n<td>ssw.go.jp<\/td>\n<td>截至 2026-11-14 无更新<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>家族滞在 扶养要件与收入证明口径<\/td>\n<td>扶养人限定为特定就劳资格·留学等持有者的配偶·子；须附扶养者职业·收入证明；<strong>年收门槛无官方数值<\/strong><\/td>\n<td>moj.go.jp<\/td>\n<td>2026-11-12 维度扩充<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>資格外活動許可（家族滞在）规则<\/td>\n<td>包括许可 1 周 28 小时以内（仅需申请书）；个别许可从事期间不超在留期间过半<\/td>\n<td>moj.go.jp<\/td>\n<td>2026-11-12 维度扩充<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>注：本表逐项抄录登记册活值，未改写数值；本期为复用生成，登记册活值与 2026-11-12 验证运行一致，#10 #11 为该次维度扩充项，其余各项无新增变更。<\/p>\n<\/blockquote>\n<h3 id=\"_3\"><a id=\"已修正事实清单\" aria-hidden=\"true\"><\/a>已修正事实清单<\/h3>\n<p>本版继承历史报告（2026-11-13）已修正事实清单，无新增修正。已修正要点：<\/p>\n<ul>\n<li><strong>2026-11-11 重大更正<\/strong>：特定技能 2 号仅 11 分野、<strong>自动车运送业无 2 号<\/strong>，「1 号→2 号」路径不存在；长期主线改为 1 号→技人国 / 高度专门职→永住。<\/li>\n<li><strong>受入上限<\/strong>：由 24,500 修正为 <strong>22,100<\/strong>（至 2029-03 末）；ssw.go.jp 中文页 24,500 仅作未同步线索。<\/li>\n<li><strong>育成就労 MOC 口径区分<\/strong>：ISA 页 <strong>7 国<\/strong> ≠ OTIT <strong>16 国<\/strong>（含暂定），均不含中国。<\/li>\n<li><strong>843 人原始出处<\/strong>：已取得 ISA 原件（2026-08 末速报：843 人 / 22,100 / 充足率 3.8%）。<\/li>\n<\/ul>\n<h2 id=\"s2\"><a id=\"二政策台账与监测机制\" aria-hidden=\"true\"><\/a>二、政策台账与监测机制<\/h2>\n<p><strong>台账结构<\/strong>：本主题活值统一维护于 <a href=\"../data/visa_immigration_indicator_registry.md\">data/visa_immigration_indicator_registry.md<\/a>（11 项核心指标 + 研究边界档案）；prompt 模板内不填活值。<\/p>\n<p><strong>监测节拍<\/strong>：基线报告 <code>reports/2026-11-visa-immigration.md<\/code>（v1.0 首期固定）；事件触发解读 <code>reports/{{YYYY-MM}}-&lt;slug&gt;.md<\/code>；年度台账复盘同名路径。无触发器命中且窗口未到时不启动新解读，不得为制造变化而虚构变化。<\/p>\n<p><strong>追踪表<\/strong>（研究维度 × 优先来源 × 回写项）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">监测指标<\/th>\n<th style=\"width:20%\">优先数据源<\/th>\n<th style=\"width:20%\">对应章节<\/th>\n<th style=\"width:20%\">回写登记册项<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>特定技能受入上限（自动车运送业）<\/td>\n<td>moj.go.jp 运用方针<\/td>\n<td>三 / 四<\/td>\n<td>核心指标 #1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>分野在留者数<\/td>\n<td>ISA 统计月报<\/td>\n<td>三 / 四<\/td>\n<td>核心指标 #2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>技能试験费用与日程<\/td>\n<td>ClassNK portal<\/td>\n<td>四<\/td>\n<td>核心指标 #3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>JFT-Basic 日本国内费用<\/td>\n<td>Prometric<\/td>\n<td>四<\/td>\n<td>核心指标 #4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>签证费用（中国受理领馆）<\/td>\n<td>领馆费用专页<\/td>\n<td>四<\/td>\n<td>核心指标 #5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>育成就労 運用要領 分野公布<\/td>\n<td>isa.go.jp / otit.go.jp<\/td>\n<td>四<\/td>\n<td>核心指标 #6<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>育成就労 MOC 国家名单<\/td>\n<td>otit.go.jp<\/td>\n<td>四<\/td>\n<td>核心指标 #7<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>永住要件现行口径<\/td>\n<td>isa.go.jp ガイドライン<\/td>\n<td>四<\/td>\n<td>核心指标 #8<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>2 号适用分野<\/td>\n<td>ssw.go.jp<\/td>\n<td>四<\/td>\n<td>核心指标 #9<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>家族滞在 扶养要件与收入证明口径<\/td>\n<td>moj.go.jp<\/td>\n<td>四<\/td>\n<td>核心指标 #10<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>資格外活動許可（家族滞在）规则<\/td>\n<td>moj.go.jp<\/td>\n<td>四<\/td>\n<td>核心指标 #11<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>官方发布渠道清单<\/strong>：<\/p>\n<ul>\n<li>出入国在留管理庁（ISA）：制度总页、分野运用方针、更新情报 <a href=\"https://www.moj.go.jp/isa/applications/ssw/\">https://www.moj.go.jp/isa/applications/ssw/<\/a>；统计月报 PDF。<\/li>\n<li>特定技能综合支援站：<a href=\"https://www.ssw.go.jp\">https://www.ssw.go.jp<\/a>（含中文版 <a href=\"https://www.ssw.go.jp/cn/\">https://www.ssw.go.jp/cn/<\/a>）。<\/li>\n<li>法务省 / e-Gov 法令检索：<a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>。<\/li>\n<li>国土交通省（自动车运送业分野主管）：<a href=\"https://www.mlit.go.jp\">https://www.mlit.go.jp<\/a>。<\/li>\n<li>考试实施：ClassNK Portal <a href=\"https://sswt-portal.classnk.or.jp/\">https://sswt-portal.classnk.or.jp/<\/a>；JFT-Basic <a href=\"https://jft-basic.jp\">https://jft-basic.jp<\/a>；JLPT <a href=\"https://www.jlpt.jp\">https://www.jlpt.jp<\/a>；OTIT <a href=\"https://www.otit.go.jp/employment_for_skill_development/05/\">https://www.otit.go.jp/employment_for_skill_development/05/<\/a>。<\/li>\n<li>外务省 / 领馆费用专页（签证费）。<\/li>\n<\/ul>\n<p><strong>触发器清单<\/strong>：<\/p>\n<ol>\n<li>出入国在留管理庁特定技能制度改定（分野扩缩、要件变更、在留上限调整）→ 三 / 四；<\/li>\n<li>「自动车运送业」技能试験・日本語试験新年度日程或大纲变更 → 四；<\/li>\n<li>育成就劳制度法案 / 运用要領 / 分野别运用方针进展 → 四；<\/li>\n<li>永住許可ガイドライン改定（年収・年金・日本語・制度理解要件）→ 四；<\/li>\n<li>「家族滞在」在留资格要件变化（扶养人资格范围、扶养审查·年收基准运用实例）→ 四；<\/li>\n<li>資格外活動許可规则变化（周 28 小时上限、个别许可要件）→ 四；<\/li>\n<li>外务省 / 领馆签证费、审查期间、申请流程调整 → 四；<\/li>\n<li><a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a> 监测报告「已修正事实清单」追加 → 对应文档回写。<\/li>\n<\/ol>\n<p><strong>观察项与触发器状态<\/strong>（摘自登记册）：唯一观察项 · 首要触发器 · 触发器结论均为「首期为空」。<\/p>\n<h2 id=\"s3\"><a id=\"三监管框架总览\" aria-hidden=\"true\"><\/a>三、监管框架总览<\/h2>\n<p><strong>制度分层口径<\/strong>：在留资格体系为 技術・人文知識・国際業務 / 高度専門職 / 特定技能 1 号 / 特定技能 2 号 / 技能実習 / 育成就労（2027-04-01 施行）；本分野为<strong>自动车运送业<\/strong>（2024 年度新设）——<strong>无 2 号<\/strong>（2 号仅 11 分野）；主线为 <strong>1 号（上限 5 年）→ 技人国 / 高度专门职 → 永住<\/strong>。<\/p>\n<p><strong>1 号 / 2 号对比<\/strong>：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">项目<\/th>\n<th style=\"width:33%\">特定技能 1 号<\/th>\n<th style=\"width:34%\">特定技能 2 号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>适用行业<\/td>\n<td>19 个指定分野（含自动车运送业）<\/td>\n<td>11 个分野（不含自动车运送业、铁道、林业、木材产业）<\/td>\n<\/tr>\n<tr>\n<td>在留期间<\/td>\n<td>各 1 年 / 6 个月 / 4 个月，更新不超过上限（自动车运送业为 5 年）<\/td>\n<td>3 年 / 1 年 / 6 个月，可无限更新<\/td>\n<\/tr>\n<tr>\n<td>家族带同<\/td>\n<td>原则不可（例外：同等要件相当者等）<\/td>\n<td>可以（配偶者 + 子）<\/td>\n<\/tr>\n<tr>\n<td>日语要求<\/td>\n<td>卡车：JFT-Basic（A2.2 相当）或 JLPT N4 以上；出租车·巴士：JLPT N3 以上且须 B1 相当以上（满足受入机关条件时可用 JFT-Basic / N4 替代）<\/td>\n<td>原则上 B1 相当以上（自 2027-04-01 起 COE 申请适用；变更·更新待公告）<\/td>\n<\/tr>\n<tr>\n<td>支援义务<\/td>\n<td>接受机关 / 登录支援机关须提供生活支援<\/td>\n<td>无强制支援义务（自主自立）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>来源：ssw.go.jp 分野清单（2026）；ISA 自动车运送业分野运用方针（2026）。<\/p>\n<p><strong>分野一览<\/strong>：1 号 19 分野（介护、ビルクリーニング、工业制品制造业、建设、造船・舶用工业、自动车整备、航空、宿泊、自动车运送业、铁道、农业、渔业、饮食料品制造业、外食业、林业、木材产业、资源循环、リネンサプライ、物流仓库）；2 号 11 分野（ビルクリーニング、建设、工业制品制造业、造船・舶用工业、自动车整备、航空、宿泊、农业、渔业、饮食料品制造业、外食业）。<\/p>\n<p><strong>与其他在留资格的关系<\/strong>：技能实习将自 2027 年 4 月被育成就劳取代（育成就劳原则上以 3 年内移行特定技能为目标）；技人国是后期转向物流技术 / 数字化岗位的备选资格；永住者为长期定居终点。<\/p>\n<p><strong>检索入口<\/strong>：ISA 特定技能总页 <a href=\"https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html\">https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html<\/a>；自动车运送业分野页 <a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\">https://www.moj.go.jp/isa/policies/ssw/automobiletransportation<\/a>；e-Gov 法令检索 <a href=\"https://laws.e-gov.go.jp\">https://laws.e-gov.go.jp<\/a>。<\/p>\n<p><strong>跨主题分工<\/strong>：官方统计活值 → <a href=\"../../01-ssw-driver/reports/2026-11-ssw-driver.md\">01-ssw-driver<\/a>（只读引用）；法规条文深度解读 → <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>；岗位薪资 → <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；日语学习 → <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>；现场层执行 → <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>；行业结构 → <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>。<\/p>\n<h2 id=\"s4\"><a id=\"四重点政策逐条解读\" aria-hidden=\"true\"><\/a>四、重点政策逐条解读<\/h2>\n<h3 id=\"41-22100-2026-01-23\"><a id=\"41-受入上限22100-人2026-01-23-阁议\" aria-hidden=\"true\"><\/a>4.1 受入上限：22,100 人（2026-01-23 阁议）<\/h3>\n<ul>\n<li><strong>条款摘编<\/strong>：自动车运送业分野特定技能 1 号受入上限 <strong>22,100 人<\/strong>，适用至 2029 年 3 月末；2026-08 末在留 843 人、充足率 3.8%。<\/li>\n<li><strong>解读<\/strong>：上限远未用满，短期入场空间充足；但 2029-03 到期后的延续政策未定。<\/li>\n<li><strong>口径并列（不合并）<\/strong>：<strong>22,100（现行，moj.go.jp）≠ 24,500（ssw.go.jp 中文页未同步）<\/strong>。本库一律采用 ISA 运用方针 22,100；中文页 24,500 仅作未同步线索。<\/li>\n<li><strong>来源<\/strong>：moj.go.jp 运用方针（2026）；ISA 统计月报 2026-08 末速报。<\/li>\n<\/ul>\n<h3 id=\"42\"><a id=\"42-人才基准与日语要求卡车--出租车--巴士\" aria-hidden=\"true\"><\/a>4.2 人才基准与日语要求（卡车 / 出租车 / 巴士）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">岗位<\/th>\n<th style=\"width:33%\">技能要求<\/th>\n<th style=\"width:34%\">日语要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卡车<\/td>\n<td>评价试验（卡车）+ 第一种驾驶执照<\/td>\n<td>JFT-Basic（A2.2 相当）或 JLPT N4 以上<\/td>\n<\/tr>\n<tr>\n<td>出租车<\/td>\n<td>评价试验（出租车）+ 第二种驾驶执照 + 新任驾驶员研修<\/td>\n<td>JLPT N3 以上且须 B1 相当以上；受入机关落实第 9、10 项措施时可用 JFT-Basic / N4 替代<\/td>\n<\/tr>\n<tr>\n<td>巴士<\/td>\n<td>评价试验（巴士）+ 第二种驾驶执照 + 新任驾驶员研修<\/td>\n<td>同出租车（替代情形为第 9、10 或 11 项措施）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>过渡期<\/strong>：自 2027-04-01 起提交的 COE 申请，出租车·巴士区分须「B1 相当以上」；<strong>在留资格变更·期间更新申请的适用时间仍在检讨中（待公告）<\/strong>。<\/li>\n<li><strong>健康检查<\/strong>：本分野<strong>无健康检查义务<\/strong>；唯一健康相关项为出租车 / 巴士新任驾驶员研修内的「適性診断」（旅客自動車運送事業運輸規則第 38 条第 2 項）。<\/li>\n<li><strong>歧义并列<\/strong>：B1 要求的变更·更新适用时间官方未明确，存在「2027-04-01 起全部适用」与「仅 COE 申请适用、变更·更新另待公告」两种解读，并列保留、不静默择一。<\/li>\n<li><strong>来源<\/strong>：ISA 自动车运送业分野运用方针；ISA 出租车·巴士日语要求页 <a href=\"https://www.moj.go.jp/isa/03_00198.html\">https://www.moj.go.jp/isa/03_00198.html<\/a>。<\/li>\n<\/ul>\n<h3 id=\"43\"><a id=\"43-评价试验与考试费用\" aria-hidden=\"true\"><\/a>4.3 评价试验与考试费用<\/h3>\n<ul>\n<li><strong>受验资格<\/strong>：满 17 岁（印尼考场 18 岁）、有效驾照（日本或外国均可）、无日本国籍、国内受验需有在留资格。<\/li>\n<li><strong>考试构成<\/strong>：知识试 50 题，<strong>45 题以上正确<\/strong>为合格；技能试为实技评分。<\/li>\n<li><strong>费用<\/strong>：日本国内 <strong>6,500 円（税抜）<\/strong>、海外 <strong>45 美元<\/strong>（部分国家按当地规定为 50 美元）；合格证明书发行手续费另计。<\/li>\n<li><strong>日语考试<\/strong>：JFT-Basic 日本国内 <strong>10,000 円<\/strong>；JLPT 中国考区 N3/N4/N5 <strong>450 元<\/strong>、N1/N2 550 元。<\/li>\n<li><strong>来源<\/strong>：ClassNK Portal <a href=\"https://sswt-portal.classnk.or.jp/news/25\">https://sswt-portal.classnk.or.jp/news/25<\/a>；Prometric <a href=\"https://www.prometric-jp.com/ssw/exam/fee/\">https://www.prometric-jp.com/ssw/exam/fee/<\/a>；NEEA <a href=\"https://jlpt.neea.edu.cn/faq.html\">https://jlpt.neea.edu.cn/faq.html<\/a>。<\/li>\n<\/ul>\n<h3 id=\"44\"><a id=\"44-申请流程与材料\" aria-hidden=\"true\"><\/a>4.4 申请流程与材料<\/h3>\n<ul>\n<li><strong>两条路径<\/strong>：A 海外直接申请（中国国内 → 日本：考试 + 雇佣契约 → 雇主受入计划书认定 → COE → 领馆签证 → 入境）；B 国内移行（持技能实习 / 育成就劳等资格者，完成同等技能·日语要件后由雇主申请在留资格变更许可）。<\/li>\n<li><strong>材料<\/strong>：本人 7 项（申请书、护照复印件与证件照、评价试验合格证明、日语能力证明、驾照复印件（外国驾照附翻译）、履历书、返纳保证书等）；雇主 5 项（受入计划书认定证明、雇佣契约书、支援计划书与实绩、公司登记与损益文件、雇用保险·社保加入证明）。<\/li>\n<li><strong>在留管理义务<\/strong>：在留卡随身携带；地址变更 <strong>14 日内<\/strong>报备；每次期满前更新；无正当理由<strong>连续 3 个月<\/strong>不从事原业务 → 资格取消风险。<\/li>\n<li><strong>常见不许可风险点<\/strong>：雇主受入计划书认定瑕疵、日语证明与实际能力差距、驾照翻译件不符合要求、支援体制不落实。<\/li>\n<li><strong>签证费<\/strong>：单次 <strong>715 元<\/strong>（2026-07-01 起，代办机构另收手续费）。<\/li>\n<li><strong>来源<\/strong>：领馆费用专页 <a href=\"https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html\">https://www.shanghai.cn.emb-japan.go.jp/itpr_ja/11_000001_00633.html<\/a>；handbook 04。<\/li>\n<\/ul>\n<h3 id=\"45-2\"><a id=\"45-特定技能-2-号与升级路径\" aria-hidden=\"true\"><\/a>4.5 特定技能 2 号与升级路径<\/h3>\n<ul>\n<li><strong>前提<\/strong>：2 号仅 11 分野；<strong>自动车运送业不符合<\/strong>。移行要件（通则）：2 号技能评价试验合格 + 实务经验 + 日语 B1 相当以上（2027-04-01 起 COE 申请适用；变更·更新待公告）+ 接受机关要件。<\/li>\n<li><strong>对本案结论<\/strong>：「1 号司机 → 2 号」路径不存在；长期方案为 <strong>A 技人国（首选；大学毕业或 10 年相关经验；N2 为实务隐形门槛）<\/strong>、B 补学历→技人国（兜底）、C 高度专门职（70 分门槛；无学位基本不可达）。<\/li>\n<li><strong>高度人材积分（主要项）<\/strong>：学历 博士 30 / 修士 20 / 大学 10；职历 10 年 20 / 7–10 年 15 / 5–7 年 10；年收 约 400 万 10 起、500 万 15、600 万 20；年龄 30 未满 15 / 30–34 10 / 35–39 5；日语 N1 15 / N2 10。计算例（推断）：大学 10 + 职历 5 年 10 + 年收 500 万 15 + 年龄 30–34 10 + N2 10 = 55 分，未达 70。<\/li>\n<li><strong>时间表<\/strong>：Y1–Y2 日语 N2 → Y3 转岗 → Y4 提交技人国变更（最晚）→ Y5 完成变更 → Y6–Y10 收入 / 纳税 / 年金达标 → 永住申请。<\/li>\n<li><strong>来源<\/strong>：ssw.go.jp；ISA 技人国页 <a href=\"https://www.moj.go.jp/isa/applications/status/gijinkoku.html\">https://www.moj.go.jp/isa/applications/status/gijinkoku.html<\/a>；handbook 05。<\/li>\n<\/ul>\n<h3 id=\"46-2027-04-01\"><a id=\"46-育成就劳制度2027-04-01-施行\" aria-hidden=\"true\"><\/a>4.6 育成就劳制度（2027-04-01 施行）<\/h3>\n<ul>\n<li><strong>条款摘编<\/strong>：2024-06-21 公布改正法，技能实习（约 40 年历史）将被育成就劳取代；原则上以 <strong>3 年内移行特定技能<\/strong>为目标；育成阶段可跨企业、跨地区转职；原则上仅从 MOC 签署国接收。<\/li>\n<li><strong>进展<\/strong>：2026-04-15 监理支援机关许可申请受理开始；2026-09-01 育成就劳计划认定申请受理开始；运用要领陆续公布——漁業 2026-11-06、宿泊 10-16、飲食料品製造業・資源循環 10-09、物流倉庫 08-28 等；<strong>自动车运送业未公布<\/strong>。<\/li>\n<li><strong>口径并列（不合并）<\/strong>：MOC 国家 <strong>ISA 页 7 国（乌兹别克、斯里兰卡、泰国、孟加拉、越南、东帝汶、老挝）≠ OTIT 一览 16 国（含暂定）<\/strong>；<strong>均不含中国<\/strong>。<\/li>\n<li><strong>对本案影响<\/strong>：已有 N4 + 驾照可直接走 1 号更优；日语 / 技能暂不达标可走育成就劳；已持技能实习关注 2027 衔接。<\/li>\n<li><strong>来源<\/strong>：ISA 育成就劳页 <a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\">https://www.moj.go.jp/isa/applications/index_00005.html<\/a>；MOC 页 <a href=\"https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html\">https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri05_00002.html<\/a>；OTIT <a href=\"https://www.otit.go.jp/employment_for_skill_development/05/\">https://www.otit.go.jp/employment_for_skill_development/05/<\/a>。<\/li>\n<\/ul>\n<h3 id=\"47\"><a id=\"47-永住许可要件与取消\" aria-hidden=\"true\"><\/a>4.7 永住许可要件与取消<\/h3>\n<ul>\n<li><strong>原则要件（令和 8-10-01 改定版）<\/strong>：连续 10 年以上在留（其中 5 年以上就劳或受扶养）；持有现有资格最长在留期间；行为合规（纳税、社保、雇用保险）；独立生计；<strong>世帯年収<\/strong>持续达到「世帯人数相应的日本人世帯平均收入」以上（家族滞在等非就労资格者收入不计入）；健康保险·年金未履行满 3 年成为不许可 / 取消事由；<strong>年金受給見込額<\/strong>须达标（不足可用補填資産补足）；<strong>日本語能力<\/strong>纳入考虑要素。<\/li>\n<li><strong>2024 年改正（永住取消）<\/strong>：无正当理由<strong>连续 3 年以上未履行纳税或社会保险缴费义务<\/strong>、或出国未取得再入国许可而长期离境等，可取消永住。<\/li>\n<li><strong>10 年时间线<\/strong>：Y0 1 号入境 → Y1–5 更新（≤5 年）→ Y5 切换其他在留资格（2 号不可用）→ Y6–10 新资格 + 收入达标 → Y10 永住申请。关键控制点：Y5 前完成资格切换（<strong>推断<\/strong>：失败则须离境、连续性中断）。<\/li>\n<li><strong>来源<\/strong>：永住许可指南（令和 8-10-01 改定）<a href=\"https://www.moj.go.jp/isa/10_00279.html\">https://www.moj.go.jp/isa/10_00279.html<\/a>；永住者取消指南 <a href=\"https://www.moj.go.jp/isa/11_00118.html\">https://www.moj.go.jp/isa/11_00118.html<\/a>。<\/li>\n<\/ul>\n<h3 id=\"48\"><a id=\"48-家族滞在与资格外活動許可\" aria-hidden=\"true\"><\/a>4.8 家族滞在与资格外活動許可<\/h3>\n<ul>\n<li><strong>扶养人资格<\/strong>：教授、芸術、宗教、報道、高度専門職、経営・管理、法律・会計業務、医療、研究、教育、技術・人文知識・国際業務、企業内転勤、介護、興行、技能、<strong>特定技能 2 号<\/strong>、文化活動、<strong>留学<\/strong>等在留资格者扶养的<strong>配偶者或子<\/strong>；<strong>特定技能 1 号原则上不可带家属<\/strong>。<\/li>\n<li><strong>收入证明口径<\/strong>：须提交扶养者职业·收入证明（在職証明書等＋住民税课税〔或非课税〕证明书＋纳税证明书）；<strong>年收门槛无官方数值（待复核）<\/strong>。<\/li>\n<li><strong>资格外活動許可<\/strong>：包括许可 = <strong>1 周 28 小时以内<\/strong>（仅需申请书）；个别许可 = 涵盖稼働时间不明确活动等，要件之一为<strong>从事期间不超过在留期间过半<\/strong>；超过 28 小时 / 周或实质全职就业可能被判定为在留目的实质变更（推断）。<\/li>\n<li><strong>歧义并列<\/strong>：1 号带同例外（同等要件相当者等）适用细则无公开运用基准；年收门槛存在「以提交证明为足」与「实务扶养能力审查」两种解读，并列保留。<\/li>\n<li><strong>子女衔接<\/strong>：带同最佳时点（推断）与技人国变更（Y4–Y5）同步；高中毕业后可变更为「定住者」直接就业，不符要件者经「特定活动」过渡。<\/li>\n<li><strong>来源<\/strong>：moj.go.jp「家族滞在」页；資格外活動許可页 <a href=\"https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html\">https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00004.html<\/a>；handbook 08。<\/li>\n<\/ul>\n<h2 id=\"s5\"><a id=\"五影响对象矩阵\" aria-hidden=\"true\"><\/a>五、影响对象矩阵<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">政策 / 条款<\/th>\n<th style=\"width:20%\">受影响主体<\/th>\n<th style=\"width:20%\">影响方向<\/th>\n<th style=\"width:20%\">量级 / 口径<\/th>\n<th style=\"width:20%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>受入上限 22,100（2026-01-23 阁议）<\/td>\n<td>自动车运送业受入机关 / 求职者<\/td>\n<td>限制年度受入规模<\/td>\n<td>至 2029-03 末；中文页 24,500 未同步<\/td>\n<td>moj.go.jp 运用方针<\/td>\n<\/tr>\n<tr>\n<td>1 号总在留上限 5 年、无 2 号<\/td>\n<td>司机个人<\/td>\n<td>资格切换硬约束<\/td>\n<td>Y5 前须切换，否则须离境（推断）<\/td>\n<td>ssw.go.jp<\/td>\n<\/tr>\n<tr>\n<td>1 号原则不可带家属<\/td>\n<td>司机家庭<\/td>\n<td>家庭规划后移<\/td>\n<td>例外细则待复核<\/td>\n<td>moj.go.jp<\/td>\n<\/tr>\n<tr>\n<td>出租车·巴士 B1 相当以上（2027-04-01 起 COE）<\/td>\n<td>出租车 / 巴士求职者<\/td>\n<td>门槛提高<\/td>\n<td>满足第 9、10（或 11）项措施可用 N4 / JFT 替代<\/td>\n<td>ISA 03_00198<\/td>\n<\/tr>\n<tr>\n<td>育成就劳 MOC 不含中国<\/td>\n<td>中国国内招募渠道<\/td>\n<td>渠道受限<\/td>\n<td>ISA 7 国 / OTIT 16 国，均不含中国<\/td>\n<td>ISA / OTIT<\/td>\n<\/tr>\n<tr>\n<td>育成就劳 2027-04-01 施行<\/td>\n<td>技能实习在留者 / 求职者<\/td>\n<td>旧制度衔接<\/td>\n<td>3 年内移行特定技能为目标<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>1 号支援体制要件改正（2027-04-01 生效）<\/td>\n<td>受入机关<\/td>\n<td>支援义务变化<\/td>\n<td>2026-07-28 公布<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>永住指南改定（2027-04-01 起申请适用）<\/td>\n<td>长期在留者 / 家庭<\/td>\n<td>要件加严<\/td>\n<td>世帯年収・年金受給見込・日本語<\/td>\n<td>ISA 10_00279<\/td>\n<\/tr>\n<tr>\n<td>永住取消（2024 改正）<\/td>\n<td>永住者<\/td>\n<td>取消风险<\/td>\n<td>连续 3 年未履行纳税 / 社保<\/td>\n<td>ISA 11_00118<\/td>\n<\/tr>\n<tr>\n<td>资格外活動許可 周 28 小时<\/td>\n<td>家族滞在配偶<\/td>\n<td>就劳上限<\/td>\n<td>个别许可为例外<\/td>\n<td>moj.go.jp<\/td>\n<\/tr>\n<tr>\n<td>在留卡 14 日地址变更、3 个月原业务义务<\/td>\n<td>全在留者<\/td>\n<td>合规义务<\/td>\n<td>违反可致资格取消<\/td>\n<td>入管法 / ISA<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>注：矩阵逐格附条款依据；「量级」列中口径冲突处并列呈现，不取均值。<\/p>\n<\/blockquote>\n<h2 id=\"s6\"><a id=\"六合规应对建议建议章\" aria-hidden=\"true\"><\/a>六、合规应对建议（建议章）<\/h2>\n<blockquote>\n<p>本章为「建议」，与事实分离；重大合规决策须咨询执业法律专业人士。<\/p>\n<\/blockquote>\n<h3 id=\"61\"><a id=\"61-入场前建议\" aria-hidden=\"true\"><\/a>6.1 入场前（建议）<\/h3>\n<ol>\n<li><strong>考试路径<\/strong>：中国大陆无 JFT-Basic 考点 → 主攻 <strong>JLPT N4<\/strong>（2027 年 7 月场）；JFT-Basic 作为赴日后或顺路出境时的备用选项（与 N4 同等有效）。<\/li>\n<li><strong>驾照<\/strong>：优先外免切替；无本国驾照者评估在日考照预算（学费约 25–35 万日元、合宿制约 20–30 万日元）。<\/li>\n<li><strong>雇主核验<\/strong>：确认雇主持国土交通省「特定技能受入计划书」认定、加入「自動车运送业分野特定技能協議会」，卡车受入机关须取得 ClassNK 认证或 G マーク。<\/li>\n<li><strong>费用预算<\/strong>：评价试验 6,500 円（国内）/ 45 美元（海外）；JFT-Basic 10,000 円；JLPT 中国 450 / 550 元；签证费 715 元。<\/li>\n<\/ol>\n<h3 id=\"62\"><a id=\"62-在留期间建议\" aria-hidden=\"true\"><\/a>6.2 在留期间（建议）<\/h3>\n<ol>\n<li><strong>更新与义务<\/strong>：每次期满前更新；地址变更 14 日内报备；避免连续 3 个月不从事原业务。<\/li>\n<li><strong>证据链<\/strong>：工资明细、考勤、社保记录长期留存，作为资格切换与永住申请的证据链。<\/li>\n<\/ol>\n<h3 id=\"63\"><a id=\"63-资格切换与长期建议\" aria-hidden=\"true\"><\/a>6.3 资格切换与长期（建议）<\/h3>\n<ol>\n<li><strong>Y2 内达 N2<\/strong>；<strong>Y2–Y3 争取运行管理 / 配车计划 / 仓配企划岗位<\/strong>并留档职务内容。<\/li>\n<li><strong>Y4 前提交技人国变更<\/strong>（最晚），留出审查缓冲；转岗失败则 10 年连续性中断（推断）。<\/li>\n<li><strong>高度专门职<\/strong>仅作旁路：Y7 前后若年收达约 600–700 万日元并取得 N1，可接近 70 分（推断）。<\/li>\n<\/ol>\n<h3 id=\"64\"><a id=\"64-永住与家庭建议\" aria-hidden=\"true\"><\/a>6.4 永住与家庭（建议）<\/h3>\n<ol>\n<li>每年归档源泉征收票、住民税课税（非课税）证明书、纳税证明书——既是永住证据链，也是家族滞在的扶养能力证明。<\/li>\n<li>带同时点宜与技人国转岗涨薪联动，在 Y5 后、永住申请前 2–3 年完成，避免临申请时世帯人数骤增。<\/li>\n<li>配偶就业前申请资格外活動許可（包括许可，周 28 小时）。<\/li>\n<\/ol>\n<h3 id=\"65\"><a id=\"65-育成就劳选择建议\" aria-hidden=\"true\"><\/a>6.5 育成就劳选择（建议）<\/h3>\n<p>已有 N4 + 驾照者直接走 1 号更优；日语 / 技能暂不达标者可评估育成就劳「预备校」路径；已持技能实习者关注 2027 年衔接措施。<\/p>\n<h2 id=\"s7\"><a id=\"七生效时间线\" aria-hidden=\"true\"><\/a>七、生效时间线<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">政策 / 事件<\/th>\n<th style=\"width:25%\">关键节点<\/th>\n<th style=\"width:25%\">日期<\/th>\n<th style=\"width:25%\">依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特定技能制度施行（入管法第 2 条の 5）<\/td>\n<td>1 号 / 2 号制度起步<\/td>\n<td>2019-04<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>自动车运送业加入 1 号对象<\/td>\n<td>本分野新设<\/td>\n<td>2024 年度<\/td>\n<td>ssw.go.jp<\/td>\n<\/tr>\n<tr>\n<td>改正法公布（育成就劳）<\/td>\n<td>技能实习 → 育成就劳<\/td>\n<td>2024-06-21<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>阁议决定<\/td>\n<td>受入上限 22,100；2 号日语 B1<\/td>\n<td>2026-01-23<\/td>\n<td>moj.go.jp<\/td>\n<\/tr>\n<tr>\n<td>监理支援机关许可申请受理开始<\/td>\n<td>育成就劳准备<\/td>\n<td>2026-04-15<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>签证费调整<\/td>\n<td>单次 715 元<\/td>\n<td>2026-07-01<\/td>\n<td>领馆费用专页<\/td>\n<\/tr>\n<tr>\n<td>1 号支援体制要件改正公布<\/td>\n<td>2027-04-01 生效<\/td>\n<td>2026-07-28<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>育成就劳计划认定申请受理开始<\/td>\n<td>育成就劳准备<\/td>\n<td>2026-09-01<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>永住许可指南改定<\/td>\n<td>2027-04-01 起申请适用<\/td>\n<td>2026-10-01<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>育成就劳运用要领新增分野<\/td>\n<td>飲食料品・資源循環；改正 鉄道・木材産業<\/td>\n<td>2026-10-09<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>育成就劳运用要领新增 宿泊<\/td>\n<td>—<\/td>\n<td>2026-10-16<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>育成就劳运用要领新增 漁業<\/td>\n<td>—<\/td>\n<td>2026-11-06<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>育成就労 MOC 页面更新<\/td>\n<td>ISA 7 国 / OTIT 16 国，均不含中国<\/td>\n<td>2026-11-12<\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td><strong>育成就劳制度施行<\/strong><\/td>\n<td>技能实习法废止；1 号支援体制要件改正生效；出租车·巴士 B1 适用于 COE 申请<\/td>\n<td><strong>2027-04-01<\/strong><\/td>\n<td>ISA<\/td>\n<\/tr>\n<tr>\n<td>受入上限到期<\/td>\n<td>22,100 人上限适用届满<\/td>\n<td>2029-03 末<\/td>\n<td>moj.go.jp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待生效与待细则清单<\/strong>：B1 要求的在留资格变更·更新适用时间（待公告）；自动车运送业育成就劳运用要领（未公布）；2026-10-09 要領別冊 新旧对照表（001472544.pdf，未取得）；2029-03 上限到期后的政策延续；中国 MOC 签署情况。<\/p>\n<h2 id=\"s8\"><a id=\"八数据治理与局限\" aria-hidden=\"true\"><\/a>八、数据治理与局限<\/h2>\n<p><strong>来源分级<\/strong>：<\/p>\n<ul>\n<li><strong>A 官方一手<\/strong>：出入国在留管理庁（isa.go.jp / moj.go.jp）、ssw.go.jp、e-Gov 法令检索、国土交通省。<\/li>\n<li><strong>B 权威转引 / 行业机构<\/strong>：JFT-Basic（国際交流基金 / Prometric）、JLPT（JEES）、外国人技能実習機構（otit.go.jp）、全日本トラック協会、登录支援机关行业信息。<\/li>\n<li><strong>C 平台抽样<\/strong>：本主题登记册无此类指标；媒体来源（NHK、日本経済新聞、Nikkei Asia）仅用于发现线索，中文来源仅作线索、引用须回溯日 / 英原文。<\/li>\n<\/ul>\n<p><strong>已知口径冲突<\/strong>（并列呈现，不合并、不取均值）：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>受入上限<\/td>\n<td>22,100（现行，moj.go.jp）≠ 24,500（ssw.go.jp 中文页未同步）<\/td>\n<\/tr>\n<tr>\n<td>MOC 国家<\/td>\n<td>ISA MOC 页（7 国）≠ OTIT 認定送出機関一览（16 国，含暂定）<\/td>\n<\/tr>\n<tr>\n<td>2 号分野<\/td>\n<td>11 分野（不含自动车运送业）≠ 16 分野（旧口径）<\/td>\n<\/tr>\n<tr>\n<td>家族滞在<\/td>\n<td>扶养人资格范围 ≠ 收入证明口径（年收门槛无官方数值）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>待复核清单<\/strong>（逐项给出复核入口）：<\/p>\n<ol>\n<li>家族滞在扶养人<strong>年收门槛<\/strong>——复核入口：ISA「家族滞在」页 <a href=\"https://www.moj.go.jp/isa/applications/status/dependent\">https://www.moj.go.jp/isa/applications/status/dependent<\/a>，及行政书士实务资料。<\/li>\n<li>特定技能 <strong>1 号带同例外<\/strong>（同等要件相当者等）适用细则——复核入口：ISA 公告与审查要领。<\/li>\n<li>永住指南「<strong>年収水準<\/strong>」按世帯人数的具体数值运用实例——复核入口：ISA 永住许可指南页 <a href=\"https://www.moj.go.jp/isa/10_00279.html\">https://www.moj.go.jp/isa/10_00279.html<\/a>。<\/li>\n<li><strong>2026-10-09 要領別冊 新旧对照表<\/strong>（001472544.pdf）未取得——复核入口：ISA 要領別冊改正页 <a href=\"https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_00201.html\">https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_00201.html<\/a>。<\/li>\n<li><strong>B1 变更·更新适用时间<\/strong>——复核入口：ISA 日语要求页 <a href=\"https://www.moj.go.jp/isa/03_00198.html\">https://www.moj.go.jp/isa/03_00198.html<\/a>。<\/li>\n<li><strong>自动车运送业育成就劳运用要领<\/strong>——复核入口：ISA 育成就劳页 <a href=\"https://www.moj.go.jp/isa/applications/index_00005.html\">https://www.moj.go.jp/isa/applications/index_00005.html<\/a>。<\/li>\n<li><strong>ssw.go.jp 中文页 24,500 更正<\/strong>——复核入口：<a href=\"https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/\">https://www.ssw.go.jp/cn/about/visa/automobile_transportation_business_1/<\/a>（月度检查）。<\/li>\n<li><strong>2029-03 上限到期后延续<\/strong>、中国 MOC 签署、ISA / OTIT 更新时差——复核入口：moj.go.jp / 国交省公告、ISA MOC 页。<\/li>\n<\/ol>\n<p><strong>文本时效声明<\/strong>：本报告以 <strong>2026-11-14<\/strong> 时点官方页面为准；历史报告信息核对日期为 2026-11-11 / 11-12，日本官方制度更新频繁，执行前务必以 ISA 官网最新公告为准。<\/p>\n<p><strong>解读局限<\/strong>：本主题只写制度要点与流程，法规条文深度解读归 <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>；永住年收财务与证据链归 <a href=\"../../07-economy-finance/reports/2026-11-economy-finance.md\">07-economy-finance<\/a>；考试学习计划归 <a href=\"../../11-language-japanese/reports/2026-11-language-japanese.md\">11-language-japanese<\/a>。<\/p>\n<h2 id=\"s9\"><a id=\"九参考来源清单\" aria-hidden=\"true\"><\/a>九、参考来源清单<\/h2>\n<p><strong>官方一手（出入国在留管理庁 / 法务省 / ssw.go.jp / 国土交通省 / 领馆）<\/strong>：<\/p>\n<ol>\n<li>ISA 特定技能制度总页 <a href=\"https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html\">https://www.moj.go.jp/isa/applications/status/specifiedskilledworker.html<\/a><\/li>\n<li>ISA 自动车运送业分野运用方针 <a href=\"https://www.moj.go.jp/isa/policies/ssw/automobiletransportation\">https://www.moj.go.jp/isa/policies/ssw/automobiletransportation<\/a><\/li>\n<li>ISA 特定技能更新情报 <a href=\"https://www.moj.go.jp/isa/applications/ssw/\">https://www.moj.go.jp/isa/applications/ssw/<\/a>；要領別冊改正 <a href=\"https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_00201.html\">https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_00201.html<\/a><\/li>\n<li>ISA 统计月报（2026-08 末速报）<a href=\"https://www.moj.go.jp/isa/content
