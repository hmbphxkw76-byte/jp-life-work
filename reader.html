<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jp-life-work · 报告阅读器</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#15202b; --ink2:#465667; --ink3:#6d7c8c;
  --line:#e1e7ee; --line2:#eef2f6;
  --navy:#16324f; --navy2:#2f5597; --blue:#3f6fb0; --blue-l:#eaf1fa;
  --green:#1c7444; --green-l:#eaf5ef;
  --amber:#9a6a12; --amber-l:#fdf4e2;
  --red:#a33a3a; --red-l:#fbecec;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,70,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14.5px}
a{color:var(--navy2);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}

/* ── 布局 ── */
.reader{display:flex;min-height:100vh;align-items:flex-start}
.rd-sidebar{width:280px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);background:#fbfcfe;padding:14px 10px 40px}
.rd-sidebar::-webkit-scrollbar{width:6px}
.rd-sidebar::-webkit-scrollbar-thumb{background:#d3dce6;border-radius:3px}
.rd-brand{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.rd-brand .logo{width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(128deg,#0f2338,#2f5597);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700}
.rd-brand .name{font-size:13px;font-weight:700;color:var(--navy);line-height:1.35}
.rd-brand .sub{font-size:10.5px;color:var(--ink3);font-weight:400}
.rd-toc{display:flex;flex-direction:column;gap:2px}
.rd-toc a{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--ink2);
  padding:5px 8px;border-radius:6px;line-height:1.4}
.rd-toc a:hover{background:var(--blue-l);text-decoration:none}
.rd-toc a.active{background:var(--blue-l);color:var(--navy);font-weight:700}
.rd-toc .num{font-size:10.5px;color:var(--ink3);flex:none}
.rd-toc .cnt{margin-left:auto;font-size:10.5px;color:var(--ink3);flex:none}

.rd-main{flex:1;min-width:0;padding:18px 26px 70px;max-width:1180px}

/* ── 报告头 ── */
.rd-head{position:sticky;top:0;z-index:30;background:rgba(244,246,249,.95);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  margin:-18px -26px 16px;padding:14px 26px 10px}
.rd-head .crumb{font-size:11.5px;color:var(--ink3)}
.rd-head h1{font-size:21px;color:var(--navy);margin:2px 0 6px;line-height:1.4}
.rd-head .sum{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.rd-head .sum b{color:var(--navy)}
.rd-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rd-months{display:flex;flex-wrap:wrap;gap:6px}
.rd-month{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:3px 11px;cursor:pointer;color:var(--ink2);font-family:inherit}
.rd-month:hover{border-color:var(--blue)}
.rd-month.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.rd-month.old{opacity:.55}
.rd-toggle{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:4px 11px;cursor:pointer;color:var(--navy2);font-family:inherit}
.rd-toggle:hover{border-color:var(--blue)}

/* ── 图例 ── */
.rd-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink3);
  margin:0 0 12px}
.rd-legend .k{display:inline-flex;align-items:center;gap:5px}
.rd-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ── 报告正文（沿用 md2html 通用模板风格） ── */
.rd-body{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px 30px;box-shadow:var(--shadow);max-width:1160px}
.rd-body h1,.rd-body h2,.rd-body h3{color:#16213e}
.rd-body table{border-collapse:collapse;width:100%;overflow-x:auto;display:block;
  margin:10px 0;font-size:13px}
.rd-body th,.rd-body td{border:1px solid #cbd5e1;padding:6px 10px;text-align:left}
.rd-body th{background:#f1f5f9}
.rd-body img{max-width:100%}
.rd-body code{background:#f6f8fa;padding:2px 4px;border-radius:3px}
.rd-body blockquote{border-left:4px solid #94a3b8;margin:8px 0;
  padding-left:12px;color:#475569}
.rd-body pre{background:#f6f8fa;padding:10px;border-radius:6px;overflow-x:auto}
.rd-body pre code{background:none;padding:0}

/* ── 差异高亮 ── */
.diff-badge{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;
  border-radius:3px;padding:2px 6px;margin-right:6px;vertical-align:middle;
  white-space:nowrap}
.diff-block{border-radius:6px;padding:4px 8px;margin:4px -8px}
.diff-new{background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)}
.diff-new .diff-badge{background:var(--green);color:#fff}
.diff-mod{background:var(--amber-l);box-shadow:inset 3px 0 0 var(--amber)}
.diff-mod .diff-badge{background:var(--amber);color:#fff}
.diff-del-group{margin:6px 0;border:1px dashed var(--line);border-radius:6px;
  background:#fbfcfe}
.diff-del-group>summary{cursor:pointer;font-size:12px;color:var(--ink3);
  padding:6px 10px;user-select:none;list-style:none}
.diff-del-group>summary::-webkit-details-marker{display:none}
.diff-del-group>summary::before{content:"▸ ";color:var(--gray)}
.diff-del-group[open]>summary::before{content:"▾ "}
.diff-del-group .diff-del-body{padding:2px 8px 8px;color:var(--ink3)}
.diff-del-group .diff-del-body s,.diff-del-group .diff-del-body del{color:var(--red)}
.diff-del-group .diff-badge{background:var(--gray-l);color:var(--gray)}
/* 隐藏更新标记：对照阅读模式 */
.rd-body.hide-diff .diff-badge{display:none}
.rd-body.hide-diff .diff-block{background:none;box-shadow:none;padding:0;margin:0}
.rd-body.hide-diff .diff-del-group{display:none}

/* ── 空态 ── */
.rd-empty{padding:50px 20px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ── 响应式 ── */
@media (max-width: 960px){
  .reader{flex-direction:column}
  .rd-sidebar{position:static;width:100%;height:auto;max-height:240px;border-right:0;
    border-bottom:1px solid var(--line)}
  .rd-main{padding:14px 14px 50px}
  .rd-head{margin:-14px -14px 14px;padding:12px 14px 8px}
  .rd-body{padding:16px}
}
</style>
</head>
<body>
<div class="reader">
  <aside class="rd-sidebar">
    <div class="rd-brand">
      <div class="logo">报</div>
      <div class="name">日本生活与工作 · 报告阅读器</div>
      <div class="sub">月度报告 · 跨月对比高亮</div>
    </div>
    <nav class="rd-toc" id="rd-toc"></nav>
  </aside>
  <main class="rd-main">
    <div class="rd-head" id="rd-head"></div>
    <div class="rd-legend">
      <span class="k"><span class="sw" style="background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)"></span>已更新 · 新增</span>
      <span class="k"><span class="sw" style="background:var(--amber-l);box-shadow:inset 3px 0 0 var(--amber)"></span>已更新 · 修改</span>
      <span class="k"><span class="sw" style="background:var(--gray-l)"></span>已更新 · 删除（折叠，可展开）</span>
      <span class="k">未变更内容保持原样</span>
    </div>
    <div class="rd-body" id="rd-body"></div>
  </main>
</div>
<script id="report-data" type="application/json">{"decision-hub": {"name": "赴日决策仪表盘", "dir": "00-decision-hub", "months": {"2026-11": {"title": "赴日决策仪表盘 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"赴日决策仪表盘--2026-11-月度报告\" aria-hidden=\"true\"><\/a>赴日决策仪表盘 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 跨主题综合层\n<strong>受众定位<\/strong>：本人（拟通过特定技能签证赴日从事货运司机工作）的决策支持层\n<strong>来源规则<\/strong>：本主题不新增一手来源，全部结论引用 01–13 主题报告 / 登记册；每个结论附「（来源：主题 NN）」标注<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、执行摘要（五问结论速览）<\/a>\n<a href=\"#s2\">二、问题 1：去不去（值不值）<\/a>\n<a href=\"#s3\">三、问题 2：能不能去（门槛）<\/a>\n<a href=\"#s4\">四、问题 3：怎么去（路径）<\/a>\n<a href=\"#s5\">五、问题 4：去哪（定居地）<\/a>\n<a href=\"#s6\">六、问题 5：最坏怎么办（退出）<\/a>\n<a href=\"#s7\">七、暴露的缺失清单<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一执行摘要五问结论速览\" aria-hidden=\"true\"><\/a>一、执行摘要（五问结论速览）<\/h2>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">决策问题<\/th>\n<th style=\"width:20%\">结论<\/th>\n<th style=\"width:20%\">置信度<\/th>\n<th style=\"width:20%\">缺失<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>去不去（值不值）<\/td>\n<td>窗口已开、名额有限；收入高于全产业均值但绝对值偏低；自动驾驶暂不构成威胁<\/td>\n<td>事实 + 推断<\/td>\n<td>中国同岗到手对比<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>能不能去（门槛）<\/td>\n<td>门槛明确；驾照转换与中国大陆无考点是两大瓶颈<\/td>\n<td>事实<\/td>\n<td>驾照转换流程细节<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>怎么去（路径）<\/td>\n<td>路径清晰；中介风险与驾照耗时是关键变量<\/td>\n<td>事实 + 推断<\/td>\n<td>中介防骗、落地手续执行<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>去哪（定居地）<\/td>\n<td>有 7 维框架可用；个人选择未记录<\/td>\n<td>框架就绪<\/td>\n<td>个人定居地<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>最坏怎么办（退出）<\/td>\n<td>永住 / 归化路径存在；本分野不得 2 号；退出执行已由 16 接入<\/td>\n<td>部分事实<\/td>\n<td>退出执行金额 / 期限 / 要件<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>总体判读<\/strong>（条件化，非 Go/No-Go）：当前处于「窗口已开、门槛明确、路径清晰」阶段，主要不确定性集中在<strong>驾照转换成功率<\/strong>与<strong>落地执行层<\/strong>。若驾照能在窗口期内取得，且中介渠道可核验，则进入条件基本成立；反之应暂缓或做条件化安排。<\/p>\n<p><strong>五问间关系<\/strong>：问题 1 决定「值不值得考虑」；问题 2 决定「有没有资格」；问题 3 决定「怎么落地」；问题 4 决定「在哪里生活」；问题 5 决定「最坏情况的兜底」。前五问任一为「否 / 不确定」时，决策应暂缓或做条件化安排。<\/p>\n<h3 id=\"0113\"><a id=\"来源主题结论索引0113\" aria-hidden=\"true\"><\/a>来源主题结论索引（01–13）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">主题<\/th>\n<th style=\"width:33%\">本期关键结论<\/th>\n<th style=\"width:34%\">对应问题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01-ssw-driver<\/td>\n<td>受入上限 22,100；在留 843 人、充足率 3.8%；求人倍率 2.56；运输业月均现金给与 341,158 円；缺口 14%/34% 与 7%/25% 并列<\/td>\n<td>1 / 2 / 3<\/td>\n<\/tr>\n<tr>\n<td>02-career-driver<\/td>\n<td>薪资须区分含赏与 / 不含赏与；时间外上限月 45h / 年 360h；特定技能专门中介 / 登录支援机关为主渠道<\/td>\n<td>1 / 3<\/td>\n<\/tr>\n<tr>\n<td>03-career-management<\/td>\n<td>管理岗过渡主线为内部升格；资格 ≠ 岗位；48 个月分年计划<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>04-industry-logistics<\/td>\n<td>「少数大手 + 海量零细」二元结构；自动化「干线先于末端、岗位重组而非消失」；SPPI 道路貨物 +4.6%<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>05-industry-autonomous<\/td>\n<td>L4 制度化起步；2027 年度前对求职者实质就业影响约等于 0（推断）；中继输送催生新岗位<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>06-industry-technology<\/td>\n<td>IT 人才缺口中位 2030 年约 45 万；数字化岗位薪资带高于物流同业；公司内转岗为首选<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>07-economy-finance<\/td>\n<td>运输业月均 341,158 円；最低賃金 1,177 円；100 日元中间价 4.2355 元；CPI / 社保负担率待基线<\/td>\n<td>1 / 4 / 5<\/td>\n<\/tr>\n<tr>\n<td>08-visa-immigration<\/td>\n<td>本分野不得 2 号；永住要件令和 8-10-01 改定；育成就劳 2027-04-01 施行、MOC 不含中国<\/td>\n<td>2 / 5<\/td>\n<\/tr>\n<tr>\n<td>09-politics-law<\/td>\n<td>8 部法律栈；个人必熟 Top 5 条款；劳动纠纷维权五级阶梯<\/td>\n<td>3 / 5<\/td>\n<\/tr>\n<tr>\n<td>10-education-qualification<\/td>\n<td>外免切替 2025-10 起严格化；教习所费用行情；资格地图待基线<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>11-language-japanese<\/td>\n<td>中国大陆无 JFT-Basic 考点，主攻 JLPT N4（2027-07 目标）<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>12-culture-life<\/td>\n<td>健保 / 国保两条轨道；窗口自付 3 割；UR 收入基准已确立；多语言防灾渠道<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>13-regional-info<\/td>\n<td>7 维评分框架；病床 879,728；日语指导 84,759 / 外国籍 73,313；个人定居地待记录<\/td>\n<td>4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s2\"><a id=\"二问题-1去不去值不值\" aria-hidden=\"true\"><\/a>二、问题 1：去不去（值不值）<\/h2>\n<h3 id=\"21\"><a id=\"21-收入面\" aria-hidden=\"true\"><\/a>2.1 收入面<\/h3>\n<ul>\n<li>运输业·邮政业月均现金给与总额 <strong>341,158 円<\/strong>（+4.9%，2026-09，2026-11-06 公布；全产业对照 311,409 円、+4.6%）（来源：01 · 厚労省毎月勤労統計）。<\/li>\n<li>全ト协 2025 年度版：男性大型司机月薪 <strong>39.5 万円<\/strong>（+4%）、全职务平均 <strong>35.98 万円<\/strong>（+5.3%）、含奖金 <strong>41.64 万円<\/strong>（+7.1%）（经 LogiShift 转引，原件待复核）（来源：01 · B/C 级）。<\/li>\n<li>求人抽样：东京圈 <strong>22–45 万円<\/strong> / 大阪圈 <strong>28–40.5 万円<\/strong> / 地方 <strong>25–36 万円<\/strong>（聚合平台转载，C 级，原企业页未逐一回溯）（来源：01 · 9 样本）。<\/li>\n<li>生活成本：单身·地方都市月度成本模型 <strong>10.5–17.0 万円/月<\/strong>（常见 12–14 万，手册估算，待核验）；100 日元中间价 <strong>4.2355 元<\/strong>（2026-11-10）（来源：07 · 登记册 / 手册估算）。<\/li>\n<\/ul>\n<h3 id=\"22\"><a id=\"22-缺口与窗口期\" aria-hidden=\"true\"><\/a>2.2 缺口与窗口期<\/h3>\n<ul>\n<li>有效求人倍率 <strong>2.56<\/strong>（2026-09，常用含パート，2026-10-30 公布；全产业 1.06）（来源：01 · 厚労省）。<\/li>\n<li>司机缺口（并列口径）：现状 <strong>14%<\/strong> / 2030 年 <strong>34%<\/strong>（政策包示意图）≠ 2030 年度平均约 <strong>7%<\/strong> / 最大约 <strong>25%<\/strong>（MLIT 再检证）（来源：01 · 并列不可合并）。<\/li>\n<li>受入上限 <strong>22,100 人<\/strong>（2026-01-23 阁议，现行）；在留者 843 人、充足率 <strong>3.8%<\/strong>（2026-08 末）（来源：01 · ISA）。<\/li>\n<\/ul>\n<h3 id=\"23\"><a id=\"23-行业可持续性\" aria-hidden=\"true\"><\/a>2.3 行业可持续性<\/h3>\n<ul>\n<li>运賃：日銀 SPPI「道路貨物輸送」<strong>+4.6%<\/strong>（2026-09 速報）；标准运賃 +8%（令和 6 年告示第 209 号）；价格转嫁率 24.2% → <strong>34.7%<\/strong>（2023-09 → 2025-09）（来源：04 / 01）。<\/li>\n<li>倒産：TSR 2026-10 運輸業 <strong>38 件<\/strong>（+2.7%，连续 2 个月增）、人手不足関連 <strong>50 件<\/strong>（来源：04 · TSR / TDB）。<\/li>\n<li>自动化：截至 2026-02 全国 <strong>10 カ所<\/strong>实现 L4 社会实装；2027 年度前对求职者实质就业影响约等于 0（推断）（来源：05）。<\/li>\n<\/ul>\n<h3 id=\"24\"><a id=\"24-判读\" aria-hidden=\"true\"><\/a>2.4 判读<\/h3>\n<p><strong>事实<\/strong>：窗口已开（充足率 3.8%、求人倍率 2.56），但名额口径存在 22,100 / 24,500 两组官方数字并存（来源：01 待复核）。收入高于全产业均值，但司机绝对收入仍偏低。\n<strong>推断<\/strong>：缺口与运賃传导决定雇主付费意愿，窗口期长度取决于缺口修正节奏；自动驾驶在 2027 年度前不构成实质就业威胁。\n<strong>⚠ 缺失<\/strong>：中国同岗到手收入对比（01 待复核）；生活成本细目（07 / 13 部分覆盖）。<\/p>\n<hr />\n<h2 id=\"s3\"><a id=\"三问题-2能不能去门槛\" aria-hidden=\"true\"><\/a>三、问题 2：能不能去（门槛）<\/h2>\n<h3 id=\"31\"><a id=\"31-在留资格要件\" aria-hidden=\"true\"><\/a>3.1 在留资格要件<\/h3>\n<ul>\n<li>特定技能 1 号「自動車運送業」分野；受入上限 <strong>22,100<\/strong>；<strong>本分野不得 2 号<\/strong>（来源：08 / 01 · ISA / MLIT）。<\/li>\n<li>卡车 A2.2 不变；出租车 / 巴士区分 <strong>2027-04-01 起 COE 申请须 B1 相当以上<\/strong>（JLPT N3 以上 + CEFR B1 判定）（来源：01 · 令和 8 年 10 月 9 日改正）。<\/li>\n<li>无健康检查义务、仅適性診断（来源：01）。<\/li>\n<\/ul>\n<h3 id=\"32\"><a id=\"32-考试与考场\" aria-hidden=\"true\"><\/a>3.2 考试与考场<\/h3>\n<ul>\n<li>ClassNK 技能試験 <strong>6,500 円<\/strong>（US$45、越南 US$50）、证明书 <strong>15,000 円<\/strong>；JFT-Basic <strong>10,000 円<\/strong>；JLPT N4 <strong>450 元<\/strong>（来源：01 · ClassNK / Prometric / JLPT）。<\/li>\n<li>实施国 18，<strong>中国大陆无考点<\/strong>；中国考生实际路径为赴第三国考试或在日本国内受验（来源：01 · 2026-09 月报）。<\/li>\n<li>日语路径：中国大陆无 JFT-Basic 考点，主攻 <strong>JLPT N4<\/strong>（目标 2027-07；每年 7 月 / 12 月两次）（来源：11）。<\/li>\n<\/ul>\n<h3 id=\"33\"><a id=\"33-驾照转换\" aria-hidden=\"true\"><\/a>3.3 驾照转换<\/h3>\n<ul>\n<li>外免切替 <strong>2025-10 起大幅严格化<\/strong>：知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025-10–12，警察庁，经 drivey.jp 转引）（来源：10 / 01）。<\/li>\n<li>教习所费用：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09）；MT 通学 <strong>30–40 万円<\/strong>；大型 <strong>25–28 万円<\/strong>（来源：10 / 01）。<\/li>\n<\/ul>\n<h3 id=\"34\"><a id=\"34-判读\" aria-hidden=\"true\"><\/a>3.4 判读<\/h3>\n<p><strong>事实<\/strong>：门槛明确，由「在留要件 + 考试 + 驾照 + 日语」四关构成；其中<strong>驾照转换成功率低<\/strong>（技能确认 13.1%）与<strong>中国大陆无考点<\/strong>是两大瓶颈。\n<strong>推断<\/strong>：若中国驾照无法顺利转换，需预留 30–40 万円教习所预算与 6–12 个月时间；考试需规划赴第三国或赴日受验行程。\n<strong>⚠ 缺失<\/strong>：驾照转换的具体流程、书类、耗时细节（10 部分覆盖，待补专题）。<\/p>\n<hr />\n<h2 id=\"s4\"><a id=\"四问题-3怎么去路径\" aria-hidden=\"true\"><\/a>四、问题 3：怎么去（路径）<\/h2>\n<h3 id=\"41\"><a id=\"41-申请路径与时间线\" aria-hidden=\"true\"><\/a>4.1 申请路径与时间线<\/h3>\n<ul>\n<li>海外申请者先以「特定活动」（特定自动车运送业准备）入境（2025-02-17 起；卡车最长 <strong>6 个月<\/strong>）；未取得日本驾照则不能转入特定技能 1 号（来源：01 · ISA）。<\/li>\n<li>COE 手续费免费、标准审查 <strong>1–3 个月<\/strong>（来源：01 / 08 · ISA）。<\/li>\n<\/ul>\n<h3 id=\"42\"><a id=\"42-中介与费用\" aria-hidden=\"true\"><\/a>4.2 中介与费用<\/h3>\n<ul>\n<li>招募必须走<strong>商务部资质对外劳务合作企业<\/strong> + 日方送出机关体系；无资质出国务工属违法（来源：01 · 商务部 2024）。<\/li>\n<li>签证费：円建约 <strong>15,000 円<\/strong>（单次）/ <strong>30,000 円<\/strong>（多次）；驻日领馆人民币口径 <strong>715 元<\/strong>（一次）/ <strong>1,430 元<\/strong>（二次・数次），上海 / 青岛 / 重庆三馆一致（来源：01 / 08）。<\/li>\n<li>登录支援机关：行情 <strong>2–4 万円/人·月<\/strong>；登录费 <strong>28,400 円<\/strong>；支援体制要件改正 <strong>2027-04-01 施行<\/strong>（来源：01）。<\/li>\n<\/ul>\n<h3 id=\"43-90\"><a id=\"43-落地-90-天执行清单配套件\" aria-hidden=\"true\"><\/a>4.3 落地 90 天执行清单（配套件）<\/h3>\n<blockquote>\n<p>本节为 00 的<strong>执行层配套件<\/strong>，把「问题 3：怎么去」与「问题 4：去哪」收敛成可执行的时间线。⚠ 待补研究项表示该步骤的事实尚未被 01–13 系统覆盖，需由 14-life-operations 等专题补齐。<\/p>\n<\/blockquote>\n<p><strong>时间线总览<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">阶段<\/th>\n<th style=\"width:25%\">窗口<\/th>\n<th style=\"width:25%\">核心目标<\/th>\n<th style=\"width:25%\">关键瓶颈<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>阶段 0 · 国内准备<\/td>\n<td>赴日前 6–12 个月<\/td>\n<td>日语 / 考试 / 驾照 / 中介<\/td>\n<td>考试考点、驾照转换<\/td>\n<\/tr>\n<tr>\n<td>阶段 1 · 在留资格申请<\/td>\n<td>赴日前 3–6 个月<\/td>\n<td>COE 申请与审查<\/td>\n<td>中介资质、书类<\/td>\n<\/tr>\n<tr>\n<td>阶段 2 · 赴日与落地<\/td>\n<td>抵达后 0–90 天<\/td>\n<td>住民登记 / 银行 / 手机 / 保险 / 驾照<\/td>\n<td>手续执行<\/td>\n<\/tr>\n<tr>\n<td>阶段 3 · 上岗与稳定<\/td>\n<td>90 天后<\/td>\n<td>上岗 / 永住 / 家属<\/td>\n<td>职场适应<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>阶段 0 · 国内准备（赴日前 6–12 个月）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">事项<\/th>\n<th style=\"width:20%\">关键事实<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0.1<\/td>\n<td>日语学习启动<\/td>\n<td>JLPT 每年 7 月 / 12 月两次；JFT-Basic 为 SSW 路径主考试<\/td>\n<td>01 / 11<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.2<\/td>\n<td>日语考试报名<\/td>\n<td>JLPT N4 450 元；JFT-Basic 10,000 円；<strong>中国大陆无 SSW 考点<\/strong>，需赴第三国或赴日受验<\/td>\n<td>01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.3<\/td>\n<td>技能試験报名<\/td>\n<td>ClassNK 技能試験 6,500 円、证明书 15,000 円<\/td>\n<td>01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.4<\/td>\n<td>驾照转换评估<\/td>\n<td>外免切替 2025-10 起严格化（知识确认 42.8% / 技能确认 13.1%）；需先确认中国驾照类别与日本对应关系<\/td>\n<td>10 / 01<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.5<\/td>\n<td>教习所预算<\/td>\n<td>普通 AT 官方均价 324,381 円；MT 通学 30–40 万円；大型 25–28 万円<\/td>\n<td>10 / 01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.6<\/td>\n<td>中介核验<\/td>\n<td>只走<strong>商务部资质对外劳务合作企业<\/strong>名单；核验日方受入机关与送出机关<\/td>\n<td>01<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>0.7<\/td>\n<td>资金准备<\/td>\n<td>初期费用（签证 / 机票 / 押金礼金 / 生活费储备）需专项测算<\/td>\n<td>—<\/td>\n<td>⚠ 待补研究<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>阶段 1 · 在留资格申请（赴日前 3–6 个月）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">事项<\/th>\n<th style=\"width:20%\">关键事实<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.1<\/td>\n<td>COE 申请<\/td>\n<td>手续费免费、标准审查 1–3 个月<\/td>\n<td>01 / 08<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>1.2<\/td>\n<td>特定活动入境<\/td>\n<td>2025-02-17 起可先以「特定活动」（准备）入境，卡车最长 6 个月<\/td>\n<td>01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>1.3<\/td>\n<td>签证费<\/td>\n<td>单次约 15,000 円 / 多次约 30,000 円；领馆人民币 715 元 / 1,430 元<\/td>\n<td>01 / 08<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>1.4<\/td>\n<td>登录支援机关<\/td>\n<td>行情 2–4 万円/人·月；登录费 28,400 円；支援体制要件改正 2027-04-01 施行<\/td>\n<td>01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>1.5<\/td>\n<td>在留资格变更<\/td>\n<td>未取得日本驾照则不能转入特定技能 1 号<\/td>\n<td>01<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>阶段 2 · 赴日与落地（0–90 天）<\/strong><\/p>\n<blockquote>\n<p>⚠ 本阶段为<strong>最大信息差区域<\/strong>：01–13 未系统覆盖落地手续执行层。以下步骤为框架，事实细节待 14-life-operations 补齐。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">事项<\/th>\n<th style=\"width:20%\">关键事实<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2.1<\/td>\n<td>在留卡领取<\/td>\n<td>抵达后 14 日内在机场 / 市区町村完成在留卡登记<\/td>\n<td>08<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.2<\/td>\n<td>住民登记（転入届）<\/td>\n<td>迁入新住所后 14 日内向新自治体申报<\/td>\n<td>08 / 12<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.3<\/td>\n<td>国民健康保険加入<\/td>\n<td>加入后自付比例通常三成<\/td>\n<td>08 / 12 / 15<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.4<\/td>\n<td>年金加入<\/td>\n<td>国民年金 / 厚生年金区分<\/td>\n<td>07<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.5<\/td>\n<td>银行口座开设<\/td>\n<td>外国人开户条件（在留期间 / 住所 / 印鉴）<\/td>\n<td>14<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.6<\/td>\n<td>手机 / 网络契约<\/td>\n<td>运营商选择（docomo / au / softbank / 格安SIM）、光回线<\/td>\n<td>14<\/td>\n<td>⚠ 待补研究<\/td>\n<\/tr>\n<tr>\n<td>2.7<\/td>\n<td>水电燃气开通<\/td>\n<td>上下水道 / 電気 / ガス 使用开始手续<\/td>\n<td>12 / 13 / 14<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.8<\/td>\n<td>住房签约<\/td>\n<td>賃貸借契約、敷金 / 礼金 / 更新料、保证人 / 保证会社<\/td>\n<td>12 / 14<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.9<\/td>\n<td>垃圾与町内会<\/td>\n<td>ゴミ出し分类、町内会加入<\/td>\n<td>12<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.10<\/td>\n<td>驾照转换 / 教习<\/td>\n<td>外免切替或合宿 / 通学；费用与耗时<\/td>\n<td>10 / 01<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.11<\/td>\n<td>特定技能 1 号变更<\/td>\n<td>取得驾照后申请在留资格变更<\/td>\n<td>01 / 08<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>2.12<\/td>\n<td>紧急联络与防灾<\/td>\n<td>避難所、自治体防灾邮件 / LINE 登录<\/td>\n<td>12 / 13<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>阶段 3 · 上岗与稳定（90 天后）<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">事项<\/th>\n<th style=\"width:20%\">关键事实<\/th>\n<th style=\"width:20%\">来源<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3.1<\/td>\n<td>上岗<\/td>\n<td>运行管理者 / 安全驾驶管理者等资格<\/td>\n<td>01 / 02 / 03<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>3.2<\/td>\n<td>税务申报<\/td>\n<td>確定申告 / 年末調整<\/td>\n<td>07<\/td>\n<td>已覆盖<\/td>\n<\/tr>\n<tr>\n<td>3.3<\/td>\n<td>永住 / 归化评估<\/td>\n<td>本分野不得 2 号；永住须经其他在留资格转接<\/td>\n<td>08<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>3.4<\/td>\n<td>家属安排<\/td>\n<td>家族滞在、保育 / 学校<\/td>\n<td>08 / 10<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<tr>\n<td>3.5<\/td>\n<td>退出预案<\/td>\n<td>转职 / 永住 / 回国路径与年金衔接<\/td>\n<td>16 / 08 / 07<\/td>\n<td>部分覆盖<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>常见坑与答疑<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">常见问题<\/th>\n<th style=\"width:50%\">解答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>刚抵达没有日本手机号，能办手续吗？<\/td>\n<td>住民登记、健康保険可凭在留卡与护照办理；手机契约通常需在留卡与银行账户<\/td>\n<\/tr>\n<tr>\n<td>没有在日保证人能租房吗？<\/td>\n<td>可通过保证会社；部分物件标注「保証人不要」<\/td>\n<\/tr>\n<tr>\n<td>银行开户被拒怎么办？<\/td>\n<td>改用邮局银行（ゆうちょ銀行）或外国人友好银行；先确认在留期限门槛<\/td>\n<\/tr>\n<tr>\n<td>水电燃气怎么开通？<\/td>\n<td>通过网络或电话申请，通常需 1–2 周；旧地址需办理解约<\/td>\n<\/tr>\n<tr>\n<td>不会日语能看病吗？<\/td>\n<td>都市圈大型医院较多语言对应；地方需提前确认或带翻译（见 15）<\/td>\n<\/tr>\n<tr>\n<td>在留卡遗失怎么办？<\/td>\n<td>14 日内向入管局申请再交付；卡片有 IC 芯片可补办<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"44\"><a id=\"44-判读\" aria-hidden=\"true\"><\/a>4.4 判读<\/h3>\n<p><strong>事实<\/strong>：路径链条为「中介 → 特定活动入境 → 考试 → 驾照 → 特定技能 1 号」，关键耗时在驾照与考试。\n<strong>推断<\/strong>：中介是最大风险变量——无资质渠道属违法，且存在虚假招募与收费陷阱风险；建议只走商务部名单内企业，并逐一核验日方受入机关。\n<strong>⚠ 缺失<\/strong>：中介防骗专题（未建）；落地手续执行清单细目（14 基线已建，消费入口待登记册回写）。<\/p>\n<hr />\n<h2 id=\"s5\"><a id=\"五问题-4去哪定居地\" aria-hidden=\"true\"><\/a>五、问题 4：去哪（定居地）<\/h2>\n<h3 id=\"51\"><a id=\"51-选择框架\" aria-hidden=\"true\"><\/a>5.1 选择框架<\/h3>\n<ul>\n<li>13 提供 <strong>7 维评分框架<\/strong>（交通 / 买东西 / 医疗 / 治安 / 教育 / 灾害 / 生活成本）与候选地域速览（来源：13）。<\/li>\n<li>家賃相场、医療機関、災害リスク、住みやすさ、気候为地域比较的五个关键面（来源：13 · 登记册）。<\/li>\n<li>决策流程：Offer 阶段用 7 维框架打分（≥3.5 考虑）；入职前读该自治体「外国人生活ガイド」；落地 1 个月后实际体验 vs 预期复盘（来源：13）。<\/li>\n<li>地域差证据：病院一般病床 <strong>879,728 床<\/strong>（厚生労働省 令和 6 年医療施設調査，2024-10-01）；日本語指導が必要な児童生徒 <strong>84,759 人<\/strong>、其中外国籍 <strong>73,313 人<\/strong>（文部科学省，令和 7 年度）（来源：13）。<\/li>\n<\/ul>\n<h3 id=\"52\"><a id=\"52-生活成本与住房\" aria-hidden=\"true\"><\/a>5.2 生活成本与住房<\/h3>\n<ul>\n<li>住房初期费用含敷金 / 礼金 / 仲介手数料 / 保证会社 / 更新料，合计可达 <strong>4–8 个月<\/strong>房租（来源：14 / 12）。<\/li>\n<li>UR 賃貸住宅收入基准（2026-11-12 核实）：家賃 62,500 円未満 → 基准月收 = 家賃 4 倍；62,500–200,000 円 → 25 万円；200,000 円以上 → 40 万円；存款基准 = 家賃 100 倍可替代收入基准（来源：12）。<\/li>\n<li>生活成本模型：10.5–17.0 万円/月（手册估算，待核验）；100 日元中间价 4.2355 元（2026-11-10）（来源：07）。<\/li>\n<li>多语言防灾情报：气象厅多语言版、防災庁、NHK WORLD-JAPAN 多语言链接可访问；自治体防灾邮件 / LINE 具体渠道待定居地确定后复核（来源：13）。<\/li>\n<\/ul>\n<h3 id=\"53\"><a id=\"53-定居地档案个人记录模板\" aria-hidden=\"true\"><\/a>5.3 定居地档案（个人记录模板）<\/h3>\n<blockquote>\n<p>本档案是 00 的<strong>个人记录件<\/strong>，承载「问题 4：去哪」的答案。与 13-regional-info 的定居地档案模板同源；<strong>个人记录与事实分离<\/strong>，事实项须可回溯。确定居住地后复制改名填写。<\/p>\n<\/blockquote>\n<p><strong>一、基本信息<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">字段<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>城市 / 区<\/td>\n<td><\/td>\n<td>例：群马县太田市<\/td>\n<\/tr>\n<tr>\n<td>入住时间<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>房租 / 通勤<\/td>\n<td>房租： 円 / 月；通勤： 分<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>住房形态<\/td>\n<td><\/td>\n<td>アパート / マンション / 寮 / 一戸建て<\/td>\n<\/tr>\n<tr>\n<td>保证人 / 保证会社<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>二、行政与公共服务<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">字段<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自治体外籍支援窗口<\/td>\n<td><\/td>\n<td>多语言窗口地址 / 电话 / 营业时间<\/td>\n<\/tr>\n<tr>\n<td>住民票 / 在留卡地址<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>免费 / 低额日语教室<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>自治体防灾邮件 / LINE<\/td>\n<td><\/td>\n<td>登录日期 / 渠道<\/td>\n<\/tr>\n<tr>\n<td>避難所<\/td>\n<td><\/td>\n<td>最近避難所名称 / 距离<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>三、医疗<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">字段<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>かかりつけ病院<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>主要医院 / 夜间救急<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>歯科<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>精神科 / 心理支援<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>四、生活<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">字段<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>常用店（超市 / 药局 / 便利店）<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>公共交通（最近駅 / 路線 / IC卡）<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>银行 / 邮局<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>手机 / 网络<\/td>\n<td><\/td>\n<td>运营商 / 回路<\/td>\n<\/tr>\n<tr>\n<td>町内会 / 自治会<\/td>\n<td><\/td>\n<td>加入状态<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>五、防灾与安全<\/strong><\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:33%\">字段<\/th>\n<th style=\"width:33%\">内容<\/th>\n<th style=\"width:34%\">备注<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>灾害风险（地震 / 水害 / 土砂）<\/td>\n<td><\/td>\n<td>见 13 登记册「災害リスク」<\/td>\n<\/tr>\n<tr>\n<td>避難所 / 避難経路<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>防災セット / 備蓄<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>紧急联络方式<\/td>\n<td><\/td>\n<td>110 / 119 / 家属 / 公司<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"54\"><a id=\"54-判读\" aria-hidden=\"true\"><\/a>5.4 判读<\/h3>\n<p><strong>事实<\/strong>：框架与候选地域数据就绪，可作为选择依据。\n<strong>⚠ 缺失<\/strong>：<strong>个人定居地选择未记录<\/strong>——13 的定居地档案为空白模板，需在确定居住地后填写（含城市 / 区、入住时间、房租 / 通勤、自治体外籍支援窗口、免费日语教室、主要医院 / 夜间救急、常用店等字段）；登记册 #1–#3 活值待基线确立。<\/p>\n<hr />\n<h2 id=\"s6\"><a id=\"六问题-5最坏怎么办退出\" aria-hidden=\"true\"><\/a>六、问题 5：最坏怎么办（退出）<\/h2>\n<h3 id=\"61\"><a id=\"61-长期路径\" aria-hidden=\"true\"><\/a>6.1 长期路径<\/h3>\n<ul>\n<li>本分野<strong>不得 2 号<\/strong>；永住路径须经其他在留资格转接（来源：08 / 01）。<\/li>\n<li>永住 / 归化路径存在，但需满足居住年数、收入、纳税等要件；永住许可要件于<strong>令和 8-10-01 改定<\/strong>（2027-04-01 起申请适用）：世帯年収・年金受給見込・日本語 B1・制度理解（来源：08 · 登记册）。<\/li>\n<li>转职路径：司机 → 运行管理者 / 物流管理岗；管理岗过渡主线为内部升格（来源：02 / 03）。<\/li>\n<li>数字化转型：公司内 DX / 系统担当 ＞ 3PL 大手系统岗 ＞ 物流 SaaS 实施顾问（推断）；IT 人才缺口中位 2030 年约 45 万（来源：06）。<\/li>\n<\/ul>\n<h3 id=\"62-16\"><a id=\"62-退出执行层16-接入\" aria-hidden=\"true\"><\/a>6.2 退出执行层（16 接入）<\/h3>\n<ul>\n<li>16-exit-transition-return 已接入本主题（登记册 v1.1）：退出・转型・回国三段框架（退出：退職 / 雇用保険 / 健康保険任意継続 / 被用者保険退出 / 在留资格状态；转型：在留資格変更 / 特定活動 / 転職边界 / 2 号限制；回国：年金脱退执行 / 帰国前確定申告 / 在留卡 / 再入国 / 退室 / 通信・银行・车辆）。（来源：16 · 基线与初析）<\/li>\n<li>⚠ 具体书类、期限、金额与窗口多数标「⚠ 待核实」，待事件触发或年度复盘补齐（来源：16 · 登记册）。<\/li>\n<\/ul>\n<h3 id=\"63\"><a id=\"63-年金--保险衔接\" aria-hidden=\"true\"><\/a>6.3 年金 / 保险衔接<\/h3>\n<ul>\n<li>健康保険任意継続（被用者保险退职后继续）≠ 国民健康保険加入；厚生年金脱退一时金只研究申请执行，金额计算口径归 07（来源：16 / 07）。<\/li>\n<li>脱退后仍可能有住民税・年金后续纳付义务；对永住 / 归化的影响须结合 08 最新口径（来源：16 · 登记册）。<\/li>\n<\/ul>\n<h3 id=\"64\"><a id=\"64-判读\" aria-hidden=\"true\"><\/a>6.4 判读<\/h3>\n<p><strong>事实<\/strong>：长期路径（永住 / 归化 / 转职 / 数字化）存在，但本分野不能直接升 2 号；退出执行层已由 16 接入。\n<strong>⚠ 缺失<\/strong>：退出执行的具体金额 / 期限 / 要件待核验（16 登记册统一标「⚠ 待核实」）；年金 / 保险衔接的执行层待持续核实。<\/p>\n<hr />\n<h2 id=\"s7\"><a id=\"七暴露的缺失清单\" aria-hidden=\"true\"><\/a>七、暴露的缺失清单<\/h2>\n<p>按「决策价值 × 缺口完整度」排序，作为补缺触发依据：<\/p>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:20%\">优先级<\/th>\n<th style=\"width:20%\">缺失<\/th>\n<th style=\"width:20%\">覆盖问题<\/th>\n<th style=\"width:20%\">缺口证据<\/th>\n<th style=\"width:20%\">状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>P1<\/td>\n<td>在日生活实务与行政手续（14-life-operations）<\/td>\n<td>怎么去 / 去哪<\/td>\n<td>公共交通 / 通信 / 水电 / 银行 / 保证人无系统研究<\/td>\n<td>14 基线已建（2026-11-14），消费入口待登记册回写<\/td>\n<\/tr>\n<tr>\n<td>P1<\/td>\n<td>医疗 · 健康 · 心理（15-health-wellbeing）<\/td>\n<td>去哪 / 最坏怎么办<\/td>\n<td>心理 / 精神科 / 分娩 / 介護 / 医疗通译无系统研究<\/td>\n<td>15 基线已建（2026-11-14），消费入口待登记册回写<\/td>\n<\/tr>\n<tr>\n<td>已接入<\/td>\n<td>退出 · 转型 · 回国（16-exit-transition-return）<\/td>\n<td>最坏怎么办<\/td>\n<td>16 基线与初析已建；具体金额 / 期限 / 要件待核验<\/td>\n<td>已接入（登记册 v1.1）<\/td>\n<\/tr>\n<tr>\n<td>P2<\/td>\n<td>家族 · 育儿<\/td>\n<td>怎么去 / 去哪<\/td>\n<td>保育 / 分娩 / 園 / 国際結婚 / 相続无研究<\/td>\n<td>08 部分覆盖（家族滞在 / 资格外活動許可）<\/td>\n<\/tr>\n<tr>\n<td>P2<\/td>\n<td>防灾 · 安全 · 治安<\/td>\n<td>去哪<\/td>\n<td>自治体防灾渠道 / 避難 / 治安无系统覆盖<\/td>\n<td>12 / 13 部分覆盖（国家级渠道就绪）<\/td>\n<\/tr>\n<tr>\n<td>P3<\/td>\n<td>劳务输出与中介防骗<\/td>\n<td>怎么去<\/td>\n<td>01 仅追踪中介资质，无防骗专题<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>P3<\/td>\n<td>类别级补漏<\/td>\n<td>全部<\/td>\n<td>公共交通 / 通信 / 心理 / 年金脱退等词库缺口<\/td>\n<td>词库导入<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s8\"><a id=\"八数据可靠性与局限说明\" aria-hidden=\"true\"><\/a>八、数据可靠性与局限说明<\/h2>\n<h3 id=\"81\"><a id=\"81-核验程度分级\" aria-hidden=\"true\"><\/a>8.1 核验程度分级<\/h3>\n<ul>\n<li><strong>A 级（官方一手）<\/strong>：01 / 04 / 07 / 08 / 10 引用日本政府官方统计与政策页；13 引用厚生労働省 / 文部科学省统计。<\/li>\n<li><strong>B 级（权威机构转引）<\/strong>：全ト协工资调查（经 LogiShift）、外免切替合格率（经 drivey.jp）、SGHD 決算短信（release.tdnet.info）。<\/li>\n<li><strong>C 级（平台抽样）<\/strong>：求人样本（聚合平台转载，原企业页未逐一回溯）。<\/li>\n<\/ul>\n<h3 id=\"82\"><a id=\"82-已知口径冲突并列呈现不合并不取均值\" aria-hidden=\"true\"><\/a>8.2 已知口径冲突（并列呈现，不合并、不取均值）<\/h3>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:50%\">指标<\/th>\n<th style=\"width:50%\">并列口径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>受入上限<\/td>\n<td>22,100（2026-01-23 阁议，现行）≠ 24,500（ssw.go.jp 中文页未同步）<\/td>\n<\/tr>\n<tr>\n<td>司机缺口<\/td>\n<td>政策包 14% / 34% ≠ MLIT 再检证 7% / 25%<\/td>\n<\/tr>\n<tr>\n<td>工资<\/td>\n<td>厚労省毎月勤労統計（现金给与总额）≠ 全ト协「賃金・労働時間等の実態」（含赏与）<\/td>\n<\/tr>\n<tr>\n<td>运賃<\/td>\n<td>日銀 SPPI 道路貨物輸送 ≠ WebKit 運賃指数 ≠ 大分類「運輸・郵便」<\/td>\n<\/tr>\n<tr>\n<td>倒産<\/td>\n<td>帝国データバンク ≠ 東京商工リサーチ（定义・分類不同，不可相加）<\/td>\n<\/tr>\n<tr>\n<td>签证费<\/td>\n<td>円建（约 15,000 円）≠ 驻日领馆人民币口径（一次 715 元 / 二次・数次 1,430 元）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"83\"><a id=\"83-主要局限\" aria-hidden=\"true\"><\/a>8.3 主要局限<\/h3>\n<ol>\n<li>本主题不新增一手来源，结论完全依赖 01–13（及已接入的 16）的更新节奏；<\/li>\n<li>落地执行层、医疗两块虽有 14 / 15 基线，但本主题登记册消费入口尚未回写，问题 3、4、5 的判读完整度受限；<\/li>\n<li>个人定居地与个人情况（资金、家属、时 的决策支持层\n<strong>来源规则<\/strong>：本主题不新增一手来源，全部结论引用 01–13 主题报告 / 登记册；每个结论附「（来源：主题 NN）」标注<\/p><\/details><div class=\"diff-block diff-mod\"><span class=\"diff-badge\">已更新 · 修改<\/span><p><strong>版本<\/strong>：v1.0（首份季度复核）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）· 跨主题综合层\n<strong>受众定位<\/strong>：本人（拟通过特定技能签证赴日从事货运司机工作）的决策支持层\n<strong>来源规则<\/strong>：本主题不新增一手来源，全部结论引用 01–13 主题报告 / 登记册；每个结论附「（来源：主题 NN）」标注<\/p><\/div><hr><a href=\"#s1\">一、执行摘要（五问结论速览）<\/a><a href=\"#s2\">二、问题 1：去不去（值不值）<\/a><a href=\"#s3\">三、问题 2：能不能去（门槛）<\/a><a href=\"#s4\">四、问题 3：怎么去（路径）<\/a><a href=\"#s5\">五、问题 4：去哪（定居地）<\/a><a href=\"#s6\">六、问题 5：最坏怎么办（退出）<\/a><a href=\"#s7\">七、暴露的缺失清单<\/a><a href=\"#s8\">八、数据可靠性与局限说明<\/a><a href=\"#s9\">九、参考来源清单<\/a><h2 id=\"s1\"><a id=\"一执行摘要五问结论速览\" aria-hidden=\"true\"><\/a>一、执行摘要（五问结论速览）<\/h2><tr>\n<th style=\"width:20%\">#<\/th>\n<th style=\"width:20%\">决策问题<\/th>\n<th style=\"width:20%\">结论<\/th>\n<th style=\"width:20%\">置信度<\/th>\n<th style=\"width:20%\">缺失<\/th>\n<\/tr><tr>\n<td>1<\/td>\n<td>去不去（值不值）<\/td>\n<td>窗口已开、名额有限；收入高于全产业均值但绝对值偏低；自动驾驶暂不构成威胁<\/td>\n<td>事实 + 推断<\/td>\n<td>中国同岗到手对比<\/td>\n<\/tr><tr>\n<td>2<\/td>\n<td>能不能去（门槛）<\/td>\n<td>门槛明确；驾照转换与中国大陆无考点是两大瓶颈<\/td>\n<td>事实<\/td>\n<td>驾照转换流程细节<\/td>\n<\/tr><tr>\n<td>3<\/td>\n<td>怎么去（路径）<\/td>\n<td>路径清晰；中介风险与驾照耗时是关键变量<\/td>\n<td>事实 + 推断<\/td>\n<td>中介防骗、落地手续执行<\/td>\n<\/tr><tr>\n<td>4<\/td>\n<td>去哪（定居地）<\/td>\n<td>有 7 维框架可用；个人选择未记录<\/td>\n<td>框架就绪<\/td>\n<td>个人定居地<\/td>\n<\/tr><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><tr>\n<td>5<\/td>\n<td>最坏怎么办（退出）<\/td>\n<td>永住 / 归化路径存在；本分野不得 2 号；退出执行已由 16 接入<\/td>\n<td>部分事实<\/td>\n<td>退出执行金额 / 期限 / 要件<\/td>\n<\/tr><\/details><tr class=\"diff-mod\">\n<td><span class=\"diff-badge\">已更新 · 修改<\/span>5<\/td>\n<td>最坏怎么办（退出）<\/td>\n<td>永住 / 归化路径存在；本分野不得 2 号；退出执行未系统研究<\/td>\n<td>部分事实<\/td>\n<td>退出执行、年金脱退<\/td>\n<\/tr><p><strong>总体判读<\/strong>（条件化，非 Go/No-Go）：当前处于「窗口已开、门槛明确、路径清晰」阶段，主要不确定性集中在<strong>驾照转换成功率<\/strong>与<strong>落地执行层<\/strong>。若驾照能在窗口期内取得，且中介渠道可核验，则进入条件基本成立；反之应暂缓或做条件化安排。<\/p><details class=\"diff-del-group\"><summary>已更新 · 删除 16 处（点击展开）<\/summary><p><strong>五问间关系<\/strong>：问题 1 决定「值不值得考虑」；问题 2 决定「有没有资格」；问题 3 决定「怎么落地」；问题 4 决定「在哪里生活」；问题 5 决定「最坏情况的兜底」。前五问任一为「否 / 不确定」时，决策应暂缓或做条件化安排。<\/p><h3 id=\"0113\"><a id=\"来源主题结论索引0113\" aria-hidden=\"true\"><\/a>来源主题结论索引（01–13）<\/h3><tr>\n<th style=\"width:33%\">主题<\/th>\n<th style=\"width:33%\">本期关键结论<\/th>\n<th style=\"width:34%\">对应问题<\/th>\n<\/tr><tr>\n<td>01-ssw-driver<\/td>\n<td>受入上限 22,100；在留 843 人、充足率 3.8%；求人倍率 2.56；运输业月均现金给与 341,158 円；缺口 14%/34% 与 7%/25% 并列<\/td>\n<td>1 / 2 / 3<\/td>\n<\/tr><tr>\n<td>02-career-driver<\/td>\n<td>薪资须区分含赏与 / 不含赏与；时间外上限月 45h / 年 360h；特定技能专门中介 / 登录支援机关为主渠道<\/td>\n<td>1 / 3<\/td>\n<\/tr><tr>\n<td>03-career-management<\/td>\n<td>管理岗过渡主线为内部升格；资格 ≠ 岗位；48 个月分年计划<\/td>\n<td>5<\/td>\n<\/tr><tr>\n<td>04-industry-logistics<\/td>\n<td>「少数大手 + 海量零细」二元结构；自动化「干线先于末端、岗位重组而非消失」；SPPI 道路貨物 +4.6%<\/td>\n<td>1<\/td>\n<\/tr><tr>\n<td>05-industry-autonomous<\/td>\n<td>L4 制度化起步；2027 年度前对求职者实质就业影响约等于 0（推断）；中继输送催生新岗位<\/td>\n<td>1<\/td>\n<\/tr><tr>\n<td>06-industry-technology<\/td>\n<td>IT 人才缺口中位 2030 年约 45 万；数字化岗位薪资带高于物流同业；公司内转岗为首选<\/td>\n<td>5<\/td>\n<\/tr><tr>\n<td>07-economy-finance<\/td>\n<td>运输业月均 341,158 円；最低賃金 1,177 円；100 日元中间价 4.2355 元；CPI / 社保负担率待基线<\/td>\n<td>1 / 4 / 5<\/td>\n<\/tr><tr>\n<td>08-visa-immigration<\/td>\n<td>本分野不得 2 号；永住要件令和 8-10-01 改定；育成就劳 2027-04-01 施行、MOC 不含中国<\/td>\n<td>2 / 5<\/td>\n<\/tr><tr>\n<td>09-politics-law<\/td>\n<td>8 部法律栈；个人必熟 Top 5 条款；劳动纠纷维权五级阶梯<\/td>\n<td>3 / 5<\/td>\n<\/tr><tr>\n<td>10-education-qualification<\/td>\n<td>外免切替 2025-10 起严格化；教习所费用行情；资格地图待基线<\/td>\n<td>2<\/td>\n<\/tr><tr>\n<td>11-language-japanese<\/td>\n<td>中国大陆无 JFT-Basic 考点，主攻 JLPT N4（2027-07 目标）<\/td>\n<td>2<\/td>\n<\/tr><tr>\n<td>12-culture-life<\/td>\n<td>健保 / 国保两条轨道；窗口自付 3 割；UR 收入基准已确立；多语言防灾渠道<\/td>\n<td>4<\/td>\n<\/tr><tr>\n<td>13-regional-info<\/td>\n<td>7 维评分框架；病床 879,728；日语指导 84,759 / 外国籍 73,313；个 \/li><li>自动化：截至 2026-02 全国 <strong>10 カ所<\/strong>实现 L4 社会实装；2027 年度前对求职者实质就业影响约等于 0（推断）（来源：05）。<\/li><h3 id=\"24\"><a id=\"24-判读\" aria-hidden=\"true\"><\/a>2.4 判读<\/h3><p><strong>事实<\/strong>：窗口已开（充足率 3.8%、求人倍率 2.56），但名额口径存在 22,100 / 24,500 两组官方数字并存（来源：01 待复核）。收入高于全产业均值，但司机绝对收入仍偏低。\n<strong>推断<\/strong>：缺口与运賃传导决定雇主付费意愿，窗口期长度取决于缺口修正节奏；自动驾驶在 2027 年度前不构成实质就业威胁。\n<strong>⚠ 缺失<\/strong>：中国同岗到手收入对比（01 待复核）；生活成本细目（07 / 13 部分覆盖）。<\/p><hr><h2 id=\"s3\"><a id=\"三问题-2能不能去门槛\" aria-hidden=\"true\"><\/a>三、问题 2：能不能去（门槛）<\/h2><h3 id=\"31\"><a id=\"31-在留资格要件\" aria-hidden=\"true\"><\/a>3.1 在留资格要件<\/h3><li>特定技能 1 号「自動車運送業」分野；受入上限 <strong>22,100<\/strong>；<strong>本分野不得 2 号<\/strong>（来源：08 / 01 · ISA / MLIT）。<\/li><li>卡车 A2.2 不变；出租车 / 巴士区分 <strong>2027-04-01 起 COE 申请须 B1 相当以上<\/strong>（JLPT N3 以上 + CEFR B1 判定）（来源：01 · 令和 8 年 10 月 9 日改正）。<\/li><li>无健康检查义务、仅適性診断（来源：01）。<\/li><h3 id=\"32\"><a id=\"32-考试与考场\" aria-hidden=\"true\"><\/a>3.2 考试与考场<\/h3><li>ClassNK 技能試験 <strong>6,500 円<\/strong>（US$45、越南 US$50）、证明书 <strong>15,000 円<\/strong>；JFT-Basic <strong>10,000 円<\/strong>；JLPT N4 <strong>450 元<\/strong>（来源：01 · ClassNK / Prometric / JLPT）。<\/li><li>实施国 18，<strong>中国大陆无考点<\/strong>；中国考生实际路径为赴第三国考试或在日本国内受验（来源：01 · 2026-09 月报）。<\/li><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><li>日语路径：中国大陆无 JFT-Basic 考点，主攻 <strong>JLPT N4<\/strong>（目标 2027-07；每年 7 月 / 12 月两次）（来源：11）。<\/li><\/details><h3 id=\"33\"><a id=\"33-驾照转换\" aria-hidden=\"true\"><\/a>3.3 驾照转换<\/h3><li>外免切替 <strong>2025-10 起大幅严格化<\/strong>：知识确认合格率 <strong>42.8%<\/strong>、技能确认 <strong>13.1%<\/strong>（2025-10–12，警察庁，经 drivey.jp 转引）（来源：10 / 01）。<\/li><li>教习所费用：普通教习全国官方均价（AT 限定）<strong>324,381 円<\/strong>（総務省 2026-09）；MT 通学 <strong>30–40 万円<\/strong>；大型 <strong>25–28 万円<\/strong>（来源：10 / 01）。<\/li><h3 id=\"34\"><a id=\"34-判读\" aria-hidden=\"true\"><\/a>3.4 判读<\/h3><p><strong>事实<\/strong>：门槛明确，由「在留要件 + 考试 + 驾照 + 日语」四关构成；其中<strong>驾照转换成功率低<\/strong>（技能确认 13.1%）与<strong>中国大陆无考点<\/strong>是两大瓶颈。\n<strong>推断<\/stro t-transition-return.md\">16-exit-transition-return · 2026-11 月度报告<\/a> — 退出 / 转型 / 回国执行层<\/li><h3 id=\"_6\"><a id=\"本主题登记册\" aria-hidden=\"true\"><\/a>本主题登记册<\/h3><li><a href=\"../data/decision_hub_registry.md\">00-decision-hub · 指标登记册<\/a> — 五问指标状态 / 缺失清单 / 触发器状态<\/li><\/details><hr><details class=\"diff-del-group\"><summary>已更新 · 删除 1 处（点击展开）<\/summary><p>本报告为 v1.0（2026-11 月度），数据基准 2026-11-14。本主题不新增一手来源，所有结论引用来源主题；缺失项显式标记，待来源主题更新后增量复核。<\/p><\/details><div class=\"diff-block diff-mod\"><span class=\"diff-badge\">已更新 · 修改<\/span><p>本报告为 v1.0 首份季度复核，数据基准 2026-11-14。<\/p><\/div>", "stats": {"new": 19, "mod": 15, "del": 181, "equal": 71, "prev": 252}, "summary": "2026-12 期与 2026-11 期对比：新增 19 处、修改 15 处、删除 181 处，未变更 71 处。", "path": "00-decision-hub/reports/2026-12-decision-hub.html"}}}, "ssw-driver": {"name": "特定技能司机", "dir": "01-ssw-driver", "months": {"2026-11": {"title": "日本特定技能司机 · 2026-11 月度报告", "body": "\n<h1 id=\"2026-11\"><a id=\"日本特定技能司机--2026-11-月度报告\" aria-hidden=\"true\"><\/a>日本特定技能司机 · 2026-11 月度报告<\/h1>\n<blockquote>\n<p><strong>版本<\/strong>：v1.0（2026-11 月度）　<strong>数据基准日<\/strong>：2026-11-14\n<strong>主题类型<\/strong>：职业就业调研型（employment-research）\n<strong>受众定位<\/strong>：面向拟通过特定技能（SSW）签证赴日从事货运司机工作的读者，兼具行业监测与求职落地顾问视角。\n<strong>来源规则<\/strong>：日文官方一手 + 英文权威优先；中文来源仅作线索，引用须回溯日 / 英原文（中国侧国家统计局、外汇交易中心、驻日领馆费用页为项目指定例外，仅用于中国侧输入）。<\/p>\n<\/blockquote>\n<hr />\n<nav aria-label=\"报告导航\">\n<a href=\"#s1\">一、核心结论（摘要）<\/a>\n<a href=\"#s2\">二、行业与政策发展趋势<\/a>\n<a href=\"#s3\">三、人才供需与薪酬（核心模块）<\/a>\n<a href=\"#s4\">四、雇主与企业类型细分<\/a>\n<a href=\"#s5\">五、岗位技能要求<\/a>\n<a href=\"#s6\">六、行业认可的职业资质与证书<\/a>\n<a href=\"#s7\">七、就业落地路径建议（结论章）<\/a>\n<a href=\"#s8\">八、数据可靠性与局限说明<\/a>\n<a href=\"#s9\">九、参考来源清单<\/a>\n<\/nav>\n<h2 id=\"s1\"><a id=\"一核心结论摘要\" aria-hidden=\"true\"><\/a>一、核心结论（摘要）<\/h2>\n<p><strong>主题定义<\/strong>：特定技能「自動車運送業」分野（卡车 / 出租车 / 巴士运転者区分）的制度框架与在留路径、司机人才供需与薪资待遇、物流行业态势的指标面、L4 自动驾驶对司机岗位影响的结论面、就业落地路径。<\/p>\n<p><strong>监测边界<\/strong>：含本分野制度与要件、司机供需与薪酬、物流行业态势指标面、L4 结论面、就业落地路径；不含技能实习与其他分野在留资格（→ <a href=\"../../08-visa-immigration/reports/2026-11-visa-immigration.md\">08-visa-immigration<\/a>）、普通货运司机宏观行情与现场操作细节（→ <a href=\"../../02-career-driver/reports/2026-11-career-driver.md\">02-career-driver<\/a>）、行业结构与赛道（→ <a href=\"../../04-industry-logistics/reports/2026-11-industry-logistics.md\">04-industry-logistics<\/a>）、自动驾驶技术路线与法规（→ <a href=\"../../05-industry-autonomous/reports/2026-11-industry-autonomous.md\">05-industry-autonomous<\/a>）、法规条文解读（→ <a href=\"../../09-politics-law/reports/2026-11-politics-law.md\">09-politics-law<\/a>）。<\/p>\n<h3 id=\"_2\"><a id=\"数据变更摘要\" aria-hidden=\"true\"><\/a>数据变更摘要<\/h3>\n<blockquote>\n<p>本版为 2026-11 月度报告复用生成。登记册活值基准为 <strong>v2026.11.12_5<\/strong>（数据基准 2026-11-12），下表覆盖登记册全部 <strong>14 项追踪指标<\/strong>与 <strong>2 项交叉验证输入<\/strong>；未变动项注明「截至 2026-11-14 无更新」。<\/p>\n<\/blockquote>\n<table class=\"fixed\">\n<thead>\n<tr>\n<th style=\"width:25%\">#<\/th>\n<th style=\"width:25%\">指标<\/th>\n<th style=\"width:25%\">本版活值（来源 · 时点）<\/th>\n<th style=\"width:25%\">变更状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>特定技能在留者总数（分野别）<\/td>\n<td>自動車運送業 1 号 <strong>843 人<\/strong>（充足率 3.8%、年間増加 803）；SSW 1 号全体 438,128、2 号 23,348（ISA 统计月报，2026-08 末速报；ISA 2026-11-06 换版数据仍为 8 月末）<\/td>\n<td>无更新（截至 2026-11-14；表已换版、数据未换月）<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>「自動車運送業」分野要件<\/td>\n<td>受入上限 <strong>22,100<\/strong>（2026-01-23 阁议）；卡车 A2.2 不变；<strong>出租车 / 巴士区分 2027-04-01 起 COE 申请须 B1 相当以上<\/strong>（JLPT N3 以上＋CEFR B1 判定）；本分野不得 2 号；无健康检查义务、仅適性診断（令和 8 年 10 月 9 日一部改正）<\/td>\n<td>沿用 v2026.11.12_5 更新（改正＋适用时点）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>技能試験・日本語試験日程与费用<\/td>\n<td>ClassNK <strong>6,500 円<\/strong>（US$45、越南 US$50）、证明书 15,000 円；JFT-Basic <strong>10,000 円<\/strong>；JLPT N4 <strong>450 元<\/strong>；月报最新 2026-09（2026-10-15，实施国 18，中国大陆无考点）；<strong>2026-12 JLPT N1–N5 全等级报名截止前满员<\/strong>，官方引导转 JFT-Basic<\/td>\n<td>沿用 v2026.11.12_5 更新（N4 当期路径失效）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>司机缺口<\/td>\n<td>現狀 <strong>14%<\/strong>（14 万人相当 apan.go.jp/itpr_ja/11_000001_00633.html, 2026]<\/li>\n<li>「トラックドライバー不足実態調査」这一调查名<strong>不存在<\/strong>（mlit.go.jp 全站检索确认）；缺口精确值出自政策包配布资料与国交省检讨会中间总结（NX 总研试算）。[Source: https://www.mlit.go.jp/hakusyo/mlit/r06/hakusho/r07/html/n1112000.html, 2025]<\/li>\n<li>「日通司机加薪月最大 5 万円」<strong>无法溯源<\/strong>，降级为未证实；替代口径为 2024 年春斗日通トランスポート月薪 +5,624 円。[Source: https://www.nipponexpress-holdings.com/ja/news/press/?year=2024, 2024]<\/li>\n<li>SGHD 销售额 9,204 亿円的正确归属为 <strong>FY2027/3 上半期<\/strong>（2026.4–9，2026-11-06 发布，+17.6%）；FY2026/3 上半期为 7,825 亿円（+10.5%）。[Source: https://kabutan.jp/news/marketnews/?b=k202611060215, 2026]<\/li>\n<li>「ITJ 窗口 / GFP 官方支持机构」<strong>均无官方对应<\/strong>（ITJ 实为私人律所、GFP 为农林水产省出口项目缩写）；维权正确入口为厚労省体系。[Source: https://www.check-roudou.mhlw.go.jp/soudan/foreigner.html, 2026]<\/li>\n<li>JFT-Basic 受验费现行<strong>日本国内 10,000 円<\/strong>（含消费税相当额，因国而异），非「7,000 円（2023）」。[Source: https://www.prometric-jp.com/ssw/exam/fee/, 2026]<\/li>\n<li>本分野<strong>无健康检查义务<\/strong>：通读現行運用方針別紙 10 与運用要領确认无该条文；唯一健康相关项为出租车 / 巴士新任研修内的「適性診断」。[Source: https://www.moj.go.jp/isa/content/001473135.pdf, 2026]<\/li>\n<li>技能实习 2 号良好修了者的免试 / 免日语待遇官方口径为「当分の間…試験等を免除」，<strong>全文无「修了後 5 年以内」时限<\/strong>。[Source: https://www.moj.go.jp/isa/content/001434808.pdf, 2025]<\/li>\n<li>全ト协工资调查版本名应为<strong>「2025 年度版トラック運送事業の賃金・労働時間等の実態」<\/strong>（2026-07-01 公表），非「2026 年版」；全职务平均增速为 +5.3%（勿与男性司机 +4.1% 混淆）。[Source: https://jta.or.jp/member/chosa/chinginjittai2025.html, 2026]<\/li>\n<li>缺口不得再称「2030 年约 15 万人」——NX 总研调查间调整后推计为 <strong>2030 年度 162,912 人<\/strong>、2025 年度 <strong>110,809 人<\/strong>；「2040 年 35 万」无官方推计，34 万系 2030 年度 34% 运输力缺口的司机换算相当值。[Source: https://www.mlit.go.jp/seisakutokatsu/freight/content/001583917.pdf, 2022]<\/li>\n<li>不得引用「司机数 78 万→66 万」——政策包资料原文为：平成 28 年度营业用司机 <strong>83 万人<\/strong>、2019 年度全司机 <strong>86 万人<\/strong>。[Source: https://www.mlit.go.jp/seisakutokatsu/freight/content/001583917.pdf, 2022]<\/li>\n<li>政策包配布资料<strong>不含「充足率、49 岁以下占比」数字<\/strong>——配布资料仅为 14% / 34% 示意图。[Source: https://www.cas.go.jp/jp/seisaku/buturyu_kakushin/dai2/siryou.pdf, 2023]<\/li>\n<li>hajimen.com「普通 MT 全国平均 308,090 円」为 <strong>2015 年调查值<\/strong>（距基准日 11 年），不得作为现行均价引用。[Source: https://kurasim.com/blog/driving-school-cost-guide, 2026]<\/li>\n<li>求人样本「Mintoku Work（埼玉，月给 265,020 円）」编号误配——<strong>正确编号为 B00888<\/strong>（埼玉市浦和区）。[Source: https://mintoku.work/work/B00888, 2026]<\/li>\n<li>桑原服务（大阪茨木）转载值「36.5–40.5 万円」与官网不一致——<strong>官网采用页为月给 32–38 万円<\/strong>，引用以官网为准。[Source: https://kuwabaraservice.co.jp/recruit/, 2026]<\/li>\n<li>求人样本「东京台东区中型」经官网回溯修正——实为<strong>株式会社メジャーサービスジャパン<\/strong>关东多据点岗（genbars JOB 10151701），「台东区」标注未复现。[Source: https://en.genbars.jp/kanto/jobdetail/?id=10151701, 2026]<\/li>\n<li>「富山中越」定位含混作废——<strong>中越運送株式会社注册地为新潟市中央区<\/strong>，非富山企业。[Source: https://works.aqsh.co.jp/jobs/midcareer/15030-04340661, 2026]<\/li>\n<li>日语要件<strong>分区分化<\/strong>：卡车运転者区分维持 A2.2；出租车 / 巴士运転者区分自 <strong>2027-04-01 以后 COE 申请<\/strong>起须「日本語教育の参照枠 B1 相当以上」（JLPT N3 以上且被判定 CEFR B1；A2.2 仅限「非包车巴士＋B1 学习计划＋日语支援者同乘」等例外）。[Source: https://www.moj.go.jp/isa/03_00198.html, 2026]<\/li>\n<li>不得把「JLPT N4」当作 2026 年 12 月当期可报名路径——<strong>2026 年 12 月 JLPT N1–N5 全等级在报名截止前满员<\/strong>，出入国在留管理庁 2026-10-05 专页明确建议改考 JFT-Basic。[Source: https://www.moj.go.jp/isa/content/001471906.pdf, 2026]<\/li>\n<\/ol>\n<h3 id=\"_3\"><a id=\"核心判断\" aria-hidden=\"true\"><\/a>核心判断<\/h3>\n<ol>\n<li><strong>日语要件分区分化，卡车路径未变、出租 / 巴士路径收紧（制度级）<\/strong>：運用要領別冊（自動車運送業分野）于令和 8 年 10 月 9 日一部改正，ISA 2026-09-30 公布「B1 相当以上の確認開始時期」——卡车运転者区分仍为 A2.2（JFT-Basic A2.2 或 JLPT N4）；出租车 / 巴士运転者区分自 2027-04-01 以后的 COE 申请起须 B1 相当以上。对本项目受众（货运卡车）而言：<strong>短期门槛不变，但「先考 N4 再进日本」的旧叙事在出租 / 巴士旁路上已不可迁移<\/strong>；本分野仍不得接收 2 号。[Source: https://www.moj.go.jp/isa/03_00198.html, 2026; https://www.moj.go.jp/isa/content/001472534.pdf, 2026]<\/li>\n<li><strong>2026 年 12 月 JLPT 全等级满员，N4 当期路径实质关闭（可操作级）<\/strong>：出入国在留管理庁 2026-10-05 专页载明，令和 8 年 12 月考试的 N1–N5 全等级在报名受理期结束前即已截止，并建议改考 JFT-Basic（A2.2、A1 同样可用于特定技能 1 号与育成就労申请；日本国内基本 11 处、每月多次）。中国大陆考生的下一可用窗口从「2026-12 JLPT」改为「赴有考点国家 / 地区考 JFT-Basic」或「入境日本后受验」（推断）。[Source: https://www.moj.go.jp/isa/content/001471906.pdf, 2026; https://sswt-portal.classnk.or.jp/news/29, 2026]<\/li>\n<li><strong>在留者数据换版未换月<\/strong>：ISA 于 2026-11-06 更新「特定技能 1 号の分野ごとの受入れ見込数や在留者数等」，但表内基准仍为令和 8 年 8 月末——自動車運送業 1 号 843 人（充足率 3.8%、年間増加 803）、1 号全体 438,128 人、2 号 23,348 人；同表并列受入見込数 22,100（再次否定 24,500）。9 月末数据按更新节奏预计 12 月上旬随 10 月分公布（推断）。[Source: https://www.moj.go.jp/isa/content/001472175.pdf, 2026]<\/li>\n<li><strong>倒产侧出现「量减质紧」信号<\/strong>：2026 年 10 月全国倒产 TSR 934 件（-3.2%）、TDB 950 件（-1.6%），连续 2 个月同比下降；但 10 産業中運輸業 38 件（+2.7%）连续 2 个月同比增加，且 TSR「人手不足」関連倒产 50 件为 10 月单月最多、TDB 口径 56 件创历史新高——<strong>倒产总数下降与运输业 / 人手不足型倒产上升同时成立<\/strong>，指向中小运输事业者的经营压力未缓解（推断）。[Source: https://www.tsr-net.co.jp/news/status/detail/1203416_1610.html, 2026; https://www.tdb.co.jp/report/bankruptcy/aggregation/20261110-bankruptcy202610/, 2026]<\/li>\n<li><strong>适正化二法进入「施行后观察期」<\/strong>：二法 2025-06-11 公布，「公布后 1 年内」三项（白トラ利用的货主规制、委托次数努力义务、对货物利用运送事业者的准用）已于 2026-04-01 施行；[4] 许可更新制与 [5]「適正原価」下限规制（标准运赁随之废止）尚未施行。对司机薪资的传导仍属<strong>推断<\/strong>：制度提高货主侧合规成本，但截至本版无官方数据证明运賃→賃金的传导幅度。[Source: https://www.mlit.go.jp/jidosha/jidosha_mn4_000019.html, 2026]<\/li>\n<li><strong>工资与运价读数维持<\/strong>：運輸業・郵便業 2026-09 现金给与 341,158 円（+4.9%，未含年度赏与）；日銀 SPPI「道路貨物輸送」2026-09 +4.6%。两者均为名义值、口径不同（前者为就业者人均现金给与、后者为事业者间服务价格），不可直接相减或对比，仅可并列观察（推断：单位运价对工资的覆盖在边际上收紧）。[Source: https://www.mhlw.go.jp/toukei/itiran/roudou/monthly/r08/2609p/xls/2609c01p.xlsx, 2026; https://www.boj.or.jp/statistics/pi/cspi_release/sppi2609.pdf, 2026]<\/li>\n<li><strong>登録支援機関侧成本将上升（推断）<\/strong>：支援体制要件改正（2027-04-01 施行）要求按事业所选任常勤支援責任者·支援担当者、支援业务限定人员、支援責任者受讲养成讲习，并设「担当者数 &gt; 受托机关数÷10、&gt; 在支援人数÷50」的下限比例。推断：中小登録支援機関的固定人力成本上升，2–4 万円/人·月的行情存在上修压力；但截至基准日无公开涨价证据，维持原区间。[Source: https://www.moj.go.jp/isa/10_00263.html, 2026]<\/li>\n<li><strong>其余指标截至 2026-11-14 无更新，全部继承<\/strong>：缺口精确值、求人 9 样本、中国侧签证费与中介入口、教习费区间均继承上一版；L4 口径由无官方来源的「许可 12 件」更正为国交省官方「実装 10 カ所（2026-02 时点）」。<\/li>\n<\/ol>\n<h3 id=\"_4\"><a id=\"关键数字卡\" aria-hidden=\"t
