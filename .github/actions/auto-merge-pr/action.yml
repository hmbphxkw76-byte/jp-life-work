name: auto-merge-pr
description: >
  为自动化分支创建（或复用）PR 并启用免审批自动合并。
  仓库为纯个人项目，无第三方评审；质量唯一门是 CI（validate / audit），
  必需检查通过后由 GitHub 自动合并，未通过则保持打开（数据完整底线不变）。
inputs:
  branch:
    description: 已推送的 PR 头分支（为空则跳过，例如本轮无变更）
    required: false
    default: ''
  title:
    description: PR 标题
    required: true
  body:
    description: PR 正文
    required: false
    default: 由 jp-life-work CI 自动创建；必需检查（validate / audit）通过后自动合并。
  token:
    description: GitHub token（缺省 github.token）
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: 创建或复用 PR 并启用自动合并
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_BRANCH: ${{ inputs.branch }}
        PR_TITLE: ${{ inputs.title }}
        PR_BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        if [ -z "$PR_BRANCH" ]; then
          echo "无分支输出（本轮无变更或未提交），跳过 PR。"
          exit 0
        fi
        num="$(gh pr list --base main --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"
        if [ -z "$num" ]; then
          gh pr create --base main --head "$PR_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          num="$(gh pr list --base main --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"
        else
          echo "PR 已存在：#$num"
        fi
        if [ -z "$num" ]; then
          echo "::error::无法创建或定位 PR（分支 $PR_BRANCH）"
          exit 1
        fi
        if ! gh pr merge "$num" --auto --merge; then
          echo "::error::启用自动合并失败：请确认仓库已开启 allow_auto_merge，且 main 分支保护未强制人工评审"
          exit 1
        fi
        echo "PR #$num（$PR_BRANCH → main）已启用自动合并：validate / audit 通过后自动合入"
