# 定时维护：每月 1 日 00:15 UTC（= 09:15 JST）执行报告体系例行维护并提交生成物。
#
# 维护内容（均为幂等操作）：
#   1. 报告自动归位（classify_reports.py --apply）
#   2. 结构补全（ensure_region_topics.py）
#   3. 归档策略（archive_reports.py，按周期保留近 18 / 24 / 60 个自然月）
#   4. 生成全局索引（build_index.py → INDEX.md）
#   5. 重建汇总页（build_hub.py → index.html）
#   6. 决策支持件套刷新（personal_finance_model.py / pending_verification.py / fact_card_check.py --write）
#   7. 审计失效同步（audit_pipeline.py --sync：指纹失配 → stale）+ 标识同步（audit_badge.py --sync）
#   8. 跑契约测试（含流程复用一致性）确认无回归
#   9. 性能趋势快照（perf_snapshot.py → toolchain/perf-trend.json）
#  10. 记录自动化状态（automation_status.py record）
#  11. 提交并推送变更（无变更则跳过）
#
# 原 scheduled-update.yml（周期更新调度）已于 37c7a90 删除，本工作流为重建版，
# 只负责「维护生成物 + 结构」，不产出报告研究内容。
name: scheduled-maintenance

on:
  schedule:
    # 每月 1 日 00:15 UTC = 09:15 JST，避开整点高负载时段
    - cron: "15 0 1 * *"
  workflow_dispatch:

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 退出码约定：0=通过；1=错误（阻断）；2=警告（放行）
      - name: 报告自动归位（classify_reports.py --apply）
        run: |
          python engine/tools/classify_reports.py --apply || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::报告归位失败"
            exit 1
          fi
          echo "classify_reports.py 退出码 ${code:-0}"

      - name: 结构补全（ensure_region_topics.py）
        run: |
          python engine/tools/ensure_region_topics.py || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::结构补全失败"
            exit 1
          fi
          echo "ensure_region_topics.py 退出码 ${code:-0}"

      - name: 归档策略（archive_reports.py）
        run: python engine/tools/archive_reports.py

      - name: 生成全局索引（build_index.py）
        run: python engine/tools/build_index.py

      - name: 同步报告 HTML（md2html.py）
        run: python engine/tools/md2html.py

      - name: 重建汇总页（build_hub.py）
        run: python engine/tools/build_hub.py

      # ── 决策支持流程复用：刷新衍生件（与 validate.yml 门禁同一套工具）──
      - name: 刷新个人财务模型（personal_finance_model.py）
        run: python engine/tools/personal_finance_model.py

      - name: 刷新待核实闭环（pending_verification.py）
        run: python engine/tools/pending_verification.py

      - name: 刷新事实卡片校验报告（fact_card_check.py --write）
        run: python engine/tools/fact_card_check.py --write

      # 决策度量历史快照（P2-2）：追加一条指标序列，供跨月趋势对比。
      - name: 追加决策度量快照（decision_metrics.py --history）
        run: python engine/tools/decision_metrics.py --history

      # 反馈汇总（n20）：需求覆盖矩阵 + 缺失闭环率 + 决策引用，供人工复盘。
      - name: 反馈汇总（需求覆盖矩阵 + 决策度量趋势）
        run: |
          mkdir -p engine/report-audits/toolchain
          python engine/tools/update_planner.py --requirements > engine/report-audits/toolchain/requirements-matrix.md
          python engine/tools/decision_metrics.py --trend || true

      # 质量报告刷新（不入库，供人工查阅）：L5 证据元评估 / 反例扫描。
      - name: 刷新 L5 证据元评估（l5_meta_check.py）
        run: python engine/tools/l5_meta_check.py
      - name: 刷新反例扫描清单（counterexample_scan.py）
        run: python engine/tools/counterexample_scan.py

      - name: 审计失效同步（audit_pipeline.py --sync）
        run: python engine/tools/audit_pipeline.py --sync

      - name: 标识同步（audit_badge.py --sync）
        run: python engine/tools/audit_badge.py --sync

      # 全量自动验证（非变异）：V1–V5 逐报告校验，P0/P1 即失败；
      # --dry-run 只写 gitignored 运行日志，不回写报告、不改审计状态。
      - name: 全量自动验证（auto_verify.py --all --dry-run）
        run: |
          python engine/tools/auto_verify.py --all --dry-run --json > engine/report-audits/audit/verify/auto-verify-all.json || code=$?
          if [ "${code:-0}" -ne 0 ]; then
            echo "::error::自动验证存在 P0/P1（见 auto-verify.json）"
            exit 1
          fi
          echo "auto_verify.py 全量通过（P0/P1=0）"

      - name: 契约测试（确认维护无回归）
        run: python -m unittest discover -s engine/tests

      # 性能趋势快照（架构优化方向 D / I-13，N14）：规模 + 耗时（validate /
      # build_hub --check / build_index --check / md2html），追加基线 + 历史到
      # engine/report-audits/toolchain/perf-trend.json，供跨月趋势对比。
      - name: 性能趋势快照（perf_snapshot.py）
        run: python engine/tools/perf_snapshot.py

      - name: 记录自动化状态
        if: always()
        run: |
          RESULT="${{ job.status == 'success' && 'success' || 'failure' }}"
          python engine/tools/automation_status.py record \
            --phase maintenance --result "$RESULT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # 定时任务不再直推 main（W2 / R1）：提交后推自动分支并开 PR，保留 [automated] 标记。
      - name: 提交维护产物
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 定时维护（归位 / 归档 / 索引 / 汇总页同步）"
          BRANCH="auto/maintenance-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] 定时维护产物同步" \
            --body "由 .github/workflows/scheduled-maintenance.yml 自动提交（[automated] 标记，保留 github-actions[bot] 提交身份）。请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 失败补记：主提交步骤随 job 成功路径执行；job 失败时仍把本轮自动化状态入库，
      # 避免「记录了却因未提交而丢失」（与其余 4 条工作流的 always 提交口径一致）。
      - name: 提交自动化状态（失败补记）
        if: always()
        run: |
          if [ ! -f automation-status.json ]; then
            echo "无自动化状态文件（record 未执行），跳过补记"
            exit 0
          fi
          git add -A -- automation-status.json
          if git diff --cached --quiet; then
            echo "自动化状态无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 补记定时维护自动化状态"
          BRANCH="auto/maintenance-status-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] 补记定时维护自动化状态" \
            --body "由 scheduled-maintenance.yml 失败补记步骤自动提交（[automated] 标记）。请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
