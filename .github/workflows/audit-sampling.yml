# 月度审计抽检：每月 1 日 00:25 UTC（= 09:25 JST）执行分层抽检并提交报告。
# 紧随定时维护（00:15）之后；命中 P0/P1 即告警，不合格报告进入重新审计流程。
#
# 退出码：0=达到门槛；1=未达门槛（P0/P1 或合格率不足）；2=仅 P2。
name: audit-sampling

on:
  schedule:
    # 每月 1 日 00:25 UTC = 09:25 JST，避开整点高负载时段
    - cron: "25 0 1 * *"
  workflow_dispatch:

concurrency:
  group: audit-sampling
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 分层抽检（audit_sampling --apply）
        run: |
          python src/prompts-tools/tools/audit_sampling.py --apply || code=$?
          code=${code:-0}
          if [ "$code" -eq 1 ]; then
            echo "::error::抽检未达门槛（P0/P1 或合格率不足），不合格报告须重新审计"
            exit 1
          fi
          echo "audit_sampling 退出码 $code（2=仅 P2 放行）"

      - name: 提交抽检报告
        run: |
          git add -A -- src/report-audits/audit/sampling/
          if git diff --cached --quiet; then
            echo "抽检报告无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(audit): 月度分层抽检报告"
          git push
