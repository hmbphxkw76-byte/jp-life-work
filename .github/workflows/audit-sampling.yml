# 月度审计抽检：每月 1 日 01:15 UTC（= 10:15 JST）执行分层抽检并提交报告。
# 紧随定时维护（00:15）之后，与月度提醒（00:45）、流水线编排（01:45）错峰 ≥ 30 分钟；命中 P0/P1 即告警，不合格报告进入重新审计流程：
# audit_sampling --apply 内置 G→F 反馈链路（命中 P0/P1 → audit_pipeline 置 stale），
# 随后 audit_badge --sync 撤销「已审计」标识，报告须重走 submit → 初审 → 复核 → 终审。
#
# 退出码：0=达到门槛；1=未达门槛（P0/P1 或合格率不足）；2=仅 P2。
name: audit-sampling

on:
  schedule:
    # 每月 1 日 01:15 UTC = 10:15 JST，与 00:15 / 00:45 / 01:45 错峰 ≥ 30 分钟
    - cron: "15 1 1 * *"
  workflow_dispatch:

concurrency:
  group: audit-sampling
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 分层抽检（audit_sampling --apply）
        id: apply
        run: |
          python engine/tools/audit_sampling.py --apply || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::抽检未达门槛或命令异常（退出码 $code），不合格报告须重新审计"
            exit 1
          fi
          echo "audit_sampling 退出码 $code（2=仅 P2 放行）"

      # G→F：抽检命中 P0/P1 时 audit_sampling 已置 stale，此处撤销对应「已审计」标识。
      - name: 标识同步（audit_badge.py --sync）
        if: always()
        run: python engine/tools/audit_badge.py --sync

      - name: 记录自动化状态
        if: always()
        run: |
          RESULT="${{ job.status == 'success' && 'success' || 'failure' }}"
          python engine/tools/automation_status.py record \
            --phase audit-sampling --result "$RESULT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: 提交抽检报告与审计状态
        if: always()
        run: |
          git add -A -- ':(glob)**/reports/*.md' ':(glob)**/reports/*.html' \
            engine/report-audits/audit/ automation-status.json
          if git diff --cached --quiet; then
            echo "抽检报告无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(audit): 月度分层抽检报告（含不合格处置）"
          BRANCH="auto/audit-sampling-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] 月度分层抽检报告" \
            --body "由 .github/workflows/audit-sampling.yml 自动提交（[automated] 标记，保留 github-actions[bot] 提交身份）。请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
