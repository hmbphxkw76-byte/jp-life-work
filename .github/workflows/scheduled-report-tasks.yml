# 月度报告产出提醒：每月 1 日生成当月任务清单并开一个 GitHub Issue 作为提醒。
#
# 只负责「提醒 + 待办清单」，不产出报告研究内容——报告需人工/Agent 按各主题
# prompts/business-config.md 流程撰写。
#
# 流程：
#   1. 按当前 UTC 月份（或手动指定 --period）运行 update_planner.py 生成任务清单
#   2. 以 Issue 形式发布（标题含月份，正文含待办清单与命名规范提醒）
#   3. 记录自动化状态（automation_status.py record）并提交状态文件（推分支 + PR）
#
# 产出后：提交 reports/YYYY-MM-<slug>.md 并 push，html-sync 自动生成报告页 HTML
# （含跨月对比高亮）与汇总页；下期报告自动与本期比对并高亮「已更新」。
#
# 审计提醒：任务清单逐条标注审计状态，并汇总未审计报告；提交前必须完成
# audit_preflight → audit_check → audit_pipeline --submit，否则合并门禁
# audit_pipeline --gate 将拦截未审计的变更报告。
name: scheduled-report-tasks

on:
  schedule:
    # 每月 1 日 00:45 UTC = 09:45 JST，与定时维护（00:15）/ 抽检（01:15）/ 编排（01:45）错峰 ≥ 30 分钟
    - cron: "45 0 1 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "周期标识（YYYY-MM / YYYY-Qn / YYYY），缺省按当前 UTC 月份"
        required: false
        default: ""

concurrency:
  group: scheduled-report-tasks
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成月度任务清单
        id: plan
        run: |
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ]; then PERIOD=$(date -u +%Y-%m); fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          python engine/tools/update_planner.py --period "$PERIOD" > /tmp/tasks.md
          cat /tmp/tasks.md

      - name: 发布月度提醒 Issue
        run: |
          PERIOD="${{ steps.plan.outputs.period }}"
          # 用 Python 拼接正文，避免 shell 反引号 / 引号转义问题
          PERIOD="$PERIOD" python - <<'PY'
          import os
          from pathlib import Path

          period = os.environ["PERIOD"]
          tasks = Path("/tmp/tasks.md").read_text(encoding="utf-8").strip()
          lines = [
              f"## 本月报告产出任务清单（{period}）",
              "",
              "> 由 `.github/workflows/scheduled-report-tasks.yml` 自动生成（每月 1 日 00:20 UTC）。",
              f"> 命名规范：`reports/{period}-<slug>.md` + 同名 `.html`。",
              "",
              tasks,
              "",
              "---",
              "",
              "### 产出后",
              "1. 提交 md 源稿并 push → `html-sync` 自动生成报告页 HTML（含跨月对比高亮）与汇总页。",
              "2. 下期报告将与本期自动比对，新增 / 修改片段加「已更新」标记（报告页工具条可切换对照阅读）。",
              "3. 审计：提交前完成 `audit_preflight → audit_check → audit_pipeline --submit`；",
              "   合并门禁 `audit_pipeline --gate` 将拦截未审计的变更报告（见上方「审计提醒」）。",
              "",
              "完成后请关闭本 Issue。",
          ]
          Path("/tmp/issue-body.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          # 去重：当月已有未关闭的清单 Issue 时更新其正文，避免重复创建
          EXISTING=$(gh issue list --state open \
            --search "in:title 【月度报告产出】$PERIOD" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "当月清单 Issue 已存在：#$EXISTING，更新其正文（去重）"
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
            exit 0
          fi
          gh issue create \
            --title "【月度报告产出】$PERIOD 任务清单" \
            --body-file /tmp/issue-body.md

      - name: 记录自动化状态并提交
        if: always()
        run: |
          RESULT="${{ job.status == 'success' && 'success' || 'failure' }}"
          python engine/tools/automation_status.py record \
            --phase scheduled-report-tasks --result "$RESULT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git add -A -- automation-status.json
          if git diff --cached --quiet; then
            echo "自动化状态无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 记录月度提醒自动化状态"
          BRANCH="auto/report-tasks-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] 月度提醒自动化状态" \
            --body "由 .github/workflows/scheduled-report-tasks.yml 自动提交（[automated] 标记，保留 github-actions[bot] 提交身份）。请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
