# 审计门禁：PR 与 main 推送时执行「合并门禁 + 多层级校验」。
#
# 合并门禁（audit_pipeline --gate）统一入口，一次覆盖：
#   ① 台账哈希链完整性；② 登记册双向一致；③「已审计」标识一致；
#   ④ 受检报告（默认本次变更，--strict 全库）须 audited + 指纹匹配 + 有效 L5 证据。
# 未通过审计的变更报告一律阻断（退出码 1）。
#
# 退出码约定：0=通过；1=阻断（完整性问题 / 未通过审计 / P0 P1）；2=仅 P2（放行）。
# CI 判定：显式允许 {0,2}，其余非零（含参数错误、超时）一律阻断。
name: audit-gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: audit-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 统一合并门禁：完整性 + 变更报告审计状态（含 L5 证据）。
      - name: 合并门禁（audit_pipeline --gate）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > .changed-files
            gate_args="--changed .changed-files"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              gate_args="--strict"
            else
              git diff --name-only "$before" "${{ github.sha }}" > .changed-files
              gate_args="--changed .changed-files"
            fi
          fi
          echo "门禁参数：--gate $gate_args"
          python src/prompts-tools/tools/audit_pipeline.py --gate $gate_args || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::审计门禁阻断：存在未通过审计的变更报告或完整性问题（退出码 $code）"
            exit 1
          fi
          echo "audit_pipeline --gate 退出码 $code"

      # 全量多层级校验：当前存量报告 P0/P1=0；新增/变更报告引入 P0/P1 即阻断。
      - name: 多层级校验（audit_check --all）
        run: |
          python src/prompts-tools/tools/audit_check.py --all || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::存在 P0/P1 或命令异常，禁止合并（退出码 $code；见 src/report-audits/audit/audit-check-report.md）"
            exit 1
          fi
          echo "audit_check 退出码 $code（2=仅 P2 放行）"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
