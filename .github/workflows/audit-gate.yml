# 审计门禁：PR 与 main 推送时执行「合并门禁 + 多层级校验」。
#
# 合并门禁（audit_pipeline --gate）统一入口，一次覆盖：
#   ① 台账哈希链完整性；② 登记册双向一致；③「已审计」标识一致；
#   ④ 受检报告（默认本次变更，--strict 全库）须 audited + 指纹匹配 + 有效 L5 证据。
# 未通过审计的变更报告一律阻断（退出码 1）。
#
# 退出码约定：0=通过；1=阻断（完整性问题 / 未通过审计 / P0 P1）；2=仅 P2（放行）。
# CI 判定：显式允许 {0,2}，其余非零（含参数错误、超时）一律阻断。
name: audit-gate

on:
  push:
    branches: [main]
  pull_request:
    # 与 validate.yml 同口径：仅 main 方向 PR 触发审计门禁，避免非 main 目标分支误触发。
    branches: [main]

concurrency:
  group: audit-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 统一合并门禁：完整性 + 变更报告审计状态（含 L5 证据）。
      - name: 合并门禁（audit_pipeline --gate）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > .changed-files
            gate_args="--changed .changed-files"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              gate_args="--strict"
            else
              git diff --name-only "$before" "${{ github.sha }}" > .changed-files
              gate_args="--changed .changed-files"
            fi
          fi
          echo "门禁参数：--gate $gate_args"
          python engine/tools/audit_pipeline.py --gate $gate_args || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::审计门禁阻断：存在未通过审计的变更报告或完整性问题（退出码 $code）"
            exit 1
          fi
          echo "audit_pipeline --gate 退出码 $code"

      # 全库兜底（P1-5）：无论增量与否，对全库报告重跑审计状态校验
      # （audited + md/HTML 指纹 + 有效 L5 证据），防止存量报告漏检。
      - name: 全库审计兜底（audit_pipeline --gate --strict）
        run: |
          python engine/tools/audit_pipeline.py --gate --strict || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::全库审计兜底阻断：存在未通过审计的存量报告（退出码 $code）"
            exit 1
          fi
          echo "audit_pipeline --gate --strict 退出码 $code"

      # L5 证据元评估（P1-4）：覆盖率 / 合格率 / basis 缺失 / 依据充分度门槛，
      # 独立于抽检复用结论，直接解析全库 L5 证据。
      - name: L5 证据元评估（l5_meta_check）
        run: |
          python engine/tools/l5_meta_check.py --check || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::L5 证据元评估存在覆盖缺口 / 无效证据 / basis 缺失（退出码 $code）"
            exit 1
          fi
          echo "l5_meta_check 退出码 $code（2=仅告警）"

      # 词表变更审计指纹（n26）：词库内容哈希与基线失配 → 提示 sync_vocab + 刷新基线。
      - name: 词表指纹校验（vocab-hash --check）
        run: |
          python engine/vocabulary/script/vocab_tool.py vocab-hash --check || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::词表指纹基线缺失或校验失败（退出码 $code）"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::词库内容已变更（指纹失配）：请 sync_vocab 同步提示词并刷新 config/vocab-fingerprint.json"
          fi
          echo "vocab-hash 退出码 $code（2=失配告警）"

      # 全量多层级校验：当前存量报告 P0/P1=0；新增/变更报告引入 P0/P1 即阻断。
      - name: 多层级校验（audit_check --all）
        run: |
          python engine/tools/audit_check.py --all || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::存在 P0/P1 或命令异常，禁止合并（退出码 $code；见 engine/report-audits/audit/audit-check-report.md）"
            exit 1
          fi
          echo "audit_check 退出码 $code（2=仅 P2 放行）"

      # 无法核实内容硬门禁（默认全层零容忍，全库兜底）：与 validate.yml 同口径，
      # 在合并门禁处再拦一道，确保存量与变更报告的任何层级均无「无法核实」标记。
      # 策略文件的记录层豁免键仅在 --content-only 下生效；本处用 --all，故不豁免。
      - name: 无法核实内容门禁（verified_content_gate --all）
        run: |
          python engine/tools/verified_content_gate.py --all || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ]; then
            echo "::error::存在无法核实内容（待核实 / 未核实 / 需核实原文 / 待核验 / 待补来源），禁止合并（退出码 $code）"
            exit 1
          fi
          echo "verified_content_gate 退出码 $code（内容层零命中）"

      # 工具链变更双轴评审软门禁（TOOLCHAIN-DEV-SPEC 第七节；mainline 融合 P3，P2 软门禁）。
      # 变更涉及工具链代码（engine/tools/、engine/vocabulary/script/、engine/scripts/）时，
      # 要求 docs/toolchain/reviews/ 存在双轴评审报告；缺失仅告警不阻断（软门禁），
      # 由「工具链变更 100% 评审覆盖」纪律与守卫测试兜底。
      - name: 工具链评审软门禁（review_gate）
        run: |
          code=0
          if [ -f .changed-files ]; then
            python engine/tools/review_gate.py --changed .changed-files || code=$?
          else
            echo "无变更清单，跳过工具链评审软门禁"
          fi
          if [ "${code:-0}" -ne 0 ]; then
            echo "::warning::工具链变更缺少双轴评审报告（docs/toolchain/reviews/），请补 Standards / Spec 双轴评审"
          fi

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
