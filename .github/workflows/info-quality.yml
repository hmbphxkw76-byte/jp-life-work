# 信息质量周期性评估与闭环修复：每周一 02:20 UTC（= 11:20 JST）自动执行。
#
# 执行内容（对应 docs/信息质量评估提示词体系.md 全流程）：
#   1. info_quality_check.py --apply：全量评估 → 混乱识别分类 → 自动修复 → 复评验证
#   2. md2html.py：同步被修复报告的 HTML 交付物
#   3. 契约测试确认无回归
#   4. 存在 P0/P1 遗留时告警
#   5. 记录自动化状态（automation_status.py record）
#   6. 提交评估 / 修复 / 验证三清单（无变更则跳过）
#
# 退出码约定：0=通过（无 P0/P1 遗留）；1=存在 P0/P1 遗留（job 失败告警，需人工介入）；2=仅 P2。
name: info-quality

on:
  schedule:
    # 每周一 02:20 UTC = 11:20 JST，避开整点高负载时段
    - cron: "20 2 * * 1"
  workflow_dispatch:

concurrency:
  group: info-quality
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 退出码约定：0=通过；1=存在 P0/P1 遗留（需人工介入）；2=仅 P2 遗留（放行）
      - name: 信息质量全量评估 + 自动修复 + 复评
        id: assess
        run: |
          python engine/tools/info_quality_check.py --apply || code=$?
          code=${code:-0}
          echo "info_quality_check.py 退出码 ${code}"
          echo "$code" > /tmp/iqc_exit_code

      - name: 同步报告 HTML（md2html.py）
        run: python engine/tools/md2html.py

      - name: 契约测试（确认评估与修复无回归）
        run: python -m unittest discover -s engine/tests

      - name: 存在 P0/P1 遗留时告警
        run: |
          code=$(cat /tmp/iqc_exit_code)
          if [ "$code" -eq 1 ]; then
            echo "::error::信息质量评估存在 P0/P1 遗留，需人工介入（见 engine/report-audits/info-quality/）"
            exit 1
          fi

      - name: 记录自动化状态
        if: always()
        run: |
          RESULT="${{ job.status == 'success' && 'success' || 'failure' }}"
          python engine/tools/automation_status.py record \
            --phase info-quality --result "$RESULT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: 提交评估与修复产物
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 信息质量周期评估（自动修复 + 三清单）"
          BRANCH="auto/info-quality-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] 信息质量周期评估" \
            --body "由 .github/workflows/info-quality.yml 自动提交（[automated] 标记，保留 github-actions[bot] 提交身份）。请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
