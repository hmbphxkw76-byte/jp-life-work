# 信息质量周期性评估与闭环修复：每周一 02:20 UTC（= 11:20 JST）自动执行。
#
# 执行内容（对应《信息质量评估提示词体系.md》全流程）：
#   1. info_quality_check.py --apply：全量评估 → 混乱识别分类 → 自动修复 → 复评验证
#   2. md2html.py：同步被修复报告的 HTML 交付物
#   3. 契约测试确认无回归
#   4. 提交评估 / 修复 / 验证三份清单（无变更则跳过）
#
# 退出码约定：0=通过（无 P0/P1 遗留）；1=存在 P0/P1 遗留（job 失败告警，需人工介入）；2=仅 P2。
name: info-quality

on:
  schedule:
    # 每周一 02:20 UTC = 11:20 JST，避开整点高负载时段
    - cron: "20 2 * * 1"
  workflow_dispatch:

concurrency:
  group: info-quality
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 退出码约定：0=通过；1=存在 P0/P1 遗留（需人工介入）；2=仅 P2 遗留（放行）
      - name: 信息质量全量评估 + 自动修复 + 复评
        run: |
          python src/prompts-tools/tools/info_quality_check.py --apply || code=$?
          code=${code:-0}
          echo "info_quality_check.py 退出码 ${code}"
          echo "$code" > /tmp/iqc_exit_code

      - name: 同步报告 HTML（md2html.py）
        run: python src/prompts-tools/tools/md2html.py

      - name: 契约测试（确认评估与修复无回归）
        run: python -m unittest discover -s src/tests

      - name: 提交评估与修复产物
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 信息质量周期评估（自动修复 + 三清单）"
          git push

      - name: 存在 P0/P1 遗留时告警
        run: |
          code=$(cat /tmp/iqc_exit_code)
          if [ "$code" -eq 1 ]; then
            echo "::error::信息质量评估存在 P0/P1 遗留，需人工介入（见 src/report-audits/info-quality/）"
            exit 1
          fi
