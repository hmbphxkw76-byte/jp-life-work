# 规范校验门禁：PR 与 main 分支推送时自动运行规范校验 + 契约测试。
# 错误级违规（退出码 1）阻断合并；警告级（退出码 2）放行。
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉取完整历史——TestHistoricalMigration 需用 git 历史
      # 取出迁移前的旧报告，逐份复核内容零丢失（浅克隆取不到旧文件）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 契约测试（engine/tests）
        run: python -m unittest discover -s engine/tests -v

      # 各校验脚本退出码约定：0=通过；1=错误（阻断）；2=警告（放行）
      - name: 结构与规范校验（validate.py）
        run: |
          python engine/tools/validate.py || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::validate.py 存在错误级违规，阻断合并"
            exit 1
          fi
          echo "validate.py 退出码 ${code:-0}（0=通过，2=仅警告不阻断）"

      - name: 报告自动归位检查（classify_reports.py）
        run: |
          python engine/tools/classify_reports.py --check --unknown-warn || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::存在可自动归位的错位报告（本地运行 classify_reports.py --apply 修复后提交）"
            exit 1
          fi
          echo "classify_reports.py 退出码 ${code:-0}（2=存在需人工确认归属的报告，不阻断）"

      - name: 结构补全检查（ensure_region_topics.py --check）
        run: |
          python engine/tools/ensure_region_topics.py --check || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::结构补全检查失败"
            exit 1
          fi
          echo "ensure_region_topics.py 退出码 ${code:-0}（2=存在缺失项，由定时维护补齐，不阻断）"

      - name: 汇总页一致性校验（build_hub.py --check）
        run: |
          python engine/tools/build_hub.py --check || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::汇总页已过期（本地运行 build_hub.py 重新生成后提交）"
            exit 1
          fi
          echo "build_hub.py 退出码 ${code:-0}（汇总页缺失时 WARN 放行，由首次生成补建）"

      - name: 全局索引一致性校验（build_index.py --check）
        run: |
          python engine/tools/build_index.py --check || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::INDEX.md 已过期（本地运行 build_index.py 重新生成后提交）"
            exit 1
          fi
          echo "build_index.py 退出码 ${code:-0}（2=索引缺失，由定时维护生成）"

      # 新报告阻断级：期间 >= 2026-11 的报告 lint / 模板合规必须无错误项；
      # 历史报告由 --new-only 跳过，遗留项列入 lint-whitelist.json 豁免。
      - name: 报告内容 lint（新报告阻断）
        run: |
          python engine/tools/lint_reports.py --new-only || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::新报告 lint 存在错误项或命令异常，阻断合并（退出码 $code）"
            exit 1
          fi
          echo "lint_reports.py 退出码 $code（2=仅警告不阻断）"

      - name: 模板合规校验（新报告阻断）
        run: |
          python engine/tools/compliance_check.py --new-only || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::新报告模板合规存在错误项或命令异常，阻断合并（退出码 $code）"
            exit 1
          fi
          echo "compliance_check.py 退出码 $code（2=仅警告不阻断）"

      # 阶段闸（左移·资产层）：采集 / 筛选 / 分类三阶段出口检查；
      # 复用 info_quality_check 登记册解析与 _common 类型引用，退出码 1 阻断、2 放行。
      - name: 阶段闸检查（采集 / 筛选 / 分类左移）
        run: |
          python engine/tools/stage_gate_check.py || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::阶段闸存在 P0/P1（采集 / 筛选 / 分类层缺陷），阻断合并"
            exit 1
          fi
          echo "stage_gate_check.py 退出码 ${code:-0}（2=仅 P2 提示，不阻断）"

      # ── 决策支持 / 信息质量流程复用（DecisionSupport-Guard + InfoQuality-Guard）──
      # 以下为「刚优化的流程」在 PR 门禁阶段的复用：结构化免责声明、空模块占比、
      # 跨报告事实重复率、事实卡片五字段与指针、待核实闭环、个人财务模型一致性。
      - name: 信息质量全量检查（info_quality_check --check）
        run: |
          python engine/tools/info_quality_check.py --check || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::信息质量存在 P0/P1 遗留，阻断合并（见 engine/report-audits/info-quality/）"
            exit 1
          fi
          echo "info_quality_check.py 退出码 ${code:-0}（2=仅 P2 不阻断）"

      - name: 事实卡片校验（fact_card_check）
        run: |
          python engine/tools/fact_card_check.py || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::事实卡片五字段缺失或 [@FC-NNN] 指针失效，阻断合并"
            exit 1
          fi
          echo "fact_card_check.py 退出码 ${code:-0}（2=仅 P2 不阻断）"

      - name: 待核实项闭环检查（pending_verification --check）
        run: |
          python engine/tools/pending_verification.py --check || code=$?
          if [ "${code:-0}" -eq 1 ]; then
            echo "::error::存在未登记或已逾期的首轮核验项，阻断合并"
            exit 1
          fi
          echo "pending_verification.py 退出码 ${code:-0}（2=临近截止不阻断）"

      - name: 个人财务模型一致性（personal_finance_model --check）
        run: |
          python engine/tools/personal_finance_model.py --check || code=$?
          if [ "${code:-0}" -ne 0 ]; then
            echo "::error::个人财务模型缺失输入或已过期（须重跑 personal_finance_model.py 并提交），阻断合并（退出码 $code）"
            exit 1
          fi
          echo "personal_finance_model.py 退出码 ${code:-0}"

      # 词库校验：注册/目录结构（topic-check）+ 全主题结构（verify：重复 / 空值 / 分类 /
      # ID 前缀 / 条目数下限）+ 同步区间一致性（sync check：提示词区块与词库同步）。
      - name: 词库校验（topic-check / verify / sync check）
        run: |
          set +e
          python engine/vocabulary/script/vocab_tool.py topic-check; c1=$?
          python engine/vocabulary/script/vocab_tool.py verify; c2=$?
          python engine/vocabulary/script/sync_vocab.py check; c3=$?
          set -e
          # topic-check / verify：0/2 放行，1 阻断；sync check：存在待同步变更（2）也阻断
          for c in "$c1" "$c2"; do
            if [ "$c" -ne 0 ] && [ "$c" -ne 2 ]; then
              echo "::error::词库校验失败（退出码 $c）：topic-check / verify 存在错误级项"
              exit 1
            fi
          done
          if [ "$c3" -ne 0 ]; then
            echo "::error::词汇同步区间待更新（退出码 $c3）：运行 engine/vocabulary/script/sync_vocab.py sync 后提交"
            exit 1
          fi
          echo "词库校验通过（topic-check=$c1 verify=$c2 sync-check=$c3；2=仅警告不阻断）"

      # 静态检查（架构优化方向 E / ARCH-OPT）：warning 起步，不阻断存量
      - name: 安装开发依赖（ruff / mypy）
        run: pip install -r requirements-dev.txt
        continue-on-error: true
      - name: ruff 静态检查（warning 起步）
        run: python -m ruff check engine
        continue-on-error: true
      - name: mypy 静态检查（渐进式）
        run: python -m mypy engine/tools engine/vocabulary/script
        continue-on-error: true

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci

  # 覆盖率门禁（TOOLCHAIN-DEV-SPEC 第六节；mainline 融合 P1 / P3）。
  # 统计范围由 .coveragerc 限定工具链三目录；阈值 / 开关读 coverage-config.json 单一事实源，
  # 不在本脚本硬编码。enforce=true 时未达阈值退出码 1 → 阻断；enforce=false 时退出码 2 → 观察放行。
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 覆盖率门禁（工具链）
        run: |
          python engine/tools/coverage_gate.py || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::工具链覆盖率未达标或测试失败（退出码 $code），阻断合并"
            exit 1
          fi
          echo "coverage_gate 退出码 $code（0=达标，2=观察期未达标不阻断）"

      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci

  # 工作区卫生自检：先制造运行期残留（安装依赖 / 跑测试 / 造缓存与日志），
  # 再执行标准化清理，最后以 --check 断言零残留——验证清理链路自身有效，
  # 防止「清理规则失效」或「新增产物类型未纳入清理」静默退化。
  workspace-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 制造运行期残留（缓存 / 临时文件 / 日志）
        run: |
          python -m unittest discover -s engine/tests >/dev/null
          mkdir -p .pytest_cache engine/vocabulary/data/sync-backups
          printf 'residue\n' > engine/vocabulary/data/sync.log
          printf 'x' > engine/scripts/.DS_Store

      - name: 标准化清理
        uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci
          check-only: 'false'

      - name: 断言清理后零残留（--check）
        uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci
          check-only: 'true'
