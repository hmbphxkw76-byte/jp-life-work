name: 规范校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行规范校验
        run: |
          python prompts/tools/validate.py
          exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "::error::规范校验失败，存在错误项（见上方输出）"
            exit 1
          elif [ $exit_code -eq 2 ]; then
            echo "::warning::规范校验存在警告项（无错误，不阻断合并）"
            exit 0
          fi

      - name: 运行提示词契约测试
        run: python -m unittest discover -s prompts/tools/tests -p "test_*.py"
