name: HTML 同步

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9]-*/reports/*.md"
      - "prompts/schedule.json"
      - "prompts/tools/md2html.py"
      - "prompts/tools/build_library.py"
      - "requirements.txt"

permissions:
  contents: write
  issues: write

jobs:
  sync-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 安装依赖（最多重试 3 次）
        run: |
          for i in 1 2 3; do
            if pip install -r requirements.txt; then
              exit 0
            fi
            echo "pip 安装失败，第 $i 次重试…"
            sleep $((i * 5))
          done
          exit 1

      - name: 整理归档（保留策略）
        run: python prompts/tools/archive_reports.py

      - name: 重新生成 HTML
        run: python prompts/tools/md2html.py

      - name: 重新生成主题聚合页面
        run: python prompts/tools/build_library.py

      - name: 清理非 reports 目录的 HTML
        run: |
          find . -path ./01-ssw-driver/reviews -prune -o \
            -name "*.html" -print | grep -v "/reports/" | \
            grep -v "^\./updates\.html$" | \
            grep -v "^\./index\.html$" | \
            grep -v "^\./library\.html$" | xargs rm -f 2>/dev/null || true

      - name: 提交前规范校验
        env:
          VALIDATE_LOG: ${{ runner.temp }}/validate.log
        run: |
          set +e
          python prompts/tools/validate.py > "$VALIDATE_LOG" 2>&1
          code=$?
          set -e
          cat "$VALIDATE_LOG"
          if [ "$code" -eq 1 ]; then
            echo "::error::规范校验存在错误，已阻止自动提交；请修复后重试"
            exit 1
          fi
          exit 0

      - name: 检查变更并提交（推送失败重试 3 次）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "HTML 已是最新，无需提交"
            exit 0
          fi
          git commit -m "chore: 自动归档并同步 HTML（由 CI 生成）"
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败，第 $i 次重试…"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          exit 1

      - name: 失败告警（P1，内容收口链路）
        if: failure()
        env:
          DETAIL_FILE: ${{ runner.temp }}/validate.log
        run: |
          ARGS=(--kind finalize --severity p1 --title "[告警][P1] 内容收口失败" \
            --reason "内容更新后的归档/HTML/校验链路失败（job: ${{ github.job }}）")
          if [ -f "$DETAIL_FILE" ]; then
            ARGS+=(--detail-file "$DETAIL_FILE")
          fi
          python prompts/tools/update_scheduler.py alert "${ARGS[@]}"

      - name: 恢复回执
        if: success()
        run: |
          python prompts/tools/update_scheduler.py alert --recovered \
            --title "[告警][P1] 内容收口失败"
