# HTML 同步：报告 md 源变更时自动重新生成同名自包含 HTML（含跨月对比高亮）、重建汇总页并提交。
# 发布前先过「生成前信息核验（闸0）+ 无法核实内容硬门禁」，未通过不得生成 / 发布。
name: html-sync

on:
  push:
    branches: [main]
    paths:
      - '**/reports/*.md'
      - 'engine/tools/build_hub.py'
      - 'engine/tools/md2html.py'
      - 'engine/tools/report_diff.py'
      # build_hub 的其它输入：主题注册表 / 类型注册表 / 词库词条 / 检索问题索引
      # 变更时 index.html 与 search-index.json 会过期，需一并重建。
      - 'engine/vocabulary/config/topics.json'
      - 'engine/report_templates/template-registry.md'
      - 'engine/vocabulary/data/**/terms.md'
      - 'engine/search/**'
  workflow_dispatch:

concurrency:
  group: html-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 阶段前置：清理 runner 工作区残留（缓存 / 临时文件），保证各阶段起点干净。
      - uses: ./.github/actions/workspace-cleanup
        with:
          mode: ci

      # 依赖缓存（W2 / R5）：key 随 requirements 变更，命中即跳过 pip 下载。
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 发布前信息核验（闸0 + 无法核实内容硬门禁）：未通过（P0/P1 或无法核实内容）
      # 即失败，不再生成 / 发布 HTML，确保未核验信息不得呈现在报告中。
      - uses: ./.github/actions/content-verify

      # md2html 在构建期预渲染跨月对比高亮并写入报告页，报告变更后必须同步重建。
      - name: 重新生成报告 HTML（md2html.py）
        run: python engine/tools/md2html.py

      - name: 重建汇总页（build_hub.py）
        run: python engine/tools/build_hub.py

      # 内容变更后：指纹失配 → 审计失效（stale），并撤销「已审计」标识。
      - name: 审计失效同步（audit_pipeline.py --sync）
        run: python engine/tools/audit_pipeline.py --sync

      # HTML 是 md 的确定性派生物：md 内容未变、仅渲染漂移的失效报告重新绑定，不撤销审计。
      - name: 渲染漂移重新绑定（audit_pipeline.py --rebind）
        run: python engine/tools/audit_pipeline.py --rebind

      - name: 标识同步（audit_badge.py --sync）
        run: python engine/tools/audit_badge.py --sync

      - name: 记录自动化状态
        if: always()
        run: |
          RESULT="${{ job.status == 'success' && 'success' || 'failure' }}"
          python engine/tools/automation_status.py record \
            --phase html-sync --result "$RESULT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: 提交 HTML 与汇总页更新（推分支 + 开 PR）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A -- ':(glob)**/reports/*.html' index.html search-index.json \
            engine/report-audits/audit/ automation-status.json
          if git diff --cached --quiet; then
            echo "HTML 与汇总页均一致，无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: html-sync 同步报告 HTML 与汇总页"
          BRANCH="auto/html-sync-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[automated] html-sync 同步报告 HTML 与汇总页" \
            --body "由 .github/workflows/html-sync.yml 自动提交（[automated] 标记，保留 github-actions[bot] 提交身份）。HTML 为 md 的确定性派生物，请评审后合并。" \
            || echo "::warning::PR 创建失败（可能已存在），请人工确认"

      # 阶段收尾：无论成败清理缓存、临时产物与 pip 缓存，保证流水线结束后无残留。
      - uses: ./.github/actions/workspace-cleanup
        if: always()
        with:
          mode: ci
