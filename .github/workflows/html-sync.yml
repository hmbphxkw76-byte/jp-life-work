# HTML 同步：报告 md 源变更时自动重新生成同名自包含 HTML（含跨月对比高亮）、重建汇总页并提交。
name: html-sync

on:
  push:
    branches: [main]
    paths:
      - '**/reports/*.md'
      - 'src/prompts-tools/tools/build_hub.py'
      - 'src/prompts-tools/tools/md2html.py'
      - 'src/prompts-tools/tools/report_diff.py'
      # build_hub 的其它输入：主题注册表 / 类型注册表 / 词库词条 / 检索问题索引
      # 变更时 index.html 与 search-index.json 会过期，需一并重建。
      - 'src/vocabulary/config/topics.json'
      - 'src/report_templates/template-registry.md'
      - 'src/vocabulary/data/**/terms.md'
      - 'src/search/**'
  workflow_dispatch:

concurrency:
  group: html-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # md2html 在构建期预渲染跨月对比高亮并写入报告页，报告变更后必须同步重建。
      - name: 重新生成报告 HTML（md2html.py）
        run: python src/prompts-tools/tools/md2html.py

      - name: 重建汇总页（build_hub.py）
        run: python src/prompts-tools/tools/build_hub.py

      # 内容变更后：指纹失配 → 审计失效（stale），并撤销「已审计」标识。
      - name: 审计失效同步（audit_pipeline.py --sync）
        run: python src/prompts-tools/tools/audit_pipeline.py --sync

      # HTML 是 md 的确定性派生物：md 内容未变、仅渲染漂移的失效报告重新绑定，不撤销审计。
      - name: 渲染漂移重新绑定（audit_pipeline.py --rebind）
        run: python src/prompts-tools/tools/audit_pipeline.py --rebind

      - name: 标识同步（audit_badge.py --sync）
        run: python src/prompts-tools/tools/audit_badge.py --sync

      - name: 提交 HTML 与汇总页更新
        run: |
          git add -A -- ':(glob)**/reports/*.html' index.html search-index.json src/report-audits/audit/
          if git diff --cached --quiet; then
            echo "HTML 与汇总页均一致，无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: html-sync 同步报告 HTML 与汇总页"
          git push
