# HTML 同步：报告 md 源变更时自动重新生成同名自包含 HTML（含跨月对比高亮）、重建汇总页并提交。
name: html-sync

on:
  push:
    branches: [main]
    paths:
      - '**/reports/*.md'
      - 'src/prompts-tools/tools/build_hub.py'
      - 'src/prompts-tools/tools/md2html.py'
      - 'src/prompts-tools/tools/report_diff.py'
  workflow_dispatch:

concurrency:
  group: html-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # md2html 在构建期预渲染跨月对比高亮并写入报告页，报告变更后必须同步重建。
      - name: 重新生成报告 HTML（md2html.py）
        run: python src/prompts-tools/tools/md2html.py

      - name: 重建汇总页（build_hub.py）
        run: python src/prompts-tools/tools/build_hub.py

      - name: 提交 HTML 与汇总页更新
        run: |
          git add -A -- ':(glob)**/reports/*.html' index.html
          if git diff --cached --quiet; then
            echo "HTML 与汇总页均一致，无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: html-sync 同步报告 HTML 与汇总页"
          git push
