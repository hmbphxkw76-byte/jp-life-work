# ruff 配置（架构优化方向 E / I-7；2026-11-19 存量清零复核）。
#
# 存量清理（N11）：138 项 → 0。
#   - 100 项经 `--fix` / `--fix --unsafe-fixes` 自动修复；
#   - 38 项人工修复（E741 / SIM117 / B904 / E702 / SIM102 / UP031 / E402 等），
#     均为行为等价重构，未经测试等价性验证（unittest 978 OK / mypy 0 / validate 0）；
#   - 无显式忽略存量；仅保留 E501（行宽由格式化与评审兜底）。
# 复核日期：2026-11-19；后续新增违规按「不新增」口径在评审中处理。
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[lint.per-file-ignores]
"engine/tests/*" = ["B"]
